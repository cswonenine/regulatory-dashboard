, "2026-11-02": [{"source": "KRX_OPEN2", "title": "저PBR기업 최초 선정 및 공표", "department": "", "date": "2026-11-02", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115868", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "금융정보분석원, 국제자금세탁방지기구(FATF) 총회 참석", "department": "금융정보분석원  기획행정실", "date": "2026-11-02", "url": "https://www.fsc.go.kr/no010101/88048", "summary": "금융정보분석원, 국제자금세탁방지기구(FATF) 총회 참석 ◇ FATF는 신임의장 자일스 톰슨 (Mr. Giles Thomson, 영국) 이 처음 주재하는 제35기 1차 총회 를 프랑스 파리 OECD 본부에서 개최 하였음 ㆁ 사기, 스캠, 제재 회피 등 다양한 불법적 목적으로 범죄 조직망 의 가상자산 악용에 대응 하여 가상자산 부문 에 대한 FATF 기준의 전세계적 이행 격차 해소 를 위한 새로운 집중 점검 작업 * 승인 * FATF 권고 15(가상자산 거래 트래블룰 적용, AML 감독 등) 이행 점검 및 후속 조치 ㆁ FATF의 거시적인 사기범죄 대응 로드맵 의 첫 단계로서 전세계에 가장 빠르게 확산 되고 있는 조직범죄 유형 인 스캠 단지와 연계된 금융 흐름 의 시작부터 끝까지 전 과정 을 철저히 살펴보는 신규 보고서 채택 ㆁ 국제기준 미이행국인 북한·이란·미얀마 의 고위험국가 지위 유지 및 콩고 민주공화국·코트디부아르·불가리아·모나코 의 강화된 관찰대상국 지위 해제 ㆁ 미국과 멕시코 의 자금세탁, 테러자금조달, 확산금융 방지 조치의 효과성 과 FATF 권고 이행 을 평가한 상호평가보고서 를 논의·채택 - 회원국들은 논의 과정에서 변호사·회계사 등 특정비금융사업자 (DNFBPs) 에 대한 자금세탁방지 의무 부과 및 감독 , 법인 실소유자 (Beneficial Owner) 정보의 수집·관리·활용 을 통한 범죄 대응·예방의 중요성을 재확인 ◇ 이형주 금융정보분석원장 은 FATF 운영위원회 (steering committee) 회의에 참석 하여 금번 총회의 주요 의제 에 대해 다양한 의견 을 교환 ㆁ 글로벌 사기 대응 역량강화 및 초국경 조직범죄 대응 의 실질적 방안으로서 민관 협력 및 정보공유 확대 등에 대해 한국의 제도적·실무적 경험 공유 금 융위원회 금융정보분석원 등 5개 기관 (수석대표: 이형주 금융정보분석원장 이하, 법무부, 외교부, 금감원, 금융연구원 등) 은 프랑스 파리 OECD 본부에서 개최 된 제35기 1차 국제자금세탁방지기구 (FATF) * 총회 (10.26일~10.30일) 에 참석 했다고 밝혔다 . ** F inancial A ction T ask F orce : ’89년 설립된 자금세탁 방지(AML)·테러자금조달 금지 (CFT) 를 목적으로 하는 국제기구로, 40개 회원(韓 ·美·中·日 등 38개국과 EC 등 국제기구)으로 구 성 금 번 총회 에는 200여 개 글로벌 네트워크 회원국 과 국제기구 옵저버들이 참여하여 전세계 금융 건전성과 안보를 위협 하는 가상자산, 사기, 스캠 단지 등 진화하는 금융범죄에 대해 논의 하고, 불 법 금융에 맞선 전 세계적 노력을 강화하기 위한 전략적 이니셔티브 가 합의되었다. [글로벌 대응 강화를 위한 전략적 이니셔티브] \u003c ➊ 가상자산 부문에 대한 FATF 기준의 전세계적 이행 가속화 > 최근 범죄조직 이 사기, 스캠, 제재 회피 , 자금세탁 및 테러자금조달 등 다양한 불법 행위 에 가상자산을 악용 하는 사례가 증가함에 따라, FATF는 가상자산과 가상자산사업자 에 대한 국제기준 이행 격차를 해소 하기 위한 집중 분석 보고서 작성 에 착수하고 후속점검 절차를 가속화 하기로 하였다. 본 집중 분석 보고서는 가상자산 부문 에서 실질적으로 중요한 규모 를 보유 하고 있으면서 관련 국제기준 이행 에 확인된 미흡 사항이 있는 국가 를 중점적으로 분석 할 예정이다. 또한 가상자산 으로 인한 위협의 심각성과 시급성 을 고려하여 지난 4차 라운드 에서 FATF 기준권고 15 (트래블룰 이행/ 감독 등 AML 의무) 에 근거한 법제 도입 및 법제 운영성과 를 공식적으로 평가받지 않은 FATF 회원국들도 자국의 기준이행 현황을 보고 하게 될 것이다. 이러한 집중 분석 결과 는 2027년 6월 FATF 총회에서 공식 발표 될 계획 으로, FATF는 분석 결과 가상자산 부문의 전략적 결함 이 확인된 국가들 과 지속적으로 소통하고 교육 및 역량강화 프로그램 을 추진하는 등 가상자산 부문 의 국제기준 이행 을 지원할 방침이다. 우리나라는 FATF 제4차 상호평가 에서 권고 15 (가상자산 부문) 에 대해 평가받지 않은 국가 로서, 이번 집중 분석을 통해 가상자산 및 가상자산사업자 부문의 국제기준 이행 현황 을 보고하고 점검 받게 될 예정이다. 이번 점검이 그간 우리나라 가 운영해 온 가상 자산 관련 자금세탁방지 제도의 이행 수준 과 실질적인 운영 성과를 종합적 으로 점검 할 수 있는 기회가 될 것인 바, 이를 활용하여 법제 운영의 효과성 을 면밀히 검토·보완 함으로써 향후 제5차 상호평가 에 선제적으로 대비 해 나갈 계획이다. \u003c ➋ 스캠 단지와 연계된 불법 금융 흐름 차단 > FATF는 글로벌 차원 의 사기범죄 대응 로드맵 을 추진하기 위한 첫 번째 주요 조치 로, 전 세계적으로 빠르게 확산 하고 있는 스캠 단지와 연계된 불법 금융 흐름 을 종합적으로 분석 한 신규 보고서를 채택 하였다. 이번 보고서 는 FATF 글로벌 네트워크를 통해 확보한 각국의 실무 경험 과 대응 사례 를 바탕으로, 스캠 단지 를 뒷받침하는 국제 범죄 네트워크의 자금 조달 및 이동 구조를 분석 하고, 범죄조직 이 활용하는 통합적인 사업 모델 과 전문화된 범죄 서비스 (Crime as a service) 에 대한 대응 방안을 제시 하고 있다. 특히 각국이 스캠 단지 와 관련된 불법 자금의 형성 부터 이동 및 활용 에 이르는 전 과정을 파악 하고, 범죄 네트워크 를 효과적으로 차단할 수 있도록 실질적인 정책적·실무적 대응 방향 을 제공 할 것으로 기대된다. 우리나라 는 동 보고서 작성 과정에서 최근 국내에서 증가 하고 있는 신종 스캠 범죄 의 다양한 유형과 범죄수법 , 관련 자금흐름 및 대응 사례 를 공유 하였다. 특히, 범죄 의심거래 에 대한 신속한 거래정지 등 피해 예방 조치와 금융·통신·수사기관 간 정보공유·분석 플랫폼 (ASAP) 을 통한 범정부 차원의 협력체계 를 상세히 소개함으로써, 사기범죄에 대응 하기 위한 우리나라의 제도적·기술적 경험 을 회원국들과 공유하였다. 이번 기회를 통해 소개된 우리나라 의 보이스피싱 및 신종스캠 대응 경험 이 국제적인 정책 논 의와 모범사례 확산에 기여 하는 한편, 향후 각국이 범죄자금의 신속한 탐지 · 동결 및 추적 을 위한 협력체계를 강화 하는 데에도 참고가 될 것으로 기대된다. \u003c ➌ 사기에 대한 대응 강화를 위한 추가 작업 > FATF는 2026년 4월 FATF 장관 선언 에 따라 회원국들이 사기범죄 대응 을 위한 FATF 기준 등 다양한 수단 및 역량 을 적극적으로 활용하는 방안을 검토 하고 있으며, 이번 스캠 단지 관련 보고서 에서 도출된 분석 결과와 정책적 제언 을 향후 사기대응 업무의 후속 조치에 반영 할 예정이다. 특히 회원국들은 사기범죄 연구 보고서를 통해 확인된 국제 범죄 네트워크의 초국경적 특성 과 범죄자금 이동 구조 를 고려할 때, 개별 국가의 대응 만으로는 범죄조직 을 효과적으로 차단하는 데 한계 가 있다는 점에 주목하고, 국가 간 정보공유 와 국제공조의 중요성 을 강조하였다. 아울러 전 세계 모든 국가가 사기범죄 예방과 대응 을 위한 가장 기본적 이고 핵심적인 범 글로벌적 수단 인 FATF 기준을 충실히 이행 해야 한다는 데 공감 하였다 . 특히 금융회사와 가상자산사업자 (VASP) 등 범죄자금의 이동에 활용 될 수 있는 다양한 금융·비금융 부문 에 대한 모니터링을 강화 하고, 의심 거래 탐지 부터 자금 추적·동결 및 범죄수익 환수 에 이르는 전 과정에서 협력과 대응 역량을 제고 할 필요성이 강조되었다 . [FATF 국제기준 미이행국에 대한 제재] FATF는 매 총회 마다 각 국의 국제기준 이행 상황 을 평가하고, ➊ 중대한 결함이 있어 ‘ 조치를 요하는 고위험 국가 (Black List: 대응조치 대상 과 강화된 고 객확인 대상 으로 분류) ’와 ➋ 제도의 결함 을 치유 중인 ‘ 강화된 관찰대상 국가 ( Grey List ) ’의 명단을 공개 하고 있다. 회원국들은 지난 6월 총회와 동일하게 이란 과 북한 은 ‘ 조치를 요하는 고위험 국가 ( 대응조치 대상 ) ’ 지위 를, 미얀마 는 ‘ 조치를 요하는 고위험 국가 ( 강화된 고객 확 인 ) ’ 지위 를 유지 하기로 하였고, ‘ 강화된 관찰대상 국가 ’의 경우, 기존 22개국 중 4개국 (콩고민주공화국, 코트디부아르, 불가리아, 모나코 ) 을 제외 한 18개국 * 이 명단에 올랐다. \u003c 국제기준 미이행 국가에 대한 조치 및 해당 국가 > 종 류 내 용 국가 ➊ 조치를 요하는 고위험 국가 대응조치 (Counter-measure) 해당 국가에 금융회사 설립 금지, 해당 국가 와의 금융거래 제한 등 적극적 대응 조치 필요 이란 북한 강화된 고객확인 (Enhanced due diligence) 자 금세탁방지제도에 결함이 있어 해당국가 와의 거래시 강화된 고객확인 등 특별한 주의 필요 미얀마 ➋ 강화된 관찰 대상 국가 자금세탁방지제도의 결함을 치유 중인 국가 18개국 * * (현행유지) 볼리비아, 영국령 버진제도, 카메룬, 아이티, 케냐, 남수단 , 시리아, 베네수엘라, 베트남, 예멘 , 앙골라, 레바논, 라오스 , 네팔, 쿠웨이트, 파푸아뉴기니, 이라크, 보스니아·헤르체고비아 [FATF 회원국들의 제5차 상호평가보고서 채택] FATF는 미국과 멕시코 의 자금세탁, 테러자금조달, 확산금융 방지 조치의 효과성과 FATF 기준 이행을 평가한 상호평가보고서를 채택 (‘26.12월 공개 예정) 하였다 . 회원국들의 상호평가 결과 는 국제기준 이행 수준과 제도적 미비점에 대한 FATF의 평가 방향 및 중점 검토사항을 파악 할 수 있다는 점에서 제5차 상호평가 를 앞둔 우리나라에도 중요한 참고자료 가 될 것이다 . 특히 이번 총회의 상호평가 보고서 논의 에서 회원국들은 자금세탁 범죄 수법이 갈수록 진화하는 위험 환경을 실질적으로 확인하였고, 금융회사 중심 의 자금세탁방지 (AML) 체계를 넘어 변호사·회계사 등 특정비금융사업자 (DNFBPs) 에 대한 자금세탁방지 의무 부과 및 감독 , 법인 실소유자 (Beneficial Owner) 정보의 수집·관리·활용 을 통한 범죄 대응·예방의 중요성을 재확인 하였다. 아직 비금융 전문직 및 법인 실소유자 관리 를 위한 법적 기반이 충분히 정비되지 않은 우리나라도 제5차 상호평가에 앞서 관련 법률 및 하위규정 정비, 감독·검사체계 구축 등 핵심 과제 를 조속히 추진 할 필요가 있다. [FATF 운영위원회 참여 성과] 이형주 금융정보분석원장 은 파리 영국대사관에서 열린 FATF 운영위원회 에 참석하여 이번 총회의 주요 의제 에 대해 다양한 의견을 교환 하였다. 특히 영국 신임의장 전략적 우선순위 이자 전세계적으로도 매우 중요한 글로벌 사기 범죄 대응 과 관련하여 FATF가 1단계 프로젝트로 완성 한 연구 보고서 결과 에서 주요 스캠단지가 확인 된 FATF 기준이행 미흡 국가들에 대해 향후 대응방안 을 논의하였다. 이형주 원장 은 이들 국가들이 대부분 저역량 국가 인 바, 역량 강화 프로 그램 등을 통해 기술 지원이 선행 되어야 함과 조직범죄의 초국경성 을 고려하여 국제공조가 중요 함을 강조하였다. 아울러 인신매매, 취업사기, 불법 광고 등을 통해 희생자들 을 범죄에 가담시키는 스캠 단지의 조직화된 범죄를 차단 하기 위해서는 인터폴, 유엔마약사무소 ( UNODC) 등 여타 국제기구와도 협력 을 확대하는 것이 바람직하다 고 발언하였다. 또한 불법자금 이동 을 조기에 차단 하기 위해 민관협력을 강화 하고 정보공유를 확대 하는 실질적 방안 으로 금융회사들이 스스로 위험을 탐지 하고 이를 금융회사 간 공유 할 수 있도록 하는 제안에 대해, 이형주 원장은 한국이 현재 시행중 인 민 관간 신속한 정보공유를 통한 의심거래 정지 및 민간 부문간 정보공유 플랫폼 운영 등 다양한 정책적·실무적 경험 을 축적해 온 바, 관련 과제 추진에 기여 할 것을 약속하였다. 차기 총회 는 ‘27년 2월 프랑스 파리 OECD 본부에서 개최 될 예정이다. 금융 정보 분석원은 향후에 도 총회에 참석 하여 자금세탁 및 테러자금조달 방 지를 위 한 FATF 국제기준 이행 논의에 적극적으로 참여할 계획 이다.", "essential": false, "importanceReasons": ["event / ceremony (-2)", "strong keyword in body text (+1)"], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "경제현안간담회 개최", "department": "종합정책과", "date": "2026.11.02.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079820&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "「증권시장 결제주기 단축 로드맵(초안)」 발표", "department": "", "date": "2026-11-02", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115871", "summary": "첨부 참조", "essential": true, "importanceReasons": ["short selling / margin / settlement (+3)", "market-operations source (+1)"], "market": true, "tier": "relevant"}, {"source": "FSS", "title": "사회초년생 청년 운전자가 자동차보험 할인혜택을 쉽게 받을 수 있도록 가입 절차를 개선합니다", "department": "보험감독국", "date": "2026-11-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249670&menuNo=200218&pageIndex=1", "summary": "□ 사회초년생 청년 운전자가 자동차보험료 부담을 경감할 수 있도록 할인 제도를 안내합니다.\n\u003c 운전경력 인정제도 및 특약 >\n① 군 운전병 복무 운전경력 → 보험가입경력으로 인정 가능(최대 3년)\n② 종피보험자 운전경력 → 보험가입경력으로 인정 가능(최대 3년)\n③ 종피보험자 무사고 경력(최근 3년내) → 무사고 경력으로 인정 가능(최대 3년)\n④ 그외 운전자범위,연령한정, 마일리지 할인, 첨단안전장치할인 등 특약 가입시 보험료 할인 가능\n□ 또한, 청년층이 자동차보험에 가입할 때 이러한 할인 제도,특약 등을 놓치지 않도록, 자동차보험 가입시 제도 등 안내 절차를 개편할 예정입니다.\nㅇ 청년층이 많이 이용하는 온라인 가입채널에서는 경력인정제도와 할인특약을 안내하는 팝업창이 표시되며, 특약가입시에도 청년이 이용할 수 있는  수출입 , 산업, IBK, 수출입 - 유관기관 : 은행연합회, 중소기업중앙회, 대중소농어업협력재단, 금융결제원 ※ 생산적 금융 대전환 회의 겸 5극 3특 지역 핵심 중소·중견기업 지원 을 위한 18개 기관(16개 은행+신보+기보) MOU 개최 금융위원장 모두발언 주요내용 이억원 금융위원장은 지난 1년간 금융 이 기업 과 산업의 성장 을 뒷받침 할 수 있도록 생산적 금융 으로의 대전환 을 추진해 왔고, 금융권에서 총 264.3조원 (‘26.7월말) 을 공급 하는 등 의미 있는 성과 가 있었다고 평가하였다. 다만 최근 중소기업 의 연체율 이 높아지는 가운데, 기업들이 금리 인상 과 금리변동 에 따른 충격을 최소화 할 수 있도록 선제적 으로 자금 흐름 의 병목을 해소 하고, 필요한 곳 에 자금이 충분히 공급 될 수 있도록 생산적 금융 의 기반을 정비 해 나가야 한다고 강조하였다. 먼저 지역의 성장기반 확충 과 균형발전 이 국가적 으로 시급한 과제 인 만큼 은행권 특별출연 을 통해 향후 3년간 4.5조원 보증부 대출 을 마중물 로 삼아 시장 논리 만으로는 해소하기 어려운 지방금융 공백 을 적극적 으로 매울 것 을 기대한다고 밝혔다. 또한, 기업간 거래 과정 에서도 자금이 원활하게 흐르도록 개편 하겠다고 밝혔다. 중소기업들과 소상공인들이 조기 현금화 수단 으로 활용하는 외상매출채권 담보 대출 제도 를 개편 하여 중소기업 과 소상공인 이 납품 대금 을 더 빨리 더 안전 하게 회수 하고, 불필요한 금융비용 을 줄일 수 있도록 지원 하겠다고 하였다. 안건 주요 논의내용 5극 3특 지역 핵심 중소·중견기업 보증부 대출 공급방안 정부는 수도권 중심 의 경제·인구 집중 및 지방 공동화 문제 를 해소 하기 위하여 5극 3특 국가균형성장 정책 을 추진 중이다. 금융권에서도 생산적 금융 대전환 과 함께 지방 우대 금융 정책 등을 병행 하고 있다. 다만, 최근 중소기업의 연체율이 높아지는 등 금융 여건이 어렵다는 현장의 의견 등을 고려하여 은행권 특별출연 을 마중물 로 삼아 지역 핵심 중소· 중견 기업 에 대한 금융지원 여력 을 확충하고, 국가 균형 발전 을 뒷받침 하고자 한다. [ 기본 사업구조 ] : 최대 3년간 4.5조원 규모 보증부 대출 공급 이번 사업은 은행권 과 보증기관 그리고 5극 3특 지자체 가 함께 참여 한다. 은행은 신·기보 특별출연 을 통해 보증재원 을 공급 한다. 이번 사업은 은행권이 실물경제 지원 과 지역 동반성장 이라는 사회적 책임 을 이행 하기 위해 3년간 3천 억원 의 특별출연 을 통해 재원을 조성한다. 신·기보 는 약 15배의 협약보증 을 공급하고 기업들을 심사하며, 해당 프로그램 으로 지역 핵심 중소·중견기업 대상으로 3년간 4.5조원 규모 의 저리의 보증부 대출 이 공급 될 예정이다. 또한 지역 현장 을 가장 잘 알고 있는 지자체 (시·도 단위) 가 성장 가능성, 지역 경제 기여도 등을 고려하여 핵심 중소·중견기업 을 추천 (보증 심사시 우선검토) 하며, 지방비를 활용 하여 이차 보전사업 에도 참여 (지자체 자율) 한다. [ 사업 실행방안 ] : 지자체 공모를 통해 지원규모 차등화 이번 참여기관 MOU 이후, 지자체 (시·도) 대상으로 사업공모를 실시 한다. 수도권 (서울 ·인천·경기) 을 제외한 14개 시·도 * 가 참여 대상 이다. * 세종의 경우 소재 기업수 등을 고려하여 충남에 포함하여 지원 5극 3특별 로 지자체 를 균형있게 선정 하되, 지자체 사업 역량 , 지역여건 등을 고려하여 지원자금을 차등화 한다. \u003c평가 등급별 배정 자금(안)> 등급 배정 지자체 1개 시·도당 기준 등급 합계 최우수 3개 시·도 4,500억원 1.35조원 우수 5개 시·도 3,500억원 1.75조원 보통 5개 시·도 2,800억원 1.40조원 * 세종의 경우 소재 기업수 등을 고려하여 충남에 포함하여 선정 → 13개 시·도 정부, 은행권, 학계 등 분야별 전문가 로 별도 평가위원회 를 구성 하여 선정 하며, 지자체 사업역량, 지역금융 취합도, 정책 부합도 등을 종합적 으로 평가 * 할 계획이다. * 세부 평가지표 및 평가방안 등은 공모시 안내 또한 은행의 적극적인 사업참여를 독려하기 위해 지역 중소·중견기업 보증부대출 공급실적 을 지역재투자 평가 가점항목 (‘28년 평가부터 3년간) 으로 반영할 예정이다. ’26년 말까지 지자체 공모를 진행 하며, 지자체 사업공모를 지원하기 위해 11~12월 중에 사업 담당자 및 지자체 사업 수행기관 대상 사업 설명회 도 개최 한다. ‘27년 1월에는 평가위원회를 구성하여 지자체별 평가 등급을 확정 하여 1분기 내에 지역 기업에 보증부 대출이 공급 될 수 있도록 추진한다. 외상매출채권 및 외담대 제도개선방안 중소기업은 대기업·중견기업 등의 공급망 (Supply chain)에 참여하여 물품· 용역 등을 납품하고, 납품대금은 현금·외상매출채권·어음 등의 방식으로 수취 하고 있다. 외상매출채권담보대출(이하 외담대)은 단기 현금성결제 수단 으로 납품 거래에 참여하는 중소기업의 주요 조기 현금화 수단 으로 이용되고 있다. ’25년 기준 으로 외상매출채권은 527조원 이 발행 되었으며, 외담대 취급액은 56조원 규모 에 이르고 있다. 금융당국에서는 중소기업이 납품 대금 을 보다 신속하고 안전하게 수취 할 수 있도록 외상매출채권 및 외담대 제도 를 개선 한다. [ 1. 정산주기 및 대출만기 단축 ] : 조기현금화 117조원 , 이자비용 年 약 363억원 절감 현행 상생협력법 등에 따르면 납품대금 정산주기는 60일이 원칙이나, 일부 외상매출채권 및 외담대 만기 는 60일보다 장기로 이용 되고 있다. \u003c외상매출채권 및 외담대 정산주기 현황(’25년중)> (단위 : 조원, %) 1~30일 31~60일 61~90일 합계 외상매출채권 261.7 (49.6) 148.9 (28.2) 116.7 (22.1) 527.3 (100.0) 외담대 17.5 (31.0) 29.4 (52.2) 9.4 (16.8) 56.3 (100.0) 상생협력법 취지 등을 고려하여 중소기업이 납품대금을 신속히 수취 하여 현금화 할 수 있도록 ’27.2월부터 ➊ 외상매출채권 과 ➋ 외담대 및 외상매출채권과 유사한 ➌ 상생채권 만기 를 60일 이내로 단축 한다. 이를 통해 기존 60일 이상 만기였던 약 117조원 규모의 외상매출채권 조기 현금화 가 가능하며, 조기 현금화로 인해 기업들도 연간 약 363억원 * 의 이자를 경감 할 수 있을 것으로 기대된다. * ‘25년중 외담대 취급액(60~90일) 9.4조원 × 평균금리 4.68% * 30일/365일 [ 2. 외담대 상환청구권 폐지 ] : 보증채무 年 26.9조원 경감 현재 외담대의 경우 은행의 리스크관리 * 차원에서 연간 외담대 신규 취급분 의 약 50% 에는 판매기업 (중소기업) 에 대해 상환청구권 이 부과 되어 왔다. * 은행 내규상 구매기업 신용등급이 일정수준 이상인 경우 상환청구권을 요구하지 않으나, 신용등급이 높지 않은 경우 리스크 관리 차원에서 판매기업에 대하여 상환청구권 요구 \u003c상환청구권 있는 외담대 취급 현황(‘25년중, 만건, 조원)> 상환청구권 있는 외담대 상환청구권 없는 외담대 외담대 합계 취급건수 (비중) 취급금액 (비중) 취급건수 (비중) 취급금액 (비중) 취급건수 (비중) 취급금액 (비중) 46.3 (65.6%) 26.9 (47.8%) 24.3 (34.4%) 29.4 (52.2%) 70.6 (100%) 56.3 (100%) 이에, ’27.1월부터 외담대 상환청구권 은 원칙적 으로 폐지 하며, 기존 상환 청구권 이 있는 외담대 의 경우에도 ’27.1월 이후 만기도래·갱신시 상환청구권 을 폐지 한다. (판매기업이 명시적으로 상환청구권 부여를 희망하는 경우에만 제한적 허용 * ) * (예) 판매기업 신용도가 구매기업보다 우수하여 대출 취급조건(금리, 한도 등)에서 유리한 경우 상환청구권 폐지는 은행권의 사회적 책임 이행 과 중소기업 과의 상생 지원 취지 가 반영된 결과로 약 46.3만건, 26.9조원 (’25년 기준) 의 중소기업 보증채무 가 경감 되고 구매기업 (원청) 의 부실이 판매기업으로 전이되는 것을 방지할 것으로 예상된다. ▪ (홈플러스, ‘25.3 00000000079838&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "국제 신용평가사 Fitch, 한국 연례협의 실시", "department": "국제금융과", "date": "2026.11.03.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079837&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "코너스톤투자자 제도 등 도입 관련  자본시장법 시행령 개정안 국무회의 의결", "department": "자본시장과", "date": "2026-11-03", "url": "https://www.fsc.go.kr/no010101/88071", "summary": "코너스톤투자자 제도 등 도입 관련 자본시장법 시행령 개정안 국무회의 의결 □ ʼ26.11.13일 시행예정인 ｢ 자본시장법 ｣에서 대통령령에 위임 한 IPO (기업공개) 시 사전수요예측 , 코너스톤투자자 제도 관련 사항을 규정 * [사전수요예측] 증권신고서 제출 전 공모주의 가격·물량 등 시장수요 예측 [코너스톤투자자] 공모주 기관투자자 배정물량 중 일부를 6개월 이상 보호예수하는 기관투자자에 대해 사전 배정 ㅇ ( 사전수요예측 ) 현행 수요예측 참여 가능한 전문투자자 가 대부분 참여 할 수 있으며, 기업에 대한 실사 결과보고서 작성 이후 전문투자자 에게 매입희망 가격 등에 대해 수요 문의 하는 방식 ㅇ ( 코너스톤투자자 ) 배정받은 물량 중 50%는 6개월 , 30%는 8개월 , 20%는 10개월의 보호예수 의무 부여 - 배정물량 상한은 일반 기관투자자 배정 물량 中 코스피 는 전체 한도 20% , 개별 한도 10%, 코스닥 은 전체 한도 30% , 개별 한도 20% * [전체 한도] 복수 코너스톤투자자인 경우, 코너스톤투자자 전체 합계의 상한 [개별 한도] 개별 코너스톤투자자의 상한 【관련 국정과제】 47. 코리아 프리미엄을 향한 자본시장 혁신 [개요] ‘26.11.3일 ｢자본시장법｣ (’26.11.13일 시행) 에서 사전수요예측, 코너스톤투자자 제도와 관련 하여 대통령령에 위임한 사항 등을 정하기 위한 ｢자본시장법 시행령｣ 개정안 이 국무회의에서 의결 되었다. 사전수요예측 은 IPO시 증권신고서 공시를 통해 희망 공모가 밴드가 확 정되기 전 에 주관사가 기관투자자 수요를 파악 할 수 있도록 허용하는 제도이다. 희망 공모가 밴드 설정 단계부터 시장수요를 반영 할 수 있게 되 어 공모가 산정의 합리성 이 제고될 것으로 기대된다. 코너스톤투자자 제 도 는 공모주 기관투자자 배정물량 중 일부를 6개월 이상 보호예수 하는 기관투 자자에게 사전 배정 할 수 있는 제도이다. 중·장기 안정적 기관투자자 를 사전에 확보할 수 있게 되어 IPO에 대한 투자자 신뢰 형성 을 돕고, 상장 직 후 급격한 공모주 매도세 로 인해 주가가 크게 하락하는 이른바 “공모주 가격” 문 제를 완화 시킬 수 있을 것으로 기대된다. [사전수요예측 제도 주요내용] ➀ [참여자격] 사전수요예측에 참여 가능한 전문투자자의 자산규모 요건은 현행 수요예측 참여자격 * 과 동일하게 설정한다. 다만, “ 일반 사모 집합투자업자 및 투자일임업자 의 경우 총 위탁재산이 300억원 이상일 요건”만 적용하고, 등록 2년 경과시 50억원의 완화요건은 적용하지 않는다. 이와 함께 금투협 규정(｢증권 인수업무 등에 관한 규정｣)을 통해 기업가치 평가 역량 , 미공개정보의 내부관리 역량 등이 있음을 확인하기 위한 추가 자격 요건을 규율한다. (예 : 최근 IPO 수요예측 및 의무보유확약 참여실적 등) * 현행 수요예측 참여자격(금투협 규정) : 일반 사모집합투자업자, 투자일임업자인 경우 총 위탁재산이 300억원 이상일 것 (단, 등록 2년 경과시에는 50억원으로 완화) ➁ [운영방법] 주관사 등은 기업에 대한 실사 결과보고서를 작성 한 후 자격요건을 충족하는 기관투자자에게 기업에 대한 정보 (향후 증권신고서를 통해 공시될 정보) 를 제공 하고 매입희망 가격 이나 물량 등 수요에 대해 문 의 할 수 있다. 이때 제공하는 정보가 아직 공시되기 전 정보 임을 고려하 여 비밀 유지계약 을 체결해야 하며 정보제공 일시, 상대방, 내용 등을 기록하고 유 지·관리 해야 한다. 만일 비밀유지계약을 위반하여 동 정보를 제3자에게 이용하도록 하는 경우 미공개중요정보 이용행위 가 될 수 있다는 점을 주의해 야 한다. [코너스톤투자자 제도 주요내용] ➀ [참여자격] 코너스톤투자자 참여자격은 사전수요예측 참여자격에 더해 보호예수 기간 주가변동 리스크 를 감내 할 수 있는 자기자본 또는 자산규 모 요건 을 추가로 설정 한다. 구체적으로, 사전 청약 하는 공모주 물량의 20배 이상 자기자본(고유재산으로 IPO 참여시) 또는 위탁재산(위탁재산으로 IPO 참여시)을 갖추어야 한다. 이는 IPO 규모 가 케이스별로 차이 가 크다는 점을 고려해 절대적 규모(예 : O천억원 이상)가 아닌 상대적 규모 로 기준을 설정한 것이다. 상대적 기준을 통해, 대형 기관투자자뿐만 아니라 충분한 역량을 갖춘 중·소형 기관투자자 에게도 코너스톤투자자로 참여할 수 있는 기회가 부여 될 수 있다. ➁ [보호예수기간 및 수량상한] 코너스톤투자자가 배정받은 물량 중 50%는 6개월, 30%는 8개월, 20%는 10개월 로 설정 * 한다. 이는 코너스톤 투자자 보호예수 종료시점이 특정일로 집중 되면 매도쏠림 이 나타날 수 있다는 점을 고려한 것이다. * 보호예수기간은 시행령에서는 6개월 이상 12개월 이하로 규정 → 규정에서 최종 규정 코너스톤투자자에게 사전 배정할 수 있는 공모주 물량 상한 은 코스피와 코스닥을 차등화 하여 설정한다. 코스닥은 공모 규모가 작고 정책펀드 별도 배정분이 많아 코스피와 동일한 기준 적용시 코너스톤투자자에게 배정 가능한 물량이 적어 기관투자자의 참여유인이 낮을 우려 가 있기 때문이다. 일반투자자(개인 등), 우리사주조합, 정책펀드(하이일드펀드, 코스닥벤처펀드)를 제외한 잔여 기관투자자 배정 물량 범위 내에서 코스피는 전체 * 한도 20% , 개별 * 한도 10% , 코스닥은 전체 한도 30% , 개별 한도 20% 로 설정한다. * [전체 한도] 복수 코너스톤투자자인 경우, 코너스톤투자자 전체 합계의 상한 [개별 한도] 개별 코너스톤투자자의 상한 ※ 동 한도는 시행령→감독규정→협회규정 위임에 따라, 협회규정에서 일반기관투자자 물량의 전체 20%, 개별 10%(코스닥은 전체 30%, 개별 20%)로 최종 규정 [현행 IPO시 공모주 배정 방법] 일반 청약자 우리사주 조합 기관투자자 하이일드펀드 코스닥벤처펀드 그 외 기관투자자 코스피 25% 20% 5% - 50% 코스닥 25% 0~20% 10% 30% 15~35% * 동 물량의 범위 내에서 상한비율을 설정해 코너스톤투자자 배정 [시장별 코너스톤투자자 수량상한] 코스피 코스닥 전체 한도 개별 한도 전체 한도 개별 한도 일반 기관 물량 중 비율 20% 10% 30% 20% 전체 공모 물량 중 비율 환산 10% 5% 4.5~10.5% 3~7% ➂ [이해상충 방지] 코너스톤투자자 제도가 계열사 등에 대한 우대 * 또 는 위험 떠넘기기 * 수단 등으로 악용될 수 없도록, 이해관계 있는 기관 투자자(대주주, 특수관계인 등)의 경우 코너스톤투자자 계약을 맺을 수 없도록 원천 금지 한다. 아울러, 코너스톤투자자 계약을 조건으로 직접적·간접적 이익을 교환 하는 행위도 금지하여 사전배정 등을 매개로 한 이면계약을 방지한다. * [우대] 경쟁률이 높은 IPO에서 이해관계 있는 계열사 등에 대량 사전배정 [떠넘기기] 청약미달 우려가 있는 IPO에서 인수부담을 축소하고 경쟁률이 높아 보이게 하기 위해 계열사 등에 사전배정 오늘 국무회의에서 의결된 자본시장법 시행령 개정안은 11월 중 공포되며, 법률 시행일인 ʼ26.11.13일부터 시행될 예정이다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": true, "tier": "relevant"}, {"source": "FSS", "title": "금감원장, 임원회의(11.3.) 당부사항", "department": "기획조정국/디지털금융총괄국/IT검사국", "date": "2026-11-03", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249709&menuNo=200218&pageIndex=1", "summary": "□ 이찬진 원장은 임원회의(11.3.)시 최근 금융권 해킹사고와 관련한 업권별 대응현황을 점검하고 IT보안강화방안을 논의하였음\n□ 최근 해킹사고는 은행에서 증권,보험 등 전통금융회사뿐만 아니라, IT보안이 취약한 ''약한고리''인 「전자금융거래법」 未적용사 등까지 전방위적으로 확대되는 가운데\nㅇ 가상자산사업자, 온라인투자연계금융업자 등에서는 금전 피해까지 발생하여 한층 강화된 대비 태세를 갖추는 것이 시급\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "코너스톤투자자 제도 등 도입 관련 자본시장법 시행령 개정안 국무회의 의결", "department": "기업공시국", "date": "2026-11-03", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249707&menuNo=200218&pageIndex=1", "summary": "□ ?26.11.13일 시행예정인 「자본시장법」에서 대통령령에 위임한IPO(기업공개)시 사전수요예측, 코너스톤투자자 제도 관련 사항을 규정\nㅇ (사전수요예측) 현행 수요예측 참여 가능한 전문투자자가 대부분 참여할 수 있으며, 기업에 대한 실사 결과보고서 작성 이후 전문투자자에게 매입희망 가격 등에 대해 수요 문의하는 방식\nㅇ (코너스톤투자자) 배정받은 물량 중 50%는 6개월, 30%는 8개월, 20%는 10개월의 보호예수 의무 부여\n- 배정물량 상한은 일반 기관투자자 배정 물량 中 코스피는 전체 한도 20%, 개별 한도 10%, 코스닥은 전체 한도 30%, 개별 한도 20%\n[관련 국정과제] 47. 코리아 프리미엄을 향한 자본시장 혁신\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": true, "tier": "routine"}, {"source": "FSC", "title": "2027년 금융위원회 예산안에 대해  자세히 설명드립니다.", "department": "혁신기획재정담당관", "date": "2026-11-03", "url": "https://www.fsc.go.kr/no010101/88074", "summary": "2027년 금융위원회 예산안에 대해 자세히 설명드립니다. \u003c주요 질문 및 답변> 1. K-민생지킴대출에 소득 요건이 없어 고소득자도 이용 가능하여, 저소득층 지원 여력이 감소된다는 우려가 있는데? ◇ (사업개요) 신용점수 하위 50% 국민 대상, 장기(10년)·저리(4.5%)로 최초 100만원 대출을 제공하고, 성실상환시 추가 100만원 대출 및 제도권 금융 연계 □ 민생지킴대출 은 기본적으로 제도권 금융 이용이 어려운 저신용·저소득 차주 를 대상으로 긴급 자금 을 제공 할 예정이나, 재해·질병 등 특수 상황 에 처해 자금을 구하기 어려운 분들을 배제 하지 않으려는 취지 에서 별도의 소득 요건 을 두지 않은 측면 이 있습니다. □ 다만, 대면상담 을 통해 자금지원 의 필요성·긴급성 을 심사 할 것이므로, 제도권 금융 이용 이 가능 한 고소득자 에 대한 지원 은 없을 것 입니다. 2. 코로나 피해 소상공인에 대한 신규 채무조정 사업 관련, ’ 23.6월 이후 연체가 시작된 차주에 대한 형평성 문제가 제기되는데? ◇ (사업개요) ’23.6월 이전 연체가 시작된 1억원 미만의 장기연체채권을 일괄 매입후, 강화된 채무조정을 제공 □ 동 사업은 코로나 방역조치 등에 따라 생업의 희생 으로 장기연체 에 빠진 자영업자 를 지원하는 것이 목적입니다. ㅇ 또한, 코로나 극복 과정에서 우리나라의 경우 해외 주요국 대비 재정 보다는 금융 중심 으로 지원 한 점을 고려하였습니다. □ 정책취지에 맞는 대상을 한정된 재원 으로 지원하려면, 특정 시점인 코로나 종료시점 (’23.6월) 으로 지원대상 을 정 하는 것이 불가피한 측면이 있습니다. * 사회적 거리두기 개시 (‘20.3월) → 일상회복 선언·시행 (확진자 격리의무 권고전환 등, ’23.6월) □ 또한, 장기소액연체자재단 (10년 이상 연체) · 새도약기금 (7년 이상 연체) 등 특정 시점 이전 에 연체가 발생한 경우를 지원대상으로 한 기존 사례 가 있으며, ㅇ 코로나 종료 (’23.6월) 이후 발생 한 연체 는 개별 경영상 사유로 인한 경우도 많아 코로나 피해와의 인과성이 보다 떨어질 수 있습니다. □ 코로나 종료 (’23.6월) 이후 연체 가 발생한 자영업자 는 새출발기금 을 통해 원금감면 등 채무조정 을 받으실 수 있도록 지원 할 계획입니다. 3. 코로나 기간에 사업을 영위했다는 사실만으로 코로나 피해를 입었다고 보기 어려울 수 있는데, 기준이 너무 단순한 것 아닌지? □ 새출발기금 출범시 당초 ‘코로나 피해 입증 요건’ 을 두었으나, 입증 의 어려움 으로 사각지대 가 발생한다는 지적 이 있었습니다. ㅇ 이에 새출발기금도 ’24.2월 지원기준 을 ‘코로나 기간 중 사업 영위 여부’로 완화 한 바 있습니다. ㅇ 신규 채무조정 사업 도 이를 고려 하여 코로나 기간 중 사업영위 여부를 요건으로 삼은 측면이 있습니다. 4. 청년 미래보금자리론 대상에서 아파트를 제외한 것이 청년 선호를 반영하지 못하고, 자산형성 효과도 불확실하다는 지적이 있는데? ◇ (사업개요) 4억원 이하 주택 (아파트外) 을 매입하는 생애최초 주택구입 청년에 대해 우대금리를 제공하고, 생애최초 LTV 우대 혜택 유지 등 인센티브 제공 □ 청년 미래보금자리론 은 한정된 재원 (‘27년 596.6억원) 을 감안하여, “APT 구입이 어려운” 청년층 을 우선 지원 하고자 하는 취지 입니다. ㅇ APT 구입 을 희망하는 청년 은 지금과 동일하게 기존 정책수단 (보금자리론, 디딤돌대출 등) 을 활용 하여 APT 를 구입 할 수 있습니다. □ 또한 동 상품 은 사회초년생, 1인 가구 청년들에게 월세 수준의 원리금 부담 으로 자산 을 축적 할 수 있는 “추가적인 옵션” 을 제공 하는 취지 가 있습니다. 5. 청년 전월세결합보증의 지방 청년 우대금리 관련, 수도권의 높은 보증금·월세 부담을 고려시 오히려 수도권 청년을 우대해야 한다는 지적이 있는데? ◇ (사업개요) 전세+월세(반전세) 모두를 보증하는 보증 상품을 신규 출시하고, 대출한도·보증비율 우대 및 저소득·지방 청년 이차보전 (1~3%p) 지원 등 혜택 제공 □ 청년 전월세결합보증 의 지방 청년 우대 금리 는 지방 청년 의 주거비용 제외 가처분 소득 이 수도권 청년 에 비해 낮다 는 점을 고려 하여 설정 하였습니다. * 지방 年2,972만원, 수도권 年3,273만원 (출처: 주거실태조사(2024) 통계 재구성)", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "제1회 퇴직연금 장기투자 기존 주계약에 특약으로 부가 허용\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": true, "importanceReasons": ["rule change (+2)", "law/regulation change (+1)"], "market": true, "tier": "routine"}, {"source": "FSC", "title": "계리가정보고서 도입 등  ｢보험업감독규정｣ 개정안 금융위원회 의결", "department": "보험과", "date": "2026-11-04", "url": "https://www.fsc.go.kr/no010101/88081", "summary": "계리가정보고서 도입 등 ｢보험업감독규정｣ 개정안 금융위원회 의결 ◈ (계리가정 관리 강화) 보험회사는 계리가정 산출·변경 에 관한 내부통제 기준 을 마련하고, 연중 계리가정 변경시 위험관리위원회에 보고 하며, 매년 사업보고서 제출시 계리가정보고서 를 금융감독원 에 제출 ◈ (경영실태평가 강화) 금리변동 위험 관리 및 GA에 대한 판매위탁리스크 관리책임 강화 를 위한 평가항목 (듀레이션 갭 및 GA 운영위험 관리의 적정성) 신설 ◈ (실손보험 계약전환 지원) 계약전환 할인제도 와 관련한 실손보험상품 은 단독형 설계의무 적용대상 에서 제외 하여 기존 주계약에 특약으로 부가 허용 ‘26.11.4.(수), 금융위원회 는 ｢ 보험업감독규정 ｣ 개정안 을 의결 하였다. 이 번 개정은 ｢ 보험업권 계리감독 선진화 방안 ｣ (’26.1월) , ｢ 듀레이션 갭 규제 방안 ｣ (‘25.10월) 등 그간 발표한 제도개선 과제 를 감독규정에 반영 하기 위한 것으로 규정변경예고 등 관련 절차를 거쳐 의결되었다. 주요 내용은 아래와 같다. Ⅰ 주요 내용 1. 계리가정 관리 강화 [1] 계리가정보고서 신설 보험회사는 책임준비금 및 지급여력기준금액 등의 산출에 적용한 계리 가정에 관한 보고서 (계리가정보고서) 를 작성하여 매년 사업보고서 제출기한에 맞추어 금융감독원에 제출 하여야 한다. 계리가정보고서에는 가정별 산출근거와 방법, 주요 변경사항 및 검증결과, 현금흐름 모델링 및 내부통제 에 관한 사항 등 보험부채 평가 관련 핵심정보가 포함된다. 이를 통해 보험회사의 계리가정 관리 가 체계화 되고, 회사별·상품별 가정의 수준과 변동추이를 비교·분석하여 이상징후를 조기에 식별 하는 등 감독행정에 효율적으로 활용할 수 있게 된다. [2] 계리가정 산출․변경에 대한 내부통제 절차 마련 보험회사는 계리가정 산출·변경에 관한 내부통제기준을 마련 하여야 하며, 연중 계리가정 을 변경 하는 경우에는 변경 사유·내용 및 재무영향 등을 위험 관리위원회 (이사회 內 위원회) 에 보고 * 하여야 한다. * 다만, 관련 법령 변화에 따른 변경이거나 변경에 따른 재무영향이 미미한 경우에는 보고 생략 가능 2. 경영실태평가(RAAS) 강화 [1] 듀레이션 갭 지표 신설 금리 변동에 따른 보험회사의 자산·부채관리 (ALM) 역량 을 높이기 위해 듀레이션 갭 을 경영실태평가의 금리리스크 계량평가 지표 로 신설 한다. ￭ (듀레이션) 금리 변동 시 자산·부채 가치가 얼마나 변화하는지 나타내는 민감도 ￭ (듀레이션 갭) 자산·부채 간 듀레이션의 차이로서, 금리 변동에 따라 순자산 가치가 얼마나 변화하는지 나타내는 지표 (듀레이션 갭 = 자산듀레이션 – 부채듀레이션 × [금리부 부채 / 금리부 자산]) 다만, 최근 금리 여건 등 시장상황 과 보험회사의 충분한 준비기간 확보 필요성 등을 고려하여 듀레이션 갭 지표 는 '28.1.1.부터 시행 한다. [2] 법인보험대리점(GA) 운영위험 평가항목 신설 보험회사의 법인보험대리점 (GA) 채널 영업 확대 와 과당경쟁에 따른 소비자 피해 우려 에 대응하여, 경영실태평가 경영관리리스크 부문 에 「법인보험대리점 운영위험 관리의 적정성」 비계량 평가항목 을 신설 한다. 이를 통해 법인보험 대리점 판매위탁에 대한 보험회사의 관리책임 을 강화하고 소비자피해 예방 과 불건전 판매관행 개선 을 유도할 계획이다. 3. 기타 개정 사항 [1] (실손보험 상품설계 규제 정비) 실손보험 의 단독형 설계의무 는 실손보험 판매 시 다른 상품 을 끼워파는 등 소비자 피해를 방지 하기 위해 도입되었다. 계약전환 할인제도 * 는 기존에 대부분 특약으로 판매된 실손보험계약을 5세대 실손보험으로 전환 하는 제도인 점 등을 감안하여, 계약전환 할인제도 관련 실손보험상품은 단독형 설계의무 적용대상 에서 제외 하여 기존 주계약에 특약 으로 부가할 수 있도록 허용 한다. * '13.3월 이전 재가입 조건이 없는 1·2세대 실손보험 가입자를 대상으로 5세대 실손 으로 전환 시 3년간 5세대 보험료의 50%를 할인 하는 제도로 선택형 특약 할인 제도 (1·2세대 유지하면서 불필요한 보장을 제외하고 보험료 할인) 와 함께 ‘26.11월중 시행예정 [2] (비상위험준비금 적립액 산출방식 개선) 비상위험준비금은 당해 보험료의 일부 를 비상위험에 대비하여 적립토록 하는 준비금으로, 적립 취지를 반영 하여 매년 적립액은 당해연도 적립대상보험료를 기준으로 산출 하도록 한다. [3] (재무제표 작성기준 개정) '27년부터 국제회계기준 (IFRS18) 이 시행 됨에 따라 포괄손익계산서 구분 표시 항목을 개정 * 하고, 손익분석 시 계정별 손익 구분 기준 도 이에 맞추어 정비한다. * (기존) 보험손익 · 투자손익 · 영업손익 · 영업외손익 · 법인세비용차감전순손익 (개정) 보험손익 · 투자영업손익 · 기타영업손익 · 영업손익 · 투자손익 · 재무손익및법인세 비용차감전손익 · 재무손익 · 법인세비용차감전순손익 Ⅱ 향후 계획 이번 「보험업감독규정」 개정안은 고시한 날 부터 시행 한다. 다만, 계리가정 산출·변경 내부통제 , GA 운영위험 평가항목 신설 및 재무제표 작성기준 개정사항 은 ‘27.1.1. 부터, 듀레이션 갭 지표 신설 은 '28.1.1. 부터 시행한다. 아울러 계리가정보고서는 ’26회계연도 결산분부터 제출하여야 한다. ※ 규정변경예고안 (‘26.9.11. 보도자료 참조) 에 포함되었던 보험회사의 부동산PF 신용공여 한도 신설은 별도로 감독규정 개정을 진행중(’27.1.1. 시행 목표) 금융위원회와 금융감독원은 개정 사항 이 현장에 안착 될 수 있도록 이행상황 을 점검 해 나갈 계획이다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "홍콩 H지수 ELS 관련 은행, 증권사 검사 결과 조치", "department": "은행검사1국/은행검사2국/금융투자검사1국/금융투자검사2국/금융투자검사3국/소비자보호감독총괄국", "date": "2026-11-04", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249736&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융위원회는 ’26년 11월 4일 개최된 제19차 정례회의에서 홍콩 H지수 ELS 불완전판매 관련, 「금융소비자 보호에 관한 법률(이하 \"금소법\")」을 위반한 7개 은행(국민, 신한, 하나, 농협, SC, 우리, 수협은행)에 대하여 3,619.60억원의 과징금 및 17.78억원의 과태료 부과 조치를 최종 의결하였다.\n※ 수익률 모의실험 결과 누락 등으로 설명의무 위반, 일부 정보 미고려 등 적합성 원칙 위반 등\nㅇ 또한, 금융위는 6개 증권사(미래, KB, 신한, NH, 한투, 삼성증권)에 대해 92.82억원의 과징금 및 16.12억원의 과태료 부과 조치도 최종 의결하였다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "홍콩 H지수 ELS 관련 은행·증권사 검사 결과 조치 - 제19차 금융위원회(11.4.) 의결", "department": "금융소비자정책과", "date": "2026-11-04", "url": "https://www.fsc.go.kr/no010101/88082", "summary": "홍콩 H지수 ELS 관련 은행·증권사 검사 결과 조치 - 제19차 금융위원회(11.4.) 의결 - 1. 조치 개요 금융위원회 (이하 “금융위”) 는 ’26년 11월 4일 개최된 제19차 정례회의 에서 홍콩 H지수 ELS 불완전판매 관련 , 「금융소비자 보호에 관한 법률 (이하 “금소법”) 」 을 위반 한 7개 은행 (국민, 신한, 하나, 농협, SC, 우리, 수협 은행) 에 대하여 3,619.60억원의 과징금 및 17.78억원의 과태료 부과 조치 를 최종 의결 하였다 . ※ 수익률 모의실험 결과 누락 등으로 설명의무 위반, 일부 정보 미고려 등 적합성 원칙 위반 등 또한, 금융위는 6개 증권사 ( 미래, KB, 신한, NH, 한투, 삼성증권) 에 대해 92.82억원의 과징금 및 16.12억원 의 과태료 부과 조치 도 최종 의결 하였다. ※ 위험등급의 유의사항 누락 등으로 설명의무 위반 등 2. 의결 취지 및 향후 계획 금융위는 금번 제재안이 다수의 금융소비자와 관련되며 주요 금융기관이 대상이 된 금소법 위반 첫 사례 이므로 철저한 법리검토와 충분한 사실관계 확인 을 바탕으로 법과 원칙 에 따라 엄정하고 합리적인 조치 가 이뤄질 수 있도록 여러 차례 심의를 진행하였다. 금번에 부과 결정한 약 37백억원의 과징금·과태료 는 금융위가 부과한 최대 규모 의 금전 제재 에 해당하며, 금융위는 동 결정으로 금융회사의 불완전판매 등 금소법 위반행위에 대해서는 법과 원칙에 따른 엄중한 책임 이 따른다는 점을 분명히 하였다. 향후에도 금융위는 불완전판매 등 금소법 위반 에 대해서 금소법령에 따라 신속·엄정하게 제재 하고 과징금 부과를 통한 부당이득의 환수 도 적극 추진 해 나갈 예정이다. 또한, 현행 금융소비자보호 법제·제도 에도 불구하고 판매 현장에서 소비자 보호가 충분하지 않다는 지적이 있는 만큼 제도적 보완 노력 도 병행 해 나갈 것이다. 우선, 투자성 상품에 대한 소비자 이해도 제고를 위하여 투자성 상품 설명 가이드라인 을 마련하여 ’27년 1분기에 시행할 예정이다. 또한, 금융 회사가 금융소비자의 최선의 이익에 부합 하는 방향으로 금융업을 영위토록 하는 금융소비자보호원칙 마련 * 등을 골자로 하는 금소법 개정안이 국회에 계류되어있는 만큼, 금소법이 조속하게 개정 되도록 국회의 법안심사에 적극 참여할 예정이다. * 금융회사가 금융소비자의 최선의 이익에 부합하도록 금융상품판매업 등을 영위하고 동 원칙을 내부통제기준에 반영 → 원칙 준수시 제재 감경 근거로 활용", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "KRX_GLOBAL", "title": "(Press Release) KRX Identifies Low-PBR Companies and Publishes First List", "department": "김윤기 · Corporate Value-up", "date": "2026-11-04", "url": "https://global.krx.co.kr/board/GLB0203000000T5/bbs#view=47", "summary": "The Korea Exchange (KRX, Chairman & CEO Eun Bo Jeong) identified the low-PBR (Price-to-Book Ratio) companies and published its first list, comprising 151 firms, on November 2, 2026, as a follow-up measure to the Capital Market Reform Plan jointly announced by relevant authorities on March 18, 2026.\u003cbr/>\u003cbr/>Please refer to the attachment for details.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_GLOBAL", "title": "(Press Release) KRX Identifies Low-PBR Companies and Publishes First List", "department": "정재윤 · KRX", "date": "2026-11-04", "url": "https://global.krx.co.kr/board/GLB0203000000T1/bbs#view=20895", "summary": "The Korea Exchange (KRX, Chairman & CEO Eun Bo Jeong) identified the\u003cbr/>low-PBR (Price-to-Book Ratio) companies and published its first list, comprising\u003cbr/>151 firms, on November 2, 2026, as a follow-up measure to the Capital Market\u003cbr/>Reform Plan jointly announced by relevant authorities on March 18, 2026.\u003cbr/>\u003cbr/>Please refer to the attachment for details.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "한국, 아시아지배구조협회(ACGA)    기업지배구조 순위 역대급 ‘5위’ 달성", "department": "공정시장과", "date": "2026-11-04", "url": "https://www.fsc.go.kr/no010101/88084", "summary": "한국, 아시아지배구조협회(ACGA) 기업지배구조 순위 역대급 ‘5위’ 달성 - ACGA ’26년 아시아·태평양 12개국 기업지배구조 순위 발표 (’26.11.4) - ✔ 한국 기업지배구조 순위, ‘23년 8위 에서 ’26년 5위 로 3단계 상승 ✔ 상법 개정, 주총 의결권 행사결과 당일공개 등 제도개선 성과 인정 ✔ 기업가치 제고 프로그램 및 ESG 공시 로드맵 등 지속적 개선 추진 아시아지배구조협회 (이하 ACGA * ) 가 발표하는 아시아·태평양 12개국 기업지배 구조 순위에서 한국이 기존 8위 (’23년) 에서 5위 (’26년) 로 무려 3단계나 상승하는 역대급 성과를 달성 * * 하였다. * A sia C orporate G overnance A ssociation: 아시아·태평양 지역 기업지배구조, ESG 수준 향상을 위한 연구·자문을 제공하는 국제단체로, 전세계적 자산운용사인 BlackRock, Vanguard, 한국의 국민연금 등을 포함한 105개 기관이 회원사로 구성되어 있으며, 회원사의 운용자산은 40조 달러 수준 ** (그간의 한국 순위) ’16년 12위 → ‘18년 9위 → ’20년 9위 → ‘23년 8위 기록 (평가상승 요소, 지난평가 대비) 상장회사 +10.7점, 투자자 +7.9점, 정부 +6.9점 ACGA는 각 국의 지배구조 제도개선 현황을 파악하기 위해 매년 평가대상국을 방문하고 있다. 금융위원회 및 법무부를 비롯한 정부기관과 유관기관은 ’25년 3월부터 ’26년 9월까지 총 4차례에 걸쳐 ACGA측과 면담을 진행하여 3차례에 걸친 상법 개정 등 최근 한국 정부와 국회가 추진한 제도개혁 성과 및 지속적인 지배구조개선 노력에 대한 의지 를 설명한 바 있다. * (평가대상 12개국, ’26년 평가순위 순) 1위 호주, 2위 일본, 공동 3위 싱가폴·대만, 공동 5위 한국·말레이시아 , 7위 홍콩, 8위 인도, 9위 태국, 10위 중국, 11위 필리핀, 12위 인도네시아 이에 ACGA는 ’26년 9월 공개 감사 서한을 이례적으로 발표하여 한국 정부 및 국회가 그간 추진한 개혁과제들을 높이 평가 하며, 특히 기업가치 제고와 지속가능성 공시 정책을 한국 자본시장의 투자 매력과 투명성을 높이는 정책으로 언급한 바 있다. ACGA가 ’25년 3월 방문 시 제안했던 주주총회 의결권 행사결과의 당일 공개를 금융위원회가 즉시 반영하여 ’26년 정기주주총회부터 시행한 점도 중요한 진전 으로 보았다. 또한, 이번 평가에서는 이러한 성과가 제도개선에 그치지 않고 한국 상장 회사의 행태변화를 이끌어낸 점이 등급 상승에 중요하게 영향 을 미친 것으로 분석된다. (상장회사 부문 평가점수 +10.7점 상승) 국내 상장회사는 ’26년 3월 자기주식 소각을 의무화하는 3차 상법 개정 등에 따라 ’26년 1~9월 간 자기주식을 90.9조원 소각하였고, 이는 ’25년 21.4조원을 4.2배 상회하는 수치 에 해당한다. 또한, ’25년 배당규모 * 도 56.0조원으로 ’23년 37.4조원, ’24년 41.0조원에서 꾸준히 상승하는 흐름이 보였다. * 중간·분기·결산배당 합계, 회계연도 기준 한국 정부는 이번 평가결과에 안주하지 않고 주주권익 보호를 위한 법령 개선 노력을 지속하고, 기업가치 제고 프로그램 및 ESG 공시 제도화 등 기업지배구조 개선과제를 지속 추진 해 나갈 예정으로, 한국 자본시장이 아시아 뿐만 아니라 전세계 시장에서 글로벌 베스트 시장으로 인정받고 국내 및 외국인 투자자가 믿고 투자할 수 있는 시장이 되도록 노력할 것이다. ※ ACGA의 한국 기업지배구조에 대한 상세보고서는 ’26.12월 중 별도로 발표될 예정", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}], "2026-11-05": [{"source": "FSS", "title": "AI시대, 거세지는 침해위협에 맞서 全 금융권이 튼튼한 보안체계로 무장하도록 혁신적인 정책과제를 적극 추진하겠습니다.", "department": "디지털금융총괄국/IT검사국", "date": "2026-11-05", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249742&menuNo=200218&pageIndex=1", "summary": "’26.11.5.(목) 금융위원회는 이억원 위원장 주재로 금융감독원, 금융보안원과 은행, 증권, 보험 등 전통적 금융업권 및 가상자산, 전자금융, 온투업까지 포함한 全 금융권 협회장들과 함께 「AI시대 보안체계 혁신을 위한 全 금융권 간담회」를 개최하였다. 범정부적 공조 차원에서 국조실, 과기부, 행안부, 개보위, 방미통위, 경찰청, KISA도 참석하였다.\n금번 회의는 갈수록 거세지는 AI 해킹 등 새로운 침해위협에 맞서 우리 금융권이 튼튼한 보안체계를 확립하기 위한 다양한 실천과제와 제도개선 사항 등을 논의하기 위해 마련되었다.\nㅁ 일시/장소 : '26.11.5.(목) 9:00 / 금융보안원 여의도 분원\nㅁ 참석 : [금융위] 이억원 위원장(주재), 디지털금융정책관 등\n[금감원] 수석부원장, 디지털,IT부원장보 등[금보원] 금융보안원장, 사이버대응본부장, 금융AI보안연구소장 등\n[관계부처,기관] 국조실, 과기부, 행안부, 개보위, 방미통위, 경찰청, KISA\n[협회,중앙회] 은행연, 생보협, 손보협, 금투협, 여전협, 저축은행중앙회, 신협,농협,수협,새마을금고 중앙회, 핀산협, DAXA, 온투협회 협회장\n[전문가] 민간 기술자문단\nㅁ ,논의사항 : AI 시대 보안체계 혁신을 위한 대응방안\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "｢“취재정보로 매매해 ○○억 부당이득”···○○신문 조사 마무리｣ 보도 관련", "department": "조사과", "date": "2026-11-05", "url": "https://www.fsc.go.kr/no010101/88085", "summary": "｢“ 취 재정보로 매매해 ○○억 부당이득 ”··· ○○신문 조사 마무리｣ 보도 관련 - KBS 11월 4일 16:28 최초 보도 - 1. 기사 내용 □ KB S는 11.4일자 ｢“취재정보로 매매해 ○○억 부당이득”··· ○○ 신문 조사 마무리｣ 제하의 기사(16:28 최초 보도)에서 ㅇ “ 주가조작 근절 합동대응단 은 지난 2월 시작한 조사를 마무리하고, 어 제(3일) 회의를 열어 혐의자 8명에 대한 조사 결과와 제재 방향을 결정 하였습니다.”등의 내용을 보도했습니다. 2. 보도에 대한 반박 □ 합동대응단 은 어제 회의를 열어 조사 결과 와 제재 방향을 결정한 바 없습니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "대학수학능력시험일(11.19) 증권시장 등 거래시간 임시 변경", "department": "", "date": "2026-11-05", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115880", "summary": "첨부 참조", "essential": true, "importanceReasons": ["trading hours / session (+3)", "market-operations source (+1)"], "market": true, "tier": "essential"}, {"source": "FSC", "title": "AI시대, 거세지는 침해위협에 맞서 全 금융권이 튼튼한 보안체계로 무장하도록 혁신적인 정책과제를 적극 추진하겠습니다.", "department": "금융안전과", "date": "2026-11-05", "url": "https://www.fsc.go.kr/no010101/88086", "summary": "AI시대, 거세지는 침해위협에 맞서 全 금융권이 튼튼한 보안체계로 무장하도록 혁신적인 정책과제를 적극 추진하겠습니다. - 「AI시대 보안체계 혁신을 위한 全금융권 간담회」 개최 - ▸ 全금융권 , 약 580여개 사 대상 외부접점·내부통제 전면 전수점검 ▸ 대형 금융회사 부터 취약점 분석·평가 연 2회 이상 의무화 ▸ 다크웹 모니터링, AI를 통한 보이스피싱 차단 등 2차 피해 적극 방지 ▸ “AI 공격은 AI로 방어” 위해 망분리 규제 전면해제 , 新보안체계 본격 논의 [ 개요 ] ’26.11.5.(목) 금융위원회 는 이억원 위원장 주재로 금융감독원·금융보 안원 과 은행·증권·보험 등 전통적 금융업권 및 가상자산·전자금융·온투업까지 포함한 全 금융권 협회장 들과 함께 ｢AI시대 보안체계 혁신을 위한 全 금융권 간담회｣ 를 개최하였다. 범정부적 공조 차원에서 국조실, 과기부, 행안부, 개보위, 방미통위, 경찰청, KISA 도 참석하였다. 금번 회의는 갈수록 거세지는 AI 해킹 등 새로운 침해위협에 맞서 우리 금융권이 튼튼한 보안체계를 확립하기 위한 다양한 실천과제 와 제도개선 사항 등을 논의하기 위해 마련되었다. · 일시/장소 : ’26.11.5.(목) 9:00 / 금융보안원 여의도 분원 · 참석 : [금융위] 이억원 위원장 (주재) , 디지털금융정책관 등 [금감원] 수석부원장, 디지털·IT부원장보 등 [금보원] 금융보안원장, 사이버대응본부장, 금융AI보안연구소장 등 [관계부처·기관] 국조실, 과기부, 행안부, 개보위, 방미통위, 경찰청, KISA [협회·중앙회] 은행연, 생보협, 손보협, 금투협, 여전협, 저축은행중앙회, 신협·농협·수협·새마을금고 중앙회, 핀산협, DAXA, 온투협회 협회장 [전문가] 민간 기술자문단 · 논의사항 : AI 시대 보안체계 혁신을 위한 대응방안 [ 금융권 침해사고 현황 ] 금융권 침해사고가 확인된 지난 9월 30일 이후 현재 (11월 3일 기준) 까지 총 37 개사 * , 40건 의 침해사고가 신고되었다. 은행·보험·증권 등 전통적인 금 융업권뿐 아니라, 가상 자산업, 전자금융업, 온투업 등 全 업권에서 침해 사고가 신고 되었으며, 지난 10월 14일 全금융권 체크리스트 점검이 완료된 이후에는 주로 중소규모 증권·보험사 나 전자금융업, 온투업, 가상자산거래 소 등의 침해사고 가 많이 보고 되고 있다. * [은행] 4개사, [금투] 5개사, [보험] 3개사, [저축은행] 5개사, [상호금융] 1개사, [여신] 2개사, [온투] 4개사, [전금] 10개사, [가상자산] 3개사 침해사고에 따른 정보유출 규모는 현재까지 약 47.3만건 으로 파악되었다. 주로 임직원 정보나 고객 성명, 주민등록번호, 계좌번호 등 금융회사 영업과정에서 수집한 정보들이 많으며, 계좌 비밀번호 등 부정결제 우려가 있는 정보유출은 아직 확인되지 않았다 . 정부는 각 금융회사들이 고객 정보유출 사실 통지, 피해 발생시 배상 등 소비자 보호 조치 등에 만전을 기하도록 관리·감독하는 한편, 이상거래 모니터링 강화, 소비자 경보 발령·행동요령 발표 (10월 6일) 등 2차 피해 방지 를 위한 대응도 긴밀히 취해 나가고 있다. 일부 소규모 가상자산거래소·전자금융업자·온투업자의 경우에는 회사가 관리하는 자금이 탈취되는 사고도 발생했다. 자금탈취 규모는 현재까지 약 10억원 수준 으로 신고되었으며, 주로 가상자산 핫월렛, 소비성 포인트, 온투업 예치금 등 회사에서 고객자금을 통합 관리하는 계정 등에서 자금이체가 발생한 것으로, 개별 이용자의 자금손실이 아직 현실화되지는 않은 것으로 파악 되고 있다. 「 전자금융거래법」에는 침해사고 등으로 고객 손해 발생시 무과실 배상 책 임이 규정 되어 있고,「가상자산 이용자 보호법」에는 보험가입·적립금 마 련 등 소비자 보호 조치가 규정되어 있는 만큼, 금융위원회·금융감독원 은 이러한 제도적 장치 등을 바탕으로 소비자 보호 조치가 면밀히 이루어지도록 지도·감 독 하는 한편, 추가적인 자금탈취 사고가 발생하지 않도록 가상자산업권 등에 철저한 관 리 조치를 주문 * 한 바 있다. * ’26.11.2.(월) 금융위·금감원·금보원, DAXA, 주요 가상자산사업자 등과 긴급점검 회의 [ 추진방안 ] 금일 회의에서는 금융권의 ① 보안관리상 허술한 점을 꼼꼼히 바로잡고 , ② 소비자 2차 피해가 없도록 방비를 든든 히 하며, ③ 나아가 AI시대에 걸맞는 “新 보안체계”를 구축 하기 대응방안 을 심도 있게 논의하였다. 첫째, 보안취약점에 대한 빈틈없는 점검과 제도개선에 즉시 착수한다. ① 全금융권 외부접점·내부통제 체계 전면 전수점검 은행·보험·증권 등 전통적 금융업 뿐 아니라, 전금업, 온투업 및「전자금융 거래법」적용대상이 아닌 가상자산업권까지 포함한 全 금융업권 대상으로, 全 IT자산 의 외부접점 (API 등 포함) · 내부통제체계 운영실태 를 신속하고 면 밀히 전수 점검한다. 구체적으로, 全 금융업권 약 580여개사 금융회사·전금업자·가상자산사 업자 등이 전수점검 대상에 포함 되며, ▲홈페이지 등 대고객 서비스뿐 아니라, ▲직원관리, ▲내부업무, ▲제휴업무 등 외부에서 접근가능한 모든 업 무영역 에 대하여, ① 인증·접근통제 시스템 전반, ② 영업·관리목적 API, ③ 개발·테스트 및 임시운영 시스템 등 최근 침해사고가 주로 발생한 시스템 과 그간 관리가 소홀했을 것으로 여겨지는 주변부 시스템까지 포함해 폭넓고 빠짐없이 전수점검을 추진할 계획 이다. 금융회사 보안관리 전반의 내부통제 운영실태 도 점검 한다. CEO·CISO·CIO 등 보고체계·역할분담·의사조율 등에 따라 상시적 보안관제, 중요한 보안인력·시설 투자 의사결정, 침해사고 발생시 신속·면밀한 대응 여부 등이 크게 영향받을 수 있는 만큼, ▲ 각 주요 임원 (CEO·CISO·CIO 등) 의 역할·책임 전반, ▲ 외부접점 생성·운영·폐기 과정에서의 의사결정 절차 , ▲ IT자산 관리대장 운영 여부 등에 대해 촘촘히 점검 하고 필요시 즉각적 보 완을 요청할 방침 이다. 금융회사는 외부접점 전수점검 과정 에서 고객·금융회사의 금전피해로 이 어질 수 있거나 개인정보 유출이 우려되는 중요한 취약점이 확인 되는 경 우 즉시 서비스를 중단하고 외부접근을 차단 하여야 한다. 즉시 보완이 어렵고 중요한 서비스 제공에 직접 관련된 경우에 한해, 면밀한 대체통제 시스템을 갖추고 CEO의 승인 을 받은 엄격한 조건 하 에 서비스 를 재개 할 수 있으며, 이 경우에도 취약점 보완, 장비 교체 등 근본적인 개선조치를 최대한 신속히 취해야 한다. 우선 금융회사가 자체점검을 실시하되, 점검상 문제 없는 경우라도 점검내용, 방식, 판단사유 등 을 상세히 적시 해야 하며, 점검내용이 부실 하다고 판단되거나, 중대한 취약점 이 발견된 경우에는 금융감독원·금 융보안원에서 직접 현장점검 을 실시 할 계획이다. 금융회사들이 금번 전수점검에 성실하게 임하도록 전수점검 과정에서 발견 되는 취약점 이나 그간의 관리 부실사항 에 대해서는 즉각적·면밀한 보 완조치를 전제로 최대한 유연하게 처리 해 나갈 계획이다. 다만, 전수점검 이후에 침해사고 가 발생하는 경우에는 그간의 점검이 제대로 이루어졌는지까지 꼼꼼히 따져 엄정히 책임을 묻도록 할 방침 이다. 관리대장에 등재 되어 있는 시스템상 외부접점 전수점검 은 최대한 신속히 추진하여 11월 30일까지 마무리 지을 계획이며, 관리대장에 등재되지 않은 미등재 시스템 에 대한 전수점검 과 CEO·CISO 등 내부통제체계 전반에 대한 전수조사 도 조속히 추진하여 12월 31일까지 마무리 지을 방침이다. 아울러, 금번에 추진하는 전수점검 결과를 바탕으로 全금융권이 효과 적인 보안 내부통제 시스템을 갖출 수 있도록 ｢ 보안 내부통제 가이드라인 ｣을 ’27.1분기 중 마련·시행 할 계획이다. ② 금융권 공동 해킹 관제시스템 고도화 AI를 통한 침해시도가 빠르고 광범위하게 全금융권을 위협할 가능성이 제기되는 만큼, 각 개별 금융회사 들이 각자 파악한 침해시도 정황·내용 등 을 최대한 신속 하게 全금융업권에 전파 하는 시스템도 신속하게 구축한다. ※ 현재 금감원(FIRST)·금보원(FCTI) 관제시스템이 운영중이나, 금감원·금보원 차원에서 파악한 위협정보만 공유중 구체적으로, 유의미한 공격정보 탐지·공유능력을 갖춘 대형 금융회사 는 자체 관제 관점에서 탐지한 ▲공격방식, ▲공격자 IP, ▲악용된 취약점, ▲ 악성코드 정보 등을 선제적으로 대응할 수 있도록 통합관제시스템 (FIRST) 을 활용 해 全 금융권에 신속히 전파 하고, 이를 공유받은 금융회사들은 자체적인 침해사고 대응, 취약점 보안 등 업무에 이를 적극 활용할 수 있다. 동 시스템 고도화 작업은 12월 중 시범운영을 거쳐, ’27.1분기 중에는 全 금융권이 전면적 으로 활용 할 수 있도록 추진할 계획이다. 가상자산거래소 등 「전자금융거래법」미적용 업권 에 대한 신속한 사고신고·상황전파 대응체계 도 정비한다. 현재 가상자산거래소 등 일부 업권 은 「전자금융거래법」이 적용되지 않아 침해 사고 발생시「정보통신망법」에 따라 KISA에 사고신고를 하고 있으나, 최근의 해킹사고가 금융권 전반에 걸쳐 이루어지고 있으며, 가상자산사업자가 他업 권 등과 밀접한 관계를 가지고 있는 만큼, 효과적 사고조사, 사례전파, 소비자 보호 조치 등을 위해서는 금융감독원·금융보안원 등 이 사고상황을 신속히 전 파 받는 것이 필수적 이다. 이에 동 업권에서 침해사고가 발생할 경우, KISA뿐 아니라 금융감독원· 금융보안원에도 즉시 신고토록 신고대응 가이드라인 을 11월 중 마련 할 계획이다. ③ 금융권 취약점 분석·평가 제도 내실화 全금융권이 상시적으로, 보다 철저히, 빈틈없이 보안관리에 임하도록 취약점 분석·평가 제도 를 촘촘하고 내실있게 개편 한다. 현재 금융회사는 「전자금융거래법」 및 「전자금융감독규정」에 따라 외부기관 (금보원, 민간 보안기업 등) 으로부터 연 1회 이상 전산시스템 의 취약 점 을 점검 받아 금융당국에 제출하도록 의무화되어 있다. 다만, ▲최근 빠르게 변화하는 보안환경·침해위협 등을 고려할 때 점검 주기가 너무 길고 , ▲외부 점검범위가 명시되지 않아 주변부 시스템까지 꼼꼼한 점검이 이루어지지 않으며 , ▲점검결과 보완사항이 발견되더라도 이행할 수단이 마땅치 않은 등 한계점이 지적되어 왔다. 앞으로는, ▲ 대형 금융회사 부터 단계적으로 취약점 분석·평가 점검주기 를 연 1회 → 2회로 단축 하고, ▲전자금융거래와 직·간접적으로 관련된 모든 외부접점 은 취약점 분석·평가 대상 에 포함 하도록 의무화할 계획이다. 아울러, ▲긴급한 취약점 점검 필요성이 있을 경우 금융당국이 수시 로 취약점 분석· 평가를 요구 할 수 있도록 근거를 마련하고, ▲중요한 취약점을 장기간 방치한 경우 금융당국이 시정명령 을 내리고, 미이행시 지속적인 이행강제금 을 부과하는 방안 (「전자금융거래법」개정안 旣발의) 도 적극 추진할 계획이다. 금융회사의 상시적 보안관리 강화가 시급한 만큼 제도개선을 최대한 신속히 추진한다. ▲점검주기 단축, ▲全외부접점을 점검대상 포함, ▲수시평가 등 사항은「 전자금융감독규정 」 개정안 에 포함하여 11월 중 규정변경 예고 를 실시 할 계획이며, ▲이행강제금 제도는 旣 발의된「전자금융거래법」개정안이 연내 국회를 통과할 수 있도록 입법 지원에 만전을 기할 방침이다. ④ 중소형 금융회사 AI해킹 대비 지원 강화 상대적으로 보안 전문인력과 예산이 부족해 급변하는 보안환경과 AI 침해위협에 충분히 대비하기 어려운 중소형 금융회사 를 대상으로 다각적인 보안강화 서비스를 지원 한다. ▲ 금융보안원에서 AI 등을 활용해 중소 금융회사의 외부접점 과 취약요인 을 상시 탐색하 고 위험 우선순위·조치방안 까지 원스톱으로 제공하는 「원스톱 AI방어서비스 」 지원 , ▲금융회사의 보안역량에 맞게 보안조치 내용을 구분·제시 하고, 외부노출자산 목록화·패치 적용기간 선정 등 기본적인 내용을 손쉽게 적용 할 수 있도록 안내하는「 맞춤형 보안 안내서 」등을 지원한다. 아울러, 금융회사가 침해공격의 위험도를 직관적으로 알 수 있도록 단계별 경보체계·행동요령 등도 지원한다. 중소형 금융회사의 보안 수요가 많은 만큼, 금융보안원의 역량을 최대한 활용하여 12월 부터 순차적 으로 신속히 추진 해 나갈 것이다. 둘째, 2차 피해 방지를 위한 든든한 방어체계를 마련한다. ① 다크웹 등 개인정보 유통 모니터링 및 차단 금융권 침해사고로 유출된 소비자 정보가 보이스피싱·명의도용 등 각종 범죄 로 이어지지 않도록 , 불법유통 감시 부터 피해차단 까지 대응체계를 강화한다. 다크웹·텔레그램 등 추적이 어려운 온라인 채널 을 상시 모니터링하여, ▲ 금융권 탈취정보 유통·거래 여부 , ▲금융회사 대상 침해공격 모의정황 , ▲ 새로운 악성코드와 보안 취약점 출현 여부 등을 면밀히 모니터링한다. 탈 취정보의 유통 정황이 포착되면 해당 금융회사에 즉시 통보하고, 실제 개인정보 유출·거래가 확인되면 해당 금융회사를 통해 고객통지, 추가 피해 예방 안내, 피해 보상 등 필요한 조치 가 신속히 이루어지도록 할 계획이다. 개인정보가 불법 유통되는 국내 온라인 채널에 대해서는 관계부처와 긴밀히 협력하여 사이트 차단·폐쇄, 범죄자 검거 등 가용한 모든 수단을 동원해 강력히 대응할 계획이다. ② 보이스피싱 탐지·대응체계 고도화(ASAP 2단계) AI를 활용해 범죄계좌와 의심거래를 조기에 포착내고, 금융회사 간 정보 공유를 확대하는 등 보이스피싱 공동 대응체계 를 한층 강화한다. 유출된 개인정보가 범죄에 악용되면 실제 금융거래나 기관의 안내로 오인하기 쉬운 정교한 사기가 늘어날 수 있다. 이에 지난해 10월 출범한 금융권 공동 보이스피싱 정보공유·분석 플랫폼인「 ASAP * 」의 AI의 분석기능을 강화하여 범죄계좌 를 보다 신속하게 탐지·동결 하는 체계를 구축할 계획이다. * ASAP : AI-based anti-phishing Sharing & Analysis Platform 구체적으로, 금융회사가 범죄여부가 의심되는 거래를 ASAP에 질의하면, AI를 활용해 해당 거래가 보이스피싱에 연루되었을 가능성 을 분석해 점수 (0~100점) 로 제시하는 AI 기반 「의심거래 판단지수 (“피싱지수”) 」 를 11월부터 시범 도입 한다. 금융회사는 이를 통해 범죄가 의심되는 거래의 위험도를 보다 빠르고 정확하게 판단 하여 지급정지 조치 등을 취함으로써, 효과적인 범죄 차단과 소비자 보호 를 해 나갈 수 있을 것으로 기대된다. 특히 그간 인력·자원 등의 한계로 자체 보이스피싱 탐지모델을 적극적으로 개발하기 어려웠던 상호금융, 저축은행 등 중소형 금융사의 탐지역량이 제고 되어 효과적인 소비자 보호가 가능할 것으로 기대된다. 또한 대포계좌와 신종스캠 등 새로운 범죄수법 까지 신속하게 탐지·차단 할 수 있도록 다양한 시나리오를 반영해 공동 탐지룰도 추가해 나간다. 지난 6월 자금 흐름과정의 이상징후, 피해과정에서 보이는 특징 등을 중심 으로 공동탐지룰 추가안 을 마련하였고, 업권별 시뮬레이션 이후 최종안을 확정 하였다. 이를 은행권 및 제2금융권까지 적용 하는 동시에 12월까지 ASAP에 편입 함으로써 진화하는 범죄에 보다 실효적으로 대응 해나갈 예정이다. ③ 보이스피싱 무과실책임 법제화 보이스피싱 피해자를 두텁게 보호하고, 금융회사의 예방 노력을 높이기 위해 범죄 피해 일정 부분을 금융회사가 배상토록 무과실책임 법제화 도 추진한다. 정보유출 등에 따른 보이스피싱 등 2차 피해 우려가 커지고 있는 상황에서 보이스피싱 피해금의 일정부분 을 금융회사가 보상 하는 무과실책임 제도 도입의 목소리가 커지고 있다. 이는 고도로 발전하는 범죄수법으로 피해자 개인의 주의만으로는 범죄예방이 곤란 한 상황에서, 의심거래 탐지·계좌 지급 정지 등 금융사들에 법·제도적으로 부여된 다양한 법적조치 를 통해 금융사 스스로가 책임을 다할 유인구조 를 마련하기 위한 목적이다. 이에 금융위원회는 우선 금융회사부터 보이스피싱 피해자의 피해금의 일정부분을 보상 해줄 수 있도록 旣발의된 ｢통신사기피해환급법｣ 개정안 * 의 신속한 입법을 적극 지원 할 계획이다. 아울러 금융회사의 과도한 부담으로 이어지지 않도록 하위규정 등을 통해 보상대상, 한도, 면책범위 등 구체적인 적용요건 을 정교하게 설계해 나갈 예정이다. * 「통신사기피해환급법」 개정 안(강준현·조인철 의원안) 정무위 계류중(’26.3월~) 또한 통신수단을 매개로 이뤄지는 보이스피싱 범죄 특성, 피해자에 대한 보다 두터운 보호가 필요하다는 점 등을 고려할 때 금융회사 뿐만 아니라 통신사 등에 대한 책임 부여 도 필요하다는 의견이 있는만큼, 이에 대해서도 국조실·과기부 등 관계부처 와 정부 내 공론화를 신속히 추진해 나갈 계획이다. 셋째, “AI 공격은 AI로 방어하는” AI기반 新보안체계를 조속히 구축한다. ① 망분리 규제 전면해제 TF 구성 AI 보안위협이 현실화된 상황에서 망분리 규제를 뛰어넘어 “ AI공격은 AI로 방어하는 新보안체계 ” 마련 논의를 본격화한다. AI를 활용한 해킹 위협에 대응하려면 내부망과 외부망을 분리하는 기존 방식에서 나아가, AI로 공격을 탐지하고 차단하는 보안역량을 갖춰야 한다. 이에 「 망분리 규제 전면해제 TF 」를 본격 가동하여 금융권의 AI 활용을 뒷받침하면서도 보안 수준을 높일 수 있는 방안을 마련할 계획이다. TF에는 정부, 유관기관, 민간전문가, 全금융권 담당임원 등 각계 전문가· 이해관계자 등으로 구성할 계획이며, ▲ 데이터의 중요도 에 따른 관리·보호 체계 , ▲모든 접근을 지속적으로 확인·검증하는 ‘ 제로트러스트’ 등 대체 보 안수단 , ▲ CEO·이사회·CISO의 역할과 책임 , ▲침해사고 발생 시에도 핵심 서비스를 유지하기 위한 업무연속성 확보방안 등을 심도 있게 논의하여 구체적인 방안을 조속히 마련 할 계획이다. ② 보안목적 AI 테스트 상시화 및 혁신금융서비스 확대 금융회사가 보안강화에 AI 를 상시 활용할 수 있도록 제도를 정비 하고, 혁신금융서비스 통한 망분리 규제 완화도 일관 되게 추진 한다. 현재, 비조치의견서를 통한 긴급조치 차원에서 진행 중인 보안목적 AI·SaaS 활용 을 위한 망분리 규제 완화 조치를 상시 제도화 한다. 이를 통해 보다 많은 금융회사들이 상시적으로 AI를 적극적으로 활용해 보안 취약점 탐색·보완과 새로운 보안서비스를 적극 활용할 수 있을 것으로 기대된다. 다만, 망분리 규제 예외 허용이 또 다른 보안 취약요인으로 작용하지 않도록 외부접점 관리, 인증·접근통제 관리, 보안사고·장애대응 등 대체통제 수단을 철저히 마련 하도록 할 계획이다. 아울러, 다양하고 새로운 IT서비스에 대한 망분리 규제 완화 도 혁신금융 서 비스 등 을 통해 일관되게 추진 한다. 이미 제도화된 업무용 SaaS 나 생성 형 AI 서비스 이외에도 블록체인 등 다양한 IT서비스 가 혁신금융서비스 심사 를 통해 망분리 규제 예외 로 인정 될 수 있도록 해 나갈 계획이다. ③「디지털금융 안전법」추진 AI 해킹위협 현실화, 디지털 혁신 가속화 등 급변하는 보안환경에 맞춰 全금융권과 유관업종 등에 치밀한 전산보안 규율 이 확립될 수 있도록 「디지털금융 안 전법」 마련도 추진한다. AI 해킹위협과 디지털 혁신으로 금융서비스의 연결구조가 복잡해지는 만큼, 금융회사뿐 아니라 고객정보와 금융거래 에 영향을 미치는 관련 업종 까지 보안관리 체계 를 촘촘히 갖출 필요가 있다. 이에, 가상자산사업자, 보험대리점(GA) 등 대량의 고객정보 를 보유하거나 , 침해사고 발생 시 고객의 직접적 자산손실 우려 가 큰 업종 등에 대해 현 「전자금융거래법」 수준의 보안규율 을 적용 하는 방안을 추진한다. 또한, 클라우드 사업자, 플랫폼 등 금융회사는 아니나, ▲ 다수 금융회사와 연계 되고, ▲ 다양한 업무 위수탁 관계를 통해 다량의 정보를 처리하거나, ▲침해사고시 파급영향 등이 있는 제3자 에 대한 규율체계 마련을 검토한다. 아울러, 금융회사 스스로 상시적으로 철저히 보안관리에 임할 수 있도록 CEO 책임성·이사회 구성·현업부서 역할 등 보안 거버넌스와 내부통제 차원의 규율도 검토해 나갈 계획이다. 「디지털금융 안전법」은 금융업권, 관계기관 등 여러 의견수렴 등을 거쳐 방안을 마련하고 ’27.1분기 중으로 법안 마련을 추진한다. 이억원 금융위원장은 “ 고객의 정보와 재산을 지키지 못하는 금융회사 는 이미 그 존재가치를 잃은 것 ”이라고 강조하며, “하루가 다르게 진화하는 보안위협에 맞서 금융의 생명과도 같은 국민의 정보와 재산을 지켜내는데 그 어떠한 인적·물적 투자도 아껴서는 안 된다 .”고 하였다. 나아가, “ 全 금 융권 CEO분 들은 절체절명의 위기상황임을 명확히 인식 하고 전사적인 비상대응반을 즉시 구성 하여 정부에서 준비한 전수점검 계획과 제도개선 과제에 맞추어 긴밀한 상황대응 과 튼튼한 보안체계 마련 에 사력을 다해주 길 바란다.”며 당부하였다. 아울러, “최근 금융권에서 잇따라 발생한 침해사고는 우리 금 융시스템의 보안체계 전반 을 근본적으로 전환 해야 한다는 엄중한 경고 ”라고 강조하며, “ 작은 보안 취약점 하나 가 금융회사 전체 는 물론, 금융시스템의 신뢰를 훼손 할 수 있는 상황”이라고 하였다. 마지막으로, “기존의 보안관리 방식과 관행에 서 벗어나 보안체계를 전면적으로 쇄신 해야 할 때”라고 하며, “ 全 금융권 CEO와 관계자분들은 국민 여러분이 맡겨주신 정보와 재산 을 목숨 걸고 지켜낸다는 각오 로 우리 금융권의 신뢰를 회복해야 한다”고 당부하였다. ※ [별첨] 1. 금융위원장 모두말씀 2. 全금융권 보안체계 혁신방안", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "「월간 기업가치 제고 현황(‘26.10월)」 발표", "department": "", "date": "2026-11-05", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115884", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "유가증권시장 매도사이드카(프로그램매매 매도호가 효력정지) 발동", "department": "", "date": "2026-11-05", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115885", "summary": "첨부 참조", "essential": true, "importanceReasons": ["price rules / circuit breakers (+3)", "market-operations source (+1)"], "market": true, "tier": "essential"}, {"source": "MOFE", "title": "권대영 1차관, 「기업활력 제고 TF」 첫 회의 개최", "department": "기업환경과", "date": "2026.11.05.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079863&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "기업지배구조보고서 공시를 통해 상장회사의 주주보호와 주주환원 노력을 확대해 나가겠습니다.", "department": "공정시장과", "date": "2026-11-05", "url": "https://www.fsc.go.kr/no010101/88091", "summary": "기업지배구조보고서 공시 를 통해 상장회사의 주주보호 와 주주환원 노력 을 확대해 나가겠습니다. - 「기업지배구조보고서 가이드라인」 개정 - ✔ 집중투표제, 소수주주 보호 등 개정 상법 취지 반영 ✔ 배당, 자사주 소각 등 주주환원 정책 에 대한 공시 강화 ✔ ’27년 에 제출하는 기업지배구조보고서부터 적용 예정 금융위원회 (위원장 이억원) 과 한국거래소 (이사장 정은보) 는 11.6일 상장회사의 주주보호 강화 및 적극적 주주환원 을 유도 하기 위한 「기업 지 배 구조보고서 가 이드라인」 개정방안 을 발표 하였다. 기업지배구조보고서는 기업의 지배구조 현황과 주주권익 보호를 위한 정책 등을 투자자에게 제공하는 핵심 공시 수단 * 으로 ’17년 한국거래소 자율 공시 로 처음 도입된 이후 공시대상이 단계적으로 확대되어 ’26년부터는 모든 코스피 상장회사 (’26.10월말 기준 826개사) 가 공시 를 하고 있다. * G20/OECD 기업지배구조원칙, ESG기준원의 ESG모범규준 등을 바탕으로 한국거래소 에서 핵심원칙 10개, 세부원칙 28개를 선별하여 그 준수여부를 공시하고, 준수하지 못하는 경우 그 사유를 설명하는 방식(Comply or Explain) 이번 개정은 기업지배구조 관련 정보의 투명성을 높이고 주주 및 투자자가 의사결정 및 주주권 행사 과정 에서 필요한 정보를 충분히 제공 받을 수 있도록 하는 데 중점을 두었으며, 주요 내용은 다음과 같다. ➊ 상법 개정 내용 반영 및 집중투표제 우회 방지 `25.9월 상법 개정으로 자산총액 2조원 이상 상장회사 가 2인 이상의 이사를 선임 하려는 경우 집중투표제를 실시하는 것이 의무화되었다. 다만, 최근 일부 상장회사들이 이사 의 인원수를 줄이거나 임기를 조정함 으로써 집중투표제 실시 의무를 회피하려 한다는 의혹이 제기된바 있다. 이에 따라 개정 가이드 라인은 집중투표제 실시 여부에 대한 공시와 함께, 이사의 인원수, 임기 등에 대한 변경이 있는 경우, 그 사유 및 집중투표제에 미치는 영향 을 추 가로 기재 하도록 하여 개정 상법을 우회하는 행태를 방지할 수 있도록 하 였다. ➋ 주주보호 정책 공시 강화 또한, 중복상장 이나 유상증자 의 경우 주주가치 훼손에 대한 우려가 지 속적 으로 제기 됨에 따라, 회사가 중복상장, 유상증자 등을 추진하는 경우 주 주보호를 위한 조치 및 의사결정과정에서 소액주주 등 주주와의 소통내역 을 공시하도록 한다. 특히, 기존 주주의 지분희석 우려가 발생할 수 있는 유상증자 가 있었거나 계획 이 있는 경우 제3자 배정 여부, 증자규모, 할인율, 자금사용목적, 지배 주주 취득여부 등 구체적인 내용을 기재하도록 하여 주주들이 이를 바탕으로 합리적인 판단을 내릴 수 있도록 개선한다. ❸ 주주총회 2주 전 사업보고서 제출 유도 주주들이 주주총회 안건을 충분히 검토하고 의결권을 행사할 수 있도록 주주총회 관련 정보의 조기 제공을 유도 한다. 현재 사업보고서의 경우 대부분의 상장회사들이 주주총회가 임박한 1주일 전에서야 공개하고 있다. 금융위원회와 한국거래소는 사업보고서가 주주들에게 최소한 주주총회 2주 전까지는 제공될 수 있도록, 기업지배구조 보고서에 사업보고서 제출일자를 기재하도록 하고, 주주총회 2주 전까지 사업보고서를 제출하 지 못한 경우에는 그 사유를 설명 하도록 하였다. 향후 기업들의 이행 및 공시 현황 추이를 보아가며 ‘주주총회 2주전 사업보고서 제출여 부’를 기업지배구조보고서 핵심지표로 포함하는 방안 에 대해서도 검 토 해나갈 예정이다. ❹ 주주환원 공시 강화 주주가 투자 대상회사의 주주환원 현황 및 정책 을 보다 쉽게 확인하고 개선경과를 비교할 수 있도록 배 당과 자기주식 관련 정보제공 을 확대 한다 . 주주가 주주제안을 통해 배당정책에 대한 개선요구 를 하기 위해서는 상 법상 주주제안 기한인 주주총회 6주 전에는 배당금액 등 주요정보가 공개 되어야 하나, 통상 주주총회 소집 통보는 2주전, 사업보고서 공시는 1주 전에 이루어짐에 따라 주주권을 행사하는 데에 한계가 있었다. 이에 따라 앞으로는 주주들이 배당금액 등 주요정보 를 미리 확인하고 합리적 인 수준에서 주주제안 을 할 수 있도록 결산배당여부와 배당금액 등 에 대한 정보를 주주제안 가능시기 (주주총회 6주 전) 에 공시했는지 여부를 기업지배구조보고서를 통해 공시하도록 하였다. 뿐만 아니라 , 자기주식의 취득·소각·보유 에 관하여 당해 연도뿐만 아니라 최근 3년 의 정보를 기재하도록 하여 투자자가 관련 현황 및 개선 정도를 쉽 게 확인･비교할 수 있도록 하였다. 이를 통해 주주환원 정책에 대한 시장의 감시기능이 강화될 것으로 기대된다. 금융위원회 및 한국거래소는 이번 가이드라인 개정사항이 `27년 제출되는 기업지배구조보고서에 충실히 반영될 수 있도록 `26년 11월부터 제출 대 상 상장법인 공시담당자 대상 1:1 컨설팅, 교육 및 설명회 등 지속적인 지원 을 적극 추진해나갈 계획이다. ※ 개정된 가이드라인은 한국거래소 전자공시시스템 * 에서 조회 가능 * http://kind.krx.co.kr > 정보실 > 자료실", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSS", "title": "포용금융, 이제 차주의 체감성과도 살펴보겠습니다", "department": "중소금융감독국/여신금융감독국", "date": "2026-11-05", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249746&menuNo=200218&pageIndex=1", "summary": "□ ’26.11.5.(목) 금융감독원은 김성욱 부원장 주재로 중소금융업권, 학계, 유관기관(서민금융진흥원, 서민금융연구원)과 함께 「중소금융업권 포용금융 체감성과 측정,환류 TF」 킥오프 회의를 개최\nㅇ 금번 TF는 그간 자금공급 실적 위주로 평가하던 포용금융의 성과를 차주가 체감하는 ‘삶의 질 변화’ 관점에서 측정하고 그 결과를 상품설계 등에 환류하는 체계를 마련하기 위해 구성\nㅇ 첫 회의에서는 중소금융업권 차주 체감성과 측정,환류체계 구축방안 및 TF 운영계획을 논의\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": 은 최근 금융회사 에서 개인정보 유출사고 가 잇따라 발생하면서 보이스피싱 , 스미싱 등 피 해 예방을 위해 신속하게 소비자경보(주의, 10.6.) 를 발령 * 하고, 금융권과 공동으로 「 개인정보 유출 2차 피해 특별대응기간 」 (10.6.~11.5.) 을 운영해왔다. * 「 최근 금융권 개인정보 유출사고에 따른 보이스피싱·스미싱 등 피해에 주의하세요.」 금융당국 은 금융권 과 긴밀한 협력체계 를 구축하여 정보유출 관련 2차 피해 발생 여부 를 계속 모니터링 하고 있다. 금융권은 정보유출 고객 전담 상담창구 를 운영하고 유출고객 대상으로 강화된 이상거래 탐지체계 를 운영 하는 등 소비자 피해 예방을 위해 적극 대응하고 있다. 한편 11.6. 현재까지 최근 금융회사의 개인정보 유출 사고와 관련하여 보이스피싱, 스미싱 등으로 고객 자금 이 유출된 피해 사례 는 보고되지 않았다 . 이에 기존의 소비자경보 는 ‘ 주의 ’ 단계를 유지 하기로 하였다. 금융권의 피해예방 조치 주요사례 구 분 관련내용 ➊ 피해고객 전담창구 운영 · 유출고객 대상 안내 및 유의사항 메시지 발송 · 유출고객 전용 상담센터 운영 등 ➋ FDS 모니터링 강화 · 유출고객 대상 강화된 이상거래 탐지 실시 · 유출고객이 고액 이체시 즉시 본인확인 실시 등 ➌ ASAP 활용 공동 대응 · 이상거래 확인시 ASAP에 신속히 공유 등 ➍ 피해구제 관리·감독 · 유출고객에 피해 발생시 피해구제 신속 접수 및 감독당국 보고체계 마련 · 유출고객 대상 보험 가입 지원 등 ■ 개인정보 유출 2차 피해 특별대응기간 연장 및 향후 계획 다만 최근에도 금융권에서 개인정보 유출사고가 추가로 확인 되는 등 금융 소비자 피해 우려가 있어, 지속적인 피해예방 조치를 위해 당초 11월 5일 까지였던 특별대응기간 을 12월 말까지 연장 하여 운영하기로 하였다. 특별대응기간 연장에 따라 금융회사들은 기존의 피해예방 조치를 지속 시행하는 한편, 개인정보 유출이 추가 확인된 금융회사 에 대해서는 유출 정보의 종류와 범위 등을 고려하여 예방조치 를 실시하도록 할 계획이다. 금융당국 은 금융회사별 예방조치 이행 상황 을 지속 점검 하고, 보이스피싱 등 이상징후 가 확인되는 경우 신속히 대응 하는 등 금융소비자 보호에 만전을 기할 계획이다. ■ 소비자 당부사항 금 융소비자들은 출처가 불분명한 문자메시지 의 인터넷주소(URL) 를 클릭 하지 않도록 유의하고, 의심스러운 전화는 즉시 끊고 필요시 상담 (국번없이 ☏1394 )을 통해 확인할 필요가 있다. 아울러 금융거래 안심차단서비스 등 피해예방 수단을 적극 활용할 필요가 있다. ※ ｢개인정보 유출 관련 소비자 행동요령｣ : (붙임1) 참고 ｢금융거래 안심차단서비스 가입방법 등｣ : (붙임2) ~ (붙임7) 참고", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "현재 유포되고 있는 부동산 대책 관련 게시글의 보도에 유의하여 주시기 바랍니다.", "department": "금융정책과", "date": "2026-11-06", "url": "https://www.fsc.go.kr/no010101/88099", "summary": "현재 유포되고 있는 부동산 대책 관련 게시글의 보도에 유의하여 주시기 바랍니다. □ 현재 인터넷 상에 유포되고 있는 부동산 대책 관련 내용은 사실이 아니며 , 유사한 내용의 게시글에 대해 금년 2월, 6월 및 10월에 이미 위계에 의한 공무 집행 방해 등의 범죄 혐의로 수사 의뢰하여 수사가 진행 중입니다. □ 정부는 금번 유포 행위에 대해서도 추가적인 수사 의뢰 조치를 할 예정이며, 향후 유사 사례 발생 시에도 강력 대응할 계획임을 알려드리니 관련 보도에 유의하여 주시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": 리아 핀테크 위크 2026」 이 서울 양재 aT센터 에서 막을 올린다 . 올해로 8회째 를 맞는 이번 행사는 ‘ 다음 금융은 이미 시작됐다 (Beyond Finance, Into the Future)’ 를 주제로, AI 에이전트와 디지털자산 등 첨단 기술 이 금융의 구조와 서비스 를 어떻게 바꾸고 있는지 살펴보고 미래금융의 새로운 가능성 을 모색한다. 이번 박람회는 36개 프로그램과 115개 부스 140개 기업․기관 이 참여하는 역대 최대 규모 로 열리며, 일자별 주요 관람객의 수요 에 맞추어 다채로운 프로그램 을 제공할 계획이다. 1일차(11/25) 는 AI 등 기술발전과 함께 변화 하 는 글로벌 금융트렌드와 금융정책 을 조망하는 디지털금융 DAY , 2일차 (11/26) 는 핀테크 기업의 성장 을 돕는 비즈니스 DAY , 3일차(11/27)는 국민 일상 과 가까운 주제인 투자․재테크, 일자리 등 을 다루는 국민참여 DAY 로 마련되었다 . \u003c 행사 개요 > ▪ 일시/장소 : ’26.11.25일(수) ~ 11.27일(금) / 서울 양재 aT센터 ▪ 주제 : 다음 금융은 이미 시작됐다 (Beyond Finance, Into the Future) ▪ 주요 행사내용 - 개막행사 : 금융위원장 환영사, 국내·외 연사의 축사 및 기조연설 - 프로그램 : 일자별 주요 관람객 수요에 맞춘 다채로운 프로그램 제공 * ① 디지털금융 정책, ② 핀테크 기업 성장, ③ 투자·재테크 및 일자리 - 전시관 : ① 핀테크관, ② 금융관, ③ 글로벌관, ④ 협력관 4개의 공간으로 구성, 총 115개 부스에서 140개 기업·기관의 핀테크 서비스와 기술 홍보 - 부대행사 : 핀테크기업을 위한 비즈니스 기회, 스탬프 투어 및 도슨트투어, AI 티셔츠 제작 체험 등 체험형 프로그램 2 주요 행사내용 안내 (1) 개막행사 및 투자 MOU 체결식 개막행사 는 이억원 금융위원장의 환영사 로 시작된다. 이후 영국 의 콜린 크룩스 (Colin Crooks) 한국대사 , 호주 의 제임스 켈리 (James Kelly) 재무부 차관보 등 국내외 연사들의 축사 가 이어진다. 다음으로, 글로벌 결제 기술 기업 VISA의 토드 폭스 (Todd Fox) VISA 경제역량강화연구소 대표 와 우리 나라 핀테크 산업 생태계 조성을 지원하는 한국핀테크지원센터 김건 이사장 등이 AI 발전이 결제 시장 등 금융서비스에 가져올 변화와 새로운 기회 를 조명하고, 우리나라 핀테크 산업 이 나아갈 미래 방향 을 제시할 예정 이다. 당일 오후에는 핀테크 기업 대상 투자 MOU 체결식 이 개최된다. 신진창 금융위원회 부위원장의 축사 를 시작으로, 핀테크 기업과 모험자본간 투자 의향을 확인하는 양해각서(MOU) 를 체결한 다. 투자 MOU 체결식에는 양해각서 체결 기업 외에도 투자 유치를 희망하는 우수 핀테크 기업과 국내외 벤처캐피탈, 기관투자자 및 해외투자자 등이 참가하여 후속투자 유치 로 확산할 계획이다. (2) 프로그램 올해 박람회는 일자별․분야별 테마에 따라 36개 프로그램 을 구성하여, 관람객 들이 관심분야에 따라 원하는 프로그램 을 선택 하여 참여할 수 있도록 구성 하였다. 또한, 금융현장의 생생한 목소리 를 전달하고자 민간기업의 참여를 확대 하였다. 일자별 로는 글 로벌 금융트렌드 및 금융정책 , 핀테크 기업의 성장 을 위한 투자 및 네트워킹, 투자․재테크 및 취업 등의 테마를 마련하였고, 분야별 로는 DX·AX, 금융정책 공유, 재테크, 취업, 핀테크 투자, 핀테크 지원, 기술 트렌드 등 7개 분야에 대한 프로그램 이 제공된다. 1일차 (11/25, 디지털금융 DAY)에는 주로 금융 DX·AX 분야와 글로벌 금융 정책 을 조망하게 된다. AI 발전과 디지털 전환 이 금융산업을 어떻게 혁신 해나가는지 다양한 세미나가 마련되어 있고, 핀테크 육성과 국제협력을 주도하는 GFTN( Global Finance & Technology Network) 이 글로벌 금융혁신과 AI 거버넌스, 국경간 결제 인프라, 아시아 금융 연결망 과 글로벌 진출방안 등에 대해 발제한다. 2일차 (11/26, 비즈니스 DAY)에는 핀테크 투자와 지원방안, 기술 트렌드 와 관 련한 다양한 세미나가 제공된다. 핀테크 기업들이 기술을 선보이고 투자 유치를 지원하는 투자밋업 과 다양한 기관들이 제공하는 핀테크와 스타트업 을 위한 지원 프로그램 이 안내된다. 또한 기술 트렌드 분야에서는 AI 기반 새로운 지급결제 방식, 금융 보안, 양자컴퓨팅 등 금융과 기술의 융합에 따른 최신 동향을 다룰 예정이다. 3일차 (11/27, 국민참여 DAY)에는 투자, 재테크, 취업지원 등 국민생활 밀착형 프로그램 이 제공된다. 재테크 분야에서는 디지털 자산 투자 전략과 연금관리, 핀테크 기반 생활투자 서비스 를 소개하며, 취업지원 분야에서는 빅테크·금융사의 채용 동향 과 직무별 정보, 멘토링 을 제공해 취업 준비생의 진로 탐색을 돕는다. 올해 박람회는 민간기업의 참여 를 보다 확대 하였다. 먼저, 공개모집을 통해 선정 된 LG CNS, 비바리퍼블리카, 뱅크샐러드 등이 직접 세미나를 기획 ․운영 하여 최신 기술동향과 자신들의 서비스 혁신 경험을 공유한다. 또한, Open AI, IBM, LG AI 연구원, 삼프로 tv 등 시장 인지도가 높은 민간기관 도 섭외하여 다양한 의견 을 공유 하는 장을 마련할 계획이다. (3) 전시관 올해 전시관은 총 115개 부스에 140개 기업 ․ 기관이 역대 최대 규모 로 참여하여 핀테크관·금융관·글로벌관·협력관 등 4개 전시관 으로 구성된다. 국내외 핀테크 기업들과 금융회사, 유관기관들이 한자리에 모여 관람객들에게 최신 금융기술과 서비스를 선보일 예정 이다. 핀테크관 (72개 부스)는 8개 * 다양한 분야의 국내 핀테크 기업들이 혁신적인 서비스와 기술 을 선보인다. 관람객은 금융 분야에 적용된 최신 기술을 직접 체험하고, 핀테크 서비스의 변화와 발전 방향을 확인할 수 있다. * 분야: ① 결제·송금·외환, ② AI·데이터·업무자동화, ③ 투자·자산관리, ④ 인증·보안·레그테크, ⑤ 블록체인·기타, ⑥ 인슈어·레그테크·리스크관리, ⑦ 프롭테크·생활금용, ⑧ 대출·신용·기업금융 금융관( 8개 부스) * 는 은행·카드 등 다양한 금융 분야에서 핀테크와 AI를 활용한 금융서비스와 기술을 소개하며, 향후 출시될 새로운 서비스와 금융 기술을 미리 체험 할 기회 를 제공한다. * 참가 금융사: 신한금융지주, 하나금융그룹, iM금융지주, KB금융지주, 삼성카드(모니모), 우리금융그룹, NH농협금융지주, IBK기업은행 글로벌관 (23개 부스 ) 는 미국을 포함해 12개 국가가 참여하여 각국의 기술과 혁신 사례 를 공유한다. 이를 통해 국가별 핀테크 산업의 특징을 한눈에 비교하고, 해외 시장 진출에 필요한 정보와 협력 기회를 모색할 수 있을 것으로 기대된다. 협력관 (12개 부스)는 금융 유관기관, 핀테크 지원기관, 산업 협회, 대학 및 투자·지역 창업지원기관 등이 참여한다. 기업 육성과 사업화를 위한 정보를 제공하고, 관련 지원 프로그램 등을 안내하여 핀테크 기업들이 사업 성장에 필요한 지원 정보 를 얻고 다양한 협력 기회 를 모색할 수 있을 것으로 기대된다. * 참가 기관: 핀테크산업협회, 서울핀테크랩, IBK 1st랩, 고려대학교 기술지주, 전북창조경제 혁신센터 등 (4) 부대 행사 세미나 외에도 핀테크 기업의 사업 기회 확대와 관람객의 참여를 위한 다양한 프로그램이 마련된다. 먼저 핀테크 기업의 홍보 및 네트워킹 프로그램 이 상시 운영 된다. IR 오픈스테이지 에서는 핀테크 기업이 자사의 서비스와 솔루션 등을 소개하고 자유롭게 홍보할 수 있는 기회를 제공되며, 관심있는 기업들간 협업을 촉진하기 위해 기업정보를 교환하고 미팅을 신청할 수 있는 비즈니스 밋업 도 운영된다. 관람객 들을 위한 투어와 체험형 프로그램 도 운영된다. 일반 관람객이 참여하여 박람회장 곳곳을 둘러 볼 수 있는 모바일 스탬프 투어 와, 학생과 기업 단체 등이 신청하여 안내자의 설명과 함께 전시관을 다채롭게 즐길 수 있는 도슨트 투어 가 마련되었다. 또한, AI 티셔츠 제작 프로그램 에서는 인공지능 기술을 활용해 개성 있는 디자인을 제작하고, 이를 티셔츠에 담아보는 체험을 제공하여 관람객들이 신기술을 친숙하게 접하도록 한다. ※ 「코리아핀테크위크 2026」 공식 홈페이지( https://www.fintechweek.or.kr )를 통해 비즈니스 밋업, 오픈 스테이지, 도슨트 투어 신청 가능 3 관람 안내 ｢ 코리아 핀테크 위크 2026 ｣ 입장․관람은 무료 이며, 행사와 관련된 자세한 정보 는 공식 홈페이지 를 통해 확인할 수 있다. ※ 박람회 관련 안내·문의 ☞ 공식 홈페이지: https://fintechweek.or.kr/ ☞ 운영 사무 국: ☎ 02-424-5821 :  fintechweek@fintech.or.kr", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "제19회 아시아 고위공무원 초청연수 실시", "department": "금융협력과", "date": "2026.11.09.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079901&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "상장사 대상 '2026년도 찾아가는 불공정거래 예방교육' 실시", "department": "조사1국/조사2국/조사3국/조사4국", "date": "2026-11-09", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249775&menuNo=200218&pageIndex=1", "summary": "□ 금융감독원은 매년 상장사를 대상으로 주요 위반사례를 위주로 불공정거래 예방교육을 실시하여 상장사들의 임직원 관리,감독활동을 지원\nㅇ 상장사 임직원은 일반 시장참여자들에 비해 회사 내부정보에 대한 접근성이 높기 때문에 불공정거래 규제를 위반할 우려가 높으며,\nㅇ 고의적인 위법 행위 뿐만 아니라 관련 규정에 대한 이해 부족이나 부주의로 인해 불공정거래가 발생할 가능성도 있는 만큼\nㅇ 금번 교육을 통해 상장사 임직원이 관련법규와 주요 위반사례를 충분히 이해하고 관련 규제를 준수할 수 있도록 지원할 계획\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KOSCOM", "title": "[코스콤정보분배] 장외채권거래내역(J6077) 수신 및 송신 지연 안내", "department": "전체 공지", "date": "2026-11-09", "url": "https://data.koscom.co.kr/notice/110750/notice-detail", "summary": "1. 귀사의 무궁한 발전을 기원합니다.\n2. 2026.11.09(월) 13:21 이후로 금융투자협회에서\n장외채권거래내역(J6077)을 수신 하지 못하고 있어\n공지 드립니다.\nPS. 정상화되면 재 공지 드리겠습니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSS", "title": "보이스피싱 피해로 멈춘 일상, 금융권이 '다시, 일상으로' 이어드립니다", "department": "금융사기대응단", "date": "2026-11-09", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249776&menuNo=200218&pageIndex=1", "summary": "□최근 보이스피싱 피해건수는 감소*하는 추세이나, 그 수법은 피해자를 장기간 심리적으로 지배(‘가스라이팅’)하는 형태**로 진화하여\n* 2026.上 발생건수 7,033건(전년 동기 대비 △61.0%), 피해액 3,276억원(전년 동기 대비△52.3%)\n**(예) 검찰,금감원 등을 사칭해 공포심을 조성한 후, 피해자를 숙박업소 등에 스스로 고립 및 외부와 연락을 차단시키고 일상을 통제하며 수일~수주에 걸쳐 금전을 편취\n?피해자는 생활 및 노후자금을 잃는 금전적 손실뿐 아니라 자책감, 불안 등 심리적 피해를 겪으며 심각한 위기에 이르는 사례도 발생\n□이에 따라, 금융감독원 등 5개 기관은 보이스피싱 피해자가 금전적,심리적 피해를 딛고 조속히 일상에 복귀하도록 돕는 데 뜻을 모아,\n??긴급 생계비 지원, ?전문 심리상담 서비스 지원 등을 주요 내용으로 하는 업무협약(MOU)을 체결하고 피해자 지원사업을 시범 실시\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "KOSCOM", "title": "[코스콤정보분배] 장외채권거래내역(J6077) 수신 및 송신 정상화 안내", "department": "전체 공지", "date": "2026-11-09", "url": "https://data.koscom.co.kr/notice/110751/notice-detail", "summary": "1. 귀사의 무궁한 발전을 기원합니다.\n2. 2026.11.09(월) 14:55 이후로 금융투자협회에서\n장외채권거래내역(J6077)을 정상 수신 및 분배하고 있습니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "㈜바로팜 코스닥시장 신규상장", "department": "", "date": "2026-11-09", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115907", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "코스닥 상장예비심사 신청서 접수", "department": "", "date": "2026-11-09", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261115908", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_GLOBAL", "title": "(Press Release) October 2026 Value-up Monthly Report", "department": "정재윤 · KRX", "date": "2026-11-09", "url": "https://global.krx.co.kr/board/GLB0203000000T1/bbs#view=20896", "summary": "The Korea Exchange (KRX, Chairman & CEO Eun Bo Jeong) releases the Value-up\u003cbr/>Monthly Report for October 2026 with the aim of providing an overview of list .11.10.(화) 이찬진 금융감독원장은 상장법인의 외부감사를 담당하고 있는 8개 회계법인 CEO 및 전문가 간담회를 개최하여\nㅇ 자본시장의 신뢰와 회계투명성 제고를 위한 향후 감독방향을 공유하고, 업계 건의사항을 청취하는 등 소통의 자리를 마련\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "건설노동자, 플랫폼노동자와 프리랜서에 대한 포용금융으로 금융이용 문턱 낮아진다", "department": "금융데이터정책과,은행과", "date": "2026-11-10", "url": "https://www.fsc.go.kr/no010101/88110", "summary": "건설노동자, 플랫폼노동자와 프리랜서에 대한 포용금융으로 금융이용 문턱 낮아진다 - 금융위원회·고용노동부·금융감독원 및 금융·노동 유관기관, 11월 11일 포용금융 확대를 위한 업무협약 체결 - 노동 ·노무제공 이력의 금융 활용, 맞춤형 금융상품 개발, 채무조정 지원 등 협력 금융위원회 (위원장 이억원), 고용노동부 (장관 김영훈), 금융감독원 (원장 이찬진)은 11월 11일(수) 건설근로자공제회에서 은행연합회, 신용정보원, 건설근로자공제회, 근로복지공단, 노동단체 및 노동공제단체 등과 함께 「 건설근로자 및 노무제공자 포용금융을 위한 업무협약 」을 체결했다. \u003c건설근로자 및 노무제공자 포용금융을 위한 업무협약식 개요 > ○ 일시 : ’26. 11. 11.(수) 14:00 ~ 15:00 ○ 장소 : 건설근로자공제회 본부 (서울 중구 남대문로 109) ○ 참석 : (정책·감독당국) 금융위원회, 고용노동부, 금융감독원 (유관기관) 전국은행연합회, 한국신용정보원, 근로복지공단, 건설근로자공제회, 한국노총 한국건설노동조합연맹, 민주노총 전국건설산업노동조합연맹, 한국플랫폼프리랜서노동공제회, 노동공제연합 풀빵 ○ 협약내용 : 건설근로자 및 노무제공자의 금융지원 확대를 위하여 대안 정보를 활용한 금융상품 개발 및 대안신용평가 추진, 경제적 재기 지원 등 이번 협약은 건설근로자 와 플랫폼·프리랜서 등 노무제공자 의 금융 접근성 을 높이고 금융 이용 과정에서 발생하는 애로사항 을 해소 하기 위해 마련됐다. 건설근로자와 노무제공자는 소득이 일정하지 않고 고용형태가 다양 해 금융회사의 신용평가 및 대출심사 과정에서 어려움 을 겪는 경우가 있다. 특히 실제 근로 및 노무제공 활동을 통해 소득을 얻고 있음에도 이러한 이력 이 금융 분야에서 충분히 활용되지 못하는 한계 가 있었다. 이에 정부와 금융권, 노동계 및 유관기관은 각 기관이 보유한 전문성 과 정보 를 연계 하여 건설근로자와 노무제공자의 특성을 반영 한 금융지원 체계 를 구축하기로 뜻을 모았다. 이번 업무협약의 주요 내용 은 다음과 같다. 첫째, 근로·노무제공 이력을 활용 한 대안신용평가 기반 을 마련한다. 건설근로자공제회 와 근로복지공단 등이 보유한 건설근로자의 공제부금 납부이력 과 노무제공자의 활동 이력 등 다양한 비금융정보를 금융 분야에 활용 할 수 있는 방안을 모색한다. 이를 통해 금융회사의 신용평가 와 대출 심사 등에 근로 및 노무제공 이력이 합리적 으로 반영 될 수 있도록 협력한다. 둘째, 건설근로자·노무제공자 특화 금융상품 과 서비스 를 발굴한다. 소득의 불규칙성과 고용형태 등 대상자의 특성을 고려한 맞춤형 금융상품 및 금융서비스 를 개발·확산 하고, 금융 이용 기회 를 확대 하기 위해 노력한다. 셋째, 금융애로 해소 와 경제적 재기 를 지원 한다. 금융회사 자체 채무조정과 신용회복위원회 등 유관기관의 채무조정 제도 연계 를 활성화 하고, 금융상담과 재무상담 등 금융 관련 지원 을 강화 한다. 아울러 금융교육 을 통해 건설근로자와 노무제공자의 금융역량 을 높이는 방안도 모색한다. 넷째, 금융지원제도 안내·홍보 와 현장 중심 의 제도개선 을 추진한다. 노동단체와 노동공제단체 등은 소속 근로자와 노무제공자에게 금융지원 제도 를 적극 안내 하고, 현장에서 발생하는 금융 수요 와 애로사항 을 관계기관과 공유 한다. 관계기관은 이를 바탕으로 신규 금융지원 과제 를 발굴 하고 기존 제도 의 개선 을 추진한다. 이번 협약은 금융위원회·고용노동부·금융감독원 간 정책적 협력 과 은행 연합회·신용정보원 및 건설근로자공제회·근로복지공단·노동단체‧노동공제단체 간 현장 중심 의 실행 협력 을 함께 추진 한다는 데 의미가 있다. 우선 건설근로자공제회와 근로복지공단이 제공하는 근로이력 정보 를 활용 하는 맞춤형 금융상품 을 개발하여 ‘27년중 출시 할 예정이다. 또한 건설근로자 ‧노무제공자 근로이력정보와 같은 대안정보 를 긍정적 신용평가 요소 로 반영하어 금융취약계층의 금융접근성을 제고 하는 개인 대안신용평가 추진방안 도 연내 마련 할 계획이다. 이억원 금융위원회 위원장 은 \"금융회사들이 다양한 포용금융 상품 을 개발 하고 적극적 이고 선제적 인 채무조정 노력 을 부탁드린다\"고 당부하면서, \" 신용 평가 에서도 금융회사가 근로복지공단 및 건설근로자공제회로부터 고용‧산재보험 부과정보, 퇴직공제금 납부정보, 건설근로자 기능등급제 같은 정보를 제공받아 대출심사에 활용할 수 있다면 근로자분들의 성실한 근로이력 과 숙련도 를 신용 으로 인정 받을 수 있을 것\"이라고 밝혔다. 김영훈 고용노동부 장관 은 \"일하는 방식이 다르다는 이유로 금융 이용 의 기회 까지 달라져서는 안 된다 \"라며, \"건설근로자와 노무제공자의 근로·노무제공 이력 이 금융 분야에서 정당 하게 평가 받고, 이를 통해 더 많은 분들이 필요한 금융서비스를 이용할 수 있도록 관계기관과 긴밀히 협력 하겠다\"라고 밝혔다. 이어 \"오늘 협약이 선언에 그치지 않고 현장에서 체감할 수 있는 실질적인 성과 로 이어질 수 있도록 지속적 으로 노력 하겠다\"라고 강조했다. 이찬진 금융감독원장 은 \"포용금융은 다양한 경제활동 의 가치 를 인정 하고, 누구나 자신의 상환능력에 걸맞는 금융기회 를 누릴 수 있도록 하는데서 시작된다\"라며 \"이번 협약을 계기로 건설근로자와 노무제공자의 소득·근로 특성 이 금융심사에 보다 충실히 반영 될 수 있도록 지원하고, 나아가 금융취약계층 전반의 금융접근성 을 높이기 위해 노력 하겠다\"고 밝혔다. 금융위원회와 고용노동부, 금융감독원은 앞으로 관계기관과 협력 하여 건설근로자 와 노무제공자 의 금융 접근성 을 높이고, 노동의 가치가 안정적인 경제생활 로 이어질 수 있도록 포용금융 확대를 위한 정책적 노력 을 지속해 나갈 계획이다. ※ [붙임] 건설노동자 및 노무제공자 포용금융 업무협약식 개요 ※ [별첨] 금융위원장 말씀자료", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "금융감독원, 부동산신탁사 임원 간담회 개최", "department": "금융투자검사1국/금융투자검사3국/자산운용감독국", "date": "2026-11-10", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249795&menuNo=200218&pageIndex=1", "summary": "□ 금융감독원은 ’26.11.10.(화) 14개 부동산신탁사의 준법감시인,경영관리 담당 임원을 대상으로 간담회를 개최하였음\nㅇ 금번 간담회에서는 신탁사의 책임한정특약 소송 관련 리스크관리 강화, 보증보험증권 발급 업무 관련 주의사항 및 지역주택조합의 자금관리 대리사무 업무 개선방안 등에 대해 논의\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "㈜넥스아이 코스닥시장 신규상장", "depa nuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "건설노동자, 플랫폼노동자와 프리랜서에 대한 포용금융으로 금융이용 문턱 낮아진다", "department": "금융데이터정책과,은행과", "date": "2026-11-11", "url": "https://www.fsc.go.kr/no010101/88118", "summary": "건설노동자, 플랫폼노동자와 프리랜서에 대한 포용금융으로 금융이용 문턱 낮아진다 - 금융위원회·고용노동부·금융감독원 및 금융·노동 유관기관, 11월 11일 포용금융 확대를 위한 업무협약 체결 - 노동 ·노무제공 이력의 금융 활용, 맞춤형 금융상품 개발, 채무조정 지원 등 협력 금융위원회 (위원장 이억원), 고용노동부 (장관 김영훈), 금융감독원 (원장 이찬진)은 11월 11일(수) 건설근로자공제회에서 은행연합회, 신용정보원, 건설근로자공제회, 근로복지공단, 노동단체 및 노동공제단체 등과 함께 「 건설근로자 및 노무제공자 포용금융을 위한 업무협약 」을 체결했다. \u003c건설근로자 및 노무제공자 포용금융을 위한 업무협약식 개요 > ○ 일시 : ’26. 11. 11.(수) 14:00 ~ 15:00 ○ 장소 : 건설근로자공제회 본부 (서울 중구 남대문로 109) ○ 참석 : (정책·감독당국) 금융위원회, 고용노동부, 금융감독원 (유관기관) 전국은행연합회, 한국신용정보원, 근로복지공단, 건설근로자공제회, 한국노총 한국건설노동조합연맹, 민주노총 전국건설산업노동조합연맹, 한국플랫폼프리랜서노동공제회, 노동공제연합 풀빵 ○ 협약내용 : 건설근로자 및 노무제공자의 금융지원 확대를 위하여 대안 정보를 활용한 금융상품 개발 및 대안신용평가 추진, 경제적 재기 지원 등 이번 협약은 건설근로자 와 플랫폼·프리랜서 등 노무제공자 의 금융 접근성 을 높이고 금융 이용 과정에서 발생하는 애로사항 을 해소 하기 위해 마련됐다. 건설근로자와 노무제공자는 소득이 일정하지 않고 고용형태가 다양 해 금융회사의 신용평가 및 대출심사 과정에서 어려움 을 겪는 경우가 있다. 특히 실제 근로 및 노무제공 활동을 통해 소득을 얻고 있음에도 이러한 이력 이 금융 분야에서 충분히 활용되지 못하는 한계 가 있었다. 이에 정부와 금융권, 노동계 및 유관기관은 각 기관이 보유한 전문성 과 정보 를 연계 하여 건설근로자와 노무제공자의 특성을 반영 한 금융지원 체계 를 구축하기로 뜻을 모았다. 이번 업무협약의 주요 내용 은 다음과 같다. 첫째, 근로·노무제공 이력을 활용 한 대안신용평가 기반 을 마련한다. 건설근로자공제회 와 근로복지공단 등이 보유한 건설근로자의 공제부금 납부이력 과 노무제공자의 활동 이력 등 다양한 비금융정보를 금융 분야에 활용 할 수 있는 방안을 모색한다. 이를 통해 금융회사의 신용평가 와 대출 심사 등에 근로 및 노무제공 이력이 합리적 으로 반영 될 수 있도록 협력한다. 둘째, 건설근로자·노무제공자 특화 금융상품 과 서비스 를 발굴한다. 소득의 불규칙성과 고용형태 등 대상자의 특성을 고려한 맞춤형 금융상품 및 금융서비스 를 개발·확산 하고, 금융 이용 기회 를 확대 하기 위해 노력한다. 셋째, 금융애로 해소 와 경제적 재기 를 지원 한다. 금융회사 자체 채무조정과 신용회복위원회 등 유관기관의 채무조정 제도 연계 를 활성화 하고, 금융상담과 재무상담 등 금융 관련 지원 을 강화 한다. 아울러 금융교육 을 통해 건설근로자와 노무제공자의 금융역량 을 높이는 방안도 모색한다. 넷째, 금융지원제도 안내·홍보 와 현장 중심 의 제도개선 을 추진한다. 노동단체와 노동공제단체 등은 소속 근로자와 노무제공자에게 금융지원 제도 를 적극 안내 하고, 현장에서 발생하는 금융 수요 와 애로사항 을 관계기관과 공유 한다. 관계기관은 이를 바탕으로 신규 금융지원 과제 를 발굴 하고 기존 제도 의 개선 을 추진한다. 이번 협약은 금융위원회·고용노동부·금융감독원 간 정책적 협력 과 은행 연합회·신용정보원 및 건설근로자공제회·근로복지공단·노동단체‧노동공제단체 간 현장 중심 의 실행 협력 을 함께 추진 한다는 데 의미가 있다. 우선 건설근로자공제회와 근로복지공단이 제공하는 근로이력 정보 를 활용 하는 맞춤형 금융상품 을 개발하여 ‘27년중 출시 할 예정이다. 또한 건설근로자 ‧노무제공자 근로이력정보와 같은 대안정보 를 긍정적 신용평가 요소 로 반영하어 금융취약계층의 금융접근성을 제고 하는 개인 대안신용평가 추진방안 도 연내 마련 할 계획이다. 이억원 금융위원회 위원장 은 \"금융회사들이 다양한 포용금융 상품 을 개발 하고 적극적 이고 선제적 인 채무조정 노력 을 부탁드린다\"고 당부하면서, \" 신용 평가 에서도 금융회사가 근로복지공단 및 건설근로자공제회로부터 고용‧산재보험 부과정보, 퇴직공제금 납부정보, 건설근로자 기능등급제 같은 정보를 제공받아 대출심사에 활용할 수 있다면 근로자분들의 성실한 근로이력 과 숙련도 를 신용 으로 인정 받을 수 있을 것\"이라고 밝혔다. 김영훈 고용노동부 장관 은 \"일하는 방식이 다르다는 이유로 금융 이용 의 기회 까지 달라져서는 안 된다 \"라며, \"건설근로자와 노무제공자의 근로·노무제공 이력 이 금융 분야에서 정당 하게 평가 받고, 이를 통해 더 많은 분들이 필요한 금융서비스를 이용할 수 있도록 관계기관과 긴밀히 협력 하겠다\"라고 밝혔다. 이어 \"오늘 협약이 선언에 그치지 않고 현장에서 체감할 수 있는 실질적인 성과 로 이어질 수 있도록 지속적 으로 노력 하겠다\"라고 강조했다. 이찬진 금융감독원장 은 \"포용금융은 다양한 경제활동 의 가치 를 인정 하고, 누구나 자신의 상환능력에 걸맞는 금융기회 를 누릴 수 있도록 하는데서 시작된다\"라며 \"이번 협약을 계기로 건설근로자와 노무제공자의 소득·근로 특성 이 금융심사에 보다 충실히 반영 될 수 있도록 지원하고, 나아가 금융취약계층 전반의 금융접근성 을 높이기 위해 노력 하겠다\"고 밝혔다. 금융위원회와 고용노동부, 금융감독원은 앞으로 관계기관과 협력 하여 건설근로자 와 노무제공자 의 금융 접근성 을 높이고, 노동의 가치가 안정적인 경제생활 로 이어질 수 있도록 포용금융 확대를 위한 정책적 노력 을 지속해 나갈 계획이다. ※ [붙임] 건설노동자 및 노무제공자 포용금융 업무협약식 개요 ※ [별첨] 금융위원장 말씀자료", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "영남권 메가프로젝트 이행 점검 TF 개최", "department": "산업경제과", "date": "2026.11.11.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079927&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "이형일 부총리, 취임 후 첫 재경관 화상회의 개최", "department": "대외경제총괄과", "date": "2026.11.11.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079918&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"so O 선임, 임추위,주총 의결요건 단계적 강화\n- CEO 승계절차 조기개시 및 평가요건 구체화, 평가결과 공시 강화\n- 前任 CEO, 임원 등 고문 위촉시 보수기준 마련 및 공시 등 강화\nㅁ 주주의 독립이사 후보추천제 도입 및 기관투자자의 주주활동 지원\nㅁ 고액 연봉자 보수공시 강화 등 성과,보수운영의 합리성 제고\n- 등기임원 보상계획 주총설명(Say-on-Pay), 성과보수 환수제(Clawback) 도입\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "relevant"}, {"source": "FSS", "title": "미공개 무상증자정보를 이용한 내부자등에 대한 중대범죄수사청 고발,통보 조치의결", "department": "조사2국", "date": "2026-11-12", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249817&menuNo=200218&pageIndex=1", "summary": "증권선물위원회(위원장: 신진창)는 제20차 정례회의(’26.11.11일)에서 벤처투자회사의 대표이사,동사가 투자한 회사 및 임원이 업무상 지득한 무상증자 정보를 이용하여 해당 회사의 주식을 매매한 행위에 대하여 ?자본시장과 금융투자업에 관한 법률? 제174조 미공개중요정보 이용행위 금지 위반 혐의로 중대범죄수사청에 고발,통보 조치를 의결하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "미공개 무상증자정보를 이용한 내부자등에 대한 중대범죄수사청 고발·통보 조치 의결", "department": "자본시장조사총괄과", "date": "2026-11-12", "url": "https://www.fsc.go.kr/no010101/88123", "summary": "미공개 무상증자정보를 이용한 내부자등에 대한 중대범죄수사청 고발·통보 조치 의결 - 제20차 증권선물위원회(11.11.) 의결 - [ 조치 개요 ] 증권선물위원회 (위원장: 신진창) 는 제20차 정례회의 (’26.11.11일) 에서 벤처 투자회사의 대표이사·동사가 투자한 회사 및 임원이 업무상 지득한 무상 증자 정보를 이용하여 해당 회사의 주식을 매매한 행위에 대하여 ｢자본 시장과 금융투자업에 관한 법률｣ 제174조 미공개중요정보 이용행위 금지 위반 혐의 로 중대범죄수사청에 고발·통보 조치 를 의결 하였습니다. ◈ 자본시장법에서 금지하는 미공개중요정보 이용행위 는 내부자 가 상장법인 의 업무 등 과 관련 된 미공개중요정보 를 특정증권 등의 매매, 그 밖의 거래에 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §174①) 를 말합니다. [ 조사 결과 ] 벤처투자회사 A의 최대주주이자 대표이사인 B는 A가 운용하는 벤처투자조합이 투자한 상장사 C와 D의 실질적 최대주주이자 C사의 대표이사이며 D사의 경영에도 영향력을 행사하는 사실상 임원 으로서, D의 무상증자 결정 이라는 호재성 정보 를 생성 하고, 해당 정보 공시전 C사의 재무담당 임원 E에게 C사의 계좌 로 D사 주식 을 매수 하도록 지시 하여 수십억원 상당의 부당이득을 취득하는 등 미공개중요정보 이용행위를 한 혐의가 있습니다. 또한, E는 B로부터 전달받은 미공개중요정보를 이용 하여 본인의 계좌로 D사 주식 을 매매 함으로써 수천만원 상당의 부당이득을 취득하는 등 미공개중요정보 이용행위를 한 혐의가 있습니다. [ 유의사항 ] 무상증자를 실시하는 상장사 의 최대주주 및 사실상 임원 등 내부자가 해당 정보를 공개전 이용 하여 직접 거래하거나 타인에게 이용하게 하는 경우 자본시장법 위반에 해당하여 1년 이상의 유기징역 또는 벌금 (부당이득 의 최대 6배) 등 형사처벌을 받을 수 있습니다. 또한, 해당 내부자의 행위의 결과가 내부자가 속한 법인에도 귀속된 것으로 판단될 경우에는 그 법인도 형사처벌의 대상이 될 수 있습니다. 앞으로도 금융위원회와 금융감독원은 미공개중요정보 를 이용 한 자본시장 불공정거래 행위에 대해 엄정 하게 대응 해 나갈 예정이니, 관련 법규 준수 와 내부통제 강화 를 통해 불공정거래 행위가 발생하지 않도록 만전을 기해 주시길 당부드립니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 ‣ 인터넷 : 금융위원회 홈페이지 [참여마당 → 신고마당 → 불공정거래신고] 메뉴 ☞ 금융감독원 불법금융신고센터 ‣ 인터넷 : 금융감독원 홈페이지 [민원·신고 → 불법금융신고센터 → 증권불공정거래신고] 메뉴 ‣ 전 화 : 1332 ☞ 한국거래소 불공정거래신고센터 ‣ 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) ‣ 전 화 : 1577-0088 ※ 수사에 미치는 영향 등을 고려하여 조치대상자 및 종목명은 공표하지 않습니다. 본 조치 사안과 관련한 문의는, 금융감독원 조사2국으로 해주시길 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "2026년 10월 가계대출 동향(잠정)", "department": "금융정책과", "date": "2026-11-12", "url": "https://www.fsc.go.kr/no010101/88124", "summary": "1 2026년 10월 동향 ’26.10월중 全금융권 가계대출 은 전월 (△2.2조원) 대비 +6.4조원 증가 하였다. 주택담보대출 은 +4.0조원 증가 하여 전월 (+3.2조원) 대비 증가폭 이 확대 되었으며, 은행권 (+2.9조원 → +3.3조원) 과 제2금융권 (+0.3조원 → +0.7조원) 모두 증가폭 이 확대 되었다. 기타대출 은 +2.4조원 증가 하여 전월 (△5.4조원) 대비 증가세 로 전환 되었으며, 이는 신용대출 이 증가세 로 전환 (△2.9조원 → +1.2조원) 된 점 등에 기인한다. 대출항목별 가계대출 증감 추이 (단위 : 조원) ’26.4월 5월 6월 7월 8월 9월 10월 p 주담대 +5.5 +4.0 +4.5 +3.6 +4.3 +3.2 +4.0 기타대출 △2.0 +5.3 +3.8 +2.8 △1.5 △5.4 +2.4 합계 +3.5 +9.3 +8.3 +6.4 +2.8 △2.2 +6.4 업권별 로 살펴보면 ’26.10월중 은행권 가계대출 은 +5.0조원 증가 하여, 전월 (+0.6조원) 대비 증가폭 이 큰 폭으로 확대 되었다. 세부적으로는 은행 자체 주담대 (+1.8조원 → +2.2조원) 와 정책성대출 (+1.1조원 → +1.2조원) 의 증가폭 도 확대 되었고, 기타대출 (△2.3조원 → +1.7조원) 은 증가세 로 전환 되었다. ※ 은행권 주택담보대출 증가 세부 현황 (조원) : (9월) 주담대(+2.9) = 은행자체(+1.8) + 디딤돌·버팀목(+1.1) + 보금자리론 등(△0.01) ↳ 일반(+1.6) + 집단(+0.7) + 전세(△0.5) (10월 p ) 주담대(+3.3) = 은행자체(+2.2) + 디딤돌·버팀목(+1.2) + 보금자리론 등(△0.1) ↳ 일반(+1.4) + 집단(+1.2) + 전세(△0.5) * 디딤돌·버팀목 기금 재원 증가액 (조원) : (’26.7월) △0.5 (8월) △0.4 (9월) △0.4 (10월 p ) △0.4 제2금융권 가계대출 은 +1.4조원 증가 하여, 전월 (△2.7조원) 대비 증가세 로 전환 되었다. 세부적으로는 상호금융권 (△0.7조원→+0.2조원), 보험 (△0.8조원→+0.3조원), 저축은행 (△0.4조원→+0.2조원), 여전사 (△0.9조원→+0.8조원) 모두 증가세 로 전환 되었다. 업권별 가계대출 증감 추이 (단위 : 조원) '23년중 (1~12월) '24년중 (1~12월) '25년중 (1~12월) '26년중 (1~10월) 9월 10월 9월 10월 9월 10 (목) 07:30, 당정협의회 를 개최 하여, 우리 금융회사의 지배구조에 대한 반복되는 논란을 해소하고 국민의 신뢰회복 및 금융경쟁력 제고 를 위한 「 금융회사 지배구조 개선방안 」을 발표하였다. \u003c 당정협의회 개요 > ▪ 일시/장소 : ’26.11.12.(목) 07:30-08:30 / 국회의원회관(정책위원회 회의실) ▪ 참석자 : [당] 권칠승 정책위의장, 유동수 정무위원장, (정무위) 박상혁 간사, 김현정 의원, 박민규 의원, 박홍배 의원, 전현희 의원 등 [정] (금융위) 금융위원장, 금융정책국장 (금감원) 금융감독원장, 은행담당 부원장보 ▪ 안건 : ➊ 8개 은행지주 지배구조 특별점검 결과 ➋ 금융회사 지배구조 개선방안 2. 추진경과 그간 금융위원회는 ’25.12.19. 대통령 업무보고 를 계기 로 CEO 셀프 연임, 참호 구축 등 금융회사의 지배구조 문제 를 근본적으로 해결하기 위해 개선방안 을 적극 검토 해왔다. 그 일환으로 ’26.1월부터 금융감독원·연구원·학계 · 법조계 등이 참여하는 「지배구조 선진화 TF」 (이하 ‘ TF ’) 를 구성·운영 하고, 금융권 지배구조 의 공정성·투명성 을 제고 하기 위해 개선과제에 대한 논의를 진행하였다. 이와 함께, 금융감독원 은 ’26.1월 8개 은행지주 를 대상으로 지배구조 관련 실제 운영현황 전반 에 대해 점검 을 실시 하였다. 특히, CEO 승계절차 의 공정성 과 독립성 , 사외이사 선임과정 의 투명성 , 이사회 의 견제기능 , 성과보수 운영 등에서 보완해야 할 문제점 들이 확인되었다. 이에 금융위원회 는 금융감독원의 특별점검 결과 와 TF 논의 를 바탕으로 금융회사 지배구조 의 주요 문제점 을 분석 하고 개선방안 을 마련 하였으며, 당정협의 를 통해 금융회사의 책임 있고 투명한 지배구조 확립 을 위한「 금융 회사 지배구조 개선방안 」을 확정하였다. 3. 금융회사 지배구조 개선방안 「 금융회사 지배구조 개선방안 」은 최근 상법 개정의 취지 와 국제적 정합성 , 금융권 운영 현실 등을 종합적으로 고려하여 크게 네 가지 방향 으로 금융회사 지배구조 를 개선하는 내용 을 담고 있다. 첫째, 임추위 및 이사회 의 독립성·책임성 을 강화 하여 CEO 의 참호 구축 을 원천적 으로 차단 한다. CEO가 경영승계절차에 부당한 영향력을 행사하지 못하도록 임원후보추천 위원회 (이하 ‘ 임추위 ’) 의 독립성 과 책임성 을 대폭 강화 한다. ▲우선 CEO 후 보 추천 임추위 는 전원 독립이사로 구성 하고, 現 CEO가 독립이사 및 감사위원 을 추천 하는 임추위 에 참석 하는 것을 금지 한다. ▲ 아울러 現 CEO 가 차기 CEO 경영승계절차 에 부당하게 관여 하지 못하도록 금지 규정 과 위반 시 제재 를 신설 하고, 경영승계절차 중 임추위 위원 과 접촉 하는 경우 공시의무 를 부과한다. ▲이와 함께, 임원후보 추천업무 에 대한 임추위 의 책임성 을 강 화하기 위해, ➊ 주주총회 (이하 ‘ 주총 ’) 소집 시 후보 추천사유 에 임추위 위원 전원 의 확인서 를 첨부 하도록 하고, ➋ 임추위원장 이 후보 추천사유 를 주주 들에게 직접 설명 토록 한다. ➌ 임추위원장 에게는 임추위 운영과 관련한 책무구조도 를 적용 한다. 全 금융회사 에 독립이사제 를 도입 하고 이사회 의 독립성 및 책임성 을 강화 한다. ▲ 상장 금융회사 에 대해 일정지분 이상 보유 주주로부터 독립이사 후보 를 추천 받는 제도 를 도입한다. ▲또한, 금융회사가 독립이사만 의 간담회 를 연 2회 이상 개최 하도록 의무화하고, 독립이사 의 경영진 감시역할을 평가 할 수 있는 평가지표 를 보완 하고 세부 활동내역 등에 대한 공시 를 강화한다. ▲아울러, 이사회 의사록 의 충실한 작성 의무 를 명시 하여 이사회 운영의 공정성·투명성을 제고하고, 이사회 의 전문성·다양성·책임성 을 확보 하기 위 한 개선조치 들 * 을 통해 이사회의 경영진 견제기능 을 강화한다. * 이사회 내 위원회 (例: 위험관리위원회) 의 전문가 자문비용 지원 확대, 이사회 구성·후보 선정기준 공시 강화, 은행지주 이사의 회사에 대한 손해배상책임 강화 등 둘째, 은행지주 CEO의 참호구축 등을 통한 장기연임 관행을 전면 개선한다. 소유 가 분산 되어 지배주주가 없는 은행지주 CEO 의 경영승계절차 에 대해 주주 및 임추위 의 통제 를 강화 한다. ▲ 은행지주 CEO 는 주총 에서 선임 하도록 하고, 선임·연임 과정 에서 임추위 및 주총의 의결요건 을 단계적 으로 강화 한다. ➊ 현행 규정상 임추위 는 출석위원 과반수 의 찬성으로 CEO 를 추천 해 왔으나, 앞으로는 감사위원 추천에 준하여 위원 총수 의 2/3 이상 의 찬성으로 추천하도록 하고, 연임 의 경우에는 3/4 이상 의 찬성으로 추천하도록 한다. ➋ 또한, 현행 규정상 CEO 는 사내이사 로서 주총 에서는 출석의결권 과반수 의 찬성 (발행주식총수 1/4 이상) 으로 선임되나, ‘ 1회 연임 시 ’에는 2/3 이상 (발행주식 총수 1/3 이상) , ‘ 2회 이상 연임 시 ’에는 3/4 이상 (발행주식총수 1/2 이상) 의 찬성을 받도록 하여 주주 에 의한 실효적인 통제 가 이루어지도록 강화한다. * (현행) ➊ 임추위· ➋ 주총 에서 CEO 선임·연임시 법령 및 내규상 과반수 찬성 으로 의결 (단, 일부 회사는 내규상 과반수 찬성보다 강화하여 규정) (개선) ➊ 임추위 : (선임) 2/3 이상 † → (1회 연임~) 3/4 이상 ➋ 주 총 : (선임) 과반수 & 발행주식총수 1/4 이상 → (1회 연임) 2/3 이상 & 발행주식총수 1/3 이상 → (2회 연임~) 3/4 이상 & 발행주식총수 1/2 이상 † 현재 감사위원 임추위는 위원 총수의 2/3 이상 찬성으로 의결(「지배구조법」§19④) CEO 승계절차 관리 강화 를 통해 경영승계절차 의 공정성 과 투명성 을 제 고하여 CEO 에 대한 연기금 등 시장의 평가 기능 을 한층 강화한다. ▲ CEO 평가요 건 및 세부기준 을 구체화 (금융사고·제재 등 사회적 논란을 포함한 비재무요소 등) 하고 절차 중 임의적 변경 을 금지 하는 한편, 평가결과 공시 를 강화 한다. ▲또한, 승계절차 를 조기 에 개시 하여 (例: 최종후보 선정일로부터 최 소 3개월 前 또는 임기 종료일 6개월 前) 충분한 검증기간을 부여한다. ▲아울러, CEO 상시 후보군 을 보다 체계적으로 관리 하고, 외부 후보군 에게도 충분한 준비기간을 부여하 는 등 공정한 경쟁 환경 을 제공하도록 개선한다. CEO 연임 과 퇴임 과정에서 반복되어 온 불합리한 관행 을 업계 스스로 혁파 하도록 하여 책임 있는 경영문화 를 정착 시킨다. ▲ 은행지주 등에서 前任 CEO, 임원 등을 고문 으로 위촉 할 때 적용할 합리적인 보수기준 을 마 련하여 관련 내용 을 공시 하도록 하고, 해당 기준 의 적정성 을 점검 해 나간다. ▲또한, 現 CEO 의 연임 을 위한 부당한 광고비 집행 을 자제 토록 하고 관련 광고비 규모 를 공시 하도록 한다. 셋째, 연기금 등 기관투자자의 책임 있는 주주로서의 역할을 강화한다. 기관투자자 등 이 새로 도입되는 ‘독립이사 후보추천제도’를 적극 활용 해 독립이사 후보를 추천할 수 있도록 명확한 유권해석 을 제공 하여 주주·시장 중심 의 감시 와 견제 가 실질적으로 작동할 수 있도록 유도한다. \u003c 유권해석(안) 주요내용 > ➊ ‘ 이사회 의 요청’뿐만 아니라 금융회사 요청 ( 임추위, 주주간담회, 홈페이지 공개 등 ) 에 따른 추천도 경영권 영향 목적 이 아님을 명확화 ➋ 금융회사가 추천요청을 하면서 임추위 추천명단 포함을 표명 한 경우에도 ‘경영권 영향 목적’이 아님 을 명확화 또한, 기관투자자 가 스튜어드십 코드에 따라 금융회사 이사회(독립이사)의 독 립성 과 책임성 을 보다 적극적으로 점검 하도록 유도해 나갈 방침이다. \u003c CEO 승계과정에서 연기금 등 기관투자자를 통한 시장평가 강화 > ➊ “독립이사 후보추천제도”를 통해 독립적인 이사후보 를 추천 ➋ 스튜어드십 코드에 따라 “이사회(독립이사)” 의 독립성·책임성 적극 점검 ➌ 엄격해진 CEO평가·공시 에 따라 적합성 판단 → 강화된 주총 요건 에 따라 의결권 행 사 넷째, 성과보수 운영의 합리성과 투명성을 높인다. 주주 들이 개별 이사의 보수가 지위·역할·책임 등에 맞게 적절히 설정 되었는지 파악할 수 있도록 정보 제공 을 강화한다. ▲그간 주총에서는 이사 들의 보수총액만 승인 하고 개인별 보수 는 이사회 에서 결정 해 왔으나, 앞으로는 일정 규모 (例: 자산규모 2조원) 이상 상장 금융회사는 개별 임원 의 보수지급 계획 을 주총 에서 설명·보고(Say-on-Pay) 하도록 한다. ▲또한, (성과)보수 가 일정액 이상 인 상위 임직원 * 에 대하여 개인별 (성과)보수 총액 을 공시 하도록 하고, 보수와 성과 간 연계성 을 확인할 수 있도록 관련 정보 의 공시 도 강화 한다. * 例) ①보수총액 5억원 이상인 「지배구조법」상 임원, ②성과보수 총액 3억원 이상인 「지배구조법」상 임직원 (제도개선에 따른 영향분석을 토대로 상위 5~10인 등 인원제한 검토) 아울러, 금융회사 임원 등의 과도한 위험추구 를 방지 하고 업무수행 에 대한 책임성 을 제고 한다. ▲현재 금융회사는 성과보수 의 일정 비율 (40% 이상) 을 일정 기간 (3년 이상) 이연하여 지급 하고 있으나, 앞으로는 최소 이연지급 비 율 과 기간 을 확대 한다. * ▲ 또한, 고의·중과실 로 회사 에 손실 을 초래하거 나 성과보수 산정 기준이 된 재무제표 가 정정 된 경우 이미 지급된 성과보수 를 환수 하는 제도(Clawback) 를 도입 한다. * 例) 성과보수 최소 이연 비율·기간 상향(40% → 50%, 3년 → 5년) 4. 향후계획 당정 은 「 금융회사 지배구조 개선방안 」의 차질 없는 이행을 위해 입법 등 모든 후속조치 를 속도감 있게 추진 하기로 협의 하였으며, 오늘 발표한 안을 바탕으로 연내 지배구조 관련 법령 및 모범관행 개정안 을 마련 하기로 하였다. 권칠승 정책위의장 은 금융 의 가장 중요한 자산 은 국민의 신뢰 라고 강조 하였다. 그동안 일부 금융회사에서 ‘ 셀프 연임 ’이 반복되고, 임원 등이 단기 성과 에 따른 고액 보수 를 받으면서도, 그 결과에 대한 책임 은 지지 않는 관행 이 이어져 왔다고 지적하였다. 이번 개선방안은 이사회와 주주 등 시장 이 경영진 을 실질적 으로 견제 할 수 있도록 하고 성과 에는 보상 이, 손실 에는 책임이 따르는 원칙 을 세우자는 것이라고 밝혔다. 아울러 투명한 지배구조 는 금융회사에도 결코 부담이 아니며, 역량 있는 리더 가 공정하게 선택 될 때 금융산업 의 경쟁력 도 한 단계 높아질 것 이라고 언급하였다. 유동수 정무위원장 은 이번 개선방안이 주주 중심 의 금융회사 지배구조 로 나아가는 의미 있는 진전 이라고 평가하였다. 특히 독립이사 추천 부터 CEO 연임, 임원 보수 까지 주주 가 금융회사 의 핵심 의사결정 에 실질적 으로 참여 할 수 있는 길이 넓어졌다고 설명하였다. 이처럼 주주 의 참여 와 감시 가 살아 있는 지배구조 가 결국 금융소비자 보호 와 금융회사 의 건전한 성장 으로 이어질 것이라고 강조하였다. 아울러 정무위원회 에서 이번 개선방안의 취지가 실효성 있게 구현 될 수 있도록 입법 논의 를 충실히 진행 하겠다고 언급하였다. 이억원 금융위원장 은 금융회사 는 국민의 재산 을 관리·운용 하고 자금 을 중개 하는 공공성 이 높은 기관 인 만큼, 금융회사의 지배구조 는 개별 회사의 경영 문제를 넘어 금융시장 안정 과 국민 신뢰 에 직결 된다고 언급하였다. 특히 공정하고 투명한 지배구조 는 국민과 시장의 신뢰 를 높이는 가장 중요한 기반 이며, 이러한 신뢰를 바탕으로 생산적 금융 등 금융회사의 경쟁력 도 제고 할 수 있다고 밝혔다. 또한 , 최근 상법 개정 을 계기로 기업 지배구조 전반에 대한 사회적 관심과 기대가 높아진 만큼 금융회사 역시 공공성에 걸맞은 수준 의 책임성 과 투명성 을 확보할 필요가 있다고 강조하였다. 이번 개선방안이 일회성 대책에 그치지 않도록 법률 및 하위규정 개정 과 모범관행 정비 를 차질 없이 추진해 금융회사 지배구조의 실질적인 변화 를 이끌어 나가겠다고 밝혔다. 이찬진 금융감독원장 은 이번 개선방안으로 독립이사 가 경영진 에 대해 충실히 견제·감시 할 수 있는 권한  관련 가상자산사업자 입출금 차단 비조치 의견 ③ 가상자산사업자 금융보안원 사원 가입 및 보안성 점검 지원방안 신진창 부위원장 은 최근 가상자산업계의 연이은 정보유출과 침해사고 발생 현황을 지적하며, 일부 사업자들의 보안 에 대한 인식 은 가상자산시장의 성장과 업계에 대한 기대와 달리 제도화 이전 에 머물러 있다고 말했다. 특히, 가상자산사업자는 이용자 의 자산 을 수탁하여 보관 하고 관리 한다는 점에서 전통적 인 금융회사 와 동일한 수준 의 보안체계 가 필요하다고 강조하면서, 보안에 대한 인식 을 근본적 으로 전환 할 것을 촉구하였다. 또한, 금융위원회는 가상자산사업자의 보안 규율 을 지속적 으로 강화 해 왔으며, 현재 준비 중인 ｢ 디지털자산법(안) ｣을 통해 디지털자산업자 (現가상 자산 사업자) 가 금융회사 에 준하는 IT 안전성 확보의무 와 손해배상책임 을 갖추도록 할 것이라고 밝혔다. 다만, 입법 에 시간이 소요되는 만큼 법 제정 전 이라도 24시간 모니터링 및 보고체계 구축, 콜드월렛 비중 상향 과 준비금 적립 등 현 단계에서 보안 강화에 필요한 사항을 즉시 조치 할 것을 당부하였다. Ⅱ. 주요 논의사항 금일 회의에서는 ➀ 최근 침해사고와 관련한 가상자산사업자의 보안 강화 를 위한 비상 대응 수칙, ➁ 해킹사고 의심 시 사업자의 선제적 인 입출금차단 비조치 및 ➂ 가상자산사업자의 금융보안원 사원 가입 및 보안성 점검 지원 방안에 대해 논의 하였다. \u003c ➀ 가상자산사업자 보안사고 비상 대응 가이드라인 마련 > 최근 인공지능 (AI) 을 이용한 사이버 공격 등 새로운 침해위협 의 급속한 확산 에 대응하여 가상자산사업자가 현 단계에서 조치할 수 있는 침해사고 방지 및 사고 발생시 피해 최소화 에 필요한 사항이 논의되었다. 첫째, 24시간 일주일 내내 거래 가 이루어지는 가상자산시장의 특성 에 맞추어 상시 모니터링·대응체계 를 갖추도록 하였다. 사업자는 담당 인력 등을 상시 배치하여 비정상적인 대규모 거래 등 사고 발생 이 의심되는 경우 필요한 통제 조치 를 즉시 시행하여야 한다. 또한, 모니터링· 대응체계를 상시적으로 운영하기 어려운 사업자는 동 체계가 정상적 으로 운영 될 수 있는 시간에만 입출금 을 처리하며, 이를 이용자에게 사전 안내 하고 충분한 인력 배치 등을 통해 이용자의 입출금 요청을 적시에 대응 하여야 한다. 둘째, 이용자 자산의 콜드월렛 * 보관 비중 의 최대화 와 보험 보상한도 및 준비금 적립액 의 확충 이다. 현재 ｢가상자산업감독규정｣상 사업자의 콜드월렛 의무 보관비중 은 80% 이나, 전체 사업자 의 콜드월렛 보관 비중은 95% 이상 으로 이를 크게 상회 하고 있는 상황이다. 그럼에도 이용자 자산의 안전한 보관 을 위해 가상자산사업자는 핫월렛 에 보관되어 있는 이 용자 위탁 가상자산 수량을 거래지원 에 필요한 최소한의 수량 으로 유지 하고, 복수 의 핫월렛에 분산 하여 보관하는 방안도 고려할 필요가 있다. 또한, 해킹 등에 따라 이용자 피해 가 발생할 경우, 이에 대한 보상 이 원활히 이루어질 수 있도록 보험 보상한도 및 준비금 적립액 을 충분히 확보하여야 한다. * 콜드월렛(cold wallet): 인터넷과 분리하여 보관하는 이용자 자산으로서 상대적으로 해킹 등에서 안전 마지막으로, 현재 ｢전자금융거래법｣상 금융회사 에 적용되는 IT 안전성 확보 의무 이행과 침해사고 대응 을 위해 필요한 조치사항을 제시 하였다. ｢디지털자산법(안)｣은 디지털자산업자 (現 가상자산사업자) 도 금융회사 수준 의 안전성 기준 과 손해배상책임 을 갖추도록 할 예정이며, 그 이전이라도 가이드라인을 통해 ｢ 전자금융거래법｣ 적용 금융회사 에 준하는 안전성 확보 의무 등을 수행 하도록 할 계획이다 . 사업자들은 가상자산거래의 전자적 전송·처리를 위한 인력·시설 등 정보기술 및 정보보호 에 관한 사항, 가상자산거래 의 안전성 확보 에 필요한 기술적·관리적 ·물리적 조치 등에 관한 안전성 기준 을 마련하여야 하며, 정보처리시스템 및 정보통신망에 대해 취약점 을 분석·평가 하고 그 결과에 따라 보완 조치 를 수행하여야 한다. 또한, 침해사고 가 발생하거나 외부의 비정상적 접근 시도 등 침해 가능성 이 발견되는 경우에는 신속하게 금융당국 에 해당 사실을 알리도록 하여, 금융회사와 유사한 수준의 사고 보고체계 를 갖추도록 하였다. \u003c ➁ 해킹 관련 가상자산사업자 입출금 차단 비조치 의견 > 최근 증가 하는 침해 위협에 대응하여 이용자 피해 확산 을 방지 하기 위해 해킹사고 가 의심 되는 경우, 일정 조건 하에 사업자들의 선제적인 입출금 차단 을 허용하는 방안에 대해서도 논의하였다. 현행 ｢가상자산이용자보호법｣은 정당한 사유 없이 사업자가 입출금 을 차단 할 수 없도록 하고, 해킹사고 발생이 명백 한 경우에만 차단을 허용 하고 있다. 이에 이상거래 발생 등 해킹 이 의심 되는 단계에서도 사업자의 선제적인 입출금차단 이 허용되는지 여부가 불명확 하다는 업계의 의견 이 있었다. 이에, 바이 낸스 해킹 등 사례에서 보았듯이 가상자산 보안사고의 특성상 신속한 차단조치 가 이용자 피해 최소화 에 결정적인 바, 사업자들이 해킹, 침해 사고 가 의심 되는 경우, 선제적 으로 입출금차단 조치 를 취할 수 있도록 ‘비조치 의견서 ’를 발급 하기로 하였다. \u003c ➂ 가상자산사업자 금융보안원 사원 가입 및 보안성 점검 지원 > 현재 이용자 규모 , 회비 부담 등으로 인해 28개 가상자산사업자 중 5개 원화마켓 거래소 만 금융보안원 사원 가입 을 완료한 상태이다. 그러나 중소 가상자산거래소의 침해사고 발생 현황 을 고려할 때, 나머지 가상자산사업자들도 금융보안원에 사원 으로 가입 하고, 금융회사와 동일 한 수준의 보안지원 서비스 를 제공받을 필요가 있다. 따라서, 모든 가상자산사업자의 이용 규모 등을 고려하여 금융보안원 추가 사원 가입 을 추진하고, 사원 가입 사업자에 대해서는 침해 위협 정보공유, 보안 취약점 점검, 금융보안 전문교육 등 보안 서비스 를 제공 할 예정이다. 가입이 어려운 경우에는 중소금융사 수준 으로 취약요인 탐색, 경보체계, 보안조치 등을 지원 한다. 현재 가상자산사업자들은 ｢전자금융거래법｣상 취약점 분석·평가 대상에 해당하지 않고, ｢특정금융정보법｣상 ISMS 인증 외에는 별도 점검 의무 가 없어, 외부 보안 전문기관 의 종합 점검 을 확대할 필요성이 크다. 이에, 금융 보안원이 가상자산사업자 사원기관 을 대상으로 보안 점검 을 수행 하고, 직접 점검을 수행할 수 없는 사업자에 대해서는 자체적 으로 또는 정보 보호전문업체 를 통해 점검을 수행할 수 있도록 ‘ 가상자산거래소 특화 보안 점검 기준’ 을 제공 할 계획이다. 이를 위해 최신 침해 위 협 에 대응할 수 있도록 거래 검증 강화, 월렛 접근 통 제 등의 사항을 반영 하여 기존 보안 점검 기준 * 을 연내 개선 할 예정이다. * 업무환경(클라우드 위주 운영, 핫월렛 탈취 위협 등)이 금융회사와 다른 점을 고려하여 ▲ 가상자산 컴플라이언스, ▲ 블록체인, ▲ 월렛, ▲ 스마트 컨트랙트 분야 등을 별도로 마련 Ⅲ. 향후 계획 금융위원회는 오늘 논의된 업계의 보안 쇄신 노력 을 빈틈없이 지원 하는 한편, 가상자산업권에 안전한 보안체계 가 확립 될 수 있도록 관련 제도를 지속 정비해나갈 계획이다. ※ [별첨] 금융위원회 부위원장 모두발언", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "KOSCOM", "title": "[코스콤정보분배] KIS 금융채2904만기형 총수익지수 신규 산출 안내(가동일:20261207)", "department": "전체 공지", "date": "2026-11-12", "url": "https://data.koscom.co.kr/notice/110756/notice-detail", "summary": "1. 귀사의 무궁한 발전을 기원합니다.\n2. KIS자산평가에서 아래와 같이 신규지수를 산출할 예정이기에 안내 드리오니\n업무에 참고하여 주시기 바랍니다.\n- 아 래 -\n1. 가 동 일 : 2026.12.07(월)\
