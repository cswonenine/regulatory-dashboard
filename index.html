tine"}, {"source": "FSC", "title": "금융회사가 기업의 저탄소 전환에  필요한 자금을 지원할 수 있도록 실무기준을 마련하였습니다.", "department": "산업금융과", "date": "2026-11-25", "url": "https://www.fsc.go.kr/no010101/88223", "summary": "1. 회의 개요 금융위원회 (위원장 이억원, 이하 ‘금융위’) 는 11월 25일(수) 금융정책국장 주재로 관계부처, 유관기관, 금융회사 및 민간전문가와 함께 ｢기후금융 관계기관 TF｣ 제2차 회의 를 개최하고, ｢전환금융 모범규준｣ 최종안 을 발표하였다. 또한, 금융권의 참석 범위를 넓혀 전환금융의 국내 도입방안 에 대한 다양한 현장 의견을 청취 하고, 금융회사별 준비 상황을 점검하여 전환금융을 본격 공급 하기 위한 제반 여건을 점검 하였다. \u003c ｢기후금융 관계기관 TF｣ 제2차회의 개요 > ▪ ( 일시/장소 ) ’26.11.25일 (수) 15:00 / 정부서울청사 ▪( 참석 ) (금융위) 금융정책국장 , 산업금융과장 등 (관계부처) 기후에너지환경부 , 산업통상부 (유관기관) 금융감독원, 신용정보원, 금융권 (은행·금투·생보·손보·여신) , 산업계 (석유·철강) (민간전문가) 이보미 연구위원 (한국금융연구원), 오형나 교수 (경희대) ▪(논의내용) 전환금융 모범규준 발표 및 전환금융 현장 적용방안 논의 2. 주요 논의내용 \u003c ➊ ｢전환금융 모범규준 최종안｣ > 기업의 저탄소 전환에 필요한 자금을 지원하는 전환금융이 원활히 공급될 수 있도록 금융위·금감원·금융권이 함께 마련한 ｢전환금융 모범규준｣ 최종안 을 발표하였다. 지난 2월 발표한 ｢전환금융 가이드라인｣이 지원대상과 기본 원칙을 제시한 데 이어, 금번 모범규준 은 금융회사가 이를 개별 사업의 심사와 사후관리 에 적용할 수 있도록 구체화한 실무지침 이다. 3월부터 금융위·금감원· 금융회사 등이 참여한 실무 TF 를 통해 초안을 마련하고, 기후부·산업계· 금융권의 다양한 의견을 수렴 하여 실무사례를 보완한 최종안을 마련 하였다. 모범규준 은 전환금융으로 인정하고 있는 2가지 경로인 한국형 녹색분류 체계에 따른 전환과 기업의 전환전략에 따른 전환에 각각 적용되는 판단기준을 구체화 하고, 심사에 필요한 증빙자료 와 자금공급 이후 점검사항 을 제시하였다. 이로써 금융회사가 어떤 사업을 지원 할 수 있는지, 심사와 사후관리 단계 에서 무엇을 확인해야 하는지 등 전환금융 판단시 겪어 온 실무상 어려움을 해소 하였다. 금융위는 앞으로도 금융회사·산업계 의 모범규준 적용 사례 와 현장 의견 을 바탕으로 모범규준을 지속적으로 보완 해나갈 예정이다. 또한, 산업부가 ｢업종별 탄소 감축 로드맵｣ 을 발표하면, 해당 내용을 모범규준에도 반영 할 계획이다. \u003c ➋ 금융배출량 플랫폼 구축 현황 > 신용정보원 은 금융회사가 일관된 기준으로 금융배출량 을 산정 할 수 있도록 지원하는 ｢금융배출량 플랫폼 추진 현황｣ 을 공유하였다. 금융회사는 플랫폼을 통해 기업이 공시한 배출량 과 산업별 배출계수 등의 자료를 한번에 확인하여 금융배출량 산정에 필요한 자료를 개별적으로 수집하는 부담 을 줄일 수 있다. 신용정보원은 ’27년 중 금융배출량 플랫폼 정식서비스를 개시 하여 ’28년 부터 의무화되는 기후공시 와 ’31년 부터 최초 공시 대상에 적용되는 금융배출량 등 스코프3 공시 에 대비할 수 있도록 지원할 예정이다. * (금융배출량) 금융회사가 투자·대출 등 금융활동을 통해 거래상대의 탄소배출에 간접적으로 기여한 부분 \u003c ➌ 업종별 탄소감축 로드맵 수립 현황 > 산업부 는 철강, 석유화학, 시멘트, 정유, 전자조립 5개 다배출 업종 의 녹색전환을 위한 업종별 로드맵의 추진현황을 공유 하였다. 로드맵은 업종별 2035 NDC 감축수단을 반영한 녹색전환 기술·경로 , 단· 중·장기 추진계획 등을 구체화 하여 녹색전환의 이행방향 을 제시할 계획 이다. 본 로드맵에 대해 산업계·관계부처 등 관계기관 등의 의견수렴을 거쳐 연내 로드맵 최종안을 마련 할 계획이라고 밝혔다. * (철강) 수소환원제철 및 저탄소·고부가화를 통한 그린철강 선도국 도약 (석유화학) 전기·무탄소 전환과 바이오·재활용 원료 기반 산업 대전환 (시멘트) 혼합시멘트 고도화 등을 통한 시멘트 산업 저탄소 전환 (정유) 바이오원료·폐자원 기반 제품 생산 확대 및 에너지효율 제고 (전자조립) 초격차 공정기술 기반 선도적 저탄소·고부가가치 전환 아울러, 참석자들은 해외 (EU·일본)의 전환금융 운영사례 를 바탕으로, 업종별 탄소감축 로드맵을 전환금융 심사에 활용 하고, 자금지원 이후 기업의 감축 계획 이행 상황을 점검 하는 절차를 국내 산업 여건과 금융실무에 맞게 적용 하는 방안 을 논의하였다. 전요섭 금융정책국장 은 “이번에 마련한 모범규준 이 기업의 저탄소 전환에 필요한 자금공급으로 이어지는 것 이 중요하다”며, “금융회사들이 기업의 전환 수요를 적극 발굴 하고, 이에 맞는 상품개발 에 힘써달라”고 당부했다. 금융위 는 앞으로도 기후금융을 활성화를 위한 주요 과제들을 순차적으로 논의하면서, 탄소중립으로의 이행을 위한 ‘K-GX (녹색대전환) ’ , ‘에너지 대전환’ 등 정부 정책을 적극적으로 이행 할 계획이다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "금융시장 위기 대비체계를  한층 더 강화하였습니다. - 자체정상화·부실정리계획(RRP)을 연계한 관계기관 합동 모의훈련 최초 실시", "department": "구조개선정책과", "date": "2026-11-25", "url": "https://www.fsc.go.kr/no010101/88224", "summary": "금융위원회 는 금융감독원 , 예금보험공사 , 한국은행 및 10개 ‘금융체계상 중요한 금융기관 (이하 “SIFI * ”) ’과 함께 11월 25일(수) 예금보험공사 (서울 중구) 에서 자체정상화계획·부실정리계획 (이하 “RRP”) 을 연계 한 관계기관 합동 모의 훈련 을 실시 하였다. * S ystemically I mportant F inancial I nstitution: 「금융산업의 구조개선에 관한 법률」에 따라 금융위가 선정하며, RRP 제도 적용대상 (신한·KB·하나·우리·농협금융지주, 신한·KB국민·하나·우리·농협은행) [ 자체정상화계획·부실정리계획 ( RRP , R ecovery and R esolution P lanning) ] \u003c참고> ※ 금융안정위원회(FSB)는 `08년 글로벌 금융위기를 계기로, 대형 금융회사의 부실이 금융시스템에 미치는 충격을 완화하기 위해 RRP제도 도입을 권고. 우리나라는 「금융산업의 구조개선에 관한 법률」 개정을 통해 `21년 시행 ㅇ 자체정상화계획: 금융체계상 중요한 금융기관이 경영 위기상황에 대비하여 자체적으로 건전성을 회복하기 위한 자구계획 ㅇ 부실정리계획: 금융체계상 중요한 금융기관이 자체적으로 건전성을 회복하기 불가능한 경우에 대비하여, 정리당국이 해당 금융기관을 체계적으로 정리하기 위한 계획 그간 자체정상화계획 과 부실정리계획 모의훈련 을 각각 별도로 실시 해 왔으나 * , 이번 모의훈련에서는 두 계획의 이행과정을 하나의 시나리오로 연계 하였다 . 이는 최초로 실시 되는 자체정상화계획·부실정리계획 연계 합동훈련 으로 , 각 위기 단계별 점검을 넘어 위기가 전개되는 전 과정에서 대응 조치의 연계성 과 정책공조 방안 을 종합적으로 검토 하는 자리로서 의의가 있다. * 자체정상화계획은 각 SIFI별로, 부실정리계획은 각 SIFI와 예보 또는 관계기관 간 실시 자체정상화-부실정리계획 비교 자체정상화계획 (Recovery plan) 부실정리계획 (Resolution plan) ➊ 작성목적 금융기관 자구책을 통한 경영건전성 회복 SIFI 부실 시 질서정연한 정리 ➋ 작성주체 금융체계상 중요한 금융기관 10개사 예금보험공사 ➌ 평가·승인 금감원 평가 및 심의위원회 심의 이후 금융위 승인 심의위원회 심의 이후 금융위 승인 ➍ 위기 시 대응 자체정상화계획 적기시정조치 부실정리계획 금융기관 자구책 실행 (발동요건 충족시) 경영개선권고 (BIS\u003c8% 등) 경영개선요구 (BIS\u003c6% 등) 경영개선명령 (BIS\u003c2% 등) 부실금융기관 결정 (부채>자산 등) · 자본 확충 · 유동성 조달 등 · 배당 제한 · 증자 등 · 조직 축소 · 자산 처분 등 · 임원 직무정지 · 계약이전 등 · 감자 및 자금지원 · 경영정상화 이행약정 이번 훈련은 고금리와 경기침체 등 거시경제 여건 악화 와 AI 등을 활용한 사이버 공격 이 중첩 되면서 시장 신뢰 와 유동성이 급격히 저하 되고, 이에 따라 SIFI의 경영상황 이 단계적으로 악화 되는 상황을 가정 하였다. 이를 토대로 각 기관은 자체정상화계획 이행 관리, 핵심기능 유지, 정리 전 략 및 재원조달 등 위기단계별 역할 과 대응방안 을 발표 하고, 관계기관의 협조가 필요 한 사항과 제도·운영상 보완과제 를 중심으로 토의를 진행 하였다. 아울러, 부실 SIFI 정리 시 신속하고 정확한 가치평가 를 위해, SIFI의 실사데이터 산출역량 자체점검 결과와 회계법인의 개선과제 발표를 바탕으로 실사데이터 산출·관리체계의 중장기 개선방안을 논의하였다. 이번 훈련을 통해 관계기관 은 급속한 위기 전개에 대응 하기 위해서는 위기단계 전환에 필요한 정보가 적시에 공유 되고, 후속조치 협의 가 신속하게 이루어져야 한다는 데 인식 을 같이하였다. 예보 김성식 사장 은 “이번 훈련은 RRP를 기반으로 관계기관 공조체계를 함께 점검하는 의미 있는 계기 ”라며, “ 철저한 사전 준비 와 관계기관 간 긴밀한 공조 를 통해 위기대응역량을 한층 높이는 것이 필수적 ”이라고 밝혔다. 금융위 김기한 구조개선정책관 은 “ 금융위기 의 전개 속도가 빨라지면서 당국에 주어진 대응시간도 짧아지고 있다”며, “ 평상시 에 대응체계를 준비 하고, 실제 작동여부를 충실히 점검 해야한다 ”고 강조 하였다. 금감원 곽범준 은행담당 부원장보 는 “ 금융 위기상황 에서 위기의 확산을 방지하기 위해서는 관계기관 간 원활한 정보공유 를 통한 신속한 공동대응 이 매우 중요하다”라고 관계기관 간 유기적 협력의 중요성 을 강조하였다. 금융위·금감원·예보는 이번 훈련에서 확인된 개선·보완사항 을 차년도 자체 정상화계획 평가 및 부실정리계획 수립 과정에 반영 하여 각 계획의 실효성을 높일 계획이다. 아울러 위기 단계별 관계기관 간 협력채널을 강화 하는 등 위기대응체계 고도화 도 지속 추진할 예정 이다.", "essential": false, "importanceReasons": ["system change / test (+2)"], "market": true, "tier": "routine"}, {"source": "FSS", "title": "언론사 기자 등의 부정거래행위 등 불공정거래 행위에 대한 조치 의결(2건)", "department": "조사2국/조사3국", "date": "2026-11-25", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250022&menuNo=200218&pageIndex=1", "summary": "증권선물위원회(위원장 신진창)는 제21차 정례회의('26.11.25일)에서, (1) 본인이 선행 매수한 주식에 대한 기사와 관련하여 보도 방향 설정, 보도 여부 결정 등에 관여한 언론사 기자를 자본시장법상 부정거래행위 금지 위반 혐의로 중대범죄수사청(이하 '중수청')에 고발 조치하는 것을 의결하고, 언론사에 소속된 자들로서 직무와 관련하여 알게 된 호재성 기사 정보를 이용하여 해당 기사 보도전에 주식을 매매하거나 타인에게 이용하게 한 자들에 대해 자본시장법상 시장질서 교란행위 금지 위반으로 약 50억원의 과징금을 부과하는 조치를 의결하였습니다. 또한 (2) 최대주주 변경을 수반하는 주식 양수도 계약에 관한 미공개정보를 전달하거나 이를 매매에 이용한 코스닥 상장법인의 임직원 등을 자본시장법상 미공개중요정보 이용 혐의 등으로 중수청에 통보하는 조치를 의결하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "언론사 기자 등의 부정거래행위 등  불공정거래 행위에 대한 조치 의결(2건)", "department": "자본시장조사총괄과,자본시장조사과", "date": "2026-11-25", "url": "https://www.fsc.go.kr/no010101/88228", "summary": "[ 조치 개요 ] 증권선물위원회 (위원장 신진창) 는 제21차 정례회의 ( ’ 26.11.25일) 에서, (1) 본인이 선행 매수한 주식에 대한 기사 와 관련하여 보도 방향 설정, 보도 여부 결정 등에 관여한 언론사 기자를 자본시장법 상 부정거래행위 금지 위반 혐의로 중대범죄수사청(이하 ‘중수청’)에 고발 조치하는 것을 의결하고, 언론사에 소속된 자 들로서 직무와 관련하여 알게 된 호재성 기사 정보를 이용 하여 해당 기사 보도전에 주식을 매매 하거나 타인에게 이용 하게 한 자들에 대해 자본시장법상 시장질서 교란행위 금지 위반으로 약 50억원의 과징금 을 부과 하는 조치를 의결하였습니다. 또한 (2) 최대주주 변경을 수반하는 주식 양수도 계약 에 관한 미공개 정보를 전달하거나 이를 매매에 이용한 코스닥 상장법인의 임직원 등 을 자본시장법상 미공개중요정보 이용 혐의 등으로 중수청에 통보하는 조치를 의결하였 습니다. ※ 두 건은 별개의 사건으로, 각각에 대해 개별적인 조치가 이루어진 것임 ◈ 자본시장법에서 금지하는 미공개중요정보 이용행위 는 상장법인의 임직원 등 내부자 가 업무 등 과 관련 된 미공개중요정보 를 특정증권 등의 매매, 그 밖의 거래에 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §174①) 를 말합니다. ◈ 자본시장법에서 금지하는 부정거래행위는 금융투자상품의 매매, 그 밖의 거래 와 관련하여 부정한 수단, 계획 또는 기교를 사용 하는 행위 (자본시장법 §178 ① ) 를 의미합니다. ◈ 또한, 금융투자상품의 매매 여부 또는 조건에 중대한 영향 을 줄 수 있는 정보를 직무상 생산하거나 알게 된 자 또는 이를 전달받은 자 가 해당 정보의 공개 전에 이를 주식의 매매 등에 이용 하거나 타인에게 이용 하게 하는 행위는 시장질서 교란행위 (자본시장법 §178의2 ① ) 에 해당합니다. [ (1) A 언론사 기자 등의 부정거래행위 및 시장질서 교란 행위 ] 혐의자 중 1인은 기사보도 및 방향설정을 지시할 수 있는 지위에서 본인이 선행 매수한 주식에 대한 기사 보도를 지시 하거나 직접 기사를 출고 하는 등 보도에 관여하는 방법으로 자본시장법상 금지된 부정거래행위를 한 혐의 가 있습니다. 또한, 위 혐의자를 포함한 언론사 기자 등은 내부 기사보고 시스템에 등록된 자료 또는 기자들의 단체대화방 메시지 등을 통해 보도 예정인 호재성 기사 내용을 미리 인지 하고 주식매매에 이용 하거나 이를 지인·가족에게 전달하여 주식매매에 이용 하게 하였고, 이를 전달받은 지인·가족은 동 정보를 주식매매에 이용 하여 자본시장법상 금지된 시장질서교란행위 를 범한 것으로 확인되었습니다. 주가조작근절 합동대응단 (단장 황선오) 은 해당 혐의자들에 대해 압수･수색 등을 포함한 집중 조사를 실시하여, ’ 23년부터 3년여에 걸쳐 이어진 혐의자들의 위법행위를 확인· 적발하였습니다. * 향후 수사 결과에 따라 부당이득의 최대 2배의 과징금 부과 등 후속조치 이행 추진 [ (2) 상장법인 및 인수회사의 임직원 등의 미공개중요정보 이용행위 등 ] 상장회사 B사의 임직원 E,F,G는 직무와 관련하여 취득한 B사 최대주주의 주식양수도계약 관련 미공개중요정보 를 매매에 이용 하거나 지인에게 전달 하여 약 1.8억 원 상당의 부당이득을 취득한 혐의가 확인되었습니다. 또 한 E는 B 사의 임원으로 선임 된 이후 본인 계산, 타인 명의 계좌로 B 사 주식을 취득·처분하여 소유상황 보고의무 가 발생 하였음에도 이를 이 행하지 않은 사실 도 밝혀졌습니다. 한편, B사의 주식을 인수하는 C사의 직원 H 는 직무와 관련하여 취득한 C사의 B사 주식 인수에 관한 미공개중요정보 를 배우자 I 에게 전달 하였고, 이를 전달받은 I 는 친인척 J와 공모 한 후 동 미공개정보를 이용하여 약 1억원 상당의 부당이득 을 취득 한 혐의가 있습니다. 그리고 C사의 계열회사 D의 직원 K 는 C사의 홍보업무를 수행하는 과정에서 위 미공개중요정보 를 알게 된 뒤 이를 이용 하여 약 2천 7백만원 상당의 부당이득 을 취득한 사실이 확인되었습니다. [ 유의 사항 ] 상장기업의 호재성 기사 보도 에 관여한 언론사 종사자 가 그 기사정보를 보도 전에 주식매매 등에 이용하는 행위 는 자본시장법상 금지하는 불공정거래에 해당할 수 있으며, 이에 해당할 경우 1년 이상 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 그리고, 투자 판단에 중대한 영향을 줄 가능성이 있는 정보를 직무상 알게 된 자가 불특정 다수인이 알 수 있도록 공개되기 전, 해당 정보를 이용 하거나 타인에게 이용하게 하는 경우 , 시장질서 교란행위 에 해당하여 과징금 (부당이득의 최대 1.5배에 상당하는 금액) 을 부과 받을 수 있으므로 투자시 유의하시기 바랍니다. 또한, 상장사의 최대주주, 대표이사, 임직원 등 내부자 가 그 직무와 관련하여 알게 된 공개되지 않은 중요정보 를 거래에 이용 하거나 타인에게 이용 하게 하는 경우 자본시장법 위반으로 1년 이상의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있으며, 상장사의 임원 또는 주요주주 는 임원 또는 주요주주가 된 날부터 5일 이내 에 명의 와 무관 하게 자기 의 계산 으로 소유 하고 있는 회사 주식을, 그 회사 주식의 소유 상황 에 변동 이 있는 경우에는 그 내용을 변동일 로부터 5일 이내 에 금융 감독원에 보고 하여야 함에도 이를 이행하지 않는 경우 1년 이하의 징역 또는 3천만원 이하의 벌금 등 형사처벌을 받을 수 있습니다. 금융위원회와 금융감독원은 앞으로도 자본시장의 공정성을 확보하고 투자자 신뢰를 보호하기 위해 불공정거래 행위 를 예의주시하고, 적발된 위법행위 에 대해서는 철저히 조사하여 엄중 조치 함으로써 자본시장 거래 질서 확립 에 만전을 기하겠습니다. 자본시장 불공정거래 행위가 의심되는경우에는 적극적으로 신고하여 주시기 바랍니다. ※ 수 사에 미치는 영향 등을 고 려하여 조 치대상자 및 종목명은 공표하지 않습니다. 본 조치 사안과 관련한 문의는, 아래 담당자에게 해주시길 바랍니다. (1) 관련 : 금융위원회 자본시장조사과, 금융감독원 조사3국 (2) 관련 : 금융감독원 조사2국 \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 ‣ 인터넷 : 금융위원회 홈페이지 [참여마당 → 신고마당 → 불공정거래신고] 메뉴 ☞ 금융감독원 불법금융신고센터 ‣ 인터넷 : 금융감독원 홈페이지 [민원·신고 → 불법금융신고센터 → 증권불공정거래신고] 메뉴 ‣ 전 화 : 1332 ☞ 한국거래소 불공정거래신고센터 ‣ 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) ‣ 전 화 : 1577-0088", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSS", "title": "「주식회사 등의 외부감사에 관한 법률」 위반 혐의에 대한 감리결과 조치", "department": "감사인감리국", "date": "2026-11-25", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250024&menuNo=200218&pageIndex=1", "summary": "증권선물위원회(위원장: 신진창)는 11월 25일 제21차 회의에서 비밀엄수 의무 위반 등 「주식회사 등의 외부감사에 관한 법률」을 위반한 공인회계사에 대하여 감사업무제한 등의 조치를 의결하였습니다.\n※ 자세한 내 과,서민금융과", "date": "2026-11-26", "url": "https://www.fsc.go.kr/no010101/88232", "summary": "1 회의 개요 2026.11.26.(목) 금융위원회는 「제8차 포용적 금융 대전환 회의」 를 개최하였다. 오늘 회의에서는 관계기관 및 민간 전문가와 함께 포용금융 확대를 위한 금융권 건전성 규제 합리화 방안, 은행-저축은행 온렌딩 대출 추진방안 및 금융권 개인 연체채권 관리실적 공시안 을 논의하였다. ▪ (일시/장소) 11.26 .(목) 10:00~11:10 / 은행연합회 ▪ (참석) 금융위원장, 금융위 금융산업국장, 금융소비자국장, 금융감독원 부원장 은행연합회 전무, 생명보험협회 회장, 저축은행중앙회 회장, 여신금융협회 회장, 대부금융협회 회장, 신협중앙회 회장, 우리은행장 남재현(국민대), 서은숙(상명대), 김석기(금융연구원), 김경진(KB은행), 김성수(카카오뱅크), 윤현영(신한저축은행) ▪ (안건) ➊ 포용금융 확대를 위한 금융권 건전성 규제 합리화 방안(금융위·금감원) ➋ 은행-저축은행 협업 온렌딩 대출방안(우리은행) ➌ 금융권 개인연체채권 관리실적 공시안(금감원) 2 금융위원장 모두발언 주요내용 이억원 금융위원장 은 ’26.1월 포용적 금융 대전환 을 시작한 이후 정부와 금융권이 꾸준히 노력한 결과, 최근 금리가 상승 하는 어려운 여건 속에서도 ▴ 포용금융 공급은 역대 최고수준 으로, ▴ 저신용자의 금리는 낮아지고 대출잔액은 증가 하고 있으며, ▴ 연체 채무자의 경제적 재기 지원 도 지속 확대 되고 있다고 평가 하였다. 아울러, 이제는 포용금융의 양적 확대를 넘어 지속가능한 포용금융 시스템을 구축 하는 데에 집중 할 필요 가 있다고 발언했다. 이를 위해 ▴ 은행과 저축은행이 협업 하여 중저신용자에게 낮은 금리로 대출해주는 ‘포용 온렌딩 대출’ 의 출시를 지원하고, ▴ 금융권의 연체채권 실적 공시 등을 통해 연체채권을 투명하고 합리적으로 관리 할 것을 강조하였다. 또한, ▴ 포용금융 관련 건전성 규제를 합리화 하는 등 포용금융을 지속 확대할 수 있는 제도적 기반 이 필요하다고 언급하였다. 3 안건 주요 논의내용 1 포용금융 확대를 위한 금융권 건전성 규제 합리화 방안 금융권은 금융취약계층의 금융접근성 제고 및 금융생활 안정 지원 을 위하여 포용금융을 적극 추진 하고 있다. 그 결과, 최근 시장금리 상승 에도 불구하고 中-高신용자와 달리 低신용자에 대한 신용대출 금리는 오히려 하락 하고, 잔액은 증가 하는 것으로 나타났다. \u003c 최근 금융권 가계신용대출 공급현황 분석 결과(신용정보원) > ▪ 시장금리 상승 으로 中-高신용자 금리 (잔액기준) 는 상승 했으나, 低신용자 금리 는 오히려 0.05%p 은행 ~0.27%p 저축은행 하락 - 특히 잔액기준 금리가 하락 한 것으로서, 신규취급 금리의 하락 효과 가 기존 대출 (변동 금리 대출) 의 금리 상승효과를 상쇄 하는 수준인 것으로 판단 \u003c 신용도별·업권별 신용대출 금리변화 > 구분(단위 : %) 低신용자 中신용자 高신용자 ’26.3말 ’26.7말 증감 ’26.3말 ’26.7말 증감 ’26.3말 ’26.7말 증감 은행 8.68 8.63 △0.05 5.82 5.99 + 0.17 4.95 5.14 +0.19 상호금융 7.51 7.51 - 5.99 6.12 + 0.13 5.58 5.74 +0.16 새마을 6.89 6.83 △0.06 6.00 6.02 + 0.02 4.82 4.87 +0.05 보험 9.92 9.79 △0.13 8.62 8.63 +0.01 8.39 8.40 +0.01 여전(신용) 14.94 14.87 △0.07 13.20 13.21 +0.01 7.11 7.26 +0.15 여전(카드론) 15.30 15.12 △0.18 13.02 13.06 +0.04 11.10 11.11 +0.01 저축은행 15.34 15.07 △0.27 14.49 14.32 △0.17 5.91 5.80 △0.11 여전(현금서비스) 19.07 19.09 +0.02 18.19 18.23 +0.04 16.14 15.97 △0.17 ▪ 최근 低신용자 신용대출 잔액 은 증가 ( ’26.3말 83.1조원→ ’26.7말 84.1조원, +1.0조원) 하였으며, 低신용자의 잔액 증가율이 가장 높음 (低(+1.2%)-中(+0.0%)-高(△0.3%) 순) 이번 건전성 규제 합리화 방안은 국제기준 및 해외사례 등을 감안하여 포용금융을 제한 할 수 있는 금융권 건전성 규제를 합리화 하는 내용이다. 이를 위해 금융위원회와 금융감독원은 그간 ‘ 포용금융추진단 건전성 규제 합리화반 ’을 통해 금융권과 건전성 규제 개선 필요 과제를 발굴·검토 해왔다 . 그 결과, 금융회사의 건전경영이라는 건전성 규제의 기본적인 목적을 유지 하되, 포용금융 에 대한 금융권의 유인이 축소되지 않고, 충분한 자본여력 을 바탕으로 포용금융을 지속적으로 확대 할 수 있도록 총 9개 과제 의 건전성 규제 합리화 방안을 마련하였다. [ ➊ 포용금융을 위한 자본규제 합리화] ➀ 소상공인시장진흥공단 (이하 ‘소진공’) 보증부대출 등에 적용되는 위험 가중치(RW) 를 기존 20%에서 0%로 합리화 한다. 현재 공공기관 중 정부 로부터 제도적으로 결손보전 이 되는 기관 등의 경우 RW 0% 를 적용할 수 있는데, 소진공 은 근거법상 기관에 대한 결손보전 조항이 없어 RW 20%를 적용 하고 있다. 이에 소진공 소관 사업 재원의 대부분 을 차지하는 소상공인 시장진흥기금 * 에 대해 정부 결손보전 의무 가 있는 점 등을 고려하여 RW 0% 를 적용하고, 소진공 보증부대출 에 대한 은행권의 자본부담을 합리화 한다. * 소진공 사업의 대부분(90% 이상)을 소상공인시장진흥기금으로 운영〔※소진공 공시자료〕 ➁ 신용리스크 RW 0%가 적용되는 공공기관 * 은 시장리스크 ** 산출시 부도리스크도 0% 를 적용한다. 현재 신용리스크와 달리 시장리스크 산출시에는 공공기관도 RW 0.5~15% 가 적용되고 있는데, 실질 리스크 와 달리 불합리하게 자본부담이 부과 되고 있다는 점을 고려하였다. * 공공기관이 정부 결손보전 등을 받는 경우, 정부와 동일하게 RW 0% 적용(신·기보 등) ** 시장리스크 = 민감도리스크(금리·환율·주가 등) + 부도리스크 + 잔여리스크 ➂ 서민금융진흥원 (이하 ‘서금원’) 을 보험업권 K-ICS 체계상 적격 보증인으로 인정 하여 보증부대출에 기존(8%)보다 낮은 위험계수(2.5%)를 적용 한다. 현행 K-ICS 체계상 서금원은 신용등급이 없어 적격 보증인으로 인정받지 못하였는데 , 서금원은 정부 출연을 받는 공공기관 으로서 은행 등 他 업권에서도 적격 보증인으로 인정 되는 점을 고려한 것이다. 아울러, ➃ 은행의 대안신용평가모형 을 여신심사에만 활용하지 않고, 규제모형 * 으로 승인 하여 자본비율 산출 및 충당금 산정 등에 활용 한다. 현재 대안신용평가모형은 여신심사 시에만 활용 (전략모형) 되고 자본비율 산출 (규제모형) 등에는 활용되지 않고 있어, 정작 자본비율 산출 시 에는 평균적으로 실질부도율보다 높게 평가 됨에 따라 자본부담이 증가 한다. 이에 대안신용평가 활성화를 위하여 대안신용평가모형의 규제모형 승인 을 추진 한다. 은행은 자본부담이 합리화 ** 됨에 따라 같은 자본으로 더 많은 중저신용자 대출 을 공급할 수 있고, 대안신용평가가 여신심사에 더욱 내재화 되는 기반 이 마련될 것으로 기대된다. * 규제모형 : 연체이력 등 신용정보 중심의 전통적 신용평가모형으로, 금감원 승인을 받아 여신심사뿐 아니라 자본비율 및 충당금 산출 등 건전성 관리 전반에 활용 ** A은행은 중저신용자 대출 평균 RW가 기존 120%→80~100%로 하락할 것으로 예상(잠정) [ ➋ 포용금융을 위한 자산건전성 규제 합리화] 금융회사 (은행·보험·여전사·저축은행) 자체 채무조정 여신 (채무조정 시점 ‘요주의 여신’인 경우) 에 대해 6개월 이상 정상 상환 되는 경우, ‘정상 여신’으로 분류 하도록 한다. 현재 신용회복위원회 프리워크아웃 (요주의 여신 限) 은 개시 후 6개월 이상 정상 상환 시 정상 여신 으로 분류하는 데에 반해, 금융회사 자체 채무조정 여신은 1년 이상 정상 상환 할 것을 요구 하고 있어 자체 채무조정의 유인을 낮출 수 있는 문제 를 해소 한 것이다. * 다만, 금융회사는 채무조정 여신의 신용위험이 과소평가되지 않도록 등급상향 대상 여신에 대한 금융회사의 자체기준(예: 타 금융회사 채무불이행 여부 확인)을 마련·운영 카드사 의 채권에 대해서는 연체 이전 에 자체 채무조정 또는 신용회복위원회 신속채무조정 을 받은 경우 연체 채권에서 제외 하고 정상 채권 으로 분류할 수 있도록 한다. 현재 연체가 발생하지 않은 채권 에 대해서도 자체 채무조정 등을 받은 경우 연체채권 및 ‘요주의’ 채권으로 분류 하도록 하고 있어, 카드사의 사전 채무조정 유인 이 낮은 점을 고려하였다. 저축은행 의 개인사업자 대출 에 대해 ▴ 금융기관 차입금 이 연간매출액을 초과 할 것 외에 ▴ 최근 2년 연속 순손실 이 발생할 것을 추가로 충족하는 경우에 ‘부실징후 예시’ 에 해당하는 것으로 보고, ‘요주의 여신’으로 분류 한다. 현실적으로 저축은행 을 이용하는 소상공인·자영업자 는 차입금이 연간매출액을 초과하는 경우가 많아 충당금 부담이 과도 한 점을 고려한 것이다. * 정상적인 경영환경에서도 차입금이 매출액을 초과할 가능성이 높은 측면(예: 일회성 시설투자로 차입금이 매출액을 초과하는 경우) [ ➌ 포용금융 지원 여력 확보를 위한 자본규제 합리화] 금융권이 포용금융을 확대하기 위해서는 충분한 자본여력이 뒷받침 되어야 하는 점을 고려하여, 포용금융을 위한 금융권의 지원여력 확보 를 위하여 추가적인 자본규제 합리화 과제 를 시행한다. 은행이 보완자본 으로 인정되는 후순위채 의 자본인정액 을 매년초 20%가 아닌 매분기 초에 5%씩 차감 할 수 있도록 한다. 현재 은행은 보완자본 으로 인정되는 후순위채 는 잔존만기가 5년 이내인 경우 자본인정액을 매년초 20%씩 일괄 차감 하고 있는데, 매분기 초에 5%씩 차감 할 수 있음을 해석상 명확히 하여 은행의 자본부담을 합리화 하는 것이다. 또한, ➈ 은행이 해외 집합투자증권 익스포져에 기초자산접근법 * 을 사용하여 낮은 RW 를 적용할 수 있도록 허용한다. 이는 해외 집합투자증권 은 기초자산 등에 대한 즉각적인 자료 입수가 현실적으로 어려워 기초자산접근법 적용 요건을 충족하지 못함에 따라 약정서기반접근법 * 으로 높은 RW 를 적용하는 문제를 해소 한 것이다 ** . * (기초자산접근법) 펀드에 편입된 실제 기초자산별로 RW를 적용 (약정서기반접근법) 펀드의 약관 등에 따른 각 기초자산 편입한도별로 RW를 적용하되, 기초자산 중 높은 RW를 적용받는 자산부터 최대한 편입하는 것으로 가정 ** 적시는 아니지만 은행이 최근 † 정보를 입수할 수 있는 경우 허용 † 예: ‘26.3월말 은행 재무제표 작성시 ’25년말~‘26.2월말 기간 등 최근의 기초자산 등 정보를 입수할 수 있는 경우, 이를 근거로 기초자산접근법 사용 가능 [기대효과 및 향후 일정] 건전성 규제 합리화를 통해 금융권의 포용금융 자금공급 여력이 대폭 증가할 것으로 기대 된다. 각 과제는 업권별 감독규정 또는 시행세칙 의 개정 (~’27.3월) 및 해석 (~’27.1월) 등을 거쳐 내년 1분기 내 시행 될 계획이다 . 금융위원회 및 금융감독원은 금융권이 추가 자금공급 여력 을 포용금융에 충실히 공급 하는지 모니터링 하고, 자본규제 합리화 과제 등을 지속적으로 발굴·검토 할 예정이다. 2 은행-저축은행 협업 포용 온렌딩 대출방안 [추진배경 및 주요내용] 은행이 저축은행과 협업 하여 중저신용자에 저리로 자금을 공급 하는 온렌딩 대출 을 추진한다. 저신용자 에 대한 신용대출 잔액 이 증가 하는 가운데, 금리도 하락 하고 있으나, 여전히 제2금융권 중신용자에서 급격하게 금리가 높아지는 금리단층 구조 * 는 잔존하고 있다. * 조달비용, 심사역량 차이 등으로 제2금융권 중금리 시장이 충분히 작동하지 않으면서, 중신용자 (은행: 6%대, 여전·저축은행 13~4%대) 부터 급격하게 금리가 상승하는 현상 이에, 금리단층 구조를 완화하기 위해 은행 과 저축은행 협업 을 통해 중저신용자 대상 금리 를 대폭 인하 할 수 있는 포용 온렌딩 대출 을 추진 한다. 포용 온렌딩 대출은 은행이 저축은행에 자금을 공급 하고, 저축은행 이 이를 재원 으로 중저신용자에게 대출을 실행 하는 구조 이다. 새희망 홀씨 상품 지원대상 범위 내의 중저신용자 에 공급하고, 금리 는 은행과 저축은행 간 자율 결정하되 최종 대출금리는 평균 10% 내외 (평균) 로 운용 할 계획이다. * 연소득 4천만원 이하 또는 연소득 5천만원 이하 & 신용평점 하위 20% ** 다만, 기준금리 변동시 금리 10%를 기준으로 조정(예: 0.5%p 상승시 10.5%로 조정) 은행은 직접 중저신용자 대출을 시행하지 않고 저축은행에 자금을 공급함에 따라 대출 사후 관리비용 을 절감 하고, 낮은 위험가중치 를 적용 하여 저리 로 저축은행에 자금 을 공급 할 수 있다. 저축은행은 은행으로부터 저리로 자금을 조달함에 따라 자본원가, 법적비용 (예보료) , 업무원가 등 절감이 가능해 진다. 그 결과, 소비자는 최종적 으로 기존 저축은행 대출보다 약 3~5%p의 금리를 절감 할 수 있을 것으로 기대 된다. [향후 추진일정] 금융위원회는 원활한 온렌딩 대출 공급을 위해 기획형 규제 샌드박스 를 통해 은행-저축은행 간 신용공여 등과 관련된 은행법 및 금융지주회사법 등에 대하여 규제특례 를 부여할 예정이다. 아울러, 은행 의 온렌딩 대출 실적 은 새희망홀씨 실적으로 인정 하고 신보·기보·지신보 등에 대한 출연료 납부대상 에서 제외 (규제 샌드박스) 하는 등 온렌딩 대출 취급 은행·저축은행에 충분한 인센티브를 제공 할 계획이다. * 인터넷은행의 경우 금융혁신법령 개정 후 즉시 추진 ’26.11월말 부터 규제특례를 받을 사업자를 모집 하고, ’27년초 혁신금융서비스 지정 후 1분기 내 에 온렌딩 대출 상품을 출시 할 예정이다. 3 금융권 개인 연체채권 관리실적 공시 금융위원회 및 금융감독원은 ’26.2월 ‘개인 연체채권 관리 강화방안’ 발표 등을 통해 금융권의 회수 중심 개인 연체채권 관리 관행을 개선해오고 있다 . 그 후속 조치 중 하나로 ’26년 상반기 은행·저축은행·상호금융 (새마을금고 제외) · 여전사 (카드·캐피탈) ·대부업체 (상위 30개사) 의 금융회사별 ➊ 소멸시효 완성 또는 소멸시효 도래 전 채권 소각 , ➋ 자체 채무조정, ➌ 채권 매각 실적을 각 협회 및 중앙회 홈페이지 에 최초로 공시 한다. 금융권은 ’26년 상반기 중 ➊ 개인 연체채권 총 35.5만건, 1.6조원 을 소멸시효 완성 또는 중도 소각 하였으며, 소멸시효 도래 전 소각 규모는 1.3조원 (28.4만건, 82%(금액기준)) 이다. 같은 기간 ➋ 자체 채무조정 은 총 34.1만건, 13.9조원 에 대해 이루어졌으며, 은행 (15.6만건) 과 여전사 (13.7만건) 가 전체 채무조정 건수의 대부분 (86%) 을 차지했다. 마지막으로, ➌ 채권매각 은 개인연체채권 7.8조원 (대출원금 잔액) , 92.7만건 에 대하여 3조 9,504억원에 매각 한 것으로 나타났다. 이번 실적공시는 그간 금융회사별로 산발적으로 관리되어 온 개인 연체채권 관리 실적을 체계적으로 집계·공개 하여 금융회사의 책임 을 보다 강화 하고, 채무자 보호와 재기지원 중심의 개인연체채권 관리를 금융현장에 정착 시켜 지속가능한 포용금융 기반 을 마련하는 데 역할을 할 것으로 기대된다. 금융위원회 및 금융감독원은 반기별로 실적 을 공시하여 금융권의 기계적인 소멸시효 연장을 개선 하고, 무책임하고 반복적인 연체채권 매각 이 아니라 연체 초기 선제적인 자체 채무조정 을 활성화시키는 방향으로 금융회사를 관리·감 독해 나간다. 특히, 내년부터 은행권을 대상으로 우선 시행하는 포용 금융 종합평가 를 통해 개인연체채권 관리 실적을 평가·환류 할 계획이다. ※ 붙임 : 1. 금융위원장 모두발언 2. (안건1) 포용금융 확대를 위한 금융권 건전성 규제 합리화 방안 3. (안건2) 은행-저축은행 협업 포용 온렌딩 대출방안 4. (안건3) 금융권 개인 연체채권 관리 실적 공시안", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "보험 판매수수료의 과도한 경쟁을 억제하여 소비자의 보험료 부담을 낮추겠습니다.", "department": "보험상품분쟁1국/보험감독국/보험검사1국/보험검사2국/보험검사3국", "date": "2026-11-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250030&menuNo=200218&pageIndex=1", "summary": "ㅁ ’27.1월 판매수수료 개편방안 시행에 맞춰 제도 시행의 실효성 확보를 위해 판매수수료 상한을 설정하고 공시규제를 강화하는 행정지도 시행\n① (사업비 집행) 보험회사가 수수료 지급목적으로 보험료에 반영된 계약체결비용과 표준해약공제액 중 작은 금액 이내에서 판매수수료를 집행하도록 모집수수료 지급한도 규제 강화\n※ 종신사망보험의 경우, 계약체결비용 관련 공시규제에서 특례가 적용되어 계약체결비용을 표준해약공제액의 1.4배 이내에서 부과하는 경우 공시의무가 부과되지 않는 점을 고려\n② (사업비 공시) 기준연령 요건뿐만 아니라 전체 연령,납입기간 조건에서 계약체결비용이 표준해약공제액을 초과하는 경우 공시의무를 부과하여 현행 공시규제의 우회 소지 차단\n=> ‘27.1월 새로운 제도의 시행시기에 맞춰 규제하고자 하는 사항이 적용될 수 있도록 우선적으로 행정지도를 시행하고, 행정지도 내용에 대한 보험업감독규정 개정도 병행 추진\nㅁ 기초서류에 판매수수료 지급기준을 명확히 반영하고, 수익성 분석 및 실제 수수료 지급 시 해당 기준을 준수하도록 관리,감독 강화\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "포용금융 활성화를 위한 기획형 샌드박스 사업자 모집 개시", "department": "디지털금융총괄국", "date": "2026-11-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250029&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융위원회는 금융소비자의 금융 비용 부담완화, 금융 접근성 제고 등 포용금융 활성화를 위해 기획형 샌드박스 실증 사업자를 모집한다. 사업자 모집은 ’26.11.27.(금) 09:00~12.18.(금) 18:00까지 약 3주간 진행된다.\nㅁ 기획형 샌드박스는 ①금융소비자 편익 제고 등을 위해 정부가 규제 특례가 필요한 분야를 선제적으로 발굴하고, ②서비스를 개발 및 실증할 혁신금융사업자를 모집,선정하여 ③서비스 출시 및 시장형성을 지원하는 탑다운 방식(Top-down)의 샌드박스이다. 사업자의 신청을 바탕으로 규제 특례를 심사,지원하던 일반적 샌드박스와 달리, 정부가 직접 혁신의 방향 및 과제를 선정한다는 점에서 차이가 있다. 기획형 샌드박스를 통해 정부는 정책적 육성이 필요한 분야의 혁신금융사업자 출현을 촉진하고 사업자는 규제 심사 대응 부담을 완화할 수 있을 것으로 기대된다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "[보도참고] 2026년 3/4분기 가계동향조사 결과", "department": "복지경제과", "date": "2026.11.26.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000080050&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "보험 판매수수료의 과도한 경쟁을 억제하여 소비자의 보험료 부담을 낮추겠습니다.", "department": "보험과", "date": "2026-11-26", "url": "https://www.fsc.go.kr/no010101/88236", "summary": "Ⅰ. 추진배경 보험상품은 복잡한 상품구성 등으로 보험설계사 중심의 대면, 방문형 판매가 높은 비중을 차지하는 만큼, 판매수수료 는 보험회사의 영업구조·판매 전략 등에 중대한 영향 을 미치는 핵심적인 요인 으로 인식되어 왔다. 다만, ‘23년 IFRS17 도입 으로 보험회사의 사업비 지출 부담이 감소 * 하면서 보험회사의 사업비 지출 규모 도 크게 증가 ** 하고 있다. 이에 따라 높은 사업비가 보험료에 반영되어 소비자 에게 전가 되고, 불완전판매와 잦은 계약승환 등 불건전 영업행위 를 유발하며, 과도한 판매인센티브 경쟁에 따라 보험회사 재무건전성 저해 로도 이어질 수 있다는 우려가 제기되었다. * 선지급한 사업비를 비용으로 나누어 처리할 수 있는 기간이 “최대 7年”에서 “全보험 기간”으로 확대되면서 연간 사업비 비용처리 부담이 급격히 감소 ** 판매수수료 (조원) : (’19) 15.6 (‘20) 16.5 (’21) 17.8 (‘22) 16.0 (’23) 19.0 (‘24) 23.7 (’25) 27.3 (‘26.上) 14.1 이에 정부는 과도한 판매수수료 선지급 관행을 개선하고, 합리적인 판매수수료 체계 정착을 위해 ｢ 판매수수료 개편방안 * ｣을 마련 (’26.1월 보험업감독규정 개정) 하였고, ‘27.1월 부터는 수수료 분급제도 가 시행될 예정이다. 그 일환으로 선지급수수료 와 유지관리수수료 각각이 보험상품 설계 시 수수료 지급목적으로 보험료에 반영된 ‘ 계약체결비용 ’ 이내 에서 지급될 예정이다. 그러나 보험회사가 계약체결비용 자체 를 높게 설정 하는 방식 등을 통해 판매수수료 지급 을 확대 할 우려가 있는 등 제도의 보완필요성 이 지속 제기되었다. * ’26.1.14일, 금융위·금감원 보도자료 참조 (“보험판매수수료를 분급체계로 개편하여 소비자가 장기간, 세심한 보험 유지관리 서비스를 받을 수 있도록 하겠습니다.”) 이에 대응하여 보험회사의 계약체결비용 부과 실태 및 수수료 관련 기초서류 (수수료등 지급기준 * ) 을 점검 한 결과, 다수의 미비점 이 확인되었다. ① 먼저 계약체결비용 과 관련하여, 현재 계약체결비용 이 표준해약공제액 ** 을 초과하는 경우 공시의무 를 부과하고 있는 기준연령 요건 (만 40세 및 최장기납) 에서는 계약체결비용이 표준해약공제액 이내로 관리되고 있었다. 그러나 공시규제가 적용되지 않는 조건을 포함한 전체 판매가능한 계약조건 을 기준으로 할 경우, 회사별 평균 약 10%의 계약조건 에서 표준해약공제액 을 초과 하여 계약체결비용을 부과하고 있었으며, 해당 계약조건의 계약체결비용 은 표준해약공제액보다 평균 57% 높은 수준 으로 나타났다. * 보험회사가 상품별 보험료 및 해약환급금 산출방법서에서 정한 최적사업비 한도내에서 수수료 등이 지급될 수 있도록 마련한 자체 지급기준 (보험업감독규정 §4-32①) ** 보험소비자 보호를 위해 법규상 정한 해약공제액(보험계약 해지시 소비자 몫의 적립금에서 공제하는 금액)의 상한 (보험업감독규정 §7-66 및 별표14) ② 또한, 다수 보험회사는 기초서류 에 수수료등 지급기준 을 명확히 반영 * 하지 않고 있는 것 으로 확인되었다. 또한, 기초서류에 수수료등 지급기준을 반영한 경우에도 추가 수수료 지급 관련 비용 을 포함시키지 않거나 수수료 지급기준 을 벗어나 수수료를 과다집행 하는 등 지급기준을 형식적 으로 운영하고 있는 것으로 나타났다. * 보험회사는 수수료등 지급기준을 명확히 (임원 확인) 하고, 기초서류 (보험료 및 해약환급금 산출방법서) 필수 기재사항에 포함하여야 함 (보험업감독규정 §7-64) 이에 금융당국은 보험업계 간담회 * (’26.11.24일) 를 통해 점검결과를 공유하고, 과도한 판매 수수료 지급 방지 와 계약체결비용 부과기준 및 공시규정 의 철저한 준수 를 당부하였다. 또한, 점검결과에서 드러난 미비점 을 보완 하고, ’27.1월 시행될 판매수수료 분급제도 의 실효성 을 확보 할 수 있도 록 판매수수료 지급한도 제한 및 공시규제를 강화하는 내용의 행정지도 를 마련·시행 하게 되었다. * 보험회사·보험협회 상품·영업담당 임원 등 참석 Ⅱ. 행정지도 주요내용 판매수수료 지급한도 설정 강화 (’27.1.1일 이후 체결되는 보험계약부터 적용) ‘27.1월부터 시행될 수수료 지급한도 를 계약체결비용 과 표준해약공제액 중 작은 금액 으로 제한 * 한다. 이를 통해 보험회사가 보험료에 반영되는 계약체결비용 자체 를 표준해약공제액 수준보다도 높여 판매수수료를 확대하는 방식의 과도한 수수료 경쟁을 억제 한다. * (기존 ) 선 지급수수료와 유지관리수수료 각각이 수수료 지급목적으로 보험료에 반영된 계약 체결비용 이내에서 지급 (개선) 선 지급수수료와 유지관리수수료 각각이 수수료 지급목적으로 보험료에 반영된 계약 체결비용과 표준해약공제액 (종신사망보험의 경우 1.4배 ※ ) 중 작은금액 이내에서 지급 ※ 종신사망보험의 경우, 계약체결비용 관련 공시규제에서 특례가 적용되어 계약체결비용을 표준해약공제액의 1.4배 이내에서 부과하는 경우 공시의무가 부과되지 않는 점을 고려 계약체결비용 공시 확대 (’27.2.1일 이후 체결되는 보험계약부터 적용) 현재는 만40세, 최장기납 등 기준연령 요건 에 대해서만 계약체결비용이 표준해약공제액을 초과하는 경우 공시의무 를 부과 하고 있으나, 규제 우회 방지를 위해 전체 연령 및 보험료 납입기간 등 전체 가입조건 에 대해 계약체결비용이 표준해약공제액을 초과하는 경우 보험회사가 공시 하도록 한다. 이를 통해 계약체결비용 관련 공시규제 의 실효성 을 높이고, 소비자의 상품 비교·선택에 필요한 정보 를 보다 충실 하게 제공 하도록 한다. 다만, 공시 확대 관련 행정지도의 경우 현재 판매중인 모든 상품을 대상으로 자체 점검 하고 시스템 에 반영 하는 등 준비시간 이 필요한 만큼 1개월의 추가적인 준비기간을 거쳐 ‘27.2.1일 이후 체결되는 보험계약부터 적용 한다. Ⅲ. 기대효과 이번 행정지도로 보험회사가 계약체결비용을 높여 판매수수료 지급 재원을 확대하는 유인을 완화하고, 보험설계사·GA 간 과도한 판매수수료 경쟁을 합리적인 수준으로 관리한다. 이를 통해 ➊ 보험회사는 판매수수료 중심 의 경쟁 에서 벗어나 보험료와 보장내용 등 상품 자체의 경쟁력을 중심으로 경쟁하고, ➋ 모집조직은 과도한 신규계약 유치 경쟁보다는, 계약유지·관리 등 장기적인 고객 관리 를 강조하는 방향으로 영업관행 을 개선 할 수 있을 것으로 기대된다. 아울러, ➌ 공시 를 강화 하고 과도한 사업비 지출 을 억제 하여 소비자의 보험료 부담 을 완화 하고 소비자의 합리적인 상품 선택 을 지원 한다. Ⅳ. 향후계획 금번 지도내용의 실효성 확보를 위해, 해당 사항에 대한 보험업감독규정 개정 도 조속히 추진한 다. 아울러 행정지도 시행 이후 판매수수료등 지급 기준의 기초서류 반영‧관리 의 적정성 과 판매수수료 등 사업비 집행현황 을 지속적 으로 점검 하면서, 변칙적인 수수료 지급 행위 등에 대해서는 엄정 하게 대응 할 계획이다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "포용금융 활성화를 위한  기획형 샌드박스 사업자 모집 개시", "department": "디지털금융총괄과,은행과,중소금융과", "date": "2026-11-26", "url": "https://www.fsc.go.kr/no010101/88235", "summary": "1 포용금융 기획형 샌드박스 추진 금융위원회 는 금융소비자의 금융 비용 부담완화, 금융 접근성 제고 등 포용금융 활성화 를 위해 기획형 샌드박스 실증 사업자를 모집 한다. 사업자 모집은 ’26.11.27.(금) 09:00~ 12.18.(금) 18:00까지 약 3주간 진행 된다. 기획형 샌드박스 는 금융소비자 편익 제고 등을 위해 정부가 규제 특례 가 필요한 분야를 선제적 으로 발굴 하고, 서비스를 개발 및 실증할 혁신금융사업자를 모집·선정 하여 서비스 출시 및 시장형성 을 지원하는 탑다운 방식 (Top-down)의 샌드박스 이다. 사업자의 신청을 바탕으로 규제 특례를 심사·지원하던 일반적 샌드박스와 달리, 정부가 직접 혁신의 방향 및 과제를 선정 한다는 점에서 차이가 있다. 기획형 샌드박스를 통해 정부는 정책적 육성이 필요한 분야의 혁신금융사업자 출현을 촉진 하고 사업자는 규제 심사 대응 부담을 완화 할 수 있을 것으로 기대된다. 금융위원회는 그간 내·외부 수요조사를 거쳐 은행 - 저축은행 포용 온렌딩 , 외국인 보증금 기반 신용카드 발급 서비스 , 우수 온투업자 제도 도입 등 포용금융 확대 를 위한 3가지 과제 를 선정 하였다. 선정된 과제에 대해 사업자 모집 공고, 혁신금융서비스 심사 등을 거쳐 내년 1분기 중 혁신금융서비스로 지정할 예정이다. 2 주요 과제 세부내용 ➊ 「 은행 - 저축은행 포용 온렌딩 」 은 중·저신용자의 금리 부담을 완화하고, 대출 공급을 확대 하기 위한 서비스이다. 은행이 저축은행에 자금을 공급하면, 저축은행은 동 자금을 활용하여 보다 넓은 구간 의 중·저신용자 에게 낮은 금리 로 대출을 제공 한다. 원활한 온렌딩 서비스 구현을 위해 은행 - 저축은행 간 신용공여 제한 관련 규제 등에 특례를 적용할 예정이다. ➋ 「 외국인 보증금 기반 신용카드 발급 서비스 」 는 금융이력 부족으로 신용 카드 발급에 어려움을 겪는 국내 거주 외국인의 금융 접근성을 제고 하기 위한 것이다. 신용카드사 등은 국내 거주 외국인으로부터 보증금을 송금 받으면 해당 보증금 을 담보 로 신용카드를 발급 한다. 현재 신용거래 이력이 부족한 고객 의 경우 예금을 담보 로 신용카드를 발급받을 수 있으나, 이 경우 예금 질권 설정, 별도의 영업점 방문 등 복잡한 절차가 요구 된다. 이에, 금융 이력이 부족한 국내 거주 외국인도 온라인으로 손쉽게 보증금 기반 신용카드를 발급 받을 수 있도록 규제 특례를 인정할 예정이다. ➌ 「 우수 온투업자 제도 」는 중·저신용 개인 및 개인사업자 에 대한 온투 업자 의 대출 공급 확대 를 지원하기 위한 서비스이다. 신용평가 역량, 자금 공급 실적, 건전성 등 일정 기준을 충족하는 우수 온투업자 를 선정하여 대출 을 확대 공급 할 수 있도록 자금조달 을 지원한다. 이를 위해 우수 온투 업자의 개인·개인사업자 신용대출에 대해서는 자기계산 연계투자 투자 한도 확대 , 금융회사 연계 투자 한도 완화 , 소액 분산 투자 허용 등 규제 특례를 적용할 예정이다. 제시된 3가지 과제 외에도 금융 비용 부담완화와 금융 접근성 제고 등 포용금융 에 기여하는 혁신적 서비스 출시 를 위해 규제 특례가 필요한 금융 회사는 사업자 모집 기간 내 혁신금융서비스 지정 신청 이 가능하다. 3 신청 방법 샌드박스 를 통해 포용금융 확대 에 기여 하기를 희망하는 기업 은 공고 * 에 명시된 신청방법 을 확인 하고, 제출 서류 를 갖추어 신청기간 ( ’26.11.27.(금) 09:00~ 12.18.(금) 18:00) 내 에 금융규제 샌드박스 홈페이지 에서 지정 신청서 를 제출 ** 하면 된다. * 금융위원회 공고 제2026-764호(‘26년 기획형 혁신금융서비스 지정 신청 공고) ** 금융규제 샌드박스 홈페이지 (sandbox.fintech.or.kr) > 제도신청 > 혁신금융서비스 > 신청 > (하단) “지정 신청하기” 금융위원회는 이번 포용금융 기획형 샌드박스 기간 중 접수된 신청서 에 대해 법정 심사기간 (최대 120일) 내에서 혁신금융심사위원회 의 심사를 진행할 예정이다. 이후 금융위원회 정례 회의 를 통해 지정 여부 를 최종 결정 한다. 신청 기업은 금융규제 샌드 박스 홈페이지 를 통해 신청 서비스의 심사 단계, 일자 등 을 확인 * 할 수 있다. * 홈 불전자지급수단 은 이제 하루 평균 1조 이상이 이용 될 만큼 국민의 일상적인 결제 수단으로 성장 했고, 특히 최근에는 연간 외국인 관광객 수가 처음으로 2천만명을 돌파한 가운데 외국인에게도 유용한 결제 수단 으로 활용되고 있다”고 언급하며, “그러나, 급격하게 변화한 디지털 지급결제 환경과 달리 선불전자지급수단에 대한 규율은 아직 2008년에 머물러 있다 ”고 밝혔다. * 선불 일평균 이용 금액: (’20년) 4,676억원 → (‘25년) 1조3,051억원(+179%) 이에 “기술·환경 변화에 맞도록 선불전자지급수단 이용 편의를 확대 하는 한편, 이용자 보호장치도 함께 강화 할 수 있도록 선불전자지급수단 제도 개선 방안을 마련 하였다”고 밝혔다. 아울러, 동 방안이 “ 국내 지급결제 시장의 발전을 촉진 시키고, 나아가 국내 소비 진작과 소상공인의 활력 제도에 기여 할 것으로 기대한다”고 언급했다. Ⅱ. 「선불전자지급수단 규율체계 개선방안」 주요 내용 금융위원회는 ① 선불전자지급수단 한도 체계 개선 , ② 외국인 관광객용 선불전자지급수단 제도 개선 , ③ 선불전자지급수단 이용자 보호 및 범죄 악용 방지 강화 를 위한 세부 과제를 마련하였다. 첫째, 선불전자지급수단의 한도 체계를 개선한다. 현행 한도 체계는 2008년 설정된 기준인 권면한도 200만원을 유지 하여, 그동안의 물가 상승 및 소비 행태 변화를 충분히 반영하지 못하고 있다. 이에 기명식 선불전자지급수단의 본인확인 방식 및 선불업자의 보안체계 등 보완 조치를 바탕으로 충전잔액 한도를 차등적으로 상향 한다. 선불업자가 예금계좌를 통해 본인확인을 진행한 경우 충전잔액 한도를 300만원 으로, 실명확인을 이행 한 경우에는 500만원 으로 상향한다. 또한, 기명식 선불전자지급수단에 대해 1일 이용한도 (결제, 간편송금 등 포함) 규제 도 신설한다. 예금계좌를 통해 본인확인을 진행한 경우 600만원, 실명확인을 이행 한 경우에는 1,000만원 으로 설정하여 이용 편의성과 운영의 안정성을 같이 제고한다. 둘째, 외국인 관광객의 금융 이용 편의를 제고하기 위한 외국인 관광객용 선불전자 지급수단 제도도 현실화 한다. 현재도 외국인 관광객용 선불전자지급수단 은 본인확인 시 100만원으로 한도를 상향 할 수 있다. 그러나, 휴대전화 인증 등 까다로운 본인확인 절차 로 인해 한도 상향에 제약이 있었다. 이에 선불업자의 외국인 관광객 본인확인 방식으로 ‘ 전자여권 확인, 여권정보 ·출입국정보 연계, 실시간 안면 인증 ’ 을 통한 방법을 새롭게 도입한다. 이와 함께, 선불업자가 외국인 여권 번호를 통해 ｢특정 금융정보법｣ 상 고객확인의무 도 이행할 수 있도록 제도 개선을 추진한다. 앞서 설명한 본인확인을 거쳐 발행된 외국인 관광객 대상 선불전자지급수단의 경우 충전 잔액 한도는 300만원(1일 이용 한도는 600만원)으로 확대 되며, 이 경우 준수해야 하는 자금세탁 방지 보완방안 * 도 함께 마련되었다. * ① 국내 가맹점에서만 사용(해외 사용 금지), ② 현금 인출 시 고객확인 재이행, ③ 이용자 간 이전·양도 금지, ④ 발행 90일 후 및 출국 후 사용 제한 아울러, 국내 장기체류 외국인 (외국인 등록증 또는 국내거소 신고증 보유)도 우리나라 국민과 동일하게 오프라인 오픈뱅킹 이용이 가능하도록 오픈뱅킹 운영 방식을 개선 하며, 외국인 특화점포 * 부터 우선 실시한다. * 외국인 근로자 등의 이용편의를 위해 주말 영업, 외국어 능통직원 상주와 같은 서비스를 제공하는 영업점 셋째, 선불전자지급수단 이용자를 보호하고, 부정사용을 방지하기 위한 체계도 강화한다. 일부 선불업자들은 ‘최소 충전단위’를 적용하고 있어, 소비자가 필요 이상으로 충전해야하는 불편 이 있다. 이를 개선하기 위해 업계가 자율적으로 최소 충전단위 합리화 를 위한 충전기준 운영원칙을 마련 하도록 권고한다. 또한, 부정사용 등을 방지 하기 위한 보호장치로 접근매체에 대한 양도 · 양수 등을 규제 하는 등 규율을 강화하는 한편, 사행행위 등에 있어서 선불 전자지급수단을 통한 결제를 제한 하고, 피해 발생 시 이용자가 쉽게 신고할 수 있도록 업계가 피해신고 전용 채널을 24시간 운영 하도록 지도한다. Ⅲ. 참석자 주요 발언 문화체육관광부 김진희 국제관광정책과장 은 “선불전자지급수단 충전잔액 한도 상향이 외국인 관광객의 결제, 특히 쇼핑·미용·의료 등 고부가가치의 영역 에서 만족도 및 소비를 증진시키며 방한 관광의 양적·실적 도약에 기여할 것으로 기대 한다”고 밝혔으며, 관광업계 (한국의료관광진흥협회, 한국면세점협회) 역시 “선불전자지급수단 한도 상향이 결제의 편의성을 높이고 관광·서비스 산업의 경쟁력 강화에 기여 할 것”이라고 언급했다. 선불업계 는 “선불전자지급수단의 한도를 물가와 현실에 맞게 조정한 이번 개선방안이 업계의 경쟁력 강화에 도움 이 될 것”으로 기대하며, 아울러 “ 거래 특성에 맞는 합리적 한도 운영과 이상거래 탐지 및 부정 사용 방지, 자금세탁방지 등 안전장치를 강화 해 나가겠다”고 밝혔다 . 금융결제원 채병득 원장 은 “본인확인에 필요한 정보를 연계 하여, 편리하고 안전한 선불전자지급수단 본인 확인 체계 가 갖춰질 수 있도록 적극 지원하겠다”고 말했으며, 이세훈 금융감독원 수석부원장 은 “선불 이용자 자금 보호를 위한 보안 강화 , 이용자의 권익 제고 및 불법·부당 사용 방지 를 위해 노력하겠다”고 밝혔다. Ⅳ. 향후 계획 금융위원회는 ’27년 상반기 중 관련 법령 개정안을 마련 할 계획이다. 한편, 법령 개정 전이라도 관계부처 협의를 거쳐 혁신금융서비스(샌드박스)를 통한 선불전자지급수단 한도 상향을 우선 추진 할 예정이다. ※ [별첨1] 금융위원회 위원장 모두말씀 [별첨2] 「선불전자지급수단 규율체계 개선방안」", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "26년 부적격 유사투자자문업자 직권말소 처리", "department": "자산운용감독국", "date": "2026-11-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250033&menuNo=200218&pageIndex=1", "summary": "□ 금융감독원은 1,863개 유사투자자문업자에 대한 전수 점검을 실시하여 106개 부적격 유사투자자문업체를 직권말소 처리하였습니다.\nㅇ ’19.7월 직권말소 제도 도입 이후 매년 정기 점검을 실시하고 있으며,\nㅇ 점검 결과 금융관련법령 및 소비자보호 관련 법령 위반, 불건전 영업행위 등으로 인한 과태료 처분, 폐업 등의 사유로 직권말소된 업체는 향후 5년간 유사투자자문업 영위가 불가합니다.\n□ 금융감독원은 주기적으로 폐업 및 법령 위반 이력 등을 점검하여 부적격 유사투자자문업자를 신속히 퇴출하고,\nㅇ 유사투자자문업자 이용시 투자자 유의사항을 안내하여 금융소비자 보호와 건전한 금융시장 환경을 조성해 나가겠습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSS", "title": "다음 미션만 성공하면 수익금이 2배 나만 아는 '꿀알바'가 아닌 '팀미션사기' 입니다.", "department": "자금세탁방지실/금융사기대응단", "date": "2026-11-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=250035&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융정보분석원(FIU)은 하주식 제도운영기획관 주재로 ’26.11.26일(목) 「신종피싱 의심계좌 거래정지제도 점검회의」를 개최했다. 이번 회의에서는 경찰청, 금융감독원, 全 금융권 협회 관계자가 참석한 가운데 지난 6.30일부터 시행하고 있는 ‘신종피싱 의심계좌 거래정지 제도’의 운영현황 및 성과, 부업을 가장한 사기수법으로 피해를 일으키고 있는 입금된 계좌의 거래 를 신속하게 정지할 수 있도록 하였다. 이로써 통신사기피해환급법 상 지급정지 대상에서 제외 되었던 재화와 용역의 거래를 가장한 새로운 유형의 피싱범죄 (노쇼사기, 로맨스스캠, 팀미션사기) 에 대해서도 적극적으로 거래정지 가 가능해졌다. 6.30일 제도 첫 시행 이후 11.20일 까지 신종피싱 으로 신고되어 금융회사 가 임시조치 한 건수 는 총 18,670건으로 집계 되었다. 이 중 경찰 통합대응단의 확인을 통해 신종피싱 의심계좌 로 확인된 건은 총 15,729건 으로, 로맨스 스캠이 약 46% (7,218건) , 노쇼사기 (대리구매 사기) 가 약 23% (3,622 건) , 팀미션사기가 약 31% (4,889건) 를 차지 한 것으로 나타났다. 2. 시행 성과 제도 시행 이후 노쇼사기, 로맨스스캠, 팀미션사기 의 발생건수 및 피해액은 뚜렷한 감소세 를 보이고 있다. 거래정지 제도가 시행된 이후 3개월 간 의 피해액 은 시행 전 3개월 대비 49.9% (‘26.2분기 1,084억 원 → ‘26.3분기 543억 원) 감소 하 였으며 , 발생건수 역시 42% (‘26.2분기 3,468건 → ‘26.3분기 2,011건) 감소 하였다 . ※ 노쇼사기, 로맨스스캠, 팀미션사기 월별 피해액 및 발생건수 이는 선제적인 거래정지 조치 로 인해 범죄수익의 인출이 어려워짐에 따른 효과로 분석되며, 그 밖에 보이스피싱 대응 범정부 TF 를 통해 시행되고 있는 피싱범죄 이용 전화번호 차단 대책 등 부처 간 협력이 시너지 효과 를 발휘한 것으로 판단된다. 한편, ’신종피싱 의심계좌 거래정지 제도‘ 는 신종피싱 관련 별도의 지급정지 법적 근거를 마련하기 전, 가이드라인 을 통해 선제적으로 거래정지 조치 를 적용하는 제도로서, 별도의 법적 피해환급 절차는 적용되지 않고 있다. 그러나, 제도 시행 이후 적극적인 거래정지 조치 를 통해 범죄 피해자금이 신속하게 동결되어 사법적 피해자금 보전 절차 (민사상 (가)압류 결정) 까지 이어지는 사례 가 증가하고 있다. ※ 금융회사별 주요 피해자금 보전 사례 (A 은행) 10억원 이상의 피해자금 이 거래정지 조치 이후 법원의 (가)압류 명령을 통해 사법적으로 보전됨 (B 은행) ▲▲국립과학관 행정사무실장을 사칭 해 의료기기를 대리구매 해달라는 수 법을 활용한 노쇼사기 피해신고 를 접수하여 5,000만원 이상의 잔액을 보유한 범죄 의심 계좌를 신속하게 거래정지 조치. 이후 피해자는 거래정지 기간 중 (가)압류를 신청하여 피해자금을 보전 ( C은행) 피해신고를 접수한 뒤 잔액 1억원 이상의 계좌 를 신속하게 거래정지 조 치. 이후 약 20일 뒤 동일 금액에 대해 법원의 (가)압류 명령을 접수 하여 고액의 피해자금이 사법적으로 동결됨 주요 범죄 양상 - 팀미션사기(온라인 부업사기) FIU 의 거래정지 현황 분석 결과 최근에는 부업을 가장하여 피해자에게 접근하는 팀미션사기의 수법이 다양하게 진화 하고 있으며 가정주부, 대학생, 취업준비생 등 불특정 일반 국민 을 범죄대상으로 삼고 있는 것으로 분석됐다. 팀미션사기의 주요 사기수법 은 다음과 같다. 먼저 ❶ SNS, 문자 등을 통해 짧은 시간 내 고수익을 낼 수 있는 부업을 광고 하여 피해자를 유인하고, ❷ 미션 수행을 위한 단체 채팅방 에 초대한 후 바람잡이들의 수익 인증을 통해 신뢰를 형성 한다. 이후 미션 참여 분위기가 고조 되면 피해자에게 미션 수행시 필요한 사전 적립금, 참가비 등을 입금하게 한다. 다만, 최근에는 단체채팅방에 초대하지 않고 개별 미션을 1:1로 부여하는 형태의 사기도 다수 발생 하고 있다. 따라서 단체 수행 여부를 불문 하고 미션·부업 등을 수행하기 위한 선입금을 요구 하는 경우에는 각별히 주의 하여야 한다. ※ 팀미션 사기 피해자 대화내역 재구성(①~⑧) ❸ 초기에는 소액의 수익금이 걸려 있는 미션 을 제공하고, 실제로 수익금 을 지 급 하여 피해자의 신뢰를 확보 하기도 한다. ❹ 그러나, 이후 미션수행 회차 및 단계가 상승할수록 미션 수익금도 계단식으로 상승 시키면서 더 큰 금액을 입금하도록 유도 하는 것이 특징이다. 또한, 피해자가 입금한 금액은 모든 미션이 끝난 이후 한번에 정산 해준다는 규칙을 내세우며 피해자의 중도 포기를 어렵게 하고, 피해규모를 확대 시킨다. ❺ 피해자에게 고의적으로 복잡한 미션 을 제공하여 실수를 유도 하거나, 시스템 오류 등을 핑계 로 내세우며 미션 복구를 위한 추가 입금을 강요 하기도 한다 . ❻ 피해자가 입금을 망설이는 경우 팀원 모두의 정산이 불가능해진다며 죄책감을 조성하여 심리적 압박 을 가하는 것이 특징이다. ❼ 이후에도 지속적으로 미션 참여 금액 을 상승시키면서 추가 입금을 유 도하고, ❽ 피해자가 최종 피해금을 입금 하게되면 단체채팅방에서 강제퇴장 시킨다. 피해자는 원금과 수익금을 모두 지급받지 못한 상태 로 미션 제공자와 연락이 끊기게 된다. 팀미션사기 를 당한 것으로 의심되는 경우 수익금 등을 돌려받기 위한 추 가적 입금을 멈추고 , 이체 한 금융회사 및 경찰 에 즉시 신고 하여 해당 계좌의 거래를 신속하게 정지 해야 한다. 보완사항 및 향후계획 금융정보분석원(FIU) 과 경찰 통합대응단 은 거래정지 업무와 관련하여 금융권 실무에서 발생하는 애로사항을 청취 하고, 신종피싱 피해자 보호 를 위한 적극적 협조를 요청 하였다. 또한 FIU는 금융회사의 원활한 업무 처리를 위한 업무 가이드라인 개정 계획을 공유 하였으며, 12월 중 개정된 가이드라인을 배포할 예정이다. 또한, FIU는 거래정지의 법적 근거를 강화 하고, 거래정지 대상 범죄를 신종피싱뿐 아니라 마약, 도박 등 중대 민생침해범죄로 확대 하기 위한 특정금융정보법 개정 을 추진 중이다. FIU는 법안의 신속한 통과 를 위해 입법 논 의를 적극 지원 할 예정이 다. (특정금융정보법 개정안[박민규, 김상훈 의원] ’26.11.19. 정무위 상정)", "essential": false, "importanceReasons": ["strong keyword in body text (+1)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "유캐스트 코스닥시장 신규상장", "department": "", "date": "2026-11-26", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261116053", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "[보도참고] 2026년 종합부동산세 고지", "department": "총괄기획팀", "date": "2026.11.26.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000080076&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "26.12월 국고채, 재정증권, 원화표시 외평채 발행 계획", "department": "국채정책과", "date": "2026.11.26.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000080077&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "이억원 금융위원장, 메리츠지주 김용범 부회장과 만나 민간 자본시장 개혁기구 구성 및 운영방안 논의", "department": "자본시장과", "date": "2026-11-26", "url": "https://www.fsc.go.kr/no010101/88245", "summary": "11월 26일(목) 이억원 금융위원장 은 정부서울청사 접견실에서 메리츠금융 지주 김용범 부회장 과 만나 자본시장 개혁기구 구성 및 운영방안 을 논의하였다. 이번 면담은 지난 11월 13일 이재명 대통령 주재 ｢자본시장 정책 간담회｣ 에서 대통령 이 자본시장 개혁기구 구성을 지시 한 데 따른 후속조치로, 앞으로 위원장 으로서 동 기구를 이끌 김용범 부회장 과 함께 향후 기구 운영 전반의 밑그림 을 논의하기 위해 마련되었다. 국민주권정부는 출범 이후 그 어느 때보다 자본시장에 높은 관심 을 갖고 신뢰, 주주보호, 혁신, 시장 접근성 제고 의 4대 축을 중심으로 시장 체질개선 을 일관되게 추진 중 이다. 다만, 최근 AI‧반도체 산업 관련 우려와 글로벌 금리 인상 가능성 등 대외 불확실성 으로 AI‧반도체 주력국 증시의 변동성이 커졌으며 , ‘ 위기에 강한 자본시장 ’을 만들기 위한 근본적인 체질 개선 노력 이 더욱 긴요해졌다. 이에 지난 11.13일 한국거래소에서 개최된 ｢ 자본시장 정책 간담회｣ 에서 이재명 대통령 은 ‘ 자본시장 정상화 ’가 흔들림 없는 정부의 정책방향 임을 강조하면서, 자본시장 개혁을 강력히 추진 할 고위급 전담기구 를 구성하여 실태조사부터 과제 발굴, 제도화 까지 책임 있게 추진하고 직접 보고할 것을 주문하였다. 향후 발족될 자본시장 개혁기구인 ｢자본시장 대전환 위원회｣ 는 실태조사 및 의견수렴을 통한 이슈 발굴, 정책제언, 추진현황 점검 등 역할을 수행한다. 자유로운 논의와 민간의 창의를 최대한 보장하기 위해 위원회는 민간위원으로만 운영 하고, 김용범 메리츠금융지주 부회장 이 위원장 으로서 위원들을 직접 구성 하며, 논의결과는 위원장이 책임성을 갖고 대통령에 직접 보고 하도록 한다. 이억원 금융위원장은 김용범 부회장에 대해 “정부가 제도로 풀고자 하는 주주가치 제고, IR 활성화 등을 현장에서 먼저 실천 해 온 분”이라며, “ 기업과 시장의 언어 로 개혁 의제를 설정하고 정부와 시장을 잇는 가교 역할 을 해줄 것을 기대한다”고 내정 배경을 밝혔다. 또한, 주주중심 경영 확산과 기업 가치 제고 , 코스닥 시장 재설계 , 증시의 장기‧기관 중심 수요기반 확충 , 시장 변동성 완화 등 자본시장 발전을 위한 다양한 주제에 대해 무엇이든 제한없이 자유롭게 논의하고 제안 해줄 것을 요청하면서, “정부는 위원회 제안을 관계부처 협의‧검토를 거쳐 조속히 정책화 하고, 입법 이 필요한 과제는 국회 의 입법기능과 긴밀히 연계 하여 제도화해 나가겠다”고 밝혔다. 김용범 부회장은 “현재 정부가 추진하고 있는 자본시장 개혁 과제 들의 속도감 있는 추진 이 필요하다 ”고 언급하면서, 특히 “‘ 시장 ’과 ‘ 주주 ’ 친화적 으로 정책이 추진 될 수 있도록 노력하겠다”고 화답하였다. 그 외의 과제들에 대해서도 “ 현장 경험이 풍부한 민간분야 최고 전문가 들과 활발히 논의하여 당국과 함께 시장이 체감할 수 있는 개혁 방안 을 만들어 나가겠다”라고 밝혔다. 구체적인 민간위원 구성 및 위원회 운영방안 은 위원장 중심으로 조속히 논의하고, 빠른 시일 내 (가칭) ｢자본시장 대전환 위원회｣의 발족 을 위한 정식 킥오프 회의 를 개최할 예정이다. ※ 별첨 : 김용범 (가칭)자본시장대전환위원회 위원장 입장문", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}], "2026-11-27": [{"source": "FSS", "title": "2026년 1~3분기 국내은행 영업실적(잠정)", "department": "은행리스크감독국", "date": "2026-11-27", "url": "https://www.fss.or.kr/fss/b se, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "금융회사 검사‧제재‧인허가 전반의  공공성과 투명성을 제고합니다. - 「금융행정 쇄신방안」 마련", "department": "금융정책과,규제개혁법무담당관", "date": "2026-11-27", "url": "https://www.fsc.go.kr/no010101/88250", "summary": "1. 회의 개요 금융위원회 (위원장 이억원) 와 금융감독원 (원장 이찬진) 은 ‘26.11.27(금) 9시 , 정부서울청사 금융위원회 대회의실 에서 양기관 의 기관장 과 주요 간부 들이 참석한 가운데 「 금융행정 쇄신방안 」을 발표하였다. \u003c 회의 개요 > ▪ 일시/장소 : ’26.11.27.(금) 09:00 / 정부서울청사 금융위원회 대회의실 ▪ 참석자 : [금융위] 금융위원장, 상임위원(2인), 증선위원(1인), 금융정책국장 등 [금감원] 금융감독원장, 부원장(4인), 소비자보호총괄 부원장보 등 ▪ 논의안건 : 금융행정 쇄신방안 2. 추진경과 그간 금융위원회 와 금융감독원 은 금융회사 검사, 제재, 인‧허가 전반 의 쇄신을 위해 다각적인 노력 을 지속 추진 하였으나, 사후적발식 검사 행태 가 지속되고, 사회적 이슈 사안 에 대한 중간 검사결과 발표 논란 이 발생하는 등 국민 눈높이에 부합 하지 못한다는 지적 이 지속되어 왔다. ‘25년 9월 정부조직 개편방안 마련 시 금융감독원 에 대한 민주적 통제 강화 를 위해 금융감독원 을 「 공공기관의 운영에 관한 법률 」에 따른 공공기관 으로 지정 하는 방안을 검토하였으나, 공공기관운영위원회 는 올해 1월 공공기관 지정이라는 형식 보다는 실질 적인 면에서 금융감독원 운영 과 업무 전반 의 공공성‧투명성 을 제고 하는 조건을 전제로 지정 을 유보 하였다. 공공기관운영위원회 는 금융감독 업무 혁신 을 위해 ➊ 기존 제재 위주에서 사전‧컨설팅 검사 방식으로 전환, ➋ 검사결과 통지 절차 마련, ➌ 기타 검사‧제재 절차‧면책 등 금융감독 쇄신방안 을 마련토록 하였다. ▪ (‘25.9.7. 정부조직 개편방안) 금감원‧금소원 공공기관 지정 방안 발표 ▪ (‘25.9.25. 정부조직 개편 수정 고위당정대) 별도 법률 개정 없이 금융감독체계상 소비자보호 기능의 공공성·투명성 제고방안 우선 추진 논의 ▪ (‘26.1.29. 공운위) 기타공공기관 이상 경영관리 강화 , 금융감독 전반 쇄신 , 금융소비자 보호 조건 전제 지정유보 이에 금융위원회 와 금융감독원 은 쇄신 방안 마련 을 위해 외부 전문가 로 구성된 TF 를 운영(3~11월)하여 다양한 의견 을 논의 하였으며, 수검기관 간담회 와 온라인 익명 사서함 * (3~11월) 운영 등을 통해 금융업권 과 국민의 의견 도 청취하였다. * 금융위원회, 금융감독원, 각 금융협회 홈페이지를 통해 75건의 건의사항 제안 금융위원회 와 금융감독원 은 금융행정 과 감독 전반 의 구조적인 쇄신 이 이뤄지지 않는 경우 금융회사 의 보수적인 업무 관행 을 바꾸기에는 한계가 있다는 데 인식을 같이하고, 금융행정의 공공성‧투명성 제고 를 통한 신뢰 확보 를 위해 검사‧제재‧인허가 등 전반 의 쇄신 방향 을 마련하였다. 3. 금융행정 쇄신방안 첫째, 사후 적발식 검사‧제재에서 사전예방적 검사‧제재로 전환한다. ➊ 정기검사 는 본래 도입 취지 대로 “ 사전예방적 기능 ”을 규정화 한다. ‘22년 종합검사 를 폐지하고 “ 정기-수시검사 체계 ”로 개편하였음에도, 정기 검사가 저인망식 , 불규칙적으로 운영 된다는 지적이 있어 왔다. 앞으로는 정기검사 란 “ 경영실태평가 ”와 “ 핵심‧취약부문 검사 ”임을 명시 하고, 업무 전반에 대한 정기검사는 원칙적으로 금지 된다. \u003c 검사체계 개편 주요 내용 > 현행 규정 개선 정기 금융기관 규모, 시장영향력 등 감안 일정 주기 로 정기적 실시 ( 1개월전 통지) 정기 “ 경영실태평가 + 핵심‧취약부문 검사 ” 를 금융기관 규모, 시장영향력 등 감안, 일정 주기 로 정기적 실시 ( 1개월전 통지) 수시 금융사고예방, 금융질서 확립 등 감독상 필요로 수시 실시 ( 1주일전 통지 ) 수시 금융사고예방, 금융질서 확립 등 감독상 필요로 수시 실시 ( 7영업일전 통지 ) 현안 등 사유 로 통지생략 가능 (소위 긴급검사 ) 금융사고 , 재무건전성 악화 등 사유 로 통지생략 가능 또한 준법검사가 주로 이뤄지는 “ 핵심‧취약부문 검사 ”의 범위는 사전에 구체적으로 통지 하고, 검사 중 추가 위규 의심 사항 을 발견하여 검사 범위 확대 가 필요한 경우 에도 전결권 상향 , 사유 관리 등 절차를 강화한다. * (핵심) 건전성 관리 등을 위해 검사시 항상 확인해야 하는 부문 사전지정 (취약) 업권별, 회사별, 시기별 취약요인을 상시감시 결과에 따라 선정 이와 함께 검사주기가 비교적 정형화 되어 있는 대형 금융회사 는 연초 검사계획 마련 시 업권별 주기를 통지 하고 검사 시기가 변경되는 경우에는 이후 검사계획 수립‧통지 시 안내하여 수검기관의 예측가능성 을 제고한다. 경영진‧이사회 등과 면담시에는 필수적 으로 경영‧영업상 특징 , 우수‧미흡사례 공유 , 내부통제 점검 결과 등 컨설팅 항목 을 설명 하여야 하며, 새로 도입되는 주요 제도 나 신규로 진입한 금융회사 에 대해서는 초기 단계 에서 사전컨설팅 을 우선 실시하고 신규회사의 경미한 위법행위 는 시정조치 를 우선 부과한다. ➋ “ 처벌 위주 의 제재 ”에서 벗어나 “ 자율 시정 기능 ”을 확대 한다. 금융회사 가 자체 시정 한 경미한 위반행위 등은 검사현장 에서 시정‧개선‧주의조치 할 수 있도록 검사제재규정 에 요건 을 명시 하고, 준법교육 이수 시 신분제재 면제 범위 도 확대 (주의→주의적 경고)하며, 자율적 시정 노력 을 충분히 기울였다고 판단하는 경우 과태료 감경 상한 을 높이는 (예: 50→75~100%) 등 제재 감경‧면제 를 확대 한다. 이 외에도 생산적, 포용금융 관련 여신업무 면책 을 적극 추진 하고, 시정‧중지명령 , 조치사실 공표 등 시정조치 활성화를 위한 구체적 기준 을 마련하는 등 자율시정 기능 을 확대 한다. ➌ 사전예방적 검사‧제재 전환 을 위한 제반여건 도 정비 한다. 검사 분야 에서는 검사원의 성과평가(KPI) 에 업무처리의 적정성 을 반영 하고, 합리적 절차 와 판단기준 에 따라 예방‧개선 중심 으로 검사 를 수행 한 경우에는 면책 받을 수 있도록 제도적 근거 를 마련한다. 제재 분야 는 컨설팅 유형 조치 비중 을 지속 관리 하고, 제재 대체적 조치 미이행 또는 동일 사안 위반 시 제재 가중사유 로 명시 할 예정이다. 둘째, 검사‧제재 과정에 대한 민주적 통제를 강화한다. ➊ 중간검사 결과 공개 금지 등 검사 업무 의 책임성 제고방안 을 마련 한다. 먼저, 중간검사 결과 의 공개는 원칙적 으로 금지 된다. 별도 공보준칙 을 마련해 소비자 보호, 오보 정정 등 예외사유 를 엄격히 한정 하며, 소비자 피해 등이 우려되는 경우에도 소비자 경보 , 금융 회사 앞 유의사항 전파 등 대체적 조치를 우선 추진 하도록 한다. 예외적 공개 시 신원정보 나 제재 에 영향을 미칠 수 있는 내용 등은 공개가 제한 되며, 공개 가 필요한 경우에는 금융감독원 내부 , 금융위원회 사전 협의 등 강화된 절차 를 거쳐야 한다. 실명법상 영장 없이 가능한 금융거래정보 열람 에 대한 내부통제 도 강화 한다. 전결권자를 상향 조정 (부서장→부원장보)하고 열람 사유 를 소명 토록 하며, 통상적인 수준을 초과한 금융거래정보 열람시 전결권자 알림 발송 등 사후관리 도 강화 할 계획이다. 금융감독원 내 외부위원 이 과반 이상 으로 구성된 “ 검사권익보호심의회 ”를 신설 한다. 금융회사 이의제기 , 시정요청 등 수검대상 권익보호 를 위한 사항을 심의 하거나 보고 받는다. 검사결과 보고 도 내실화 한다. 대형 금융회사 정기검사 등 건전성 관리 관점 에서 유관기관 공유 가 필요한 사항에 대한 금융위원회 보고를 강화하고, 시스템 리스크 등 우려 시 검사종료 후 지체 없이 금융위원회 에 보고토록 사유‧절차 등을 구체화한다. ➋ 금융위원회 와 금융감독원 의 제재 심의 기능 을 내실화 한다. 양 기관 의 안건 양식을 통일 하고, 제재안건정보시스템을 신설 하여 관련 자료를 신속 공유하는 등 업무 공조 를 시스템화 하여 제재 일관성‧신속성 을 제고 할 예정이다. 또한, 동일 사건 에 대해 금융위원회 와 금융감독원장 조치 가 나눠져 있는 경우에는 금융위원회 의결 후 금융감독원장 조치 를 통보 하며, 금융위원회 의결 과정 에서 조치양정 등이 변경되는 경우 그 취지에 따라 금융감독원장 조치를 재검토 하고, 변동사항은 금융위원회 에 송부하도록 규정화 한다. 대규모 과징금 부과 및 첫 법령적용 등 중요 제재 사안 에 대해서는 금융 감독원의 제재심 사전통지 전 금융위원회에 법령 적용 여부 등에 대해 질의 ‧답변 받는 등 사전협의 절차 를 강화한다. 이와 함께 금융감독원 제재심 민간위원을 다양화 하고, 금융위원회 소위 에서 전문가 의견 을 청취 하는 등 전문적‧객관적 검토 기능 을 강화한다. ➌ 제재 양정기준 등의 공정성 과 합리성 을 제고 한다. 과태료 위임전결 기준 정비 , 과징금 부과기준‧절차 정비 등 양정 기준 전반 에 대한 개정 필요 사항 발굴 을 추진한다. 또한, 신규 사업 진출 및 직업선택의 자유 를 과도하게 제한 하는 제재 효과 는 유사 사례 비교 등을 통해 합리적으로 조정 할 예정 이며, 행정소송에서 패소 판결 시 동일한 법률 쟁점이 있는 사건 에 대한 직권재심‧취소 대상 , 절차 도 구체화 한다. * (공무원법) 임용·승진 제한: 파면 5년, 해임 3년, 강등‧정직 1.5년, 감봉 1년, 견책 6개월 (금융사지배구조법) 임원 결격: 해임권고·면직 5년, 직무정지·정직 4년, 문책경고·감봉 3년 셋째, 수검부담을 완화하고, 업무 전반의 공정성‧투명성을 제고한다. ➊ 검사 과정 에서 수검대상의 권익 보장을 강화 한다. 단순한 현안 점검 등을 위해 검사 사전통지를 생략 하지 않도록 금융사고, 재무건전성 악화 우려 등 생략사유 를 구체화 하고, 수시검사 의 사전통지 기간을 7일에서 7영업일로 확대 한다. 또한, 검사 기간 의 무분별한 연장 를 막기 위해 전결권자 상향 (부원장보) 등 절차 를 엄격히 하고, 디지털 자료 징구 시 개인정보 보호 강화 , 법률 자문 자료에 대한 변호사 비닉권 보장 등을 통해 자료요구 부담 을 완화 한다. 검사 대상기간 은 원칙적으로 5년 으로 규정 하여 장기간 경과 한 행위는 검사‧제재대상이 되지 않도록 한다. ➋ 제재 업무 의 투명성과 예측가능성 을 제고한다. 금융회사의 제재심 안건 열람 방식 을 현장방문‧필사 에서 사본 교부 방식 으로 변경 한다. 제재심 사전통지 시에는 최종 처분과 다를수 있음 을 고지토록 규정 하고, 달라진 심의결과는 신속히 안내 할 예정이다. 금융위원회 의 공식적인 사전 통지 는 금융감독원의 제재건의 예정서 접수 후 수행 한다. 제재 결과 공시 는 회사별 제재내용, 결과 등이 검색가능하도록 시스템 을 개선한다. ➌ 인허가 업무 에 대해서도 효율성 과 신속성 을 제고한다. 인허가 심사중단제 는 무기한 방치 를 막기 위해 “ 중단 ”에서 “ 재개 ” 원칙 으로 변경 한다. 또한 예측가능성 제고를 위해 「 금융권 인허가‧승인 심사중단제도 운영 실무 지침 」을 인터넷 홈페이지 등에 공개 할 예정이다. 신청인 측의 사유로 자료보완 등이 장기간 지연 되는 경우에는 심사를 종결 할 수 있도록 하여, 인허가 적체를 해소 하며, 스몰라이센스 사례별 정비 필요 규제 를 살펴보고, 진입‧영업 규제 등을 합리화 할 예정이다. ➍ 마지막으로 검사, 제재, 인허가 업무를 전면 디지털화 하여 검사원 업무배분, 기관간 자료공유, 진행상황 통지 등을 시스템을 통해 처리할 예정이다. 4. 금융위원장‧금융감독원장 주요발언 및 향후계획 이억원 금융위원장 은 오늘 자리는 국민에게 보다 신뢰받는 금융행정 으로 나아가기 위한 변화를 논의하는 자리라면서, 그동안 여러 제도개선 에도 금융 행정의 공공성‧투명성 을 높여야 한다는 요구가 지속 되어 왔다고 언급하였다. 특히, 금융위원회와 금융감독원 은 금융시장 안정 과 금융소비자 보호 라는 책무 수행을 위해 국민 으로부터 검사․제재․인허가 등 광범위한 공적 권한을 위임 받은 만큼, 그 행사에 있어서도 높은 수준 의 공공성과 투명성 이 요구된다고 강조하였다. 또한, 금융회사에 생산적‧포용적 금융 에의 동참과 책임있는 경영 을 강조하기 위해서는 금융행정 스스로도 변화와 혁신 의 노력을 기울여야 한다고 밝혔다. 다만, 이번 쇄신 방안 이 금융 감독의 엄정함을 약화 시키는 것은 아니라면서 , 앞으로도 중대한 위법행위는 엄정히 대응 할 것이며, 오히려 공정하고 합리적인 권한 행사 가 국민의 신뢰 를 높이는 토대가 될 것이라고 하였다. 이억원 금융위원장 은 중요한 것은 제도개선이 현장에서 체감 되는 변화로 이어지는 것인 만큼, 금융당국의 일하는 방식과 조직 문화 까지 변하도록 양 기관이 함께 노력 해 나갈 것을 당부하였다. 이찬진 금융감독원장 은 금융행정이 국민의 눈높이 에 일부 미흡한 점이 있었다는 점을 언급하면서 이번 쇄신안을 통해 금융행정 전반 의 제도 와 관행 을 개선 하고, 금융감독의 공공성‧투명성‧신뢰성 을 한층 높여 나가겠다고 강조하였다. 다만, 금융회사 의 건전성 제고 와 금융소비자보호 라는 금융감독원 본연 의 소명 을 견지 하는 기조 하에 금융소비자 에게 중대한 피해 를 입히거나 시장 질서 를 훼손 하는 위법행위 에는 선택과 집중을 통해 신속하고 엄정하게 대응 해 나가겠다고 밝혔다. 또한, 금융감독원은 쇄신안 을 충실히 이행 하기 위해 금융위원회와 긴밀히 협의 하고, 관련 법규 개정 등 후속 조치 를 신속하게 추진 할 것이며, 개선 사항 이 일선 검사‧제재‧인허가 업무 에 제대로 반영 되도록 지속 노력 하겠다고 밝혔다. 검사제재규정 개정 등 후속절차 는 ‘27년 1분기부터 순차적 으로 진행 하고, 제재‧인허가 TF 운영 을 통해 추가적인 개선방안 을 마련할 계획이다. \u003c 향후 일정 > 1. 사후적발식 검사‧제재에서 사전예방적 검사‧제재 로 전환합니다. 정기검사 규정개정 검사‧제재규정 개정 ~‘27년 2분기 제재 자율시정 강화 검사‧제재규정 개정 ~‘27년 2분기 KPI 개선 검사역 KPI 기준 마련 ~‘27년 1분기 검사원 면책 감사원 협의 및 설치법 개정안 마련 ~‘27년 2분기 컨설팅 유형 비중관리 금감원 내부 제재유형별 관리 즉시 시행 기타 법적 근거 마련 금융위설치법 개정안 마련 ~‘27년 2분기 2. 검사‧제재 과정에 대한 민주적 통제 를 강화합니다. 중간검사결과 공개금지 공보 준칙 마련 ~‘27년 2분기 금융거래정보 열람제한 내부 전결 및 사후관리 절차마련 ~‘27년 2분기 검사권익보호심의회 신설 검사‧제재규정 개정 ~‘27년 2분기 검사결과 보고 검사‧제재규정 개정 ~‘27년 2분기 제재심 개선 세칙 개정 ~‘27년 2분기 금융위-금감원 공조강화 검사‧제재규정 개정 등 ~‘27년 2분기 안건소위 전문성 강화 전문가 의견청취 방안 마련 ~‘27년 2분기 제재 양정기준 정비 제재 TF 운영‧방안마련 ~‘27년 하반기 제재 효과 조정 제재 TF 운영‧방안마련 ~‘27년 하반기 수사기관 고발‧통보 검사‧제재규정 개정 ~‘27년 2분기 직권재심 절차개선 검사‧제재규정 개정 ~‘27년 2분기 3. 금융회사의 수검부담 을 완화하고 공정성‧투명성 을 제고합니다. 사전통지 개선 검사‧제재규정 개정 ~‘27년 2분기 검사‧처리기간 개선 검사‧제재규정 개정 ~‘27년 2분기 자료요구 관련 검사‧제재규정 개정 ~‘27년 2분기 기피권‧반론권 보장 검사‧제재규정 개정 ~‘27년 2분기 제재심 안건 열람 검사‧제재규정 개정 ~‘27년 2분기 제재심 통지 관련 검사‧제재규정 개정 ~‘27년 2분기 제재 공시개선 홈페이지 개선 ~‘27년 4분기 인허가심사중단제 개선 인허가 TF 운영‧방안마련 ~‘27년 3분기 심사종결제 도입 인허가매뉴얼 개정 ~‘27년 1분기 스몰라이센스 규제개선 인허가 TF 운영‧방안마련 ~‘27년 3분기 업무 디지털화 시스템 구축 ~‘27년 3분기 ※ [별첨] 금융행정 쇄신방안", "essential": false, "importanceReasons": [], "market": false, "tie 18년 10월 지역 에서 예금 · 적금 등을 수취 하는 금융회사가 지역경제 성장을 지원하도록 유도 하기 위해 ‘지역재투자 평가제도’를 도입하여 2020년부터 평가 를 실시해 왔다. 지역재투자 평가제도는 금융회사의 지역 내 자금공급 , 중소기업 지원 , 서민대출 지원 , 금융인프라 현황 과 해당 지역 경제기여도 등 지역금융 지원 전략 등 을 평가하고, 평가결과를 5등급 (최우수·우수·양호·다소미흡·미흡)으로 구분해 인센티브 를 부여하는 방식으로 운영되고 있다. [금번 평가 결과] 올해 11월 27일 금융위원회는 지역재투자 평가위원회 (위원장 원숙연 이화여대 교수)를 개최하여 각 금융회사의 2025년도 실적·자료를 바탕으로 한 2026년도 지역재투자 평가 결과 를 확정·발표하였다. 시중은행 중에서는 ‘ 하나·아이엠·기업·농협은행’ 이, 지방은행 중에서는 ‘ 부산 · 광주·경남은행 ’이 최우수 등급 을 획득하였으며, 상호저축은행 중에서는 ‘ 예가람 ‧한국투자‧JT ’가 우수 등급 을 획득하였다. \u003c 2026년도 지역재투자 평가위원회 개요 > ▪ 일시 · 장소 : 2026. 11. 27.(금) 15:00~15:55 / 정부서울청사 ▪ 참석자 : 민간위원장 (원숙연 이화여대 교수), 금융위원회 (금융산업국장 등), 행정안전부 (지방재정국장), 금융감독원 (은행리스크감독국장 등), 금융연구원 (이병윤 선임연구위원) [지역재투자 현황] 은행·저축은행권 지역재투자 현황 을 주요 평가항목별로 살펴보면 다음과 같다. \u003c 은행권 지역재투자 현황 > □ (지역자금 공급) 평가지역 (비수도권, 이하 동일) 에 대한 은행 여신규모 는 전년 대비 증가 하였으며, 예대율 * 은 소폭 상승 하였다. * ‘26년 평가부터 기업대출 (1.15배) 및 가계대출 (0.85배) 에 가중치 부여 ㅇ ’25년 평가지역 여신증가율 (3.8%) 은 전년 (4.7%) 대비 하락 (△0.9%p) 하였으나, 수도권 여신증가율 감소폭 (6.0%→4.2%, △ 1.8%p) 에 비해서는 낮은 수준이다. ㅇ 평가지역의 수신액 대비 여신액 비율 * (예대율) 은 131.7 %로 전년 (124.1%) 대비 상승 (+7.6%p) ** 하였으며, 수도권 (99.0%) 에 비해 높은 수준 이다. * 비수도권 (%) : 126.5 (’22) →123.7 (‘23) →124.1 (‘24) / 수도권 (%) : 92.7 (’22) →97.3 (‘23) →98.4 (‘24) 제주 (209.2%) ‧대구 (168.6%) ‧경남 (159.9%) 등이 높고, 전북 (85.8%) ‧강원 (83.5%) 은 100% 하회 ** 전년과 동일한 기준 적용시, ’25년 예대율은 128.1%로 전년대비 4.0%p 상승 □ (중소기업 지원) ’25년 기준 은행의 평가지역 기업대출액 중 중소기업 에 대한 대출액 비중 * 은 96.3% 로 수도권 (81.6%) 에 비해 높았으며 , * 개인사업자 대출 실적에 가중치 (1.5배) 부여 ㅇ 중소기업 대출액 증가율 은 2.0% 로 전년 (3.3%) 대비 다소 하락 ( △ 1.3%p) 하였으나, 대출액 증가율이 감소세로 전환된 수도권 (4.4% → △ 1.4%) 보다는 하락 폭 이 작았다 . □ (서민대출 지원) ’25년 기준 은행의 평가지역 가계대출액 대비 서민대출액 * 비중은 1.81% 로 전년 (1.95%) 대비 소폭 감소 (△0.14%p) 하였으나, 수도권 (1.33%) 에 비해서 높은 수준 으로 나타났다. * 새희망홀씨 취급액 + 신용평점 하위 50% 비보증부 중·저신용자 가계신용대출 □ (인프라) ’25년 기준 은행의 평가지역에 대한 인구 수 대비 점포 수 는 101.7개 (백만명 당) 로 수도권 (111.5개) 에 비해서 적은 수준 이며, ㅇ 전년 (102.5개) 대비 소폭 (△1.1개) 감소 * 하였으나, 평가지역 감소세 는 수도권 에 비하여 완만한 상황 이다. * 비수도권 (개) : 102.6 [△0.3] ('23) → 102.5 [△0.1] ('24) → 101.7 [△1.1] ('25) \u003c 저축은행권 지역재투자 현황 > □   if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';

    const chev = document.createElement('span');
    chev.className = 'chevron';
    chev.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    head.appendChild(chev);
    head.addEventListener('click', () => {
      const open = $('list').hidden;
      $('list').hidden = !open;
      banner.classList.toggle('open', open);
    });
  }
  banner.insertBefore(head, $('list'));

  const box = $('upcoming');
  const h = document.createElement('h2');
  h.textContent = 'Upcoming essential dates';
  box.appendChild(h);
  if (!upcomingRows.length) {
    const none = document.createElement('div');
    none.className = 'none';
    none.textContent = 'Nothing scheduled.';
    box.appendChild(none);
  }
  upcomingRows.slice(0, 5).forEach(({ day, c }) => {
    const n = dayDiff(day);
    const row = document.createElement('div');
    row.className = 'row';
    const when = document.createElement('span');
    when.className = 'when' + (n <= 3 ? ' soon' : '');
    when.textContent = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'in ' + n + ' days';
    const title = document.createElement(c.url ? 'a' : 'span');
    title.textContent = c.title;
    title.style.flex = '1'; title.style.minWidth = '0'; title.style.color = 'inherit'; title.style.textDecoration = 'none';
    if (c.url) { title.href = c.url; title.target = '_blank'; title.rel = 'noopener'; }
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = day.slice(5);
    row.appendChild(when); row.appendChild(title); row.appendChild(date);
    box.appendChild(row);
  });
}

// --- view switch: only essential & relevant (default), or all news ---
// Three views: 'ess' (essential only, the default), 'key' (essential + relevant), 'all'. A new storage key, so an old saved choice does not hide the new default.
let view = 'ess';
try { const v = localStorage.getItem('regView2'); if (v === 'key' || v === 'all' || v === 'ess') view = v; } catch (e) {}
let viewAll = view === 'all', viewEss = view === 'ess';
// --- feed ---
// The feed shows only updates flagged essential; the calendar still has everything.
const feedItems = data.changes.filter(c => c.essential);
const list = $('list');
// Shared by the feed's expandable cards AND the calendar's day-list, so
// both show the same level of detail (meta, summary, a real "View
// original" link) instead of the day-list being a bare title-only list.
function buildDetailsInner(c, extraMetaParts) {
  const inner = document.createElement('div');
  inner.className = 'card-details-inner';

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = [c.department, 'posted ' + c.date].concat(extraMetaParts || []).filter(Boolean).join(' · ');
  inner.appendChild(meta);

  if (c.essential) {
    const why = document.createElement('div');
    why.className = 'why';
    why.textContent = 'Flagged essential: ' + (c.importanceReasons || []).join('; ');
    inner.appendChild(why);
  }

  if (c.summary) {
    const summary = document.createElement('div');
    summary.className = 'card-summary';
    summary.textContent = c.summary;
    inner.appendChild(summary);
  } else {
    const note = document.createElement('div');
    note.className = 'card-meta';
    note.textContent = 'No inline text (attachment-only posting).';
    inner.appendChild(note);
  }

  if (c.url) {
    const view = document.createElement('a');
    view.className = 'view-btn';
    view.href = c.url; view.target = '_blank'; view.rel = 'noopener';
    view.innerHTML = '<span>View original</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
    inner.appendChild(view);
  }
  return inner;
}

function buildCard(c) {
  const card = document.createElement('div');
  card.className = 'card' + (c.essential ? ' is-essential' : '');
  card.style.setProperty('--source-color', PALETTE[c.source] || '#eb6834');

  // --- compact header: click to reveal details, nothing shown by default ---
  const head = document.createElement('button');
  head.className = 'card-head';
  head.type = 'button';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = c.source;
  head.appendChild(badge);
  const title = document.createElement('span');
  title.className = 'card-title';
  title.textContent = c.title;
  head.appendChild(title);
  const ago = document.createElement('span');
  ago.className = 'ago';
  ago.textContent = relTime(c.firstSeen);
  ago.title = 'Found at ' + fmtClock(c.firstSeen) + ' KST';
  head.appendChild(ago);
  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  head.appendChild(chevron);
  head.addEventListener('click', () => card.classList.toggle('expanded'));
  card.appendChild(head);

  // --- details: built once, hidden until expanded ---
  const details = document.createElement('div');
  details.className = 'card-details';
  details.appendChild(buildDetailsInner(c));
  card.appendChild(details);
  return card;
}
feedItems.forEach(c => list.appendChild(buildCard(c)));

$('footer').textContent = 'Checks run every 10 minutes · generated ' + fmtClock(data.generated) + ' KST';

// --- monthly activity calendar ---
// "today" comes from the server-generated timestamp (KST), not the
// viewer's local clock/timezone, so the calendar's current-month default
// stays correct regardless of who's looking at it. Forward navigation
// isn't capped at the current month, since planned/execution dates
// extracted from posting text can land in future months; it's capped
// further out instead, just to keep navigation from being unbounded.
const todayKST = data.generated.slice(0, 10);
let viewYear = parseInt(todayKST.slice(0, 4), 10);
let viewMonth = parseInt(todayKST.slice(5, 7), 10) - 1; // 0-indexed
let selectedDay = null;
const pad2 = n => String(n).padStart(2, '0');
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MAX_MONTHS_AHEAD = 12;

function renderCalendar() {
  const first = new Date(Date.UTC(viewYear, viewMonth, 1));
  const startWeekday = first.getUTCDay();
  const daysInMonth = new Date(Date.UTC(viewYear, viewMonth + 1, 0)).getUTCDate();
  $('calLabel').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;

  const monthsAhead = (viewYear - parseInt(todayKST.slice(0, 4), 10)) * 12 + (viewMonth - (parseInt(todayKST.slice(5, 7), 10) - 1));
  $('calNext').disabled = monthsAhead >= MAX_MONTHS_AHEAD;

  const grid = $('calGrid');
  grid.replaceChildren();
  ['S','M','T','W','T','F','S'].forEach(w => {
    const wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = w;
    grid.appendChild(wd);
  });
  for (let i = 0; i < startWeekday; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-day blank';
    grid.appendChild(blank);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = viewYear + '-' + pad2(viewMonth + 1) + '-' + pad2(d);
    const posted = data.calendar[dateStr] || [];
    const planned = data.planned[dateStr] || [];
    const hasData = posted.length || planned.length;
    const essentialCount = posted.filter(c => c.essential).length + planned.filter(c => c.essential).length;
    const cell = document.createElement('div');
    cell.className = 'cal-day'
      + (posted.length ? ' has-data' : '')
      + (planned.length ? ' has-planned' : '')
      + (essentialCount ? ' has-essential' : '')
      + (!hasData ? ' empty-day' : '')
      + (dateStr === todayKST ? ' today' : '')
      + (dateStr === selectedDay ? ' selected' : '');
    const num = document.createElement('span');
    num.textContent = d;
    cell.appendChild(num);
    if (!hasData && dateStr === todayKST) cell.classList.add('clickable-today');
    if (!hasData && dateStr === todayKST) cell.title = 'Nothing posted yet today';
    if (hasData) {
      const dots = document.createElement('span');
      dots.className = 'cal-dots';
      if (essentialCount) { const dot = document.createElement('span'); dot.className = 'cal-dot essential'; dots.appendChild(dot); }
      if (posted.length) { const dot = document.createElement('span'); dot.className = 'cal-dot'; dots.appendChild(dot); }
      if (planned.length) { const dot = document.createElement('span'); dot.className = 'cal-dot planned'; dots.appendChild(dot); }
      cell.appendChild(dots);
      const parts = [];
      if (posted.length) parts.push(posted.length + ' posted');
      if (planned.length) parts.push(planned.length + ' planned');
      if (essentialCount) parts.push(essentialCount + ' essential');
      cell.title = parts.join(', ');
    }
    if (hasData || dateStr === todayKST) {
      cell.addEventListener('click', () => {
        selectedDay = selectedDay === dateStr ? null : dateStr;
        renderCalendar();
        renderDayList();
      });
    }
    grid.appendChild(cell);
  }
}

function dayListItem(c, extraMetaParts) {
  const item = document.createElement('div');
  item.className = 'daylist-item';
  item.style.setProperty('--source-color', PALETTE[c.source] || '#eb6834');

  const head = document.createElement('div');
  head.className = 'daylist-item-head';
  const b = document.createElement('span');
  b.className = 'badge';
  b.textContent = c.source;
  head.appendChild(b);
  if (c.essential) {
    const flag = document.createElement('span');
    flag.className = 'badge essential';
    flag.textContent = 'ESSENTIAL';
    head.appendChild(flag);
  }
  // Title only until clicked; clicking reveals the same details as a feed card.
  const t = document.createElement('button');
  t.type = 'button';
  t.className = 'daylist-item-title';
  t.textContent = c.title;
  head.appendChild(t);
  item.appendChild(head);

  const details = buildDetailsInner(c, extraMetaParts);
  details.hidden = true;
  item.appendChild(details);
  t.addEventListener('click', () => {
    details.hidden = !details.hidden;
    item.classList.toggle('expanded', !details.hidden);
  });
  return item;
}

function dayListGroup(box, label, items, extraMetaParts) {
  if (!items.length) return;
  // "Essential & relevant" shows the notices a market reader needs; "All news" shows everything (the key ones first).
  const key = it => (it.tier === 'essential' || it.essential ? 0 : it.tier === 'relevant' ? 1 : 2);
  const shown = (viewAll ? items : items.filter(it => key(it) < (viewEss ? 1 : 2))).slice().sort((x, y) => key(x) - key(y));
  if (!shown.length) {
    const none = document.createElement('div');
    none.className = 'empty-note';
    none.textContent = label + ': ' + items.length + ' routine notice' + (items.length > 1 ? 's' : '') + ' (switch to "All news" to see them)';
    box.appendChild(none);
    return;
  }
  const heading = document.createElement('div');
  heading.className = 'group-label';
  heading.textContent = label + ' (' + shown.length + (shown.length < items.length ? ' of ' + items.length : '') + ')';
  box.appendChild(heading);
  const meta = it => (typeof extraMetaParts === 'function' ? extraMetaParts(it) : extraMetaParts);
  shown.forEach(it => box.appendChild(dayListItem(it, meta(it))));
}

// One "updates" section under the calendar: today's notices by default, or the picked date's posted/planned notices.
function renderDayList() {
  const box = $('updates');
  box.replaceChildren();
  const head = document.createElement('div');
  head.className = 'updates-head';
  const h2 = document.createElement('h2');
  head.appendChild(h2);
  box.appendChild(head);
  if (!selectedDay || selectedDay === todayKST) {
    const items = data.changes.slice().sort((x, y) => (y.essential ? 2 : y.tier === 'relevant' ? 1 : 0) - (x.essential ? 2 : x.tier === 'relevant' ? 1 : 0));
    const shown = viewAll ? items : items.filter(c => c.essential || (!viewEss && c.tier === 'relevant'));
    h2.textContent = 'Today\u2019s updates \u00b7 ' + todayKST + ' (' + shown.length + (shown.length < items.length ? ' of ' + items.length : '') + ')';
    if (!shown.length) {
      const none = document.createElement('div');
      none.className = 'empty-note';
      none.textContent = items.length ? 'Nothing at this level today \u2014 ' + items.length + ' routine notice' + (items.length > 1 ? 's' : '') + ' hidden (slide to "All news" to see them).' : 'Nothing posted yet today. Last checked ' + (lastCheckedLabel || 'recently') + '.';
      box.appendChild(none);
    }
    shown.forEach(c => box.appendChild(buildCard(c)));
    return;
  }
  h2.textContent = selectedDay;
  const back = document.createElement('button');
  back.type = 'button'; back.className = 'back-today'; back.textContent = 'Back to today';
  back.addEventListener('click', () => { selectedDay = null; renderCalendar(); renderDayList(); });
  head.appendChild(back);
  const posted = data.calendar[selectedDay] || [];
  const planned = data.planned[selectedDay] || [];
  if (!posted.length && !planned.length) {
    const none = document.createElement('div');
    none.className = 'empty-note';
    none.textContent = 'Nothing posted yet for this date. Last checked ' + (lastCheckedLabel || 'recently') + '.';
    box.appendChild(none);
  }
  dayListGroup(box, 'Posted', posted);
  dayListGroup(box, 'Planned for this date', planned, it => ['mentioned when posted ' + it.postedDate]);
}

$('calPrev').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  selectedDay = null;
  renderCalendar(); renderDayList();
});
$('calNext').addEventListener('click', () => {
  if ($('calNext').disabled) return;
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  selectedDay = null;
  renderCalendar(); renderDayList();
});
renderCalendar();
renderDayList();
const VIEWS = ['ess', 'key', 'all'];
function applyView() {
  viewAll = view === 'all'; viewEss = view === 'ess';
  const i = VIEWS.indexOf(view), range = $('viewRange');
  range.value = i;
  range.style.setProperty('--pct', (i * 50) + '%');
  range.setAttribute('aria-valuetext', $(['lblEss', 'lblKey', 'lblAll'][i]).firstChild.textContent);
  [['lblEss', 'ess'], ['lblKey', 'key'], ['lblAll', 'all']].forEach(([id, v]) => {
    $(id).classList.toggle('on', view === v);
    $(id).setAttribute('aria-pressed', String(view === v));
  });
  const ess = data.changes.filter(c => c.essential).length;
  const rel = data.changes.filter(c => !c.essential && c.tier === 'relevant').length;
  $('cntEss').textContent = 'today: ' + ess;
  $('cntKey').textContent = 'today: ' + (ess + rel);
  $('cntAll').textContent = 'today: ' + data.changes.length;
  // "All news" gets a soft tint and a thin accent bar at the top (CSS, keyed on data-view) so you can tell which view you are in.
  document.documentElement.setAttribute('data-view', view);
  $('modeNote').textContent = viewAll ? 'Showing every notice from all sources.' : viewEss ? 'Showing only essential notices.' : 'Hiding routine notices.';
  renderDayList();
}
function setView(v) {
  view = v;
  try { localStorage.setItem('regView2', view); } catch (e) {}
  applyView();
}
$('viewRange').addEventListener('input', e => setView(VIEWS[+e.target.value]));
[['lblEss', 'ess'], ['lblKey', 'key'], ['lblAll', 'all']].forEach(([id, v]) => $(id).addEventListener('click', () => setView(v)));
applyView();
</script>
