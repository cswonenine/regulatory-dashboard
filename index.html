<style>

  .view-slider input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--accent) var(--pct), var(--surface-2) var(--pct)); border: 1px solid var(--text-muted); }

  .switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; border: 1.5px solid var(--text-muted); background: var(--surface-2); cursor: pointer; padding: 0; transition: background .18s, border-color .18s; }

  /* "All news" is shown by a soft accent tint over the page and a thin accent bar at the top, not by switching the theme */
  body { transition: background-color .25s; }

  :root[data-view="all"] body { background: color-mix(in srgb, var(--accent) 8%, var(--page-plane)); }
  :root[data-view="all"] body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); z-index: 5; }
  :root[data-view="all"] .mode-note { color: var(--accent); font-weight: 600; }
  .today-feed { margin-top: 22px; }
  .today-feed h2 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 0 0 8px; text-transform: none; letter-spacing: 0; }
  .more-btn { margin: 8px 0 2px; font: inherit; font-size: 12.5px; color: var(--text-muted); background: transparent; border: 1px dashed var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }

  .view-btn {

  .empty { text-align: center; padding: 56px 16px; color: var(--text-muted); }

  .other-toggle { font: inherit; font-size: 13px; color: var(--text-secondary); background: transparent; border: 1px solid var(--border); border-radius: 7px; padding: 5px 11px; cursor: pointer; margin: 4px 0 10px; }
  .other-toggle:hover { background: var(--surface-2); }
  #otherList { margin-bottom: 10px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 32px 0 12px; }
  .cal-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px 17px 14px; box-shadow: 0 1px 3px var(--shadow); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;

    background: var(--surface-2);

  .cal-day.blank { background: none; }
  .cal-day.empty-day { opacity: 0.4; }
  .cal-day.has-data, .cal-day.has-planned { color: var(--text-primary); cursor: pointer; font-weight: 650; }
  .cal-day.has-data:hover, .cal-day.has-planned:hover { outline: 1.5px solid var(--accent); }
  .cal-day.selected { outline: 2px solid var(--accent); }
  .cal-day.clickable-today { cursor: pointer; opacity: 1; color: var(--text-primary); }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--text-muted); }
  .cal-dots { display: flex; gap: 2px; position: absolute; bottom: 5px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

<div class="wrap">

 적발 하였습니다. - 본 사건의 핵심 혐의자들은 명문대 경영동아리 , 글로벌 컨설팅회사 출신 으로 일종의 ‘ 정보카르텔 ’을 형성 하고, 상장사 내부정보 를 공유 하며 가족 ･ 지인 들을 가담 시켜 장기간 조직적 으로 미공개정보 를 이용 한 사건입니다. - 금일(9.29.) 합동대응단 은 혐의자들의 자택, 사무실 등 20여 곳 에 대한 압수수색 을 전격 실시 하여 현재 진행 중인 사건의 현장 증거 를 확보 함과 동시에, 증권선물위원회 (위원장 권대영) 는 미공개정보 이용으로 취득한 부당이득이 보관된 혐의자의 증권 계좌 에 대해 자본시장법에 따른 지급정지 조치 를 시행 하여 취득한 부당이득 을 남김없이 환수 할 수 있는 선제적인 조치 를 완료하였습니다. - 본 사건은 거래소 의 시장감시 과정 에서 최초 포착 한 후 합동대응단 에서 기관 간 긴밀한 공조 조사 를 통해 혐의를 추가 포착한 사건으로, 향후 압수수색 결과를 바탕으로 신속히 조사를 마무리 하여 엄정 조치 할 예정입니다. - 합동대응단은 앞서 공개매수 주관사 임원의 미공개정보 이용행위에 대한 압수수색 및 조치를 완료 하고 이번에 금융전문가 로 구성된 ‘정보카르텔’ 세력 을 적발 함에 따라 , 상장사 미공개정보 를 이용 한 불공정거래 행위 는 끝까지 추적 해 우리 자본 시장에서 발붙일 수 없도록 함으로써, 일반 투자자 들이 정보의 비대칭 으로 불이익 을 받지 않도록 지속적으로 감시 ･ 조사 ･ 엄단 하겠습니다. 동 보도자료 내 범죄혐의는 재판에 의 하여 확정된 사실이 아님 에 유의하여 주시기 바랍니다. 1. 사건의 개요 금일 ｢주가조작 근절 합동대응단｣ 은 글로벌 컨설팅회사 및 사모펀드 운용사 출신의 이른바 ‘금융엘리트’들이 연루된 M&A 관련 미공개정보 이용 혐의 사건과 관련하여 혐의자들의 근무지 및 자택 20여 곳 에 대해 일제히 압수수색 을 실시하였습니다. 아울러 부당이득의 은닉 등을 방지하기 위해 일부 혐의자의 계좌에 대해 지급정지 조치 를 시행하였습니다. 2. 조사 배경 및 경과 상장주식에 대한 공개매수 등 지배구조 개편 또는 M&A 정보 는 공표 즉시 주가에 상당한 영향을 미치는 대표적인 ‘ 호재성 중요정보 ’입니다. 이에 자본시장법 은 이러한 정보가 일반투자자에게 공개되기 전 에 이를 매매에 이용 하거나 타인에게 이용하게 하는 행위를 엄격하게 금지 하고 있습니다. 그럼에도 불구하고 M&A 과정에서 취득한 미공개정보 를 사전 에 유출 하여 주식 매매에 활용하고 부당이득을 취한 것으로 의심 되는 사례 가 자주 발생 하고 있습니다. 금감원과 한국거래소는 시장감시 과정에서 이러한 정황들을 다수 포착 하여 사건화하였고, 합동대응단 은 지난해 10월 공개매수 주관사인 NH투자증권 임원의 미공개정보 이용 혐의 에 대해 압수수색 등 강제조사를 실시하고, 올해 5월 해당 혐의자를 고발 하는 등 조치한 바 있습니다. 합동대응단은 금감원 과 거래소 가 최근 수년간 시장감시 를 통해 포착한 미공개정보 이용 사건 중 동일 혐의자 가 반복적 으로 연루 된 사건들을 합건 하여 심층 분석 할 필요가 있다고 판단했습니다. 사안의 중대성 과 강제 조사를 통한 증거 확보의 필요성 등을 종합적으로 고려하여, 올해 5월부터 합동대응단에서 관계기관 간 긴밀한 공조 아래 조사를 진행 해 왔습니다. 3. 혐의 내용 핵심 혐의자의 미공개정보 이용 흐름도 본 사건의 핵심 혐의자들은 명문대 경영동아리 와 글로벌 컨설팅회사 에서 함께 활동하며 인연을 맺은 사이로, 이후 각자 사모펀드 운용사 및 상장회사로 자리를 옮겨 공개매수 등 M&A 관련 업무를 수행 하였습니다. 이들은 최근 약 5년 동안 업무 과정에서 알게 된 다수 종목의 호재성 미공개정보를 계속적ㆍ 반복적으로 상호 공유한 것으로 파악 됩니다. 핵심 혐의자들은 해당 정보를 본인의 주식 매매에 이용하면서 가족· 지인 등에게도 전달하여 주식 매매에 이용하도록 하였습니다. 핵심 혐의자 및 그 가족·지인은 정보가 시장에 공개되기 전 해당 종목을 미리 매수 한 뒤, 정보 공개 이후 주가가 상승 하면 이를 고가에 처분 하는 방식으로 총 200억원 이상 의 부당이득 을 취득한 것으로 파악됩니다. 특히 본 사건은 특정 개인의 일회성 일탈이 아니라 내밀한 정보카르텔 內 에서의 정보 공유가 장기간 반복되었다는 점, M&A 관련 업무를 수행하는 과정에서 엄격한 비밀유지의무를 부담하는 전문인력이 정보의 원천 이었다는 점 , 정보가 가족·지인에게까지 전파 되어 불공정거래 행위자가 광범위하게 확대 되었다는 점에서 사안이 매우 중대합니다. 4. 사건의 의의 및 향후 계획 이번 사건 핵심 혐의자들의 개별 이상매매 양태는 그간 금감원 및 거래소 의 시장감시 과정에서 여러 차례 포착 되었으나, 정보 지득경로 등을 추단할 단서를 발견하기 어려웠습니다. 이에 합동대응단은 앞서 처리한 공개매수 주관사 임원의 미공개정보 이용 사건 등의 경험 을 바탕으로, 2026년 5월 부터 가용 조사인력 을 총동원 해 조사를 진행했습니다. 그 결과 핵심 혐의자들이 ‘ 정보 카르텔’ 을 형성해 미공개정보를 반복적으로 공유 해 온 전모 를 파악 할 수 있었습니다. 이번 압수수색으로 확보한 증거 등을 토대로 이러한 혐의를 명확히 입증 할 수 있을 것으로 기대하고 있습니다. 합동대응단은 지난 공개매수 주관사에 대한 압수수색 관련 보도자료를 통해 내부자의 미공개정보 이용행위를 주가조작과 동일한 중대 범죄행위로 규정 하고 위반 혐의자에 대한 무관용 엄중 조치 를 천명한 바 있습니다. 금일 압수 수색 및 지급정지 조치를 통해 내부자의 미공개정보 이용행위를 끝까지 추적해 부당이득을 환수한다 는 것을 다시 한번 확인시켜 드린다는 점에 의의가 있습니다. 앞으로 합동대응단은 임의조사･압수수색을 통해 확보한 자료 ･ 증거 등을 종합적 으로 분석 ･ 검토 하여 추가 조사 를 신속히 마무리 하고 엄정 조치 할 예정입니다. 또한 고발 및 부당이득의 최대 2배 에 달하는 과징금 부과 등 후속 조치 에도 만전 을 기하겠습니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 - 인터넷 : 금융위원회 홈페이지 내 ‘참여마당 → 불공정거래신고’ 메뉴 접속 ☞ 금융감독원 - 인터넷 : 금융감독원 홈페이지 내 ‘민원·신고 → 불법금융신고센터 → 증권불공정거래신고’ 메뉴 접속 ☞ 한국거래소 - 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) - 전 화 : 1577-0088", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "이찬진 금융감독원장, 증권회사 CEO 간담회 개최", "department": "자본시장감독국", "date": "2026-09-29", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232288&menuNo=200218&pageIndex=1", "summary": "□ ’26.9.29.(화) 이찬진 금융감독원장은 23개 증권회사 CEO들과 간담회를 개최하여, 최근 증권업계의 현안과 방향을 논의하고, 업계 건의사항을 청취하는  소통의 자리를 마련하였음\n□ 이찬진 금융감독원장은 올해 증시 변동성이 크게 확대되어 상당수 개인투자자에게는 어려운 시기였다는 점을 안타깝게 여기면서,\nㅇ 증권업계는 상반기에만 지난해 연간실적에 육박하는 비약적인 성과를 거둔 만큼, 존립기반인 투자자와의 동반성장에 책임을 다해야 할 때임을 강조하고, 투자자의 굳건한 신뢰 없이는 증권산업의 미래를 장담할 수 없다며 당부사항을 전달하였음\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "relevant"}, {"source": "FSS", "title": "취약계층 보호 및 금융소비자 편의 제고를 위해 은행권 최저생계비 조회용 계좌통합조회서비스를 시행합니다", "department": "은행검사2국", "date": "  금융위 부위원장 은 9월 30일(수), 제2차 국민참여형 국민성장펀드 (이하 ‘ 국민참여성장펀드 ’) 판매처 중 하나인 NH농협은행 정부서울청사지 점을 방문해 펀드에 가입 하였다. ※ 국민참여성장펀드 주요내용은 \u003c붙임> 참조 권 부위원장 은 일반 국민들이 펀드 가입 시 거치게 되는 투자자 성향 분석 , 펀드 중요사항 확인 (투자설명서, 약관 등) 등 펀드 가입 과정의 전반 을 직접 경험 하며, 가입 절차상의 편의성과 애로사항 등을 점검 한 후 펀드 가입서류에 서명하였다. 펀드 가입을 마친 권 부위원장 은 “ 국민참여성장펀드가 국민에게는 미래 전략산업 성장의 과실을 함께 나누는 의미있는 투자 기회 가 되고, 첨단전략산업 기업에는 성장에 필요한 자금을 원활히 공급하는 상생의 발판 이 될 것”이라고 언급하면서, “ 금년부터 5년간 매년 6천억원 조성 을 목표로 지난 5월에 처음 출시되었 는데, 첫 날 약 87%가 판매 되는 등 국민들의 수요가 매우 높음에 따라 2차 펀드 출시를 앞당기게 됐다 ”고 배경을 설명했다. 권 부위원장은 “2차 펀드는 보다 많은 국민들께 기회를 드리자는 취지에서 1차 펀드 가입자는 제한 하였으며, 1차 때 서민 판매분 (약 35%) 이 목표치 (20%) 를 초과함에 따라 금번 2차 펀드 에서는 첫 5영업일 동안 판매되는 서민 우선 배정 물 량을 50%로 대폭 확대 하였다”고 강조했다. 아울러 국민들의 가입 편의 를 제고 하기 위해 기존에는 직접 제출 해야 했던 소득증빙서류를 공공 마이데이터 등을 통해 전산으로 제출 하도록 간소화하였다는 점도 밝혔다. NH농협은행 정부서울청사지점 정영호 지점장 은 1차 가입자 제한 과 서민 배정 확대 등 1차 펀드 때와 달라진 점을 감안하면, 2차 펀드의 판매 속도는 다소 느리게 진행 될 수 있으나, 높은 세제 혜택 (투자금의 최대 40%까지 소득공제, 배당소득 9.9% 분리과세) 과 정부 재정 등이 일부 손실을 우선 부담 하는 상품 특성 등을 감안할 경우 매력적인 투자 상품 이라고 생각한다고 언급하였다. 권대영 부위원장은 오늘부터 판매가 개시된 국민참여성장펀드가 세제 혜택 및 재정 등의 일부 손실 부담 이점은 있으나, 5년 만기의 폐쇄형 (환매금지형) 상품 인 점 , 아울러 원금이 보장되지 않는 투자 상 품인 점 등을 감안하여 판매 기관들 은 현장에서 고객 에게 이를 충분히 안내 하고, 불완전판매가 발생하 지 않도록 만전을 기해 줄 것 을 당부하였다. 정부도 펀드 가입 과정 등에서 국민들의 불편함을 최소화 하기 위해 현장의 상황을 실시간으로 점검 하고 필요시 신속하게 애로를 해소 하겠다고 하였다. 마지막으로 , 권 부위원장은 “ 아름드리 나무도 작은 싹에서 자라나듯 , 오늘 국 민들 께서 심으신 싹 이 대한민국 미래산업 으로 자라나고 그 성장의 열매 가 국민들께 돌아갈 수 있도록 성심성의껏 잘 관리 해 나가겠다”고 밝혔다.", "essential": false, "importanceReasons": ["event / ceremony (-2)", "strong keyword in body text (+1)"], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "의료계·플랫폼 협력으로 “실손24” 연계율 제고 나선다.", "department": "보험과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87818", "summary": "의료계·플랫폼 협력으로 “실손24” 연계율 제고 나선다. ◈ 소비자가 앱으로 요청 하면 병원 이 실손보험금 청구서류 를 보험회사로 자동 으로 보내주는 실손보험 청구전산화 시행 (‘24.10.25일) 2년 이 경과 ㅇ 매년 수천억원 에 달하는 未청구 실손보험금 을 국민께 돌려드릴 수 있는 제도로, 현재 전국 약 5만개 병·의원 및 약국 에서 사용 가능 * 현재 전체 의료기관 105,643개 중 50,340개(47.7%) 연계 (9.28일 기준) ◈ 연말 까지 병·의원의 실손24 연계율 80~90% 를 목표로 의료기관에 대한 현장 지원을 강화 하고, 연계 의무를 강화 하는 법률개정 추진 검토 ㅇ 직접 의료기관에 연락하거나 방문 하여 실손24 연계 를 지속 설득 하는 한편, 의료기관에 연계 인센티브 를 제공 ㅇ 의료기관 및 EMR업체 의 실손24 연계 의무 를 명확히 하고, 필요시 정당한 사유 없는 미연계 에 대한 과태료 를 부과 하는 보험업법 개정 추진 * Electronic Medical Record 업체: 전자의무기록을 전산처리하는 프로그램 개발·제공 ◈ 실손24 의 편리함 을 누리는 소비자가 더 많아질 수 있도록 플랫폼·금융앱 연계 를 확대하고 대국민 홍보 도 강화 ㅇ 네이버 지도 등 익숙한 플랫폼 및 금융앱에서 실손24를 이용 할 수 있는 의료기관을 손쉽게 찾고 , 편리하게 청구 할 수 있도록 연계 강화 ㅇ 복지부 와 공동으로 방송매체 (TV, 라디오) , 온라인 , 병원 내 홍보를 진행하고, 실손24 대국민 홍보영상 공모전 등을 통해 관심 촉구 I. 회의 개요 ’26.9.30일(수), 권대영 금융위원회 부위원장 주재 로 의료계와 보험업계가 공동으로 참여 하는 법정회의체 인 ‘실손전산시스템운영위원회 (이하 “실손전산운영위”) ’ 겸 실손보험 청구전산화 (실손24) 점검회의 를 개최하였다. 오늘 회의에는 보건복지부 , 금융감독원 등 유관기관 , 생·손보업계, 의약단체, 전문가 와 실손보험 청구전산화 서비스를 자사 플랫폼과 연계하는 네이버파이낸셜 (주) 과 ㈜ 비바리퍼블리카 (토스)가 참여하여, 실손보험 청구전산화 추진 실적 및 의료기관 연계현황을 점검 하고 연계율 제고 및 소비자 편의 증진을 위한 과제 등을 심도 있게 논의 하였다. * 실손전산운영위는 보험업법 §102-7④, 동법 시행령 §48-4에 근거 \u003c 실손보험 청구전산화 점검회의 개요 > ▪ (일시 / 장소) ‘26.9.30(수) 10:00 / 손해보험협회 ▪ (참석) 금융위원회 (부위원장 주재) , 보건복지부, 금융감독원, 보험개발원, 생·손보업계 의사협회, 치과의사협회, 한의사협회, 약사회 이봉주 교수 (경희대) , 김재영 변호사 (태평양), 최영현 선임고문 (마콜컨설팅) 네이버파이낸셜(주), ㈜비바리퍼블리카 ※ 병원협회, 소비자연맹 일정상 불참 이에 앞서 금융위원회는 ‘26.9.28일(월) 김진홍 금융산업국장 주재 로 사전점검회의 를 개최하였다. 사전회의 에는 금융감독원, 보험개발원 등 유관기관 , 생·손보협회 , 플랫폼 서비스 운영사 및 EMR업체 (GC메디아이, 이지스헬스케어, 비트컴퓨터, 오스템임플란트) 가 참여하여 연계율 제고를 위한 그간 노력과 향후 정책 방향 에 대해 논의 하였다. Ⅱ. 부위원장 모두발언 권대영 부위원장 은 실손보험 은 약 4천만명의 국민 이 가입한 제2의 건강보험으로서, 실손보험 청구전산화 시스템 은 국민의 실손보험금 청구 편의성 을 획기적으로 높일 수 있는 사 실상의 공적 인프라 라고 소개하였다. 국민들께서는 다양한 의료 서비스를 이용하고 동 시스템을 통해 보험금을 간편하게 청구 할 수 있어, 실손보험에 가입한 대다수의 국민들께 혜택 을 드릴 수 있는 공적 서비스라고 강조하였다. 그러나, 실손보험 청구전산화 제도 시행 이후 2년 이 지난 지금까지도 의료기관 연계율은 47% 수준에 그치고 있어, 국민들께서 직접적인 효용 을 느끼기에는 아직 부족한 상황 이라고 평가하였다. 현재 연계율 제고가 정체 되는 것은 의료기관의 낮은 관심 에 기인한 바가 크다고 하면서, 실손24 제도에 대한 의료기관의 적극적인 관심과 참여 를 당부하였다. 의료기관과 EMR업체의 자발적인 협조만으로는 연계율 제고가 어렵다고 판단되는 경우 , 미연계 업체에 과태료 부과를 할 수 있는 보험업법 개정 등을 추진할 방침 임을 밝혔다. 아울러, 국민 께서 전국 어느 병·의원 에서나 실손보험금을 손쉽게 청구 할 수 있도록 최선의 노력을 다하겠다고 밝혔다. 아직 실손보험 청구전산화 서비스가 생소한 국민 을 대상으로 대국민 실손24 홍보 캠페인 을 진행하고, 국민 이 실손24 참여 병원 을 알고 더 쉽게 이용할 수 있도록 플랫폼과의 연계를 통해 청구 절차 및 청구 안내를 개선 해 나갈 계획이라고 하였다. 또한, 의약단체 의 참여를 독려하기 위한 공문 발송 등 복지부와도 지속적으로 협조 해 나가겠다고 하였다. Ⅲ. 실손보험 청구전산화 개요 실손24 서비스 개요 실손보험 청구전산화 는 실손24 앱 등을 통해 소비자가 요청 하는 경우, 별도의 종이서류 발급 없이 병원이 직접 영수증, 세부산정내역서, 처방전 을 보험사로 전자적으로 전송 하여 실손 보험금을 간편하게 청구 할 수 있도록 하는 서비스이다. (참고1) * 실손보험 계약을 보유하고 있는 국민 누구나 ｢실손24｣ 앱 또는 홈페이지를 이용하거나, 플랫폼 (예: 네이버, 토스) 에 접속 하여 실손보험금 청구 서비스를 이용 가능 소비자는 실손24 앱, 홈페이지 등에서 본인확인 을 거쳐 보험계약과 진료내역을 선택 하고 청구서를 작성 한 후 전송을 요청 하면 된다. 과거 실손보험금을 청구 하기 위해서는 병원에서 영수증, 세부산정내역서 등 종이서류를 발급 받아 사진을 찍거나 따로 제출해야 하는 번거로움 이 있었으나, 실손24를 통해 서류를 직접 떼고 제출하는 수고를 줄여 소비자가 실손보험금을 손쉽게 청구 할 수 있도록 지원한다. 병원 등 의료기관 참여 현황 실손보험 청구전산화 (이하 청구전산화) 는 ’24.10.25일 병원급 의료기관과 보 건소 (1단계, 약 7.8천개) 를 대상으로 우선 시행된 후, ’25.10.25일부터 의원 및 약국 (2단계, 약 9.8만개) 까지 확대 시행 되었다. ’26.9.28일 기준, 총 50,340개 의료기관 (병원 1,107개, 보건소 3,578개, 의원 24,995 개, 약국 20,608개) 이 참여 하고 있으며, 연계 의료기관 개수 기준 연계율은 약 47.7% (1단계 연계율 약 60.0%, 2단계 연계율 약 46.7%) 이다. 실손24 서비스에 약 521만명이 가입 하였으며, 서비스 개시 이래 ‘26.9.28일 현재까지 실손24를 통해 청구된 건수는 461만건 수준 이다. \u003c 청구전산화 요양기관 연계 현황 (’26.9.28일 기준, 개) > 구 분 병원·보건소(1단계) 의원·약국(2단계) 합 계 전 체 7,810 (100%) 97,833 (100%) 105,643 (100%) 연계 예상 1) 4,865 (62.3 %) 96,685 (98.8%) 101,550 (96.1%) 연계 완료 2) 4,685 (60.0 %) 45,655 (46.7%) 50,340 (47.7%) 23 1) 연계 예상 : 실손24 참여에 동의하거나 (1단계) 실손24 참여 EMR을 이용하는 요양기관 (2단계) 2) 연계 완료 : 실손24 연계가 완료되어 청구전산화 서비스를 이용할 수 있는 요양기관 Ⅳ. 실손보험 청구 전산화 활성화 방안 온라인 플랫폼을 통한 실손24 이용편의 개선 오는 10.7일 부터는 플랫폼 (네이버, 토스)을 통한 실손보험 청구전산화 서비스 가 개선된다. 기존에는 플랫폼(네이버, 토스)을 통해 실손보험 청구 전산화 서비스 를 이용하더라도, 실손24 사이트로 이동하여 청구하도록 했다. 10.7일부터는 많은 국민이 이용하는 네이버 지도, 네이버 페이, 토스 앱 내에서 실손보험금 청구 가 완결적으로 이루어질 수 있도록 개선한다. 또한, 마이데이터 이용에 동의한 소비자는 해당 앱에서 다녀온 의료기관(병원, 약국), 진료일, 보험사, 계좌번호 등을 별도로 입력하지 않아도 손쉽게 실손보험금을 청구 할 수 있다. 이를 통해 소비자의 실손보험 청구전산화 이용의 편의성이 한층 개선될 것으로 기대된다. 네이버 지도앱상 실손24 참여병원을 명확히 표기 네이버 지도 에서 실손24 참여 병원 표시방식도 개선 된다. 기존에도 네이버 지도에서 실손24를 검색시 연계병원이 단순 표시 되었으나, 소비자가 실손24 청구 가능 병원을 보다 쉽게 알 수 있도록 실손24 참여병원 은 병원 상세화면 에서 별도의 배너로 표시 하고, 지도에서 실손보험 청구 서비스 를 바로 이용할 수 있도록 연결 링크를 추가 한다. 또한, 네이버 포털사이트 나 네이버 지도 에서 병원을 검색할 경우, 현재는 진료과목, 진료시간 등의 필터를 및 소상공인 현장 간담회 개요 > ▪ (일시/장소) 9.30.(수) 13:30 / 전남광주 서민금융 복합지원센터 * 전남광주통합특별시 광산구 상무대로 198 ▪ (참석) 금융위, 지방정부, 유관기관, 지역 민간금융사, 지역 소상공인 등 - (개소식) 금융위원장 , 전남광주통합특별시 행정부시장, 서민금융진흥원장(신복위원장 겸임), 광주은행장 등 - (간담회) 금융위원장 , 서민금융진흥원장(신복위원장 겸임), 광주은행장, 광주소상공인연합회 회장(직무대행) 및 지역 소상공인, 한국자산관리공사, 신용보증기금, 기업은행, 소상공인시장진흥공단, 광주신용보증재단 등 Ⅰ 추진 배경 금융위원회 (이하 ‘금융위’)는 ’24년 부터 기관별로 흩어져있던 금융, 고용, 복지 등 서 비스 를 범정부 차원의 종합적 지원체계(“금융·고용·복지 복합 지원”) 로 묶어 제공·연계 하고 있다. 전국 52개 서민금융통합지원센터 또는 서 민금융플랫폼앱 ‘잇다’ 를 통해 원스톱으로 각종 서비스를 안 내·연계 하고 있으며, ’26년 6월까지 금융에서 고용 ·복지 등 유관 서비스로 연계된 건수는 누적 약 32만 건 에 달한다. 아울러, ’26년 6월 기준 복합지원 (금융-고용- 복지 연계) 이용자 의 대부업권, 저축은행 등 고금리 대부잔액 은 정책서민 금 융 단독 이용 자 보다 더 많이 감소 한 것(복합지원 이용자 △32.1%, 정책서민금융 단독 이용자 △29.2%)으로 나타나는 등 복합지원은 취 약계 층의 금융여건 개선과 재기 노력에 기 여 하고 있다. 한편, 지역 균형 발전 은 선택이 아닌 대한민국의 지속가능한 성장을 위한 필수전략 으로 금융도 이에 발맞출 필요 가 있다. 이에 금융위 는 복합 지원의 온기 를 거주 지역과 관계없이 누 구나 누릴 수 있도록 지방 정부, 유관기관, 지역 민간금융사와 함께 지역 밀 착형 복합지원 추진을 긴밀히 논의 해왔다. 특히, 지방정부 는 다양한 복지 서비스 제공을 담당하 고 있어 지역 내 경제적 어려움에 처한 분들을 발굴 하기 용이하며, 지방 은행 은 지역 산업구조와 경제여건 등에 대한 이해가 상대적으로 높은 만큼 서민·취약계층, 영세 소상공인의 자금·정책 수요 를 현장에서 파악해 각종 정책금융과 연계 하는 것이 수월할 것으로 기대된다. 특히, 전남광주 는 자영업자 가 지역 경제에서 차지하는 비중이 큰 지역 이다. ’26년 8월 기준 전남광주 지역의 자영업자 수 는 약 44만명 으로 지역 내 취업자 대비 비중은 전국 평균 대비 높은 수준 * 이다. 이러한 상황에서 전남 광주 지역의 고령화 수준이 높고, 인구감소도 빠르게 진행 ** 되고 있어 지역 소비 감소, 업황 부진 등 으로 인한 어려움에 대비 할 필요가 있다. 이러한 지역경제 특 성을 고려할 때 민관이 함께 지역 현장 에서 서민취약계층과 소상 공인의 금융수요를 세밀 하게 파 악 하고 수요에 맞는 금융·고용·복지 등 서 비스를 적시에 안내·연 계할 필 요 가 제기되었다. * (지역 내 취업자 대비 자영업자 비중, ‘26.8월, 데이터처 자료 가공) : ▲전남·광주 : 약 24%, ▲전국 : 약 20% ** 전남지역 고령인구 비율 전국 1위(27.3%) / 광주지역 인구감소율 전국 1위(△0.8%)(‘25, 데이터처 ) 이에 금융위는 전남광주 지역의 복합지원 체계를 강화 하기 위해 ’25년 4월 금융위와 광주광역시 간 복합지원 업무협약을 체결 하였으며, ’26년 5 월 서민금융진흥원 (이하 ‘서금원’) -신용회복위원 회 (이하 ‘신복위’) -광주은 행 간 지역 밀착형 복합지원 업무협약 체결 을 거쳐, ’26년 9월 전남광주 복합지원센터 개소 로 이어지게 되었다. Ⅱ 전남광주 서민금융 복합지원센터 개소식 전남광주 복합지원센터 는 지난 7월 개소한 부산 복합지원센터에 이어 전국 2번째로 개소 한 지역 밀착형 민·관 합동 서민금융모델 로, 중앙부처·지방 정부, 유관기관과 지역 민간금융사가 힘을 모아 금융·고용·복지 복합지원 체 계와 민간 제도권 금융을 한 공간에서 아우를 수 있 도록 설계 되었다. 전 남광주 복합지원센터 에는 서금원, 신복위, 광주은행, 미소금융법인 등 다양한 기관이 입주 하며, 전남광주 시민들을 위한 정책 서민금융, 채무조정, 고용·복지 등 복합지원 상담·연계 와 함께 광주은행이 제공 하는 금융상담 까지 원스톱으로 제공 하여, 복합적인 어려움을 겪는 전남광 주지역 내 서 민·취약계층과 영세 소상공인의 실질적인 재기를 지원 할 예정이다. 이에 더해, 광주은행 은 서금원 등 유관기관과 협업하여 전남광주 지역에 거주하는 복합지원 이용자 를 대상으로 금리우대 등 지역 특화 전용 대출· 적금상품 (전 남광주 희망사다리) 을 출시 한다. 해당 상품은 정책서민금융을 성 실상환한 취약차주가 보다 쉽게 제도권금융으로 안착할 수 있도록 지 원하기 위한 지역 기반 크레딧빌드업 (Credit Build-up)의 일환으로서 지역 내 금융희망사다리 역할 을 할 것으로 기대된다. 특히, 광주은행 은 지역 내 영세소상공인 (신고소득 연 5천만원 이하 및 전남 광 주시 소재 개인 사업자 고객) 을 대상으로 전남광주 희망사다리 대출상품 에서 0.5%p의 추가 우대금리를 제공 하고, 해당 상품 가입자 에게는 소상공인 컨설팅 서비스를 무상 제공 할 계획 이다. 아울러, 전남광주 복합지원센터 입주기관들은 센터 방문에 어려움을 겪는 지역 내 취약계층 지원을 위해 정기적으로 지역 곳곳을 방문 하는 ‘찾아 가는 복합지원’ 서비스를 실시하고, 정책서민금융 및 복합지원에 대한 전남광주 지역 주민들의 접근성을 제고 해 나갈 계획이다. 한편, 금융위 는 지난 9월 1일 발표된 ‘추석 민생안정대책’ (관계부처 합동)에서 추석 명절 전후 2개월 간 (9.1~10.31) 서민·취약계층·청년층을 대상 으로 하는 정책금융(햇살론, 햇살론유스) 공급규모를 전년 대비 4배 이상 확대(4,800억원) 하기로 하였다. 특히, 전남광주 복합지원센터 는 서금원과 광주은행이 한 공간에 상주 하는 만큼, 상기 상품의 상담, 신청부터 서금원 보증(100%), 은행 승인까지 원스톱 정책금융상품 지원도 가능 할 것으로 기대된다. 금융위 는 전남광주 복합지원센터 가 원활히 운영될 수 있도록 지방정부, 유관기관 등과 함께 적극 협업 하고, 대전, 강원 등 전국 광역권에서 서 민금융 복합지원센터 개소, 특화 금융상품 출시 등을 포함한 민·관 협업 기 반 지역 밀 착형 복합지원이 확산 될 수 있도록 지원해 나갈 계 획이다. 이억원 금융위원장 은 “ 전남광주 복합지원센터 는 전남광주 지역 주민과 소상공인 분들이 재기의 희망을 품을 수 있도록 돕는 희망의 사다리 가 될 것”이라며, “ 복합지원의 따뜻한 온기가 전남광주 지역에 더 많이, 더 넓게 퍼질 수 있도록 금융위가 지역 주민과 소상공인의 재기 과정의 페이 스메이커로 함께 뛰겠다 ”고 밝혔다. 아울러, “ 추석 민생안정 을 위한 4,800억원 규모 의 정책서민자금이 현장 의 자금애로 를 신속하게 완화 할 수 있도록 서민금융진흥원과 금융권 이 필요한 분들께 적극적으로 자금을 제공 해주길 바란다”고 당부했다. 황기연 전남광주통합특별시 행정부시장 은 “ 좋은 제도를 몰라 이용하지 못하는 시민이 없도록 적극 홍보 하고, 시민이 체감할 수 있는 금융지원을 위해 함께 노력 하겠다”고 밝혔다. 김은경 서민금융진흥원장(신용회복위원장 겸임) 은 “국민 누구나 사는 곳이 어디든 균등한 금융의 기회를 제공 받아 그 분들의 삶이 계속 이어지도록 하는 것이 저희의 핵심적인 역할 이다”라고 밝혔다. 또한, “부산과 전남광주 뿐만 아니라 복합지원센터를 전국적으로 확대 하여 지역의 취약계층과 소상 공인분들에게 든든한 버팀목이 되도록 노력 하겠다”라고 전했다. 정일선 광주은행장 은 “ 지역대표 금융기관 으로서 통합의 상징인 전남광주 지역에 ‘사람 살리는 금융’이 뿌리내릴 수 있도록 노력 하겠다”고 밝혔다. 아울러, 오늘 문을 여는 전남광주 복합지원센터를 통해 지역민이 필요한 순간 가장 가까운 곳에 있고, 다시 시작하는 순간 가장 든든한 힘 이 되는 금융을 실천하겠다 ”고 말했다. Ⅲ 지역 소상공인 현장 간담회 개소식에 이은 현장 간담회 에서는 지역 소상공인분들에게 금융·고용·복지 복합지원 체계 와 광주은행·유관기관 이 제공하고 있는 다양한 소상공인 지원제도 를 안내 하고 관련한 지역 소상공인분들의 의견을 청취 하였다. 1. 소상공인 분야 복합지원 연계 현황 및 향후계획 금융위 는 유관기관과 함께 ‘2026 복합지원 업무계획’ (’25.12월 발표)에 따라 소상공인분들께서 다양한 지원제도를 어디서든 편리하게 접 근하실 수 있도록 소상공인 지원 기관과의 복합지원 연계 확대를 추진 해왔다. 이에 따라 ’26년 3월부터 소상공인시장진흥공단과 복합지원 연계가 개 시 되었으며 전국 52개 서민금융통합(복합)지원센터 또는 소상공인지원센터 둘 중 어디를 방문하더라도 상담을 통해 필요한 경우 희 망리턴패키지, 정책서민금융 및 채 무 조정, 고용·복지 등 다양한 서비스를 원스톱으로 연계·지원 받을 수 있다. 이에 더해, 9월 30일부터 한국자산관리공사(이하 ‘캠코’)와 서금원· 신복위 간 복합지원 전산연계를 개시 한다. 이를 통해 복합지원 연계 서비스 에 새출발기금(매입형) 등 캠코에서 담당 중인 서비스가 추가 되고, 새출발기금(매입형), 새도약기금 등 이용자 도 복합지원 서비스를 안내·연계 받을 수 있게 되며, 각 기관 이용자에 대한 복합지원 서비스가 안정적으로 정착될 수 있도록 기관 간 연계 효과성을 지속 점검 할 예정이다. 아울러, ’27년 중 기업은행, 신용보증기금과 서금원, 신복위 간 복합지원 연계 가 이뤄질 수 있도록 지 원할 계획 이다 . 2. 소상공인 더드림 패키지 개편방안(기은·신보) 금융위는 작년 9월 금융채무를 연체없이 성실히 상환하고 있는 소상공인을 지원 하기 위해, 중소기업은행 (이하 ‘기은’) 과 신용보증기금 (이하 ‘신보’) 등 협업 하에 금리와 한도 등 우 대조건을 최대 한으로 적용하는 10조원 규모 의 “ 소상공인 더드림 패키지 프로그램 ”을 발표한 바 있다. 창업·성장·경영애로 등 상황별 자금 을 적극 지원 중이며, 총 8개 상품 을 순차적으로 출시하여, ’26년 8월 기준 누적 18,373건, 총 5.7조원이 지원 되었다. 그러나, 민생경제와 골목상권의 어려움 이 지속되고, 고금리 및 고물가로 인해 소상공인의 경영부담 이 가중될 우려가 높은 상황을 고려하여, 소상공인 더드림 패키지를 10.5조원에서 12.3조원으로 확대·재편 하여 소상공인을 더욱 적극 지원하기로 하였다. 특히 매출감소 등 애로를 겪는 소상공인에 대한 긴급유동성 지원 프로그램을 확대 하고 (3조원 → 4.8조원) , 원자재·이자 비용·인건비 등 경영비용 부담 증가 에 대비한 중장기 경영안정 및 회복지원 프로그램을 신설 (1.8조원) 하는 등 경영애로를 겪는 소상공인 을 보다 폭넓고 두텁게 지원 할 계획이다 (총7.8조원). 아울러, 일부 상품 지원요건 완화 , 공급 규모 조정 등을 통해 창업·성장·경영애로 등 소상공인 상황별 맞춤형 자금 이 적시 공급 되도록 개편할 계획이다. 3. 유관기관·민간 금융사의 소상공인 지원제도 현황 등 유관기관 에서도 소상공인 을 위한 정책금융 등 지원사업 을 전개하고 있다. 서금원 은 연소득 3.5천만원 이하인 영세 자영업자를 대상으로 미소금융 운영자금 (최대 2천만원 , 청년 최대 3천만원) 및 햇살론119 (최대 2천만원, 최초 이용시 최대 1천만원), 소상공인 특례 햇살론 카드 (보증한도 최대 5백만원), 등 정책금융상품과 함께 자영업 전문 컨설팅 등을 제공하고 있다. 신복위 는 다양한 채무조정제도 (신속·사전채무조정 , 개인워크아웃)를 통해 이자율 인하 또는 원금 감면, 분할상환(최장 10년)을 지원하며, 개인회생·파산 신청지원제도(패스트트랙) 를 운영중이다. 아울러, 소상공인 컨설팅 및 소액대출 (과목별 최대 1.5천만원, 이율 2~4%)을 제공하고, 불법사금융 신고 부터 초동조치, 피해구제로 이어지는 원스톱 지 원체계를 운영 하고 있다. 캠코 는 ’22년 10월부터 ’20.4월~‘25.6월 중 사업을 영위한 부실 또는 부실우려 소상공인 등을 대상으로 채 무조정을 지원하는 새출발기금을 운영 중 이다. ’26.8월 까지 누적 채무조정 신청자는 약 21.6만명 이며, 채무조정 신청액은 약 34.1조원 에 달한다. 이 가운데 약 15.2만명이 약 14조원 규모 채무조정 약정을 체결했다. 신보 는 재도전·재창업 지원 프로그램 을 통해 변제책 임이 있는 채무관계 자를 대상으로 구상채무 변제자금 또는 채무조정과 함께 신규 운영자금을 지원 하고 있다. 특히, 신보의 구상채무에 대한 성실 상 환자 등에게는 재창업 지원 특례보증 (보증비율 90%, 고정 보증료율 1%)을 지원하고 있다. 아울러, 소상공인 더드림패키지 를 통해 성장이 유망 하거나, 고물가·고환율 등으로 어 려움을 겪는 기업 에 우대자금을 지원 하고 있다. 기은 은 ‘소상공인 특화 신용평가체계(SCB) 도입방안’ (’26.4월, 금융위)에 따라 8월 말부터 시범운영을 실시 하여 SCB 우수등급(NICE 1~6등급) 소상공인을 대출 지원대상에 포함하고, 대출한도를 우대하고 있다. 아 울러, 2천억원 규모의 소상공인 상생·재기·회복 지원 프로그램 을 통해 여신 계 좌 적용 금리를 최대 2.0%p 이내 감면하는 등 ’26.8월까 지 219개사 대상 으로 총 882억원을 지원 하였다. 또한, 폐업 소상공인 대상 대환대출 을 제공하여 ’26.7월까지 총 3,101건, 963억원을 공급 하였다. 광주은행 은 지역 중소·소상공인 을 위한 특별자금대출 (운용한도 1.2조원, ’24~’26), 신규대출 지원 (약 4조원, ’24~’26.8월) 등 자금 공급과 함께 마케팅·경영진단·세무법률·점포운영 등 4대 전문분야 맞춤형 컨설팅 을 무료로 지원 (1,182건, ’ 24~’26.8월)하고 있다. 아울러, 광주·전남신용보증재단 등 지역보증기관에 매년 82억원을 특별출연 하여 지역 소상 공인의 특례보증 지원, 회생지원 보증 등을 지원하고 있다. 광주은행은 향후 소상공인 특별자금 대출 을 연간 5천억원 한도로 운용 하고 특별 금리감면, 보증서 대출 만기연장 지원 등을 제공하여 지역 소상공인의 금융비용 을 완화 할 계획이다. 아울러, 보증기관 등에 대한 특별출연 도 확대 할 예정이다.(’27년 100억원) 4. 참석자 주요 발언 및 마무리 이날 참석한 전남광주 지역 소상공인 들은 소상공인의 정책 금융 등 이용 과정에서의 애로사항 , 지역 밀착형 복합지원 활성화 등 과 관련한 다양한 의견을 제시하였다. 우선, 소상공인 더드림 패키지 를 통해 소상공인이 적기에 자금을 확보 했던 사례들이 공유 되었다. 30여년 간 종합소매업을 영위해 온 소상공인이 구도심 상권 변화에 대응 하기 위해 운전자금을 필요 로 하는 상황에서 기은 에서 자금을 적기에 대 출(IBK소상공인 희망Dream대출) 받아 안정 적 인 영업을 이어갈 수 있었던 사례 가 있었다. 또한 , 청년 소상공인 이 사업 확장을 위한 운전자금을 확보 해야 하는 상황에서 신보의 ‘소상공인 스텝업 특례보증’ 을 통해 자금을 적기 확보하여 매출 증가 및 사업확장을 실현한 사례 도 있었다. 관련해, 상권과 영업환경 변화 등으로 어려움을 겪거나 성장가능성이 높 음에도 자금을 원활히 확보하기 어려운 소상공인 이 자금 부족으로 경영 회복 또는 확장 기회를 놓치지 않도록 맞춤형 금융지원이 향후 지속 확대 되기를 기대 한다는 의견이 있었다. 복합지원 과 관련해서는 복합지원 연계 기관 간 행정정보나 기존 제출서류의 연계 를 통해 신청서 작성, 서류발급·제출과 관련한 소상공인의 편의를 제고 해달라는 의견이 있었다. 아울러, 많은 소상공인들이 금융지원제도에 대한 정보가 부족하고 생업으 로 인해 은행이나 관련 기관을 직접 방문하기 어려운 만큼, 찾아가는 복합지원을 금융기관 접근성이 낮은 지역 중심으로 지역 소상 공인 조직과 연계 하여 정기 운영 하고, 상담 이후 실제 지원여부까지 확인할 수 있도록 해달라는 의견이 제시되었다. 이억원 금융위원장 은 간담회를 마무리하며 “ 소상공인분 들을 위한 다양한 지원제도가 존재 함에도 바쁜 생업에 치여 위기 극복의 골든타임 을 놓치는 경 우가 잦다 . ”며, “소상공인 분들께서 보다 손쉽게, 더욱 편리하게 다양한 지 원제도를 안 내·연계 받으실 수 있도록 먼저 찾아가고 다시 일어설 때까지 손 잡아주는 정부 가 되겠다.”고 강 조 하였다. 금융위 는 오늘 간담회에서 제기된 소상공인분들의 다양한 의견을 들어 소상공인 지원방안에 대한 접근성과 신속성을 높이고 성실상환자에 대한 지원이 두터워질 수 있도록 소상공인 지원방안 후속조치, 복합지원 활성화 등을 유관기관과 긴밀히 논의 해 나갈 예정이다. \u003c별첨 1> 소상공인 더드림 패키지 개편방안 \u003c별첨 2> 개소식 축사 \u003c별첨 3> 간담회 인사말씀", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "10월 7일부터 2차 가입신청 시작! 청년미래적금 가입 전  달라진 절차와 주요일정을 확인하세요.", "department": "청년정책과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87820", "summary": "10월 7일부터 2차 가입신청 시작! 청년미래적금 가입 전 달라진 절차와 주요일정을 확인하세요. ▪ 10월 7~16일 (토·일·공휴일 제외) 까지 가입신청 , 가입심사 통과자 는 11월 16~27일 (토·일 제외) 중 계좌개설 ▪ 소상공인으로 가입신청 을 하는 경우, 운영 중인 모든 사업장 의 ‘ 소상공인확인서 ’를 청년미래적금 가입신청 전 에 발급할 필요 ▪ 청년도약계좌 가입자 의 청년미래적금 ‘갈아타기’ 기회 추가 제공 ▪ 신청단계에서 가입유형 을 직접 선택 하고, 사전심사 결과 안내 및 이의신청 절차 운영 등을 통해 가입심사 절차 보완 ▪군 입영 후 기초군사훈련 중인 경우에도 청년미래적금 에 가입 할 수 있게 청년미래적금 가입신청 및 계좌개설 지원 금융위원회 및 서민금융진흥원 은 10월 7일부터 시작 되는 청년미래적금 2차 가입신청 기간 운영 전 청년들이 가입과정에서 필요한 사항을 미리 확인 할 수 있도록 가입대상 , 가입신청·심사절차 및 청년도약계좌 에서 갈아타기 방법 등을 사전 에 안내 한다. 1. 가입연령 가입대상 은 만 19~34세 청년 이다. 이번 가입기간 에는 1991년 11월 17일생 * 부터 2007년 11월 27일생 * 까지 가 가입대상 이며, 병역 이행한 경우 최대 6년 의 병역 이행 기간 을 연령 계산 에서 제외 ** 한다. * 조세특례제한법령에 따라 가입일 (계좌개설기간, ‘26.11.16~27일) 에 만 19 ~ 34세인 청년 ** 예) 현재 35세인 자가 병역을 2년간 이행했을 경우, 2년을 차감한 33세로 간주하여 심사 2. 세부내용 청년미래적금은 가입자가 매월 최대 50만원 한도 내에서 자유롭게 납입 할 수 있는 3년 만기 자유적립식 상품 이며, 청년이 매월 납입한 금액 에 정부 가 기여금 (6% 또는 12%) 을 매칭 하여 지급 한다. 납입금과 기여금에 이자가 발생 하며, 이자 소득세 는 면제 된다. 금리는 3년 고정금리 (기본 5% + 우대 최대 2~3%) 로, 세부내용은 은행연합회 소비자포털 * 에서 확인 가능하다. 청년들은 기관별 우대금리 세부사항 과 이용 조건 등을 비교·확인 하여 본인에게 적합한 취급기관 ** 을 선택 하면 된다. * https://portal.kfb.or.kr, 금리/수수료 비교공시-예금상품금리비교-청년미래적금금리 ** 농협, 신한, 우리, 하나, 기업, 국민, 수협, iM, 부산, 광주, 전북, 경남, 카카오, 우정사업본부 ( 토스뱅크는 3차 모집부터 참여 예정) 금리 , 정부 기여금 , 이자소득 비과세 혜택 을 함께 고려한 청년미래적금 실질 가입효과 는 일반형 기준 최대 13.2~14.4% * , 우대형 18.2~19.4% ** 수준 단리 적금상품 에 가입 하는 것과 유사한 수준이다. * (금리 7% 가정시) 일반형 2,110만원 : 원금 1,800만원 + 기여금 108만원 + 이자 202만원→ 금리 13.2% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 366만원 - 이자소득세 56만원) 우대형 2,227만원 : 원금 1,800만원 + 기여금 216 출액 심사) 으로 가입 을 희망 하는 경우에는 ‘가입신청 전’ 소상공인 확인서 를 발급 * 받아야 한다. 소상공인확인서 발급 후 취급기관 모바일앱에서 ‘소상공인’ 을 선택 해 가입신청하면, 매출액·업종 등 관련 요건 을 심사 할 예정이다. * 중소기업현황정보시스템(sminfo.mss.go.kr) 접속 → 회원가입 및 로그인 → 자료제출 (홈페이지 매뉴얼 참고) → 중소기업(소상공인)확인서 신청서 작성 및 제출 → (승인 후) 확인서 발급 확인 ※ 소상공인확인서 발급문의 : 중소기업통합콜센터 국번 없이 1357 기존에 발급한 소상공인확인서의 유효기간 (1년) 이 지난 경우 심사 가 불가 하므로 가입신청 전 유효기간 확인 이 필요 하며, 2개 이상 의 사업장 을 운영 중인 경우 모든 사업장 의 소상공인확인서 를 발급 해야 한다. 우대형 이의신청 접수 마감일 (11.5일 잠정) 전까지 소상공인확인서 발급 이 완료 되지 않을 경우 , 소상공인 자격 (매출액 기준) 으로 심사 가 불가 하여 종합소득 기준 으로 심사 가 진행 되는 점 유의해야 한다. ※ 소상공인확인서 신청 후 발급까지 평균 약 7일 정도 소요되나, 발급 신청이 몰릴 경우 기간이 더 소요될 수 있음 또한, 가입신청 시점 기준 으로 운영 중인 모든 사업장 이 소상공인 요건을 충족 해야 한다. 현재 사업장 을 운영하지 않고 있거나 운영 중인 사업장이 중소 벤처기업부에서 고시하는 ‘ 소상공인 정책자금 융자제외 대상 업종 ’ * 인 경우 소상공인 자격 으로는 가입 이 불가능 하다. * 도 박기계 및 사행성, 불건전 오락기구 제조업, 담배 중개업 등 다만, 소상공인 요건 을 충족하지 못하는 경우 에도, 종합소득 등 일반 소득자 요건 을 충족 하면 일반소득자 로 가입 이 가능하다. 소상공인 해당 여부 에 대해서도 최종심사 에 앞서 사전심사 결과 를 안내 (10.30~11.2일 잠정) 하며, 가입단계에서 신청자 가 선택한 가입유형 과 사전심사 결과 가 다를 경우 이를 확인하고 소명 할 수 있는 기회 를 제공 한다. 최종심사 결과 는 개별 통보 예정이며, 매출액·가구소득 등 요건충족 여부 에 따라 일반형 또는 우대형 으로 통보 가 된다. 5. 청년도약계좌 → 청년미래적금 갈아타기 이번 2차 모집에서는 기존 청년도약계좌 가입자 가 청년미래적금 으로 갈아탈 수 있는 기회 를 추가 로 제공 한다. ※ 청년도약계좌 → 청년미래적금 갈아타기란? √ 청년미래적금과 청년도약계좌는 중복가입 불가 (청년도약계좌 만기 후에도 청년미래적금 가입 불가) → 기존 청년도약계좌 가입자가 손실없이 청년도약계좌를 해지하고, 청년미래 적금에 신규 가입할 수 있게 지원 √ 청년도약계좌는 청년미래적금 가입목적의 특별중도해지를 진행하고, 기존 청년도약계좌 납입금에 대한 정부 기여금 및 이자소득 비과세 혜택 유지 갈아타기를 희망하는 경우 우선 ➀ 청년미래적금 가입 신청·심사 를 완료 하고 가입 가능 안내 를 받은 후 ➁ 청년 미래적금 계좌 를 개설 한 다음, ➂ ‘청년 미래적금 가입 목적 의 청년도약계좌 특별 중도해지’ 를 신청 하면 된다. 단, ➁ 청년미래적금 계좌개설 후 동 기간 안 에 ➂ ‘청년 미래적금 가입 목적 의 청년도약계좌 특별 중도해지’ 를 완료하지 않을 경우 청년미래적금 에는 납입 이 불가능 하다. 갈아타기 절차를 마무리하지 않은 경우 청년도약계좌 는 그대로 유지 되며, 납입 이 중지 된 청년미래적금 계좌 는 반드시 해지 * 하여야 한다. * 청년미래적금 중도해지시 해지시점 기준 2개월 후부터 재신청이 가능하며, 해지 후 재가입한 경우 정부 기여금 지급비율은 기존 가입기간을 감안한 조정비율 ((36개월- 기존 가입기간)/36개월) 을 곱하여 일부 차감 (청년미래적금 납입 중지 기간도 가입기간으로 간주) 청년미래적금 가입 목적 의 청년도약계좌 특별중도해지 는 청년도약계좌 취급은행 앱 (App) 을 통해 신청 가능 하며, 신청이 접수되면 자동 으로 해지 처리 되고 이후부터 청년미래적금 납입 이 가능 하다. 6. 군장병 가입신청·계좌개설 지원 금융위원회와 국방부는 1차 모집기간 운영시와 마찬가지로 군 &view=260915784", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(9.30일)", "department": "국민지역참여지원과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87825", "summary": "*자세한 내용은 첨부파일을 확인하세요", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "은행업감독규정 규정변경예고 실시  ※예고기간 ‘26.9.30일 ~ 11.9일 ", "department": "은행과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87824", "summary": "은행업감독규정 규정변경예고 실시 ※ 예고기간 ‘26.9.30일 ~ 11.9일 ✓ ➊ 인터넷은행 대면업무 범위 의 합리적 조정, ➋ 외화결제계좌 의 신용공여 제외 , ➌ 부동산PF 신용공여한도 도입, ➍ 특수은행 경영실태평가 개편 등을 위한 은행업감독규정 개정 추진 ✓ 규정변경예고 (’26.9.30일~11.9일)를 통해 의견수렴 후 금융위원회 의결 (’26.12.2일 잠정 )을 거쳐 시행 * * 부동산PF 신용공여한도 규제는 ’27.1.1일 시행(3년 경과조치 부과) ’26.9.30.(수) 금융위원회는 인터넷은행 대면업무 범위의 합리적 조정 등을 위한 ｢은행업감독규정｣ 규정변경예고를 실시 (’26.9.30일~11.9일) 한다. 은행업감독규정 개정안의 주요내용 은 다음과 같다. I. 인터넷은행 대면업무 범위의 합리적 조정 (안 제102조 제4항 각 호 신설) ’26.7.1일 금융위원회 는 인터넷은행의 불가피한 대면업무는 허용하는 내용의 ‘인터넷은행 대면업무 범위의 합리적 조정 방안’ 을 의결 한 바 있다. 인터넷은행은 원칙적 으로 이용자와 직접 대면하거나 의사소통하는 대면 업무를 할 수 없으나 , 채무자 안내·상담·협의, 채무조정 상담 등을 위해 불가피하게 필요한 대면업무는 합리적 으로 허용 할 계획이다. 이는 ’26.7.1일 금융위원회 의결 에 따른 후속조치 로서, 인터넷은행이 수행할 수 있는 대면업무의 범위를 은행업감독규정에 열거 하여 규제 명확성 을 제고 한다. \u003c 인터넷은행 대면업무 범위 추가 내용 > ➀ 연체채권의 관리 또는 회수를 위하여 채무자에 대한 안내·상담·협의, 채무조정 상담, 채권단 공동관리 등이 필요한 경우 ➁ 비대면 제출 서류의 위·변조 확인 등을 위하여 원본 서류 확인이 필요한 경우 ➂ 자금사용 적정성, 담보물 현황 또는 가치 확인 등을 위하여 필요한 경우 ➃ 소비자 신청 등에 따라 사실 확인, 처리결과 전달, 서류 발급·접수 등을 위해 필요한 경우 ➄ 담보물 또는 임차주택 등 목적물의 권리관계, 점유관계 등에 대한 조사·확인이 필요한 경우 ➅ 담보권의 설정·변경·실행 과정에서 법령상 또는 행정상 제약으로 전자적 방법으로 수행이 불가한 경우 ➆ 기타 법령 및 규정상 의무 이행을 위해 필요한 경우 II. 외화결제계좌 금액은 신용공여 산정시 제외 (안 별표2 개정) 현재 다수 은행은 국내 기업의 해외 결제업무 를 지원하고 효율적으로 해외 자금거래를 수행 하기 위하여 해외 현지은행에 외화결제계좌를 개설·운영 하고 있다. 반면, 은행은 대주주 에 대해 자기자본의 25% (또는 대주주 출자비율) 범위에서 신용공여 를 할 수 있는데 (은행법 제35조의2) , 신용공여에 외화결제계좌 금액(예치금)도 포함 됨에 따라 일부 은행은 대주주 신용공여한도 준수에 어려움 * 을 겪을 가능성이 있다. * (예) 씨티·SC은행은 해외 본사은행(대주주)에 외화결제계좌를 운영 중. 국내 수출·수입 기업의 해외 결제수요가 급격하게 변동하는 경우 외화결제계좌 잔액이 변동함에 따라 대주주 신용공여한도 위반리스크가 발생하고, 기업의 해외 결제업무 지원이 제한될 우려 은행의 외화결제계좌 운용은 법령상 대주주 신용공여한도 규제의 취지와 상이 한 점 *1) , 보험업법 에서 이와 유사한 자금운용을 신용공여에서 제외 하는 점 *2) 등을 고려하여, 은행법령상 신용공여 의 범위에서 외화결제계좌 운용 금액 ** 은 제외 한다. * 1) 외화결제계좌는 국내 기업의 해외 영업행위에 필수적으로 수반되는 해외 결제를 지원하기 위한 것으로, 은행의 대주주 사금고화 방지 등 대주주 신용공여한도 규제 취지와 상이 2) 보험료 수납 및 대출업무 등 일상적인 업무수행을 목적으로 대주주인 은행에 개설된 계좌에서 운용되는 보험회사 자금은 신용공여에서 제외 중(보험업감독규정 별표1의2) ** 외국환의 결제 등을 위하여 금융기관에 개설된 은행의 계좌로 입금한 금액으로서 입금일로부터 3영업일이 경과하지 않은 경우 동 제도개선을 통해 국내 수출·수입기업의 무역결제 등 자금운용이 수월 해지고, 은행 자금결제 업무의 효율성 이 제고될 것으로 기대된다. * 국내 기업의 긴급한 자금결제 수요 등을 고려하여 ｢은행업감독규정｣ 개정 이전에도 은행의 외화결제계좌 운용에 따라 대주주 신용공여한도 위반 등이 적용되지 않도록 비조치의견서 旣발급(’26.5.28일) III. 부동산PF 신용공여한도 제한 (안 제26조 제1항 제7호 신설, 별표2 개정) ’25.12.22일 , 금융위원회는 관계부처 합동으로 ‘부동산PF 건전성 제도개선 방안’ 을 통해 은행·증권·보험·상호·여전업권별 부동산PF 한도 규제 도입 을 발표하였다. 이는 금융회사의 과도한 부동산PF 리스크 노출 및 편중을 방지 하고, 부동산PF 관련 건전성을 제고 하기 위함이다. 동 제도개선 방안의 후속조치로서, ｢은행업감독규정｣ 상 경영지도비율 * 로 ‘부동산PF 신용공여한도’ 규제를 신설 하여 은행의 부동산PF 대출 관련 신용공여는 총 신용공여의 20% 이내로 제한 하도록 한다. 부동산PF 신용 공여한도 규제는 ’27.1.1일에 시행 하며, 시행 당시 신용공여한도비율을 초과하는 은행은 3년 이내에 해소 할 수 있도록 경과기간 을 부여하여 규제 준수가능성 을 제고한다. * 현재 자본비율, 유동성커버리지비율, 예대율, 순안정자금조달비율, 단순기본자본비율, 거액익스포져비율 등 규정 중(은행업감독규정 제26조 제1항 각 호) IV. 특수은행 경영실태평가 개편 (안 제97조 제2항, 별표4 개정) ’24.2월 , 금융위원회는 일반은행 의 경영실태평가 체계를 개편 하여 내부통제 를 별도 평가부문 으로 분리하고, 평가비중 을 대폭 상향 (5.3%→15.0%) 한 바 있다. ｢은행업감독규정｣을 개정하여 특수은행 * 도 내부통제 평가를 강화하는 방향으로 경영실태평가 체계를 개편 한다. 현재 위험관리(R)의 하위항목인 내부통제(I) 를 별도 부문으로 구분 (CACREL→ CACEL-IR) 하고, 평가비중 을 대폭 확대 (3.2%→10%) 한다. 특수은행 경영실태평가 평가부문 및 비중 변경(안) 구분 자본 (C) 자산 (A) 법규준수 (C) 위험관리 (R) 수익성 (E) 유동성 (L) 내부통제 현행 20% 30% 10% 20% 3.2% 10% 10% 구분 자본 (C) 자산 (A) 법규준수 (C) 수익성 (E) 유동성 (L) 내부통제 (I) 위험관리 (R) 변경 20% 30% 10% 5% 10% 10% 15% V. 향후계획 ｢은행업감독규 정｣ 개정안 은 국무조정실 규제심사 등 관련 절차를 거쳐 금융위원회 의결 에 따라 시행될 예정이다 (부동산PF 신용공여한도 규제는 다른 금융업권과 함께 ’27.1.1일 시행) . \u003c 규정변경예고 관련 안내사항 > ￭ 예고기간 : 2026.9.30일(수) ~ 2026.11.9일(화), (40일) ￭ 입법예고·규정변경예고된 내용에 대해 의견이 있으시면 다음 사항을 기재한 의견서를 아래의 제출처로 제출해 주시기 바랍니다. - 예고 사항에 대한 찬성 또는 반대 의견 (반대의 경우 이유 명시) - 성명 (기관 26-10-01", "url": "https://www.fsc.go.kr/no010101/87831", "summary": "대형 IB의 모험자본 공급 현황 을 점검하고 리서치보고서 의 독립성‧신뢰성 제고 및 중소형주 커버리지 확대 방안을 마련하였습니다. ※ ‘26.9.30. 제2차 ｢금투업권 모험자본 역량강화 협의체｣ 회의 (주재 : 변제호 자본시장국장) 를 통해 실적점검 및 확대방안 논의 ▪ (일시/장소) ’26.9.30.(수) 10:00 / 금융투자협회 23층 중회의실 ▪ (참석자) 금융위원회 자본시장국장 (주재), 자본시장과장, 금융감독원 자본시장감독국장 - (유관기관) 금융투자협회, 자본시장연구원 - (종투사) 한투, 미래, NH, KB, 하나, 키움, 신한, 삼성, 메리츠 - (중기특화) 한화, 유진, 코리아에셋, 리딩 대형 IB (종투사) 의 ‘26.2분기 모험자본 공급 실적 ㅇ 모험자본 공급의무가 있는 7개社 는 ’26.2분기 총 11.6조원을 공급 하여 ’26.1분기 대비 2조원 추가 공급 (+20.4%) ※ 매분기 2조원씩 증가추세 - 발행어음‧IMA 조달액 대비 모험자본 공급비율은 평균 19.5%로 모두 규제비율 ( ‘26년 10% →’27년 20%→’28년 25%) 상회 ㅇ 모험자본의 양적 확대가 추세적으로 안정화되는 경우 모험자본의 질적 개선 을 위해 위험도에 비례한 실적 인정체계 * 도입을 검토할 계획 * 예 : P-CBO 등 우량 보증채권, 담보대출 대비 위험도가 높은 벤처기업 지분투자 등에 대한 실적인정비율 우대 검토 리서치의 독립성‧신뢰성 강화 및 중소형주 리서치보고서 의무화 ㅇ 증권사 리서치 독립성 및 공시체계 강화 를 통해 매수의견 위주 관행을 개선하여 리서치보고서 신뢰도‧품질 제고 ㅇ 종투사에 대한 스몰캡 (중소형주) 커버리지 최소비율 * 도입 및 모험자본 인센티브 부여 ** 를 통해 스몰캡 커버리지 확대 유도 * 예 : 연간실적 1/4 이상을 ➀ 코스피 시총 300위 미만 (現시총 약 6천억원 미만) 및 ➁ 코스닥 시총 150위 미만 종목 (現시총 약 6천억원 미만) 으로 발간하되, 그 중 1/2 (전체 1/8) 이상을 ➁ 코스닥 시총 150위 미만 종목으로 구성 ** 예 : 전년도 스몰캡 리서치 커버리지 비율이 40% 이상인 IMA·발행어음 종투사 ➔ 당해년도 모험자본 의무비율 산정 시 중소·벤처기업 공급액 5% 가산 【대통령 업무보고 과제】생산적 금융으로의 대전환 Ⅰ. ’ 26.2분기 종투사 모험자본 공급실적 모험자본 공급의무가 있는 7개 종투사 * 의 ’26.2분기 모험자본 공급액 은 총 11.6조원 으로 ’26.1분기 대비 2.0조원 증가 (+20.4%) 한 것으로 나타났다. ** 발행어음‧IMA 조달액 대비 모험자본 공급 비율 은 19.5% 로 ’26.1분기 대비 2.7%p 상승하여 ’26년도 의무비율 ( 10% →’27년 20%→’28년 25%) 을 여유있게 상회 하였으며, 7개 종투사 모두 의무비율을 상회 한 것으로 나타났다. * ’26.9월 단기금융업(발행어음) 인가를 받은 삼성, 메리츠 제외 ** 모험자본 공급의무액 중 A등급채권+중견기업 투자에 대한 30% 한도 적용시 【종투사 모험자본 공급 현황 (잔액 기준) 】 (단위: 억원) 구분 ‘25.4분기말 ‘26.1분기말(①) ‘26.2분기말(②) 증감(②-①) 자산총계 5,563,045.3 6,380,988.9 7,316,275.8 935,286.9 14.7% 모험자본 공급액(A) 111,095.9 134,040.0 159,510.7 25,470.7 19.0% 30% 한도 적용(B) 76,785.0 96,466.9 116,183.7 19,716.8 20.4% 조달액 발행어음 512,743.5 544,276.9 559,291.4 15,014.5 2.8% IMA 12,146.7 28,642.4 36,421.7 7,779.3 27.2% 계(C) 524,890.2 572,919.3 595,713.1 22,793.8 4.0% 모험자본 비율(A/C) 21.2% 23.4% 26.8% 3.4%p - 30% 한도 적용(B/C) ) 는 10월 1일(목) 한국성장금융투자운용 (서울 영등포구 국제금융로8길31) 에서 ‘제2차 모태펀드-국민성장펀드 이어달리기 합동 밋업(Meet-Up)’ 행사를 개최하였다. ​이번 행사는 지난 6월 첫발을 뗀 ‘제1차 * 모태펀드-국민 성장펀드 투자 이어달리기 간담회’에 뒤이어 개최된 것으로, 각 펀드가 자금을 유기적으로 연계하여 공급할 수 있는 취지 로 마련되었다. 창업 초·중기 단계 에서 모태펀드를 통해 발굴․육성된 우수 혁신기업 이 성장․스케일업 단계에서 국민성장펀드의 대규모 자금을 연계 받아 끊김없이 성장 을 이어갈 수 있도록 민관이 원팀으로 뜻을 모은 것이다. * 제1차 이어달리기 밋업행사 개요: (일시) ‘26.6.23, (장소) SVC 서울, (참석) 금융위원장, 중기부 차관, 산업 · 기업은행, 한국벤처투자, 한국성장금융, 한국벤처캐피탈협회, 벤처기업협회 등 이날 행사에는 금융위 손영채 국민성장펀드추진단장, 중기부 김봉덕 벤처 정책관을 비롯해 한국성장금융 장상익 대표, 한국산업은행 신혜숙 부행장, 한국 벤처투자 최철훈 부대표와 한국벤처캐피탈 협회 이준희 부회장, 국민성장펀드 운용사 (간접투자부문) 33개사 및 모태펀드 운용사 8개사, 유망 혁신기업 7개사 가 참석했다 . \u003c 제2차 모태펀드-국민성장펀드 이어달리기 합동 밋업(Meet-Up) 개요 > ◦ 일시 및 장소 : ’26. 10. 1일(목) 13:30, 한국성장금융투자운용 11F ◦ 참석자 - (정부) 금융위 국민성장펀드추진단장, 중기부 벤처정책관 - (기업) ㈜디노티시아, ㈜파일러, ㈜로엔서지컬, 엔라이튼(주), 텔레픽스(주), 주식회사 토룩, (주) 투모로 로보틱스 - (운용사) 국민성장펀드 및 모태펀드 자펀드 운용사 - (유관기관·협단체) 산업은행, 한국벤처투자, 한국성장금융, 한국벤처캐피탈협회 ◦ 주요내용 : (1부) 합동간담회 → (2부) 1:1 프라이빗 밋업 2. 밋업 행사 주요 내용 ​ 이번 2차 밋업(Meet-Up) 은 지난 1차 밋업 행사에 비해 참여기업 발굴 채널을 다양화했다. 중기부가 모태펀드를 통해 육성한 우수 기술기업 5개사 와 금융위 원회의 '성장기업발굴협의체 '에 각 부처․민간에서 제안한 유망기업 2개 기업 이 참석하여 기업 현황과 투자 유치 계획 등을 발표했다. \u003c제2차 밋업(Meet-Up) 참석기업 개요> 기술분야 기업명 개요 AI 로봇 ㈜디노티시아 • 벡터 DB 활용한 LLM 가속솔루션 개발 ㈜파일러 • 영상이해 인공지능 개발 주식회사 토룩 • 서비스로봇 개발, 제조, 판매 투모로 로보틱스 • Full-Stack Physical AI 플랫폼 개발 바이오 ㈜로엔서지컬 • 의료용 수술로봇 개발 방산 텔레픽스 • 저궤도 인공위성 개발 기후테크 엔라이튼(주) • 태양광 발전사업 등 에너지 기후테크 개발 한편, VC, PE 등의 투자기관 측 에서는 총 41개사 (국민성장펀드 간접투자부문 운용사 33 개사, 모태펀드 운용사 8개사)가 참석했다. 국민성장펀드 운용사 입장에서는 모태펀드가 초기에 육성한 유망기업을 소개 받을 수 있으며 , 공동투자자 를 구하거나 투자자간 네트워크를 형성 할 수 있는 좋은 기회이고, 모태펀드 운용사 입장에서도 성장단계로 진입한 포트폴리오 기업에 대형 자금을 유치 하고, 투자자금을 회수·재투자할 수 있는 기회를 모색하는 자리가 될 것으로 기대된다. ​ 오늘 간담회에 참석한 7개 기업의 대표 들은 각 사의 핵심 기술력에 대해 투자기관들에 설명하고, 향후 스케일업을 위한 대규모 자금 조달 계 획을 제시했다. 특히, ​AI 분야 참석기업인 ㈜디노티시아 정무경 대표 는 \"LLM에 대한 기술력 을 바탕으로 초고속 성장을 도모 하는 현시점에서, 국민성장 펀드의 대규모 자금 연계 는 기술 상용화와 글로벌 시장 진출을 가속화 할 결정적 모멘텀 이 될 것\"이라며, \"이번 밋업에서 후속자금을 유치할 수 있다면 글로벌 AI 시장을 선도하는 빅테크 기업으로 도약 할 수 있을 것\"이라는 포부를 밝혔다. 아울러, 참석기업들은 많은 벤처기업이 성장초기 단계를 넘어서기 위해서는 대규모 스케일업 자금이 필요하다는 점을 강조했다. 기업이 초기단계를 넘어 더욱 성장하기 위해서는 글로벌 시장 진출, 설비투자 확장 등 스케일업 단계를 반드시 거쳐야 하는데, 이러한 결정적 시기에 국민성장펀드 등 대규모 후속 자금이 적기에 기업으로 연계 될 수 있는 선순환 금융 생태계 조성이 무엇보다 중요 하다고 입을 모았다. 한국투자파트너스 의 대표 펀드매니저인 박민식 전무 도 “이번 밋업을 통해 정책금융 상시 지원체계가 구축 된 것은 투자사나 기업 모두에게 큰 도움 이 될 것”이라며, “한국투자파트너스도 국민성장펀드 (중형 리그) 를 통해 혁신기업의 신속한 스케일업과 글로벌 시장 진출을 돕는 핵심 창구 역할을 다할 것”이라고 말했다. 합동간담회 이후에는 기업과 투자기관이 개별적으로 대화하는 1:1 프라이빗 밋업 세션 도 진행되었다. 국민성장펀드의 운용사로 선정된 핵심 운용인력이 직접 대화에 참석 하여, 기업들로부터 자금수요와 사업계획을 청취하였다. 이번 밋업행사가 단순한 기업 쇼케이스, 또는 IR 행사에 그치지 않고, 실질적인 투자유치로 이어질 수 있도록 실무소통의 장 을 마련한 것이다. ​금융위 손영채 국민성장펀드추진단장 은 “지난 6월 1차 행사를 통해 모험 자본 연계의 가능성을 확인했다면, 이번 2차 밋업 은 자금공급의 연속성을 확보하기 위한 지속가능한 지원체계를 다지는 자리 ”라며, “향후 본 행사의 정례화 를 추진하는 한편, 현장 수요에 따라 AI, 바이오, 지역 혁신기업 등 회차별 테마형 밋업(Meet-Up)을 연계 하는 방안 등도 함께 검토하여 첨단전략산업 분야의 기업들이 연속성 있는 성장자금 을 받아 빅테크 기업으로 도약 할 수 있는 환경을 만들어 나가겠다”고 밝혔다. ​ 중기부 김봉덕 벤처정책관 은 “ 모태펀드의 마중물 투자를 통해 성장 기반을 다진 AI·딥테크 혁신 스타트업 들이 글로벌 유니콘으로 도약 할 수 있도록, 정책펀드간 이어달리기 를 위한 연결고리 를 더욱 견고하게 안착시켜야 할 시점”이라며, “앞으로도 탁월한 선구안을 가진 민간 벤처캐피탈과 함께 각 분야의 유망기업들을 적극 발굴 하고 정례적으로 공유 하여, 벤처·스타트업 투자와 육성의 플랫폼 역할을 한층 강화해 나가겠다”고 밝혔다. ​ 금융위원회와 중소벤처기업부는 앞으로도 정책펀드 간 소통을 통해 부처 간 칸막이를 제거 하고, 혁신의 결실이 자금 부족으로 멈춰 서는 일이 없도록 함께 지혜를 모으도록 노력 할 것이다.", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "토큰증권 관련 전자증권법·자본시장법 하위법규 개정안 입법예고 실시 ※예고기간 ‘26.10.2일 ~ 11.11일 ", "department": "자본시장과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87838", "summary": "토큰증권 관련 전자증권법·자본시장법 하위법규 개정안 입법예고 실시 ※ 예고기간 ‘26.10.2일 ~ 11.11일 ✓ 토큰증권 제도 시행을 위한 전자증권법·자본시장법 개정안이 ʼ 27.2.4일 시행 예정으로 하위법규 위임사항에 대한 개정안 입법예고 - ( 전자증권법 하위법규 ) 토큰증권 발행이 허용되는 증권의 범위 , 분산원장의 요건 , 발행인계좌관리기관 등록요건 등 - ( 자본시장법 하위법규 ) 장외거래소 인가단위 신설 및 거래한도 등 ※ 민·관 합동 토큰증권 협의체에서 발표한 ｢토큰증권 정책방향｣ 반영 【관련 국정과제】 48. 디지털자산 생태계 구축 [ 추진 배경] ‘26.10.2일 금융위원회는 토큰증권 에 대한 ｢ 자본시장법｣ 및 ｢전자증권법｣ 개정안 시행 (’26.2.4일 예정)에 따라 ｢ 자본시장법 시행령 ｣, ｢ 전자증권법 시행령 ｣ , ｢ 금투업규정 ｣, ｢ 증권의 발행 및 공시 등에 관한 규정 ｣ 및 ｢ 전자등록업규정 ｣ 개정안의 입법예고 (‘26.10.2일 ~ 11.11일)를 실시했다. 동 개정안은 지난 민·관 합동 토큰증권 협의체 3차회의 (ʼ26.9.4일) 에서 발표한 ’ 토큰증권 정책방향 ‘ 중 하위법규 개정사항을 담고 있다. ｢전자증권법｣ 하위법규 에서는 전자증권법에서 위임한 토큰증권 발행이 허용되는 증권의 범위 , 분산원장의 요건 , 발행인계좌관리기관 등록요건 등을 규정하고 있으며, ｢ 자본시장법｣ 하위법규 에서는 토큰증권의 유통을 위한 장외거래소 체계, 일반투자자 거래한도 등을 포함하고 있다. [ 입법예고안의 주요 내용 ] ① 전자증권법 하위법규 개정안 주요내용 토큰증권화가 가능한 증권 의 범위는 조각투자증권(비금전신탁수익증권, 투자계약증권) 외 주식, 채권, 펀드 등 기존 정형증권 이 포함 한다. 아울러 분산원장 요건 으로는 분산원장 정보기재의 신뢰도 제고, 유사시 업무계속성 등을 위해 전자등록기관 외 2개 이상의 계좌관리기관 (발행인계좌 관리기관 포함) 으로 분산원장 참여자 가 구성 되어야 하며, 분산원장이 공적장부 로 도입되는점, 권리확정 지연 등의 방지 필요성 등을 감안하여 전자등록을 위한 분산원장 이용에는 직접적인 대가 지급을 금지 하는 요건등을 규정하였다. 한편, 금융회사등 기존 계좌관리기관 외에도 증권 발행인이 직접 계좌를 관리하는 계좌관리기관 이 될 수 있도록 허용하는 제도인 발행인 계좌관리기관 의 등록요건으로 최저자기자본 40억원 , 계좌관리 전문인력 1명, 내부통제 전문인력 1명, 전산 전문인력 2명 등을 갖추도록 하였다. ② 자본시장법 하위법규 개정안 주요내용 현재는 일반투자자 간 채권의 매수·매도 수요가 크지 않으나, 토큰화 를 통한 채권 유통시장의 변화 를 예상 하는 시각을 반영하여, 비상장주식, 비금전 신탁수익증권에 더해 채무증권 에 대해서도 장외거래소 인가단위(2o-11-1) 를 추가 신설 한다. 투자자 보호를 위해 법률에서 시행령에 위임한 장외거래소 일반투자자 투자한도 는 “ 장외거래소별 연간 순매수 금액 (총매수금액-총매도금액)”을 기준으로 1억원 한도 를 설정한다. [향후계획] 입법예고 기간 중에 충분히 의견을 수렴할 예정 이다. 지난 토큰증권 협의체 (ʼ26.9.4일) 에서 발표한 ｢ 토큰증권 정책발향｣에 대해 업계 등에서 제기되는 의견 * 들도 공식 입법절차 과정에서 충분히 논의할 예정이다. * 예시) 1) 일반투자자 장외주식거래소 거래한도(연간 순매수 1억원)를 높여야 한다는 의견 2) 발행인계좌관리기관 최저자기자본 기준(40억원)을 낮추어야 한다는 의견 3) 분산원장 요건을 완화해야 한다는 의견 등 한편, ｢ 자본시장법 시행령 ｣, ｢ 전자증권법 시행령 ｣, ｢ 금투업규정 ｣, ｢ 증권의 발행 및 공시 등에 관한 규정 ｣ 및 ｢ 전자등록업규정 ｣ 개정안은 ’26.10.2일 ~ 11.11일 예고기간 을 거쳐 금융위원회 의결, 법제처 심사, 차관회의·국무회의 의결 등의 절차를 거쳐 법률 시행일인 ʼ27.2.4일부터 시행될 예정이다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "’26년 상반기 가상자산사업자 실태조사 결과", "department": "가상자산검사과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87835", "summary": "’26년 상반기 가상자산사업자 실태조사 결과 1 실태조사 개요 □ 금융정보분석원 (원장 이형주) 과 금융감독원은 국내 가상자산 시장 현황 파악 을 위해 가상자산사업자 26개사 (’26년 6월말 기준) 에 대한 ’26년 상반기 실태조사를 실시 하였습니다. \u003c 가상자산사업자 실태조사 개요 > 조사대상 : 26개 가상자산사업자 * (17개 거래소, 9개 지갑·보관업자) 조사방법 : 사업자가 작성ㆍ제출한 값을 기초로 집계 대상기간 및 기준시점 : ’26.1.1.~’26.6.30. / ’26.6.30. * ’26.6월말 기준, 총 28개 신고 사업자 중 자료 미제출 2개사 제외 □ 금번 실태조 outine"}, {"source": "KRX_OPEN2", "title": "「2026 건전증시포럼」 개최", "department": "", "date": "2026-10-01", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015786", "summary": "첨부 참조", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "법인 대표이사의 시세조종행위 등 불공정거래 행위에 대한 적발·조치(3건)     - 제17차 증권선물위원회(9.30.) 의결", "department": "자본시장조사총괄과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87840", "summary": "법인 대표이사의 시세조종행위 등 불공정거래 행위에 대한 적발·조치 (3건) - 제17차 증권선물위원회(9.30.) 의결 - [ 조치개요 ] 증권선물위원회 는 제17차 정례회의( ’ 26.9.30.)에서, (1) 상장회사 주식 및 경영권 양수자와 주식 일부의 양수 계약 체결을 교섭 중인자 및 정보수령자인 그 지인들을「자본시장과 금융투자업에 관한 법률」상 금지된 미공개중요 정보 이용행위 (제174조) 를 한 혐의로 검찰 에 통보 하였습니다. 또한, (2) 대체 거래소(NXT)의 얇은 호가 상황을 활용한 시세조종 주문을 통해 주가를 상승 시키고 부당이득을 취한 개인투자자, (3)장기간 시세조종 주문을 통해 주가를 부양한 부동산 개발회사 최대주주 겸 대표이사에 대해 「자본시장과 금융 투자업에 관한 법률」 상 시세조종행위 (제176조) 금지 위반 혐의 로 고발 조치 하였 습니다. ※ 세 건은 별개의 사건으로, 각각에 대해 개별적인 조치가 이루어진 것임 ◈ 자본시장법에서 금지하는 미공개중요정보 이용행위 는 내부자 가 상장법인 의 업무 등 과 관련 된 미공개중요정보 를 특정증권 등의 매매, 그 밖의 거래에 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §174) 를 말합니다. ◈ 자본시장법에서 금지하는 시세조종 행위 는 상장증권 또는 장내파생상품의 시장가격을 인위적으로 변동시키거나 오인하게 하는 행위로서, ➊ 매매가 성황을 이루고 있는 듯 이 잘못 알게 하거나, 그 밖에 타인에게 그릇된 판단 을 하게 할 목적 , ➋ 매매를 유인 할 목적, ➌ 시세를 고정 시키거나 안정 시킬 목적으로 매매하는 행위 (자본시장법 §176) 등을 말합니다. [ (1) 상장회사 A 주식의 대량취득자로부터 A사 주식 일부의 양수 계약 체결을 교섭 중인 투자자 등의 미공개중요정보 이용 행위 ] 상장회사 A 의 주식 및 경영권을 양수 하기로 한 대량취득자 B로부터, B가 취득하기로 한 A의 주식 중 일부 를 양수 하는 계약을 교섭 중 인 C법인의 대표이사 D (준내부자) 는 그 과정에서 취득한 A사에 대한 양수도계약 체결 정보 를 지인인 E 및 F (1차 정보수령자) 에게 전달하여 A사 주식 매매에 이용 하게 함으로써 수억원 상당의 부당이득 (준내부자 및 1차 정보수령자) 을 취득한 혐의가 있습니다. [ (2) 대체거래소(NXT)의 얇은 호가를 이용한 시세조종행위] G 는 전업투자자 로서 H사 주식 의 주가상승 을 통한 매매차익 을 취득하는 한편 대출 담보로 제공한 주식의 반대매매를 방지하기 위하여 가족 및 지인 등의 계좌들을 이용하여 다수의 시세조종 주문 을 제출함으로써 주가 를 상승 시키고 수 억원 상당의 부당이득 을 취한 혐의가 있습니다. 특히, G 는 한국거래소(이하 ‘KRX’) 와 대체거래소(이하 ‘NXT’) 양 시장에 번갈아 시세조종 주문을 제출하면서 그 중 호가창이 얇아 * 적은 매수주문으로도 가격 을 쉽게 변동 시킬 수 있는 NXT 시장 에 특정 시세조종 주문을 집중 제출 하 고, 유동성 이 상대적으로 낮은 NXT 시장 의 시세 를 상승 시키면 통합시세창 에 표시되는 현재가 역시 상승 한다는 점을 이용한 것으로 확인되었습니다. * 매도1호가와 매수1호가 간의 차이가 크거나, 매도호가 간 호가 공백이 크고 매도 잔량도 적은 시장 [ (3) I 社의 최대주주 겸 대표이사 J의 시세조종행위 ] I 社의 최대주주 겸 대표이사 J 는 본인, I, 배우자, 동생 등 4인 명의 11개 계좌를 이용하여 거래량이 적어 소액 으로도 시세 를 용이하게 변경 할 수 있는 甲 종목 을 대상으로 2년 5개월 간 수천회의 고가매수 , 종가관여, 가장· 통정 등 복합적 시세조종 주문 을 제출하여 주가를 끌어올림으로써 수백억원 상당의 부당이득 을 편취한 혐의가 있습니다. 한편, I 社 , J 는 시세조종 과정에서 5% 이상 지분 을 취득하여 대량보유 보고의 무 가 발생 하였음에도 이를 이행하지 않았습니다. [ 유의사항 ] 상장사 주식 및 경영권 양수 에 직접 참여하는 자 외에도 그 자와 계약을 체결 하고 있거나 체결을 교섭하고 있는 자 (그 자가 법인인 경우에는 임직원 포함) 도 양수도 계약 관련 정보 등 미공개중요정보를 이용하거나, 타인에게 이용하게 하는 경우 자본시장법 위반으로 1년 이상의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 또한, 상장증권 등과 관련하여 매매가 성황을 이루고 있는 듯이 잘못 알게 하거나, 타인에게 그릇된 판단을 하게 할 목적으로, 또는 매매를 유인할 목적으로 가장·통정 ·허위 매매 등을 할 경우 자본시장법 위반으로 1년 이상 의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 특히, 시세조종 행위자 는 거래량이 적은 종목 을 시세조종 하려는 경우가 많으므로 거래량이 적은 종목이 뚜렷한 이유 없이 주가상승 이 계속되는 경우 시세 조종 행위가 개입 하였을 가능성 이 있어 주의가 필요합니다. 또한 주가 급등락 없이 장기간 주가 를 완만히 상승 시키는 경우에도 시세조종 으로 적 발됨을 유의할 필요가 있습니다. 앞으로도 금융위원회와 금융감독원은 미공개정보 를 이용 한 자본시장 불공정거래 행위와 시세조종 행위 에 대해 엄정 하게 대응 해 나갈 예정이니, 관련 법규 준수 와 내부통제 강화 를 통해 불공정거래 행위가 발생하지 않도록 만전을 기해 주시길 당부드립니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 ‣ 인터넷 : 금융위원회 홈페이지 [참여마당 → 신고마당 → 불공정거래신고] 메뉴 ☞ 금융감독원 불법금융신고센터 ‣ 인터넷 : 금융감독원 홈페이지 [민원·신고 → 불법금융신고센터 → 증권불공정거래신고] 메뉴 ‣ 전 화 : 1332 ☞ 한국거래소 불공정거래신고센터 ‣ 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) ‣ 전 화 : 1577-0088 ※ 수 사에 미치는 영향 등을 고 려하여 조 치대상자 및 종목명은 공표하지 않습니다. 본 조치 사안과 관련한 문의는, 금융감독원 조사국으로 해주시길 바랍니다.", "essential": false, "importanceReasons": ["market-data feed (+2)"], "market": true, "tier": "relevant"}, {"source": "MOFE", "title": "재정경제부 유관기관 간담회 개최", "department": "기획재정담당관", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079507&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "MOFE" 상(500만원), 동뮹이상(300만원) 각 1명으로, 금융위원장 표창·포상금과 함께 메달이 수여 된다. 이번 수상자들은 ▲ 경제 위기 취약계층 보호 , ▲ 청년 자산형성 지원 , ▲ 금융권 AI 규제 혁신 등 정책 수요자들이 필요로 하는 지점 을 짚어내어 정책을 구현한 공로를 인정받았다. ※ 금뮹이상·은뮹이상·동뮹이상은 금융위원회 마스코트 ‘뮹이’의 이름을 활용 2. 포상자 주요 공적사항 정재윤 사무관 : 경제적 위기자 자살예방대책 마련 금뮹이상 수상자인 복합지원팀 정재윤 사무관은 경제적 문제가 원인인 자살 (“Econocide”)의 심각성이 증가 하는 상황에서, 경제적 위기로 인한 자살은 사회적 타살이라는 인식하에 범부처·민관합동으로 ‘경제적 위기자 자살예방대책’을 마련 하였다. 종합채무상담 대표번호(☎1375) 신설 (’10월 중) , 경제적 위기자 발굴을 위한 기관간 협업 강화 , 서민·취약계층 대상 특화 금융 상품 제공 , 금융회사 사회공헌사업 홍보플랫폼 마련 등 국민 누구도 경 제적 시름 으로 삶을 포기하지 않는 ‘목숨 살리는 대한민국’을 실현 하기 위한 대책을 마련 하여 국무회의(’26.7.14.)에 보고하였다 김희진 사무관 : 청년미래적금 성공적 출시 은뮹이상 수상자인 청년정책과 김희진 사무관은 자산을 형성하는데 어려움을 겪고 있는 청년들의 첫 자산형성을 국가와 금융이 함께 돕는 ‘청년미래적금’을 설계하여 성공적으로 출시 하였다.(’26.6.29.) 가입대상, 납입구조, 정부기여금 지급방식, 소득 확인 등 세부 제도설계 와 금융회사·서민금융진흥원·국방부 등 관계기관과의 협의 를 주도적으로 추진하였으며, 138.5만명의 청년이 최종적으로 청년미래적금에 가입 하는 성과를 달성하였다. 특히, 훈련소 내 휴대전화 사용 제한으로 가입이 어려운 군장병의 애로를 선제적으로 발굴 하여 국방부와 협의를 통해 가입지원방안을 마련 하는 등 정책 사각지대를 해소 하였다. 김영준 사무관 : 망분리 규제 완화 추진 동뮹이상 수상자인 금융안전과 김영준 사무관은 프런티어 AI로 인한 신종 보안위협 이 대두된 상황에서, 금융회사가 스스로 효과적으로 대응 할 수 있도록 금융권 망분리 규제 완화 를 추진하였다. “ AI공격은 AI로 방어한다 ”는 정책 방향을 설정하고, 경미한 전산장애 관련 임직원 면책추진 , 금융AI보안연구소· 지원센터 설립, 금융 AI 보안 가이드라인 등 다각적인 보안대책 을 병행하였 다. 금융회사의 적극적인 보안강화 조치를 유도하고, 침해사고로 인한 국민 피해를 최소화할 수 있도록 금융권의 보안역량 강화를 위한 기틀을 마련 하였다. 3. 향후 계획 이억원 금융위원장은 “ 특별한 성과 는 국민들이 정말 필요로 하는 정책이 무엇인지 아는 것에서부터 시작된다 ”라며 “앞으로도 현장의 목소리를 놓치지 않고 이를 정책으로 구현해내는 직원 들을 발굴하여 파격적으로 보상하겠다 ” 라고 밝혔다. 금융위원회는 홈페이지를 통해 ’26.10.12일(월)부터 ｢금융위人상」후보에 대한 대국민 추천을 접수하고, 12월 중 제4회 시상식을 개최할 계획이다. 【붙임】포상자 주요 공적사항 세부내용", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "시장상황점검회의 개최", "department": "자금시장정책과", "date": "2026.10.02.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079531&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "relevant"}, {"source": "KOSCOM", "title": "[코스콤정보] FnGuide 국 검사국장 등 [금보원] 사이버대응본부장, 침해대응부장 [금융회사] 은행 6개사, 카드 3개사 [협회] 은행연합회, 여신금융협회 · 논의사항 : 최근 금융권 침해시도 동향 및 대응방향 [ 주요 논의사항 ] 지난 9월 30일 발생한 신한은행 정보유출 사고 에 이어 국민은행 등 주요 금융회사에 대한 사이버공격 으로 추가 피해 가 발생함에 따라, 다른 금 융회 사들에 대한 유사사고 발생 가능성 에 대한 우려 가 제기되고 있다. 특히, 금번 사이버 공격 의 원인, 수 법 등을 면밀 하게 분석 하여 신속 하고 철저한 대응태세 를 갖출 필요가 있다. 금융위·금감원·금보원 은 최근 발생한 침해사고와 관련 하여 신고접수 즉시 현장조사 에 착수하여 대응 하는 한편, 추가 피해를 방지하기 위해 공격자 IP, 공격 유형 등 위협정보 를 관계기관 (KISA 등) 에 신속히 공유 하는 등 필요한 조 치를 취하고 있다. 아울러, 침해사고가 발생한 금융회사 가 소비자 보호, 피해보상 등을 차질 없이 이행 하도록 면밀히 관리·감독 해 나갈 방침이다. 신진창 사무처장 은 침해사고 예방 및 사고 발생 시 소비자 피해 최소화 등을 위해 금융권 에 다음 사항 을 주문 하였다. ① 외부에 노출된 전산시스템 전반에 대한 보안점검 실시 금융회사는 외부에 노출된 IT자산 과 서비스 를 빠짐없이 파악 하고, 보안 취약점 및 접근통제 현황 을 철저히 점검 하여야 한다. 특히, 대고객 서비스 여부, 서비스 종류 등에 관계없이 외부 에서 접근 할 수 있는 시스템 전반 을 점검 하여 보 안 사각지대가 발생하지 않아야 한다. ② 불필요한 정보노출 및 인증·접근통제 강화 불필요하게 외부 에 노출 되는 정보 를 최소화 하고, 인증 없이 내부정보 에 접근 할 수 있는 경로 가 있는지 철저히 점검 하여야 한다. 특히, 개인정보 등 내부정보를 조회 하는 과정에서 인증 절차 가 누락 되거나 미흡 하게 적용되 지 않도록 철저히 점검 하여야 한다. ③ 위협정보의 신속한 공유 및 금융권 공동대응 공격에 사용된 IP주소, 공격수법 및 침해시도 내역 등 위협정보 를 관계 기관과 금융회사 간 신속히 공유 하여야 한다. 개별 금융회사에 대한 침해 시도가 다른 금융회사 에서도 유사 하게 발생 할 수 있는 만큼, 금융권이 긴밀 히 협력 하여 공동대응 하여야 한다. 이를 위해, 보안취약점 체크리스트 제공 등을 통해 금융회사가 자체 보안 점검 을 철저히 실시 하도록 하고, 점검결과 를 조속한 시일 내에 제출·보고토록 할 예정이다 신진창 사무처장 은 “정보유출 등 사고가 발생하지 않도록 철저한 대비 태세 를 갖추는 것이 무엇보다 중요 하다”고 강조하면서, “불가피하게 사고가 발생한 이후에는 신속한 대응을 통해 소비자 피해가 최소화될 수 있도록 만 반의 준비 를 갖춰야 한다”고 언급하였다. 아울러, “금융권에 대한 침해 시도 를 면밀히 모니터링 하고, 위협정보를 신속히 공유 하는 등 긴밀히 협력해 나가는 한편, 침해사고의 원인 과 공격 수법 을 철저히 분석 하여 필요한 제도 개선 방안 을 신속히 마련 해나가겠다.”고 밝혔다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "최근 발생하는 금융권 침해위협에 면밀히 대응해 나가겠습니다", "department": "IT검사국", "date": "2026-10-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=234804&menuNo=200218&pageIndex=1", "summary": "ㅁ ’26.10.2.(금) 금융위원회는 신진창 사무처장 주재로 금융감독원, 금융보안원, 주요 시중은행, 카드사 및 은행연합회, 여신금융협회 등과 함께 금융권 「긴급 상황대응 회의」를 개최하였다.\nㅇ 금번 회의는 최근 금융회사들의 정보유출 사건과 공격유형,수법 등을 공유하고, 국내 금융권의 보안현황 대응방향을 논의 개최되었다. · 일시/장소 : ’26.10.4.(일) 14:00 / 정부서울청사 · 참석 : [금융위] 이억원 위원장 (주재) , 사무처장, 디지털금융정책관 등 [금감원] 이찬진 금융감독원장, 디지털·IT부원장보 등 [금보원] 박상원 금융보안원장, 사이버대응본부장 [관계부처·기관] 과기부, 개보위, 경찰청 담당 국장 / 한국인터넷진흥원(KISA) [협회·중앙회] 금융업권별 * 협회장 * 은행연, 금투협, 생보협, 손보협, 여전협, 저축은행중앙회 신협·농협·수협·새마을금고 중앙회, 핀산협, DAXA [금융회사] 주요 금융회사 7개사 · 논의사항 : 최근 금융권 침해시도 동향 및 대응방향 [ 주요 논의사항 ] 금융위·금감원·금보원 은 지난 9월 30일 신한은행 의 침해사고 접수 직후부터 당일 신속히 현장조사 에 착수하여 사고원인 과 피해범위 등을 면밀히 파악 하고 있으며, 이후 접수된 금융회사 들의 침해신고 에 대해서도 신속하게 사고 조사 를 실시 하는 등 긴밀히 대응하고 있다. 아울러, 지난 10월 2일 금융위 사무처장 주재 로 「긴급 상황대응 회의」 를 개최하여 최근 침해사고 동향 과 대응방향 을 점검하고, 확인된 공격정보 를 全 금융권 에 신속히 전파 하는 한편, 유사한 침해사고 의 재발 및 추가 피해 확 산 을 방지하기 위해 全금융권에 보안점검 체크리스트 를 배포 하여 신속한 자 체점검 과 점검결과 보고 를 요청 하는 등 총력 대응 중 인 상황이다. 이억원 위원장 은 최근 침해위협이 금융권 전반 으로 확산된 만큼, 불필요한 불안감 을 사전 에 차단 하는 한편 소비자 보호 를 위해 금융권 전체 가 공동 대응 한다는 인식 하에 다음 사항 을 철저히 이행 해 줄 것을 당부하였다. ① 全금융권의 신속하고 철저한 보안점검 全금융권은 소비자 들이 안심 하고 금융서비스 를 이용 할 수 있도록 외부 접점 과 침해활동 탐지체계 등에 대한 철저한 점검 을 통해 침해사고 예방에 만전 을 기해야 한다. 지난 10월 2일 긴급 상황대응 회의 를 통해 주문 한 바와 같이, 외부에 노출된 IT자산 과 서비스를 빠짐없이 파악 하고 보안취약점, 인증·접근통제 및 침해활동 탐지체계 등을 전면 재점검 하여야 한다. 은행·카드사 뿐만 아니라 상호금융, 저축은행, 보험, 증권, 핀테크 등 중소형 금융회사 를 포함한 全금융권 은 자체점검 을 신속히 마무리 하고 그 결과를 금융위·금감원에 보고해야 한다. 특히, 공격 IP·공격수법·침해시도 내역 및 사고사례 등 이미 전파된 위협정보 에 대해 각 금융회사의 탐지·차단체계 등 에 제대로 반영 하고 신속하게 보안패치 를 하였는지 다시 한번 확인 할 필요가 있다. 정 부는 이미 공유된 공격정보 와 사고사례 가 있음에도 필요한 점검과 대 응 을 소홀히 하여 유사한 침해사고 가 발생하는 경우에는 관련 법령에 따라 엄정 하게 대응 해 나갈 예정이다. ② 외부점접 등 잠재적 위험요인 최소화 금융회사는 대고객 서비스 여부와 관련 없이 임직원 등 이 업무상 접근하는 외부접점 과 시스템 접근경로 를 빠짐없이 식별·점검 하여 잠재적인 위험요인 을 최소화 하여야 한다. 소비자 서비스 제공·업무수행 에 필수불가결 한 경우를 제외한 외부접근 은 원칙적 으로 모두 차단 하고, 업무상 외부접근이 불가피한 경우에도 접근권 한 과 조회 가능한 정보 를 필요 최소한 으로 제한하여야 한다. 아울러, 최근 침해사고의 원인 이 된 대출모집인·위탁업체 등 외부인력과 임직원 이 사용하는 시스템에서 개인신용정보가 불필요 하게 보관·조회되지 않도록 하고, 인증 절차 가 누락 되거나 우회 될 수 있는 경로가 없는지 철저히 점검 하여야 한다. ③ 신속하고 실효성 있는 소비자 보호 및 피해보상 침해사고가 발생한 금융회사는 유출정보의 범위 와 소비자 피해 가능성 을 신속 하고 정확 하게 파악하고, 추가적인 정보유출 이나 금전피해 가 발생하지 않도록 필요한 보호조치 를 즉시 시행하여야 한다. 소비자 피해 가 확인된 경우에는 소비자에게 상세 한 정보 를 통지 하고 피 해구제·보상 등이 신속하고 차질 없이 이루어질 수 있도록 최선을 다할 필요 가 있다. 아울러, 16일 (금) 까지 (토·일·공휴일 제외) 운영한다. (가입신청 운영시간 9:00~18:30) 청년미래적금 은 매월 최대 50만원 한도 내에서 자유롭게 납입할 수 있는 3년 만기 자유적립식 상품 으로, 납입액에 정부 가 6% 또는 12% 의 기여금 을 매칭 지원 하고, 이자 소득세 가 면제 된다. 금리 , 정부 기여금 , 이자소득 비과세 혜택 을 함께 고려한 청년미래적금 실질 가입효과 는 일반형 기준 최대 13.2~14.4% * , 우대형 18.2~19.4% ** 수준 단리 적금상품 에 가입 하는 것과 유사한 수준이다. * (금리 7% 가정시) 일반형 2,110만원 : 원금 1,800만원 + 기여금 108만원 + 이자 202만원→ 금리 13.2% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 366만원 - 이자소득세 56만원) 우대형 2,227만원 : 원금 1,800만원 + 기여금 216만원 + 이자 211만원 → 금리 18.2% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 505만원 - 이자소득세 78만원) ** (금리 8% 가정시) 일반형 2,138만원 : 원금 1,800만원 + 기여금 108만원 + 이자 230만원 → 금리 14.4% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 400만원 - 이자소득세 62만원) 우대형 2,255만원 : 원금 1,800만원 + 기여금 216만원 + 이자 239만원 → 금리 19.4% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 538만원 - 이자소득세 83만원) 가입신청 기간 중 10월 7일 과 8일 에는 원활한 신청을 위해 출생연도 끝자리 에 따른 홀·짝제 를 운영하고, 이후 10월 12일부터 16일까지 는 출생연도와 관계없이 누구나 신청 이 가능 하다. 가입을 희망하는 청년들은 취급기관 * 앱 을 통해 별도의 서류제출 없이 비대면 으로 가입신청 이 가능하다. 가입신청 후 가입심사 를 거쳐 11월 12~13일 심사 결과 를 안내 하고, 11월 16~27일 동안 계좌개설 및 납입 개시 가 가능 하다. * 농협, 신한, 우리, 하나, 기업, 국민, 수협, iM, 부산, 광주, 전북, 경남, 카카오, 우정사업본부 (토스뱅크는 3차 모집부터 참여) \u003c 청년미래적금 2차 가입·심사 일정 (안) > 가입 신청 신청자 10.7(수) 10.8(목) 10.12(월)~10.16(금) 출생연도 끝자리 홀수 출생연도 끝자리 짝수 전체 가입신청 심사 일정 10.19(월)~11.13(금) 계좌 개설 신청자 11.16일(월) ~ 11.27일(금) 소득심사 및 우대형 자격심사 계좌 개설 및 납입 개시 청년도약계좌 - 청년미래적금 갈아타기 ※ 내부 심사일정은 신청 인원 및 심사진행 상황 등에 따라 일부 변동될 수 있음 가입대상 은 소득·매출액 (소상공인) 요건 * 등을 충족 한 만 19~34세 청년 이다. 이번 가입기간 에는 1991년 11월 17일생 ** 부터 2007년 11월 27일생 * 까지 가 가입대상 이며, 병역 이행한 경우 최대 6년 의 병역 이행 기간 을 연령 계산 에서 제외 *** 한다. * ➀ 총급여 (근로소득-비과세소득) 7,500만원 (종합소득 6,300만원) 소득자 또는 연매출 3억원 이하 소상공인 & ➁ 가구중위소득 200% 이하 (➀+➁ 동시충족) ** 조세특례제한법령에 따라 가입일 (계좌개설기간, ‘26.11.16~27일) 에 만 19 ~ 34세인 청년 *** 예) 현재 35세인 자가 병역을 2년간 이행했을 경우, 2년을 차감한 33세로 간주하여 심사 ※ 가입 신청자는 가입을 원하는 취급기관 앱에서 ➀ 일반소득자, ➁ 중소기업 재직자, ➂ 소상공인 중 본인에게 해당하는 유형을 선택 하여 가입 신청 진행 직전연도 (‘25년) * 소득 확인 이 가능해야하며, 일정 요건을 충족하는 중소기업 재직자 , 중소기업 신규 취업자 와 소상공인 은 우대형 (기여금 매칭률 12%) 으로 가입 할 수 있다. 소상공인 자격 (매출액 심사) 으로 가입 을 희망 하는 경우에는 ‘가입신청 전’ 소상공인 확인서 를 발급 ** 받아야 한다. * 정확한 소득 확인을 위해 가장 최신 (‘25년) 국세청 확정 소득을 활용하여 심사 ** 중소기업현황정보시스템(sminfo.mss.go.kr) 접속 → 회원가입 및 로그인 → 자료제출 (홈페이지 매뉴얼 참고) → 중소기업(소상공인)확인서 신청서 작성 및 제출 → (승인 후) 확인서 발급 확인 ※ 소상공인확인서 발급문의 : 중소기업통합콜센터 국번 없이 1357 이번 2차 모집에서는 기존 청년도약계좌 가입자 가 청년미래적금 으로 갈아탈 수 있는 기회 를 추가 로 제공 한다. 갈아타기를 희망하는 경우 우선 이번 2차 가입신청 기간 에 가입신청 을 진행 후 가입 가능 안내를 받아야 한다. 심사 통과자는 먼저 청년미래적금 계좌 를 개설 한 다음, ‘청년미래적금 가입 목적 의 청년도약계좌 특별중도해지’ 를 계좌 개설기간에 신청 하면 된다. 한편, 가입대상 확대 및 우대형 지급비율 상향 * 등을 내용으로 하는 ‘27년 청년미래적금 정부 예산안 등이 국회 심의 를 통해 확정될 경우 기존 가입자 에게도 변경된 혜택을 소급 적용한다. 우선 기존 우대형 가입자 들에게 상향된 기여금 을 소급 지급 하고, 현재 이자소득 비과세 혜택만 받을 수 있는 기여금 미대상 가입자 ** 에는 일반형 기여금 을 소급 하여 지급 할 예정이다. * (현재) 12% → (‘27년 안) 15% 또는 25% (비수도권 중소기업 재직자) ** 총급여 6천만원 (종합소득 4,800만원) 초과 ~ 7,500만원 (종합소득 6,300만원) 이하 보다 자세한 내용 은 청년미래적금 웹페이지 (fill4young.kinfa.or.kr) 또는 서민금융진흥원 청년금융콜센터 (☏1397 바로 3번) 를 통해 확인이 가능하다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "신협의 부실채권 관리체계를 고도화합니다  신용협동조합법 시행령 개정안 국무회의 의결", "department": "상호금융팀", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87881", "summary": "신협의 부실채권 관리체계를 고도화합니다 신용협동조합법 시행령 개정안 국무회의 의결 - 신용협동조합법 개정에 따라 법률에서 위임한 ➊ 자산관리회사 운영 관련 세부사항 및 ➋ 상임감사 선임기준 구체화 「 신용협동조합법 시행령 」 일부개정안이 2026.10.6일(화) 국무 회의 에서 의결 되었다. 금번 개정안은 「 신용협동조 합법 (이하 ‘신협법’) 」 개 정 에 따라 법률에서 위임한 사항을 구체화 하기 위한 것으로, 상임감사 의무선임 기준 과 신협자산관리회사 운영 관련 세부사항 등을 규정하는 내용을 담고 있다. * ’26.4.21 공포, ’26.10.22 시행 \u003c 신협법 시행령 개정안 주요 내용 > 신협자산관리회사 운영 관련 세부사항 구체화 신협자산관리회사가 매입할 수 있는 비업무용 자산의 범위를 △조합· 중 앙회 등이 부실채권으로 인해 취득한 자산 , △ 경영관리 및 재무상태 개선 조치 에 따라 처분해야 하는 고정자산 , △ 합병·사업양도·계약이전 등으로 업무에 사용하지 않게 된 고정자산 등으로 규정하였다 (令 §19의17) . 또한, 부실자산 인수가격 은 감정평가법인 등의 감정평가 가격 등 객관적인 가격 을 기준으로 산정하되, 선순위 채권·물권·임차권 등을 고려하도록 하였다. 아울러, 가격의 사전확정이 곤란한 경우에는 인수가격과 처분가격 간 차액을 사후 정산 할 수 있도록 하였다 (令 §19의18) . 아울러, 자산관리회사가 부실자산의 매입·매각·추심 등 업무 수행 과정에서 불가피한 경우 주민등록번호 등 고유식별정보를 처리할 수 있는 근거 도 마련하였다 (令 §24의2.⑤) . 금번 개정은 농협·새마을금고 등 타 상호금융업권 자산관리회사와 유사한 수준의 종합적 NPL 관리체계를 구축 하기 위한 것으로, 신협의 부실채권 정리 및 건전성 관리 강화 에 기여할 것으로 기대된다. 신용협동조합의 상임감사 선임기준 구체화 먼저, 개정 신협법에서 시행령에 위임한 상임감사 의무선임 대상 조합 의 범위를 자산총액 3천억원 이상 (法 §27.⑧) 인 지역조합 또는 단체조합 으로 구체화하는 한편, 종교단체·사단법인·직종단체 조합 중 일정 요건을 충족하는 조합은 상임감사를 두지 않을 수 있도록 규정하였다 (令 §14.⑤) . 또한, 상임감사 의무선임 대상 조합이 아닌 경우에는, 자산총액이 2천억원 이상 인 조합 중 이사회가 건전성 관리 , 내부통제 강화 및 금융사고 예방 등을 위해 필요하다고 인정하는 경우 상임감사를 선임할 수 있도록 규정하였다 ( 令 §14.⑥ ) . 이번 개정을 통해 중소형 조합의 경영부담을 완화 하는 한편, 조합의 자율적인 내부통제 개선 을 도모할 수 있을 것으로 기대된다. \u003c 향후 계획 > 이번 개정 시행령은 개정 신협법의 시행일에 맞추어 ’26.10.22일부터 시행 될 예정이다. 신협자산관리회사 설립 의 경우, 신협중앙회 출자 및 ｢ 대부업등 감독규정 ｣ 개정 * 관련 금융위 의결 절차 등을 거쳐 ’26.11월 이후 부실채권 매입 업무를 개시 할 예정이다. * 현재 감독규정상 신협자산관리회사도 대부채권을 양도받을 수 있는 기관으로 추가하는 내용의 규정변경예고 중 (8.27.~10.6.)", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "「월간 기업가치 제고 현황(‘26.9월)」 발표", "department": "", "date": "2026-10-06", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015789", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "최근 금융권 개인정보 유출사고에 따른 보이스피싱·스미싱 등 피해에 주의하세요.", "department": "금융안전과", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87882", "summary": "최근 금융권 개인정보 유출사고에 따른 보이스피싱·스미싱 등 피해에 주의 하세요. ✓ 최근 일부 금융권 개인정보 유출 로 인한 피싱·스미싱 등 2차 피해 우려 확산 - 비밀번호·OTP 정보 등은 유출되지 않았으나 유출된 개인정보 를 결합 한 맞춤형 대출빙자 사기 에 각별히 유의 ✓ 대출 을 이유로 선입금·기존 대출 상환·앱 설치 등을 요구하면 사기 이며, 「금융거래 안심차단서비스」 가입 및 「개인정보노출자 사고예방시스템」 등록 등을 통해서도 명의도용 대출 등 금융사기 피해 를 사전 예방 가능 ✓ 금융당국 은 10.6. 금융회사 를 긴급 소집 하여 개인정보 유출 2차 피해 특별대응기간 (1개월, 연장 가능) 및 피해고객 전담 창구 운영, 유출 개인정보 를 결합 한 이상거래탐지시스템 (FDS) 강화 , 보이스피싱 정보공유·분석 AI 플랫폼 (ASAP) 을 통한 대응 등 2차 피해 방지 에 총력 을 다하도록 지도 ▣ 소비자경보 2026 - 26 호 등급 주의 경고 위험 대상 금융소비자 일반 ■ 개인정보 유출을 틈탄 맞춤형 ‘ 대출 빙자 사기 ’ 에 주의 최근 금융회사 에서 개인정보 유출사고 가 잇따라 발생하면서 보이스피싱 · 스미싱 등 금융사기 피해로 이어질 수 있다는 소비자 불안 이 커지고 있어 , 금융당국은 소비자 피해 예방을 위해 소비자경보(주의 * ) 를 발령하였다. * 피해 발생 확인시 즉시 소비자경보 격상 예정 특히 연휴 이후 금융거래가 본격 재개되는 시점을 틈타 사기범들은 성명, 주소지 등 유출된 개인정보 를 바탕으로 금융회사 직원 등을 사칭하여 저금 리 대출 , 대환대출 등 정상적인 대출 상담 을 가장하거나, 개인정보 유출 피해보상 등을 미끼 로 피해자에게 접근할 우려가 있다. 사기범은 소득, 대출한도 등 본인의 금융정보를 정확히 언급하며 실제 금융회사의 대출 안내인 것처럼 접근할 수 있어, 내 정보를 알고 있다는 이유 만으로 정상적인 연락이라고 믿어서는 안 된다. ※ 개인정보 유출을 빙자한 주요 금융사기 수법 ➊ (유출보상 빙자) '유출 피해고객 대상 금리우대·특별대출', ‘유출 피해고객 대상 피해보상 안내’ 등의 문자를 발송하여 인터넷 주소(URL) 클릭 및 상담 유도 ➋ (대환대출 빙자) 저금리 대환대출이 가능하다며 기존 대출을 먼저 상환해야 한다고 속여 사기범 계좌로 이체 유도 ➌ (선입금 요구) 신용점수 상향, 거래실적 확보, 보증료 등을 명목으로 대출 실행 전 금전 입 금 요구 ➍ (악성앱 설치) 대출신청서 작성, 보안점검 등을 명목으로 원격제어앱·악성앱 설치를 유도하여 휴대폰 장악 이 밖에도 사기범이 금융회사 나 금융감독원 직원 등을 사칭 하여 '유출 피해로부터 자산을 보호해야 한다'며 특정 계좌로 자금 이체 를 요구 할 수도 있다. 그러나 금융당국과 금융회사는 전화·문자로 비밀번호나 인증번호를 요구하거나, 피해보상·계좌보호를 이유로 자금 이체를 요구하지 않는다. 또한, 대출 과정에서 어떠한 명목으로도 선입금이나 앱 설치를 요구하지 않는다. 따라서 기존 대출 상환을 이유로 개인 명의 계좌로 이체를 요구하면 사기 이므로 즉시 거절해야 한다. 아울러 금융회사나 금융당국은 개인정보 유출 안내나 피해보상 등 어떠한 이유로도 인터넷 주소 (URL) 를 보내지 않으니 불분명 한 문자메시지 의 인터넷 주소 (URL)는 절대 클릭 하지 말고 바로 삭제 해야 한다. 본인의 개인정보 유출 여부 는 해당 금융 회사의 공식 홈페이지·앱 또는 고객센터 대표번호 를 통해 직접 확인 해야 하며, 혹시 모를 개인정보 추가 유출에 대비하여 본인 인증 에 필요한 정보 * 를 휴대폰 에 저장 하지 말아야 한다. * 주민등록번호, 금융계좌 비밀번호, 신분증 사본 등 ■ ｢ 금융거래 안심차단서비스｣ 가입 및 ｢ 개인정보노출자 사고예방 시스템｣ 등록 으로 명의도용 대출 피해를 사전 예방 한편, 사기범이 악성앱 등을 통해 확보한 정보로 피해자 명의의 대출을 무단 실행 하는 피해도 우려된다. 금융권에서는 이러한 명의도용 피해로부터 소비자들이 안심하고 금융거래를 할 수 있도록 여신거래 · 비대면 계좌개설 · 오픈뱅킹 등 ｢금융거래 안심차단서비스(3종)｣ 를 시행하고 있다. 안심차단 서비스에 가입하면 대출 , 비대면 예금 계좌 개설 , 오픈 뱅킹 이 무단 으로 실행되어 피해가 발생 하는 것을 사전에 차단 할 수 있다. 지난 ’25년 SKT 해킹사고 및 쿠팡 개인정보 유출 사고 등 발생 당시 금융 사기 위험 으로부터 스스로 를 보호 하고자 하는 소비자 들이 급격히 늘어 나면서 안심차단서비스 가입 신청이 크게 증가 * 한 바 있다. * ‘26.8월말 기준 약 700만명 가입(중복 가입 가능) ※ 안심차단서비스 개요 ☞ 안심차단서비스 가입방법은 (붙임2)~(붙임4) 참고 ➊ (여신거래 안심차단) 신용대출, 카드론, 신용카드 발급, 할부금융, 예·적금 담보대출 등 개인 명의의 여신거래를 차단 (‘24.8.23. 시행) ➋ ( 비대면 계좌개설 안심차단) 범죄조직의 수익의 통로로 사용될 수 있는 대포통장 개설로 인한 피해 방지를 위해 비대면 계좌개설을 차단 (’25.3.12. 시행) ➌ (오픈뱅킹 안심차단) 오픈뱅킹을 통한 계좌정보 무단조회 및 이체 등을 방지할 수 있도록 오픈뱅킹 서비스를 차단 (’25.11.14. 시행) ｢안심차단서비스｣ 는 거래 중 인 금융회사 * 영업점 을 방문 하거나 ‘ 내계좌 한눈에 ’ (payinfo.or.kr) 또는 은행앱 을 통해 간편하게 신청 할 수 있다. 서비스 신청 이후에도 필요한 경우에는 언제든지 금융회사 영업점 을 방문 하여 서비 스를 해제 할 수 있다. 서비스를 해제하면 곧바로 해당 금융거래 가 가능 하고, 다시 서  -  앞으로 금융회사가 개인 연체채권에 대해 대손 인정을 신청하는 경우 최초 소멸시효 완성 예정일 에 시효 를 완성 하는 조건 으로 대손 인정 ☞ 채무자 보호 필요성이 높은 소액 연체채권 * (3·5천만원) 을 대상으로 적용 * 은행·보험은 5천만원 이하, 저축은행·여전사 등은 3천만원 이하  은닉재산 발견 등 불가피한 사유 발생시 예외적으로 시효연장을 허용하여 도덕적해이 방지 유도 1 추진배경 금융위원회 및 금융감독원 은 지난 2월 「 개인 연체채권 관리 강화방안 」을 발표 하고, 장기연체채권의 반복적인 추심·매각 등으로 인한 채무자 부담 완화 및 신속한 경제적 재기 지원 을 위해 제도개선 을 추진 하여 왔다. 그간 금융회사는 회수가능성이 낮은 연체채권을 추정손실 로 분류 하고 금 융감독원으로부터 대손인정 을 받으면 소멸시효 완성 전 에도 법인세법상 손실 로 인정 받을 수 있었으며, 대손인정 이후에는 지급명령 등을 통해 소멸시효 를 반복적 으로 연장 함으로써 장기연체채권 을 장기간 보유 하면서 추심 을 지속 하는 문제가 있었다. 이에 금융당국은 금융회사의 연체채권 관리체계 를 ‘ 소멸시효의 원칙적 완성 , 예외적 연장 ’으로 전환 하기 위해 「 금융기관채권대손인정업무세칙 (이하 ‘대손세칙 ’ ) 」 개정을 추진하였다. 2 개정안 주요내용 금일 대손세칙 개정안 시행으로 개인연체채권 에 대해 서는 향후 소멸시효 완성 을 조건 으로 대손 을 인정 하는 조건부 대손인정 제도 가 도입되었다. 앞으로 금융회사는 개인 무담보 연체채권 (이하‘연체채권 ’ ) 에 대해 대손인정 신청시 소멸시효완성예정일 (신청서상 기재) 에 해당 채권의 시효 를 완성 (또는 채권 포기 * ) 하는 조건으로 대손인정 을 받을 수 있다. * 차주의 상환 등으로 시효가 연장되는 경우 동 개정안 은 금융회사의 건전성 관리 부담 과 소액 차주 보호 필요성 등을 감안 하여 은행·보험 은 5천만원 이하 , 저축은행·여전사 등은 3천만원 이하 의 연체채권에 대해 적용될 예정이다. \u003c 대손세칙 개정 전·후 비교 > 현행 개정 후 대손인정 향후 소멸시효 완성여부 와 관계 없이 “추정손실”로 분류하고, 대손 인정 소멸시효 완성 예정일 에 시효 를 완성 하는 조건 으로 대손인정 시효 연장 시효도래시 지급명령 등을 통해 시효 연장 소멸시효완성 예정일 도래시 원칙적 완성 주요 목적 부실채권 조기 상각 유도를 통한 금융 회사 건전성 관리 장기 연체채무자 보호 및 금융회사 건전성 관리 다만, 채무자의 도덕적해이 를 방지 하기 위해 채무자 의 은닉재산 발견 등 예외적 소멸시효 연장 사유 * 를 마련하였다. * 예외적 연장 사유(예) : 채무자의 은닉재산이 발견되는 경우, 파산·회생절차 등 법상 불가피하게 시효가 중단되는 경우, 신복위 및 금융회사 자체 채무조정 이행 등 아울러, 금융회사가 조건부 대손인정 채권을 매각 하는 경우에도 지난 8월 개정된「채권추심 및 대출채권 매각 가이드라인」에 따라 채권매각계약서 에 소멸시효 완성 예정일 및 시효완성 의무 를 명시 토록 하여 소멸시효 완성의무가 양수인 에게 충실히 승계 될 수 있도록 하며, 원채권 금융회사 가 양수인의 의무 이행 여부 를 점검·보고 토록 하였다. 금번 대손세칙 개정으로 장기 연체채무자가 끝없이 이어지는 채권 추심 의 고통 에서 벗어나 정상적인 경제활동 에 복귀 할 수 있는 기반을 마련하는 등 연체채무자 보호 를 한층 더 강화할 수 있을 것으로 기대된다. 또한, 금융회사 도 자산건전성 관리 를 도모하는 한편, 연체채권 관리에 투입되던 인력·비용 부담 을 완화 할 수 있을 것으로 예상된다. 3 향후계획 금일 시행된 대손세칙 개정안은 금융회사의 ’26.4분기 대손상각 신청 * 부터 적용 될 예정이며, 금융회사는 대손상각 신청 시 조건부 손비인정 채권 을 신청서상 구분하여 기재하고 향후 시효완성 여부 등에 대해 관리할 계획이다 . * 대손세칙상 금융회사는 매분기말 1개월 전까지 금감원장에게 대손인정 신청 필요 금일 각 업권별 소멸시효 관리 모범규준 개정안 도 함께 시행 되어 대손세칙상 조건부 손비인정 채권 에 대한 금융회사의 관리절차 를 구체화 하 였으며, 연체채무자가 장기간 추심에 노출되지 않도록 소멸시효 연장 채권 에 대한 재심사 * 제도 등을 신설 하였다. * (예) 소멸시효 연장 이후 3년 경과시 차주의 상환능력 등을 재평가하고, 상환능력이 없다고 판단 되는 경우 소멸시효 도래 전 중도 포기 또한, 금융회사의 연체채무자 보호를 유도하기 위해 ‘26.상반기 중 은행 , 저축은행 , 여전사, 상호금융 업권의 금융회사별 연체채권 관리 실적 을 업권별 금융협회 를 통해 이른 시일 안에 공시 할 계획이다. 공시 항목은 소멸 시효 완성 등 채권 포기 , 채무조정 , 채권 매각 실적이며, 향후 반기 단위 로 공시 할 예정이다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "이형일 부총리, K-뉴딜 아카데미를 방문하여 AI 시대 청년고용 제고 노력", "department": "민생안정지원단", "date": "2026.10.12.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079591&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "코스닥 상장예비심사 신청서 접수", "department": "", "date": "2026-10-12", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015804", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "KOSCOM", "title": "[코스콤정보분배] KAP 단기 국고통안채 TR 지수 신규 산출 안내(가동일:20261116)", "department": "전체 공지", "date": "2026-10-12", "url": "https://data.koscom.co.kr/notice/110734/notice-detail", "summary": "1. 귀사의 무궁한 발전을 기원합니다.\n2. 한국자산평가에서 아래와 같이 신규 지수를 산출하고자 공지하였기에\n안내 드리오니 업무에 참고하시기 바랍니다.\n- 아     래 -\n1. 가 동 일 :\n2026.11.16(월)\n2. 관 련 TR : KABI지수(Q6000)\n3. 지수정보\n지수명(영문명)\n지수ID\n기준일자\n주기\nKAP 단기 국고통안채 TR 지수\n(KAP Short Term KTB MSB TR Index)\nKAPRA1\n2019.12.31\n1분\n4. 테스트\n- 기간 : 2026.10.19(월) ~ 2026.11.13(금)\n- 시간 : 09:00 ~ JUNJJJ (19시경)\n- UDP전송그룹 및 포트 : 233.38.231.173 (11455)\n- TCP인터넷분배 포트 : 30904\n5. 소급데이터 : 2026.10.16(금) 19시 이후\n6. 업무담당자\n- 이상준차장 02-767-8734\nPS. 스펙 상세정보는\nhttp://data.koscom.co.kr\n를 참조하여 주십시오.", "essential": true, "importanceReasons": ["index methodology / constituents (+2)", "market-operations source (+1)"], "market": true, "tier": "essential"}, {"source": "KRX_OPEN2", "title": "코스닥시장 상장예비심사 결과", "department": "", "date": "2026-10-12", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015805", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}], "2026-10-13": [{"source": "FSS", "title": "2027년 K-IFRS 제1118호 시행, 준비상황을 점검하세요", "department": "회계감독국", "date": "2026-10-13", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=240494&menuNo=200218&pageIndex=1", "summary": "ㅁ '27.1.1.부터 K-IFRS 제1118호(재무제표 표시와 공시)가 의무적용됨에 따라 기업은 새로운 회계기준에 대비하여 도입 준비상황을 점검해야 합니다.\nㅇ 새로운 기준서 시행으로 손익계산서의 수익,비용 분류 및 주요 중간합계 표시*가 달라지고 경영진이 정의한 성과측정치**도 공시해야 합니다.\n* 영업손익, 재무손익및법인세비용차감전손익, 당기순손익\n** MPM(Management-defined Performance Measures)\nㅇ 특히, K-IFRS 제1118호는 소급 적용되므로 최초 적용 재무제표에 비교표시되는 과거 재무정보도 새로운 기준에 따라 재작성하여야 합니다.\nㅁ 기업은 ①영향분석, ②주요 회계정책,판단기준 구체화, ③시스템,결산절차 정비, ④실제 데이터를 이용한 재무제표,비교정보 산출 및 검증, ⑤미비점 보완 및 최종 준비상태 점검 등을 통해 K-IFRS 제1118호 도입을 체계적으로 준비할 필요가 있습니다.\nㅇ 시행이 임박한 만큼 실제 데이터를 이용하여 K-IFRS 제1118호에 따른 재무제표를 미리 산출,검증함으로써 시행 전에 오류나 미비점을 보완하는 것이 중요합니다.\nㅁ 아울러 지난 4월 금융감독원이 배포한 「K-IFRS 제1118호 영향 관련 사전 주석공시 모범사례」를 참고하여 新기준서 적용에 따른 주요 영향을 '26년 재무제표에 충실히 공시해야 합니다.\nㅇ 금융감독원은 유관기관과 함께 교육,홍보 등을 통해 K-IFRS 제1118호의 원활한 정착을 지속 지원할 예정입니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "불법 가상자산 취급업자(특금법상 미신고 가상자산사업자) 인터넷 사이트 국내 접속이 차단됩니다.  - 구글·애플 앱에 이어 인터넷 사이트도 국내 접속차단", "department": "가상자산검사과", "date": "2026-10-13", "url": "https://www.fsc.go.kr/no010101/87916", "summary": "불법 가상자산 취급업자 (특금법상 미신고 가상자산사업자) 인터넷 사이트 국내 접속이 차단됩니다. - 구글 · 애플 앱에 이어 인터넷 사이트도 국내 접속차단 - ◇ 방송미디어통신심의위원회, FIU 요청 에 따라 10.6~7일 심의를 거쳐 불법 가상자산 취급 사이트 27건 에 대한 접속차단 (이용해지 포함) 결정 ◇ 이용자 피해를 조기에 예방하기 위해 별도의 피해 신고가 없더라도 불법 영업행위 적발 즉시 심의를 거쳐 웹사이트 접속을 차단 할 계획 1 불법 가상자산 취급 사이트 접속차단 의결 금융위원회 금융정보분석원 (원장: 이형주, 이하 ‘FIU’) 은 그간 FIU가 접속차단을 요청한 불법 가상자산 취급업자 * 의 인터넷 사이트 중 현재 운영중인 총 27건 (붙임2) 에 대하여 방송미디어통신심의 위원회 (이하 ‘방미심위’) 가 10월 6~7일 두 차례 심의를 거쳐 국내 접속차단 ** (이용해지 포함) 을 결정 하였다고 밝혔습니다. * 「특정 금융거래정보의 보고 및 이용 등에 관한 법률」(이하 “특금법”)상 미신고 가상자산사업자 ** 서버나 운영자가 국내에 있는지에 따라 이용해지(국내) 또는 접속차단(해외) 조치를 부과 이번 결정으로 불법 가상자산 취급업자에 대해 애플, 구글 등 앱 에 이어 인터넷 사이트 에 대해서도 차단이 이루어 지게 되었으며, 이는 그간 FIU와 방미심위가 피해 예방 을 위해 신속한 노출 차단 방안 을 긴밀히 협의 해 온 결과입니다. 특히, 미신고 가상자산 영업행위는 그 자체가 특금법상 불법 행위 에 해당하는 만큼 이용자 피해가 확인되기 전 이라 하더라도 해당 정보를 조기 에 차단 할 필요가 있다는데 뜻을 모았습니다. 2 불법 가상자산 취급업자 이용시 위험성 국내에서 가상자산사업자로 적법하게 영업 하려면 정보보호관리체계 (ISMS) 인증 등의 요건을 갖추어 FIU 에 신고 해야 하며, 신고하지 않고 가상 자산 사업을 영위하는 경우 불법 가상자산 취급업자로서 형사처벌 대상 * 이 됩니다. 또한, 국외 사업자 일지라도 내국인 을 대상으로 영업하는 경우 ※ 에는 특금법 이 동일하게 적용 됩니다. * 미신고 불법 영업행위에 대해서는 5년 이하의 징역 또는 5천만원 이하의 벌금 부과 ※ 외국 가상자산사업자의 국내 영업행위 판단 기준 ① 한국어 홈페이지 제공 여부, ② 한국인 고객 유치 이벤트 등 마케팅 여부, ③ 원화결제 지원 여부 등을 종합적으로 고려하여 판단 불법 가상자산 취급업자 (특금법상 미신고 가상자산사업자) 는 가상자산이용자 보호법 및 특금법 등 관계법령에 따른 규율·감독을 받지 않아 자금세탁방지 체계 및 이용자 자산 보호 를 위한 제도적 장치 가 미비 합니다. 특히, ISMS 등 보안요건을 갖추지 않아 개인정보 유출, 해킹 등의 위험에 노출되거나, 마약 등과 관련된 범죄자금 은닉, 자금세탁 경로 로 악용될 수 있습니다. 또한, 거래대금만 받고 가상자산을 지급하지 않거나, 제대로 된 고지 없이 신고 가상자산사업자 대비 지나치게 높은 수수료 * 를 부담하는 등 투자사기 로 인한 금전피해 가 발행할 수 있으며, 이러한 피해는 구제되기 어렵습니다. * ‘26.6월 DAXA, 신고 사업자 합동 집중조사 결과, 적발 업체의 평균거래수수료는 1.5~10%로 국내 5대 원화거래소 평균(0.16%) 대비 최대 62배 수준으로 조사 3 그간의 대응 경과 FIU는 이용자 피해를 예방하고 불법 영업을 억제하기 위해 방미심위 등 유관기관과 함께 거래 제한 , 수사기관 통보 , 온라인 접속차단 요청 등 가능한 수단을 동원하여 불법 가상자산 취급행위 에 대응 해 왔습니다. 첫째 , FIU는 신고된 가상자산사업자가 미신고 사업자와 거래하지 않도록 지도·감독 * 하고 있으며, 미신고 사업자 적발시마다 이를 신고 사업자에게 통보 하여 미신고 사업자에 대한 가상자산 이전 을 제한 하도록 하고 있습니다. 아울러, 신용카드 를 이용해 미신고 사업자로부터 가상자산 을 구매·결제 할 수 없도록 제도개선도 완료 되었습니다 (’24.5월 여전법 시행령 개정) . * 위반한 사업자에 대해서는 특금법상 위반건당 최대 1억원의 과태료 및 사업자· 임직원에 대한 행정제재 부과 가능 둘째 , FIU는 민원·제보, DAXA 합동조사를 통하여 불법 가상자산 취급행위가 확인되는 즉시 수사기관 에 통보 하고, 수사가 원활하게 진행될 수 있도록 지원 해 왔습니다. 현재까지 수사기관에 통보된 불법업체 는 총 44개 입니다. (붙임1) 셋째 , 미신고 사업자의 인터넷 웹사이트와 모바일앱에 대한 국내 접속 차단을 추진해 왔습니다. FIU의 요청 에 따라 구글·애플 등 앱마켓사업자 에 의해 미신고 사업자 모바일앱 의 국내 신규설치 및 업데이트 가 차단 되어 있으며, 이번 방미심위의 결정 으로 인터넷 사이트 에 대해서도 국내 접속 차단 이 이루어지게 되었습니다. 4 기대효과 및 향후 계획 이번 결정은 불법 가상자산 취급업자에 대한 대응체계 의 신속성 과 실효성 이 한층 강화 되었다는 점에서 의미가 있습니다. 특히, 수사결과 등 사법적 판단 이나, 구체적 피해 확인 까지 기다리지 않고도 불법 가상자산 영업행위 적발 즉시 이용자 접근 을 차단 할 수 있게 됨에 따라 피해 를 사전에 예방하는 효과 가 제고 될 것으로 기대됩니다. 아울러, 차단으로 인해 발생할 수 있는 기존 이용자 인출제한 등 불편 에 대해서는 사업자의 협조 하에 DAXA 를 통해 인출방법·절차 를 상세하게 안내·지원 하는 등 접속차단에 따른 부작용 도 최소화 해 나갈 예정입니다. FIU는 앞으로도 방미심위 등 유관기관과 긴밀히 공조 하여 불법 가상자산 취급업자 적발 강화 , 신규 적발 업체 및 대체 사이트 * 에 대한 신속한 심의요청 , 신고 사업자 명단 및 수사기관 통보 불법업체 명단의 공개·안내 강화 등을 통해 자금세탁행위 방지 및 이용자 보호 를 위하여 불법 가상자산 취급행위에 단호하게 대응 해 나가겠습니다. * 차단 이후에도 해당 업자가 사이트 주소를 변경하는 등의 방식으로 우회영업을 시도할 수 있으므로 대체 사이트를 지속 점검하여 추가 심의 요청 \u003c 이용자 유의사항 > 이용자는 자신이 이용하는 가상자산사업자가 특금법에 따라 적법하게 신고된 사업자인지 여부를 반드시 확인해야 합니다. 현재 FIU에 적법하게 신고된 가상 자산사업자는 총 28개 * 로, 이 외에 국내에서 가상자산 거래를 영업 으로 하는 업체는 모두 불법 입니다. * 신고된 사업자 명단은 FIU 홈페이지(www.kofiu.go.kr)를 통해서 확인 가능 ‘고수익 ‧ 원금 보장’, ‘비공개 정보’, ‘글로벌 상장’ 등 허위 ‧ 과장 광고 는 사기가능성 을 의심해야 하며, 레퍼럴 ‧ 추천링크 를 통한 가입 ‧ 알선 행위에 가담하지 않도록 유의해야 합니다. 레퍼럴(추천) 행위 는 단순 광고를 넘어 미신고 영업을 조력 한 행위로 평가될 수 있어, 추천자도 형사처벌 대상 이 될 여지가 있습니다. 미신고 사업자로 확인되면 즉시 본인 소유의 가상자산 ‧ 예치금을 인출 하고, 개인키, 로그인 정보, 신분증 사본 등을 미신고 사업자에게 제공하지 않도록 주의해야 합니다. 만약 불법 가상자산 취급행위가 의심되는 경우에는 경찰(☎112) , FIU (infiu@korea.kr), DAXA (jebo@kdaxa.org) 등에 제보가 가능하며, 형사소송법 제234조에 따라 직접 수사 기관에 고발하는 것도 가능 합니다. [붙임1] 불법 가상자산 취급업자 수사의뢰 명단 [붙임2] 금번 방미심위 접속차단 결정 사업자 명단", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.12일)", "department": "국민지역참여지원과", "date": "2026-10-13", "url": "https://www.fsc.go.kr/no010101/87915", "summary": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.12일) 제2차 국민참여성장펀드 의 금일 판매액 은 310.4억원 으로, 증권사 가 259.8억원 , 은행 이 50.6억원 을 판매 하였다. 7영업일간의 누적판매액 은 총 목표액 (6,000억원) 의 72.8% 인 약 4,370억원 이다. 공모펀드운용사 3社 (미래에셋, 삼성, KB자산운용) 는 그간의 판매실적 을 고려 하여 소관 판매사들과 협의 를 거쳐 은행에 배정된 물량을 증권사로 재조정 하였으며 , 그 결과 판매사별 잔여물량 현황 은 [붙임]과 같다. 10.15일(목)까지 남은 3영업일간 잔여물량(약 1,630억원) 을 선 착순 으로 판매 한 후, 판매 를 종료 할 예정 이다.", "essential": false, "importanceReasons": [], "market": false, "  효과 가 있다. 운영위원회 는 FATF의 주요 의제와 업무 방향 등을 논의하는 핵심적인 거버 넌스 회의체 으로서, FATF 의장, 부의장 및 사무국장 등 당연직 외에 미국, 중국, 독일, 프랑스, 이탈리아, EC, 호주, 남아프리카 공화국 의 대표가 의장의 지명 또 는 회원국들의 지지 를 통해 비당연직으로 참여 중 이며 , 이러한 자리에 한국이 참여 한다는 것은 FATF 회원 40개국을 넘어 FATF 지역기구 소속 약 200개 회원국을 대표 하 여 국제 금융범죄 대응 분야 에서 전문성과 신뢰를 인정 받고 있다는 의미로서, 다가오는 우리나라의 제5차 FATF 상호평가 수검 에도 긍정적인 영향 을 미칠 것으로 기대된다. FATF 운영위원회 참여 는 단순히 우리나라의 국제적 위상 이나 대표성을 제고 하는 데 그치지 않는다. 그간 FATF 총회 의 주요 안건 논의 과정에서 이형주 금융정보분석원장 이 전문적 식 견과 정책적 판단 을 바탕으로 국제적 논의에 기여 하고, 회원국들과의 협의 및 조정 과정 에 적극적으로 참여해 왔다는 점 에서도 의미가 있다 . 특히, 이러한 경험과 참여를 바탕 으로 FATF 운영위원회에서도 우리나라의 입장 을 효과적으로 전달 하는 한편, 주요 의제 에 대한 논의와 의사결정 과정 에 실질적으로 기여할 수 있다 는 점에서 중요한 의미 가 있다. 금융정보분석원 은 이러한 국제적 역할 을 국내 AML 시스템 의 실질적인 발전 으로 연결 할 수 있도록, 운영위원회 및 FATF 활동 을 통해 확보한 주요국의 정책· 제도 와 최신 불법금융 동향, 국제적 대응 사례 등을 국내 유관기관과 적극 공유 할 예정이다. 이를 통해 관세청·국세청· 수사기관 등 각 기관이 수행 하는 자금세탁 및 관련 범죄 대응 업무를 지원 하고, 기관 간 정보공유와 협업을 강화 함으로써 우리나라 전체의 AML/CFT 대응 역량 을 한층 높이는 선순환 구조를 구축 해 나갈 것이다. 아울러 국경을 초월 하여 빠르게 진화 하는 불법금융 에 효과적으로 대응 하기 위해 국제협력 분야 에 필요한 자원과 역량을 집중 하고, 이를 바탕으로 향후 제5차 FATF 상호평가 에서도 우리나라의 국제적 역할 과 그간 축적해 온 제도적·실무적 성과 가 충실히 반영 될 수 있도록 적극 대응 해 나갈 계획이다 .", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.13일)", "department": "국민지역참여지원과", "date": "2026-10-14", "url": "https://www.fsc.go.kr/no010101/87922", "summary": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.13일) 제2차 국민참여성장펀드 의 금일 판매액 은 154.9억원 으로, 증권사 가 117.1억원 , 은행 이 37.8억원 을 판매 하였다. 8영업일간의 누적판매액 은 총 목표액 (6,000억원) 의 75.4% 인 약 4,525억원 으로, 판매사별 잔여물량 현황 은 [붙임]과 같다. 10.15일(목)까지 남은 2영업일간 잔여물량(약 1,475억원) 을 선 착순 으로 판매 한 후, 판매 를 종료 할 예정이다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "금융위원회 안창국 상임위원,  금융안정위원회(FSB) 규제·감독협력상임위(SRC) 및 ｢KOOM Week 2026｣ 참석", "department": "글로벌금융과", "date": "2026-10-14", "url": "https://www.fsc.go.kr/no010101/87924", "summary": "금융위원회 안창국 상임위원, 금융안정위원회(FSB) 규제·감독협력상임위(SRC) 및 ｢KOOM Week 2026｣ 참석 [FSB SRC] 외부감사 품질 제고, 사모대출 감독, 금융당국의 AI 활용 등 논의 [KOOM Week 2026] K-스타트업 미국 진출 지원, 투자자·창업자 간 네트워크 강화 금융위원회 안창국 상임위원 은 미국 (워싱턴 D.C., 뉴욕) 을 방문 하여 금융안정 위원회 (FSB, Financial Stability Board) 가 개최한 규제·감독협력상임위원회 (SRC, Standing Committee on Supervisory and Regulatory Cooperation) 에서 글로벌 금융 시스템의 안정성 제고를 위한 주요 현안을 논의하고, 한국 창업·벤처기업의 미국 진출 지원 및 네트워크 강화를 위한 ｢KOOM Week 2026｣ 에 참석하였다. 1 FSB 규제 · 감독협력상임위(SRC) 안 상임위원은 워싱턴 D.C. 에서 열린 FSB SRC (의장: Michelle Bowman, 미국 연방준비제도 금융감독 부의장) 에 참석하여 외부감사 (External Audit) 품질 제고, 사모대출 (Private Credit) 감독, 금융당국의 AI 활용 등을 논의하였다. 【 금융안정위원회( F inancial S tability B oard) 개요 】 ◇ (연혁) G7을 주축으로 설립된 금융안정포럼(FSF) 을 전신 으로 하며, 글로벌 금융위기 극복 과정에서 G20 이 참여하는 금융안정위원회(FSB) 로 확대·개편 ◇ (기능) 국제기준 및 정책 권고안 개발, 국제기준 이행점검 및 국가 간 협력 강화 등을 통해 글로벌 금융시스템 안정성 제고를 위한 금융규제 개혁 추진 ◇ (구성) G20 회원국의 재무부･금융당국･중앙은행 등 (한국은 금융위와 한국은행이 참여) ◇ (규제·감독협력상임위(SRC)) 주요 금융안정 취약요인을 분석하고 규제·감독 정책 대응방안을 마련 [ 외부감사 품질 제고 ] 금번 SRC 회의에서는 지난 6월 FSB가 외부감사 (External Audits) 품질 을 제고하기 위해 개최한 라운드테이블 (Round Table) 의 주요 논의결과 를 공유하였다. 외부감사 라운 드테이블은 외부감사 품질 이 금융기관의 건전성 및 금융안정 에 중요하다는 인식하에 2년 마다 개최되고 있다. 이번 회의에서는 글로벌 감사 업계의 구조적 변화에 초점을 맞춰 사모펀드(PE)의 회계·감사 법인에 대한 투자 , AI 등 신기술의 영향 을 주요 과제로 논의하였다. 회의에서는 사모펀드의 감사법인 투자 확대가 규모의 경제를 통해 감사품질을 높일 수 있는 반면, 단기 이익 추구 에 따른 이해상충, 감사법인의 지배구조 변화 등에 따른 리스크 요인도 제 기 되었다. 또한 감사업무에 AI를 활용하는 과정에서 오류·편향이 확산될 우 려가 있으므로 인적 감독을 유지할 필요가 있다는 의견도 공유되었다 . 안 위원은 외부자본의 유입과 기술 발전이 감사 역량과 효율성 을 높이는 기회가 될 수 있으나, 수익성이 감사 품질에 우선 하거나 감사 독립성 이 저하 될 위험도 있는 만큼 지속적인 모니터링 이 필요 하다고 강조하였다. 아울러 한국은 법률상 사모펀드가 회계법인 에 직접 출자하는 것을 제한 함으로써 회계법인의 독립성 을 확보 하고 있다고 설명하였다. 또한 대형 회계법인에 독립적인 외부전문가 중심 의 감사품질 감독위원회 설치를 의무화하는 등 감사 품질 제고 사례 를 소개하였다. 이와 함께 AI 등 신기술 활용에 관한 교육 이수 의무화, 접근권한 통제 등 일정 수준의 관리감독체계 를 구축·운영 하는 사례도 공유하였다 . [ 사모대출 감독 ] 지난 5월 FSB가 발간한 사모대출 취약성 관련 보고서 (Report on Vulnerabilities in Private Credit) 를 토대로 사모대출에 대한 효과적인 감독방향 에 대해 논의 하였다. FSB는 사모대출 이 은행대출과 회사채 발행을 보완하는 기업 자금조달 수단 으로 빠르게 성장 하는 가운데, 은행·보험사·사모펀드 등 다양한 금융기관과 직·간접적으로 연계 되면서 사모대출시장의 충격이 금융권 전반에 전이될 가능성이 있어 주목할 필요가 있다고 평가하였다. 이번 회의에서는 사모대출의 위험을 식별하기 위해 특정 업종·기관에 대한 위험 집중도 분석, 은행과 자산운용사 간 연계성 파악 등 주요 감독과제를 논의하고 각국의 경험을 공유하였다. 안 위원은 사모대출 이 기업의 자금조달 을 지원하는 순기능이 있으나 높은 레버리지, 여타 금융회사와의 복잡한 연계 구조 등에서 비롯되는 잠재적 리스 크 를 면밀히 살펴볼 필요가 있으며, 기업 자금조달 지원과 금융안정 간 균형 있는 접근 이 필요하다고 강조하였다. 또한 글로벌 금융시장의 불확실성 이 높은 상황에서 각국의 감독 경험 을 공유 하고 감독 방향 을 논의 하는 것은 시의적절 하다고 평가하였다. [ 금융당국의 AI 활용 ] 회원국들은 지난 6월 FSB 총회에서 ｢ 금융기관의 책임있는 AI 도입을 위한 모범사례 (Sound practices for financial institutions’ responsible AI adoption) 협의 보고서 (consultation paper) ｣를 논의하였다. 해당 보고서는 의견수렴을 거쳐 10월에 최종안이 공개될 예정이다. 앞선 논의가 금융기관의 AI 도입에 필요한 거버넌스, 리스크 관리 등에 초점을 맞췄다면, 이번 회의에서는 금융당국의 감독업무상 AI 활용에 필요한 거버넌스, 잠재적 위험성 등에 대하여 논의 하고 회원국들의 사례 를 공유 하였다. 안 위원은 이상징후 조기 탐지, 위험 모니터링 등에 AI를 활용할 경우 감독의 효율성·적시성 을 높일 수 있는 만큼, AI 활용 확대와 함께 AI 모델의 설명가능성 부족 등 관련 위험 도 적절히 관리해야 한다는 데 공감하였다. 아울러 한국은 가상자산 시장감시 에 AI를 활용 하여 시세조종 등 이상거래를 탐지 하고, 매매분석부터 결과보고서 작성까지 자동화하는 체계를 구축하였다고 설명하였다. 민원·분쟁 업무 에도 AI 도입을 추진하여, 민원 분류 와 분쟁사례·판례 추천 등 소비자보호 업무의 효율성을 높이기 위해 노력하고 있다고 소개하였다. [ 향후 업무방향 ] 회원국들은 SRC의 향후 업무방향으로 ①규제·감독 현대화, ② AI 관련 위험 대응 및 활용, ③스테이블코인 관련 국제협력 강화 등을 논의 하였다 . 규제·감독 현대화와 관련해서는 금융환경 변화에 대응하여 규제 ·감독의 효과 성과 효율성을 높이기 위한 ‘현대화 원칙’과 더불어, 회원국 간 적용 경험 공유 방안에 대한 의견을 교환하였다 . AI 분야에서는 사이버 위협 변화에 대응하 기 위한 사이버 사고 대응 및 복구 툴킷(toolkit)의 보완 , AI와 금융 사기 간의 연관성 분석, 에이전트형 AI (Agentic AI) 활용사례 연구 및 금융 당국의 AI 활용 경험 공유 등이 주요 과제로 언급되었다. 스테이블코인 과 관련해서는 국가별 규제체계의 차이와 국경을 넘나드는 발행·유통 활동에 따른 감독상 과제의 점검 및 감독당국 간 정보공유와 협력 강화 방안에 대해 논의하였다. 2 ｢KOOM Week 2026｣ 참석 안 위원은 뉴욕에서 ｢KOOM Week 2026｣ 금융 리더십 포럼 에 참석하고, 한인창업자연합회 (UKF, United Korean Founders) 관계자들과 간담회 를 가졌다. 미국 한인 창업가·투자자들이 경험과 정보를 공유하기 위해 시작하여 현재 약 1,500명 이상의 스타트업·VC 회원을 보유한 한인 네트 워크인 UKF 가 개최 하는 ｢KOOM Week 2026｣ 은 한국 스타트업의 미국 진출 과 투자 유치, 한·미 투자자·창업자 간 네트워크 확대 를 모색 하는 자리이다 . 【 KOOM Week 2026 개요】 ◇ (개요) 한인창업자연합회(UKF, United Korean Founders) 주최로 뉴욕 맨해튼에서 10.12~18일 동안 개최되는 K-스타트업의 미국 진출 및 한·미 투자자·창업자 간 교류 지원 행사 ◇ (참여대상) 스타트업 (예비)창업자, VC·PE 등 투자자, 기업, 전문가 등 ◇ (프로그램) 스타트업 IR, 창업자·투자자 네트워킹, K-브랜드 전시·판매 홍보, K-브랜드 미국시장 진출·사업협력 논의, AI 기술·글로벌 진출 관련 컨퍼런스 등 KOOM Week의 일환으로 개최된 금융 리더십 포럼 에는 기업은행, 산업은행, 한국거래소 등 금융유관기관 과 미국 현지 스타트업, VC 투자자 등이 참여하여 미국 스타트업 생태계 현황, K-스타트업의 해외 진출 지원을 위한 정책금융의 역할 등을 논의하였다. 안 위원은 인사말씀을 통해 우리 스타트업의 글로벌 도전을 뒷받침하기 위한 민관 협력의 중요성 을 강조하며, KOOM Week 가 우리 스타트업이 미국 시장에서 새로운 기회를 발굴하고 “꿈”을 펼칠 수 있도록 돕는 대표적인 네트워크 플랫폼 으로 발전하길 기대한다고 밝혔다. 이어서 진행된 한인창업자연합회 간담회 에서는 스타트업이 성장하고 해외에 진출하는 과정에서 겪는 애로사항 을 살펴보고, 우수한 기술, 인재의 집적, 풍부한 자본, 활발한 창업·투자 네트워크 등으로 대표되는 미국 벤처생태계의 특징에 대해 현장의 목소리를 청취하였다. 안 위원은 금융위원회는 혁신기업에 대한 성장단계별 자금공급 확대, 모험자본 활성화 등 생산적 금융 을 적극 추진 하고 있다고 설명하며, 해외 투자 유치, 글로벌 투자자 와의 연계 확대 등을 통해 우리 스타트업의 미국시장 진출을 금융 측면에서 적극 뒷받침해 나가겠다고 밝혔다. 한편, 안 위원은 한국거래소가 현지 스타트업·투자자 를 대상으로 개최한 코스닥시장 설명회 에 참석하여 한국의 상장제도와 기업 유치 전략 을 청취 하였다. 한국거래소는 코스닥은 기술력과 성장성을 갖춘 기업의 자금조달을 지원하는 시장이라고 소개하며, 글로벌 거래소와 견줄만한 풍부한 유동성 이 있고, 밸류 에이션 관련 지표도 높으며 , 상장 비용도 저렴 하여 기업에 유리한 환경을 제공하고 있다고 설명하였다. 또한 기술특례상장제도 를 통해 일정 요건을 충족하는 혁신기업이 수익성보다 기술력과 성장성을 중심으로 평가 받아 상장할 수 있 다 는 점을 강조하였다. 이번 설명회에서는 외국기업의 코스닥 상장절차, 성공사례 등을 안내함으로써 글로벌 혁신기업의 코스닥 상장 에 대한 이해와 관심을 높이고 코스닥시장 의 브랜드 가치와 상장 매력 을 제고 하는 계기가 되었다. 3 현지 진출 금융회사 간담회 미국에 진출한 우리 금융회사들 * 과 간담회 를 개최하여 미국 금융산업 동향 과 회사별 영업현황 을 청취하고, 현지 영업과정에서 직면하는 애로사항 과 건의사항 등에 대해 의견을 나누었다. 안 위원은 한·미 관계가 전통적인 안보·외교를 넘어 경 제·산업 등 다양한 분야로 확대되고 있는 만큼, 금융분야의 교류와 협력 또 한 점점 더 중요해지고 있다고 강조하였다. 아울러 해외시장 개척을 위해 적극적으로 노력하는 우리 금융회사들에게 격려와 지지의 뜻을 표하며, 금융산 업의 글로벌 경쟁력 강화 를 위해 국내 금융회사의 해외 진출 을 지속적 으로 지원 해 나가겠다고 밝혔다. * 美 진출 韓 은행(산업, 기업, 우리, 신한, 국민, 하나, 농협, 수출입)", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "한국거래소, ’26년도 하반기 자문위원회 세미나 개최", "department": "", "date": "2026-10-14", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015814", "summary": "첨부 참조", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "relevant"}, {"source": "KRX_OPEN2", "title": "한국거래소, 신뢰받는 고품질 탄소크레딧 시장의 개설을 위해 글로벌 평가사 BeZero와 MOU 체결", "department": "", "date": "2026-10-14", "url": "https://open.krx.co.kr/contents/OPN/05/050 한 체크리스트 점검결과 를 확인하고, 향후 이러한 사고가 재발하지 않도록 하기 위한 정책 과제 를 논의 하기 위해 개최되었다. · 일시/장소 : ’26.10.14.(수) 15:00 / 정부서울청사 · 참석 : [금융위] 신진창 사무처장 (주재) , 디지털금융정책관 등 [금감원] 디지털·IT부원장보, 디지털금융총괄국장, IT검사국장 등 [금보원] 금융보안원장, 사이버대응본부장, 금융AI연구소장 등 [관계기관] 과기부, 행안부, 개보위, 경찰청, 한국인터넷진흥원, [보안전문가] · 논의사항 : ①全금융권 체크리스트 점검결과, ②금융권 침해사고 조사경과, ③금융권 보안 관리체계 강화방안 등 [ 금융권 침해사고 조사경과 ] 신한은행 침해사고 전후로 사고 발생이 확인된 금융회사는 은행·저축은행· 상호금융 ·여전업·전금업·온투업·가상자산사업자 등 全업권에 걸쳐 총 16개사 * 로 파악되 었다. 현재도 금융회사들이 공유된 IP 등을 바탕으로 침해발생 여부를 확인중에 있어, 사고발생 금융회사 수는 이보다 더 확대될 수 있다. 현재까지 확인된 금융회사들의 정보유출 규모 는 약 10만건 ( 성명, 연락처, 주민등록 번호, 이메일 등) 수준으로 파악되었으며, 직접적 부정결제 우려 가 있는 정보 유출 ( 계좌번호, 카드번호 등) 은 확인되지 않았다. * [은행] 신한, 국민, 부산, 하나, [저축] 예가람, 웰컴, 디비, 오케이 [ 여신] 현대캐피탈, 산은캐피탈, [ 온투] PFCT, 모우다, [전금] 브라이트픽스 [ 가상자산] 스트리미, 프라뱅, [상호] 새마을금고중앙회 사고 발생이 신고된 금융회사들에 대해서는 ▲신속히 공격IP를 차단하고, 보안패치, 관련 서비스 중단 등 추가 침해사고 방지조치를 취하고, ▲개인 정보 유출사실·대응요령 안내 등 소비자 보호 조치를 취하도록 관리·감독하고 있으며, ▲금감원·금보원 현장 조사 등을 바탕으로 침해경로·공격방식 등 을 신속히 파악해 각 사례별 연관성·동일 주체 여부·AI해킹 가능성 등에 대해 심도 있게 확인 중에 있다. ▲아울러, 과기부·행안부·개보위·경찰 등 유관기관과 긴밀한 협조를 통해 금융 외 부문에 피해확산을 방지하고 공 격자 검거 등 수사가 원활히 이뤄질 수 있도록 만전을 기해 나갈 예정이다. [ 체크리스트 점검결과 ] 지난 10월 8일까지 진행한 全 금융권 555개사 에 대한 12개 항목의 체크 리스트 점검 도 마무리 되었다. 점검결과 총 425개사 는 ‘적정’ 으로 제출 하 였고, 130개사 는 미흡사항 이 있음을 보고하였다. 미흡사항이 발견된 회사들은 대부분 보안패치·관제체계 관련 1~2건의 점검항목에서 보완 필요사항이 확인되었으며, 상대적으로 보안역량이 약한 전금업·온투업 부문에서 비교적 많은 미흡사항이 발견되었다. 체크리스트 점검에 앞서, 공격자로 확인된 IP 에 대해서는 우선 즉시 차단 토록 조치하였고, 발견된 미흡사항 에 대해서는 긴급한 조치부터 신속히 시행 토록 지도·감독 하고 있다. 구체적으로, 주요한 주요한 미흡사항은 ▲ 최신 보안패치 미 적용 , ▲ 제조사 기술 지원 종료 (EOS : End of Support) 시스템 관리 미흡 , ▲ 실시간 (24시간) 관 제 체계 미구축 , ▲ 공격표면 관리 미흡 (대외시스템 대상 인증·인가 누락, 중요 서 비스에 대한 강화된 인증절차 (MFA) 미도입 등) 등이 보고되었고, 각 금융회사들은 ▲ 신 속한 보안패치 · 노후장비 처분 및 교체 , ▲ 보안관제 인력·설비 등 확충 , ▲ 인증범위 확대·접근통제 강화 등 공격표면 관리 강화 조치 등 신속한 보 완조치 실행계획 도 함께 보고하고 즉시 조치 시행중이다. [ 정책과제 ] 금일「제2차 긴급 상황대응 회의」에서는 이번에 체크리스트 점검과정 등에서 발견된 취약요인 발생을 구조적·체계적으로 방지할 수 있는 근본적 인 제도개선 과제에 대해서도 심도있게 논의하였다. 첫째, 금융회사 보안체계·관리시스템 전수점검을 추진한다. 금번 침해사고의 특성·공격유형 등을 감안해 시급한 조치가 필요했던 12개 항목의 체크리스트 점검이 마무리된 만큼, AI 해킹위협 등 새 로운 보안 위협에 대해 금융권이 충분한 대비태세를 갖출 수 있도록 공격표면 관리 ·인증체계·내 부통제 등 보안관리 전반을 촘 촘히 전수점검 하고 대응계획 을 마련토록 할 계획이다. ▲전산시스템이 외부와 연결되는 모든 접점을 목록화· 현행화 하고, ▲외부접점의 인증·접근통제 권한을 명확히 설정·엄격히 관리 하며, ▲외부접점 관리 등 보안체계 운영·관리 와 CEO·CISO·CIO 등의 보고체계·책임범위 등도 명확히 하도록 지도·감독해 나갈 예정이다. 이와 관련한 구체적인 점검범위와 일정을 금융권과 협의를 통해 신속히 확정·추진해 나갈 예정이다. 둘째, 금융권 해킹위협을 조기에 포착하고, 공동 대응하는 체계를 마련한다. 현재, 금감원·금보원이 파악한 해킹위협 정보는 통합관제시스템(FIRST) 등을 통해 全금융권에 신속히 전파되고 있으나, 금융회사가 자체 보안관제 과정에 서 파악한 정보는 공유되지 않고 있는 상황이다. AI 해킹 위협에 대한 대응은 신속한 위협상황 인지와 조속한 공동대응이 중요한 (“속도가 생명”) 만큼, ▲금융회사가 자체 파악한 위협정보 도 통합관제 시 스 템 등을 통해 공유 할 수 있도록 시스템을 개선하고, ▲금융회사가 침 해 위협 정도 를 직관적으로 확인·대응 할 수 있는 AI 위협수준 정보체계 도 조 속히 마련해 나갈 계획이다. 또한, ▲공격자 관점에서 외부 노출자산, 내부 소스코드, 모 바일 앱 등의 취약점을 탐지할 수 있도록 AI 기반 취약점 점검 인프라 구축 도 추진한다 . 셋째, 금융회사가 상시적으로 면밀한 보안관리를 하도록 제도기반을 마련한다. 금융회사·전자금융업자는「전자금융거래법」과「전자금융감독규정」에 따라 연 1회 (외부 홈페이지는 연 2회) 취약점 점검·평가를 하도록 의무화되어 있으나, 빠르게 진화하는 AI 보안위협에 비추어, 보다 치밀하고 정교한 점검이 이루어 져야 한다는 지적이 제기되는 상황이다. ▲공격표면·외부접점이 넓고 고객수가 많은 대형 금융회사부터 취약점 점검·평가 주기를 연 2회 이상으로 확대 하고, ▲ 중요한 외부접점 등은 필수 점검대상에 포함 하는 방안을 추진한다. ▲아울러, 긴급한 필요가 있을 경 우 수시점검 할 수 있는 근거 를 마련하는 방안도 검토·추진할 예정이다. 넷째, 중소형 금융회사에 대한 보안관리 지원도 강화한다. AI보안위협에 대해 충분한 대응여력을 갖추기 어려운 중소형 금융회사 등에 대한 지원방안도 조속히 검토·추진할 예정이다. ▲금융보안원이 각 업권 협회·중앙회와 함께 AI 기반 공동 보안관제 시스템 구축 을 검토하고, ▲AI 침해위협에 대비한 공격표면 점검 (블랙박스 테스트) , ▲ 중소형 금융회사 맞춤형 보안안내서 마련 등 다양한 방안도 추진할 계획이다. 아울러, 대부업, 보험GA 등「전자금융거래법」적용대상에서 빠져있어 그간 면밀한 관리가 어려웠던 부문에 대해서도 AI 보안위협에 대한 대응 요령 을 신속히 전파 하는 등 보안 강화방안도 조속히 검토·추진할 예정이다. 신진창 사무처장은 “금융분야는 그 무엇보다 신뢰와 안전이 중요한 만큼 , 보안사고 예방을 위한 철저한 보안관리 가 필수적이다.”고 언급하며, “그간 롯데카드 정보유출, 미토스 쇼크 등 다양한 계기로 수차례에 걸쳐 전수 점검과 관리 강화를 주문 했음에도, 금융회사에서 기본적인 부분이 잘 지 켜지지 않는 사례가 발견된 것은 매우 뼈아픈 부분 ”이라고 지적하였다. 아울러, “금번 사고를 계기로 금융회사 외부접점·인증관리 등 공격표면 관리 뿐 아니라 全금융권의 보안관제 체계, CEO·이사회 등 책임성 확보 등 보안체계 전반에 대한 철저한 재점검 과 근본적 제도개선 이 이뤄지도록 최선을 다할 것”이라고 강조하였다. 또한, “AI 보안위협 확대에 대비해 ‘AI공격은 AI로 방어 ’하는 보안체계를 확립하기 위한 망분리 규제 완화 등 제도개선 도 보다 면밀하고 속도감 있게 추진 해 나가겠다”고 언급하였다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSS",
