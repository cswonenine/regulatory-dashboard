<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regulatory Change Monitor</title><style>
  :root {

      --text-secondary: #c3c2b7;
      --text-muted:     #74736c;
      --border:         rgba(255,255,255,0.08);
      --shadow:         rgba(0,0,0,0.35);
      --accent:         #f08150;
      --accent-wash:    rgba(240,129,80,0.14);
      --pulse:          #4ade80;
      --planned:        #a78bfa;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1c1c1a; --surface-2: #232321; --page-plane: #121211;

  body {

    font: 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;

  .wrap { max-width: 620px; margin: 0 auto; padding: 32px 16px 56px; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

  .topbar h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  .pulse-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: var(--pulse); opacity: 0.35; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(2.2); opacity: 0; } }

  .banner { border-radius: 14px; padding: 14px 17px; margin: 14px 0 0; border: 1px solid var(--border); background: var(--surface-1); }
  .banner-head { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; padding: 0; font: inherit; color: inherit; text-align: left; }
  button.banner-head { cursor: pointer; }
  .banner-head > div { flex: 1; min-width: 0; }
  .banner .chevron { flex: none; color: #dc2626; transition: transform 0.2s ease; }
  .banner.open .chevron { transform: rotate(180deg); }
  #list { margin-top: 12px; }
  #list .card { background: var(--surface-1); }
  .banner .headline { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .banner .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .banner.alert { background: color-mix(in srgb, #dc2626 12%, var(--surface-1)); border-color: color-mix(in srgb, #dc2626 45%, var(--border)); }
  .banner.alert .headline { color: #dc2626; }
  .upcoming { margin-top: 14px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 12px 17px; }
  .upcoming h2 { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px; }
  .upcoming .row { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; font-size: 13.5px; }
  .upcoming .when { flex: none; min-width: 74px; font-weight: 700; color: #dc2626; font-variant-numeric: tabular-nums; }
  .upcoming .when.soon { background: #dc2626; color: #fff; border-radius: 999px; padding: 1px 9px; min-width: 0; }
  .upcoming .date { flex: none; font-size: 11.5px; color: var(--text-muted); }
  .upcoming .none { font-size: 13px; color: var(--text-muted); }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
  .stat.essential .n { color: #dc2626; }
  .cal-card { margin-top: 28px; }
  .stat { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px var(--shadow); }
  .stat.clickable { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .stat.clickable:hover { background: var(--surface-2); }
  .stat .n { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .stat .k { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 1px; }
  .sources-panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 22px; box-shadow: 0 1px 2px var(--shadow); }
  .sources-panel a {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 8px; text-decoration: none; color: inherit; font-size: 13px;
  }
  .sources-panel a:hover { background: var(--surface-2); }
  .sources-panel .label { font-weight: 600; }
  .sources-panel .url { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 8px; box-shadow: 0 1px 3px var(--shadow); overflow: hidden;
    border-left: 3px solid var(--source-color, var(--accent));
  }
  .card-head {
    display: flex; align-items: center; gap: 9px; padding: 13px 17px; cursor: pointer;
    background: none; border: none; width: 100%; text-align: left; font: inherit; color: inherit;
  }
  .card-head:hover { background: var(--surface-2); }
  .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; color: var(--source-color, var(--accent));

    border-radius: 999px; padding: 3px 9px; flex: none;
  }
  .card-head .card-title {
    font-size: 14.5px; font-weight: 600; margin: 0; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;

  .badge.essential { color: #fff; background: #dc2626; }
  .why { font-size: 12px; color: #dc2626; margin-bottom: 9px; }

  button.daylist-item-title:hover { color: var(--accent); }
  .daylist-item.expanded .daylist-item-head { margin-bottom: 8px; }
  .ago { font-size: 11.5px; color: var(--text-muted); flex: none; }
  .chevron { flex: none; color: var(--text-muted); transition: transform 0.2s ease; }
  .card.expanded .chevron { transform: rotate(180deg); }
  .card-details { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .card.expanded .card-details { max-height: 4000px; }
  .card-details-inner { padding: 0 17px 15px; }
  .card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 9px; }
  .card-summary {
    font-size: 13.5px; line-height: 1.5; color: var(--text-secondary); white-space: pre-line; margin-bottom: 4px;

  .view-btn {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--accent);

  }
  .view-btn:hover { text-decoration: underline; }

  .empty { text-align: center; padding: 56px 16px; color: var(--text-muted); }

  .cal-weekday { text-align: center; font-size: 10.5px; color: var(--text-muted); font-weight: 600; padding-bottom: 4px; }
  .cal-day {

    border-radius: 8px; font-size: 12px; color: var(--text-secondary); position: relative; gap: 2px;

  }
  .cal-day.blank { background: none; }
  .cal-day.empty-day { opacity: 0.4; }
  .cal-day.has-data, .cal-day.has-planned { color: var(--text-primary); cursor: pointer; font-weight: 650; }
  .cal-day.has-data:hover, .cal-day.has-planned:hover { outline: 1.5px solid var(--accent); }
  .cal-day.selected { outline: 2px solid var(--accent); }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--text-muted); }
  .cal-dots { display: flex; gap: 2px; position: absolute; bottom: 5px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-dot.planned { background: var(--planned); }
  .cal-dot.essential { background: #dc2626; }
  .cal-day.has-essential { background: color-mix(in srgb, #dc2626 14%, var(--surface-2)); }

  .cal-legend { display: flex; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); }
  .cal-legend .item { display: flex; align-items: center; gap: 5px; }
  .cal-legend .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cal-legend .dot.planned { background: var(--planned); }
  .cal-legend .dot.essential { background: #dc2626; }
  .cal-daylist { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

  .cal-daylist .empty-note { font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }

  .daylist-item-title { font-size: 13.5px; font-weight: 650; line-height: 1.35; }

  .cal-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

  footer { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 28px; }

리 , 글로벌 컨설팅회사 출신 으로 일종의 ‘ 정보카르텔 ’을 형성 하고, 상장사 내부정보 를 공유 하며 가족 ･ 지인 들을 가담 시켜 장기간 조직적 으로 미공개정보 를 이용 한 사건입니다. - 금일(9.29.) 합동대응단 은 혐의자들의 자택, 사무실 등 20여 곳 에 대한 압수수색 을 전격 실시 하여 현재 진행 중인 사건의 현장 증거 를 확보 함과 동시에, 증권선물위원회 (위원장 권대영) 는 미공개정보 이용으로 취득한 부당이득이 보관된 혐의자의 증권 계좌 에 대해 자본시장법에 따른 지급정지 조치 를 시행 하여 취득한 부당이득 을 남김없이 환수 할 수 있는 선제적인 조치 를 완료하였습니다. - 본 사건은 거래소 의 시장감시 과정 에서 최초 포착 한 후 합동대응단 에서 기관 간 긴밀한 공조 조사 를 통해 혐의를 추가 포착한 사건으로, 향후 압수수색 결과를 바탕으로 신속히 조사를 마무리 하여 엄정 조치 할 예정입니다. - 합동대응단은 앞서 공개매수 주관사 임원의 미공개정보 이용행위에 대한 압수수색 및 조치를 완료 하고 이번에 금융전문가 로 구성된 ‘정보카르텔’ 세력 을 적발 함에 따라 , 상장사 미공개정보 를 이용 한 불공정거래 행위 는 끝까지 추적 해 우리 자본 시장에서 발붙일 수 없도록 함으로써, 일반 투자자 들이 정보의 비대칭 으로 불이익 을 받지 않도록 지속적으로 감시 ･ 조사 ･ 엄단 하겠습니다. 동 보도자료 내 범죄혐의는 재판에 의 하여 확정된 사실이 아님 에 유의하여 주시기 바랍니다. 1. 사건의 개요 금일 ｢주가조작 근절 합동대응단｣ 은 글로벌 컨설팅회사 및 사모펀드 운용사 출신의 이른바 ‘금융엘리트’들이 연루된 M&A 관련 미공개정보 이용 혐의 사건과 관련하여 혐의자들의 근무지 및 자택 20여 곳 에 대해 일제히 압수수색 을 실시하였습니다. 아울러 부당이득의 은닉 등을 방지하기 위해 일부 혐의자의 계좌에 대해 지급정지 조치 를 시행하였습니다. 2. 조사 배경 및 경과 상장주식에 대한 공개매수 등 지배구조 개편 또는 M&A 정보 는 공표 즉시 주가에 상당한 영향을 미치는 대표적인 ‘ 호재성 중요정보 ’입니다. 이에 자본시장법 은 이러한 정보가 일반투자자에게 공개되기 전 에 이를 매매에 이용 하거나 타인에게 이용하게 하는 행위를 엄격하게 금지 하고 있습니다. 그럼에도 불구하고 M&A 과정에서 취득한 미공개정보 를 사전 에 유출 하여 주식 매매에 활용하고 부당이득을 취한 것으로 의심 되는 사례 가 자주 발생 하고 있습니다. 금감원과 한국거래소는 시장감시 과정에서 이러한 정황들을 다수 포착 하여 사건화하였고, 합동대응단 은 지난해 10월 공개매수 주관사인 NH투자증권 임원의 미공개정보 이용 혐의 에 대해 압수수색 등 강제조사를 실시하고, 올해 5월 해당 혐의자를 고발 하는 등 조치한 바 있습니다. 합동대응단은 금감원 과 거래소 가 최근 수년간 시장감시 를 통해 포착한 미공개정보 이용 사건 중 동일 혐의자 가 반복적 으로 연루 된 사건들을 합건 하여 심층 분석 할 필요가 있다고 판단했습니다. 사안의 중대성 과 강제 조사를 통한 증거 확보의 필요성 등을 종합적으로 고려하여, 올해 5월부터 합동대응단에서 관계기관 간 긴밀한 공조 아래 조사를 진행 해 왔습니다. 3. 혐의 내용 핵심 혐의자의 미공개정보 이용 흐름도 본 사건의 핵심 혐의자들은 명문대 경영동아리 와 글로벌 컨설팅회사 에서 함께 활동하며 인연을 맺은 사이로, 이후 각자 사모펀드 운용사 및 상장회사로 자리를 옮겨 공개매수 등 M&A 관련 업무를 수행 하였습니다. 이들은 최근 약 5년 동안 업무 과정에서 알게 된 다수 종목의 호재성 미공개정보를 계속적ㆍ 반복적으로 상호 공유한 것으로 파악 됩니다. 핵심 혐의자들은 해당 정보를 본인의 주식 매매에 이용하면서 가족· 지인 등에게도 전달하여 주식 매매에 이용하도록 하였습니다. 핵심 혐의자 및 그 가족·지인은 정보가 시장에 공개되기 전 해당 종목을 미리 매수 한 뒤, 정보 공개 이후 주가가 상승 하면 이를 고가에 처분 하는 방식으로 총 200억원 이상 의 부당이득 을 취득한 것으로 파악됩니다. 특히 본 사건은 특정 개인의 일회성 일탈이 아니라 내밀한 정보카르텔 內 에서의 정보 공유가 장기간 반복되었다는 점, M&A 관련 업무를 수행하는 과정에서 엄격한 비밀유지의무를 부담하는 전문인력이 정보의 원천 이었다는 점 , 정보가 가족·지인에게까지 전파 되어 불공정거래 행위자가 광범위하게 확대 되었다는 점에서 사안이 매우 중대합니다. 4. 사건의 의의 및 향후 계획 이번 사건 핵심 혐의자들의 개별 이상매매 양태는 그간 금감원 및 거래소 의 시장감시 과정에서 여러 차례 포착 되었으나, 정보 지득경로 등을 추단할 단서를 발견하기 어려웠습니다. 이에 합동대응단은 앞서 처리한 공개매수 주관사 임원의 미공개정보 이용 사건 등의 경험 을 바탕으로, 2026년 5월 부터 가용 조사인력 을 총동원 해 조사를 진행했습니다. 그 결과 핵심 혐의자들이 ‘ 정보 카르텔’ 을 형성해 미공개정보를 반복적으로 공유 해 온 전모 를 파악 할 수 있었습니다. 이번 압수수색으로 확보한 증거 등을 토대로 이러한 혐의를 명확히 입증 할 수 있을 것으로 기대하고 있습니다. 합동대응단은 지난 공개매수 주관사에 대한 압수수색 관련 보도자료를 통해 내부자의 미공개정보 이용행위를 주가조작과 동일한 중대 범죄행위로 규정 하고 위반 혐의자에 대한 무관용 엄중 조치 를 천명한 바 있습니다. 금일 압수 수색 및 지급정지 조치를 통해 내부자의 미공개정보 이용행위를 끝까지 추적해 부당이득을 환수한다 는 것을 다시 한번 확인시켜 드린다는 점에 의의가 있습니다. 앞으로 합동대응단은 임의조사･압수수색을 통해 확보한 자료 ･ 증거 등을 종합적 으로 분석 ･ 검토 하여 추가 조사 를 신속히 마무리 하고 엄정 조치 할 예정입니다. 또한 고발 및 부당이득의 최대 2배 에 달하는 과징금 부과 등 후속 조치 에도 만전 을 기하겠습니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 - 인터넷 : 금융위원회 홈페이지 내 ‘참여마당 → 불공정거래신고’ 메뉴 접속 ☞ 금융감독원 - 인터넷 : 금융감독원 홈페이지 내 ‘민원·신고 → 불법금융신고센터 → 증권불공정거래신고’ 메뉴 접속 ☞ 한국거래소 - 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) - 전 화 : 1577-0088", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "이찬진 금융감독원장, 증권회사 CEO 간담회 개최", "department": "자본시장감독국", "date": "2026-09-29", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232288&menuNo=200218&pageIndex=1", "summary": "□ ’26.9.29.(화) 이찬진 금융감독원장은 23개 증권회사 CEO들과 간담회를 개최하여, 최근 증권업계의 현안과 방향을 논의하고, 업계 건의사항을 청취하는  소통의 자리를 마련하였음\n□ 이찬진 금융감독원장은 올해 증시 변동성이 크게 확대되어 상당수 개인투자자에게는 어려운 시기였다는 점을 안타깝게 여기면서,\nㅇ 증권업계는 상반기에만 지난해 연간실적에 육박하는 비약적인 성과를 거둔 만큼, 존립기반인 투자자와의 동반성장에 책임을 다해야 할 때임을 강조하고, 투자자의 굳건한 신뢰 없이는 증권산업의 미래를 장담할 수 없다며 당부사항을 전달하였음\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "취약계층 보호 및 금융소비자 편의 제고를 위해 은행권 최저생계비 조회용 계좌통합조회서비스를 시행합니다", "department": "은행검사2국", "date": "2026-09-29", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232271&menuNo=200218&pageIndex=1", "summary": "□ 그간 대다수 은행 등은 자행 대출과 예금을 상계하면서 상계가 금지되는 최저생계비 상당 예금(민사집행법 상 압류금지채권)의 입증자료로 법원 판결문만을 인정해 왔습니다.\nㅇ 법원이 법원 판결문(또는 결정문) 이외의 방법에 의한 최저생계비 입증을 인정하고 있음에도, 비용과 시간이 소요되는 법원 판결문 요구는 고객 불편을 초래하고 있습니다.\n□ 이에 금융감독원은 금융결제원과 함께 취약계층에 대한 보호 등을 위해 최저생계비 입증자료 확대,간소화를 추진하였고,\nㅇ 금융결제원은 은행권과 업무협의를 통해 최저생계비 조회용 계좌조회시스템을 개발하고 테스트를 진행하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "합동대응단은 명문대 경영동아리 출신 정보카르텔을 적발하여 압수수색을 실시하고 혐의자 재산을 동결하였습니다", "department": "조사3국", "date": "2026-09-29", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232253&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융위, 금감원, 거래소 「주가조작 근절 합동대응단」(단장 황선오)은 상장사 공개매수 등 지배구조 개편 또는 M&A 정보를 이용하여 200억원 이상의 부당이득을 취한 미공개정보 이용세력을 적발하였습니다.\nㅁ 본 사건의 핵심 혐의자들은 명문대 경영동아리, 글로벌 컨설팅회사 출신으로 일종의 ‘정보카르텔’을 형성하고, 상장사 내부정보를 공유하며 가족, 지인들을 가담시켜 장기간 조직적으로 미공개정보를 이용한 사건입니다.\nㅁ 금일(9.29.) 합동대응단은 혐의자들의 자택, 사무실 등 20여 곳에 대한 압수수색을 전격 실시하여 현재 진행 중인 사건의 현장 증거를 확보함과 동시에,증권선물위원회(위원장 권대영)는 미공개정보 이용으로 취득한 부당이득이 보관된 혐의자의 증권계좌에 대해 자본시장법에 따른 지급정지 조치를 시행하여 취득한 부당이득을 남김없이 환수할 수 있는 선제적인 조치를 완료하였습니다.\nㅁ 본 사건은 거래소의 시장감시 과정에서 최초 포착한 후 합동대응단에서 기관 간 긴밀한 공조 조사를 통해 혐의를 추가 포착한 사건으로, 향후 압수수색 결과를 바탕으로 신속히 조사를 마무리하여 엄정 조치할 예정입니다.\nㅁ 합동대응단은 앞서 공개매수 주관사 임원의 미공개정보 이용행위에 대한 압수수색 및 조치를 완료하고 이번에 금융전문가로 구성된 ‘정보카르텔’ 세력을 적발함에 따라,\nㅁ 상장사 미공개정보를 이용한 불공정거래 행위는 끝까지 추적해 우리 자본시장에서 발붙일 수 없도록 함으로써, 일반 투자자들이 정보의 비대칭으로 불이익을 받지 않도록 지속적으로 감시,조사,엄단 하겠습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "2026년 상반기 금융민원 접수 및 처리 동향", "department": "소비자소통국", "date": "2026-09-29", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232216&menuNo=200218&pageIndex=1", "summary": "□ (접수현황) ’26년 상반기 금융민원 접수건수는 78,979건으로 전년 동기(56,633건) 대비 39.5%(+22,346건) 증가\nㅇ 일반민원은 51,979건으로 전년동기 대비 38.3%(+14,398건) 증가하였고, 분쟁민원도 27,000건으로 전년동기 대비 41.7%(+7,948건) 증가\n□ (처리현황) 민원증가에 대한 적극적 대응으로 ’26년 상반기 민원 처리건수는 78,462건으로 전년 동기(59,463건) 대비 32.0%(+18,999건) 증가\nㅇ 일반민원은 52,715건으로 전년동기  내용 :\n- 지수ID : 지수명\nM2A02P : 코스피 200 커버드콜 5% OTM 채권 혼합지수(KOSPI 200 Covered Call 5% OTM and Bond Balanced Index)\n-> 기준시점 및 기준지수 : 2024.01.02 = 1,000p\n- 지수(DATA구분:A5)에 지수ID 추가\n- 시장구분코드 : 차세대이후(2023.01.25~) 추가되는 지수는 스페이스로 제공됨\n- 지수그룹 2\n- 파일 송신시간 : 17:30\n2. 상세스펙 : https://data.koscom.co.kr 에 공지 예정\n(접속표준서->KRX시장정보상품->주간종가정보->지수정보, 접속표준서->KRX시장정보상품->공통정보->코드값모음집)\n3. 테스트일정 및 방법\n- 테스트일정 : 2026.10.06(화) ~ 2026.10.23(금), 회원사 테스트 시간 내\n- 샘플파일 제공 : 2026.10.08(목) 본게시물 첨부파일로 제공 예정\n4. 가동일\n- 일정 : 2026.10.26(월)\n5. 소급지수 제공 : 2026.10.26(월)\n※MDCS내 본 게시물 첨부파일로 제공 예정\n6. 담당자\n- IT : (KRX) 조하은 과장(02-3774-9784)\n(코스콤) 김성섭 차석(02-767-7434), 정성운 과장(02-767-7408), 박시현 과장(02-767-7404)\n- I/F 및 테스트파일, 개발가이드 제공 문의 : 이주호 부장, 허대원 과장(대표번호: 02-3774-9684)\n* 감사합니다.", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "권대영 부위원장,제2차 국민참여성장펀드 출시 첫날펀드가입 및 현장점검", "department": "국민지역참여지원과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87819", "summary": "권대영 부위원장, 제2차 국민참여성장펀드 출시 첫날 펀드가입 및 현장점검 권대영 금융위 부위원장 은 9월 30일(수), 제2차 국민참여형 국민성장펀드 (이하 ‘ 국민참여성장펀드 ’) 판매처 중 하나인 NH농협은행 정부서울청사지 점을 방문해 펀드에 가입 하였다. ※ 국민참여성장펀드 주요내용은 \u003c붙임> 참조 권 부위원장 은 일반 국민들이 펀드 가입 시 거치게 되는 투자자 성향 분석 , 펀드 중요사항 확인 (투자설명서, 약관 등) 등 펀드 가입 과정의 전반 을 직접 경험 하며, 가입 절차상의 편의성과 애로사항 등을 점검 한 후 펀드 가입서류에 서명하였다. 펀드 가입을 마친 권 부위원장 은 “ 국민참여성장펀드가 국민에게는 미래 전략산업 성장의 과실을 함께 나누는 의미있는 투자 기회 가 되고, 첨단전략산업 기업에는 성장에 필요한 자금을 원활히 공급하는 상생의 발판 이 될 것”이라고 언급하면서, “ 금년부터 5년간 매년 6천억원 조성 을 목표로 지난 5월에 처음 출시되었 는데, 첫 날 약 87%가 판매 되는 등 국민들의 수요가 매우 높음에 따라 2차 펀드 출시를 앞당기게 됐다 ”고 배경을 설명했다. 권 부위원장은 “2차 펀드는 보다 많은 국민들께 기회를 드리자는 취지에서 1차 펀드 가입자는 제한 하였으며, 1차 때 서민 판매분 (약 35%) 이 목표치 (20%) 를 초과함에 따라 금번 2차 펀드 에서는 첫 5영업일 동안 판매되는 서민 우선 배정 물 량을 50%로 대폭 확대 하였다”고 강조했다. 아울러 국민들의 가입 편의 를 제고 하기 위해 기존에는 직접 제출 해야 했던 소득증빙서류를 공공 마이데이터 등을 통해 전산으로 제출 하도록 간소화하였다는 점도 밝혔다. NH농협은행 정부서울청사지점 정영호 지점장 은 1차 가입자 제한 과 서민 배정 확대 등 1차 펀드 때와 달라진 점을 감안하면, 2차 펀드의 판매 속도는 다소 느리게 진행 될 수 있으나, 높은 세제 혜택 (투자금의 최대 40%까지 소득공제, 배당소득 9.9% 분리과세) 과 정부 재정 등이 일부 손실을 우선 부담 하는 상품 특성 등을 감안할 경우 매력적인 투자 상품 이라고 생각한다고 언급하였다. 권대영 부위원장은 오늘부터 판매가 개시된 국민참여성장펀드가 세제 혜택 및 재정 등의 일부 손실 부담 이점은 있으나, 5년 만기의 폐쇄형 (환매금지형) 상품 인 점 , 아울러 원금이 보장되지 않는 투자 상 품인 점 등을 감안하여 판매 기관들 은 현장에서 고객 에게 이를 충분히 안내 하고, 불완전판매가 발생하 지 않도록 만전을 기해 줄 것 을 당부하였다. 정부도 펀드 가입 과정 등에서 국민들의 불편함을 최소화 하기 위해 현장의 상황을 실시간으로 점검 하고 필요시 신속하게 애로를 해소 하겠다고 하였다. 마지막으로 , 권 부위원장은 “ 아름드리 나무도 작은 싹에서 자라나듯 , 오늘 국 민들 께서 심으신 싹 이 대한민국 미래산업 으로 자라나고 그 성장의 열매 가 국민들께 돌아갈 수 있도록 성심성의껏 잘 관리 해 나가겠다”고 밝혔다.", "essential": false, "importanceReasons": ["event / ceremony (-2)", "strong keyword in body text (+1)"]}, {"source": "FSC", "title": "의료계·플랫폼 협력으로 “실손24” 연계율 제고 나선다.", "department": "보험과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87818", "summary": "의료계·플랫폼 협력으로 “실손24” 연계율 제고 나선다. ◈ 소비자가 앱으로 요청 하면 병원 이 실손보험금 청구서류 를 보험회사로 자동 으로 보내주는 실손보험 청구전산화 시행 (‘24.10.25일) 2년 이 경과 ㅇ 매년 수천억원 에 달하는 未청구 실손보험금 을 국민께 돌려드릴 수 있는 제도로, 현재 전국 약 5만개 병·의원 및 약국 에서 사용 가능 * 현재 전체 의료기관 105,643개 중 50,340개(47.7%) 연계 (9.28일 기준) ◈ 연말 까지 병·의원의 실손24 연계율 80~90% 를 목표로 의료기관에 대한 현장 지원을 강화 하고, 연계 의무를 강화 하는 법률개정 추진 검토 ㅇ 직접 의료기관에 연락하거나 방문 하여 실손24 연계 를 지속 설득 하는 한편, 의료기관에 연계 인센티브 를 제공 ㅇ 의료기관 및 EMR업체 의 실손24 연계 의무 를 명확히 하고, 필요시 정당한 사유 없는 미연계 에 대한 과태료 를 부과 하는 보험업법 개정 추진 * Electronic Medical Record 업체: 전자의무기록을 전산처리하는 프로그램 개발·제공 ◈ 실손24 의 편리함 을 누리는 소비자가 더 많아질 수 있도록 플랫폼·금융앱 연계 를 확대하고 대국민 홍보 도 강화 ㅇ 네이버 지도 등 익숙한 플랫폼 및 금융앱에서 실손24를 이용 할 수 있는 의료기관을 손쉽게 찾고 , 편리하게 청구 할 수 있도록 연계 강화 ㅇ 복지부 와 공동으로 방송매체 (TV, 라디오) , 온라인 , 병원 내 홍보를 진행하고, 실손24 대국민 홍보영상 공모전 등을 통해 관심 촉구 I. 회의 개요 ’26.9.30일(수), 권대영 금융위원회 부위원장 주재 로 의료계와 보험업계가 공동으로 참여 하는 법정회의체 인 ‘실손전산시스템운영위원회 (이하 “실손전산운영위”) ’ 겸 실손보험 청구전산화 (실손24) 점검회의 를 개최하였다. 오늘 회의에는 보건복지부 , 금융감독원 등 유관기관 , 생·손보업계, 의약단체, 전문가 와 실손보험 청구전산화 서비스를 자사 플랫폼과 연계하는 네이버파이낸셜 (주) 과 ㈜ 비바리퍼블리카 (토스)가 참여하여, 실손보험 청구전산화 추진 실적 및 의료기관 연계현황을 점검 하고 연계율 제고 및 소비자 편의 증진을 위한 과제 등을 심도 있게 논의 하였다. * 실손전산운영위는 보험업법 §102-7④, 동법 시행령 §48-4에 근거 \u003c 실손보험 청구전산화 점검회의 개요 > ▪ (일시 / 장소) ‘26.9.30(수) 10:00 / 손해보험협회 ▪ (참석) 금융위원회 (부위원장 주재) , 보건복지부, 금융감독원, 보험개발원, 생·손보업계 의사협회, 치과의사협회, 한의사협회, 약사회 이봉주 교수 (경희대) , 김재영 변호사 (태평양), 최영현 선임고문 (마콜컨설팅) 네이버파이낸셜(주), ㈜비바리퍼블리카 ※ 병원협회, 소비자연맹 일정상 불참 이에 앞서 금융위원회는 ‘26.9.28일(월) 김진홍 금융산업국장 주재 로 사전점검회의 를 개최하였다. 사전회의 에는 금융감독원, 보험개발원 등 유관기관 , 생·손보협회 , 플랫폼 서비스 운영사 및 EMR업체 (GC메디아이, 이지스헬스케어, 비트컴퓨터, 오스템임플란트) 가 참여하여 연계율 제고를 위한 그간 노력과 향후 정책 방향 에 대해 논의 하였다. Ⅱ. 부위원장 모두발언 권대영 부위원장 은 실손보험 은 약 4천만명의 국민 이 가입한 제2의 건강보험으로서, 실손보험 청구전산화 시스템 은 국민의 실손보험금 청구 편의성 을 획기적으로 높일 수 있는 사 실상의 공적 인프라 라고 소개하였다. 국민들께서는 다양한 의료 서비스를 이용하고 동 시스템을 통해 보험금을 간편하게 청구 할 수 있어, 실손보험에 가입한 대다수의 국민들께 혜택 을 드릴 수 있는 공적 서비스라고 강조하였다. 그러나, 실손보험 청구전산화 제도 시행 이후 2년 이 지난 지금까지도 의료기관 연계율은 47% 수준에 그치고 있어, 국민들께서 직접적인 효용 을 느끼기에는 아직 부족한 상황 이라고 평가하였다. 현재 연계율 제고가 정체 되는 것은 의료기관의 낮은 관심 에 기인한 바가 크다고 하면서, 실손24 제도에 대한 의료기관의 적극적인 관심과 참여 를 당부하였다. 의료기관과 EMR업체의 자발적인 협조만으로는 연계율 제고가 어렵다고 판단되는 경우 , 미연계 업체에 과태료 부과를 할 수 있는 보험업법 개정 등을 추진할 방침 임을 밝혔다. 아울러, 국민 께서 전국 어느 병·의원 에서나 실손보험금을 손쉽게 청구 할 수 있도록 최선의 노력을 다하겠다고 밝혔다. 아직 실손보험 청구전산화 서비스가 생소한 국민 을 대상으로 대국민 실손24 홍보 캠페인 을 진행하고, 국민 이 실손24 참여 병원 을 알고 더 쉽게 이용할 수 있도록 플랫폼과의 연계를 통해 청구 절차 및 청구 안내를 개선 해 나갈 계획이라고 하였다. 또한, 의약단체 의 참여를 독려하기 위한 공문 발송 등 복지부와도 지속적으로 협조 해 나가겠다고 하였다. Ⅲ. 실손보험 청구전산화 개요 실손24 서비스 개요 실손보험 청구전산화 는 실손24 앱 등을 통해 소비자가 요청 하는 경우, 별도의 종이서류 발급 없이 병원이 직접 영수증, 세부산정내역서, 처방전 을 보험사로 전자적으로 전송 하여 실손 보험금을 간편하게 청구 할 수 있도록 하는 서비스이다. (참고1) * 실손보험 계약을 보유하고 있는 국민 누구나 ｢실손24｣ 앱 또는 홈페이지를 이용하거나, 플랫폼 (예: 네이버, 토스) 에 접속 하여 실손보험금 청구 서비스를 이용 가능 소비자는 실손24 앱, 홈페이지 등에서 본인확인 을 거쳐 보험계약과 진료내역을 선택 하고 청구서를 작성 한 후 전송을 요청 하면 된다. 과거 실손보험금을 청구 하기 위해서는 병원에서 영수증, 세부산정내역서 등 종이서류를 발급 받아 사진을 찍거나 따로 제출해야 하는 번거로움 이 있었으나, 실손24를 통해 서류를 직접 떼고 제출하는 수고를 줄여 소비자가 실손보험금을 손쉽게 청구 할 수 있도록 지원한다. 병원 등 의료기관 참여 현황 실손보험 청구전산화 (이하 청구전산화) 는 ’24.10.25일 병원급 의료기관과 보 건소 (1단계, 약 7.8천개) 를 대상으로 우선 시행된 후, ’25.10.25일부터 의원 및 약국 (2단계, 약 9.8만개) 까지 확대 시행 되었다. ’26.9.28일 기준, 총 50,340개 의료기관 (병원 1,107개, 보건소 3,578개, 의원 24,995 개, 약국 20,608개) 이 참여 하고 있으며, 연계 의료기관 개수 기준 연계율은 약 47.7% (1단계 연계율 약 60.0%, 2단계 연계율 약 46.7%) 이다. 실손24 서비스에 약 521만명이 가입 하였으며, 서비스 개시 이래 ‘26.9.28일 현재까지 실손24를 통해 청구된 건수는 461만건 수준 이다. \u003c 청구전산화 요양기관 연계 현황 (’26.9.28일 기준, 개) > 구 분 병원·보건소(1단계) 의원·약국(2단계) 합 계 전 체 7,810 (100%) 97,833 (100%) 105,643 (100%) 연계 예상 1) 4,865 (62.3 %) 96,685 (98.8%) 101,550 (96.1%) 연계 완료 2) 4,685 (60.0 %) 45,655 (46.7%) 50,340 (47.7%) 23 1) 연계 예상 : 실손24 참여에 동의하거나 (1단계) 실손24 참여 EMR을 이용하는 요양기관 (2단계) 2) 연계 완료 : 실손24 연계가 완료되어 청구전산화 서비스를 이용할 수 있는 요양기관 Ⅳ. 실손보험 청구 전산화 활성화 방안 온라인 플랫폼을 통한 실손24 이용편의 개선 오는 10.7일 부터는 플랫폼 (네이버, 토스)을 통한 실손보험 청구전산화 서비스 가 개선된다. 기존에는 플랫폼(네이버, 토스)을 통해 실손보험 청구 전산화 서비스 를 이용하더라도, 실손24 사이트로 이동하여 청구하도록 했다. 10.7일부터는 많은 국민이 이용하는 네이버 지도, 네이버 페이, 토스 앱 내에서 실손보험금 청구 가 완결적으로 이루어질 수 있도록 개선한다. 또한, 마이데이터 이용에 동의한 소비자는 해당 앱에서 다녀온 의료기관(병원, 약국), 진료일, 보험사, 계좌번호 등을 별도로 입력하지 않아도 손쉽게 실손보험금을 청구 할 수 있다. 이를 통해 소비자의 실손보험 청구전산화 이용의 편의성이 한층 개선될 것으로 기대된다. 네이버 지도앱상 실손24 참여병원을 명확히 표기 네이버 지도 에서 실손24 참여 병원 표시방식도 개선 된다. 기존에도 네이버 지도에서 실손24를 검색시 연계병원이 단순 표시 되었으나, 소비자가 실손24 청구 가능 병원을 보다 쉽게 알 수 있도록 실손24 참여병원 은 병원 상세화면 에서 별도의 배너로 표시 하고, 지도에서 실손보험 청구 서비스 를 바로 이용할 수 있도록 연결 링크를 추가 한다. 또한, 네이버 포털사이트 나 네이버 지도 에서 병원을 검색할 경우, 현재는 진료과목, 진료시간 등의 필터를 통해 소비자 필요에 맞는 병원을 골라 볼 수 있으나, 실손24 필터도 추가 하여 소비자가 실손24를 통한 간편 실손보험금 청구가 가능한 병원만 을 골라 볼 수 있도록 하였다. Ⅵ. 향후 추진계획 정부는 청구전산화 상황을 지속적으로 점검하면서 연말까지 실손24 연계율 80~90% 달성 을 위해 노력할 것이다. 의료기관이 실손24에 연계하는 절차를 최대한 간소화할 수 있도록 EMR업체와도 협의를 지속하는 한편, 직접 미연계 의료기관 을 방문하여 참여를 설득하는 노력도 병행할 예정이다. 또한, 의료기관 도 실손24 참여에 따른 편익을 누릴 수 있도록 실손24 앱상 참여병원 소개기능 추가 등 인센티브를 제공 할 방침이다. 보건복지부와 협업 도 강화한다. 의료기관의 실손24 참여에 걸림돌이 되는 인증서 발급 간소화 등을 위해 지속적으로 협의하고, 未참여 의료기관과 지역 공공병원 대상 공문 등 발송 을 통해 청구전산화 참여가 法상 의무 임을 안내하고 참여를 촉구 할 예정이다. 실손24 서비스에 대한 대국민 홍보도 강화 한다. 10월 중 에는 방송매체 (TV, 라디오), 온라인, 병원 내 키오스크 등을 통해 집중 홍보 를 진행한다. 11월 부터는 실손24 대국민 인지도 를 한층 높이기 위해 국민 참여형 영상 공모전 등을 진행하는 등 국민의 이용과 참여를 적극적으로 유도 할 방침이다. 이를 통해, 실손24 이용으로 의료서비스를 이용하는 국민의 편의 가 직접적으로 높아질 수 있음 을 적극 알릴 계획이다. 이밖에도, 정부는 국민들이 청구전산화 서비스를 이용함에 있어 직면하는 애로나 불편 사항들을 지속 모니터링 하고 필요한 제도 개선 을 적극 추진해 나갈 계획이다.", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "이억원 금융위원장, 글로벌 증시 핵심 인프라 기관  美 나스닥(Nasdaq), 美 DTCC*, 홍콩거래소(HKEX) 면담", "department": "자본시장과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87812", "summary": "[코리아 프리미엄 위크 2026] 이억원 금융위원장, 글로벌 증시 핵심 인프라 기관 美 나스닥 (Nasdaq) , 美 DTCC * , 홍콩거래소 (HKEX) 면담 * 美 증권예탁결제원(Depository Trust & Clearing Corporation) - 토큰증권 발전방향 , 결제주기 단축 (T+1일) 등 미래 자본시장 과제와, 세그먼트 분리 , 상장폐지 등 시장 역동성 제고 를 위한 주요 정책 에 대한 美 ‧ 홍콩 의 경험과 동향 을 공유하고 향후 협력 방안 을 논의 이억원 금융위원장 은 9월 29일(화) 美 나스닥 (Nasdaq) 부회장 밥 맥쿠이 (Bob McCooey) , 美 증권예탁결제원 DTCC (Depository Trust & Clearing Corporation) CRO 티모시 커디히 (Timothy Cuddihy) , 홍콩거래소 (HKEX) 유태석 전무 와 면담 하였다. 양측은 토큰증권 발전방향 , 결제주기 단축 (T+1일) 등 미래 자본시장 과제 와 함께, 시장 세그먼트 분리 , 상장 폐지 등 시장 역동성 을 제고하기 위한 주요 정책 에 대한 미국 과 홍콩 의 경험 과 동향 을 공유 하고 향후 협력 방안 을 논의 하였다. 美 DTCC 측은 앞으로 토큰증권 이 글로벌 자본시장 을 이끌 핵심 미래 산업 이 될 것으로 전망 하며, 현재 는 전통적인 증권 상품 을 중심 으로 논의 가 진행 되고 있지만, 향후 다양한 신규 상품 으로 토큰화 가 확대 되는 등 무한한 성장 가능성 이 열려있다고 견해 를 밝혔다. 아울러, 美 토큰증권 산업 육성 을 위한 나스닥-DTCC 간 긴밀한 협력 관계 를 강조 하며, 한국 도 `27.2월 전자증권법 시행 으로 본격적인 토큰증권 생태계가 구축 될 예정 인만큼 안정적인 시장 육성 과 글로벌 이니셔티브 (Initiative) 확보 를 위해서는 정부 정책 을 바탕 으로 거래소 ‧ 예탁원 등 유관기관 간 세부 제도들 을 긴밀히 조율 하는 과정이 중요 하다고 강조 하였다. 美 나스닥 측은 시장 경쟁력 강화 를 위해 단행했던 시장 세그먼트 분리 (글로벌 셀렉트- 글로벌-캐피탈 마켓) 및 1달러 미만 동전주 (Penny Stock) 상장 폐지 제도 운용 경험 을 공유 하였으며, 나스닥 이 가지고 있는 다양한 지수 , 지수 연계 상품 사례 를 바탕으로 향후 한국 ETP 시장 의 발전 방향 에 대한 의견 을 교환 하였다. 홍콩거래소 와는 결제주기 단축 (T+1) 추진 동향 을 논의 하였다 (홍콩 : `26.4월 `27.하반기로 단축계획 발표) . 홍콩거래소 측 은 결제주기 단축 이 국내 투자자, 외국인 투자자, 증권사‧수탁은행 등 다양한 시장 참여자별 이해 관계 와 애로사항 을 면밀히 고려 해야 할 고난이도 과제 라면서, 특히 토큰증권 도입, 거래시간 연장 등 다양한 IT 시스템 개발 이 동시에 진행 되는 상황 에 서의 인력 ‧ 시간적 부담 , 아시아-영미권 간 시차 에 따른 현실적인 제약 등을 종합적 으로 고려 하여 추진해야 하는 사항 이라고 언급하였다. 이에 대해, 이미 결제주기 단축 (T+1일) 을 이행 한 美 DTCC 측 은 미국 이 약 3년 이상 의 준비 과정 을 거쳤음을 밝히며, 추진 과정 에서 다양한 시장 참여자들 과 보조 를 맞출 필요 가 있다고 강조하였다. 이억원 금융위원장 은 “ 글로벌 핵심 인프라 기관 들의 생생한 성공 경험 과 시행착오 사례 는 향후 우리 정책 추진 과정 에 선제적 가이드라인 이 될 값진 조언 ”이라고 감사를 표하며, “앞으로도 글로벌 자본시장 과 한국 자본시장 이 함께 성장 할 수 있도록, 열린 자세 로 지속적 으로 교류 하고 긴밀히 소통 해 나가겠다”고 덧붙였다. \u003c ※ (참고) 면담자 주요 정보 > \u003c ※ 첨부 : 면담 사진 >", "essential": false, "importanceReasons": ["event / ceremony (-2)", "strong keyword in body text (+1)"]}, {"source": "FSS", "title": "범 금융권, 유관기관과 함께 「사회진출前 금융소양교육」을 전면 실시합니다!", "department": "금융교육국", "date": "2026-09-30", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232662&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융감독원은 범 금융권, 유관기관과 함께 진학,취업 등으로 사회진출을 앞둔 고3 학생들을 대상으로 「사회진출前 금융소양교육」을 전면 실시\nㅇ '26.7.20.(월)부터 전국 고등학교로부터 일반계,직업계를 구분하여 신청을 받고 있으며 연말까지 교육을 실시할 예정\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "주요 민원사례로 알아보는 금융채권추심 관련 소비자 유의사항", "department": "소비자소통국", "date": "2026-09-30", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232661&menuNo=200218&pageIndex=1", "summary": "□ 개인채무자보호법 시행 등 금융채권추심 관련 제도 변화에 따라, 채권추심 절차와 채무자의 권리에 대한 금융소비자의 관심이 높아지고 다양한 민원이 제기되고 있습니다.\nㅇ 이에 금융감독원에 접수된 주요 민원사례를 통해 1.소멸시효 완성 금융채권추심, 2.추심연락 제한 및 불법추심 피해구제, 3.추심연락 유예, 4.채무조정 지원제도 등에 대한 소비자 유의사항을 안내드립니다.\n\u003c소비자 유의사항>\n1. (소멸시효) 소멸시효 완성 채권에 대해 추심받을 경우 시효가 완성되었음을 적극 주장해야 하며, 판결로 확정된 채권은 시효가 새로이 10년으로 연장됩니다.\n2. (추심연락제한) 추심 연락은 7일에 7회를 초과할 수 없으며, 불법추심이 의심될 경우 녹취 등 객관적 증거자료를 확보해 두면 피해구제에 도움이 됩니다.\n3. (추심연락유예) 중대한 재난상황에 처하였거나 사고 등으로 즉각적인 변제가 곤란한 경우 추심연락의 유예를 신청할 수 있으며, 특정한 시간대 또는 특정한 수단을 통하여 추심연락을 하지 않을 것을 요청할 수 있습니다.\n4. (채무조정) 채무변제에 어려움이 있는 경우 채권금융회사 및 신용회복위원회 채무조정 지원제도 등을 활용할 수 있으며, 대출 필요시에는 서민금융통합지원센터에 정책상품 이용가능 여부를 먼저 상담해 보는 것이 좋습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["statistics / advice (-2)"]}, {"source": "MOFE", "title": "외환자본시장 제도개선 설명 및 현장안착 점검을 위한 제2차 글로벌 핵심 투자자 협의체 개최", "department": "국제금융과", "date": "2026.09.30.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079488&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["rule change (+2)", "event / ceremony (-2)"]}, {"source": "KRX_OPEN2", "title": "회수시장 활성화를 위한 유관기관 '세컨더리 펀드' 조성", "department": "", "date": "2026-09-30", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe36478 전후 2개월 간(9.1~10.31) 서민·취약계층·청년층의 현장애로 완화를 위해 정책서민금융( 4,800억원) 자금 적극 공급 중  지역 소상공인 현장 간담회 를 통해 소상공인 더드림 패키지 개편방안, 복 합지원 체계 및 기관별 소상공인 지원 사업 소개 및 의견 청취 - 성실 상환 소상공인에 “더 낮은 금리”, “더 높은 한도”로 지원하는 “ 소상공인 더드림 패키지 ”를 10.5조원에서 12.3조원 으로 확대·개편 · 특히, 고금리·고물가 등으로 경영애로 를 겪는 소상공인을 집중 지원 예정 (7.8조원) - 소상공인 지원 강화 를 위해 한국자산관리 공사(새출발기금)와 복합지원 연계 개시 (9.30일 자) 및 기업은행, 신용보증기금과도 연계 추진(’27.上) 이억원 금융위원장 은 ’26.9.30일(수) 황기연 전남광주통합특별시 행정부시장, 김은경 서민금융진흥원장(신용회복위원장 겸임), 정일선 광주은행장 등 지방정부, 유 관기관, 지역 민간금융사와 함께 「전남광주 서민금융 복합지원센터 (이하 ‘전남광주 복합지원센터’) 개소식」 에 참석하여 센터 개소를 축하 하고 관계자 들을 격려 하였다. 개소식 이후에는 이예순 광주소상공인연합회 회장 (직 무대행) 및 지역 소상공인, 광주은행, 유관기관 이 참여한 가운데 「 지역 소상공인 현 장 간담회 」 를 통해 정부·유관기관의 복합지원 및 소상공인 지원 현황과 향후계획 을 공유 하고 의견을 수렴 하였다. \u003c 전남광주 서민금융 복합지원센터 개소식 및 소상공인 현장 간담회 개요 > ▪ (일시/장소) 9.30.(수) 13:30 / 전남광주 서민금융 복합지원센터 * 전남광주통합특별시 광산구 상무대로 198 ▪ (참석) 금융위, 지방정부, 유관기관, 지역 민간금융사, 지역 소상공인 등 - (개소식) 금융위원장 , 전남광주통합특별시 행정부시장, 서민금융진흥원장(신복위원장 겸임), 광주은행장 등 - (간담회) 금융위원장 , 서민금융진흥원장(신복위원장 겸임), 광주은행장, 광주소상공인연합회 회장(직무대행) 및 지역 소상공인, 한국자산관리공사, 신용보증기금, 기업은행, 소상공인시장진흥공단, 광주신용보증재단 등 Ⅰ 추진 배경 금융위원회 (이하 ‘금융위’)는 ’24년 부터 기관별로 흩어져있던 금융, 고용, 복지 등 서 비스 를 범정부 차원의 종합적 지원체계(“금융·고용·복지 복합 지원”) 로 묶어 제공·연계 하고 있다. 전국 52개 서민금융통합지원센터 또는 서 민금융플랫폼앱 ‘잇다’ 를 통해 원스톱으로 각종 서비스를 안 내·연계 하고 있으며, ’26년 6월까지 금융에서 고용 ·복지 등 유관 서비스로 연계된 건수는 누적 약 32만 건 에 달한다. 아울러, ’26년 6월 기준 복합지원 (금융-고용- 복지 연계) 이용자 의 대부업권, 저축은행 등 고금리 대부잔액 은 정책서민 금 융 단독 이용 자 보다 더 많이 감소 한 것(복합지원 이용자 △32.1%, 정책서민금융 단독 이용자 △29.2%)으로 나타나는 등 복합지원은 취 약계 층의 금융여건 개선과 재기 노력에 기 여 하고 있다. 한편, 지역 균형 발전 은 선택이 아닌 대한민국의 지속가능한 성장을 위한 필수전략 으로 금융도 이에 발맞출 필요 가 있다. 이에 금융위 는 복합 지원의 온기 를 거주 지역과 관계없이 누 구나 누릴 수 있도록 지방 정부, 유관기관, 지역 민간금융사와 함께 지역 밀 착형 복합지원 추진을 긴밀히 논의 해왔다. 특히, 지방정부 는 다양한 복지 서비스 제공을 담당하 고 있어 지역 내 경제적 어려움에 처한 분들을 발굴 하기 용이하며, 지방 은행 은 지역 산업구조와 경제여건 등에 대한 이해가 상대적으로 높은 만큼 서민·취약계층, 영세 소상공인의 자금·정책 수요 를 현장에서 파악해 각종 정책금융과 연계 하는 것이 수월할 것으로 기대된다. 특히, 전남광주 는 자영업자 가 지역 경제에서 차지하는 비중이 큰 지역 이다. ’26년 8월 기준 전남광주 지역의 자영업자 수 는 약 44만명 으로 지역 내 취업자 대비 비중은 전국 평균 대비 높은 수준 * 이다. 이러한 상황에서 전남 광주 지역의 고령화 수준이 높고, 인구감소도 빠르게 진행 ** 되고 있어 지역 소비 감소, 업황 부진 등 으로 인한 어려움에 대비 할 필요가 있다. 이러한 지역경제 특 성을 고려할 때 민관이 함께 지역 현장 에서 서민취약계층과 소상 공인의 금융수요를 세밀 하게 파 악 하고 수요에 맞는 금융·고용·복지 등 서 비스를 적시에 안내·연 계할 필 요 가 제기되었다. * (지역 내 취업자 대비 자영업자 비중, ‘26.8월, 데이터처 자료 가공) : ▲전남·광주 : 약 24%, ▲전국 : 약 20% ** 전남지역 고령인구 비율 전국 1위(27.3%) / 광주지역 인구감소율 전국 1위(△0.8%)(‘25, 데이터처 ) 이에 금융위는 전남광주 지역의 복합지원 체계를 강화 하기 위해 ’25년 4월 금융위와 광주광역시 간 복합지원 업무협약을 체결 하였으며, ’26년 5 월 서민금융진흥원 (이하 ‘서금원’) -신용회복위원 회 (이하 ‘신복위’) -광주은 행 간 지역 밀착형 복합지원 업무협약 체결 을 거쳐, ’26년 9월 전남광주 복합지원센터 개소 로 이어지게 되었다. Ⅱ 전남광주 서민금융 복합지원센터 개소식 전남광주 복합지원센터 는 지난 7월 개소한 부산 복합지원센터에 이어 전국 2번째로 개소 한 지역 밀착형 민·관 합동 서민금융모델 로, 중앙부처·지방 정부, 유관기관과 지역 민간금융사가 힘을 모아 금융·고용·복지 복합지원 체 계와 민간 제도권 금융을 한 공간에서 아우를 수 있 도록 설계 되었다. 전 남광주 복합지원센터 에는 서금원, 신복위, 광주은행, 미소금융법인 등 다양한 기관이 입주 하며, 전남광주 시민들을 위한 정책 서민금융, 채무조정, 고용·복지 등 복합지원 상담·연계 와 함께 광주은행이 제공 하는 금융상담 까지 원스톱으로 제공 하여, 복합적인 어려움을 겪는 전남광 주지역 내 서 민·취약계층과 영세 소상공인의 실질적인 재기를 지원 할 예정이다. 이에 더해, 광주은행 은 서금원 등 유관기관과 협업하여 전남광주 지역에 거주하는 복합지원 이용자 를 대상으로 금리우대 등 지역 특화 전용 대출· 적금상품 (전 남광주 희망사다리) 을 출시 한다. 해당 상품은 정책서민금융을 성 실상환한 취약차주가 보다 쉽게 제도권금융으로 안착할 수 있도록 지 원하기 위한 지역 기반 크레딧빌드업 (Credit Build-up)의 일환으로서 지역 내 금융희망사다리 역할 을 할 것으로 기대된다. 특히, 광주은행 은 지역 내 영세소상공인 (신고소득 연 5천만원 이하 및 전남 광 주시 소재 개인 사업자 고객) 을 대상으로 전남광주 희망사다리 대출상품 에서 0.5%p의 추가 우대금리를 제공 하고, 해당 상품 가입자 에게는 소상공인 컨설팅 서비스를 무상 제공 할 계획 이다. 아울러, 전남광주 복합지원센터 입주기관들은 센터 방문에 어려움을 겪는 지역 내 취약계층 지원을 위해 정기적으로 지역 곳곳을 방문 하는 ‘찾아 가는 복합지원’ 서비스를 실시하고, 정책서민금융 및 복합지원에 대한 전남광주 지역 주민들의 접근성을 제고 해 나갈 계획이다. 한편, 금융위 는 지난 9월 1일 발표된 ‘추석 민생안정대책’ (관계부처 합동)에서 추석 명절 전후 2개월 간 (9.1~10.31) 서민·취약계층·청년층을 대상 으로 하는 정책금융(햇살론, 햇살론유스) 공급규모를 전년 대비 4배 이상 확대(4,800억원) 하기로 하였다. 특히, 전남광주 복합지원센터 는 서금원과 광주은행이 한 공간에 상주 하는 만큼, 상기 상품의 상담, 신청부터 서금원 보증(100%), 은행 승인까지 원스톱 정책금융상품 지원도 가능 할 것으로 기대된다. 금융위 는 전남광주 복합지원센터 가 원활히 운영될 수 있도록 지방정부, 유관기관 등과 함께 적극 협업 하고, 대전, 강원 등 전국 광역권에서 서 민금융 복합지원센터 개소, 특화 금융상품 출시 등을 포함한 민·관 협업 기 반 지역 밀 착형 복합지원이 확산 될 수 있도록 지원해 나갈 계 획이다. 이억원 금융위원장 은 “ 전남광주 복합지원센터 는 전남광주 지역 주민과 소상공인 분들이 재기의 희망을 품을 수 있도록 돕는 희망의 사다리 가 될 것”이라며, “ 복합지원의 따뜻한 온기가 전남광주 지역에 더 많이, 더 넓게 퍼질 수 있도록 금융위가 지역 주민과 소상공인의 재기 과정의 페이 스메이커로 함께 뛰겠다 ”고 밝혔다. 아울러, “ 추석 민생안정 을 위한 4,800억원 규모 의 정책서민자금이 현장 의 자금애로 를 신속하게 완화 할 수 있도록 서민금융진흥원과 금융권 이 필요한 분들께 적극적으로 자금을 제공 해주길 바란다”고 당부했다. 황기연 전남광주통합특별시 행정부시장 은 “ 좋은 제도를 몰라 이용하지 못하는 시민이 없도록 적극 홍보 하고, 시민이 체감할 수 있는 금융지원을 위해 함께 노력 하겠다”고 밝혔다. 김은경 서민금융진흥원장(신용회복위원장 겸임) 은 “국민 누구나 사는 곳이 어디든 균등한 금융의 기회를 제공 받아 그 분들의 삶이 계속 이어지도록 하는 것이 저희의 핵심적인 역할 이다”라고 밝혔다. 또한, “부산과 전남광주 뿐만 아니라 복합지원센터를 전국적으로 확대 하여 지역의 취약계층과 소상 공인분들에게 든든한 버팀목이 되도록 노력 하겠다”라고 전했다. 정일선 광주은행장 은 “ 지역대표 금융기관 으로서 통합의 상징인 전남광주 지역에 ‘사람 살리는 금융’이 뿌리내릴 수 있도록 노력 하겠다”고 밝혔다. 아울러, 오늘 문을 여는 전남광주 복합지원센터를 통해 지역민이 필요한 순간 가장 가까운 곳에 있고, 다시 시작하는 순간 가장 든든한 힘 이 되는 금융을 실천하겠다 ”고 말했다. Ⅲ 지역 소상공인 현장 간담회 개소식에 이은 현장 간담회 에서는 지역 소상공인분들에게 금융·고용·복지 복합지원 체계 와 광주은행·유관기관 이 제공하고 있는 다양한 소상공인 지원제도 를 안내 하고 관련한 지역 소상공인분들의 의견을 청취 하였다. 1. 소상공인 분야 복합지원 연계 현황 및 향후계획 금융위 는 유관기관과 함께 ‘2026 복합지원 업무계획’ (’25.12월 발표)에 따라 소상공인분들께서 다양한 지원제도를 어디서든 편리하게 접 근하실 수 있도록 소상공인 지원 기관과의 복합지원 연계 확대를 추진 해왔다. 이에 따라 ’26년 3월부터 소상공인시장진흥공단과 복합지원 연계가 개 시 되었으며 전국 52개 서민금융통합(복합)지원센터 또는 소상공인지원센터 둘 중 어디를 방문하더라도 상담을 통해 필요한 경우 희 망리턴패키지, 정책서민금융 및 채 무 조정, 고용·복지 등 다양한 서비스를 원스톱으로 연계·지원 받을 수 있다. 이에 더해, 9월 30일부터 한국자산관리공사(이하 ‘캠코’)와 서금원· 신복위 간 복합지원 전산연계를 개시 한다. 이를 통해 복합지원 연계 서비스 에 새출발기금(매입형) 등 캠코에서 담당 중인 서비스가 추가 되고, 새출발기금(매입형), 새도약기금 등 이용자 도 복합지원 서비스를 안내·연계 받을 수 있게 되며, 각 기관 이용자에 대한 복합지원 서비스가 안정적으로 정착될 수 있도록 기관 간 연계 효과성을 지속 점검 할 예정이다. 아울러, ’27년 중 기업은행, 신용보증기금과 서금원, 신복위 간 복합지원 연계 가 이뤄질 수 있도록 지 원할 계획 이다 . 2. 소상공인 더드림 패키지 개편방안(기은·신보) 금융위는 작년 9월 금융채무를 연체없이 성실히 상환하고 있는 소상공인을 지원 하기 위해, 중소기업은행 (이하 ‘기은’) 과 신용보증기금 (이하 ‘신보’) 등 협업 하에 금리와 한도 등 우 대조건을 최대 한으로 적용하는 10조원 규모 의 “ 소상공인 더드림 패키지 프로그램 ”을 발표한 바 있다. 창업·성장·경영애로 등 상황별 자금 을 적극 지원 중이며, 총 8개 상품 을 순차적으로 출시하여, ’26년 8월 기준 누적 18,373건, 총 5.7조원이 지원 되었다. 그러나, 민생경제와 골목상권의 어려움 이 지속되고, 고금리 및 고물가로 인해 소상공인의 경영부담 이 가중될 우려가 높은 상황을 고려하여, 소상공인 더드림 패키지를 10.5조원에서 12.3조원으로 확대·재편 하여 소상공인을 더욱 적극 지원하기로 하였다. 특히 매출감소 등 애로를 겪는 소상공인에 대한 긴급유동성 지원 프로그램을 확대 하고 (3조원 → 4.8조원) , 원자재·이자 비용·인건비 등 경영비용 부담 증가 에 대비한 중장기 경영안정 및 회복지원 프로그램을 신설 (1.8조원) 하는 등 경영애로를 겪는 소상공인 을 보다 폭넓고 두텁게 지원 할 계획이다 (총7.8조원). 아울러, 일부 상품 지원요건 완화 , 공급 규모 조정 등을 통해 창업·성장·경영애로 등 소상공인 상황별 맞춤형 자금 이 적시 공급 되도록 개편할 계획이다. 3. 유관기관·민간 금융사의 소상공인 지원제도 현황 등 유관기관 에서도 소상공인 을 위한 정책금융 등 지원사업 을 전개하고 있다. 서금원 은 연소득 3.5천만원 이하인 영세 자영업자를 대상으로 미소금융 운영자금 (최대 2천만원 , 청년 최대 3천만원) 및 햇살론119 (최대 2천만원, 최초 이용시 최대 1천만원), 소상공인 특례 햇살론 카드 (보증한도 최대 5백만원), 등 정책금융상품과 함께 자영업 전문 컨설팅 등을 제공하고 있다. 신복위 는 다양한 채무조정제도 (신속·사전채무조정 , 개인워크아웃)를 통해 이자율 인하 또는 원금 감면, 분할상환(최장 10년)을 지원하며, 개인회생·파산 신청지원제도(패스트트랙) 를 운영중이다. 아울러, 소상공인 컨설팅 및 소액대출 (과목별 최대 1.5천만원, 이율 2~4%)을 제공하고, 불법사금융 신고 부터 초동조치, 피해구제로 이어지는 원스톱 지 원체계를 운영 하고 있다. 캠코 는 ’22년 10월부터 ’20.4월~‘25.6월 중 사업을 영위한 부실 또는 부실우려 소상공인 등을 대상으로 채 무조정을 지원하는 새출발기금을 운영 중 이다. ’26.8월 까지 누적 채무조정 신청자는 약 21.6만명 이며, 채무조정 신청액은 약 34.1조원 에 달한다. 이 가운데 약 15.2만명이 약 14조원 규모 채무조정 약정을 체결했다. 신보 는 재도전·재창업 지원 프로그램 을 통해 변제책 임이 있는 채무관계 자를 대상으로 구상채무 변제자금 또는 채무조정과 함께 신규 운영자금을 지원 하고 있다. 특히, 신보의 구상채무에 대한 성실 상 환자 등에게는 재창업 지원 특례보증 (보증비율 90%, 고정 보증료율 1%)을 지원하고 있다. 아울러, 소상공인 더드림패키지 를 통해 성장이 유망 하거나, 고물가·고환율 등으로 어 려움을 겪는 기업 에 우대자금을 지원 하고 있다. 기은 은 ‘소상공인 특화 신용평가체계(SCB) 도입방안’ (’26.4월, 금융위)에 따라 8월 말부터 시범운영을 실시 하여 SCB 우수등급(NICE 1~6등급) 소상공인을 대출 지원대상에 포함하고, 대출한도를 우대하고 있다. 아 울러, 2천억원 규모의 소상공인 상생·재기·회복 지원 프로그램 을 통해 여신 계 좌 적용 금리를 최대 2.0%p 이내 감면하는 등 ’26.8월까 지 219개사 대상 으로 총 882억원을 지원 하였다. 또한, 폐업 소상공인 대상 대환대출 을 제공하여 ’26.7월까지 총 3,101건, 963억원을 공급 하였다. 광주은행 은 지역 중소·소상공인 을 위한 특별자금대출 (운용한도 1.2조원, ’24~’26), 신규대출 지원 (약 4조원, ’24~’26.8월) 등 자금 공급과 함께 마케팅·경영진단·세무법률·점포운영 등 4대 전문분야 맞춤형 컨설팅 을 무료로 지원 (1,182건, ’ 24~’26.8월)하고 있다. 아울러, 광주·전남신용보증재단 등 지역보증기관에 매년 82억원을 특별출연 하여 지역 소상 공인의 특례보증 지원, 회생지원 보증 등을 지원하고 있다. 광주은행은 향후 소상공인 특별자금 대출 을 연간 5천억원 한도로 운용 하고 특별 금리감면, 보증서 대출 만기연장 지원 등을 제공하여 지역 소상공인의 금융비용 을 완화 할 계획이다. 아울러, 보증기관 등에 대한 특별출연 도 확대 할 예정이다.(’27년 100억원) 4. 참석자 주요 발언 및 마무리 이날 참석한 전남광주 지역 소상공인 들은 소상공인의 정책 금융 등 이용 과정에서의 애로사항 , 지역 밀착형 복합지원 활성화 등 과 관련한 다양한 의견을 제시하였다. 우선, 소상공인 더드림 패키지 를 통해 소상공인이 적기에 자금을 확보 했던 사례들이 공유 되었다. 30여년 간 종합소매업을 영위해 온 소상공인이 구도심 상권 변화에 대응 하기 위해 운전자금을 필요 로 하는 상황에서 기은 에서 자금을 적기에 대 출(IBK소상공인 희망Dream대출) 받아 안정 적 인 영업을 이어갈 수 있었던 사례 가 있었다. 또한 , 청년 소상공인 이 사업 확장을 위한 운전자금을 확보 해야 하는 상황에서 신보의 ‘소상공인 스텝업 특례보증’ 을 통해 자금을 적기 확보하여 매출 증가 및 사업확장을 실현한 사례 도 있었다. 관련해, 상권과 영업환경 변화 등으로 어려움을 겪거나 성장가능성이 높 음에도 자금을 원활히 확보하기 어려운 소상공인 이 자금 부족으로 경영 회복 또는 확장 기회를 놓치지 않도록 맞춤형 금융지원이 향후 지속 확대 되기를 기대 한다는 의견이 있었다. 복합지원 과 관련해서는 복합지원 연계 기관 간 행정정보나 기존 제출서류의 연계 를 통해 신청서 작성, 서류발급·제출과 관련한 소상공인의 편의를 제고 해달라는 의견이 있었다. 아울러, 많은 소상공인들이 금융지원제도에 대한 정보가 부족하고 생업으 로 인해 은행이나 관련 기관을 직접 방문하기 어려운 만큼, 찾아가는 복합지원을 금융기관 접근성이 낮은 지역 중심으로 지역 소상 공인 조직과 연계 하여 정기 운영 하고, 상담 이후 실제 지원여부까지 확인할 수 있도록 해달라는 의견이 제시되었다. 이억원 금융위원장 은 간담회를 마무리하며 “ 소상공인분 들을 위한 다양한 지원제도가 존재 함에도 바쁜 생업에 치여 위기 극복의 골든타임 을 놓치는 경 우가 잦다 . ”며, “소상공인 분들께서 보다 손쉽게, 더욱 편리하게 다양한 지 원제도를 안 내·연계 받으실 수 있도록 먼저 찾아가고 다시 일어설 때까지 손 잡아주는 정부 가 되겠다.”고 강 조 하였다. 금융위 는 오늘 간담회에서 제기된 소상공인분들의 다양한 의견을 들어 소상공인 지원방안에 대한 접근성과 신속성을 높이고 성실상환자에 대한 지원이 두터워질 수 있도록 소상공인 지원방안 후속조치, 복합지원 활성화 등을 유관기관과 긴밀히 논의 해 나갈 예정이다. \u003c별첨 1> 소상공인 더드림 패키지 개편방안 \u003c별첨 2> 개소식 축사 \u003c별첨 3> 간담회 인사말씀", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSC", "title": "10월 7일부터 2차 가입신청 시작! 청년미래적금 가입 전  달라진 절차와 주요일정을 확인하세요.", "department": "청년정책과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87820", "summary": "10월 7일부터 2차 가입신청 시작! 청년미래적금 가입 전 달라진 절차와 주요일정을 확인하세요. ▪ 10월 7~16일 (토·일·공휴일 제외) 까지 가입신청 , 가입심사 통과자 는 11월 16~27일 (토·일 제외) 중 계좌개설 ▪ 소상공인으로 가입신청 을 하는 경우, 운영 중인 모든 사업장 의 ‘ 소상공인확인서 ’를 청년미래적금 가입신청 전 에 발급할 필요 ▪ 청년도약계좌 가입자 의 청년미래적금 ‘갈아타기’ 기회 추가 제공 ▪ 신청단계에서 가입유형 을 직접 선택 하고, 사전심사 결과 안내 및 이의신청 절차 운영 등을 통해 가입심사 절차 보완 ▪군 입영 후 기초군사훈련 중인 경우에도 청년미래적금 에 가입 할 수 있게 청년미래적금 가입신청 및 계좌개설 지원 금융위원회 및 서민금융진흥원 은 10월 7일부터 시작 되는 청년미래적금 2차 가입신청 기간 운영 전 청년들이 가입과정에서 필요한 사항을 미리 확인 할 수 있도록 가입대상 , 가입신청·심사절차 및 청년도약계좌 에서 갈아타기 방법 등을 사전 에 안내 한다. 1. 가입연령 가입대상 은 만 19~34세 청년 이다. 이번 가입기간 에는 1991년 11월 17일생 * 부터 2007년 11월 27일생 * 까지 가 가입대상 이며, 병역 이행한 경우 최대 6년 의 병역 이행 기간 을 연령 계산 에서 제외 ** 한다. * 조세특례제한법령에 따라 가입일 (계좌개설기간, ‘26.11.16~27일) 에 만 19 ~ 34세인 청년 ** 예) 현재 35세인 자가 병역을 2년간 이행했을 경우, 2년을 차감한 33세로 간주하여 심사 2. 세부내용 청년미래적금은 가입자가 매월 최대 50만원 , 미성년 형제자매를 가구원으로 확정(신청인의 조(외조)부모는 부양 관계 확인 시 포함 가능) (2) 중소기업 재직자 중소기업 재직자 인 경우 신청 단계 에서 ‘ 중소기업 재직자’ 를 선택 해야 한다. 이후 개인·가구소득 요건과 함께 지원대상 중소기업 해당 여부를 심사 한다. 최종심사 에 앞서 사전심사 결과 를 안내 (10.30~11.2일 잠정) 하며, 사전심사 결과 에 이의 가 있을 경우 이를 소명 할 수 있는 기회 를 제공 한다. 아울러, 관계 기관 전산연계만으로 중소기업 재직 확인 이 어려울 경우 중소기업확인서 제출 이 필요할 수 있다. * 중소기업현황정보시스템 및 KoDATA 등을 통한 확인이 어려울 경우 가입자에게 중소기업확인서 제출 요청 가능 (단, 발급주체는 사업주이며, 발급에 약 일주일 이상 소요) 최종심사 결과 는 개별적 으로 통보 할 예정이며, 일정요건을 충족하는 중소기업 재직자 및 중소기업 신규 취업자 에 해당시 우대형 으로 분류 된다. 한편, 우대형 으로 가입한 중소기업 재직자 는 가입 이후 에도 재직 요건 을 유지 하여야 한다. 재직 요건 을 충족하지 못하는 경우 만기시 일반형 으로 전환 될 수 있으며, 이에 따라 기여금 등 일부 혜택 이 조정 될 수 있다. * 가입시부터 만기 한달 전 시점까지 총 29개월 이상 중소기업에 재직 (기간 내 최대 2회 이직 허용) (3) 소상공인 소상공인 자격 (매출액 심사) 으로 가입 을 희망 하는 경우에는 ‘가입신청 전’ 소상공인 확인서 를 발급 * 받아야 한다. 소상공인확인서 발급 후 취급기관 모바일앱에서 ‘소상공인’ 을 선택 해 가입신청하면, 매출액·업종 등 관련 요건 을 심사 할 예정이다. * 중소기업현황정보시스템(sminfo.mss.go.kr) 접속 → 회원가입 및 로그인 → 자료제출 (홈페이지 매뉴얼 참고) → 중소기업(소상공인)확인서 신청서 작성 및 제출 → (승인 후) 확인서 발급 확인 ※ 소상공인확인서 발급문의 : 중소기업통합콜센터 국번 없이 1357 기존에 발급한 소상공인확인서의 유효기간 (1년) 이 지난 경우 심사 가 불가 하므로 가입신청 전 유효기간 확인 이 필요 하며, 2개 이상 의 사업장 을 운영 중인 경우 모든 사업장 의 소상공인확인서 를 발급 해야 한다. 우대형 이의신청 접수 마감일 (11.5일 잠정) 전까지 소상공인확인서 발급 이 완료 되지 않을 경우 , 소상공인 자격 (매출액 기준) 으로 심사 가 불가 하여 종합소득 기준 으로 심사 가 진행 되는 점 유의해야 한다. ※ 소상공인확인서 신청 후 발급까지 평균 약 7일 정도 소요되나, 발급 신청이 몰릴 경우 기간이 더 소요될 수 있음 또한, 가입신청 시점 기준 으로 운영 중인 모든 사업장 이 소상공인 요건을 충족 해야 한다. 현재 사업장 을 운영하지 않고 있거나 운영 중인 사업장이 중소 벤처기업부에서 고시하는 ‘ 소상공인 정책자금 융자제외 대상 업종 ’ * 인 경우 소상공인 자격 으로는 가입 이 불가능 하다. * 도 박기계 및 사행성, 불건전 오락기구 제조업, 담배 중개업 등 다만, 소상공인 요건 을 충족하지 못하는 경우 에도, 종합소득 등 일반 소득자 요건 을 충족 하면 일반소득자 로 가입 이 가능하다. 소상공인 해당 여부 에 대해서도 최종심사 에 앞서 사전심사 결과 를 안내 (10.30~11.2일 잠정) 하며, 가입단계에서 신청자 가 선택한 가입유형 과 사전심사 결과 가 다를 경우 이를 확인하고 소명 할 수 있는 기회 를 제공 한다. 최종심사 결과 는 개별 통보 예정이며, 매출액·가구소득 등 요건충족 여부 에 따라 일반형 또는 우대형 으로 통보 가 된다. 5. 청년도약계좌 → 청년미래적금 갈아타기 이번 2차 모집에서는 기존 청년도약계좌 가입자 가 청년미래적금 으로 갈아탈 수 있는 기회 를 추가 로 제공 한다. ※ 청년도약계좌 → 청년미래적금 갈아타기란? √ 청년미래적금과 청년도약계좌는 중복가입 불가 (청년도약계좌 만기 후에도 청년미래적금 가입 불가) → 기존 청년도약계좌 가입자가 손실없이 청년도약계좌를 해지하고, 청년미래 적금에 신규 가입할 수 있게 지원 √ 청년도약계좌는 청년미래적금 가입목적의 특별중도해지를 진행하고, 기존 청년도약계좌 납입금에 대한 정부 기여금 및 이자소득 비과세 혜택 유지 갈아타기를 희망하는 경우 우선 ➀ 청년미래적금 가입 신청·심사 를 완료 하고 가입 가능 안내 를 받은 후 ➁ 청년 미래적금 계좌 를 개설 한 다음, ➂ ‘청년 미래적금 가입 목적 의 청년도약계좌 특별 중도해지’ 를 신청 하면 된다. 단, ➁ 청년미래적금 계좌개설 후 동 기간 안 에 ➂ ‘청년 미래적금 가입 목적 의 청년도약계좌 특별 중도해지’ 를 완료하지 않을 경우 청년미래적금 에는 납입 이 불가능 하다. 갈아타기 절차를 마무리하지 않은 경우 청년도약계좌 는 그대로 유지 되며, 납입 이 중지 된 청년미래적금 계좌 는 반드시 해지 * 하여야 한다. * 청년미래적금 중도해지시 해지시점 기준 2개월 후부터 재신청이 가능하며, 해지 후 재가입한 경우 정부 기여금 지급비율은 기존 가입기간을 감안한 조정비율 ((36개월- 기존 가입기간)/36개월) 을 곱하여 일부 차감 (청년미래적금 납입 중지 기간도 가입기간으로 간주) 청년미래적금 가입 목적 의 청년도약계좌 특별중도해지 는 청년도약계좌 취급은행 앱 (App) 을 통해 신청 가능 하며, 신청이 접수되면 자동 으로 해지 처리 되고 이후부터 청년미래적금 납입 이 가능 하다. 6. 군장병 가입신청·계좌개설 지원 금융위원회와 국방부는 1차 모집기간 운영시와 마찬가지로 군사훈련기간 중인 청년들 이 청년미래적금 가입기간을 놓치지 않도록 훈련소 내 에서도 스마트폰 을 사용 하여 비대면 가입신청 및 계좌개설 절차 를 진행 할 수 있게 지원 할 예정이다. 이에 따라 전년도 (‘25년) 과세대상 소득 또는 일부 비과세 소득 * 이 있는 장병 중 소득요건 을 충족 한 장병 은 ’ 일반형 ’ ** 으로 가입 이 가능 하다. * 육아휴직급여, 군 장병급여 ** 우대형의 경우 가입일 기준 중소기업 재직자, 소상공인이 가입대상 다만, 청년미래적금이 모바일앱을 통한 비대면 가입 방식으로 운영되는 만큼, 원활한 가입절차 진행 을 위해 입영 전 또는 가입신청 전 에 가입 을 희망 하는 청년미래적금 취급기관 모바일앱 을 미리 설치 하고 회원가입 · 본인인증 절차 · 입출금계좌 개설 등을 사전 에 준비 해둘 필요가 있다. 또한, 기초군사훈련 을 마치고 복무 중 인 장병 의 경우도 전년도에 과세 대상 소득 또는 일부 비과세 소득 이 있고, 소득요건 을 충족 한 경우 청년미래 적금 일반형 가입 이 가능 하다. ※ 군장병들은 장병내일준비적금 또는 장기간부도약적금 과 청년미래 적금 중복가입 가능 7. 기타 안내사항 카카오뱅크 는 2차 모집기간 중 최대 10만좌 범위 에서 가입신청 을 받는다 ( 타 취급기관 은 별도의 계좌수 한도 를 미설정 예정) . 카카오뱅크 는 가입 신청 첫 주 홀짝제 운영기간 (10.7~10.8일) 동안 일일 5만좌 범위 에서 신청 을 접수 하고, 이후 (10.12~10.16일) 잔여 한도 내 에서 가입신청 을 받을 예정이다. 현재 청년미래적금 웹페이지 (fill4young.kinfa.or.kr) 가 운영 되고 있으며, 가입대상 , 가입일정 등 청년미래적금 관련 정보를 제공하고 있다. 금융위원회 와 서민금융진흥원 은 청년미래적금 웹페이지, SNS 및 취급기관 앱 등 다양한 채널을 통해 관련 주요정보 를 지속적 으로 안내 할 예정이다. 청년미래적금 관련 궁금한 사항 은 서민금융진흥원 청년금융콜센터 (☏1397 바로 3번)로 문의 가 가능하다.", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "법인 대표이사의 시세조종행위 등 불공정거래 행위에 대한 적발 조치(3건)", "department": "조사1국/조사4국", "date": "2026-09-30", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=232881&menuNo=200218&pageIndex=1", "summary": "증권선물위원회는 제17차 정례회의('26.9.30.)에서, (1) 상장회사 주식 및 경영권 양수자와 주식 일부의 양수 계약 체결을 교섭 중인자 및 정보수령자인 그 지인들을 「자본시장과 금융투자업에 관한 법률」상 금지된 미공개중요정보 이용행위(제174조)를 한 혐의로 검찰에 통보하였습니다. 또한, (2) 대체거래소(NXT)의 얇은 호가 상황을 활용한 시세조종 주문을 통해 주가를 상승시키고 부당이득을 취한 개인투자자, (3)장기간 시세조종 주문을 통해 주가를 부양한 부동산 개발회사 최대주주 겸 대표이사에 대해 「자본시장과 금융투자업에 관한 법률」상 시세조종행위(제176조) 금지 위반 혐의로 고발 조치하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["market-data feed (+2)"]}, {"source": "KRX_OPEN2", "title": "㈜모비콘텐츠테크 코넥스시장 상장신청서 접수", "department": "", "date": "2026-09-30", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=260915784", "summary": "첨부 참조", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(9.30일)", "department": "국민지역참여지원과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87825", "summary": "*자세한 내용은 첨부파일을 확인하세요", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "은행업감독규정 규정변경예고 실시  ※예고기간 ‘26.9.30일 ~ 11.9일 ", "department": "은행과", "date": "2026-09-30", "url": "https://www.fsc.go.kr/no010101/87824", "summary": "은행업감독규정 규정변경예고 실시 ※ 예고기간 ‘26.9.30일 ~ 11.9일 ✓ ➊ 인터넷은행 대면업무 범위 의 합리적 조정, ➋ 외화결제계좌 의 신용공여 제외 , ➌ 부동산PF 신용공여한도 도입, ➍ 특수은행 경영실태평가 개편 등을 위한 은행업감독규정 개정 추진 ✓ 규정변경예고 (’26.9.30일~11.9일)를 통해 의견수렴 후 금융위원회 의결 (’26.12.2일 잠정 )을 거쳐 시행 * * 부동산PF 신용공여한도 규제는 ’27.1.1일 시행(3년 경과조치 부과) ’26.9.30.(수) 금융위원회는 인터넷은행 대면업무 범위의 합리적 조정 등을 위한 ｢은행업감독규정｣ 규정변경예고를 실시 (’26.9.30일~11.9일) 한다. 은행업감독규정 개정안의 주요내용 은 다음과 같다. I. 인터넷은행 대면업무 범위의 합리적 조정 (안 제102조 제4항 각 호 신설) ’26.7.1일 금융위원회 는 인터넷은행의 불가피한 대면업무는 허용하는 내용의 ‘인터넷은행 대면업무 범위의 합리적 조정 방안’ 을 의결 한 바 있다. 인터넷은행은 원칙적 으로 이용자와 직접 대면하거나 의사소통하는 대면 업무를 할 수 없으나 , 채무자 안내·상담·협의, 채무조정 상담 등을 위해 불가피하게 필요한 대면업무는 합리적 으로 허용 할 계획이다. 이는 ’26.7.1일 금융위원회 의결 에 따른 후속조치 로서, 인터넷은행이 수행할 수 있는 대면업무의 범위를 은행업감독규정에 열거 하여 규제 명확성 을 제고 한다. \u003c 인터넷은행 대면업무 범위 추가 내용 > ➀ 연체채권의 관리 또는 회수를 위하여 채무자에 대한 안내·상담·협의, 채무조정 상담, 채권단 공동관리 등이 필요한 경우 ➁ 비대면 제출 서류의 위·변조 확인 등을 위하여 원본 서류 확인이 필요한 경우 ➂ 자금사용 적정성, 담보물 현황 또는 가치 확인 등을 위하여 필요한 경우 ➃ 소비자 신청 등에 따라 사실 확인, 처리결과 전달, 서류 발급·접수 등을 위해 필요한 경우 ➄ 담보물 또는 임차주택 등 목적물의 권리관계, 점유관계 등에 대한 조사·확인이 필요한 경우 ➅ 담보권의 설정·변경·실행 과정에서 법령상 또는 행정상 제약으로 전자적 방법으로 수행이 불가한 경우 ➆ 기타 법령 및 규정상 의무 이행을 위해 필요한 경우 II. 외화결제계좌 금액은 신용공여 산정시 제외 (안 별표2 개정) 현재 다수 은행은 국내 기업의 해외 결제업무 를 지원하고 효율적으로 해외 자금거래를 수행 하기 위하여 해외 현지은행에 외화결제계좌를 개설·운영 하고 있다. 반면, 은행은 대주주 에 대해 자기자본의 25% (또는 대주주 출자비율) 범위에서 신용공여 를 할 수 있는데 (은행법 제35조의2) , 신용공여에 외화결제계좌 금액(예치금)도 포함 됨에 따라 일부 은행은 대주주 신용공여한도 준수에 어려움 * 을 겪을 가능성이 있다. * (예) 씨티·SC은행은 해외 본사은행(대주주)에 외화결제계좌를 운영 중. 국내 수출·수입 기업의 해외 결제수요가 급격하게 변동하는 경우 외화결제계좌 잔액이 변동함에 따라 대주주 신용공여한도 위반리스크가 발생하고, 기업의 해외 결제업무 지원이 제한될 우려 은행의 외화결제계좌 운용은 법령상 대주주 신용공여한도 규제의 취지와 상이 한 점 *1) , 보험업법 에서 이와 유사한 자금운용을 신용공여에서 제외 하는 점 *2) 등을 고려하여, 은행법령상 신용공여 의 범위에서 외화결제계좌 운용 금액 ** 은 제외 한다. * 1) 외화결제계좌는 국내 기업의 해외 영업행위에 필수적으로 수반되는 해외 결제를 지원하기 위한 것으로, 은행의 대주주 사금고화 방지 등 대주주 신용공여한도 규제 취지와 상이 2) 보험료 수납 및 대출업무 등 일상적인 업무수행을 목적으로 대주주인 은행에 개설된 계좌에서 운용되는 보험회사 자금은 신용공여에서 제외 중(보험업감독규정 별표1의2) ** 외국환의 결제 등을 위하여 금융기관에 개설된 은행의 계좌로 입금한 금액으로서 입금일로부터 3영업일이 경과하지 않은 경우 동 제도개선을 통해 국내 수출·수입기업의 무역결제 등 자금운용이 수월 해지고, 은행 자금결제 업무의 효율성 이 제고될 것으로 기대된다. * 국내 기업의 긴급한 자금결제 수요 등을 고려하여 ｢은행업감독규정｣ 개정 이전에도 은행의 외화결제계좌 운용에 따라 대주주 신용공여한도 위반 등이 적용되지 않도록 비조치의견서 旣발급(’26.5.28일) III. 부동산PF 신용공여한도 제한 (안 제26조 제1항 제7호 신설, 별표2 개정) ’25.12.22일 , 금융위원회는 관계부처 합동으로 ‘부동산PF 건전성 제도개선 방안’ 을 통해 은행·증권·보험·상호·여전업권별 부동산PF 한도 규제 도입 을 발표하였다. 이는 금융회사의 과도한 부동산PF 리스크 노출 및 편중을 방지 하고, 부동산PF 관련 건전성을 제고 하기 위함이다. 동 제도개선 방안의 후속조치로서, ｢은행업감독규정｣ 상 경영지도비율 * 로 ‘부동산PF 신용공여한도’ 규제를 신설 하여 은행의 부동산PF 대출 관련 신용공여는 총 신용공여의 20% 이내로 제한 하도록 한다. 부동산PF 신용 공여한도 규제는 ’27.1.1일에 시행 하며, 시행 당시 신용공여한도비율을 초과하는 은행은 3년 이내에 해소 할 수 있도록 경과기간 을 부여하여 규제 준수가능성 을 제고한다. * 현재 자본비율, 유동성커버리지비율, 예대율, 순안정자금조달비율, 단순기본자본비율, 거액익스포져비율 등 규정 중(은행업감독규정 제26조 제1항 각 호) IV. 특수은행 경영실태평가 개편 (안 제97조 제2항, 별표4 개정) ’24.2월 , 금융위원회는 일반은행 의 경영실태평가 체계를 개편 하여 내부통제 를 별도 평가부문 으로 분리하고, 평가비중 을 대폭 상향 (5.3%→15.0%) 한 바 있다. ｢은행업감독규정｣을 개정하여 특수은행 * 도 내부통제 평가를 강화하는 방향으로 경영실태평가 체계를 개편 한다. 현재 위험관리(R)의 하위항목인 내부통제(I) 를 별도 부문으로 구분 (CACREL→ CACEL-IR) 하고, 평가비중 을 대폭 확대 (3.2%→10%) 한다. 특수은행 경영실태평가 평가부문 및 비중 변경(안) 구분 자본 (C) 자산 (A) 법규준수 (C) 위험관리 (R) 수익성 (E) 유동성 (L) 내부통제 현행 20% 30% 10% 20% 3.2% 10% 10% 구분 자본 (C) 자산 (A) 법규준수 (C) 수익성 (E) 유동성 (L) 내부통제 (I) 위험관리 (R) 변경 20% 30% 10% 5% 10% 10% 15% V. 향후계획 ｢은행업감독규 정｣ 개정안 은 국무조정실 규제심사 등 관련 절차를 거쳐 금융위원회 의결 에 따라 시행될 예정이다 (부동산PF 신용공여한도 규제는 다른 금융업권과 함께 ’27.1.1일 시행) . \u003c 규정변경예고 관련 안내사항 > ￭ 예고기간 : 2026.9.30일(수) ~ 2026.11.9일(화), (40일) ￭ 입법예고·규정변경예고된 내용에 대해 의견이 있으시면 다음 사항을 기재한 의견서를 아래의 제출처로 제출해 주시기 바랍니다. - 예고 사항에 대한 찬성 또는 반대 의견 (반대의 경우 이유 명시) - 성명 (기관ㆍ단체의 경우 기관ㆍ단체명과 대표자명) , 주소·전화번호 - 일반우편 : 서울시 종로구 세종대로 209 정부서울청사 금융위원회 은행과 - 전자우편 : sbpark9@korea.kr - 팩스 : 02-2100-2948 ※ 개정안 전문(全文) 은 “금융위 홈페이지( www.fsc.go.kr ) › 정책마당 › 법령정보 › 입법예고/규정변경예고”에서 확인 가능합니다.", "essential": false, "importanceReasons": []}], "2026-10-01": [{"source": "MOFE", "title": "「\"막힌 투자는 뚫고, 현장의 애로는 풉니다\" 현장중심 기업투자·혁신 지원방안(2차)」 발표", "department": "정책조정총괄과", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079502&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": []}, {"source": "MOFE", "title": "비상경제본부 회의 겸 경제관계장관회의 개최", "department": "정책조정총괄과", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079505&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "MOFE", "title": "한미 전략투자 프로젝트 추진 계획 발표", "department": "전략투자지원과", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079506&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "보험상품 방송광고 건전화를 위한 간담회 개최", "department": "소비자피해예방국", "date": "2026-10-01", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=233554&menuNo=200218&pageIndex=1", "summary": "ㅁ '26.10.1. 금융감독원은 생명,손해보험협회와 함께 보험회사 및 홈쇼핑 GA의 준법감시인(총 13개사) 대상으로 간담회를 개최하여,\nㅇ 끊임없이 반복되는 보험상품 방송광고 현황 및 소비자보호 관점에서의 미흡사항(높은 불판비율 등) 등을 공유하고, 이에 대한 개선방안을 논의하였음\nㅁ 금번 간담회를 통해 금융감독원은 해당 방송광고가 소비자의 불안감 및 보장심리를 지나치게 자극하고 있음을 지적하면서,\nㅇ 이러한 영업행태가 소비자의 눈높이에 맞게 건전하게 정착될 수 있도록, 각 협회를 중심으로 보험업권 內 자정 노력 강화의 필요성을 강조하였음\nㅇ 각 협회 등 보험업권 참석자들은 방송광고에 대한 공시 강화 및 규제 보완 필요성 등에 인식을 같이 하고, 업계의 자율적인 개선방안 마련을 조속히 추진하겠다는 의지를 표명하였음\n\u003c「보험상품 방송광고 건전화를 위한 간담회」 개요>\nㅁ 일시 : '26.10.1.(목) 10:00~11:15\nㅁ 장소 : 금융감독원 9층 중회의실\nㅁ 참석자 : (금감원) 김욱배 소비자보호 부원장보, 소비자피해예방국 선임국장, 피해예방3팀장(보험업계) 생명,손해보험협회, 방송광고 실시 주요 회사(13개사) 소속 준법감시인 등\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "금융시장 상황점검회의 개최", "department": "금융시장안정국", "date": "2026-10-01", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=233555&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융위원회는 10.1일(목) 10:00 이억원 금융위원장 주재로 재정경제부, 금융감독원, 금융연구원 및 신용평가사,증권사 등 금융시장 전문가들과 함께 「금융시장 상황점검회의」를 개최하였다.\nㅇ 금번 회의는 한국을 포함한 주요국 중앙은행이 기준금리를 잇달아 인상함에 따라, ① 국,내외 금리 상승이 금융시장 및 금융산업에 미치는 영향을 점검하고, ② AI,반도체 업황 변화, 글로벌 자금흐름, 지정학적 리스크 등 금융시장 변동성을 확대시킬 수 있는 잠재 리스크 요인 및 대응방향을 논의하기 위해 개최되었다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "대형 IB의 모험자본 공급 현황을 점검하고 리서치보고서의 독립성, 신뢰성 제고 및 중소형주 커버리지 확대 방안을 마련하였습니다.", "department": "자본시장감독국", "date": "2026-10-01", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=233557&menuNo=200218&pageIndex=1", "summary": "ㅁ ‘26.9.30. 제2차 ?금투업권 모험자본 역량강화 협의체? 회의(주재 : 변제호 자본시장국장)를 통해 실적점검 및 확대방안 논의\n① 대형 IB(종투사)의 ‘26.2분기 모험자본 공급 실적\nㅇ 모험자본 공급의무가 있는 7개社는 ’26.2분기 총 11.6조원을 공급하여 ’26.1분기 대비 2조원 추가 공급(+20.4%) ※ 매분기 2조원씩 증가추세\n- 발행어음,IMA 조달액 대비 모험자본 공급비율은 평균 19.5%로 모두 규제비율(‘26년 10%→’27년 20%→’28년 25%) 상회\nㅇ 모험자본의 양적 확대가 추세적으로 안정화되는 경우 모험자본의 질적 개선을 위해 위험도에 비례한 실적 인정체계 도입을 검토할 계획\n② 리서치의 독립성,신뢰성 강화 및 중소형주 리서치보고서 의무화\nㅇ 증권사 리서치 독립성 및 공시체계 강화를 통해 매수의견 위주 관행을 개선하여 리서치보고서 신뢰도,품질 제고\nㅇ 종투사에 대한 스몰캡(중소형주) 커버리지 최소비율 도입 및 모험자본 인센티브 부여를 통해 스몰캡 커버리지 확대 유도\n[대통령 업무보고 과제] 생산적 금융으로의 대전환\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "대형 IB의 모험자본 공급 현황을 점검하고 리서치보고서의 독립성‧신뢰성 제고 및 중소형주 커버리지 확대 방안을 마련하였습니다.", "department": "자본시장과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87831", "summary": "대형 IB의 모험자본 공급 현황 을 점검하고 리서치보고서 의 독립성‧신뢰성 제고 및 중소형주 커버리지 확대 방안을 마련하였습니다. ※ ‘26.9.30. 제2차 ｢금투업권 모험자본 역량강화 협의체｣ 회의 (주재 : 변제호 자본시장국장) 를 통해 실적점검 및 확대방안 논의 ▪ (일시/장소) ’26.9.30.(수) 10:00 / 금융투자협회 23층 중회의실 ▪ (참석자) 금융위원회 자본시장국장 (주재), 자본시장과장, 금융감독원 자본시장감독국장 - (유관기관) 금융투자협회, 자본시장연구원 - (종투사) 한투, 미래, NH, KB, 하나, 키움, 신한, 삼성, 메리츠 - (중기특화) 한화, 유진, 코리아에셋, 리딩 대형 IB (종투사) 의 ‘26.2분기 모험자본 공급 실적 ㅇ 모험자본 공급의무가 있는 7개社 는 ’26.2분기 총 11.6조원을 공급 하여 ’26.1분기 대비 2조원 추가 공급 (+20.4%) ※ 매분기 2조원씩 증가추세 - 발행어음‧IMA 조달액 대비 모험자본 공급비율은 평균 19.5%로 모두 규제비율 ( ‘26년 10% →’27년 20%→’28년 25%) 상회 ㅇ 모험자본의 양적 확대가 추세적으로 안정화되는 경우 모험자본의 질적 개선 을 위해 위험도에 비례한 실적 인정체계 * 도입을 검토할 계획 * 예 : P-CBO 등 우량 보증채권, 담보대출 대비 위험도가 높은 벤처기업 지분투자 등에 대한 실적인정비율 우대 검토 리서치의 독립성‧신뢰성 강화 및 중소형주 리서치보고서 의무화 ㅇ 증권사 리서치 독립성 및 공시체계 강화 를 통해 매수의견 위주 관행을 개선하여 리서치보고서 신뢰도‧품질 제고 ㅇ 종투사에 대한 스몰캡 (중소형주) 커버리지 최소비율 * 도입 및 모험자본 인센티브 부여 ** 를 통해 스몰캡 커버리지 확대 유도 * 예 : 연간실적 1/4 이상을 ➀ 코스피 시총 300위 미만 (現시총 약 6천억원 미만) 및 ➁ 코스닥 시총 150위 미만 종목 (現시총 약 6천억원 미만) 으로 발간하되, 그 중 1/2 (전체 1/8) 이상을 ➁ 코스닥 시총 150위 미만 종목으로 구성 ** 예 : 전년도 스몰캡 리서치 커버리지 비율이 40% 이상인 IMA·발행어음 종투사 ➔ 당해년도 모험자본 의무비율 산정 시 중소·벤처기업 공급액 5% 가산 【대통령 업무보고 과제】생산적 금융으로의 대전환 Ⅰ. ’ 26.2분기 종투사 모험자본 공급실적 모험자본 공급의무가 있는 7개 종투사 * 의 ’26.2분기 모험자본 공급액 은 총 11.6조원 으로 ’26.1분기 대비 2.0조원 증가 (+20.4%) 한 것으로 나타났다. ** 발행어음‧IMA 조달액 대비 모험자본 공급 비율 은 19.5% 로 ’26.1분기 대비 2.7%p 상승하여 ’26년도 의무비율 ( 10% →’27년 20%→’28년 25%) 을 여유있게 상회 하였으며, 7개 종투사 모두 의무비율을 상회 한 것으로 나타났다. * ’26.9월 단기금융업(발행어음) 인가를 받은 삼성, 메리츠 제외 ** 모험자본 공급의무액 중 A등급채권+중견기업 투자에 대한 30% 한도 적용시 【종투사 모험자본 공급 현황 (잔액 기준) 】 (단위: 억원) 구분 ‘25.4분기말 ‘26.1분기말(①) ‘26.2분기말(②) 증감(②-①) 자산총계 5,563,045.3 6,380,988.9 7,316,275.8 935,286.9 14.7% 모험자본 공급액(A) 11 권 윤여삼 애널리스트, BNP파리바 윤지호 이코노미스트 키움증권 김유미 이코노미스트, 한국신용평가 김용건 본부장 금번 회의는 한국을 포함한 주요국 중앙은행 이 기준금리 를 잇달아 인상 함에 따라, ➊ 국·내외 금리 상승 이 금융시장 및 금융산업 에 미치는 영향 을 점검 하고, ➋ AI·반도체 업황 변화, 글로벌 자금흐름, 지정학적 리스크 등 금융시장 변동성을 확대시킬 수 있는 잠재 리스크 요인 및 대응방향 을 논의 하기 위해 개최되었다. 2. 참석자 주요 논의사항 이억원 위원장 은 글로벌 인플레이션 우려 속에 글로벌 통화정책 기조 가 긴축 으로 전환 되고 AI·반도체 업황 변화 , 중동 정세 등 불확실성이 중첩 되고 있다며, 현 시점 을 “금융환경의 흐름이 바뀌는 전환기” 로 진단 하였다. 이러한 전환기에는 과거의 경험칙이 통하지 않는 예상치 못한 지점에서 위험이 불거질 수 있다 고 지적하고, “준비된 만큼 흔들림은 줄어든다” 는 자세로 관계기관이 각별한 경계감 을 유지하는 가운데 부문별 잠재 리스크 를 선제적·다각적 으로 점검 하고 필요한 대응수단 을 사전 에 준비 하는 등 철저한 대비 가 중요 하 다고 강조하였다. 이어 참석자들은 부문별 시장 상황을 차례로 점검·논의하였다. 국내 주식 시장 및 외환시장의 경우, 중동전쟁, 글로벌 반도체 업황의 변동성 확대 , 외 국인 의 국내주식 매도 등으로 변동성이 확대되었으나, 일부 불확실성 속에서도 최근 변동성 이 다소 완화 되고 있는 모습이라고 평가하였다. 채권시장 의 경우 고유가 등 인플레이션 우려 지속, 주요국 기준금리 인상 등으로 국내 국채금리 * 가 연초 대비 상승하였으나, 회사채 스프레드 ** 는 “과거 위기에 비해 크게 확대되지 않고 있다” 고 평가하였다. * [국채 3y (%) ] (ʼ25년말) 2.953 → (ʼ26.2월말) 3.041 → (8월말) 3.838 → (9.30일) 4.011 (연중 +105.8bp, 9월중 +17.3bp) ** [회사채 스프레드 (bp) ] (ʼ25년말) 52.3 → (ʼ26.2월말) 59.6 → (8월말) 67.8 → (9.30일) 69.2 ( 연중 +16.9bp, 9월중 +1.4bp ) ※ ‘22년도 자금경색기 회사채 스프레드 최대치(bp): +177.2 \u003c’22.12.1일> 참석자들은 3월 중동전쟁 발생 이후 12.1조원 의 회사채·기업어음 (CP) 을 적극 매입한 시장안정프로그램 (100조원+α) 이 채권시장 충격 을 완화 하는데 ‘안전판’ 역할 을 해왔다는 점에 공감하였다. ※ 또한, 정부는 정책금융기관, 금융권 과 함께 중동전쟁의 영향을 받은 중소·수출기업 의 피해 최소화 를 위해 ｢정책금융 지원 프로그램｣ 을 신속히 마련 하여 그간 총 37,818건, 21.1조원 을 지원 (9.28일 기준) 참석자들은 대내외 불확실성은 높은 상황이지만, 우리나라의 경우 견고한 수출·성장세 , 양호한 금융기관 복원력 및 대외건전성 지표 등을 감안할 때, 우리 경제와 금융시스템은 충분한 위기대응능력 과 충격 을 감내할 체력 을 갖추고 있다는 데에 의견을 같이 하였다. * 외환보유액 규모(‘26.8월) : 4,423억불 / CDS 프리미엄(5y, bp) : (’26.2말) 24.9 → (9.30일) 23.8 다만, 참석자들은 시장금리 수준 이 점점 높아지고 있는 상황 에서 경제주체의 자금조달 비용부담 이 누적되고 금리변동 에 대한 시장 민감도 가 상승 하고 있다고 언급하였다. 특히, 시장에서 예측하지 못한 대·내외 신용 이벤트가 발생하면 차환조건 이 단기간내 악화 되면서 취약부문의 차환리스크가 시장내 빠르게 전이되어 금융권 건전성 에도 영향을 미칠 우려 가 있음을 지적하였다. 또한, 조달과 운용의 만기 불일치 에 따른 유동성리스크 , 특정 부문으로의 자금쏠림 , 채권발행 및 만기 의 특정시기 집중 , 취약차주 상환부담 증가, AI·반도체 업황 전망 불확실성 등 시장내 잠재되어 있는 리스크 요인에 대해 상시적 으로 철저하게 점검 할 필요가 있다는 데 인식을 같이 하였다. 3. 금융위원장 당부사항 및 향후계획 이억원 위원장 은 “금융시장 안정 이 생산적 금융·포용적 금융 을 위한 ｢금융 대전환｣ 을 뒷받침하는 최우선 전제조건 ”이라고 강조하면서, 다음 사항에 대해 철저히 점검 하고 필요한 대응 은 적기에 시행 할 것을 당부하였다. 일어날 가능성이 극히 낮은 극단적 위험 (Tail Risk) 과 파급경로까지 포함해 시장 내 리스크 요인 을 다각적 으로 점검 하고, 시장 불안 확산시 부문별로 필요한 시장안정조치 (Contingency Plan) 를 적기 에 시행 할 것을 당 부하였다. 특히, 시장금리 상승세 가 이어지는 만큼 채권·자금시장 안정 을 위한 시장안정프로그램 은 적극적인 집행기조 를 유지 하는 한편, 채권시장 변동성 이 과도하게 확대 되는 경우 지원규모 를 신속히 확대 할 수 있도록 사전에 철저히 준비할 것을 지시하였다. 특정 시기 발행집중 으로 인해 채권시장 수급 부담이 발생하지 않도록 4분기 은행채·여전채 등의 발행규모 및 만기구조 를 사전 점검 하고, 금리 상승기 금융권의 자산건전성 , 유동성 대응여력 및 자금조달 구조 등을 꼼꼼 히 점검할 것을 당부하였다. 기준금리 인상에 따른 시장금리 상승 은 시차를 두고 상환능력이 떨어지는 취약차주 부터 부정적 영향 이 파급 되는 만큼 관계기관 합동 으로 기 발표한 ‘ 금리 상승기 대비 취약차주 지원방안 (8.28일) ’ 을 차질없이 추진 하는 한편, 대출금리 상승 동향 및 취약부문별 상환부담 가중 가능성 등을 면밀히 점검하여 필요시 보완방안 을 적기에 마련 할 것을 지시하였다. 앞으로 금융위원회 는 재정경제부, 금융감독원 등 관계기관 과 긴밀한 협업 을 통해 모니터링 체계를 지속 강화 하는 한편, 금융위원장 이 주재 하는 ｢금융시장 상황점검회의｣ 를 주기적 으로 개최 하여 금융시장·산업계 등의 다양한 목소리 를 경청 하고 리스크 요인 을 지속 점검 해 나갈 계획을 밝혔다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "26년 상반기 가상자산사업자 실태조사 결과", "department": "가상자산감독국", "date": "2026-10-01", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=233627&menuNo=200218&pageIndex=1", "summary": "□ 금융정보분석원과 금융감독원은 국내 가상자산 시장 현황 파악을 위해 가상자산사업자 26개사(’26년 6월말 기준)에 대한 ’26년 상반기 실태조사를 실시하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "KRX_OPEN2", "title": "한국거래소, 부산 연제구 통통꿈놀이터 20호 완공식 개최", "department": "", "date": "2026-10-01", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015785", "summary": "첨부 참조", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSC", "title": "모태펀드와 국민성장펀드가 협력하여첨단혁신기업의 지속성장을 지원하는 ‘이어달리기’를 이어갑니다.", "department": "국민성장펀드총괄과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87839", "summary": "모태펀드와 국민성장펀드가 협력하여 첨단혁신기업의 지속성장을 지원하는 ‘ 이어달리기 ’를 이어갑니다. - 모태펀드-국민성장펀드 간 유기적 연계 를 통해 창업․벤처 투자부터 스케일업 투자 까지 이어지는 벤처·스타트업 지원 노력을 강화 - 향후 AI·방산·바이오 등 특정 분야별 소통(meet-up)도 활성화 하여, 유망기업들과 투자자를 연결 하는 대표 플랫폼으로 발전 시켜 나갈 계획 1. 제2차 이어달리기 합동 밋업 개요 금융위원회 (위원장 이억원, 이하 금융위) 와 중소벤처기업부 (장관 이소영, 이하 중기부) 는 10월 1일(목) 한국성장금융투자운용 (서울 영등포구 국제금융로8길31) 에서 ‘제2차 모태펀드-국민성장펀드 이어달리기 합동 밋업(Meet-Up)’ 행사를 개최하였다. ​이번 행사는 지난 6월 첫발을 뗀 ‘제1차 * 모태펀드-국민 성장펀드 투자 이어달리기 간담회’에 뒤이어 개최된 것으로, 각 펀드가 자금을 유기적으로 연계하여 공급할 수 있는 취지 로 마련되었다. 창업 초·중기 단계 에서 모태펀드를 통해 발굴․육성된 우수 혁신기업 이 성장․스케일업 단계에서 국민성장펀드의 대규모 자금을 연계 받아 끊김없이 성장 을 이어갈 수 있도록 민관이 원팀으로 뜻을 모은 것이다. * 제1차 이어달리기 밋업행사 개요: (일시) ‘26.6.23, (장소) SVC 서울, (참석) 금융위원장, 중기부 차관, 산업 · 기업은행, 한국벤처투자, 한국성장금융, 한국벤처캐피탈협회, 벤처기업협회 등 이날 행사에는 금융위 손영채 국민성장펀드추진단장, 중기부 김봉덕 벤처 정책관을 비롯해 한국성장금융 장상익 대표, 한국산업은행 신혜숙 부행장, 한국 벤처투자 최철훈 부대표와 한국벤처캐피탈 협회 이준희 부회장, 국민성장펀드 운용사 (간접투자부문) 33개사 및 모태펀드 운용사 8개사, 유망 혁신기업 7개사 가 참석했다 . \u003c 제2차 모태펀드-국민성장펀드 이어달리기 합동 밋업(Meet-Up) 개요 > ◦ 일시 및 장소 : ’26. 10. 1일(목) 13:30, 한국성장금융투자운용 11F ◦ 참석자 - (정부) 금융위 국민성장펀드추진단장, 중기부 벤처정책관 - (기업) ㈜디노티시아, ㈜파일러, ㈜로엔서지컬, 엔라이튼(주), 텔레픽스(주), 주식회사 토룩, (주) 투모로 로보틱스 - (운용사) 국민성장펀드 및 모태펀드 자펀드 운용사 - (유관기관·협단체) 산업은행, 한국벤처투자, 한국성장금융, 한국벤처캐피탈협회 ◦ 주요내용 : (1부) 합동간담회 → (2부) 1:1 프라이빗 밋업 2. 밋업 행사 주요 내용 ​ 이번 2차 밋업(Meet-Up) 은 지난 1차 밋업 행사에 비해 참여기업 발굴 채널을 다양화했다. 중기부가 모태펀드를 통해 육성한 우수 기술기업 5개사 와 금융위 원회의 '성장기업발굴협의체 '에 각 부처․민간에서 제안한 유망기업 2개 기업 이 참석하여 기업 현황과 투자 유치 계획 등을 발표했다. \u003c제2차 밋업(Meet-Up) 참석기업 개요> 기술분야 기업명 개요 AI 로봇 ㈜디노티시아 • 벡터 DB 활용한 LLM 가속솔루션 개발 ㈜파일러 • 영상이해 인공지능 개발 주식회사 토룩 • 서비스로봇 개발, 제조, 판매 투모로 로보틱스 • Full-Stack Physical AI 플랫폼 개발 바이오 ㈜로엔서지컬 • 의료용 수술로봇 개발 방산 텔레픽스 • 저궤도 인공위성 개발 기후테크 엔라이튼(주) • 태양광 발전사업 등 에너지 기후테크 개발 한편, VC, PE 등의 투자기관 측 에서는 총 41개사 (국민성장펀드 간접투자부문 운용사 33 개사, 모태펀드 운용사 8개사)가 참석했다. 국민성장펀드 운용사 입장에서는 모태펀드가 초기에 육성한 유망기업을 소개 받을 수 있으며 , 공동투자자 를 구하거나 투자자간 네트워크를 형성 할 수 있는 좋은 기회이고, 모태펀드 운용사 입장에서도 성장단계로 진입한 포트폴리오 기업에 대형 자금을 유치 하고, 투자자금을 회수·재투자할 수 있는 기회를 모색하는 자리가 될 것으로 기대된다. ​ 오늘 간담회에 참석한 7개 기업의 대표 들은 각 사의 핵심 기술력에 대해 투자기관들에 설명하고, 향후 스케일업을 위한 대규모 자금 조달 계 획을 제시했다. 특히, ​AI 분야 참석기업인 ㈜디노티시아 정무경 대표 는 \"LLM에 대한 기술력 을 바탕으로 초고속 성장을 도모 하는 현시점에서, 국민성장 펀드의 대규모 자금 연계 는 기술 상용화와 글로벌 시장 진출을 가속화 할 결정적 모멘텀 이 될 것\"이라며, \"이번 밋업에서 후속자금을 유치할 수 있다면 글로벌 AI 시장을 선도하는 빅테크 기업으로 도약 할 수 있을 것\"이라는 포부를 밝혔다. 아울러, 참석기업들은 많은 벤처기업이 성장초기 단계를 넘어서기 위해서는 대규모 스케일업 자금이 필요하다는 점을 강조했다. 기업이 초기단계를 넘어 더욱 성장하기 위해서는 글로벌 시장 진출, 설비투자 확장 등 스케일업 단계를 반드시 거쳐야 하는데, 이러한 결정적 시기에 국민성장펀드 등 대규모 후속 자금이 적기에 기업으로 연계 될 수 있는 선순환 금융 생태계 조성이 무엇보다 중요 하다고 입을 모았다. 한국투자파트너스 의 대표 펀드매니저인 박민식 전무 도 “이번 밋업을 통해 정책금융 상시 지원체계가 구축 된 것은 투자사나 기업 모두에게 큰 도움 이 될 것”이라며, “한국투자파트너스도 국민성장펀드 (중형 리그) 를 통해 혁신기업의 신속한 스케일업과 글로벌 시장 진출을 돕는 핵심 창구 역할을 다할 것”이라고 말했다. 합동간담회 이후에는 기업과 투자기관이 개별적으로 대화하는 1:1 프라이빗 밋업 세션 도 진행되었다. 국민성장펀드의 운용사로 선정된 핵심 운용인력이 직접 대화에 참석 하여, 기업들로부터 자금수요와 사업계획을 청취하였다. 이번 밋업행사가 단순한 기업 쇼케이스, 또는 IR 행사에 그치지 않고, 실질적인 투자유치로 이어질 수 있도록 실무소통의 장 을 마련한 것이다. ​금융위 손영채 국민성장펀드추진단장 은 “지난 6월 1차 행사를 통해 모험 자본 연계의 가능성을 확인했다면, 이번 2차 밋업 은 자금공급의 연속성을 확보하기 위한 지속가능한 지원체계를 다지는 자리 ”라며, “향후 본 행사의 정례화 를 추진하는 한편, 현장 수요에 따라 AI, 바이오, 지역 혁신기업 등 회차별 테마형 밋업(Meet-Up)을 연계 하는 방안 등도 함께 검토하여 첨단전략산업 분야의 기업들이 연속성 있는 성장자금 을 받아 빅테크 기업으로 도약 할 수 있는 환경을 만들어 나가겠다”고 밝혔다. ​ 중기부 김봉덕 벤처정책관 은 “ 모태펀드의 마중물 투자를 통해 성장 기반을 다진 AI·딥테크 혁신 스타트업 들이 글로벌 유니콘으로 도약 할 수 있도록, 정책펀드간 이어달리기 를 위한 연결고리 를 더욱 견고하게 안착시켜야 할 시점”이라며, “앞으로도 탁월한 선구안을 가진 민간 벤처캐피탈과 함께 각 분야의 유망기업들을 적극 발굴 하고 정례적으로 공유 하여, 벤처·스타트업 투자와 육성의 플랫폼 역할을 한층 강화해 나가겠다”고 밝혔다. ​ 금융위원회와 중소벤처기업부는 앞으로도 정책펀드 간 소통을 통해 부처 간 칸막이를 제거 하고, 혁신의 결실이 자금 부족으로 멈춰 서는 일이 없도록 함께 지혜를 모으도록 노력 할 것이다.", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "토큰증권 관련 전자증권법·자본시장법 하위법규 개정안 입법예고 실시 ※예고기간 ‘26.10.2일 ~ 11.11일 ", "department": "자본시장과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87838", "summary": "토큰증권 관련 전자증권법·자본시장법 하위법규 개정안 입법예고 실시 ※ 예고기간 ‘26.10.2일 ~ 11.11일 ✓ 토큰증권 제도 시행을 위한 전자증권법·자본시장법 개정안이 ʼ 27.2.4일 시행 예정으로 하위법규 위임사항에 대한 개정안 입법예고 - ( 전자증권법 하위법규 ) 토큰증권 발행이 허용되는 증권의 범위 , 분산원장의 요건 , 발행인계좌관리기관 등록요건 등 - ( 자본시장법 하위법규 ) 장외거래소 인가단위 신설 및 거래한도 등 ※ 민·관 합동 토큰증권 협의체에서 발표한 ｢토큰증권 정책방향｣ 반영 【관련 국정과제】 48. 디지털자산 생태계 구축 [ 추진 배경] ‘26.10.2일 금융위원회는 토큰증권 에 대한 ｢ 자본시장법｣ 및 ｢전자증권법｣ 개정안 시행 (’26.2.4일 예정)에 따라 ｢ 자본시장법 시행령 ｣, ｢ 전자증권법 시행령 ｣ , ｢ 금투업규정 ｣, ｢ 증권의 발행 및 공시 등에 관한 규정 ｣ 및 ｢ 전자등록업규정 ｣ 개정안의 입법예고 (‘26.10.2일 ~ 11.11일)를 실시했다. 동 개정안은 지난 민·관 합동 토큰증권 협의체 3차회의 (ʼ26.9.4일) 에서 발표한 ’ 토큰증권 정책방향 ‘ 중 하위법규 개정사항을 담고 있다. ｢전자증권법｣ 하위법규 에서는 전자증권법에서 위임한 토큰증권 발행이 허용되는 증권의 범위 , 분산원장의 요건 , 발행인계좌관리기관 등록요건 등을 규정하고 있으며, ｢ 자본시장법｣ 하위법규 에서는 토큰증권의 유통을 위한 장외거래소 체계, 일반투자자 거래한도 등을 포함하고 있다. [ 입법예고안의 주요 내용 ] ① 전자증권법 하위법규 개정안 주요내용 토큰증권화가 가능한 증권 의 범위는 조각투자증권(비금전신탁수익증권, 투자계약증권) 외 주식, 채권, 펀드 등 기존 정형증권 이 포함 한다. 아울러 분산원장 요건 으로는 분산원장 정보기재의 신뢰도 제고, 유사시 업무계속성 등을 위해 전자등록기관 외 2개 이상의 계좌관리기관 (발행인계좌 관리기관 포함) 으로 분산원장 참여자 가 구성 되어야 하며, 분산원장이 공적장부 로 도입되는점, 권리확정 지연 등의 방지 필요성 등을 감안하여 전자등록을 위한 분산원장 이용에는 직접적인 대가 지급을 금지 하는 요건등을 규정하였다. 한편, 금융회사등 기존 계좌관리기관 외에도 증권 발행인이 직접 계좌를 관리하는 계좌관리기관 이 될 수 있도록 허용하는 제도인 발행인 계좌관리기관 의 등록요건으로 최저자기자본 40억원 , 계좌관리 전문인력 1명, 내부통제 전문인력 1명, 전산 전문인력 2명 등을 갖추도록 하였다. ② 자본시장법 하위법규 개정안 주요내용 현재는 일반투자자 간 채권의 매수·매도 수요가 크지 않으나, 토큰화 를 통한 채권 유통시장의 변화 를 예상 하는 시각을 반영하여, 비상장주식, 비금전 신탁수익증권에 더해 채무증권 에 대해서도 장외거래소 인가단위(2o-11-1) 를 추가 신설 한다. 투자자 보호를 위해 법률에서 시행령에 위임한 장외거래소 일반투자자 투자한도 는 “ 장외거래소별 연간 순매수 금액 (총매수금액-총매도금액)”을 기준으로 1억원 한도 를 설정한다. [향후계획] 입법예고 기간 중에 충분히 의견을 수렴할 예정 이다. 지난 토큰증권 협의체 (ʼ26.9.4일) 에서 발표한 ｢ 토큰증권 정책발향｣에 대해 업계 등에서 제기되는 의견 * 들도 공식 입법절차 과정에서 충분히 논의할 예정이다. * 예시) 1) 일반투자자 장외주식거래소 거래한도(연간 순매수 1억원)를 높여야 한다는 의견 2) 발행인계좌관리기관 최저자기자본 기준(40억원)을 낮추어야 한다는 의견 3) 분산원장 요건을 완화해야 한다는 의견 등 한편, ｢ 자본시장법 시행령 ｣, ｢ 전자증권법 시행령 ｣, ｢ 금투업규정 ｣, ｢ 증권의 발행 및 공시 등에 관한 규정 ｣ 및 ｢ 전자등록업규정 ｣ 개정안은 ’26.10.2일 ~ 11.11일 예고기간 을 거쳐 금융위원회 의결, 법제처 심사, 차관회의·국무회의 의결 등의 절차를 거쳐 법률 시행일인 ʼ27.2.4일부터 시행될 예정이다.", "essential": false, "importanceReasons": ["law/regulation change (+1)"]}, {"source": "FSC", "title": "’26년 상반기 가상자산사업자 실태조사 결과", "department": "가상자산검사과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87835", "summary": "’26년 상반기 가상자산사업자 실태조사 결과 1 실태조사 개요 □ 금융정보분석원 (원장 이형주) 과 금융감독원은 국내 가상자산 시장 현황 파악 을 위해 가상자산사업자 26개사 (’26년 6월말 기준) 에 대한 ’26년 상반기 실태조사를 실시 하였습니다. \u003c 가상자산사업자 실태조사 개요 > 조사대상 : 26개 가상자산사업자 * (17개 거래소, 9개 지갑·보관업자) 조사방법 : 사업자가 작성ㆍ제출한 값을 기초로 집계 대상기간 및 기준시점 X_OPEN2", "title": "「2026 건전증시포럼」 개최", "department": "", "date": "2026-10-01", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015786", "summary": "첨부 참조", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSC", "title": "법인 대표이사의 시세조종행위 등 불공정거래 행위에 대한 적발·조치(3건)     - 제17차 증권선물위원회(9.30.) 의결", "department": "자본시장조사총괄과", "date": "2026-10-01", "url": "https://www.fsc.go.kr/no010101/87840", "summary": "법인 대표이사의 시세조종행위 등 불공정거래 행위에 대한 적발·조치 (3건) - 제17차 증권선물위원회(9.30.) 의결 - [ 조치개요 ] 증권선물위원회 는 제17차 정례회의( ’ 26.9.30.)에서, (1) 상장회사 주식 및 경영권 양수자와 주식 일부의 양수 계약 체결을 교섭 중인자 및 정보수령자인 그 지인들을「자본시장과 금융투자업에 관한 법률」상 금지된 미공개중요 정보 이용행위 (제174조) 를 한 혐의로 검찰 에 통보 하였습니다. 또한, (2) 대체 거래소(NXT)의 얇은 호가 상황을 활용한 시세조종 주문을 통해 주가를 상승 시키고 부당이득을 취한 개인투자자, (3)장기간 시세조종 주문을 통해 주가를 부양한 부동산 개발회사 최대주주 겸 대표이사에 대해 「자본시장과 금융 투자업에 관한 법률」 상 시세조종행위 (제176조) 금지 위반 혐의 로 고발 조치 하였 습니다. ※ 세 건은 별개의 사건으로, 각각에 대해 개별적인 조치가 이루어진 것임 ◈ 자본시장법에서 금지하는 미공개중요정보 이용행위 는 내부자 가 상장법인 의 업무 등 과 관련 된 미공개중요정보 를 특정증권 등의 매매, 그 밖의 거래에 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §174) 를 말합니다. ◈ 자본시장법에서 금지하는 시세조종 행위 는 상장증권 또는 장내파생상품의 시장가격을 인위적으로 변동시키거나 오인하게 하는 행위로서, ➊ 매매가 성황을 이루고 있는 듯 이 잘못 알게 하거나, 그 밖에 타인에게 그릇된 판단 을 하게 할 목적 , ➋ 매매를 유인 할 목적, ➌ 시세를 고정 시키거나 안정 시킬 목적으로 매매하는 행위 (자본시장법 §176) 등을 말합니다. [ (1) 상장회사 A 주식의 대량취득자로부터 A사 주식 일부의 양수 계약 체결을 교섭 중인 투자자 등의 미공개중요정보 이용 행위 ] 상장회사 A 의 주식 및 경영권을 양수 하기로 한 대량취득자 B로부터, B가 취득하기로 한 A의 주식 중 일부 를 양수 하는 계약을 교섭 중 인 C법인의 대표이사 D (준내부자) 는 그 과정에서 취득한 A사에 대한 양수도계약 체결 정보 를 지인인 E 및 F (1차 정보수령자) 에게 전달하여 A사 주식 매매에 이용 하게 함으로써 수억원 상당의 부당이득 (준내부자 및 1차 정보수령자) 을 취득한 혐의가 있습니다. [ (2) 대체거래소(NXT)의 얇은 호가를 이용한 시세조종행위] G 는 전업투자자 로서 H사 주식 의 주가상승 을 통한 매매차익 을 취득하는 한편 대출 담보로 제공한 주식의 반대매매를 방지하기 위하여 가족 및 지인 등의 계좌들을 이용하여 다수의 시세조종 주문 을 제출함으로써 주가 를 상승 시키고 수 억원 상당의 부당이득 을 취한 혐의가 있습니다. 특히, G 는 한국거래소(이하 ‘KRX’) 와 대체거래소(이하 ‘NXT’) 양 시장에 번갈아 시세조종 주문을 제출하면서 그 중 호가창이 얇아 * 적은 매수주문으로도 가격 을 쉽게 변동 시킬 수 있는 NXT 시장 에 특정 시세조종 주문을 집중 제출 하 고, 유동성 이 상대적으로 낮은 NXT 시장 의 시세 를 상승 시키면 통합시세창 에 표시되는 현재가 역시 상승 한다는 점을 이용한 것으로 확인되었습니다. * 매도1호가와 매수1호가 간의 차이가 크거나, 매도호가 간 호가 공백이 크고 매도 잔량도 적은 시장 [ (3) I 社의 최대주주 겸 대표이사 J의 시세조종행위 ] I 社의 최대주주 겸 대표이사 J 는 본인, I, 배우자, 동생 등 4인 명의 11개 계좌를 이용하여 거래량이 적어 소액 으로도 시세 를 용이하게 변경 할 수 있는 甲 종목 을 대상으로 2년 5개월 간 수천회의 고가매수 , 종가관여, 가장· 통정 등 복합적 시세조종 주문 을 제출하여 주가를 끌어올림으로써 수백억원 상당의 부당이득 을 편취한 혐의가 있습니다. 한편, I 社 , J 는 시세조종 과정에서 5% 이상 지분 을 취득하여 대량보유 보고의 무 가 발생 하였음에도 이를 이행하지 않았습니다. [ 유의사항 ] 상장사 주식 및 경영권 양수 에 직접 참여하는 자 외에도 그 자와 계약을 체결 하고 있거나 체결을 교섭하고 있는 자 (그 자가 법인인 경우에는 임직원 포함) 도 양수도 계약 관련 정보 등 미공개중요정보를 이용하거나, 타인에게 이용하게 하는 경우 자본시장법 위반으로 1년 이상의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 또한, 상장증권 등과 관련하여 매매가 성황을 이루고 있는 듯이 잘못 알게 하거나, 타인에게 그릇된 판단을 하게 할 목적으로, 또는 매매를 유인할 목적으로 가장·통정 ·허위 매매 등을 할 경우 자본시장법 위반으로 1년 이상 의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 특히, 시세조종 행위자 는 거래량이 적은 종목 을 시세조종 하려는 경우가 많으므로 거래량이 적은 종목이 뚜렷한 이유 없이 주가상승 이 계속되는 경우 시세 조종 행위가 개입 하였을 가능성 이 있어 주의가 필요합니다. 또한 주가 급등락 없이 장기간 주가 를 완만히 상승 시키는 경우에도 시세조종 으로 적 발됨을 유의할 필요가 있습니다. 앞으로도 금융위원회와 금융감독원은 미공개정보 를 이용 한 자본시장 불공정거래 행위와 시세조종 행위 에 대해 엄정 하게 대응 해 나갈 예정이니, 관련 법규 준수 와 내부통제 강화 를 통해 불공정거래 행위가 발생하지 않도록 만전을 기해 주시길 당부드립니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 ‣ 인터넷 : 금융위원회 홈페이지 [참여마당 → 신고마당 → 불공정거래신고] 메뉴 ☞ 금융감독원 불법금융신고센터 ‣ 인터넷 : 금융감독원 홈페이지 [민원·신고 → 불법금융신고센터 → 증권불공정거래신고] 메뉴 ‣ 전 화 : 1332 ☞ 한국거래소 불공정거래신고센터 ‣ 인터넷 : 시장감시위원회 불공정거래신고센터 ( http://stockwatch.krx.co.kr ) ‣ 전 화 : 1577-0088 ※ 수 사에 미치는 영향 등을 고 려하여 조 치대상자 및 종목명은 공표하지 않습니다. 본 조치 사안과 관련한 문의는, 금융감독원 조사국으로 해주시길 바랍니다.", "essential": false, "importanceReasons": ["market-data feed (+2)"]}, {"source": "MOFE", "title": "재정경제부 유관기관 간담회 개최", "department": "기획재정담당관", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079507&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "MOFE", "title": "26.10월 국고채, 재정증권, 원화표시 외평채 발행 계획", "department": "국채정책과", "date": "2026.10.01.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079518&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": []}, {"source": "KRX_OPEN2", "title": "㈜이스트엔드 코넥스시장 상장신청서 접수", "department": "", "date": "2026-10-01", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015787", "summary": "첨부 참조", "essential": false, "importanceReasons": []}], "2026-10-02": [{"source": "FSS", "title": "노인의 날을 맞아 금감원-금융권 공동 고령층 집중 금융교육을 실시합니다", "department": "금융교육국", "date": "2026-10-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=234294&menuNo=200218&pageIndex=1", "summary": "□ (개 요) 금융감독원은 노인의 날(10.2.)을 맞아 금융권과 공동으로 고령층의 디지털 금융소외와 금융사기 피해 방지를 위한 집중 교육기간(’26.10~11월)을 운영합니다.\nㅇ 금번 교육기간을 맞아 은행업권(17개 은행)과 더불어 금융투자업권(금융투자협회) 및 가상자산업권(디지털자산거래소 공동협의체, 이하 DAXA)도 참여함으로써 금융권 공동 교육으로 확대 시행할 예정입니다.\nㅇ 아울러 한국지능정보사회진흥원, 대한노인회, 시니어금융교육협의회 등 유관기관과 협업을 통해 고령층 대상 교육수요를 적극 발굴하였습니다.\n□ (교육계획) ’26.10월~11월 기간중 금융감독원,17개 은행,금투협 및 DAXA는 전국 각지에서 고령층을 대상으로 총 687건의 교육을 실시할 계획(잠정)이며,\nㅇ 지방 교육 활성화를 위해 전체의 48.5%(333건)를 비수도권에서 실시하고 체험관 교육(227건), AI 디지털 배움터 교육(88건), 찾아가는 금융교육(372건) 등 다양한 프로그램을 운영할 예정입니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "2026년 상반기 파생결합증권, 사채 발행, 운용 현황", "department": "자본시장감독국", "date": "2026-10-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=234293&menuNo=200218&pageIndex=1", "summary": "ㅁ 투자수요 증가 등에 힘입어 파생결합증권 및 파생결합사채의 잔액이 2023.6월말(96.3조원) 이후 최고 수준인 96.7조원까지 회복한 것으로 나타났다.\n[ 발행,상환,잔액 ]\nㅁ 2026년 상반기중 파생결합증권,사채 발행액은 42.9조원으로 전년 동기 대비 8.9조원(26.2%) 증가하였다. 유형별로 보면 파생결합증권(ELS,DLS) 발행액은 14.3조원으로 종목형 ELS를 중심으로 전년 동기 대비 2.5조원(21.2%) 증가하였으며, 파생결합사채(ELB,DLB) 발행액은 28.6조원으로 ELB 상품 수요 증가 등으로 전년 동기 대비 6.4조원(28.8%) 증가하였다.\nㅇ 상환액을 보면 41.7조원으로 국내외 증시 상승에 따른 파생결합증권의 조기상환 및 파생결합사채의 만기상환 증가 등에 따라 전년 동기 대비 13.4조원(47.3%) 증가한 것으로 나타났다. 파생결합증권 상환액은 14.5조원, 파생결합사채 상환액은 27.2조원으로 전년 동기 대비 각각  ㅇ 대부협회 가 자율규제 로 운영 중인 광고 사전심의 대상 범위 를 온라인 대부광고 전반 으로 확대 * 하고, 광고 를 게재 하고자 하는 대부업체 의 적격 여부 심사 ** 도 병행 하는 방향으로 사전심의 제도 를 강화 한다. * 협회 사전심의 대상 : (現) 주요일간지 및 영상광고 (온라인·TV) → (改) 온라인 광고 일체 ** 예) 행정제재 이력, 6개월간 영업실적, 고정사업장 실제 사용 여부 등 - 플랫폼 사업자 등 광고 매체사 가 대부광고 게재 전 대부협회 의 사전심의 여부 확인 절차 를 거치도록 하고, 절차 위반시 과태료 를 부과 함으로써 대부광고 규율의 실효성 을 확보 할 계획 이다. ㅇ 한편 , ‘온라인 불법 대부광고 파파라치 제도’ * 도입 을 통해, 온라인 불법 대부광고 를 신고하는 경우 포상금을 받을 수 있도록 하여 시장 기능 으로 감시·차단하는 방안 도 추진 할 예정 이다. * (포상금 기준 (예시) ) ① 미심의 광고 , 법 위반 광고 신고 → 건당 5천원, ② 불법사금융 연계 불법영업 신고 → 건당 50만원 지급 ⇒ 대부업법 및 시행령, 협회 광고심의규정 등 개정 추진(‘26.4Q) ② 불법사금융‘위장수사 제도’및 피해자 신고 독려기간 도입･운영 검토 ㅇ 디지털 성범죄 및 마약범죄 수사 등에 활용되고 있는 ‘위장수사 제도’ 를 불법사금융 범죄 수사 에 도입 할지 여부 등을 관계부처 와 협의 하여 검토하기로 하였다. ㅇ 또한 불법사금융 피해자 중 일부 는 대출ㆍ상환과정 에서 불법사금융업자지시 ㆍ강요 로 불법행위 에 가담 하거나 별개 의 불법행위 로 인한 처벌 을 우려 하여 피해신고 를 기피 하는 문제 가 있다는 인식 하에 - 공소청･경찰 등 관계기관 협의 후 불법사금융 관련 특별 자수 요건･ 기간 등을 정하여 피해자 신고 를 독려 하는 방안을 검토 하기로 하였다. ⇒ 대부업법 개정안 마련 착수(즉시), 피해자 신고 독려기간 운영(‘27.上) ③ 플랫폼 사업자 불법광고 삭제･차단 등 자율규제 이행실적 점검 ㅇ ‘26.7.7일 개정된 정보통신망법 에 따라 온라인 플랫폼의 불법정보 에 대한 자율규제 체계 * 가 마련 된 만큼, * 대규모 정보통신서비스 제공자에게 불법정보 신고·처리 및 이의신청 절차, 게재자에 대한 조치 사항, 판단기준을 담은 자율 운영 정책 수립 및 투명성 보고서 공표 의무 부과 - 방송미디어통신위원회 를 중심으로 플랫폼사업자 와 자율규제협의체 를 운영 하고 (’26.4Q) , 자율규제 이행 실적을 면밀히 점검 (‘27.上) 하기로 하였다. ④ 원스톱 지원서비스 절차 개선 ㅇ 신용회복위원회가 ‘원스톱 지원서비스’ 를 통한 피해자 상담 과정에서 필요시 즉각 수사 의뢰 가 가능 하도록 신용회복위원회 에 경찰 인력 을 파견 (‘26.4Q) 하여 신속 하게 수사 에 착수 하도록 절차 를 개선 * 할 예정 이다 . * 현재 통합지원센터 (상담) → 금감원 (자료 검토 및 수사 의뢰) → 경찰청 (수사) 단계로 절차가 이루어져, 긴급한 경우 대응이 느릴 수 있다는 우려 존재 □ 임기근 실장 은 불법사금융 근절 대책 은 단순한 금융거래 정상화 대책이 아닌 시급한 민생대책 이자 사람을 살리는 대책 으로 규정하고, ㅇ 금번 대책이 차질없이 이행 될 수 있도록 관계기관 간 적극 협업 을 주문 하고, 국무조정실 을 중심 으로 이행상황 을 지속 점검 하겠다고 밝혔다. ㅇ 아울러 추가 대응 필요성 이 있을 경우 적기에 TF 회의 를 추가 개최 하겠다며, 지속적인 불법사금융 근절 의지 도 표명 하였다. \u003c 불법사금융 피해 예방을 위한 안내 문구(피해 예방 권고문) > 불법사금융 피해에 노출된 경우 금융감독원(☎1332)에 신고하여 필요한 도움을 받을 수 있으며, 과다채무 등으로 어려움을 겪는 경우 서민금융진흥원(☎1397) 또는 신용회복위원회(☎1600-5500)에서 도움을 받을 수 있습니다. ※ 연이율 60% 초과 대부계약은 원금과 이자 모두 무효입니다. ※ 한국기자협회, 금융위원회, 금융감독원, 신용회복위원회가 공동 제정 (‘25.12.29일) 한 「 불법사금융 및 과다채무 피해 보도 권고기준 」에 따라 불법사금융 및 과다채무 피해, 정책서민금융 관련 보도를 할 때는 ’ 피해 예방 권고문 ‘을 기사 하단에 게재 해주시기 바랍니다.", "essential": false, "importanceReasons": ["rule change (+2)"]}, {"source": "FSS", "title": "불법사금융 근절을 위한 4대 추가 제도 개선 추진", "department": "민생침해대응총괄국", "date": "2026-10-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=234367&menuNo=200218&pageIndex=1", "summary": "- ① 모든 온라인 대부광고에 대해 자율 사전심의 및 불법광고 파파라치 제도 도입\n- ② 불법사금융 ‘위장수사 제도’ 및 피해자 신고 독려기간 도입,운영 검토\n- ③ 플랫폼 사업자 불법광고 삭제,차단 등 자율규제 이행실적 점검\n- ④ 원스톱 지원서비스 통한 피해 상담시 즉시 수사 의뢰가 가능토록 개선\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["rule change (+2)"]}, {"source": "FSC", "title": "제3회 ‘금융위人상’, 수요자 중심 정책에 파격포상", "department": "혁신기획재정담당관", "date": "2026-10-02", "url": "https://www.fsc.go.kr/no010101/87857", "summary": "제3회 ‘금융위人상’, 수요자 중심 정책에 파격포상 - ➊ 경제적 위기자 자살예방대책, ➋ 청년미래적금, ➌ 망분리 규제 완화 등 국민들이 필요로 하는 정책을 설계한 직원들에게 총 1,800만원 포상 1.‘금융위人상’개요 금융위원회(위원장 : 이억원)는 ’26.10.2일(금), 제3회 ｢금융위人상」시상식을 개최 하고, 탁월한 성과를 창출한 직원 3명에게 총 1,800만원의 포상금 을 수여하였다. ｢금융위人상｣은 국민이 체감할 수 있는 탁월한 성과를 창출한 직원에게 실질적인 보상을 제공 하기 위해 도입된 특별성과 포상금 제도 이다. 금융위원회는 지난 4월과 6월 두 차례 ｢금융위人상｣ 시상식을 개최하였으며, 7월에는 행정안전부 로부터 ‘ 국민체감도가 높은 굵직한 과제를 이끈 핵심 기여자를 발굴해 포상금을 지급 함으로써 제도의 취지를 충실히 구현한 점 ’을 높이 평가받아 특별성과 포상금 우수 운영기관으로 선정 된 바 있다. ｢금융위人상｣ 수상 후보는 금융위원회 홈페이지를 통한 대국민 추천 과 내부 직원 추천 등을 통해 모집하였으며(’26.7.13~8.21.), 내부 인사·외부 전문가 등으로 구성된 심사위원회가 성과의 파급력, 난이도, 기여도 등을 종합 평가하여 수상자 3명을 최종 선정하였다. 수상자는 금뮹이상(1,000만원), 은뮹이상(500만원), 동뮹이상(300만원) 각 1명으로, 금융위원장 표창·포상금과 함께 메달이 수여 된다. 이번 수상자들은 ▲ 경제 위기 취약계층 보호 , ▲ 청년 자산형성 지원 , ▲ 금융권 AI 규제 혁신 등 정책 수요자들이 필요로 하는 지점 을 짚어내어 정책을 구현한 공로를 인정받았다. ※ 금뮹이상·은뮹이상·동뮹이상은 금융위원회 마스코트 ‘뮹이’의 이름을 활용 2. 포상자 주요 공적사항 정재윤 사무관 : 경제적 위기자 자살예방대책 마련 금뮹이상 수상자인 복합지원팀 정재윤 사무관은 경제적 문제가 원인인 자살 (“Econocide”)의 심각성이 증가 하는 상황에서, 경제적 위기로 인한 자살은 사회적 타살이라는 인식하에 범부처·민관합동으로 ‘경제적 위기자 자살예방대책’을 마련 하였다. 종합채무상담 대표번호(☎1375) 신설 (’10월 중) , 경제적 위기자 발굴을 위한 기관간 협업 강화 , 서민·취약계층 대상 특화 금융 상품 제공 , 금융회사 사회공헌사업 홍보플랫폼 마련 등 국민 누구도 경 제적 시름 으로 삶을 포기하지 않는 ‘목숨 살리는 대한민국’을 실현 하기 위한 대책을 마련 하여 국무회의(’26.7.14.)에 보고하였다 김희진 사무관 : 청년미래적금 성공적 출시 은뮹이상 수상자인 청년정책과 김희진 사무관은 자산을 형성하는데 어려움을 겪고 있는 청년들의 첫 자산형성을 국가와 금융이 함께 돕는 ‘청년미래적금’을 설계하여 성공적으로 출시 하였다.(’26.6.29.) 가입대상, 납입구조, 정부기여금 지급방식, 소득 확인 등 세부 제도설계 와 금융회사·서민금융진흥원·국방부 등 관계기관과의 협의 를 주도적으로 추진하였으며, 138.5만명의 청년이 최종적으로 청년미래적금에 가입 하는 성과를 달성하였다. 특히, 훈련소 내 휴대전화 사용 제한으로 가입이 어려운 군장병의 애로를 선제적으로 발굴 하여 국방부와 협의를 통해 가입지원방안을 마련 하는 등 정책 사각지대를 해소 하였다. 김영준 사무관 : 망분리 규제 완화 추진 동뮹이상 수상자인 금융안전과 김영준 사무관은 프런티어 AI로 인한 신종 보안위협 이 대두된 상황에서, 금융회사가 스스로 효과적으로 대응 할 수 있도록 금융권 망분리 규제 완화 를 추진하였다. “ AI공격은 AI로 방어한다 ”는 정책 방향을 설정하고, 경미한 전산장애 관련 임직원 면책추진 , 금융AI보안연구소· 지원센터 설립, 금융 AI 보안 가이드라인 등 다각적인 보안대책 을 병행하였 다. 금융회사의 적극적인 보안강화 조치를 유도하고, 침해사고로 인한 국민 피해를 최소화할 수 있도록 금융권의 보안역량 강화를 위한 기틀을 마련 하였다. 3. 향후 계획 이억원 금융위원장은 “ 특별한 성과 는 국민들이 정말 필요로 하는 정책이 무엇인지 아는 것에서부터 시작된다 ”라며 “앞으로도 현장의 목소리를 놓치지 않고 이를 정책으로 구현해내는 직원 들을 발굴하여 파격적으로 보상하겠다 ” 라고 밝혔다. 금융위원회는 홈페이지를 통해 ’26.10.12일(월)부터 ｢금융위人상」후보에 대한 대국민 추천을 접수하고, 12월 중 제4회 시상식을 개최할 계획이다. 【붙임】포상자 주요 공적사항 세부내용", "essential": false, "importanceReasons": []}, {"source": "MOFE", "title": "시장상황점검회의 개최", "department": "자금시장정책과", "date": "2026.10.02.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079531&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "KOSCOM", "title": "[코스콤정보] FnGuide 국고통안채 3개월지수 명칭 변경 안내 산출 안내(가동일:20261006)", "department": "전체 공지", "date": "2026-10-02", "url": "https://data.koscom.co.kr/notice/110726/notice-detail", "summary": "1. 귀사의 무궁한 발전을 기원합니다.\n2. FnGuide채권지수 업종 추가를 아래와 같이 안내 드리오니 업무에 참고하시기 바랍니다.\nPS. 2026.10.06(화) 가동 예정인 채권지수의 명칭이 아래와 같이 변경 됩니다.\n- 아 래 -\n1. 가 동 일 :\n2026.10.06(화)\n2. 관 련 TR : FnGuide지수(L\n6000\n)\n3. 업종 추가 내역\n지수명(영문)\n지수ID\n지수 산출\n기준일\n지수\n초기값\nFnGuide 국고통안채 3개월지수\n→\nFnGuide 국고통안채 2-3년 지수\n(FnGuide KTB MSB 3M INDEX)\n→ (\nFnGuide KTB MSB 2-3Y INDEX\n)\nFBI011\n2021.06.10\n100\n4. 테스트 일정 :\n2026.09.07(월) ~\n2026.10.02(금)\n- UDP멀티캐스트 전송그룹 :\n233.38.231.173\n- U D P 분배포트 : (운용)10455, (테스트)11455\n- 인터넷분배포트 : (운용)30104, (테스트)30904\n5. 소급지수 제공일 :\n2026.10.02\n(금)\n6. 참조 파일 : 코드값모음집의 MKF채권지수ID 참조\n7. 담당자\n- 이상준 차장 767-8734", "essential": true, "importanceReasons": ["index methodology / constituents (+2)", "market-operations source (+1)", "has an upcoming effective date (+1)"]}, {"source": "KRX_OPEN2", "title": "신한자산운용 ETF 1종목 신규상장", "department": "", "date": "2026-10-02", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015788", "summary": "첨부 참조", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "최근 발생하는 금융권 침해위협에 면밀히 대응해 나가겠습니다.  - 금융위원회 사무처장 주재 「긴급 상황대응 회의」 개최", "department": "금융안전과", "date": "2026-10-02", "url": "https://www.fsc.go.kr/no010101/87869", "summary": "최근 발생하는 금융권 침해위협에 면밀히 대응해 나가겠습니다. - 금융위원회 사무처장 주재 「긴급 상황대응 회의」 개최- ▸ 외부에 노출된 전산시스템과 서비스 전반에 대한 보안점검 즉시 착수 ▸ 인증·접근통제 취약점을 점검하고 불필요한 정보 노출 및 비인가 접근 차단 ▸ 공격 IP 등 위협정보를 신속히 공유하고 금융권 공동대응 강화 [ 회의개요 ] ’26.10.2.(금) 금융위원회 는 신진창 사무처장 주재로 금융감독원, 금융 보안원, 주요 시중은행, 카드사 및 은행연합회, 여신금융협회 등과 함께 금융권 「긴급 상황대응 회의 」를 개최 하였다. 금번 회의는 최근 금융회사들 의 정보유출 사건 과 공격유형·수법 등을 공유하고, 국내 금융권의 보안현황 대응방향 을 논의하기 위해 개최 되었다. · 일시/장소 : ’26.10.2.(금) 15:00 / 정부서울청사 · 참석 : [금융위] 신진창 사무처장 (주재) , 디지털금융정책관 등 [금감원] 수석부원장, 디지털·IT부원장보, IT검사국장 등 [금보원] 사이버대응본부장, 침해대응부장 [금융회사] 은행 6개사, 카드 3개사 [협회] 은행연합회, 여신금융협회 · 논의사항 : 최근 금융권 침해시도 동향 및 대응방향 [ 주요 논의사항 ] 지난 9월 30일 발생한 신한은행 정보유출 사고 에 이어 국민은행 등 주요 금융회사에 대한 사이버공격 으로 추가 피해 가 발생함에 따라, 다른 금 융회 사들에 대한 유사사고 발생 가능성 에 대한 우려 가 제기되고 있다. 특히, 금번 사이버 공격 의 원인, 수 법 등을 면밀 하게 분석 하여 신속 하고 철저한 대응태세 를 갖출 필요가 있다. 금융위·금감원·금보원 은 최근 발생한 침해사고와 관련 하여 신고접수 즉시 현장조사 에 착수하여 대응 하는 한편, 추가 피해를 방지하기 위해 공격자 IP, 공격 유형 등 위협정보 를 관계기관 (KISA 등) 에 신속히 공유 하는 등 필요한 조 치를 취하고 있다. 아울러, 침해사고가 발생한 금융회사 가 소비자 보호, 피해보상 등을 차질 없이 이행 하도록 면밀히 관리·감독 해 나갈 방침이다. 신진창 사무처장 은 침해사고 예방 및 사고 발생 시 소비자 피해 최소화 등을 위해 금융권 에 다음 사항 을 주문 하였다. ① 외부에 노출된 전산시스템 전반에 대한 보안점검 실시 금융회사는 외부에 노출된 IT자산 과 서비스 를 빠짐없이 파악 하고, 보안 취약점 및 접근통제 현황 을 철저히 점검 하여야 한다. 특히, 대고객 서비스 여부, 서비스 종류 등에 관계없이 외부 에서 접근 할 수 있는 시스템 전반 을 점검 하여 보 안 사각지대가 발생하지 않아야 한다. ② 불필요한 정보노출 및 인증·접근통제 강화 불필요하게 외부 에 노출 되는 정보 를 최소화 하고, 인증 없이 내부정보 에 접근 할 수 있는 경로 가 있는지 철저히 점검 하여야 한다. 특히, 개인정보 등 내부정보를 조회 하는 과정에서 인증 절차 가 누락 되거나 미흡 하게 적용되 지 않도록 철저히 점검 하여야 한다. ③ 위협정보의 신속한 공유 및 금융권 공동대응 공격에 사용된 IP주소, 공격수법 및 침해시도 내역 등 위협정보 를 관계 기관과 금융회사 간 신속히 공유 하여야 한다. 개별 금융회사에 대한 침해 시도가 다른 금융회사 에서도 유사 하게 발생 할 수 있는 만큼, 금융권이 긴밀 히 협력 하여 공동대응 하여야 한다. 이를 위해, 보안취약점 체크리스트 제공 등을 통해 금융회사가 자체 보안 점검 을 철저히 실시 하도록 하고, 점검결과 를 조속한 시일 내에 제출·보고토록 할 예정이다 신진창 사무처장 은 “정보유출 등 사고가 발생하지 않도록 철저한 대비 태세 를 갖추는 것이 무엇보다 중요 하다”고 강조하면서, “불가피하게 사고가 발생한 이후에는 신속한 대응을 통해 소비자 피해가 최소화될 수 있도록 만 반의 준비 를 갖춰야 한다”고 언급하였다. 아울러, “금융권에 대한 침해 시도 를 면밀히 모니터링 하고, 위협정보를 신속히 공유 하는 등 긴밀히 협력해 나가는 한편, 침해사고의 원인 과 공격 수법 을 철저히 분석 하여 필요한 제도 개선 방안 을 신속히 마련 해나가겠다.”고 밝혔다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSS", "title": "최근 발생하는 금융권 침해위협에 면밀히 대응해 나가겠습니다", "department": "IT검사국", "date": "2026-10-02", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=234804&menuNo=200218&pageIndex=1", "summary": "ㅁ ’26.10.2.(금) 금융위원회는 신진창 사무처장 주재로 금융감독원, 금융보안원, 주요 시중은행, 카드사 및 은행연합회, 여신금융협회 등과 함께 금융권 「긴급 상황대응 회의」를 개최하였다.\nㅇ 금번 회의는 최근 금융회사들의 정보유출 사건과 공격유형,수법 등을 공유하고, 국내 금융권의 보안현황 대응방향을 논의하기 위해 개최되었다.\nㅁ 금융위,금감원,금보원은 최근 발생한 침해사고와 관련하여 신고접수 즉시 현장조사에 착수하여 대응하는 한편, 추가 피해를 방지하기 위해 공격자 IP, 공격유형 등 위협정보를 관계기관(KISA 등)에 신속히 공유하는 등 필요한 조치를 취하고 있다.\nㅇ 아울러, 침해사고가 발생한 금융회사가 소비자 보호, 피해보상 등을 차질 없이 이행하도록 면밀히 관리,감독해 나갈 방침이다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "KOSCOM", "title": "[코스콤정보분배] FnGuide K-AI반도체 코어테크 TOP3 지수 포함 6종 신규지수 소급데이터 안내(가동일:20261006)", "department": "전체 공지", "date": "2026-10-02", "url": "https://data.koscom.co.kr/notice/110728/notice-detail", "summary": "1. 귀 사의 무궁한 발전을 기원합니다.\n2. FnGuide에서 MKF지수 시규지수 6종의 소급데이터를 첨부와 같이 안내 드립니다.\nPS. 채권혼합지수의 소급데이터는 19시 ~ 20시 에 추가 안내 드리겠습니다.\n--  아  래  --\n1. 귀 사의 무궁한 발전을 기원합니다.\n2. FnGuide에서 MKF지수 업종추가를 공지하였기에 아래와 같이 전달 드립니다.\nPS. FnGu
