artment": "자본시장과,자산운용과,공정시장과", "date": "2026-11-13", "url": "https://www.fsc.go.kr/no010101/88139", "summary": "1 간담회 개요 정부 는 11월 13일(금) 한국거래소 에서 이재명 대통령 주재 로 「 자본시장 정책 간담회 」를 개최한다. 이번 간담회는 “ 신뢰받는 자본시장, 현장 에서 묻고 답을 찾다 ”를 주제로, 기업‧시장‧수급 의 전방위적 측면에서 우리 자본시장을 한 단계 업그레이드 하기 위한 정책방향을 현장의 전문가들과 함께 논의하기 위해 마련되었다. 간담회는 KTV 및 유튜브 를 통해 생중계 될 예정이다. ￭ ( 일시/장소 ) ‘26.11.13(금) 09:30~11:10 / 한국거래소 본관 2층 홍보관 ￭ ( 참석자 ) - (정부‧유관기관) 경제부총리, 금융위원장, 중기부장관, 금감원장, 거래소 이사장 - (국회) 유동수 정무위원장, 박상혁 의원, 오기형 의원 - (전문가) 증권사‧자산운용사‧PEF협의회 등 금융투자업계, 한국벤처투자‧산업은행‧VC 등 기관투자자, 학계‧연구원, 핀플루언서, M&A 전문가 등 - (기업계) 코스닥 기업, 코스닥협회, 벤처기업협회 등 ￭ ( 진행 ) 안귀령 청와대 부대변인 2 간담회 목적 및 주요내용 [간담회 추진배경] 국민주권정부는 출범 이후 그 어느 때보다 자본시장에 높은 관심 을 갖고 정책적 노력을 기울여 왔다. 자본시장을 혁신 성장의 플랫폼 으로 설정 하고 ➊ 신뢰, ➋ 주주보호, ➌ 혁신, ➍ 시장 접근성 제고 의 4대 축을 중심으로 시장 체질개선 을 일관되게 추진 중 이다. 최근 글로벌 AI‧반도체 산업의 불확실성 부각, 글로벌 기준금리 인상 기조, 중동 지정학적 리스크 등 대외 요인 으로 금융시장의 변동성 이 높아진 상황 이다. 이에 정부는 최고의 경각심 을 갖고 시장 상황을 면밀히 점검 하는 한편, 위기에 흔들리지 않는 시장을 위해 자본시장의 근본적인 체질개선 정책을 흔들림 없이 추진 해 나갈 계획이다. 오늘 간담회는 투자자, 기업 및 시장 전문가 와 직접 소통 하며 향후 자본시장 정책에 대한 현장의 목소리를 경청 하기 위해 마련되었다. [주제별 전문가 발제 및 자유토론] 본격적인 토론에 앞서 3명의 전문가가 기업‧시장‧수급의 각 분야의 주요 쟁점 에 대해 발제한다. 먼저, 기업 측면 에서 자본 시장연구원 이효섭 연구 위원 이 「 주주중심 경영확산과 기업가치 제고 」를 주제로 발표한다. 이효섭 연구위원은 코스피 PBR (’26.10월 1.74)이 과거 대비 상승하였으나 아직 주요국(미국 5.67, 대만 5.55, 일본 2.03) 대비 낮은 점을 고려할 때 추가 도약을 위한 노력이 필요 하다고 진단하였다. 아울러, PBR 1 미만 기업이 코스피 560개사, 코스닥 877개사에 달하는 만큼, 반도체 등 일부 업종을 넘어 기업가치 재평가를 시장 전반으로 확산 시킬 필요가 있다고 강조하였다. 국내 기업의 가치가 낮은 이유로는 주가 누르기 행태 , 지배주주의 M&A 프리미엄 독점 , 외부 견제 부재 등 지배구조 측면의 문제를 지적하였다. 이에 대한 개선방향으로 ▲ 저PBR 기업 명단공표 (11.2일 시행) 의 실효성 강화, ▲ 기관투자자 주주관여 촉진 을 위한 스튜어드십 코드 실효성 제고, 5%룰 공동 보유자 요건 완화, ▲ M&A 시장 정상화 를 위한 합병가액의 공정가액 산정 및 외부평가 (12.9일 시행예정) , 한국형 베어허그 활성화, 의무공개 매수 제도 도입 등을 제안하였다. 특히 의무공개매수 매수비율 ( 50%+1주 vs 100% )과 관련한 쟁점을 소개하면서 주주 보호 필요성과 M&A 시장 위축 우려 를 종합적으로 고려 하여 단계적 접근 이 필요하다는 의견을 제시하는 한편, 상증세법 등 세제 보완 을 통해 고의적으로 주가를 누르는 기업 에 대한 과세 필요성 을 강조하였다. 두 번째로, 시장 측면에서 한국금융연구원 임형준 연구위원 이 「 벤처 생태계와 코스닥 재설계 」를 주제로 발제를 진행한다. 임형준 연구위원은 코스닥 시장 이 VC 회수의 IPO 편중 에 따른 조기 상장 문제 , 부실‧저성과 기업의 퇴출 지연 등으로 부실‧취약 기업군이 증가 함에 따라, 시장 신뢰가 저하 되고 장기 ‧기관투자가 위축 되고 있다고 평가하였다. 그 해결책으로 임 연구위원은 우수한 고성장 기업이 출현‧성장하고 부실기업은 신속히 퇴출되는 역동적인 “다산다사(多産多死)” 환경 조성 을 정책목표 로 제시하였다. 구체적으로 ▲(IPO전) M&A‧세컨더리 시장 활성화 를 통한 회수경로 다변화, ▲(IPO 단계) 주관사‧ 기관투자자 책임 강화 등을 통해 유연하되 책임 있는 시장진입 유도 등을 제안하였으며, ▲(시장구조) 시장 세그먼트 분리 의 경우 코스닥 시장에 신규 장기‧기관자금을 유입 시키고 대표기업의 코스피 이전 상장 유인 을 낮출 수 있다는 기대 와 하위 세그먼트 소속 기업의 낙인효과 를 우려 가 병존하는 만큼, 설계만큼이나 운영이 관건 임을 강조하였다. 마지막으로 수급 측면에서 「 증시의 장기‧기관 중심 수요기반 확충 」에 대해 김학균 신영증권 리서치센터장 이 시장의 목소리를 대변하여 의견을 개진한다. 김학균 센터장은 ’26년중 우리 증시가 개인투자자와 자사주가 순매수하고 외국인과 기관투자자가 순매도하는 구도였다고 평가하였다. 한편, 가계금융자산 중 주식 비중은 ’25.3월말 20.2%에서 ’26.6월말 34.4%로 크게 상승했고, 올해(11.5일 누적) 가계 자금의 증시 순유입이 147.4조원으로 사상 최대를 기록하는 등 가계자금의 증시 유입이 확대 되는 모습이었다고 평가하였다. 그러나 이러한 흐름이 지속되려면 개인투자자가 “ 집단적 성공의 경험 ”을 쌓을 수 있어야 하며, 이를 위해 낮은 배당성향을 개선 하고 상장종목을 관리 하는 등 시장 자체의 매력도를 높이기 위한 노력을 지속해 나가야 한다고 강조하였다. 또한 장기 수급기반 확충을 위한 제도개선 과제 로서 ▲ ISA 를 국민의 평생 자산관리 플랫폼 으로 육성, ▲ 공모펀드 활성화 와 장기‧적립식 투자교육 확대 등을 제안하였다. 발제에 이어 참석자들의 자유토론 이 진행된다. 참석자들은 의무공개매수 제도 , 베어허그 등 저성과 기업 M&A 활성화, 상장폐지 강화, 코스닥 세그 먼트 분리 등을 포함한 주요 자본시장 정책과 쟁점에 대해 다양한 시각에서 의견을 개진할 예정이다. [향후 계획] 정부는 오늘 간담회에서 제시된 다양한 현장의 의견 을 반영 하여 국민이 공감하는 자본시장 정책을 설계 하고 추진해 나갈 계획이다. 현장에서 미처 발언하지 못한 의견은 서면 제안을 통해 추가로 수렴할 예정으로, 앞으로도 현장과 꾸준히 소통하며 시장의 의견을 정책에 적극 반영해 나갈 계획이다.", "essential": false, "importanceReasons": ["strong keyword in body text (+1)"], "market": true, "tier": "relevant"}, {"source": "FSC", "title": "서울 가격상승폭 둔화·매물 증가…수도권 내년 1분기까지 4만 호 이상 입주", "department": "금융정책과", "date": "2026-11-13", "url": "https://www.fsc.go.kr/no010101/88140", "summary": "□ 정부는 11월 13일(금) 11시 10분 정부서울청사 브리핑룸에서 「제3차 주택공급 정례브리핑」을 개최 하였다. * (참석) 국조실 경제조정실장, 국토부 주택토지실장ㆍ주택공급추진본부장, 금융위 금융정책국장, LH 공공주택본부장 ㅇ 이번 브리핑에서는 ➊ 최근 주택시장 동향과 내년 1분기까지 서울‧수도권 입주‧분양 (공공임대 입주자 모집공고 포함) 물량 , ➋ 주택 신속공급을 위한 제도개선 및 금융애로 해소 성과 , ➌ LH의 하반기 민간참여 공공주택사업 공모 추진계획 등을 중점적으로 설명하였다. 1. 서울 인허가·착공 증가로 공급기반 확대…수도권 넉 달여간 4만호 이상 입주 □ 최근 서울 주택시장은 가격 상승세가 둔화되고 매물이 증가하는 등 점차 일부 시장 하향 안정 지표 가 확대 되고 있다. ㅇ 강남·서초구의 집값 이 14주, 송파구 포함한 강남 3구는 12주 연속 하락 하였고, 금주 에는 성동구, 강동구 가 하락 전환 하고 있는 가운데 서울 아파트 매매 가격 상승률 이 7월 이후 둔화 되고 있고, 서울 아파트 매매 거래량 은 5월 이후 감소 중 으로 9월 에는 평년 수준 을 하회 하는 것으로 나타났다. * 서울 APT 매매가격 변동률 (한국부동산원) : (26.7월) 1.27 (8월) 1.05 (9월) 0.74 ↳ 9월 APT 매매가격 변동률: 강남 △1.65%, 서초 △1.25%, 송파 △0.45% ** 서울 APT 매매거래량 (천건) : (‘26.5월) 8.9 (6월) 7.7 (7월) 6.6 (8월) 4.6 (9월) 3.9 ↔ (9월 5년平) 4.1 ㅇ 11월 11일 기준 으로 서울 아파트 매매 매물 (아실) 은 8만 건 을 넘어서며 올해 초보다 40% 이상 증가하였고, 최근 3주간 (10월 21일 대비) 전세와 월세 매물건수도 각각 5.0%, 10.6%가 늘어 매매와 전월세를 합한 물량이 12만 3천 건을 넘어섰다. □ 서울의 주택 인허가와 착공도 지난해보다 증가 하면서 향후 주택공급을 위한 기반이 확대되고 있다. ㅇ 올해 1~9월 서울의 주택 인허가 물량 은 전년 동기 대비 33% 증가하였 으며, 이 중 아파트 인허가는 3.8만호 로 최근 10년 평균의 1.5배 수준 이다. 같은 기간 착공 물량도 2.2만호 로 지난해보다 36% 증가 하였다. □ 서울·수도권에서는 내년 1분기까지 아파트 4만호 이상의 입주가 예정되어 있으며, 신규 분양 도 계속 이루어질 전망이다. ㅇ 올해 11~12월 수도권에서 약 1.6만호, 내년 1분기 약 2.8만호 가 입주 를 개시한다. 특히 내년 1분기에는 서울에서만 약 6천호가 입주 한다. 특히 마포·서초·용산 지역 입주 물량도 약 4천호 규모로 예정되어 있다. ㅇ 한편 분양의 경우, 지난 10월에 서울 고덕강일 1,305호를 포함하여 1.6만호가 분양되었으며, 연말까지 약 1.1만호 가 추가로 분양될 예정 이다. 연말까지 고양창릉 1,100가구, 남양주왕숙 400가구, 부천대장 500가구 등 3기 신도시의 분양도 본격 추진된다. 2. 신속공급 제도개선 65건…지분적립형 공공분양, 6천호 규모의 8개 PF 사업장 금융애로 해소 등 성과 가시화 □ 정부는 8.13 주택 신속공급 대책에 포함된 145건의 제도개선 과제 중 65건 을 완료 하였으며, 나머지 80건도 계획에 따라 추진하고 있다. * 국토교통부 44건, 금융위원회 19건, 국무조정실 1건, 재정경제부 1건 ㅇ 주택공급과 관련한 인허가 절차 합리화와 사업 추진 관련 규제개선 등 46건의 과제 를 완료 하였다. ㅇ 주택공급 속도 제고를 위해 지난 9월 도심공공복합사업의 서울 지역 신규 후보지 11곳을 선정·발표 하고, 공공택지와 정비사업의 추진 속도를 높이기 위한 법률 개정도 추진 중 이다. □ 공공분양 방식을 새롭게 설계하여 주택 실수요자들이 목돈이 없어도 내 집을 마련할 수 있도록 초기 자금 부담을 낮춘 새로운 공공분양주택 도 공급 한다. ㅇ 12월 고양창릉 에서 지분적립형 공공분양주택 284호 를 공급 하여 입주 시 분양가의 25%만 납부하고 나머지 지분은 20년에 걸쳐 나누어 내도록 함으로써 실수요자의 초기 자금 부담을 낮출 계획이다. □ 8.13대책을 통해 발표된 공공택지 최단기 착공모델 을 적용하여 보상 등 토지 취득 절차 도 신속하게 추진 하고 있다. ㅇ 3기 신도시 선행지구 ( 남양주왕숙 1·2, 고양창릉, 부천대장, 인천계양, 하남 교산 ) 를 중심으로 이주율 은 ’25.7월 평균 53% 에서 ‘26.10월 평균 91% 로, 철거율 은 ’25.7월 평균 34% 에서 ‘26.10월 평균 70% 로 크게 상승 하였다 . ㅇ 후발지구인 광명시흥 의 경우, 조사와 감정평가를 동시에 진행하여 보상 착수 기간을 계획 대비 4개월 단축 하였으며, 보상비 1.3조원 을 추가 투입 (5.5조→6.8조) 하여 신속한 보상 을 추진할 계획이다. ㅇ 사유지 외에 국·공유지 부지 도 신속히 취득할 수 있도록 10월부터 조 달청, 재산관리청 등 으로 구성된 국공유지 무상귀속 협의체 를 시범 운영 ” 이라고 밝혔다. 모두발언 이후 1부 에서는 산업은행 회장 이 「정책금융 동행」 행사의 취지를 설명 하고 이어 산업은행 및 기업은행 에서 국민성장펀드 및 지방 우대금융 주요내용을 소개하며 그동안의 성과를 발표하였다. 특히, 국민성장펀드 와 관련하여 그간의 지역산업 지원 성과 * 와 더불어 내년부터 연 40조원, 5년간 총 200조원 이상 으로 운용규모를 확대할 것이라는 계획을 설명하였다. 아울러 국민성장펀드 가 자금투입을 통해 프로젝트의 원활한 수행을 지원한 우수사례 도 소개 하였는데, 경북지역 백신 R&D 및 생산공장 증설 에 3,000억원 대출을 공급한 사례와 대구 LFP양극재 생산공장 구축 에 2,200억원의 대출 지원한 사례 등이 소개되었다. * 국민성장펀드 지원실적: ‘26.10월까지 22.7조원 (비수도권 9.0조원, 47%) , 39건 (비수도권 27건) 또한, 지방공급 과 관련하여 4개 정책금융기관 (산은, 기은, 신보, 기보) 이 ‘26년 10월 까지 비수도권에 95.8조원 을 공급하여, 연말까지 ’26년 지방공급 비중 목표 * 를 달성 할 수 있을 것이라는 전망을 내놓았다. 한편, 지방우대 금융 의 우수사례 로는 대구지역 반도체 등 첨단장비 관련 공작기계 제조사에 기업은행 대출 327 억원을 지원한 사례와 비철금속 압연 제조사에 신보 보증 28억원을 지원한 사례 등을 소개하였다. * [지방공급 확대목표제] 정책금융 지방공급 비중 ‘25년 40%에서 ‘28년 45% 까지 확대 ‘26.10월 기준 비수도권에 44.5% 공급 중 → 연말까지 ‘26년 목표 41.7% 달성 예상 이후 순서로 대구 지역 상공회의소 회장과 대구·경북 소재 기업의 현장 애로사항 및 지역금융 활성화 의견 에 대한 청취 및 답변 이 이어졌다. 2부 에서는 정책금융기관별 지역기업 지원 프로그램 을 한자리에서 설명하고, 별도 상담 부스 를 통해 기업별 맞춤형 금융상담 도 진행하였다. 6개 기관 총 15명이 각 상담부스에서 현장을 찾아온 기업인들의 금융애로를 듣고 필요한 금융상품과 서비스를 친절히 안내하는 시간을 가졌다. 향후 6개 정책금융기관은 「 정책금융 동행 」 행사를 권역별 주요 도시를 중심 으로 순차 개최 할 예정이며, 금융위원회 및 지자체 등과 연계하여 지 역기업과의 현장 소통을 지속 확대 해 나갈 계획이다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "신진창 금융위원회 부위원장,  씨티그룹 국제부문 총 책임자 면담", "department": "글로벌금융과", "date": "2026-11-13", "url": "https://www.fsc.go.kr/no010101/88146", "summary": "신진창 금융위원회 부위원장 은 11월 13일(금) 정부서울청사에서 글로벌 금융그룹 인 씨티그룹 의 어네스토 토레스 칸투 (Ernesto Torres Cantu) 국제부문 총 책임자 (Head of International) 와 면담을 갖고 한국 금융시장 에 대한 지속 투자 및 양측 간 협력 방안 등을 논의하였다. 신 부위원장은 글로벌 금융그룹 은 국가 간 자본 과 기업 을 연결하는 가교 로서 중요한 역할을 하고 있다는 점을 강조하였다. 특히 씨티그룹 은 ’67년 외국계 은행 최초 로 국내 에 지점 을 설립한 이후 다양한 금융서비스를 최초 도입 * 하며 한국 은행산업 의 성장 역사를 함께해 온 오랜 파트너라고 평가하였다. * 개인재무관리(PB; Private Banking, ’89년), 365일 자동화 코너(’90년), 직불카드(‘93년) 등 이에 씨티그룹은 한국 이 AI·반도체 등 첨단산업 을 중심 으로 견조한 성장 기반 을 갖춘 중요한 시장이라고 평가하며, 한국시장 에 대한 지속적인 투자 의지 를 표명 하였다. 아울러 글로벌 네트워크 와 전문성 을 바탕으로 한국의 혁신·성장 기업 에 대한 기업금융 지원 을 강화 하겠다는 뜻을 밝혔다. 신 부위원장은 씨티그룹의 지속적인 ential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "routine"}, {"source": "FSC", "title": "정부는 최근 발생한 금융보안원의 침해사고와 관련하여 철저한 원인조사 및 재발방지 대책 마련을 지시하였습니다.", "department": "금융안전과", "date": "2026-11-16", "url": "https://www.fsc.go.kr/no010101/88152", "summary": "’26.11.16.(월) 금융위원회 신진창 부위원장 은 금융감독원 수석부원장과 함께 박상원 금융보안원장을 면담하는 자리를 가지고, 지난 11월 9일 금융보안원 에서 발생한 침해사고 관련 사고경위·조사 상 황 등 을 확인하고 면밀한 사고원인 조사 와 철저한 재발방지 대책 을 주문하였다. 이번에 금융보안원을 방문한 것은 최근 AI 기술의 급속한 발전으로 사이버 위협이 심화되고, 금융권 침해사고가 잇따라 발생하는 등 全 금융권의 보 안역량 강화가 그 어느 때보다 절실히 요구 되는 상황에서, 금융권 사이버 보안의 중추적인 역 할을 수행하는 금융보안원 에서 침해사고 가 발생한 것에 대한 엄중한 상황인식 하에 실시 되었다. \u003c※참고> 금융보안원 해킹사고 재발방지 현장점검 개요 · 일시/장소 : ’26.11.16.(월) 9:30 / 금융보안원 여의도 사무소 · 참석 : [금융위] 신진창 부위원장 (주재) , 디지털금융정책관 등 [금감원] 수석부원장, 디지털금융총괄국장 등 [금보원] 금융보안원장 등 금융위원회 는 침해사고 대응기관인 금융보안원에서 사고가 발생한 것 에 대해 깊은 유감 을 표명 하면서 사고 발생경위·원인 등에 대해 빠짐없이 철 저하게 조사 를 실시 하고, 침해사고 재발방지 를 위해 금융보안원의 IT 시 스템·업무체계 전반을 신속히 재점검 하는 한편, 혹여나 발생할 수 있는 소비자 피해방지에도 만전을 기할 것을 지시하였다. 신진창 부위원장 은 “금융보안원은 그 어느 기관보다도 스스로 가장 높은 수준 의 보안역량 과 책임감 을 갖춰 금융권의 모범 이 되어야 한다.”고 강조하 면서, “ 이번 사고를 교훈 삼아 조직 운영, 업무체계, IT시스템 등 업무 전반을 근본적 으로 쇄신하고, 국민 신뢰를 다시 회복할 수 있도록 실 효성 있는 재발방지 대책 을 조속히 마련 할 것을 당부”하였다. 아울러, “금융보안원은 그간 금융권 침해사고 에 대한 신속한 조사·대응 , 금 융권 보안역량 강화 지원 등 금융시스템 안전성 확보에 중요한 역 할을 수행해 온 만큼, 금융보안원에 대한 국민 기대가 작지 않다.”고 언 급하면서, “이번 침해사고 수습과 재발방지 노력은 물론, 현재 정부와 함께 추진 중인 ▲ 全금융권 보안 전수점검 , ▲ 보안관제체계 고도화 , ▲ 중소형 금융권 보안 지원 등 주요 보안정책 과제 들에 대해서도 차질 없이 이행 하여 금융권 전체의 보안역량 강화라는 본연의 책무 를 충실히 수행 해 줄 것”을 강조하였다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "이억원 금융위원장,  글로벌 금융안정 공조 및 유럽 주요 금융당국과 협력 강화 나선다", "department": "글로벌금융과", "date": "2026-11-16", "url": "https://www.fsc.go.kr/no010101/88151", "summary": "이억원 금융위원장 은 FSB 총회에 참석하여 글로벌 금융안정 을 위한 국제 논의에 적극 참여 하고, 유럽 주요 금융당국과의 협력 기반 을 강화 하며, 글로벌 금융중심지 와 협력 을 확장해 나가기 위해 11.15일 (일) ~21일 (토) 일정 으로 유럽 (스위스 , 독일, 영국) 을 방문한다. 먼저, FSB 총회 (Plenary)에 참석하여 글로벌 금융 취약성, 인공지능 (AI) , 스테이블코인 등 주요 금융현안과 FSB의 내년도 주요업무 계획을 논의한다. FSB 회원국들은 각국의 정책경험 을 공유 하고, AI 등 주요 이슈에 효과적으로 대응하기 위한 국제협력 방안 등을 논의할 예정이다. * G20 (EU포함) + 금융중심지 5개국 (네덜란드·홍콩·싱가포르·스페인·스위스) 의 59개 회원기관(재무부, 금융당국, 중앙은행 대상)과 13개 국제기구로 구성된 금융안정위원회(FSB, Financial Stability Board) 그리고, 유럽중앙은행 (European Central Bank, ECB) 프랭크 앨더슨 (Frank Elderson) 감 독위원회 부의장 을 만나 면담하고, 양 기관 간 협력 강화 를 위한 업무협약 (MOU, Memorandum of Understanding) 체결 을 추진한다. 동 MOU는 ’24년 부터 약 2년간 논의 를 이어온 것으로, 한국 과 유럽연합 (EU, European Union) 간 은행 감독 협력 을 공식화 한다는 점에서 의미가 있으며, 이 위원장은 이번 방문을 계기로 MOU 체결 을 최종 확정 한다. 글로벌 금융중심지 인 런던 에서는 공공·민간 부문 을 아우르는 교류 와 업권 별 금융산업 현장 방문 을 진행한다. * GFCI(글로벌 금융센터 지수) 순위: (1위) 뉴욕, ( 2위) 런던 , (7위) 서울 (’26.9월) 영국 의회 에 방문 하여 對한국통상특사 인 존 슬링어 (John Slinger) 하원의원 을 만나 한-영 상호 진출 및 투자 강화 방안 을 논의하고, 브로넥 마소자다 (Bronek Masojada) 신임 (11.13일 취임) 런던금융특구 시장 (Lord Mayor) 를 만나 양국 금융중심지 활성화 방안 을 공유한다. 또한, 은행 (스탠다드차타드 그룹 CEO 빌 윈터스(Bill Winters)) , 자산운용 (아문디 글로벌채권 CIO 그레고와르 페스케(Gregoire Pesques)) , 보험 (로이즈 보험시장 CEO 찰스 록스버러 경(Sir Charles Roxburgh)) 등 업권별 주요 기관 을 방문해 글로벌 금융산업 의 동향 과 혁신 사례 를 살펴본다. 더불어 프랑크푸르트 와 런던 에서는 각각 현지 진출 국내 금융회사 들과 간담회 를 개최하여 현지 영업환경 및 규제 관련 애로사항 을 청취한다. 간담회 에서 청취한 현장의 목소리 는 신속하게 관련 해외 당국 에 전달 하고, 우리 금융회 사의 애로사항을 해소하기 위해 노력할 예정이다. 이 위원장은 이번 출장을 통해 국제 금융협력 네트워크 를 유럽 권역 으로 확대 하고, 글로벌 금융중심지 의 현장 방문 을 통해 한국 금융시장 의 경쟁력 제고 방 안 을 모색할 계획이다. 이를 바탕으로 국내 금융회사 와 핀테크 기업 의 해외 진출 및 글로벌 금융시장 참여 를 확대 할 수 있을 것으로 기대된다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "불법사금융 원스톱 지원,  이제 센터 방문 없이도 신청 가능합니다.", "department": "가계금융과", "date": "2026-11-16", "url": "https://www.fsc.go.kr/no010101/88150", "summary": "금융위원회는 불법사금융 피해자 분들께서 서민금융통합지원센터를 방문 하지 않고도 ｢불법사금융 원스톱 지원」을 신청하실 수 있도록 온라인 창구 를 개설 한다. 불법사금융 피해자분들께서는 ’26.11.16일(월) 부터 신용회복위원회 홈페이지 및 모바일 앱 에서도 원스톱 지원 을 이용하실 수 있다. 아울러 피해자분들이 제도를 몰라 피해회복 기회를 놓치지 않도록 , 반 사회적 대부계약 무효화 등 주요 제도개선 과 무효확인서 활용 방법 을 안내한다. \u003c 「불법사금융 원스톱 종합·전담 지원」이란? > ◾ 피해자별로 배정되는 신용회복위원회 전담자가 다음의 절차를 도와드립니다. ➊ 불법사금융업자에게 위법성을 고지하고 불법추심 중단 경고 및 채무종결 요구 ➋ 반사회적 대부계약 무효확인서 발급 (☞ 원금·이자 모두 갚지 않아도 됨) ➌ 채무자대리인 무료 선임 및 법률상담 (☞ 이후 추심 연락은 채무자대리인이 상대) ➍ 불법추심 에 이용된 전화번호·SNS계정 이용중지 및 범죄이용 계좌 지급정지 ➎ 경찰 수사의뢰 (☞ 불법사금융업자 검거 후 부당이득 반환 등 피해회복 소송 연계) ➏ 신복위 채무조정 및 금융·고용·복지 복합지원 연계 ※ 상담부터 지원까지 모든 절차는 무료입니다. I . 불법사금융 원스톱 지원 온라인 창구 개설 ☞ 피해자에게 무엇이 달라지나요? · 서민금융통합지원센터에 방문하지 않아도 온라인으로 원스톱 지원을 신청 할 수 있습니다. · 온라인 신청은 24시간 가능 하므로, 야간·주말 에도 원하는 때 에 신청할 수 있습니다. · 온라인으로 신청해도 방문신청과 똑같이 전담자가 배정 되어 도움을 받을 수 있습니다. 그간 「불법사금융 원스톱 종합·전담 지원」서비스는 서민금융통합지원센터를 직접 방문 해야 전담자를 배정받을 수 있는 오프라인 방식으로만 운영 되었다. 정부는 전담센터를 전국 22개소로 확대하는 등 서비스 접근성을 높여 왔으나, 생업으로 평일 낮 방문이 어렵 거나 , 센터와 먼 지역에 거주 하거나, 불법추심에 따른 불안으로 외출을 꺼리는 등 방문이 어려우신 경우도 여전히 있었다. 11.16일(월)부터 는 신용회복위원회 홈페이지(cyber.ccrs.or.kr) 와 모바일 앱 에서 「 불법사금융 원스톱 종합·전담 지원 」을 온라인으로 신청 할 수 있다. 본인인증 완료 후 불사금업자 정보, 피해금액 등 최소한의 정보만 입력 하면 신청이 완료 된다. 어떻게 신고해야 할지 모르는 경우에는 우선 신용 회복위원회 콜센터 (☎1375) 로 문의 하면 피해자의 상황에 맞는 방법을 안내 받으실 수 있다. 신청이 접수되면 피해자별로 전담자가 배정 되며, 전담자는 전화·문자 로 연락 해 피해신고서 작성을 돕는 한편 불법사채업자에게 불법추심 중단 경고 및 채무종결 요구 를 진행한다. 이후 채무자대리인 선임, 무효확인서 발급, 수사의뢰, 채무조정·복합지원 연계 등을 오프라인 신청과 동일하게 지원 한다. II . 「원스톱 종합·전담 지원」 서비스 운영현황 원스톱 지원이 시행된 이후 약 8개월간 1,239명 이 피해상담 을 받았고, 그 중 987명 이 불법채무 7,231건 (1인당 평균 약 7.3건) 을 신고 하였다. \u003c 불법사금융 원스톱 종합·전담 지원시스템 운영 현황(2.23.~10.31.)> 상담(명) 접수(명) (불법채무(건)) 신복위 경고조치(건) 전화번호·SNS 이용중지 조치의뢰(건) 채무자대리인 선임의뢰(건) 무효확인서 발급(건) 수사의뢰(명) 계좌정지 조치의뢰(건) ** 복합지원(명) 채무 조정 금융·고용·복지 연계 1,239 987 (7,231) 5,469 215 2,623 192 1,178 * 116 123 63 * 불법사금융업자 1,178명(채무자 기준 219건) ** 금감원 접수건 포함 총 321건 의 불법사금융 거래계좌를 금융회사에 통보 (다수 불법거래에 중복 이용된 건 제외) 신용회복위원회 전담자는 5,469건 의 불법채무에 대해 불법사채업자에게 불법추심 중단 과 채무종결 을 신속히 요구하고, 이 중 776건 은 채무종결 합의 를 이끌어냈다. 또한 186명 의 피해자 분 들께는 채무조정, 정책 서민금융, 고용·복지상담 등 필요한 지원을 연계하였다. 피해신고를 접수한 금융감독원은 피해자분들이 불법추심 대응 및 피해회복 소송 등 에 활용 하실 수 있도록 무효확인서 192건 을 발급 하였으며, 2,623건 에 대해서는 대한법률구조공단 과의 연계를 통해 채무자대리인 을 선임 하여 지속되는 추심에 대응하였다. 범죄 혐의가 구체적으로 확인된 불법사금융업자 1,178명 에 대해 경찰 에 수사 를 의뢰 하였다. \u003c 불법사금융 원스톱 지원 사례 > ◾ [사례 1] 소액 반복 차입 피해(40대 A씨) · 기초생활수급자 A씨는 병원비 부담으로 생활비가 부족해지자 텔레그램으로 불법사금융업자에게 세 차례 총 180만원을 빌려 310만원을 갚음( 연 이자율 약 867% ). 추가로 빌린 80만원을 갚기 어려워지자 원스톱 지원을 신청함 ⇨ 전담자는 업자와 직접 통화해 A씨의 어려운 형편과 이미 과도한 이자를 받아간 점을 들어 채무종결을 요구했고, 업자가 이를 받아들여 남은 채무 135만원을 종결 처리 함. 이후 개인파산(신속면책) 신청 을 통한 장기연체채무 정리와 정신건강복지센터 상담 연계를 지원함 ◾ [사례 2] 돌려막기로 인한 다중 채무 피해(40대 B씨) · 상품판매 일용직으로 일하는 B씨는 결혼 준비로 급전이 필요해 불법사금융을 이용함(30만원을 빌리고 1주일 뒤 50만원 상환, 연 이자율 약 3,476% ). 돌려막기가 이어지면서 거래한 불법 사금융업자는 21곳, 빌린 돈은 970만원 으로 불어남. 상환이 어려워지자 업자들은 밤늦게 연락해 예비 배우자에게 채무 사실을 알리겠다고 협박 하였고, 이에 원스톱 지원을 신청함. ⇨ 전담자는 상담 당일 21개 업자 모두에게 채무종결과 초과 수취금 반환을 요구함. 업자들이 응하지 않자 채무자대리인 선임·무효확인서 발급 등 후속 피해구제 절차 로 연계함 IV . 반사회적 대부계약 무효화 등 제도개선 안내 주요 제도개선 사항 ’25.7.22일 시행된 개정 대부업법에 따라 연 60%를 초과하는 초고금리 계약이나 성착취 추심, 폭행·협박 등을 원인으로 맺은 반사회적 대부계약 은 원금과 이자 모두 무효 이다. 이자율이 연 60% 이하더라도, 불법사금융업자와 체결한 대부계약의 이자는 무효 이다. 따라서 피해자는 무효인 부분 은 갚지 않아도 되고 , 이미 갚은 돈은 반환 을 청구 할 수 있다. 무효확인서 활용방법 금융감독원은 반사회적 대부계약 (’25.7.22.이후 체결) 피해자 에게 금융감독원장 명의 의 「반사회적 대부계약 무효확인서」 를 발급 하고 있다. 피해자 분들은 신용회복위원회의 ｢ 원스톱 지원｣ 을 이용하거나, 금융감독원 홈페이지 ｢ 불법 사금융 원스톱 피해신고 ｣를 통해 무효확인서 발급 을 신청 할 수 있다. 신청이 접수되면 금융감독원은 연락처가 확인된 불법사금융업자에게 원금·이자 무효 사실과 추심 중단을 알리는 경고 문자 를 보내고, 발급한 무효확인 서는 피해자에게 전달하는 동시에 불법사금융업자에게도 직접 통보 한다. 피해자는 무효확인서를 근거로 상환 거부 및 추심 중단을 요구 할 수 있고, 부당이득 반환 청구, 수사·재판 과정 에서도 활용할 수 있다. ※ 피해회복소송 제기를 위해 대한법률구조공단의 무료 소송지원도 이용 가능 \u003c 무효확인서 활용 피해구제 사례 > ◾ [사례] 무효확인서를 인용한 형사 무죄 판결 (대구지방법원, ’26.9.29.) · 피해자가 상품권 예약판매( 20만원 을 현금으로 받고, 20일 뒤 30만원 상당 상품권 을 보내는 방식)로 돈을 빌렸다가 상품권을 보내지 못하자, 업자들이 피해자를 사기 혐의로 고소 · (법원 판단) 금감원 무효확인서 를 근거로 해당 거래를 상품권 거래를 가장한 불법사금융 으로 인정하고, 업자들은 고율의 이자를 노리고 회수 불능 위험을 감수 한 것이라며 무죄를 선고 V . 향후 계획 온라인 창구 개설 초기에는 신청이 몰릴 수 있는 만큼 신청·처리 현황을 면밀히 모니터링 하고, 신청 건이 지연 없이 처리 되도록 이용자 의견 을 반영해 온라인 서비스 운영 을 계속 점검·보완해 나갈 계획이다. 또한, 오는 ’26.12월에는 신용회복위원회 에 경찰관 을 파견 하고, 상담 단계 에서도 수사의뢰 가 이루어지도록 절차 를 개선한다. 앞으로도 정부는 원스톱 지원 서비스가 실효적인 피해자 보호 창구로 기능할 수 있도록 관계기관과 함께 운영상황을 주기적으로 점검 하면서 제도를 보완하고, 제도를 몰라서 이용하지 못하는 피해자가 없도록 원스톱 지원과 개선된 제도에 대한 홍보 및 안내를 강화할 계획이다. \u003c 불법사금융 피해 예방을 위한 안내 문구(피해 예방 권고문) > 불법사금융 피해에 노출된 경우 금융감독원(☎1332)에 신고하여 필요한 도움을 받을 수 있으며, 과다채무 등으로 어려움을 겪는 경우 서민금융진흥원(☎1397) 또는 신용회복위원회(☎1375)에서 도움을 받을 수 있습니다. ※ 연이율 60% 초과 대부계약은 원금과 이자  ▲全금융권이 각 회사가 보유한 IT자산을 스스로 면밀히 식별,관리하는 의무를 부과하는 한편, ▲대형 금융회사의 취약점 분석,평가 주기를 연 1회에서 연 2회로 확대하고 ▲긴급한 취약점 점검 필요 발생시 금융당국이 수시점검을 요청하는 근거를 마련하며, ▲전자금융기반시설에 직,간접적으로 연결된 모든 시스템을 점검대상으로 명시하는 등 취약점 분석,평가를 내실화하는 내용을 담고 있다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "26.9월말 국내은행의 원화대출 연체율 현황(잠정)", "department": "은행리스크감독국", "date": "2026-11-18", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249902&menuNo=200218&pageIndex=1", "summary": "? ’26.9월말 은행권 연체율은 분기말 상매각 등 연체채권 관리 효과로 전월 대비 하락하였고, 신규연체율 또한 ’23.7월 이후 가장 낮은 수준\nㅇ 다만, 전년동기 대비로는 모든 부문의 연체율이 상승하는 등 중장기적 상승세가 지속되고 있으며,\nㅇ 금리 상승 기조 등 대내외 여건 및 연체채권 상매각의 기저효과 감안시 연체율이 다시 반등할 가능성 상존\n? 금감원은 은행권이 충분한 자본?대손충당금 적립 등을 통해 손실흡수능력을 확충하고, 정리가 필요한 연체채권은 신속히 상,매각하는 한편,\nㅇ 회생 가능성 및 상환능력 등을 고려하여 재기가 가능할 것으로 판단되는 차주에 대해서는 상환부담 경감 효과를 체감할 수 있도록 실효성 있는 채무조정을 실시토록 유도할 예정\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "全금융권이 상시적으로 철저하게 보안 관리에 임하도록 IT자산 식별·관리를 의무화하고 취약점 점검·평가 제도를 내실화하겠습니다.", "department": "금융안전과", "date": "2026-11-18", "url": "https://www.fsc.go.kr/no010101/88162", "summary": "금융위원회는 ｢전자금융감독규정｣ 일부개정안 규정변경예고 (‘26.11.18∼11.30일) 를 실시 한다. 이번 개정안은 지난 ’26.11.5일 발표한 ｢全금융권 보안체계 혁신방안｣의 후속조치로서, ▲全금융권이 각 회사가 보유한 IT자산을 스스로 면밀히 식별·관리 하는 의무를 부과하는 한편, ▲ 대형 금융회사 의 취약점 분석·평가 주기를 연 1회에서 연 2회로 확대 하고 ▲긴급한 취약점 점검 필요 발생시 금융당국이 수시점검을 요청 하는 근거를 마련하며, ▲ 전자금융 기반시설에 직·간접적으로 연결된 모든 시스템을 점검대상으로 명시 하는 등 취약점 분석·평가를 내실화 하는 내용을 담고 있다. 금번 ｢전자금융감독규정｣ 개정안은 규정변경예고와 법제처·규개위 심사, 금융위 의결 등을 거쳐 ‘27년 1분기 중 시행 을 목표로 추진한다. 다만, 규정개정 내용 중 시급한 추진이 필요한 ▲대형 금융사의 취약점 분석·평가 주기 단축(연 1회→2회)과 ▲전자금융기반시설과 연결된 모든 시스템 점검대상 포함 과제는 행정지도를 통해 11월부터 신속히 추진 할 예정이다. \u003c 전자금융감독규정 개정안 주요 내용 > IT자산 식별·관리체계 수립·운영 및 최신화 (안 제14조) 전금법 대상 모든 금융회사 및 전자금융업자는 ▲정보처리시스템, 통신장비, 정보보호시스템 등 각 회사가 보유하고 있는 모든 정보기술자산을 식별 하고, ▲ 중요도에 따라 분류 하고 책임자를 지정 하며 ▲ 해당 자산목록을 최신상태로 관리 하여야 한다. 최근 벌어지고 있는 금융권 해킹 사고는 보안관리가 철저한 핵심 시스템이 아니라 상대적으로 보안이 허술한 업무지원관리 등 주변부 시스템에서 주로 발생하고 있다. AI를 활용한 해킹의 특성상 이러한 “약한 고리”를 빠르고 치밀하게 공격하는 침해공격이 앞으로 지속될 것으로 예상되는 바, 전 금융권과 전자금융업자들이 스스로 보유한 IT 자산목록을 명확히 파악하고, 주변부 시스템까지 꼼꼼히 점검·관리토록 하는 조치이다. 대형 금융사 취약점 분석·평가 주기 단축 (연 1회→2회)(안 제37조의2제1항) 총자산 규모 2조원 이상, 상시 종업원 수 300명 이상인 대형 금융회사 는 기존 연 1회 실시하던 취약점 분석·평가를, 두 배 확대된 연 2회 (반기 당 1회) 실시하는 것이 의무화 된다. 취약점 분석·평가는 금융회사·전자금융업자의 상시적인 보안관리·취약점 점 검을 위한 제도로서, 금융보안원·민간 보안업체 등으로부터 IT 자산 전반의 취약점 여부 등을 점검받고, 그 결과와 보완계획을 금융당국에 제출토록 하는 제도이다. (전자금융거래법 제21조의3) AI를 통한 침해위협이 빠르게 진화·발전하고 있으며, 전산자원의 취약점도 과거와 비교할 수 없이 빈번히 나타나고 있는 상황에서, 보다 밀도있고 신속하게 전산 시스템의 취약점을 확인하고 조치하기 위한 제도 개선이다. 우선 점검여력이 있는 대형 금융사부터 연 2회 점검을 의무화하되, 금융권 준비상황 등 을 보아가며 적용범위를 신속히 확대 해 나갈 예정이다. 긴급한 점검 필요시 금융당국의 수시점검 요청 신설 (안 제37조의2제7항) 다수의 금융회사에 유사한 침해사고가 연달아 발생하는 등 긴급한 취약점 확인 및 신속한 조치가 필요한 경우에는 금융위원회가 해당 금융회사·전자 금융업자 등에 대해 수시로 취약점 분석·평가를 요청 할 수 있는 근거도 마련된다. 시스템상 유사한 취약점을 노린 침해사고가 빈발하거나, PHP 등 광범위 하게 사용되는 소프트웨어에 중요한 취약점이 나타나는 경우에는 위험성이 높은 업권이나 금융회사 등에 정기적인 점검 외에도 시급한 취약점 분석· 평가 및 이에 따른 조치가 필요할 수 있다. 금융당국에서 이러한 시급한 경우에 점검 대상과 범위 등을 정하여 통보하면, 금융회사·전금업자 등은 지체없이 이를 이행하도록 제도화할 계획이다. 취약점 분석·평가 시 의무점검 범위 명시 (안 제37조의2제8항) 금융회사 및 전자금융업자가 취약점 분석·평가를 실시하는 경우, 전자금융 기반시설에 직접 또는 간접적으로 연결되어 사용되는 정보처리시스템 을 빠짐없이 모두 대상에 포함 하여야 한다. 기존에는 금융회사 등이 취약점 분석·평가를 실시할 경우 의무적으로 포함하여야 하는 범위가 규정화되어 있지 않아 중요하다고 여겨지는 핵심 시스템을 주로 점검하고, 상대적으로 관심도가 떨어지는 주변부 시스템 은 점검대상에서 누락하는 경우가 많이 있었다. AI를 활용한 해킹공격이 주변부 시스템의 허점까지 파고드는 것으로 나 타나는만큼, 전자금융기반시설에 직·간접적으로 연결되는 모든 시스템들을 빠짐없이 철저히 관리하기 위한 제도 개선이다. \u003c 행정지도 주요 내용 > IT자산 식별·관리 의무화, 취약점 분석·평가 내실화 등 과제는 ｢전자금융 감독규정｣ 개정을 통해 최대한 신속히 추진할 계획이나, 규정 개정에 필요한 절차와 이 에 소요되는 최소 시한 등을 감안할 때 ’27.1분기에 시행이 가능할 것으로 예상된다. 따라서, ｢전자금융감독규정｣ 개정안의 내용 중 시급한 추진이 필요한 ▲ 대형 금융사의 취약점 분석·평가 주기 단축( 연 1회→2회)과 ▲ 전자금융기반시설과 연결된 모든 시스템 점검대상 포함 과제 는 행정지도를 통해 우선 시행할 계획 이다 . 행정지도의 경우 법적인 강제성은 없으나, 全 금융업권이 AI 침해위협에 대한 긴밀한 대응 필요성에 공감하고 있는 만큼, 제도개선 내용을 우선 명확히 하여 ｢전자금융감독규정｣ 개정 전이라도 해당 사항에 대해서는 자발적인 이행이 이뤄질 것으로 기대한다. \u003c 향후 일정 > ｢전자금융감독규정｣ 개정안은 국무조정실 규제심사 등 관련 절차를 거쳐 금융위원회 의결에 따라 ‘27년 1분기 중 시행되도록 추진 한다. 행정지도는 11.18일에서 11.23일까지(5일간) 의견 청취 후 금융위원회 내 금융행정지도 심의위원회 심의·의결을 거쳐 11.30일 (잠정) 시행 될 예정이며 규정 개정 전까지 효력을 유지한다. \u003c 규정변경예고 관련 안내사항 > ￭ 예고기간 : 2026.11.18일(수) ~ 2026.11.30일(월), (12일) ￭ 입법예고·규정변경예고된 내용에 대해 의견이 있으시면 다음 사항을 기재한 의견서를 아래의 제출처로 제출해 주시기 바랍니다. - 예고 사항에 대한 찬성 또는 반대 의견 (반대의 경우 이유 명시) - 성명 (기관ㆍ단체의 경우 기관ㆍ단체명과 대표자명) , 주소·전화번호 - 일반우편 : 서울시 종로구 세종대로 209 정부서울청사 금융위원회 금융안전과 - 전자우편 : src0745@korea.kr - 팩스 : 02-2100-2948 ※ 개정안 전문(全文) 은 “금융위 홈페이지( www.fsc.go.kr ) › 정책마당 › 법령정보 › 입법예고/규정변경예고”에서 확인 가능합니다.", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "자산운용사 침해사고 대응 관련 릴레이간담회 개최", "department": "금융투자검사2국/디지털금융총괄국", "date": "2026-11-18", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249903&menuNo=200218&pageIndex=1", "summary": "□ (개최배경) 금융감독원은 금융권 해킹,침해사고와 관련하여 업권별 릴레이간담회를 지속 개최\nㅇ 17일(화) 전금업자,온투업자 및 대부업자에 이어 18일(수) 자산운용업계에 대한 간담회를 실시\n□ (당부사항) 금융투자검사2국장은 금융권에 대한 전방위적 침해위협에서 자산운용사가 ‘약한 고리’로 활용될 위험도 있는 만큼,\nㅇ 각사별 외부접점을 빠짐없이 점검하고, 자체 전산 뿐 아니라 IT운영을 위탁하는 외주업체의 제3자 리스크까지 철저히 관리할 것을 강조\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "국산 중고차 수출 원산지 증명 간소화", "department": "자유무역협정관세이행과", "date": "2026.11.18.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079957&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "경남창원 수출플러스간담회 개최", "department": "신산업진출팀", "date": "2026.11.18.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079984&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "전동킥보드로 사고 내고 음주운전 차량 표적  지원 핀테크 창업 기업 의 혁신적인 아이디어 를 사업화 시킬 수 있도록 멘토링 등 제공 21개 ③ 오픈이노베이션·PoC 지원 핀테크 기업 의 기술을 실제 금융환경 에 적용 하여 사업화 가능성 을 검증 토록 지원 19개 ④ 투자·자금 연계지원 직접투자 · 간접투자 · 보증 · 대출 등을 통해 핀테크 기업 의 스케일업 을 지원 47개 ⑤ 네트워킹·데모데이·박람회 지원 국내외 핀테크 기업, 금융회사, 투자기관 등이 참여하는 교류 및 협업기회 를 마련 71개 ⑥ 글로벌 진출 준비 지원 글로벌 현지 거점 · 공간 제공 , 컨설팅 · 교육, 글로벌 MOU · 파트너십 등 지원 40개 * 중복을 제외한 세부 지원사업 수는 211개 또한 중소벤처기업부, 과학기술정보통신부 등 관계부처 와 지 방자치단체 에서도 핀테크 기업이 활용할 수 있는 다양한 창업·기술개발·사업화 지원 사업 을 운영하고 있으나, 관련 정보가 여러 플랫폼에 흩어져 있어 종합적인 정보 접근에 한계 가 있었다. 이에, 금융위원회는 지원사업을 운영하는 기관 중심의 정보 제공 방식에서 벗어나, 지원이 필요한 기업의 입장 에서 필요한 정보를 쉽게 찾을 수 있도록 ‘ 핀톡24 ’ 를 마련하였다. 이를 통해 다양한 기관의 지원사업 정보를 한곳에 모아 제공 하는 한편 , AI 기반 맞춤형 추천 기능 을 통해 기업별 성장단계와 지원수요에 적합한 사업 을 안내할 계획이다. [ 주요내용 ] ① 850여개 지원사업 정보 통합 안내 기존 핀테크 지원협의체 참여기관의 지원사업 뿐만 아니라, 타 부처 및 지자체 등이 운영하는 창업·사업화 지원사업 까지 약 850여개 지원사업 정보 (’26.10월 기준) 를 실시간 통합 제공 한다. 이용자는 기관별로 흩어져 있던 지원사업의 주요 내용, 신청 대상, 신청 기간 및 절차 등을 ‘ 핀톡24 ’에서 한 번에 확인 할 수 있으며, 조회 시점 에 실제 운영중인 지원사업 정보를 중심으로 제공 함으로써 기업이 종료된 사업을 일일이 확인하고 걸러내는 번거로움을 줄일 수 있다. 핀테크 기업 에 대해서는 AI기반 맞춤형 지원사업 정보제공을 통해 업종별, 성장단계별 최적의 지원 을 선택할 수 있도록 안내 할 예정이며, 일반 기업 에 대해서도 창업, 기술개발, 사업화, 투자유치 등 기업의 수요 에 따라 활용할 수 있는 다양한 지원사업 정보 를 폭넓게 제공한다. ② 핀테크 대상 AI기반 맞춤형 지원사업 추천 핀테크 기업 및 예비 창업자 가 여러 기관의 지원사업을 일일이 비교·검색 해야 하는 부담을 줄이고 , 필요한 지원사업을 보다 쉽게 찾을 수 있도록 AI기반 추천 서비스 도 지원한다. ㅇ 대화형 맞춤 추천 : AI가 이용자에게 필요한 질문을 먼저 제시 하고, 답변 내용을 바탕으로 적합한 지원사업을 추천 한다. 영업 기간, 소재 지역, 필요한 지원 유형 등을 대화 방식으로 확인 하므로 지원 사업에 대한 사전 지식이 부족한 예비·초기 창업자 도 쉽게 이용할 수 있다. ㅇ 기업정보 기반 추천 : 성장단계 기업 의 경우 사업계획서 를 입력하면 AI가 기업정보를 분석하여 신청가능 하거나, 적합한 지원사업을 추천 한다. 특히 신용보증기 금의 기업데이터 플랫폼인 BASA (Business Analytics System on AI) 가입 기업 은 사업자번호 입력 만으로도 재무·신용정보 등을 자동으로 조회 함으로써 정보 입력 부담 을 줄일 수 있다. ㅇ 조건별 검색 : 이용자가 지역, 지원 유형 등 원하는 조건을 직접 설정 하여 관련 지원사업 을 신속하게 검색 할 수 있도록 지원한다. [ 향후 계획 ] ‘ 핀톡24 ’는 11.20일 부터 정식 서비스를 개시 하며, ’27년 상반기에는 기업의 이용 편의성 제고를 위해 사업계획서와 기업 정보 를 바탕으로 신규 지원사업 공고에 대한 알람 기능 도 제공하는 등 맞춤형 정보제공 기능을 강화 해 나갈 계획이다. 금융위원회 는 앞으로도 관계기관 과 함께 ‘ 핀톡24 ’를 포함한 지원체계 를 지속적으로 개선 하여, 청년 들이 핀테크 분야에서 새로운 창업 기회 를 찾고 성장 할 수 있도록 적극 지원해 나가겠다고 밝혔다. ※ ‘ 핀톡24 ’ 관련 제도와 (2)선택형 할인특약 제도 시행\n* '13.3월 이전 체결된 재가입 조건이 없는 1,2세대 실손보험계약(이하 동일)\nㅇ 초기 실손보험 가입자는 ▲기존 계약을 5세대로 전환하고 일정기간 보험료를 할인(계약전환 할인)받거나 ▲기존 계약에서 불필요한 보장을 제외하고 보험료를 할인(선택형 할인) 받을 수 있음\nㅇ 할인제도 가입 이후에도 청약철회 가능기간을 폭넓게(최대 6개월) 운영하는 등 소비자 피해방지 장치도 함께 마련할 예정\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "깜빡 잊고 지나가버린 지난 3년간 실손보험금, ‘실손24’를 통해  한방에 청구하고 받을 수 있습니다", "department": "보험과", "date": "2026-11-19", "url": "https://www.fsc.go.kr/no010101/88173", "summary": "I. 회의 개요 ‘26.11.19(목), 신진창 금융위원회 부위원장 주재 로 실손보험 점검회의 를 개최하였다. 오늘 회의에는 보건복지부, 금융감독원, 건강보험공단 등 유관 기관, 보험개발원, 생·손보업계, 네이버파이낸셜 (주) 과 ㈜ 비바리퍼블리카(토스) 가 참여하여, 미청구 실손보험금 찾기 서비스 도입방안과 실손보험 청구전산화(실손24) 요양기관 연계현황 , 11.23일부터 시행 예정인 실손보험 계약전환 할인 , 선택형 할인 제도의 시행 준비상황을 논의 하였다. \u003c 실손보험 점검회의 개요 > ▪ (일시 / 장소) ‘26.11.19(목) 14:00 / 손해보험협회 ▪ (참석) 금융위원회 (부위원장 주재) , 보건복지부, 금융감독원, 보험개발원, 신용정보원, 국민 건강보험공단, 생명보험협회, 손해보험협회, 삼성화재, 현대해상, DB손해보험, 한화생명, 삼성생명, 교보생명, 네이버파이낸셜(주), ㈜비바리퍼블리카 ▪ (주요 내용) ①미청구 실손보험금 찾기 서비스 도입 방안, ②실손24 연계현황, ③실손 계약전환·선택형 할인제도 시행 준비상황 점검 Ⅱ. 부위원장 모두발언 신진창 부위원장 은 실손보험 은 국민의 의료비 부담을 완화 하기 위해 도입되었지만, 일부 가입자의 과잉 이용으로 보험료는 해마다 오르는데 반해 상당수의 가입자는 받아야 할 보험금을 놓치고 있어, 실손보험이 의료비 부담을 충분히 완화하지 못하고 있다고 지적하였다. 이에 오늘 점검하는 세 가지 과제 는 ‘ 받을 보험금은 손쉽게, 빠짐없이 받고 , 보험료는 각자의 의료이용에 맞도록 ’ 하여, 실손보험이 국민의 사적 의료안전망 역할을 수행할 수 있도록 하는 작업이라고 강조하였다. ‘ 미청구 실손보험금 찾기 ’ 서비스에 대해서는 최대 1조원에 달하는 미청구 보험금을 국민께 손쉽게 돌려드리기 위한 조치라고 소개하면서, 국민이 받아야 할 보험금 을 빠짐없이 받도록, 데이터가 먼저 국민을 찾아가는 사례 라고 하였다. 또한, 과거 3년치 진료비에 대해 실손보험금을 청구할 수 있는 만큼, 보험금을 기한 내에 한 분이라도 더 찾아가실 수 있도록 서비스 개발을 신속히 진행해줄 것을 당부하였다. 아울러, 민감한 정보 를 다루는 만큼, 명확한 동의절차 를 갖추고 보안을 철저히 관리하는 등 준비를 거쳐 ‘27년 1분기 중 서비스를 개시 할 계획이라고 밝혔다. 한편, 실손24 에 대해서는 ’26.11월 현재 연계율이 54.2% 까지 높아졌으나, 아직 절반가량의 병·의원 에서는 종이서류를 발급 받아 실손보험금을 청구해야 하는 불편함이 남아있다고 평가하였다. 특히, ‘ 미청구 실손보험금 찾기 ’ 서비스 의 경우, 실손24 연계 요양기관 진료기록 에 대해서는 실손24 앱을 이용하여 한번에 보험금을 청구 할 수 있어, 동 서비스에 따른 편익을 국민이 온전히 누리기 위해 실손24 연계율이 더욱 높아질 필요 가 있다고 언급하였다. 정부는 연말 80~90% 연계율 목표를 달성하기 위해 현장 설득과 지원을 지속할 예정 이라고 하였다. 또한, 11.23일 시행되는 계약전환 할인·선택형 할인 은 병원 이용이 많지 않는데도 높은 보험료 때문에 계약 유지를 고민하는 초기 실손 가입자 에게 새로운 선택지 를 드리는 제도라고 소개하였다. 동 제도는 재가입주기가 없는 1,2세대 실손보험 가입자 가 5세대 실손으로 전환 하거나 필요하지 않은 보장을 빼는 경우 보험료 할인 혜택을 제공하는 것으로서, 소비자가 제도를 충분히 이해하고 선택할 수 있도록 보험회사에는 소비자 보호장치 를 충실히 마련할 것과 약관, 상담인력 및 전산시스템 등 준비상황을 철저히 점검 할 것을 당부하였다. Ⅲ. 「미청구 보험금 찾기」 서비스 도입 1. 도입 배경 실손24 는 소비자가 요청하면 병원 이 청구서류를 보험회사로 전자적으로 전송 해 주는 서비스이나, 이를 통해 보험금을 청구하려면 소비자가 다녀온 병원·약국을 직접 선택 하는등 진료기록을 직접 기입해야 한다. 이 때문에 과거 방문한 병원·약국명을 기억하지 못하면 이용이 어려운 측면이 있었다. 또한, 보험사 앱·웹 등으로 보험금을 이미 청구 한 경우에도 실손24에서 청구 여부를 확인 하기 어려워, 국민이 실손보험금을 청구했는지 여부를 확인하기가 어려웠다. 이렇게 청구되지 않은 실손보험금 은 최근 3년간(’24~’26년) 최대 1조원 규모로 추정된다. 실손보험금은 3년이 지나면 소멸시효가 완성 되어 청구할 수 없는 만큼, 국민이 기한 내에 보험금을 찾아갈 수 있도록 지원 할 필요성이 제기되어 왔다. 2. 주요 내용 이에, 실손24 앱에 ‘ 미청구 보험금 찾기 ’ 서비스를 도입한다. 소비자가 실손24 앱 내에서 금융마이데이터 조회 에 동의하면, 소비자의 카드 결제 정보 (요양기관명·결제일·금액) 를 통해 과거 3년동안 의 병·의원 등 진료일자 를 확인 한다. 이렇게 확인된 소비자의 요양기관 방문일자 를 한국신용정보원 의 보험금 청구·지급정보 와 비교하여, 과거 3년동안 청구하지 않은 보험금 을 소비자에게 안내한다. 이때, 소비자가 방문한 병·의원이 실손24에 연계 되어 있는 경우, 추가 정보 확인 을 통해 소비자에게 보다 정확도가 높은 안내를 제공할 예정이다. 소비자가 과거 3년동안의 미청구 보험금 을 확인한 이후, 소비자가 방문 했던 병·의원 이 실손24에 연계 되어 있다면 실손24 앱 내 에서 간편하게 실손 보험금을 청구 할 수 있다. 실손24에 연계되지 않은 병·의원을 방문하였다면 직접 병·의원 에서 실손보험금 청구서류를 발급 받아 보험금을 청구할 수 있다. 동 서비스는 관련기관(보험개발원, 보험사, 신용정보원, 마이데이터 사업자) 간 시스템 개발 과 관련 법령 개정 을 거쳐 ‘27.1분기 중 출시 한다. 소비자의 병·의원 이용일자, 보험금 청구이력 및 결제 정보를 다루는 만큼, 정보 보호 등에 만전을 기할 방침이다. ※ 실손24에 연계된 병·의원 진료기록만 실손24앱을 통해 보험금 청구 가능 Ⅳ. 실손24 의료기관 연계 현황 1. 요양기관 연계 현황 ‘26.11.18일 기준 총 57,258개 요양기관(병원 1,439개, 보건소 3,578개, 의원 30,444개, 약국 21,797개)이 실손24에 연계 되어 있으며, 연계율은 약 54.2% (1단계 약 64.2%, 2단계 약 53.4%)이다. 실손24 가입자는 약 596만명 , 누적 청구건수는 1,955만건 수준이다. \u003c 청구전산화 요양기관 연계 현황 (’26.11.18일 기준, 개) > 구 분 병원·보건소(1단계) 의원·약국(2단계) 합 계 전 체 7,810 (100%) 97,833 (100%) 105,643 (100%) 연계 예상 1) 5,095 (65.2 %) 96,685 (98.8%) 101,780 (96.3%) 연계 완료 2) 5,017 (64.2 %) 52,241 (53.4%) 57,258 (54.2%) 1) 연계 예상 : 실손24 참여에 동의하거나(1단계) 실손24 참여 EMR을 이용하는 요양기관(2단계) 2) 연계 완료 : 실손24 연계가 완료되어 청구전산화 서비스를 이용할 수 있는 요양기관 2. 연계율 제고 노력 정부는 실손24 연계율 을 높여 국민의 보험금 청구 편의성을 증진 하기 위해 다각도로 노력중이다. 우선, 전송대행기관 을 중심으로 실손24에 연계되어 있지 않은 요양기관을 대면 방문 하는 등 요양기관과 직접 접촉 하여 연계를 설득중 이다. 또한, 보건복지부 와 협력하여 의약단체에 대한 협조공문발송 등 未참여 요양 기관 과 지역 공공병원 을 대상으로 청구전산화 참여가 法상 의무 임을 안내하고 참여를 요청 하였다. 아울러 인증서 발급 등의 과정에서 요양기관의 참여절차를 간소화 할 수 있도록 보건복지부·국민건강보험공단 과도 지속적 으로 협의하고 있다. 요양기관 도 실손24 참여에 따른 인센티브를 누릴 수 있도록 실손24 앱상 병원 소개글 및 이미지를 게시기능을 신설하고, 플랫폼 (네이버 지도 등)과도 지속 협의한다. 한편, 국민의 실손24 에 대한 관심과 인지도 를 높여, 실손24 이용률 을 높이기 위한 노력도 병행중이다. 10.7일부터 네이버 지도·네이버페이·토스 앱 안 에서 실손보험금 청구가 완결되도록 개선하였으며, 이용과정에서의 불편함이 있는지를 살펴 서비스를 지속 개선중이다. 또한, 실손24 서비스에 대한 대국민 홍보도 강화 한다. 10월 중 방송매체 (TV, 라디오) , 온라인, 병원 내 키오스크 등을 통한 홍보 를 진행하였으며, 11월 부터는 대국민·요양기관 의 실손24 인지도 를 한층 높이기 위해 국민 참여형 영상 공모전 을 진행하는 등 국민의 이용과 참여를 적극적으로 유도 할 방침이다. Ⅴ. 실손보험 계약전환 할인·선택형 할인 시행 1. 추진 배경 및 방향 초기 실손보험 상품은 대부분의 의료비 를 광범위 하게 보장하는 상품구조로 인해 ‘ 비필수적인 의료 과다이용 ’을 유발한다는 문제점이 지적되어 왔다. 이러한 초기 실손보험 의 특성 은 사회 전체 에는 의료비 증가 와 의료체계 왜곡 심화 라는 부담을, 실손 계약자 에게는 지속적인 보험료 인상 과 고액의 보험료 라는 경제적 부담 을 안겼다. 이에 초기 실손보험 가입자 중 의료이용량이 많지 않으나 높은 보험료 수준 으로 인해 계약 유지에 부담 을 느끼는 계약자 등에게 선택지를 제공 하고, 사회적으로 의료 과다이용 구조 를 완화하기 위해 보험업계 를 비롯한 다양한 이해관계자와의 협의를 통해 초기 실손보험에 대한 대책으로서 계약전환할인 제도 와 선택형 할인특약 제도 를 11.23.(월) 부터 시행하게 되었다. 2. 주요 내용 계약전환 할인제도 계약전환 할인제도는 ‘13년 3월 이전 약관변경 (재가입) 조건이 없는 실손보험 상품에 가입 한 소비자가 본인 희망에 따라 5세대 실손보험으로 전환 가입할 경우 전환 후 3년간 5세대 실손보험료의 50%를 할인 해 주는 제도 (대상기간: '26.11.23.~'27.5.22.) 이다. 해당 실손계약 가입자는 본인이 가입한 보험회사의 5세대 실손으로 전환이 가능하며, 5세대 전환은 별도 심사 없이 이루어진다 . * ｢내보험찾아줌｣(cont.insure.or.kr) 조회를 통해 가입계약 및 보험기간 확인 가능 ** 보장종목 확대 및 계약전환 청약 철회 후 재차 전환 신청 하는 등의 경우에는 심사 후 전환될 수 있음 5세대 실손보험은 치료비 부담이 큰 중증질환 치료비는 충분히 보장하되 비중증 비급여 치료의 보장은 합리화 (자기부담률 상향 등) 함으로써 기존 실손보험 대비 보험료를 낮춘 상품이므로, 높은 보험료에 부담을 느꼈던 초기 실손 계약자는 합리적 보장수준 을 유지 하면서 보험료 부담 을 크게 줄일 수 있을 것 으로 기대된다. * 암, 뇌혈관·심장질환, 희귀난치성질환 등 건강보험 산정특례 대상 질환 다만, 보험계약 승환 (계약 갈아타기) 을 유도할 목적 으로 설계사 등이 해당 전환 가입 을 무분별 하게 권유 할 경우, 소비자가 전환 필요성에 대한 충분한 고민 없이 가입하게 되어 소비자 피해가 발생할 수 있으므로, 청약철회기간 (최대 6개월) 부여, 숙려기간 (2영업일 이내) 부여, 모집인의 Outbound 영업금지 등 부당승환 등에 따른 소비자 피해방지 장치도 함께 마련하여 운영할 예정이다. * 예) 기존 상품을 해지시키고 실손 보험료를 절약하도록 하여 해당 보험료를 새로운 상품에 전환 가입시킬 목적 등으로 모집조직이 계약자에게 무분별한 전환을 권유할 가능성 존재 1) 보험금 지급사유가 발생하지 않은 경우 6개월 이내에 전환을 철회할 수 있으며, 전환 후 3개월 이내 철회하는 경우 보험금 지급사유가 발생하더라도 철회 가능 2) 청약시 숙려기간 내에는 별도 불이익 없이 청약철회 가능 - 최대 6개월까지 가능한 청약철회 제도와는 별개의 제도로서 숙려기간 중 청약철회한 경우에도 향후 재차 전환신청시 무심사 전환 가능 - 다만, 소비자가 전환 할인혜택은 즉시 받을 수 있도록 전환 가입효력은 즉시 적용 3) 보험회사, 보험중개사, 보험대리점 및 보험설계사로부터 계약 재매입의 권유행위 또는 권고행위가 발생하지 않도록 계약자의 별도 요청이 있는 경우에 한하여 추가 안내 가능 특히, 부당승환 에 대한 유인을 원천 차단 하기 위해 전환신청일 이전 (6개 월간) 또는 전환신청일 이후 (할인혜택을 받는기간 중) 에 초기 실손계약이 특약 형태로 부가되어 있던 ‘ 기존 계약 ’ (실손外보장) 을 해지 하는 경우 보험료 할인 혜택을 미제공 (할인 종료) 할 방침이므로 소비자는 할 인혜택 부여 조건 등을 면밀히 확인할 필요가 있다. * 다만, 선의의 소비자 피해 방지를 위해 제도 발표일 이전시점(~11.19일)에 기존 계약의 일부를 해지한 경우 할인혜택을 부여 가능토록 조치 선택형 할인특약 제도 선택형 할인특약 제도는 2013년 3월 이전 약관변경 (재가입) 조건이 없는 실손보험 상품에 가입한 소비자가 본인 희망에 따라 기존 실손계약 을 유지 하면서도, 불필요한 보장은 제외하여 보험료를 할인 받을 수 있는 특약을 제공하는 제도이다. 보장제외를 선택할 수 있는 대상은 필수적 치료가 아니면서 실손보험금에서 차지하는 비중이 커서 보험료 할인효과가 큰 치료 등으로서 근 골격계 물리치료 (도수치료 등) ·체외충격파치료 및 비급여 주사제 , 비급여 MRI/MRA 이며, 추가로 자기부담률 20% 적용 을 선택하고 보험료 할인 을 받을 수도 있다. 선택형 할인특약 제도도 청약철회 기간 (최대 6개월) 이 부여되며 충분한 소비자 안내 등을 통해 소비자 피해를 방지할 예정이다. 다만, 가입자의 체리피킹 (선별적 취사선택) 으로 인한 타 계약자의 피해 방지 등을 위해 선택형 할인 특약의 청약 철회·해지는 1회로 제한하고, 청약 철회·해지 후 재가입 은 허용되지 않는다. \u003c 실손 계약전환 할인 및 선택형 할인특약 제도 비교 > 구분 계약전환 할인제도 선택형 할인특약 제도 제공대상 2013년 3월 이전 계약으로 재가입 조건이 없는 실손상품 의 가입자 주요 내용 5세대 실손보험 으로 전환시, 5세대 보험료 를 할인(3년간 50%) 근골격계 물리치료 · 체외충격파치료 · 비급여 주사제 면책, 비급여MRI · MRA 면책 및 자기부담률 상향 (20%) 중 선택 하여 가입하고 보험료 할인 적용 * 원하는 옵션(일부 또는 전부) 선택 가능 - 할인율 은 향후 보험금 지급통계 등을 반영해 1년 단위 로 조정 (±25% 한도) 소비자 유의사항 (혜택제한 등) 전환신청일 전후 기존 계약 (실손外보장) 해지 시 할인혜택 미제공(종료) 청약 철회·해지 후 재가입 불가 3. 보험료 절감효과 저렴한 가격에 본인에게 필요한 맞춤형 보장을 받고자 했던 소비자들은 실손 계약전환 할인 및 선택형 할인특약 제도를 통해 보험료 부담을 상당 부분 경감 할 수 있을 것으로 예상된다. 예를 들어, 60대 여성 기준 1세대 계약자 (월보험료 17.7만원) 는 계약전환 할인 또는 선택형 할인특약 제도 활용을 통해 기존 보험료의 37.0%~87.8% 를 절감할 수 있으며, 2세대 계약자 (월보험료 12.7만원) 는 기존 보험료의 27.0%~82.9% 를 절감할 수 있을 것으로 기대된다. \u003c1·2세대 및 5세대 실손과 「계약전환 할인」, 「선택형 할인 특약」 보험료 (60대 여성) > (단위: 원) 현재 월보험료 선택형 할인특약 · 계약전환 등 선택 후 선택시 월보험료 (예시) 절감률 (예시) 1세대 176,982 전환할인 (전환후 3년간) 2) 21 로 설립된 금융안정포럼(FSF) 을 전신 으로 하며, 글로벌 금융위기 극복 과정에서 G20 이 참여하는 금융안정위원회(FSB) 로 확대·개편 ◇ (기능) 국제기준 및 정책 권고안 개발, 국제기준 이행점검 및 국가 간 협력 강화 등을 통해 글로벌 금융시스템 안정성 제고를 위한 금융규제 개혁 추진 ◇ (구성) G20 회원국의 재무부･금융당국･중앙은행 등 (한국은 금융위와 한국은행이 참여) ◇ (총회) FSB의 최종 의사결정기구로서 FSB 각 상임위원회에서 검토된 금융안정 관련 보고서·국제기준·정책권고를 채택하고 FSB 업무계획, 예산 등을 승인하는 회의 [ ① 글로벌 금융시장의 취약성 점검 ] FSB 회원국들은 글로벌 금융시스템이 현재 전반적으로 복원력을 유지 하고 있으나, 주요국의 국채금리 상승과 높은 부채 수준, AI 투자 확대에 따른 자산가격의 급격한 조정 가능성, 각국의 정책 대응여력 및 충격흡수 역량 저하 등 잠재적 취약성 이 지속되고 있다고 평가하였다. 회원국들은 이러한 위험요인이 동시에 나타날 경우 상호 증폭효과 로 인해 리스크가 금융시스템 전반으로 파급될 수 있다는 점을 주요 우려사항으로 제기하고, 지속적인 모니터링 이 필요하다는 데 의견을 모았다. 이 위원장은 “FSB가 개별위험을 점검하는 데 그치지 않고 여러 위험요인 이 동시 에 발생 하거나 상호 증폭 되는 복합리스크 에 선제적 으로 대비하는 것이 중요하다”고 강조하였다. 아울러, “이를 위해 복합충격 의 전파 경로 를 면밀히 분석하고, 각국 금융당국 간 정보 공유 와 정책 공조 를 강화하여 글로벌 금융시스템 의 복원력 을 높여야 한다”고 제언하였다. [ ② 인공지능(AI) ] FSB 회원국들은 금융권의 AI 활용 확대가 금융서비스의 효율성과 접근성을 높이는 동시에, AI를 악용한 사이버공격 과 금융범죄 , 특정 AI 서비스 제공업체 에 대한 의존도 확대 등이 금융시장에 새로운 위험을 초래할 수 있다고 평가하였다. 이 위원장은 AI를 활용한 사이버위협 의 고도화가 금융시스템의 복원력을 저해 할 수 있다는 점을 강조하며, AI 기반 사이버위협에 대응하기 위한 AI 방어체계 강화, 금융권 의 대외 접점 및 내부통제체계 에 대한 전면 점검 등 한국의 대응 노력을 소개하였다. 또한 “FSB가 금년 10월 발표한 ‘책임있는 AI 도입을 위한 모범관행’의 이행상황을 점검하고, 글로벌 AI 서비스 제공 업체의 집중위험과 국경 간 사이버위협에 대한 국제공조 를 강화해야 한다”고 제언하였다. [ ③ 금융위기 대비 체계 ] FSB 회원국들은 글로벌 금융위기 이후 마련된 금융회사의 자체정상화 및 부실정리 체계의 실효성을 점검하고, 디지털 뱅크런 과 사이버공격 등 새로운 위험 요인에 대한 대응 방안을 논의하였다. 특히 FSB의 취약성 분석 과 위기대비 체계의 연계, 정리 관계당국 간 협력 강화, FSB 핵심 준칙 (Key Attributes) 의 이행력 제고 방안 등을 중심으로 의견을 교환하였다. 이 위원장은 “새로운 권고사항의 도입보다 FSB 핵심준칙에 따른 정리체계 가 실제 위기상황 에서 효과적으로 작동 하도록 실행력 을 높이는 것이 중요하다”고 강조하였다. 아울러 “금융시스템 취약성 분석결과를 자체정상화 및 부실정리계획 과 모의훈련 에 반영해야 한다”는 의견을 제시하며, 한국 의 신속정리제도 법제화 추진 노력과 관계기관 합동 모의훈련 등 국내 위기대응 역량 강화 노력을 소개하였다. [ ④ 스테이블코인 ] FSB는 글로벌 스테이블코인 관련 취약성을 점검한 결과, 현재 시스템적 위험은 제한적 이나, 글로벌 스테이블코인의 이용이 확대되고 대규모 상환요구가 발생할 경우 전통 금융시장과 실물경제로 위험이 파급될 가능성 이 있다고 평가하였다. 회원국들은 글로벌 스테이블코인의 국경 간 취약성을 효과적으로 모니터링하는데 어려움이 있다는 점에 인식을 공유하고, 국가간 협력 강화, 정보공유 활성화 등 이를 해결하기 위한 방안을 논의하였다. 이 위원장은 글로벌 스테이블코인의 국경 간 위험에 대응하기 위해 국경 간 감독 협력 과 위기대응 체계 를 강화할 필요가 있다는 점에 동의하며 “국가 별 디지털자산의 제도화 속도 와 규제 수준 의 차이로 인해 규제차익 이 발생하지 않도록 긴밀한 규제·감독 협력 노력이 필요하다”고 제언하였다. [ ⑤ 비은행금융중개(NBFI) ] FSB 회원국들은 비은행금융중개 부문의 복원력을 강화하기 위한 업무 추진계획을 논의하고, ① 취약요인 분석, ② 데이터 공백 해소, ③ 기존 권고사항 에 대한 이행점검, ④ 감독당국 간 정보공유 촉진 등 4가지 접근방식을 지속 추진하기로 하였다. 또한 비은행금융기관이 국채시장에서 사용하고 있는 레버리지 거래전략 과 관련된 취약성을 파악하기 위해 공통 모니터링 지표 를 개발하고 이에 대한 공개 협의를 시작하기로 합의하였다. 이 위원장은 국채 현물, 선물, 레포 거래 등에 내재된 레버리지 위험 을 정확히 파악하기 위한 공통지표 마련의 필요성에 공감하고, ’25년 마련된 NBFI 레버리지 권고안 * 의 이행현황 과 동 권고안의 위험완화 효과 를 점검 하는 것이 필요하다고 강조하였다. * ｢Leverage in Nonbank Financial Intermediation: Final report｣(’25.7.9.) [ ⑥ 글로벌 보험산업 위험평가 ] FSB 회원국들은 국제보험감독자협의회 (IAIS) 의 글로벌 보험산업 위험평가 결과를 바탕으로 보험산업의 잠재적 금융안정 리스크를 논의하였다. 특히, 자산집약형 재보험 (Asset-Intensive Reinsurance) 과 사모신용 (private credit) 투자 확대 에 따른 리스크에 주목하였다. 이 위원장은 “자산집약형 재보험과 사모신용 투자 확대는 보험회사의 자본 효 율성과 장기투자 기회를 높일 수 있으나, 위험집중 과 금융기관 간 상호연계성 을 확대할 가능성에도 유의해야 한다”는 의견을 제시하였다. [ ⑦ 국제 감사·윤리기준 제정기구의 지배구조 개선 ] FSB 회원국들은 국제 감사·윤리기준 제정기구의 재원조달, 조직구조 및 지배구조 개선방향을 논의하였다. ’20년 개혁 이후 기준제정기구의 독립성과 공익성이 강화되었으나, 공익감독 기능을 안정적으로 유지하기 위한 안정적인 재원 확보가 주요 과제로 제기됨에 따라 재원 조달방식 및 지배구조 개선 필요성을 검토하였다. 이 위원장은 “국제 감사·윤리기준의 독립성과 공익성을 유지하면서 안정적이고 다변화된 재원조달 체계를 마련하는 것이 중요하다”고 강조하였다. 특히 “특정 이해관계자에 대한 과도한 재정 의존을 방지하고, 독립적인 공익감독과 전문적인 기준제정 기능을 유지하는 것이 최우선 목표가 되어야 한다”고 제언하였다. [ ⑧ 2027년 FSB 업무계획 ] FSB 회원국들은 2027년 FSB 주요 업무과제로 AI 관련 금융안정 위험 대응, 비은행금융중개 부문의 복원력 강화, 스테이블코인 규제·감독체계 점검, 국경 간 결제 시스템 개선 등을 제안하였다. 특히 AI를 활용한 금융 사기 대응, 에이전트형 AI (Agentic AI) 관련 리스크 분석, 레버리지 거래에 따른 취약성 등 금융시스템의 구조적 변화에 대응하기 위한 과제를 중점적으로 검토키로 하였다. 이 위원장은 AI, 스테이블코인 등 신규 리스크 요인에 대한 면밀한 점검과 대응방안 마련이 ’27년 FSB의 주요 업무가 되어야 한다는 점에 공감하였다 . 아울러 “FSB 지역자문그룹 (Regional Consultative Group, RCG) 이 우선순위를 두고 있는 신흥국 시장의 자본유출 및 외환시장 불안 가능성 등도 FSB 업무 계획에 실질적으로 반영되는 것이 중요하다”고 제언하였다. [ 美 SEC 폴 앳킨스 의장 면담 ] 이억원 금융위원장은 FSB 총회 참석을 계기로 폴 앳킨스 (Paul Atkins) 미국 증권거래위원회 (SEC) 의장 을 만나, 최근 글로벌 자본시장 에 대한 견해와 스테이블코인을 포함한 디지털자산에 대한 정책방향 에 대해 의견을 교환 하 였다. 양측은 최근 급속한 환경 변화는 금융산업 발전의 기회를 제공하는 동시에 금융안정과 투자자 보호 측면에서 새로운 과제를 가져온다는 데 인식 을 공유하고, 양국 자본시장의 안정 확보와 건전한 발전을 위해 긴밀히 소통하고 협력해 나가기로 하였다. 2 유럽중앙은행(ECB)과 은행감독협력 MOU 내용 최종 합의 이 위원장은 유럽중앙은행 (European Central Bank, ECB) 의 프랭크 엘더슨 (Frank Elderson) ECB 감독위원회 부의장 (Vice Chair of the Supervisory Board) 을 만나 금융위·금감원-ECB 간 은행감독협력 MOU 내용에 최종 합의 하였다. MOU 체결은 연내 전자서명을 통해 이루어질 예정이다. 동 MOU는 ’24년부터 양 기관이 약 2년간 지속적으로 논의해온 것으로, 양 기관 간 협력 및 정보공유 체계를 공식화하고, 양 지역에 상호 진출한 은행 관련 감독 정보 등을 효과적으로 교환하는 것을 목적으로 하고 있다. 연내 MOU가 체결되면, EU에 진출한 우리 금융회사들의 애로사항 을 EU 금융당국에 보다 신속하게 전달하고 해소 방안을 적극적으로 모색할 수 있는 제도적 기반 이 마련될 것으로 기대된다. 이 위원장과 앨더슨 부의장은 글로벌 금융환경 변화에 따른 새로운 위험과 이에 대응한 은행감독 정책 방향에 대해서도 의견을 교환하였다. 이 위원장은 금융감독 정책이 급변하는 금융 위험에 효과적으로 대응하는 동시에 감독 효율성을 높이는 방향으로 발전할 필요가 있다는 점을 강조하고, ECB의 감독체계 개선 방향에 관심을 표명하였다. 이에 엘더슨 부의장은 ECB의 '차세대 감독 프로그램(Next Level Supervision)'을 소개하며, 주요 위험에 감독역량을 집중하고 감독절차와 승인기간을 단축하는 등 은행 건전 성을 유지하면서도 감독의 실효성을 높이기 위한 ECB의 노력을 설명하였다 . 3 한-영 금융협력 네트워크 확대 영국은 ’27년 G20 의장국을 맡고, 이어서 ’28년에는 우리나라가 G20 의장국 을 맡게 되면서 양국 간 금융협력의 중요성이 더욱 커지고 있는 시점 이다. 또한, 영국은 금융규제 샌드박스 등 금융혁신을 위한 새로운 제도 를 선도적 으로 도입·운영 해 온 국가이며, 특히 런던은 대표적인 글로벌 금융 중심지 * 로서 주요 인프라가 집적되어 있고 각국의 금융회사들이 진출해 있어 글로벌 금융산업의 최신 동향을 파악할 수 있는 핵심 지역이다. 이에 이 위원장은 영국 금융당국 및 금융회사와의 네트워크를 확대하기 위해 런던을 방문하였다. * GFCI(글로벌 금융센터 지수) 순위(’26.9월) : (1위) 뉴욕, ( 2위) 런던 , (7위) 서울 [ 英 정부·의회와의 금융외교 ] 이 위원장은 런던금융특구, 영국 의회 및 금융당국 등 3각 채널 의 주요 인사들과 연이어 만나 적극적인 금융외교 를 추진하고, 韓-英 금융협력 의 기반을 확대하였다. 먼저, 브로넥 마소자다 (Bronck Masojada) 신임 (11.13일 취임) 런던금융특구 시장 (Lord Mayor) 을 만나 양국 간 금융협력 확대 방안을 논의하였다. 양측은 탄소중립 이행을 위한 전환금융과 ESG 공시 분야의 정책 경험을 공유하고 협력 가능성을 논의하였다. 또한 양측은 양국 금융회사 간 상호 진출과 협력 확대 필요성에 공감하였다. 이 위원장은 존 슬링어 (John Slinger) 對한국통상특사 겸 하원의원 을 만나 , 韓-英 투자·금융협력 확대 방안에 대한 의견을 교환하였다. 슬링어 의원은 한국 금융기관의 영국 진출 확대를 환영하며, 영국을 글로벌 사업 확장의 거점으로 활용할 수 있음을 강조하였다. 이에 이 위원장은 한국 금융회사의 영국 진출 확대와 이를 통한 국내 금융기관의 글로벌 경쟁력 강화 가능성에 공감하며 양국 간 상호협력방안을 모색하기로 하였다. 마지막으로 이 위원장은 캐서린 브래딕 (Katherine Braddick) 영국 건전성감독청 (PRA, Prudential Regulation Authority) 청장 과 만나, 금융환경 변화에 따른 새로운 위험과 양국 간 금융감독 협력 방안을 논의하였다. 양측은 AI 확산에 따른 사이버 위협과 금융시스템의 운영 복원력 확보의 중요성에 공감 하였다. 또한, 스테이블코인을 포함한 디지털자산 규제 동향에 대해 이야기를 나누고, 금융시장의 건전성 확보와 금융의 실물분야 지원 기능 강화라는 두 가지 목표의 균형에 대해서도 의견을 교환하였다. [ 업권별 주요 금융기관 면담 ] 금융위원장은 글로벌 금융중심지 런던에 소재한 주요 금융기관을 만나 글로벌 금융산업의 현황을 살펴보고, 우리 금융산업의 글로벌 경쟁력 강화 및 해외 진출 확대 방안을 모색하였다. 먼저, 스탠다드차타드 (Standard Chartered) 그룹 의 빌 윈터스 (Bill Winters) CEO (Chief Executive Officer) 를 만나 한국 금융시장에 대한 전망과 AI·사이버 보안·디지털자산 등 최신 금융 현안을 논의하였다. 이 위원장은 최근 금융시장의 변동성과 AI 기반 사이버 공격에 대한 우려를 표하고, 글로벌 금융 회사의 대응 방안 및 디지털 자산에 대한 의견을 청취하였다. 윈터스 CEO는 한국 금융시스템의 안정성과 경쟁력을 높이 평가하면서, AI 기반 사이버 위협에 대응하기 위해서는 최악의 상황에서도 핵심 기능을 유지하는 금융회사의 '생존 역량' 확보가 중요하다고 강조하였다. 이어서 유럽 최대 자산운용사인 아문디 (Amundi) 의 그레고와르 페스케 (Grégoire Pesques) CIO (Chief Investment Officer) 로부터 글로벌 투자자가 바라보는 한국 자본시장에 대한 의견을 청취하였다. 페스케 CIO는 AI·반도체 경쟁력과 재정건전성 등을 한국 경제의 강점으로 평가하고, 한국 시장에 대한 접근성 개선과 거래시간 확대가 글로벌 투자 유치에 중요하다고 제언하였다. 이에 이 위원장은 한국시장의 접근성을 높이기 위한 정책을 지속 추진하고 있음을 설명하고, 앞으로도 글로벌 투자자들과 긴밀한 소통을 이어 가겠다고 밝혔다. 더불어 런던증권거래소그룹 (LSEG, London Stock Exchange Group) 의 데이비드 슈윔머 (David Schwimmer) CEO 를 만나 한국 국채의 세계국채지수 (WGBI) 편입 완료 등 양측 간 협력 성과를 이야기하고, 양국 자본시장 인프라의 건전한 발전을 위한 견해를 나누었다. 양측은 T+1 결제주기 전환, 거래시간 확대 등 최근 추진 중인 정책의 원활한 도입 방안을 논의하였다. 또한, 자본시장 인프라를 지속적으로 고도화하여 투자자의 시장 접근성을 높여 나가는 것이 중요하다는데 인식을 같이하였다. 이 위원장은 로이즈 (Lloyd’s) 보험시장의 의장 인 찰스 록스버러 경 (Sir Charles Roxburgh) 을 만나 한국 보험회사의 글로벌 시장 진출 및 양국 보험 시장 간 협력 확대 방안을 논의하였다. 로이즈는 다수의 독립적인 보험 인수 조직이 모여 전 세계 기업의 다양한 위험을 인수하는 글로벌 보험시장 이다. 록스버그 의장은 더 많은 한국 보험사들이 로이즈에 참여하여 새로운 사업 기회를 창출하기를 기대한다고 밝히고, 한국 기업들이 직면한 복잡·다변화된 위험에 효과적인 보험 솔루션을 제공할 수 있도록 한국 시 장과 협력을 확대해 나가기를 희망한다고 밝혔다. 양측은 AI, 기후변화 등 새로운 위험의 부상에 따른 보험산업의 변화와 혁신 필요성에 대해서도 의견을 교환하였다. [ 글로벌 핀테크 기업 방문 ] 이억원 금융위원장은 글로벌 핀테크 기업인 레볼루트 (Revolut) 의 시드 자조 디아 (Sid Jajodia) CBO (Chief Banking Officer) 를 만나 핀테크 스타트업의 성장 사례를 살펴보았다. ’15년 설립된 레볼루트는 여행용 카드 서비스에서 출발 하여, 현재는 42개 국가에서 하나의 앱을 통해 해외 결제·환전·송금, 예금·대출, 주식·가상자산 거래까지 다양한 금융서비스를 제공하는 글로벌 금융 플랫폼 기업으로 성장하였다. 이 위원장은 레볼루트를 금융서비스와 기술력을 바탕으로 성장한 성공 사례 로 평가하고, 금융위원회도 한국 핀테크 기업들이 글로벌 기업으로 성장 할 수 있도록 혁신적인 금융 생태계를 조성할 계획임을 밝혔다. 4 현지금융사 간담회 개최 이억원 금융위원장은 독일·영국 에 진출 한 금융회사 들과 간담회 를 개최하여 해외 영업 과정에서의 애로사항을 청취하고, 국내 금융회사의 해외 진출 확대를 위한 지원 방안을 논의하였다. 참석자들은 한국과 상이한 금융규제 및 감독 환경에 적응하는 과정에서의 어려움을 이야기 하였다. 이에 이 위원장은 “현지 금융당국과 금융위원회가 긴밀히 소통하여 우리 금융회사의 영업 여건을 개선하는 것이 정부의 역할인 만큼, 앞으로 해외 당국과의 협력을 더욱 강화해 나갈 계획”임을 밝혔다. 아울러 “현장에서 제기된 의견을 바탕으로 국내 금융회사의 해외 진출 활성화 방안을 지속적으로 모색해 나가겠다”고 하였다.", "essential": false, "importanceReasons": ["strong keyword in body text (+1)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "금융정보분석원 설립 25주년 및 제20회 「자금세탁방지의 날」 기념식 개최", "department": "금융정보분석원 기획행정실", "date": "2026-11-23", "url": "https://www.fsc.go.kr/no010101/88183", "summary": "「자금세탁방지의 날」 기념행사 금융정보분석원(FIU)은 11월 23일(월) 금융정보분석원 설립 25주년 및 제20회「자금세탁방지의 날」기념식 을 개최하였다. * 금융정보분석원 설립일(2001.11.28.)을 ‘자금세탁방지의 날’로 지정하고, 자금세탁방지 업무에 대한 이해 제고와 인식 확산을 위해 2007년부터 매년 기념행사 개최 이번 행사는 금융정보분석원 설립 25주년 을 맞아 그간 우리나라 자금세탁방지 제도의 발전과 성과 를 돌아보고, 향후 정책방향을 공유 하기 위해 마련되었다. 기념식에는 이억원 금융위원장 을 비롯하여 이정현 검찰총장 직무대행 등 법집행기관 관계자 , 금융정보분석원 역대 원장 , 조용병 은행연합회장 등 금융협회장 과 금융회사 임직원 등이 참석하였다. 기념식 에서는 금융위원장 기념사와 축사 , 자금세탁방지 업무 유공자 포상 및 우수사례 발표 가 이루어졌다. 금융위원장 기념사 및 향후 정책방향 이억원 금융위원장 은 기념사를 통해 “ 자금세탁방지 체계 는 범죄자금의 금융시스템 침투를 차단 하여 건전한 금융질서와 신뢰를 유지 하는 필수 인 프라 ”라고 강조하였다. 이 위원장은 “우리나라는 2001년 금융정보분석원 출범 이후 의심거래보고(STR), 고액현금거래보고(CTR), 고객확인제도(KYC) 등을 도입 하고, 2021년에는 가상자산사업자를 자금세탁방지 규율체계에 편입 하는 등 금융환경 변화에 맞춰 제도를 지속적으로 발전 시켜 왔다”고 언급하였다. 이러한 노력에 힘입어 의심거래보고 건수 가 2005년 1만3천 건에서 2025년 133만 건 으로 크게 증가 하였으며, 2009년 FATF 정회원 가입 , 2015년 FATF 의장국 수행 , 2024년 FATF 상호평가 후속점검 을 통해 최고 등급 획득 등 국제적으로도 자금세탁방지 역량을 인정받고 있다고 평가하였다. 아울러, 이 위원장은 더욱 완성도 높은 자금세탁방지 체계 구축 을 위해 다음 세 가지 정책과제 를 중점적으로 추진해 나가겠다고 밝혔다. 첫째, 신종피싱 등 민생침해범죄에 대한 대응 역량 강화 최근 민생침해범죄가 지능화 되면서 범죄수익이 대포통장, 가상자산 등을 통해 신속하게 이전·은닉 되고 있으나, 기존 제도로는 이를 적시에 차단하는 데 한계 가 있었다. 또한, FATF 에서도 범죄 관련 의심거래를 신속하게 정지 할 수 있도록 권고 한 바 있다. 이에 따라 금융정보분석원은 올해 6월 30일부터 경찰청 및 금융권과 협력 하 여 기존 보이스피싱 피해구제 제도의 적용이 어려웠던 노쇼사기, 로맨스스캠 , 팀미션사기 등 신종피싱 의심계좌에 대한 거래정지 제도를 시행 하고 있다. 제도 시행 이후 지난 10월 말까지 금융회사에서 총 11,586건의 신종피싱 의심계좌를 임시 거래정지 하는 등 범죄자금의 이동을 신속하게 차단 하기 위한 대응체계를 구축하였다. 앞으로는 이러한 국제기준에 발맞춰 거래정지 대상 을 중대민생침해범죄 전반으로 확대 할 수 있도록 법적 근거를 마련 하고, 범죄수익의 은닉과 추가 피해를 방지 하는 등 국민의 실질적인 피해 구제를 위한 대응체계 를 강화 해 나갈 계획이다. 둘째, 가상자산을 악용한 자금세탁 행위에 대한 보다 적극적인 대응 금융당국은 올해 8월 「특정금융정보법 시행령」을 개정 하여 가상자산사업자의 재무건전성과 사회적 신용 등에 관한 신고요건 및 대주주 심사범위를 구체화 하고, 가상자산 이전거래에 대한 자금세탁방지 규제를 강화 하였다. 가상자산사업자 에 대한 신고·심사를 강화 하고, 미신고 가상자산 영업 에 대한 대응 도 지속적으로 강화 해 나갈 방침이다. 아울러 트래블룰 적용 기준금액 폐지 와 함께, 고위험 해외 가상자산사업자 및 개인지갑 으로의 자금이전 을 철저히 관리 하는 등 가상자산 거래의 투명성 을 높여 나갈 계획이다. 셋째, 자금세탁방지 제도의 사각지대 해소를 위한 지속적 노력 법인과 신탁을 이용한 재산 은닉 , 법률·회계·세무 서비스의 자금세탁 악용 가능성 등 기존 자금세탁방지 체계의 취약요인에 적극 대응 할 계획이다. 이를 위해 관계부처와 협력하여 법인과 신탁의 실소유자 정보를 보다 철저하게 확보 하고, 변호사·회계사·세무사 등 전문직 에도 자금세탁방지 의무를 부과 하는 방안을 추진하겠다고 밝혔다. 이 위원장은 금융회사, 금융당국, 법집행기관 간 유기적인 협력 이 자금 세탁방지 체계의 실효성을 높이는 핵심 이라고 강조하며, 국민의 재산을 보 호 하고 금융시스템의 신뢰를 지키기 위해 지속적으로 노력 해 줄 것을 당부하였다. 자금세탁방지 업무 유공자 포상 유공자 포상 에서는 자금세탁방지에 기여 한 8개 기관 과 26명 의 개인 유공자에 대해 포상 을 수여 하였다. ① 기관 표창 (대통령 표창 2, 국무총리 표창 2, 금융위원장 표창 4) (대통령 표창) 주식회사 케이뱅크 는 비대면 은행 특성 에 맞는 민생 침해 범죄 대응체계 를 구축 하고, AI를 활용한 수사(기관)정보 요약 등으로 의심거래보고 업무의 효율성 을 높였으며, 의심거래보고 추출기준의 지속적인 관리와 고도화 를 통해 자금세탁 의심거래 식별 및 탐지체계를 강화 하였다. 에이비엘생명보험(주) 는 고객확인 3단계 자체점검 과 비전속채널 이중검증 체계 구축 으로 고객확인의 정확성을 높이고, AML 성과목표(KPI) 부여 및 임직원 전문성 제고 , 업권 우수사례 전파 등 자금세탁 방지 업무를 성실히 이행한 공적이 인정되어 대통령 표창 을 수상하였다 . (국무총리 표창) ㈜대신저축은행 은 고객확인 상시점검 과 위험유형별 테마점검 으로 자금세탁 위험에 선제적으로 대응하고, 이상거래탐지 시 스템과 연계한 금융사기 대응 및 현장점검 결과의 부서평가 반영 으로 내부통제의 실효성 을 높였다. ㈜미쓰이스미토모은행서울 은 무역금융 거래의 물품·자금·운송경로 분석과 제재국 인접·중계국 관리를 통해 무역금융 및 제재 우회거래에 특화된 위험관리체계를 구축 하는 등 자금 세탁방지 업무수행을 위해 노력한 점이 인정되어 국무총리 표창 을 수상하였다. (금융위원장 표창) 주식회사 케이비저축은행 , 주식회사 아이엠증권 , 비씨카드(주) , 함안군산림조합 은 검사사례를 활용한 자체점검 과 전문 인력 양성 , 비대면 고객확인 절차 개선 , 고객확인 정보의 정기점검 및 업권 내 우수사례 공유 등 각 기관의 특성에 맞게 자금세탁방지 관리체계를 강화한 공적이 인정되어 금융위원장 표창 을 수상하였다. ② 개인 표창 (금융위원장 표창 26명) - 의심거래 분석과 범죄수익 추적, 신종피싱 의심계좌의 지급정지 심사 등을 통해 불법자금 흐름을 규명하고 금융범죄 피해 예방 및 회복에 기여한 법집행기관 직원 , 고객확인 및 의심거래보고의 충실한 이행 으로 금융현장의 자금세탁방지 역량을 높인 금융회사 업무담당자 , 자금세탁방지 제도 개선과 검사·감독, 전문인력 양성 등에 기여한 전문가 및 유관기관 관계자 등 26명 이 자금세탁방지 업무를 충실히 수행한 공적을 인정받아 금융위원장 표창 을 수상하였다. 한편, 올해 기념식에서는 자금세탁방지 우수사례의 금융권 확산 을 위해 대 통령 표창을 수상한 2개 금융회사의 사례발표가 새롭게 마련 되었다. 케이뱅크와 에이비엘생명보험 은 각각 비대면 금융환경에 다. 신진창 금융위원회 부위원장 은 “ 신기술 발전과 금융범죄 수법의 다양화로 자금세탁 위험을 사전적으로 정의하기 어려워지고 있다”며, “금융회사는 위험 수준에 따라 차등화된 관리조치를 적용 하고 감독당국도 고위험 분야에 감독역량을 집중 해야 한다”고 강조하였다. 아울러 위험기반접근법 은 고위험 분야의 자금세탁 대응을 강화하는 동시에 저위험 분야의 원활한 금융활동을 지원한다는 점에서 중요 하며, 국제기준에 부합하는 선진적인 자금세탁방지 체계 를 구축하기 위해 노력 하겠다고 밝혔다. 이찬진 금융감독원장 은 “디지털 금융의 확산과 신종피싱, 가상자산을 이용한 범죄수익 은닉 등 새로운 위험에 대응 하기 위해 금융회사의 자체 위험관리 역량과 정보공유·협업체계 강화가 필요 하다”고 강조하였다. 또한 FATF 국 제기준에 부합하는 위험기반 감독체계 를 지속적으로 고도화 하고 금융회사와 관계기관 간 협력을 강화 해 나가겠다고 밝혔다. 이항용 한국금융연구원 장은 “위험기반접근법(RBA) 이 자금세탁 위험을 정확히 식별· 평가 하고 위험 수준에 비례 하여 관리조치와 자원을 배분 하는 국제기준의 핵심 원칙” 이라고 강조하였다. 아울러 위험기반 감독체계의 실효성 을 높이기 위해서는 위험 수준에 따른 차등화된 검사·감독 과 검사기관 간 일관성 확보 가 중요하며, 이를 위해 범정부 차원의 협력 과 감독당국·금융회사 간 긴밀한 민관 협력이 필요 하다고 밝혔다. 제1세션: 위험기반 자금세탁방지 감독체계 운영 경험과 개선과제 첫 번째 세션 에서는 싱가포르 통화청(MAS)과 한국금융연구원 이 싱가포르와 우리나라의 위험기반 자금세탁방지 감독체계 운영 현황과 개선과제를 발 표 하였다. 싱가포르 통화청 의 통렝옝 (Thong Leng Yeng) Executive Director는 싱가포르의 위험기반 자금세탁방지 감독체계를 소개 하였다. 싱가포르는 금 융업권별 위험평가를 바탕 으로 은행, 가상자산서비스 제공업자 등 고위험 분야에 감독역량을 집중 하고 있으며, 데이터 분석과 금융회사 간 정보공유 를 통해 새로운 자금세탁 위험을 탐지 하는 등 감독의 실효성을 높이고 있다고 설명하였다. 한국금융연구원 의 이정두 연구위원 은 우리나라 위험기반 자금세탁방지 감독체계의 운영 현황을 평가하고 개선과제를 제시 하였다. 앞으로 금융회사별 위험평가 결과를 검사·감독에 보다 충실히 반영 하고, 검사기관의 감독역량 강화와 위험 수준에 따른 차등화된 검사·제재 등을 통해 감독의 실효성 을 높여야 한다고 제언하였다. 제2세션: 금융회사의 위험기반 자금세탁방지 관리체계 운영사례 두 번째 세션 에서는 일본 미즈호은행과 신한은행 이 금융회사 위험기반 자금세탁방지 관리체계의 실제 운영사례를 공유 하였다. 일본 미즈호은행 의 히로시 사가와 (Hiroshi Sagawa) 부장은 자금세탁 위험의 식별·평가 부터 위험경감 조치, 효과성 검증 및 개선 에 이르는 위험기반 관 리체계를 소개 하였다. 특히 고객확인, 거래 모니터링, 의심거래보고 등 주요 업무와 내부통제체계를 연계 하여 위험기반 관리체계의 실효성을 높이는 사례 를 공유하였다. 신한은행의 윤희승 팀장 은 데이터 기반의 상시 위험 모니터링 체계 와 위험 수준에 따른 차등화된 내부통제 운영사례 를 발표하였다. 위험지표 의 변화를 대시보드로 파악 하고, 위험 수준에 따라 맞춤형 교육, 점검 강화 및 영업점 안내 등 관리조치를 차등 적용 하는 위험기반 관리체계를 소개 하는 한편, 향후 AI 기반 이상징후 탐지 등을 통해 고위험 분야에 관리역량을 집중 하는 등 위험관리 체계의 고도화 방향을 제시 하였다. 향후 계획 이번 국제세미나는 해외 감독당국의 위험기반 감독 경험 과 국내외 금융 회사의 실무사례를 공유 하고, 우리나라 자금세탁방지 제도의 실효성을 높 이기 위한 정책적 시사점을 모색 하는 계기가 되었다. 특히, 2028년 시작되는 FATF 제5차 상호평가 에서는 위험기반접근법 (RBA)의 실질적인 이행과 자금세탁방지 제도의 효과성이 중요 하게 평가되는 만큼, 금 융정보분석원 은 금융회사의 위험 수준에 따른 차등화된 관리체계와 감독 당국의 : 이찬진) 은 11월 20일 (접수기한) 까지 개정「특정 금융 거래정보의 보고 및 이용 등에 관한 법률」 (이하 “특금법”) 부칙 에 따른 신고 (이하 “부칙신고”) 를 접수한 결과, ’26.8.20일 법 시행 당시 신고가 수리된 가상자산사업자 28개 모두 기한 내 에 부칙신고서 를 제출 하였다고 밝혔다. 구분 원화마켓 코인마켓 지갑·보관업자 등 합계 신고대상 5 13 10 28 기한 내 제출 5 13 10 28 2. 부칙신고 개요 가상자산업권의 건전성 과 투명성 을 제고하기 위하여 특금법 이 개정 (’26.8.20. 시행) 됨에 따라, 가상자산사업자 신고 심사대상 이 사업자 및 대표자·임원 외에 대주주 까지 넓어지고, 재무상태·사회적 신용 및 조직·인력·전산설비·내부통제체계 등 법령준수체계 에 관한 신고 불수리 요건 이 새롭게 마련되었다. 이번 부칙신고 는 ‘26.8.20. 법 시행 당시 이미 신고 가 수리 되어 있던 사업자도 개정법 부칙에 따라 시행일로부터 3개월이 되는 ’26.11.20일까지 개정규정에 따른 사항 을 신고 하여야 함에 따른 것이다. 이에, FIU와 금감원은 신고매뉴얼 을 개정 하고, 사업자 대상 공개 설명회 (‘26.8.13.) 를 개최하는 한편, 부칙신고 접수에 앞서 사업자들의 신고서류 구비 여부를 사전 검토 (~’26.10월) 하는 등 사업자의 원활한 신고 를 적극 지원 해 왔다. 3. 주요 심사항목 부칙신고는 개정법에 따라 새로 도입된 요건을 기존 사업자에게도 적용 하기 위한 절차이다. 이에 따라, 이번 심사에서 개정법으로 추가된 사항 을 중심으로 기존 사업자의 현황 을 확인하고, 강화된 요건 에 대한 이행 준비상황 을 점검 할 예정이다. 구체적인 내용은 다음과 같다. 첫째 , 대주주가 불수리 여부를 판단하는 신고심사 대상에 포함된 것은 이번이 처음 인 만큼 대주주 현황 을 정확히 파악 할 계획이다. 사업자는 심사대상에 해당하는 대주주 등 * 을 실질에 맞게 누락 없이 신고 하여야 한다. 대주주 등의 법률 위반전력 및 사회적 신용 에 관한 사항도 그 발생시점과 관계없이 빠짐없이 신고 하여야 하며, 이 중 법 시행 전 발생 사유 에 대해서는 개정법 부칙 의 경과 조치 (4.다. 후술) 에 따라 종전 규정 이 적용될 예정이다. * 최대주주, 지분 10% 이상 주요 주주, 경영에 사실상 영향력을 행사하는 주주 및 최대 주주의 특수관계인인 주주, 최대주주가 법인인 경우 그 법인의 최대주주와 대표자까지 포함 둘째 , 유예대상 요건 의 충족현황 과 이행계획 을 점검할 계획이다. 사업자의 부채비율 (200% 이하) 및 법령준수체계 요건 * 은 개정법 시행 후 1년간 유예기간 이 적용 되므로 현재 해당요건을 충족하지 못하더라도 이번 심사의 불수리 사유에 해당하지 않으나, 사업자별 현재 충족수준 과 유예기간 내 충족 가능성 을 점검 할 필요가 있다. 이를 위해 재무제표 로 부채비율 수준을 확인하고, 필요한 경우 현장 확인 등을 통해 법령준수체계 인 자금세탁방지 인력 및 전산설비 구비 현황 과 내부통제체계의 실제 작동 여부 까지 살펴볼 예정이다. * 자금세탁방지 업무 종사 인력 4명 이상 확보, 자격을 갖춘 준법감시인 및 전산요원 확보, 고유식별정보·개인신용정보 처리시 국내에 전산설비를 두고 충분한 사용권한을 갖출 것 등 4. 유의사항 이번 부칙신고는 개정법 시행 에 따라 한 차례 실시 되는 경과적 절차 로서, 통상의 신고 인 갱신신고·변경신고와는 그 효력 과 적용기준 을 달리한다. 따라서 사업자와 시장 참여자는 부칙신고의 결과 와 의미 에 대해 유의할 필요 가 있다. 가. 신고 유효기간 및 갱신신고와의 관계 부칙신고가 수리되더라도 신고 유효기간은 연장되지 않는다 . 사업자 신고 유효기간은 신고수리일부터 3년이며, 개정법 부칙 제3조 는 유효기간 산정시 수리일 을 종전 신고의 수리일로 보도록 규정 하고 있다. 이는 부칙신고가 강화된 요건을 기존 사업자에게 조기에 적용 하기 위한 절차로서, 신고의 효력 을 새로 부여하는 절차가 아니라는 점 을 감안한 것이다. 부칙신고 수리일 기준으로 유효기간을 다시 산정할 경우 3년 주기의 갱신심사가 사실상 생략 되는 문제가 있다. 사업자는 부칙신고와 별개로, 유효기간 만료 45일 전까지 갱신신고를 하여야 한다. 특히, 유효기간 만료 가 임박한 사업자는 부칙신고 심사 가 진행중 이더라도 갱신신고 기한 을 준수 하여야 하며, 기한 내에 갱신신고를 하지 않을 경우 유효 기간 만료와 함께 신고의 효력 이 상실 된다는 점에 유의할 필요가 있다. 나. 변경신고와의 관계 부칙신고와 변경신고는 별개의 절차 임에 유의해야 한다. 부칙신고는 법 시행 당시 의 사업자가 개정요건 에 따른 현황을 1회 신고 하는 절차 (부칙 제3조) 인 반면, 변경신고는 신고한 사항이 변경될 때마다 이행 해야 하는 절차 (법 제7조제2항) 이다. 따라서 부칙신고서를 제출한 이후, 대주주·임원 등 신고사항이 변경되는 경우 부칙신고 심사 진행 여부와 관계없이 별도로 변경신고 를 하여야 한다. 부칙신고 수리가 향후 변경신고 사항에 대한 승인을 의미하지 않으며, 변경신고의 수리가 부칙신고의 수리를 의미하지도 않는다. 이번 부칙신고 심사 과정에서 변경 신고가 접수되는 경우 두 신고를 별개 로 심사 하여 각각 통지 할 예정이다. 다. 법 시행 전 발생사유에 대한 경과조치 법 시행 (‘26.8.20일) 전에 발생한 사유 에 대해서는 신고심사시 종전 규정 이 적용된다. 개정법은 법률 위반 전력 심사와 관련하여 대상 법률 을 공정거래법, 조세범처벌법 등으로 확대하고 심사 대상 에 대주주 를 추가하였으며, 재무상태 및 사회적 신용 요건을 불수리 사유 로 신설하였다. 다만, 강화된 기준을 이미 영업 중 인 사업자의 과거 사실 에까지 소급 하여 적용할 경우 사업자의 영업기반 이 급격히 훼손 될 수 있다는 점을 감안하여, 개정법 부칙은 경과조치 를 두었다. 구체적으로, 법 시행 당시의 대표자·임원· 대주주가 법 시행 전에 발생한 사유 로 강화된 불수리 사유 에 해당하게 된 경우 에는 해당 대표자·임원·대주주가 변경되기 전까지 종전 규정 을 적용 하며 (부칙 제4조) , 사업자 본인 의 경우에도 종전 규정 을 적용한다 (부칙 제5조) . 이에 따라 기존 대주주가 법 시행 전 에 받은 벌금형 이나 채무불이행 등은 이번 부칙신고의 불수리 사유에 해당하지 않는다 . 다만, 경과조치는 불수리·직권말소 여부 의 판단기준 에 관한 것으로, 신고의무 자체 를 면제 하는 것은 아니므로, 기존 사업자도 대주주 현황 등 신고사항 을 빠짐없이 신고 해야 하며, 거짓 작성 또는 중요사항 누락 시 그 자체로 불수리 사유 가 될 수 있음에 유의해야 한다. 라. 부채비율 및 법령준수체계 요건의 적용 유예 사업자 의 부채비율 (200% 이하) 및 법령준수체계 요건 은 1년간 적용 이 유예 된다. 동 요건을 충족하기 위해서는 자본확충, 전문인력 채용, 전산설비 구축 등에 상당한 기간 이 소요되고, 즉시 적용시 다수 사업자 의 영업종료 로 이어져 이용자 피해 가 발생할 우려가 있다. 이를 감안하여, 감독규정 부칙 제3조 는 법 시행 전에 신고한 사업자에 대해서는 동 요건에 따른 불수리·직권말소 기준을 개정규정 시행 후 1년 이 지난 ’27.8.20일부터 적용 하도록 하였다. 이에 따라, 기존 사업자가 현재 동 요건을 충족하지 못하더라도 그 사유만으로 부칙신고가 불수리되지는 않으며 , 유예기간 중에는 직권말소 사유에도 해당하지 않는다 . 다만, 유예는 요건 충족시한 을 연장 한 것일뿐, 요건 자체를 면제한 것은 아님 에 유의해야 한다. 유예기간 종료 이후 요건을 충족하지 못한 사업자는 직권말소 대상 이 될 수 있다. FIU와 금감원은 이번 심사과정에서 유예 대상 요건 의 충족현황 을 점검 하고, 미충족 사업자 에 대해서는 개선계획 을 제출받아 이행상황 을 지속 점검 할 계획이다. 5. 향후 일정 FIU와 금감원은 11.23일부터 접수된 신고건의 심사를 일제히 진행 할 예정이다. 사업자가 제출한 신고서류 를 검토 하여 미비 하거나 추가확인 이 필요한 경우 서류 보완 을 요청 하는 한편, 전산설비 및 내부통제체계 마련 및 실제 작동 여부 등에 대해서는 필요시 현장확인 등을 통해 면밀히 심사 해 나갈 계획이다. 다만, 심사는 사업자별로 각각 진행 되므로 최종 결과 통지시점 은 사업자마다 다를 수 있으며, 통지시점의 선후 가 곧 사업자의 적격 여부 나 우열 을 의미하지 않는다는 점에 유의할 필요가 있다. FIU는 “이번 부칙신고 심사가 자금세탁 방지 및 가상자산업권의 건전성 제고 를 위해 마련된 강화된 신고요건 이 시장 에 안착 하는 첫 단계 ”라며, “모든 사업자에 대해 동일한 기준 에 따라 공정하고 엄정하게 심사 하는 한편, 시장의 불확실성 이 지나치게 커지지 않도록 속도감 있게 심사를 진행 하겠다”고 밝혔다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "「아세안+3 재무차관 및 중앙은행 부총재 회의」 참석", "department": "금융협력과", "date": "2026.11.24.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000080033&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "보험업법 시행령, 금융기관검사및제재에관한규정 개정안 입법예고(’26.11.25.~’27.1.4.) 실시", "department": "보험감독국/보험검사3국", "date": "2026-11-24", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=249964&menuNo=200218&pageIndex=1", "summary": "ㅁ 금융위원회는 11.25일 「보험업법 시행령」(이하, ‘시행령’) 및 「금융기관검사및제재에관한규정」(이하, ‘검사제재규정’) 개정안에 대한 입법예고,규정변경예고를 실시한다. 이번 개정안은 개정 「보험업법」(법률 제21907호, ‘26.9.8일 공포, ‘27.3.9일 시행)에서 위임한 사항을 정하기 위한 것으로, 1)보험모집종사자 결격사유의 기준이 되는 금융관계법률의 범위를 규정하고, 2)보험대리점?보험중개사에 대한 업무정지 갈음 과징금의 부과기준을 마련하는 내용을 담고 있다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": true, "importanceReasons": ["rule change (+2)", "law/regulation change (+1)"], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "「아세안+3 재무차관 및 중앙은행 부총재회의」 참석", "department": "금융협력과", "date": "2026.11.24.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000080035&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "’27년 정책금융과 국민성장펀드의  성공적 추진을 위한 「 정부부처-지방정부-정책금융기관 실무간담회」 개최", "department": "산업금융과,국민성장펀드총괄과", "date": "2026-11-24", "url": "https://www.fsc.go.kr/no010101/88197", "summary": "Ⅰ 원 7.22조원 22.3조원 (첨단기금) 1.12조원 0.41조원 1.56조원 6.18조원 9.26조원 (민간자금) 1.71조원 3.52조원 (재정포함) 6.75조원 1.02조원 13.0조원 2. ’27년 정책금융·국민성장펀드 기본방향 및 수요조사 계획 두 번째로, ’ 27년도 정책금융공급 기본방향 및 부처별 의견수렴 방안을 논의하였다. 내년에도 AI, 반도체, 바이오 등을 중심으로 5대 중점분야 핵심 부문인 첨단전략산업 육성을 위한 자금 이 지속 확대·공급 될 것으로 예상된다. 현재 추진 중인 지방공급 확대목표제도 지속 실시 되어 내년 목표인 43% 달성을 위해 지역소재 제조·기간산업 영위 기업 등에 우대자금 이 적극 공급될 것으로 예상된다. 또한, 해상풍력 등 에너지 전환 과 기후기술 사업 에 자금을 공급하여 “에너지대전환” 과 “K-GX” 등 주요 정부정책이 원활히 이행 되도록 뒷받침할 예정이며, 고금리·고물가·고환율로 경영애로를 겪는 소상공인 과 고용 및 일자리 창출 을 위한 우대금융을 공급하여 지역 및 중소·중견기업을 적극 지원 할 계획이다. 아울러, 각 부처·지방정부 추진사업과 정책금융을 연계 하여 정책금융 공급 효과를 극대화 하기 위해 ’27년 정책금융지원 계획수립을 위한 정책금융 지원 수요조사 가 진행될 예정이다. 급변하는 경제·산업트렌드 와 지역경제 상황에 정통한 각 부처 및 지자체의 의견 을 적극 반영 하여 자금을 효율적으로 배분 할 계획이다. 전요섭 금융정책국장 은 “올 한해 우수한 정책금융실적이 내년에도 이어지길 바라며, 원활한 계획수립과 효율적인 배분 을 위해 각 부처 및 지방정부가 산업트렌드 및 지역경제 전문성 을 바탕으로 자금수요를 적극 공유 해줄 것”을 요청하였다. 마지막으로, ’27년도 국민성장펀드 운용 기본방향 및 부처별 수요조사 계획 을 논의하였다. 올해 국민성장펀드는 당초 목표로 한 30조원 규모 (승인액 기준) 지원을 달성 할 것으로 예상된다. 내년부터 국민성장펀드는 年 40조원으로 지원규모를 확대 할 예정이며, 국민성장펀드 지원산업에 기존 12대 첨단전략 산업 外 우주항공·양자 등 신규산업 추가를 추진중 이다. * (12개) AI, 반도체, 디스플레이, 바이오, 백신, 로봇, 미래형 운송수단, 방산, 이차전지, 수소, 핵심광물, 컨텐츠 ** 산업은행법 시행령 일부개정령안 입법예고중(10.22~12.1일) 금융위원회는 각 부처·지방정부가 제출 한 수요를 바탕으로 “2027년도 국민성장펀드 운용방안”을 마련할 계획이다. 손영채 국민성장펀드추진단장 은 “금년도부터 국민성장펀드가 운용되는 과정에서 부처간 협력이 중요한 역할 을 하였으며, 내년에는 ‘보다 큰 규모’ 로 ‘더 다양한 첨단산업 ’에 지원이 가능한 만큼, 각 부처와 지방정부가 유망 첨단전략산업·기업의 자금수요를 적극적으로 제출 해 주시기 바란다”고 발언하였다. 3. 향후계획 금융위원회는 각 부처 및 지방정부 의견 을 반영한 2027년도 정책금융 공급계획 및 국민성장펀드 운용방안 을 마련하여, 추후 개최될 정책금융지 원협의회 및 국민성장펀드 전략위원회 등을 통해 발표 할 계획이다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "routine"}, {"source": "FSC", "title": "보험업법 시행령‧금융기관검사및제재에관한규정 개정안 입법예고(’26.11.25.~’27.1.4.) 실시", "department": "보험과", "date": "2026-11-24", "url": "https://www.fsc.go.kr/no010101/88198", "summary": "금융위원회는 11.25일 ｢보험업법 시행령｣ (이하, ‘시행령’) 및 ｢금융기관검사및 제재에관한규정｣ (이하, ‘검사제재규정’) 개정안에 대한 입법예고‧규정변경예고 를 실시한다. 이번 개정안은 개정 ｢보험업법｣ (법률 제21907호, ‘26.9.8일 공포, ‘27.3.9일 시행) 에서 위임한 사항을 정하기 위한 것으로, 1) 보험모집종사자 결격사유 의 기준이 되는 금융관계법률의 범위 를 규정하고, 2) 보험대리점‧보험 중개사 에 대한 업무정지 갈음 과징금 의 부과기준 을 마련하는 내용을 담고 있다. \u003c 주요 내용 > 보험사기 등 금융관계법률 위반자의 보험모집시장 진입 차단 보험 설계사 는 소비자와 직접 대면하여 보험계약을 모집하는 만큼 높은 수준의 윤리성과 신뢰성 이 요구된다. 그러나 그간 모집종사자 결격사유의 기준이 되는 법률은 ｢보험업법｣과 ｢금융소비자 보호에 관한 법률｣로 한정되어 보험사기 등 다른 금융관계법률 위반자의 모집시장 진입을 막는 데 한계 가 있었다. 이에 개정 ｢보험업법｣에 따라 결격사유 판단의 기준이 되는 “금융관계법률” 의 범위를 ➊ ｢금융소비자 보호에 관한 법률｣, ➋ ｢보험사기방지 특별법｣, ➌ ｢형법｣ 제347조 (보험계약을 이용한 사기에 한정) , ➍ ｢유사수신행위의 규제에 관한 법률｣, ➎ ｢금융회사의 지배구조에 관한 법률 시행령｣ 제5조에 따른 금융관련 법령 * 으로 규정한다. 이는 보험모집인과 유사한 대출모집인, 유사투자자문업자 의 결격사유 입법례 와 같은 수준 으로, 보험사기 등 금융관계법률 위반자의 보험모집시장 진입을 차단 하여 건전한 모집질서를 확립 하고 보험소비자 보호를 강화 할 것으로 기대된다. * 금융관련법령(지배구조법 시행령 §5) : ｢가상자산이용자보호법｣ 등 총 65개 보험대리점·보험중개사 업무정지 갈음 과징금 도입 현재는 보험대리점·보험중개사 (이하 ‘GA 등’) 의 위반행위에 대해 업무정지 처분 을 하는 경우, 위반행위에 가담하지 않은 다수 소속 설계사의 영업까지 일괄 중단 되어 선량한 설계사의 생계에 피해 가 발생하고 기존 계약자 관리에도 공백 이 생기는 문제가 지적되어 왔다. 이에 개정 보험업법은 소속 설계사의 생계를 보장할 필요가 있는 경우 업무정지에 갈음하여 과징금을 부과 할 수 있도록 하였으며, 이번 시행령 및 검사제재규정 개정안은 그 부과기준을 마련 한다. 우선 시행령에서는 금융위원회가 귀책사유가 있는 소속 설계사의 수 및 비율, 예정된 업무정지기간 등을 종합적으로 고려하여 생계보장 필요성을 판단하도록 한다. 과징금은 직전 사업연도 영업수익 (모집수수료 등) 을 영업일수로 나눈 1일당 과징금에 업무정지 기간을 곱하여 산정 하되, 위반행위의 내용·정도 등을 고려하여 2분의 1 범위에서 가감 할 수 있도록 하고, 업무정지 6개월분을 상한 으로 한다. 검사제재규정에서는 과징금 부과대상을 위반행위에 가담한 소속 설계사가 150명 이하이거나 소속 설계사의 15% 이하인 경우 , 또는 GA 등의 지시·감독에 따라 설계사가 단순히 조력한 경우 로 구체화한다. 이를 통해 위반행위와 무관한 선량한 설계사의 생계를 보호 하면서도, 금전 제재를 GA 등에 직접 부과 하여 제재의 실효성을 확보 할 수 있을 것으로 기대된다. \u003c 향후 계획 > 금번 시행령 및 검사제재규정 개정안은 ’26.11.25일(수)부터 ’27.1.4일(월)까지 입법예고·규정변경예고 가 진행된다. 이후 규제개혁위원회·법제처 심사, 차관회의·국무회의 의결 및 금융위원회 의결 등을 거쳐 개정 보험업법 시행일 (’27.3.9일) 에 맞추어 시행 할 예정이다. 금융위원회는 금융감독원 및 보험업계와 함께 개정 제도가 현장에서 차질 없이 시행될 수 있도록 준비 하고, 시행 이후에도 제도 운영 상황을 면밀히 점검 해 나갈 계획이다. ￭ 예고기간 : 2026.11.25일(수) ~ 2027.1.4일(월) (40일) ￭ 입법예고‧규정변경예고된 내용에 대해 의견이 있으시면 다음 사항을 기재한 의견서를 아래의 제출처로 제출해 주시기 바랍니다. - 예고 사항에 대한 찬성 또는 반대 의견 (반대의 경우 이유 명시) - 성명 (기관ㆍ단체의 경우 기관ㆍ단체명과 대표자명) , 주소·전화번호 - 일반우편 : 서울시 종로구 세종대로 209 정부서울청사 금융위원회 보험과 - 전자우편 : noweyh@korea.kr - 팩스 : 02-2100-2947 ※ 개정안 전문(全文) 은 “금융위 홈페이지( www.fsc.go.kr ) › 정책마당 › 법령정 다. 그러나 디지털자산 산업이 지속 가능한 성장과 국민경제에 대한 기여를 이루어내기 위해서는 새로운 위험에 대한 철저한 대비 와 위기 상황에서의 회복력 을 갖추어야 한다며, 혁신과 신뢰가 함께 성장 하는 디지털자산 생태계 를 만들어 나가야 한다고 강조 했다. 이 위원장은 정부는 법률 제정안이 국회에서 충분한 논의 를 거쳐 조속히 입법화 될 수 있도록 최선의 노력을 다하겠다고 밝혔다. Ⅱ. 추진배경 지금까지 우리나라의 가상자산 규율체계는 「특정 금융거래정보의 보고 및 이용 등에 관한 법률」에 따른 ❶ 가상자산사업자 신고제 및 자금세탁 방지 의무 와 「가상자산 이용자 보호 등에 관한 법률」에 따른 ❷ 이용자 재산 보호 및 불공정거래 규제 의 이원화된 체계로 운영되었다. 불법행위 및 이용자피해 방지에 초점을 둔 규율체계로 인해 산업 및 시장 측면에서의 접근이 미흡했고, 이로 인해 거래소와 개인 투자자 중심 시장으로 고착화 되면서 건전한 디지털자산 생태계 육성에 한계로 작용한다는 지적이 계속되었다. 이에, 정부는 건전한 디지털자산 생태계 조성 을 국정과제 * 로 수립하고 산업-시장-이용자 를 아우르는 통합법 형태 의 규율체계 마련 을 추진해왔다 . 여러 차례의 가상자산위원회, 국회 등 다양한 세미나‧토론회, 업계 및 전문가 간담회, 관계기관 협의 등을 거쳐 「디지털자산업의 혁신과 이용자 보호에 관한 법률」제정안 (이하 ‘디지털자산법안’) 을 마련하였다. * [국정과제 48] 디지털자산 생태계 정비를 통한 산업육성 기반 마련 ☞ ‘디지털자산 통합법(2단계법)’을 마련하여 디지털자산 산업의 건전한 성장 유도 한편, 이 위원장은 전날인 ’26.11.23(월)에도 업계 및 전문가 간담회 를 개최하여, 최신 글로벌 시장 및 제도 동향을 점검하고, 디지털자산법안에 대한 업계 및 전문가의 의견을 청취하고, 입법 추진 동향을 공유하였다. 참고 금융위원장 주재 가상자산 업계 및 전문가 간담회 (’26.11.23) [회의개요] 금융위원회는 ’26.11.23.(월) 이억원 금융위원장 주재로 디지털자산법안에 대한 의견수렴 을 위해 가상자산 업계 및 전문가 간담회 를 개최하였다. 이 위원장은 모두발언을 통해 디지털자산법안은 디지털자산 산업 과 금융산업의 혁신 을 넘어 국민경제 발전 으로 이어지는 출발점 이 될 것이라며, 혁신 은 무엇보다 신뢰를 바탕 으로 해야 이루어질 수 있는 만큼, 신뢰할 수 있는 건전한 시장 을 만들기 위해 노력해 줄 것을 업계에 당부 하였다. 일시/장소 : ’26.11.23.(월) 15:00 / 정부서울청사 16층 대회의실 참석자 : 금융위원회 위원장 (주재) , 디지털금융정책관, FIU 제도운영기획관, 재경부 경제정책국장, 금감원 수석부원장, 한국은행 금융결제국장, DAXA, 주요 가상자산업자, 민간 전문가 등 논의사항 : 글로벌 디지털자산 시장 및 법·제도 동향, 업계 및 전문가 의견 청취 [주요 논의사항] 간담회에서는 글로벌 디지털자산 시장 및 법·제도 동향 에 대한 발제 후 참석자들의 자유로운 토론 이 이루어졌다. 황세운 자본시장연구원 선임연구위원은 ｢글로벌 디지털자산 시장 동향｣ 에 대한 발표에서 현재 디지털자산 산업은 ‘ 시장의 조정 ’과 ‘ 구조의 제도화 ’가 동시에 진행되면서 산업의 중심이 결제와 금융 인프라로 옮겨가고 있다고 진단하였다. 특히, 최근 바이낸스 해킹 사건 등과 같은 보안·운영리스크 가 향후 업계‧ 시장에 대한 이용자 의 신뢰 기반 에 중대한 영향 을 미칠 수 있다고 보았다. 한편, 천창민 서울과기대 교수는 ｢글로벌 디지털자산 법·제도 동향｣ 발제를 통해 현재 각국은 산업을 포괄하는 체계적 규칙 을 정비 하고 있으며, 특히, 인가 등 진입요건 을 마련하고, 증권-비증권 의 경계 설정, 스테이블코인 과 지급 결제 법제와의 관계 등 기존 금융법령과의 관계 도 정립해나가고 있다고 분석하면서, 우리의 디지털자산법안 입법에도 각국의 제도 내용을 참고할 필요가 있다고 언급했다. 발제 이후 이어진 종합 토론 에서는 디지털자산법안의 진입규제, 영업행위규율, 스테이블코인 발행·유통, 이용자보호 등에 대해 다양한 의견을 나누며, 입법이 마무리될 때까지 민‧관의 지속적이고 유기적인 협력과 소통 이 가장 중요하다는데에 의견을 모았다. Ⅲ. 법안 주요 내용 디지털자산법안은 ▴ 새로운 기회와 혁신 (산업) , ▴ 공정하고 효율적인 시장 (시장) , ▴ 안전하고 신뢰할 수 있는 거래 환경 구축 (이용자) 이라는 세 가지 축으로 구성된다. 세부 내용은 다음과 같다. ❶ 디지털자산 산업 : 기능별 세분화, 업무 단위 추가(Add-on) 방식 ✔ “가상자산은 ‘ 경제적 가치를 지닌 전자적 증표’라는 포괄적 정의 를 보다 명확화하여 법적 불확실성 해소할 필요“ (‘24.11월 가상자산업 및 블록체인 혁신 위한 입법과제 토론회 등) ✔ ” ‘ 가상자산사업자 ’라는 단일 라이선스로는 다양한 비즈니스에 대한 효과적 대응이 곤란한 바 , 業 세분화할 필요 (‘25.1월 가상자산위원회 등) 가. 디지털자산업자 : 매매‧중개‧보관‧운용업자 + 디지털자산플랫폼운영자 법안은 주요 입법례, 국내 시장현황 등을 감안하여, 매매‧중개‧보관‧운용 의 4개 디지털자산업자 와 디지털자산플랫폼운영자 로 디지털자산업을 세분화 하여 도입한다. 이를 통해 기능별 규율체계 를 도입하여 ‘동일 위험-동일 규제’ 원칙을 구현하고, 다양한 글로벌 비즈니스 영업 형태 도 가능하도록 설계하였다. 디지털자산매매업자 는 자기의 계산으로 디지털자산의 매매‧교환을 하는 자로, 해외에서는 주로 기관이용자 대상 장외거래 매매, 시장 유동성 공급자 중심으로 영업이 활성화되어 있다. 디지털자산중개업자 는 타인의 계산으로 디지털자산을 매매‧교환하거나 그 중개를 하는 자로, 해외에서는 주로 기관 이용자 대상 위탁매매, 상대매매 중개업무 등을 영위한다. 디지털자산보관 업자 는 이용자로부터 위탁받은 디지털자산 또는 그 통제수단 (‘개인키’) 을 보관‧관리하는 자로, 이용자의 디지털자산을 보관‧관리하거나, 지분검증예치 (‘스테이킹’) 등의 영업을 할 수 있다. 디지털자산운용업자 는 이용자별 재산, 투자목적 등에 따라 디지털자산 운용일임 또는 거래자문 업무를 영위하는 자로, 기관이용자 위주로 디지털자산 운용을 위임받아 전문적인 포트폴리오 관리 서비스 등을 제공할 수 있다. 나. 진입규제 디지털자산 거래에 직접 관여하거나, 디지털자산을 보관하는 디지털자산매매업 ･ 중개업 ･ 보관업 에 대해서는 인가제 를 적용하며, 금융회사에 준하여, 자기자본 * , 인적･물적 설비, 사업계획 타당성, 대주주 ･ 임원 요건 등의 인가 요건을 갖추어야 한다. 이용자 재산을 직접 보관･이전하지 않는 디지털자산운용업 은 등록제 로 운용하고, 자기자본 (5억원 이상) , 전문인력 요건, 대주주･임원 요건 등을 갖추도록 하였다. * 매매‧중개‧보관하는 디지털자산의 범위가 ▴모든 디지털자산인 경우 20억원 이상, ▴스테이블코인만 다루는 경우 10억원 이상으로 대통령령으로 정하는 금액 한편, 금융위는 매매·중개·보관업자 의 인가를 모두 받고 적격 요건을 충족한 자를 디지털자산플랫폼운영자 (거래소) 로 지정할 수 있다. [상세내용❸] 다. 영업행위 규제 및 감독․검사 디지털자산업자에 대해서는 금융투자업자에 준하여 겸영･부수업무 신고 , 업무위탁, 정보교류 차단 의무 등이 부과된다. 겸영‧부수업무 영위시 금융위에 사전 신고하여야 하며, 디지털자산업과 관련된 필수적 업무는 제3자 위탁이 금지된다. 디지털자산업자는 이해상충의 식별‧관리를 위한 기준을 마련하여야 하며, 부서간‧업무간 정보교류를 차단하여야 한다. 임직원은 직무관련 정보의 이용이 금지되며, 매매거래 등을 하는 경우에는 정해진 방법 및 절차를 준수 하여야 한다. 건전한 지배구조 확립을 위해 대주주 변경승인 , 준법감시인 및 위험관리 책임자 임명 등의 의무도 부과된다. 「금융회사의 지배구조에 관한 법률」에 준하는 임원 자격요건 이 적용되어, 금융관련법령 등에 따른 제재조치 등을 받은 경우는 임원 결격사유에 해당한다. 디지털자산업자는 특수관계인을 포함한 대주주가 발행한 디지털자산 등의 거래가 제한 되며, 대주주는 디지털자산업자에게 부당한 영향력을 행사하는 행위를 해서는 안된다. 영위하는 업무별 리스크, 디지털자산의 특성 등을 반영한 디지털자산 업자의 경영건전성 감독기준 도 마련된다. 금융권에 준하여 월별 업무 보고서 를 제출하여야 하며, 해킹, 전산장애 등 주요 경영상황 에 대해서는 즉시 공시 하여야 한다. 디지털자산업자는 영업 종료‧중단, 합병, 해산, 영업 양도 등 이용자 보호를 위해 중대한 사항에 대해서는 금융당국의 사전승인 을 받아야 한다. 특히, 영업을 종료 (폐지)하고자 하는 경우 폐지 30일 전에 공고 하고, 이용자 재산의 이전조치 등 이용자 보호 계획 등을 제출하여야 한다. 다른 금융업권에 준하여 금융위원회의 업무‧재산상황 검사, 기관 및 임직원 제재, 과태료, 포괄적 조치명령권 등이 적용된다. ❷ 스테이블코인 (‘디지털지급토큰’) 가. 정의 및 발행업자 요건 스테이블코인(법률상 ‘디지털지급토큰’ 으로 규정)은 ‘ 하나의 통화의 가치에 준거 하여 안정적인 가치 유지 를 목적으로 하는 디지털자산으로서 주로 지급수단으로 활용 되는 것’으로 정의한다. 국내에서 디지털지급토큰의 발행․상환업무를 하려는 자( 디지털지급토큰 발행업자 )는 주주구성 요건, 자기자본 (50억원 이상) , 사업계획의 타당성, 인력･ 물적 설비, 대주주･임원 자격요건, 이해상충 방지체계 마련 등을 갖추어 금융위의 인가를 받아야 한다. 주주구성 요건은 안정성·혁신성 등을 고려 하여 시행령 에서 정하되, 도입 초기에는 안정성과 금융시스템에 미치는 영향 등을 감안하여 은행이 과반 지분을 보유한 컨소시엄부터 발행을 허용 할 계획이다. 단, 핀테크･기술기업 등도 ‘최대주주’로서 참여 가능토록 하여 디지털지급토큰의 발행·유통에 있어 혁신성을 제고할 수 있도록 하였다. 한편, 본국 금융감독기관으로부터 충분한 감독 을 받는 외국 디지털지급 토큰발행업자는 국내에 지점을 설립 하고 영업기금 등의 요건을 갖추어 금융위에 등록 하고 외국 디지털지급토큰에 대하여 금융위에 신고 하면 국내 발행·상환이 가능하다. 나. 발행 및 상환 디지털지급토큰발행업자는 발행량･발행한도, 준비자산 관리, 상환업무 등에 관한 ‘ 발행계획서 ’를 금융위에 제출하여 승인받아야 한다. 디지털지급토큰은 금전과 동일한 가치 로 교환하여 발행되며, 보유자 에게 이자 등을 지급할 수 없다. 발행계획이 승인·신고되지 않은 디지털지급토큰에 대해서는 플랫폼운영자의 거래지원 (상장) , 디지털자산업자의 매매·중개·보관 등의 취급이 금지 된다. 디지털지급토큰발행업자는 보유자의 상환청구에 대해 지체 없이 동일한 가치의 금전으로 상환해야 하며, 이를 위해 발행업자는 은행 등 준비자산관리기관에 발행잔액의 100% 이상 을 예치 ･ 신탁 하여야 한다. 준비자산은 (가) 압류･상계 등이 금지(도산절연) 되며, 준비자산관리기관은 ▲ 발행업자의 인가취소·파산 및 ▲ 해킹 등 으로 정상적 발행·상환이 곤란한 경우 등에는 준비자산 을 보유자에게 우선 지급 하도록 하여 이용자 재산을 두텁게 보호한다. 다. 중요 디지털지급토큰 금융위는 금융안정, 통화정책 등에 미치는 영향을 고려하여 발행잔액 1조원 이상 의 디지털지급토큰 중에서 중요 디지털지급토큰 을 지정 할 수 있다. 중요 디지털지급토큰 지정시, 발행업자에 대해 자기자본 추가 적립, 준비자산 유동성 관리 강화 등 강화된 규제가 적용되며, 한국은행은 중요 디지털지급토큰발행업자에 대해 공동검사 를 요구 할 수 있다. * EU, 美도 중요 스테이블코인을 지정하고 강화된 건전성 규제 또는 연방 규제 적용 : (EU) 50억 유로 이상, (美) 100억불 이상 ❸ 디지털자산 시장 : 시장의 효율성‧공정성‧책임성 제고 ✔ [ 거래지원 직후 가격 급등락 사례] A통화 기반 스테이블코인이 국내 거래소 거래지원 직후 공급물량 부족으로 기준가격 대비 4.2배 급등 후 8시간 만에 가격 안정화(‘26.9월) ✔ [우회발행 후 국내유통 사례] 플랫폼 기업 B社가 국내 ICO 금지정책을 우회하여 C국에 별도 재단 설립 후 디지털자산을 발행하여 국내 거래소를 통해 유통(‘25.5월) 가. 디지털자산플랫폼운영자 (거래소) 디지털자산매매․중개․보관업 인가 를 모두 받은 자로, 충분한 자기자본, 시장운영능력 * 등을 갖춘 자를 디지털자산플랫폼운영자 로 지정할 수 있다. * 거래지원･시장감시 등 업무 기준 마련, 이해상충 방지체계 마련 등 한편, 디지털자산시장의 핵심 유통 인프라인 디지털자산플랫폼운영자의 공공성과 중립성 을 확보하기 위하여 소유분산 기준 을 도입한다. 자본시장 ATS 에 준하여 주식소유 제한 (20%) 을 도입하되, 금융위 승인 을 받은 경우 최대 34%까지 소유 할 수 있도록 시행령 을 통해 허용할 예정이다. 이를 위반하는 초과 소유분에 대해서는 의결권을 행사할 수 없다 . 기존 거래소 등의 이행기간 등을 감안하여, 지정 이후 3년간 적용이 유예 되며, 중소형 거래소 등에 대해서는 투자유치 필요성 등을 고려하여 추가로 3년 범위에서 유예기간이 연장될 수 있다. 현재 자율규제로 규율 중인 매매체결, 거래지원(상장), 이상거래 감시 등 거래소의 업무 기능을 공적 규제로 전환 하기 위하여, 플랫폼운영자에게 업무 규정 마련 의무 를 부과하며, 공적 기능을 감안하여 법령에서 주요 내용은 직접 규율한다. 나. 발행 및 유통공시 규율 충분한 정보 공시 를 전제로 국내 디지털자산 발행․판매(ICO)가 허용 된다. 디지털자산을 취득권유 * (판매) 하려는 발행인등 ** (또는 주선하는 매매‧중개업자) 은 ‘디지털자산백서’ 를 작성하여 취득권유 전에 금융위에 신고하여야 한다. 백서는 ‘증권신고서’와 유사하게, 취득권유자, 자금 사용처, 발행량, 프로젝트, 리스크 등을 기재하며, 금융위는 중요사항 누락 등에 대해 정정을 요구할 수 있다. 신고수리 및 공시 후, 숙의기간 을 거쳐 발행인 등의 취득권유가 허용 된다. * 불특정 다수를 대상으로 디지털자산의 취득 또는 취득의 청약을 권유하는 행위 ** 디지털자산을 생성한 발행인 및 그 발행‧개발‧운영 등에 적극적으로 참여한 자 디지털자산플랫폼운영자 는 특정 디지털자산을 거래지원 (상장) 하려는 경우 발행인, 발행량, 프로젝트, 리스크 등을 기재한 ‘거래지원보고서’ 를 작성하여 금융위에 제출하고 공시 하여야 한다. 해킹‧전산장애, 발행‧유통량 변경 등 주요사항 변경은 즉시 공시 하여야 한다. 백서 및 보고서 등의 중요사항에 거짓기재‧누락 이 있는 경우, 공시 의무주체(임원 포함)에 대하여 엄격한 손해배상책임 이 부과되며, 공시에 대한 금융위의 조사 및 자료제출 요구권 , 부실공시에 대해서는 과징금 부과 및 형사처벌 의 근거 등을 마련하였다. ❹ 이용자 보호 강화 : 믿고 거래할 수 있는 환경 구축 ✔[해킹] D거래소 지갑에서 이용자가 보관한 디지털자산이 외부지갑으로 무단 유출(‘25.11월 ), E거래소 해킹 공격으로 개인정보 및 일부 디지털자산 유출(‘26.10월) 등 ✔[ 불공정거래] API 이용한 허수 주문 시세조종 사건, 대규모 자금 동원한 ‘대형고래’ 투자자의 시세조종 사건, SNS에 허위정보를 유포한 부정거래 사례 등 가. 영업행위 규제 전반 정비 ｢금융소비자 보호에 관한 법률｣에서 규율하는 설명의무, 부당권유 금지, 약관･광고규제 등을 디지털자산업자에게도 도입한다. 이에 더하여 이용자 재산 상시점검 및 외부기관 (회계법인) 의 주기적 회계감사 등을 의무화하는 한편, 이용자 명부를 작성하여 이용자 자산 을 분별관리토록 하고, 분별관리된 이용자 자산에 대한 상계･압류 금지 등 도산절연 근거도 마련 하였다. 디지털자산거래와 관련하여 디지털자산업자에게 금융회사 수준 의 안전성 확보 의무 * 를 부과한다. 해킹･전산장애 등 사고 발생시 디지털자산업자는 이용자에 대해 무과실 손해배상책임 을 지며, 금융위 는 전산 안전성 의무를 위반 해 사고가 발생할 경우 징벌적 과징금 (최대 매출액의 10%) 을 부과할 수 있다. 디지털자산거래 관련 시설을 해킹하여 자산 등을 탈취한 자에 대한 형사처벌 근거도 마련한다. * 예) 인력･조직 확보, 전산설비 등 규제, 해킹 방지대책 등 정보보호 조치, 이용자 인증수단 관리, 비상대책 수립, 업무 지속성 확보 등 나. 불공정거래 규제 보완 ’24.7월 「가상자산 이용자 보호 등에 관한 법률」 시행 이후 운영해 온 ‘가상자산조사심의회’ 의 불공정거래 조사 등에서 제기된 보완 필요 사항들도 정비한다. 불공정거래 적용 범위 를 거래지원 중인 디지털자산 뿐만 아니라, 거래지원 심사 중인 디지털자산 까지 확대하고, 미공개 중요정보 이용 금지 의무 를 디지털자산업자의 임직원 뿐만 아니라 퇴직 후 1년이 경과하지 않은 자 까지 포함하여 규제 공백을 보완한다. 시세조종 행위 에 대해서도 매매 뿐 아니라 교환 행위까지 시세조종으로 처벌할 수 있도록 확대하여 원화거래소 외 코인거래소 에서의 불공정거래 규율도 가능해진다. 또한, 불공정거래로 인한 불법이익의 은닉을 방지하고 혐의자의 재범을 방지하기 위해, 불공정거래 관련 상당한 혐의 가 있는 경우, 금융위 의결을 통한 지급정지 (계정･계좌 동결) 또는 디지털자산거래 금지 등의 조치근거를 마련한다. 불공정거래 관련 범죄를 자진신고하거나 타인의 범죄 증언시 형벌‧과징금 감면의 근거를 마련하고, 신고자 포상금 제도 도 도입한다. Ⅳ. 항후 계획 금융위원회는 오늘 가상자산위원회에서 논의된 법률 제정안이 국회에서 충분한 논의 를 거쳐 조속히 입법화 될 수 있도록 관련 입법 절차를 적극 지원 하는 한편, 향후 진행될 논의 과정에도 적극적으로 참여하여 건전한 디지털자산 생태계 조성을 위한 노력을 지속해나갈 예정이다. ※ 별첨 1 : 금융위원장 모두발언 별첨 2 :「디지털자산업의 혁신과 이용자 보호에 관한 법률」 제정안 주요 내용", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "KRX_GLOBAL", "title": "(Press Release) Business Performance of KOSDAQ Market-listed Corporations with December Fiscal Year-end for the First Three Quarters of 2026", "department": "강재석 · KRX", "date": "2026-11-24", "url": "https://global.krx.co.kr/board/GLB0203000000T1/bbs#view=20897", "summary": "Overall Performance: For KOSDAQ market-listed corporations (1,580 companies based on individual financial statements, 1,254 companies based on consolidated financial statements) with a December fiscal year end, sales (up 11.95% on an individual basis, up 25.26% on a consolidated basis), operating income (up 33.90% on an individual basis, up 49.59% on a consolidated basis), and net income (up 45.80% on an individual basis, up 47.74% on a consolidated basis) for the first three quarters of 2026 all increased compared to the same period of the previous year (January ~ September 2025).\u003cbr/>\u003cbr/>Please refer to the attachment for details.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "2026 다자개발은행(MDB) 프로젝트 플라자 개최", "department": "국제기구과", "date": "2026.11.24.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchB l": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "㈜에이치스틸 코넥스시장 신규 상장", "department": "", "date": "2026-11-24", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261116048", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "공인회계사 자격·징계위원회 개최 결과 - 2027년 공인회계사 최소선발예정인원 결정", "department": "회계제도팀", "date": "2026-11-24", "url": "https://www.fsc.go.kr/no010101/88212", "summary": "금융위원회는 ’ 26.11.24 (화) 공인회계사 자격·징계위원회 (위원장: 신진창 금융위 부위원장)를 개최하여 2027년도 공인회계사 최소선발예정인원 을 1,100명 (제1차시험 합격자 수 2,600명) 으로 결정하였습니다. \u003c 공인회계사 자격·징계위원회 개요 > • 구성 : [당연직 5명] 금융위 부위원장(長), 증권선물위원회 상임위원, 금융위 3급 이상 공무원, 금융감독원 회계전문가, 한국공인회계사회 회장이 지명하는 자 [위촉직 6명] 한국회계기준원/상장회사협의회/대한상공회의소 추천자 각 1인, 회계·감사전문가 3인 • 연혁 : 「공인회계사법」 개정으로 공인회계사 자격제도심의위원회 와 징계 위원회 를 ‘공인회계사 자격·징계위원회’로 통합 (‘24.1.12 시행) ’27년도 최소선발예정인원 은 회계법인 및 非회계법인 * 의 회계사 채용수요 , 미지정 회계사 누적 , 수험생 인식 및 예측가능성, AI 활용 확대 로 인한 저 연차 회계사 대체 효과 등을 종합적 으로 고려 하여 결정되었으며, ’26년보다 최소선발예정인원이 감소 (50명↓) 하였습니다. * 정부부처 및 공공기관, 금융회사, 상장회사 등에 대해 수요조사 실시 \u003c 2020년 이후 공인회계사 최소선발예정인원 및 실제선발인원 추이 > 구 분 ’20 ’21 ’22 ’23 ’24 ’25 ’26 ’27 최소선발예정인원 1,100 1,100 1,100 1,100 1,250 (150↑) 1,200 (50↓) 1,150 (50↓) 1,100 (50↓) 실제 선발인원 1,110 1,172 1,237 1,100 1,250 1,200 1,150 - 또한, 위원들은 향후 에도 현재 회계업황 이 유지 되는 가운데, AI 확산 에 기인한 단순 회계업무 대체 효과 는 가속화 될 것으로 전망 하였습니다. 특히 현재의 미지정 상황 이 보다 조속히 안정화될 필요 가 있는 만큼, 중장기적 으로 현행 인력정책 기조 를 유지 할 필요가 있다는 점에도 공감하였습니다. 한편, 최소선발예정인원은 「공인회계사법 시행령」에 따른 최소한의 합격인원으로 실제 합격인원 은 제2차시험 득점결과에 따라 더 많아질 수 있습니다 . 앞으로도 금융위원회 는 시장의 회계전문가 수요 에 대응 하는 한편, 한국공인회계사회와 함께 미지정 회계사 들이 안정적 으로 수습기관을 찾을 수 있도록 적극 지원 해 나가겠습니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}], "2026-11-25": [{"source": "KRX_OPEN2", "title": "유가증권시장 매도사이드카(프로그램매매 매도호가 효력정지) 발동", "department": "", "date": "2026-11-25", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261116049", "summary": "첨부 참조", "essential": true, "importanceReasons": ["price rules / circuit breakers (+3)", "market-operations source (+1)"], "market": true, "tier": "essential"}, {"source": "FSC", "title": "“다음 금융은 이미 시작됐다” 제8회 「코리아 핀테크 위크 2026」 개막", "department": "디지털금융총괄과", "date": "2026-11-25", "url": "https://www.fsc.go.kr/no010101/88216", "summary": "1 행사 개요 국내 최대 핀테크 박람회 ｢ 코리아 핀테크 위크 2026 ｣가 국내·외 대표 핀테크 기업들과 금융회사, 유관기관, 해외정부·기관 등의 참여 속에 11.25일 (수) ~ 11.27일 (금) , 3일간 양재 aT센터 에서 개최 된다. 올해 행사는 금융 정책 토론 등 전문 세미나 및 다양한 부대행사로 구성 되며, 국내·외 25개 기업·기관이 협력기관 으로 참여한다. 또한 전년 대비 프로그램, 연사, 전시부스 규모를 확대하는 등 행사 콘텐츠를 한층 강화하여 역대 최대 규모 로 개최된다. \u003c 행사 안내 > ▪ 일시/장소 : ’26.11.25일(수) ~ 11.27일(금) / 서울 양재 aT센터 ▪ 주제 : 다음 금융은 이미 시작됐다 (Beyond Finance, Into the Future) ▪ 주요 행사내용 - 개막행사 : 금융위원장 환영사, 국내·외 연사의 축사 및 기조연설 - 프로그램 : 일자별 주요 관람객 수요에 맞춘 다채로운 프로그램 제공 * ① 디지털금융 정책, ② 핀테크 기업 성장, ③ 투자·재테크 및 일자리 - 전시관 : ① 핀테크관, ② 금융관, ③ 글로벌관, ④ 협력관 4개의 공간으로 구성, 총 115개 부스에서 140개 기업·기관의 핀테크 서비스와 기술 홍보 - 부대행사 : 핀테크기업을 위한 비즈니스 기회, 스탬프 투어 및 도슨트투어, AI 티셔츠 제작 체험 등 체험형 프로그램 2 개막행사 주요내용 개막행사 (10시) 에는 이억원 금융위원장 을 비롯해 국내· 외 연사 * 및 금융회사·핀 테크 기업·금융협회 대표 및 임직원 등 200여 명이 참석 했다. * 축사 : 유동수 정무위원회 위원장, 콜린 크룩스 주한영국대사관 대사, 제임스 켈리 호주 재무부 차관보 기조연설자: 토드 폭스 VISA 경제역량강화연구소 대표, 김건 한국핀테크지원센터 이사장 금융위원회 이억원 위원장 은 환영사 를 통해 “ AI, 블록체인 등 새로운 기술 이 만들어가는 새로운 금융인 ‘다음 금융’ 은 이미 우리 앞에 와 있다 ”며 , “ 새로운 시대에 걸맞은 안전한 금융 을 위해서도 이를 뒷받침할 제도적 변화에 과감히 속도 를 내야할 때”라고 포부를 밝혔다. 이억원 위원장 은 ① 기술과 금융의 융합을 위한 금융 AX, 디지털자산법 등 제도적 기반 마련, ② AI, 데이터 분석 기술을 활용한 포용금융 확산 , ③ 혁신에 비례하는 금융 안전 강화 등의 비전을 공유했다. 이를 위해 “민관의 소통과 협력”이 필요 하다면서, 금융회사와 핀테크 가 혁신적인 기술과 서비스 를 시도하면, 금융위 는 민간의 도전과 혁신을 뒷받침 하기 위한 제도적 기반 을 다져나가겠다는 메시지를 전달했다. ※ 이억원 금융위원장 환영사 별첨 국내 · 외 연사 들의 축사와 기조연설도 이어졌다. 국회 정무위원회 유동수 위원장, 콜린 크룩스(Colin Crooks) 주한 영국대사, 제임스 켈리(James Kelly) 호주 재무부 차관보 는 코리아 핀테크 위크의 흥행과 성공 을 기원하는 축사 메시지를 전달하였고, 기조연설자 로 나선 토드 폭스 (Todd Fox) VISA 경제역량강화연구소 대표 와 김건 한국핀테크지원센터 이사장 은 미래 금융의 주요 트렌드 와 글로벌 핀테크 시장 전망 에 관한 메시지를 전달 하였다. 3 주요 프로그램 안내 (1) 핀테크 투자 활성화 프로그램 개막식 오후에는 핀테크 기업의 성장 기반 강화와 투자 활성화 를 위한 '투자 MOU 체결식' 이 진행된다. 투자운용사와 핀테크 기업 10개사 가 참여하여 양해각서(MOU)를 체결 하여 앞으로 투자 협력 의향 을 확인한다. 이후 각각 투자 결정 경험 (투자운용사)과 투자 유치 경험 (핀테크 기업)을 무대에서 발표 한다. * 투자운용사: 데일리파트너스, 에스제이투자파트너스, 신영증권-티인베스트먼트, 대교 인베스트먼트, 서울대기술지주 핀테크 기업: 곳간로지스, 데브디, 캐노피, 원셀프월드, 프리핀스 한편, 핀테크 기업의 투자유치 기회를 확대하고 투자자와의 접점을 넓히기 위한 투자 프로그램 도 운영된다. ｢핀테크 혁신펀드｣ 운용사들이 펀드 운용 방향을 소개하는 '핀테크 혁신펀드 Reverse IR' 과 전문 투자사와의 상담을 통해 투자 가능성을 모색하는 '핀테크 스타트업 투자 밋업' 이 마련된다. 이를 바탕으로 핀테크 기업과 투자자 간 실질적인 만남을 지원하고, 유망 기업의 투자유치 및 후속 투자 연계 기회를 확대할 계획이다. (2) 세미나·부대행사 제1·2전시장 무대에서는 국내·외 전문가와 협력기관이 함께하는 세미나 및 부대행사가 열린다. 올해는 120여 명의 국내·외 연사가 참여 하는 총 36개 프로그램 이 마련되어 역대 최대 규모 로 운영되며, 시장과 관람객들의 수요 및 관심사를 반영하여 ① DX·AX, ② 금융정책 공유, ③ 재테크, ④ 취업, ⑤ 핀테크 투자, ⑥ 핀테크 지원, ⑦ 기술 트렌드 등 7개 주제로 전문가들의 깊이 있는 논의 가 이루어진다. 특히, 올해는 국내 기관 중심으로 구성되었던 협력기관에 'GFTN'이 해외 기관으로 처음 합류 하면서 박람회의 국제적 협력 기반을 한층 확대 하였다 . GFTN * 은 이번 행사에서 두 차례의 세미나를 개최하며, 해외 연사들이 ① 글로벌 금융혁신과 인공지능 거버넌스, ② 아시아 금융연결망과 글로벌 진출을 주제로 글로벌 금융환경 변화와 해외시장 진출 전략 등을 논의한다. * GFTN: 싱가포르 통화청(MAS)이 2024년 설립한 글로벌 금융·기술 분야 국제협력 네트워크로, 각국 금융기관 및 핀테크 기업 간 교류와 협력을 지원하는 기관 (3) 전시관 총 115개 부스 로 구성된 전시관 에서는 최신 핀테크 서비스 를 직접 체험 하고 , 기술의 동향 을 살펴볼 수 있다. 전시관 은 ① 핀테크관 , ➁ 금융관 , ③ 글로벌관 , ④ 협력관 네 개의 공간으로 조성된다. ① 핀테크관 에서는 8개 분야의 국내 핀테크 기업들이 혁신적인 서비스와 기술 을 선보이고, ② 금융관 에서는 향후 출시될 새로운 서비스와 금융 기술을 미리 체험할 기회 를 제공한다. ③ 글로벌관 에는 미국 을 포함한 12개 국가 * 가 참여하여 각국의 기술과 혁신 사례 를 공유하 고, ④ 협력관 은 핀테크 기업의 사업 성장에 필요한 지원사업과 관련 정보를 소개한다. * 국가: 라트비아, 리투아니아, 미국, 싱가포르, 영국, 우즈베키스탄, 인도네시아, 일본, 중국, 카자흐스탄, 호주, 홍콩 아울러 행사장 곳곳에는 국내·외 핀테크 산업의 발전 현황과 주요 동향을 소개 하는 정보형 전시 패널도 마련 된다. 관람객은 이를 통해 국내 핀테크 산 업의 성장 과정과 주요 성과는 물론, 글로벌 시장의 변화와 국가별 산업 특성을 한눈에 살펴볼 수 있다. (4) 투어·체험 프로그램 일반 관람객을 위한 참여형 프로그램 도 다양하게 마련되어 있다. 전문 안내자의 설명을 들으며 전시관을 함께 둘러보는 단체 도슨트 투어 는 전년 대비 신청 인원이 43% 증가하는 등 높은 관심을 받았다. 이와 함께 생성형 AI로 제작한 이미지를 티셔츠에 즉석 인쇄하거나 AI 포토부스를 체험하고 , 폐카드를 활용해 굿즈를 제작하는 등 관람객이 직접 참여하며 핀테크 기술과 자원순환의 가치를 경험할 수 있는 프로그램도 운영된다. (5) 기타 안내 관람객들이 보다 쾌적하게 행사장을 이용할 수 있도록 휴게 공간과 F&B 공간을 전년보다 대폭 확대 하여, 부스와 세미나 등 다양한 프로그
