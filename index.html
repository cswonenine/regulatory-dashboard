3.3%, 증권사 74.4%", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "全금융권이 비상한 경각심을 갖고 침해위협에 대응해 나가겠습니다.  - 금융위원장 주재 금융위·금감원 합동 「全금융권 긴급 점검회의」 개최", "department": "금융안전과", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87876", "summary": "全금융권이 비상한 경각심을 갖고 침해위협에 대응해 나가겠습니다. - 금융위원장 주재 금융위·금감원 합동 「全금융권 긴급 점검회의」 개최- ▸ 全금융권, 외부접점, 인증·접근통제 등 보안체계 전반에 대한 신속·철저한 점검 ▸ 침해사고 발생 시 신속한 소비자 보호 조치·피해보상 및 2차 피해 예방 ▸ 공격 IP·공격수법 등 위협정보를 신속히 공유하고 全금융권 공동대응 강화 [ 회의개요 ] ’26.10.4.(일) 금융위원회 는 금융감독원 과 함께 이억원 위원장 주재로 금융보안원, 全금융업권별 협회, 주요 금융회사 등과 최근 금융권 침해위협 대응을 위한 「全금융권 긴급 점검회의 」를 개최하였다. 이번 회의에는 범 정부적 대응을 강화하고, 관계부처 간 공조체계를 구축하기 위해 과기부, 개보위, 경찰청 도 참석하였다. 금번 회의는 최근 주요 금융회사에 대한 사이버공격이 잇따라 발생된 정황이 발견되고 있는 만큼, 금융회사들 의 정보유출 사건 과 공격유형·수법 등을 공유하고, 추가적인 침해사고 와 국민 피해가 발생하지 않도록 금융권 전체 가 비상한 경각심 을 갖고 대응 하기 위해 개최되었다. · 일시/장소 : ’26.10.4.(일) 14:00 / 정부서울청사 · 참석 : [금융위] 이억원 위원장 (주재) , 사무처장, 디지털금융정책관 등 [금감원] 이찬진 금융감독원장, 디지털·IT부원장보 등 [금보원] 박상원 금융보안원장, 사이버대응본부장 [관계부처·기관] 과기부, 개보위, 경찰청 담당 국장 / 한국인터넷진흥원(KISA) [협회·중앙회] 금융업권별 * 협회장 * 은행연, 금투협, 생보협, 손보협, 여전협, 저축은행중앙회 신협·농협·수협·새마을금고 중앙회, 핀산협, DAXA [금융회사] 주요 금융회사 7개사 · 논의사항 : 최근 금융권 침해시도 동향 및 대응방향 [ 주요 논의사항 ] 금융위·금감원·금보원 은 지난 9월 30일 신한은행 의 침해사고 접수 직후부터 당일 신속히 현장조사 에 착수하여 사고원인 과 피해범위 등을 면밀히 파악 하고 있으며, 이후 접수된 금융회사 들의 침해신고 에 대해서도 신속하게 사고 조사 를 실시 하는 등 긴밀히 대응하고 있다. 아울러, 지난 10월 2일 금융위 사무처장 주재 로 「긴급 상황대응 회의」 를 개최하여 최근 침해사고 동향 과 대응방향 을 점검하고, 확인된 공격정보 를 全 금융권 에 신속히 전파 하는 한편, 유사한 침해사고 의 재발 및 추가 피해 확 산 을 방지하기 위해 全금융권에 보안점검 체크리스트 를 배포 하여 신속한 자 체점검 과 점검결과 보고 를 요청 하는 등 총력 대응 중 인 상황이다. 이억원 위원장 은 최근 침해위협이 금융권 전반 으로 확산된 만큼, 불필요한 불안감 을 사전 에 차단 하는 한편 소비자 보호 를 위해 금융권 전체 가 공동 대응 한다는 인식 하에 다음 사항 을 철저히 이행 해 줄 것을 당부하였다. ① 全금융권의 신속하고 철저한 보안점검 全금융권은 소비자 들이 안심 하고 금융서비스 를 이용 할 수 있도록 외부 접점 과 침해활동 탐지체계 등에 대한 철저한 점검 을 통해 침해사고 예방에 만전 을 기해야 한다. 지난 10월 2일 긴급 상황대응 회의 를 통해 주문 한 바와 같이, 외부에 노출된 IT자산 과 서비스를 빠짐없이 파악 하고 보안취약점, 인증·접근통제 및 침해활동 탐지체계 등을 전면 재점검 하여야 한다. 은행·카드사 뿐만 아니라 상호금융, 저축은행, 보험, 증권, 핀테크 등 중소형 금융회사 를 포함한 全금융권 은 자체점검 을 신속히 마무리 하고 그 결과를 금융위·금감원에 보고해야 한다. 특히, 공격 IP·공격수법·침해시도 내역 및 사고사례 등 이미 전파된 위협정보 에 대해 각 금융회사의 탐지·차단체계 등 에 제대로 반영 하고 신속하게 보안패치 를 하였는지 다시 한번 확인 할 필요가 있다. 정 부는 이미 공유된 공격정보 와 사고사례 가 있음에도 필요한 점검과 대 응 을 소홀히 하여 유사한 침해사고 가 발생하는 경우에는 관련 법령에 따라 엄정 하게 대응 해 나갈 예정이다. ② 외부점접 등 잠재적 위험요인 최소화 금융회사는 대고객 서비스 여부와 관련 없이 임직원 등 이 업무상 접근하는 외부접점 과 시스템 접근경로 를 빠짐없이 식별·점검 하여 잠재적인 위험요인 을 최소화 하여야 한다. 소비자 서비스 제공·업무수행 에 필수불가결 한 경우를 제외한 외부접근 은 원칙적 으로 모두 차단 하고, 업무상 외부접근이 불가피한 경우에도 접근권 한 과 조회 가능한 정보 를 필요 최소한 으로 제한하여야 한다. 아울러, 최근 침해사고의 원인 이 된 대출모집인·위탁업체 등 외부인력과 임직원 이 사용하는 시스템에서 개인신용정보가 불필요 하게 보관·조회되지 않도록 하고, 인증 절차 가 누락 되거나 우회 될 수 있는 경로가 없는지 철저히 점검 하여야 한다. ③ 신속하고 실효성 있는 소비자 보호 및 피해보상 침해사고가 발생한 금융회사는 유출정보의 범위 와 소비자 피해 가능성 을 신속 하고 정확 하게 파악하고, 추가적인 정보유출 이나 금전피해 가 발생하지 않도록 필요한 보호조치 를 즉시 시행하여야 한다. 소비자 피해 가 확인된 경우에는 소비자에게 상세 한 정보 를 통지 하고 피 해구제·보상 등이 신속하고 차질 없이 이루어질 수 있도록 최선을 다할 필요 가 있다. 아울러, 정보유출 등을 악용한 보이스피싱·스미싱 등 2차 피해 가능성 에도 철저히 대비하여 이상금융거래 탐지 및 소비자 안내 등 필요한 예방조치 를 강화 하여야 한다. ④ 위협정보의 신속한 공유 및 금융권 공동대응 강화 최근 사고에서 확인된 공격 IP, 공격수법 및 침해시도 내역 등 위협정보 를 관계기관 과 금융회사 간 신속 하게 공유 하고, 이를 금융회사의 탐지·차단조 치 에 즉시 활용 할 필요가 있다. 특히, 금융권은 금융회사 간 업무·서비스가 상호 연계 되어 있고 유 사한 시스템 과 외부접점 을 활용하는 경우가 많은 만큼, 금융권 전체가 긴밀하게 협력 하여 공동대응 하여야 한다. 아울러, 금융감독원, 금융보안원 등을 중심으로 금융권의 침해활동 을 면 밀히 모니터링 하고, 새로운 공격징후 가 포착되는 경우 관련 정보를 즉시 전파 하여 추가 피해 를 선제적 으로 차단 해야 한다. 나아가, 사이버 위협 에는 금융 과 비금융의 경계 가 없는 만큼 , 정부도 금 융권뿐만 아니라 다양한 산업분야 와 위협정보의 공유 와 공조 를 확대하고 과기부, 개보위, 경찰청 등 관계부처 간 공조체계를 한층 더 강화 하여 침해위협 에 범정 부적 으로 대응 해 나갈 것이다. ⑤ “AI공격은 AI로 방어하는” 보안체계 구축 AI의 발전속도 가 빠르게 변화 하고 있는 만큼, 새로운 공격패턴, 예상치 못한 취약점 을 파고드는 해킹수법이 빠르게 확산 할 수 있다. 이에 정부에서 추진중인 AI 보안테스트 등 정책 에 적극 참여 하는 한편, 금융권이 자체적으로 제로트러스트 원칙 에 기반한 보안체계 재구축 등 AI 기반 보안체계 전환 에도 노력 을 기울여야 한다. 이억원 위원장 은 “ 최근 일련의 침해사고 를 계기로, 금융보안은 개별 금융회사 의 전산시스템 을 보호 하는 차원을 넘어 국민이 금융서비스를 안심하고 이용할 수 있도록 하는 금융산업의 신뢰 와 안정성의 기반 이라는 점을 다시 한번 인식 할 필요가 있다. ”고 강조하였다. 이어 “ 금융의 디지털화 와 금융회 사 간 서비스 연계 가 확대 되면서 한 금 융회사의 보안 취약점 이 금융권 전반의 위험 으로 이어질 가능성도 커지고 있는 만큼, 全금융권은 이번 사 태 를 계기로 비상한 각오 와 최고 수준의 경 각심 을 갖고 정보보안 체계 전반 을 원점 에서 재점검 하고 보안수준 을 한 단 계 높여야 한다 .”고 주문하였다. 아울러, “기 발생한 사고의 원인조사 를 통해 침해위협의 실체 를 신속하고 명확히 규명 하고, 금융회사들이 마련한 소비자보호 조치 등이 철저히 이뤄지는지 면밀히 지도·감독 해 나가겠다.”고 하면서, “최근 침해사고의 유형과 피해양상 등을 면밀히 분석하여 필요한 제도개선 과제 를 적극 발굴하는 등 침해사고로 인한 국민 피해가 발생·확산 되지 않도록 총력 대응 해 나가겠다.”고 하였다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "FSC", "title": "청년미래적금 2차 가입기간 운영,  10월 7일부터 16일까지 가입신청", "department": "청년정책과", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87880", "summary": "청년미래적금 2차 가입기간 운영, 10월 7일부터 16일까지 가입신청 ▪ 10월 7일 은 출생연도 끝자리 홀수 , 10월 8일 은 짝수 가 가입신청 가능 하며, 10월 12일부터 16일까지 출생연도와 관계없이 신청 가능 ▪ 은행 등 취급기관 앱 을 통해 서류 제출없이 간편하게 신청 가능 (가입신청 운영시간 9:00~18:30) ▪ 1991년 11월 17일생부터 2007년 11월 27일생 까지의 청년 이 가입 가능 하며, 병역이행 기간을 가입연령 계산 에서 제외 ▪ 청년도약계좌 가입자 의 청년미래적금 ‘갈아타기’ 기회 추가 제공 금융위원회와 서민금융진흥원은 청년미래적금 2차 가입신청 기간을 10.7일 (수) 부터 10.16일 (금) 까지 (토·일·공휴일 제외) 운영한다. (가입신청 운영시간 9:00~18:30) 청년미래적금 은 매월 최대 50만원 한도 내에서 자유롭게 납입할 수 있는 3년 만기 자유적립식 상품 으로, 납입액에 정부 가 6% 또는 12% 의 기여금 을 매칭 지원 하고, 이자 소득세 가 면제 된다. 금리 , 정부 기여금 , 이자소득 비과세 혜택 을 함께 고려한 청년미래적금 실질 가입효과 는 일반형 기준 최대 13.2~14.4% * , 우대형 18.2~19.4% ** 수준 단리 적금상품 에 가입 하는 것과 유사한 수준이다. * (금리 7% 가정시) 일반형 2,110만원 : 원금 1,800만원 + 기여금 108만원 + 이자 202만원→ 금리 13.2% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 366만원 - 이자소득세 56만원) 우대형 2,227만원 : 원금 1,800만원 + 기여금 216만원 + 이자 211만원 → 금리 18.2% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 505만원 - 이자소득세 78만원) ** (금리 8% 가정시) 일반형 2,138만원 : 원금 1,800만원 + 기여금 108만원 + 이자 230만원 → 금리 14.4% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 400만원 - 이자소득세 62만원) 우대형 2,255만원 : 원금 1,800만원 + 기여금 216만원 + 이자 239만원 → 금리 19.4% 단리 적금상품 가입 효과 (원금 1,800만원 + 세전이자 538만원 - 이자소득세 83만원) 가입신청 기간 중 10월 7일 과 8일 에는 원활한 신청을 위해 출생연도 끝자리 에 따른 홀·짝제 를 운영하고, 이후 10월 12일부터 16일까지 는 출생연도와 관계없이 누구나 신청 이 가능 하다. 가입을 희망하는 청년들은 취급기관 * 앱 을 통해 별도의 서류제출 없이 비대면 으로 가입신청 이 가능하다. 가입신청 후 가입심사 를 거쳐 11월 12~13일 심사 결과 를 안내 하고, 11월 16~27일 동안 계좌개설 및 납입 개시 가 가능 하다. * 농협, 신한, 우리, 하나, 기업, 국민, 수협, iM, 부산, 광주, 전북, 경남, 카카오, 우정사업본부 (토스뱅크는 3차 모집부터 참여) \u003c 청년미래적금 2차 가입·심사 일정 (안) > 가입 신청 신청자 10.7(수) 10.8(목) 10.12(월)~10.16(금) 출생연도 끝자리 홀수 출생연도 끝자리 짝수 전체 가입신청 심사 일정 10.19(월)~11.13(금) 계좌 개설 신청자 11.16일(월) ~ 11.27일(금) 소득심사 및 우대형 자격심사 계좌 개설 및 납입 개시 청년도약계좌 - 청년미래적금 갈아타기 ※ 내부 심사일정은 신청 인원 및 심사진행 상황 등에 따라 일부 변동될 수 있음 가입대상 은 소득·매출액 (소상공인) 요건 * 등을 충족 한 만 19~34세 청년 이다. 이번 가입기간 에는 1991년 11월 17일생 ** 부터 2007년 11월 27일생 * 까지 가 가입대상 이며, 병역 이행한 경우 최대 6년 의 병역 이행 기간 을 연령 계산 에서 제외 *** 한다. * ➀ 총급여 (근로소득-비과세소득) 7,500만원 (종합소득 6,300만원) 소득자 또는 연매출 3억원 이하 소상공인 & ➁ 가구중위소득 200% 이하 (➀+➁ 동시충족) ** 조세특례제한법령에 따라 가입일 (계좌개설기간, ‘26.11.16~27일) 에 만 19 ~ 34세인 청년 *** 예) 현재 35세인 자가 병역을 2년간 이행했을 경우, 2년을 차감한 33세로 간주하여 심사 ※ 가입 신청자는 가입을 원하는 취급기관 앱에서 ➀ 일반소득자, ➁ 중소기업 재직자, ➂ 소상공인 중 본인에게 해당하는 유형을 선택 하여 가입 신청 진행 직전연도 (‘25년) * 소득 확인 이 가능해야하며, 일정 요건을 충족하는 중소기업 재직자 , 중소기업 신규 취업자 와 소상공인 은 우대형 (기여금 매칭률 12%) 으로 가입 할 수 있다. 소상공인 자격 (매출액 심사) 으로 가입 을 희망 하는 경우에는 ‘가입신청 전’ 소상공인 확인서 를 발급 ** 받아야 한다. * 정확한 소득 확인을 위해 가장 최신 (‘25년) 국세청 확정 소득을 활용하여 심사 ** 중소기업현황정보시스템(sminfo.mss.go.kr) 접속 → 회원가입 및 로그인 → 자료제출 (홈페이지 매뉴얼 참고) → 중소기업(소상공인)확인서 신청서 작성 및 제출 → (승인 후) 확인서 발급 확인 ※ 소상공인확인서 발급문의 : 중소기업통합콜센터 국번 없이 1357 이번 2차 모집에서는 기존 청년도약계좌 가입자 가 청년미래적금 으로 갈아탈 수 있는 기회 를 추가 로 제공 한다. 갈아타기를 희망하는 경우 우선 이번 2차 가입신청 기간 에 가입신청 을 진행 후 가입 가능 안내를 받아야 한다. 심사 통과자는 먼저 청년미래적금 계좌 를 개설 한 다음, ‘청년미래적금 가입 목적 의 청년도약계좌 특별중도해지’ 를 계좌 개설기간에 신청 하면 된다. 한편, 가입대상 확대 및 우대형 지급비율 상향 * 등을 내용으로 하는 ‘27년 청년미래적금 정부 예산안 등이 국회 심의 를 통해 확정될 경우 기존 가입자 에게도 변경된 혜택을 소급 적용한다. 우선 기존 우대형 가입자 들에게 상향된 기여금 을 소급 지급 하고, 현재 이자소득 비과세 혜택만 받을 수 있는 기여금 미대상 가입자 ** 에는 일반형 기여금 을 소급 하여 지급 할 예정이다. * (현재) 12% → (‘27년 안) 15% 또는 25% (비수도권 중소기업 재직자) ** 총급여 6천만원 (종합소득 4,800만원) 초과 ~ 7,500만원 (종합소득 6,300만원) 이하 보다 자세한 내용 은 청년미래적금 웹페이지 (fill4young.kinfa.or.kr) 또는 서민금융진흥원 청년금융콜센터 (☏1397 바로 3번) 를 통해 확인이 가능하다.", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "신협의 부실채권 관리체계를 고도화합니다  신용협동조합법 시행령 개정안 국무회의 의결", "department": "상호금융팀", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87881", "summary": "신협의 부실채권 관리체계를 고도화합니다 신용협동조합법 시행령 개정안 국무회의 의결 - 신용협동조합법 개정에 따라 법률에서 위임한 ➊ 자산관리회사 운영 관련 세부사항 및 ➋ 상임감사 선임기준 구체화 「 신용협동조합법 시행령 」 일부개정안이 2026.10.6일(화) 국무 회의 에서 의결 되었다. 금번 개정안은 「 신용협동조 합법 (이하 ‘신협법’) 」 개 정 에 따라 법률에서 위임한 사항을 구체화 하기 위한 것으로, 상임감사 의무선임 기준 과 신협자산관리회사 운영 관련 세부사항 등을 규정하는 내용을 담고 있다. * ’26.4.21 공포, ’26.10.22 시행 \u003c 신협법 시행령 개정안 주요 내용 > 신협자산관리회사 운영 관련 세부사항 구체화 신협자산관리회사가 매입할 수 있는 비업무용 자산의 범위를 △조합· 중 앙회 등이 부실채권으로 인해 취득한 자산 , △ 경영관리 및 재무상태 개선 조치 에 따라 처분해야 하는 고정자산 , △ 합병·사업양도·계약이전 등으로 업무에 사용하지 않게 된 고정자산 등으로 규정하였다 (令 §19의17) . 또한, 부실자산 인수가격 은 감정평가법인 등의 감정평가 가격 등 객관적인 가격 을 기준으로 산정하되, 선순위 채권·물권·임차권 등을 고려하도록 하였다. 아울러, 가격의 사전확정이 곤란한 경우에는 인수가격과 처분가격 간 차액을 사후 정산 할 수 있도록 하였다 (令 §19의18) . 아울러, 자산관리회사가 부실자산의 매입·매각·추심 등 업무 수행 과정에서 불가피한 경우 주민등록번호 등 고유식별정보를 처리할 수 있는 근거 도 마련하였다 (令 §24의2.⑤) . 금번 개정은 농협·새마을금고 등 타 상호금융업권 자산관리회사와 유사한 수준의 종합적 NPL 관리체계를 구축 하기 위한 것으로, 신협의 부실채권 정리 및 건전성 관리 강화 에 기여할 것으로 기대된다. 신용협동조합의 상임감사 선임기준 구체화 먼저, 개정 신협법에서 시행령에 위임한 상임감사 의무선임 대상 조합 의 범위를 자산총액 3천억원 이상 (法 §27.⑧) 인 지역조합 또는 단체조합 으로 구체화하는 한편, 종교단체·사단법인·직종단체 조합 중 일정 요건을 충족하는 조합은 상임감사를 두지 않을 수 있도록 규정하였다 (令 §14.⑤) . 또한, 상임감사 의무선임 대상 조합이 아닌 경우에는, 자산총액이 2천억원 이상 인 조합 중 이사회가 건전성 관리 , 내부통제 강화 및 금융사고 예방 등을 위해 필요하다고 인정하는 경우 상임감사를 선임할 수 있도록 규정하였다 ( 令 §14.⑥ ) . 이번 개정을 통해 중소형 조합의 경영부담을 완화 하는 한편, 조합의 자율적인 내부통제 개선 을 도모할 수 있을 것으로 기대된다. \u003c 향후 계획 > 이번 개정 시행령은 개정 신협법의 시행일에 맞추어 ’26.10.22일부터 시행 될 예정이다. 신협자산관리회사 설립 의 경우, 신협중앙회 출자 및 ｢ 대부업등 감독규정 ｣ 개정 * 관련 금융위 의결 절차 등을 거쳐 ’26.11월 이후 부실채권 매입 업무를 개시 할 예정이다. * 현재 감독규정상 신협자산관리회사도 대부채권을 양도받을 수 있는 기관으로 추가하는 내용의 규정변경예고 중 (8.27.~10.6.)", "essential": false, "importanceReasons": ["law/regulation change (+1)"]}, {"source": "KRX_OPEN2", "title": "「월간 기업가치 제고 현황(‘26.9월)」 발표", "department": "", "date": "2026-10-06", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015789", "summary": "첨부 참조", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "최근 금융권 개인정보 유출사고에 따른 보이스피싱·스미싱 등 피해에 주의하세요.", "department": "금융안전과", "date": "2026-10-06", "url": "https://www.fsc.go.kr/no010101/87882", "summary": "최근 금융권 개인정보 유출사고에 따른 보이스피싱·스미싱 등 피해에 주의 하세요. ✓ 최근 일부 금융권 개인정보 유출 ource": "FSC", "title": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.6일)", "department": "국민지역참여지원과", "date": "2026-10-08", "url": "https://www.fsc.go.kr/no010101/87899", "summary": "제2차 국민참여성장펀드 판매 결과 잔여물량 현황(10.6일) 제2차 국민참여형 국민성장펀드 (이하 ‘국민참여 성장펀드’) 의 10.6일까지 의 나 흘 간 판매액 은 총 목표액 (6,000억원) 의 52.7% 인 약 3,162억원 입니다. 판매 사별 잔여 물량 현황 은 [ 붙임 ]과 같습니다. 제1차 국민참여성장펀드 의 현 시점 수익률 이 상대적으로 낮다 * 는 우려 와 관련 하여, 국민참여성장펀드의 상품 특성에 대한 이해 를 돕고자 설명드립니다. 국민참여성장펀드는 주된 투자 대상 이 비상장사 를 포함한 첨단전략산업 분야 이고, 5년 만기 시점의 수익률 로 실제 수익을 배분하는 상품 이라서 펀드 결성 초기 인 현 시점의 수익률 은 큰 의미가 없습니다 . 한편, 제1차 국민참여 성장펀드 설정 (6월12일) 이후 상장주식시장의 급변동 및 하락 * * 에도 불구 하고 , 현 시점 플러스 수익률 을 기록하고 있는 모습은 국민의 장기투자 부담 완화 를 위해 마련한 제도적 보완 장치 (재정 및 운용사 시딩투자액의 후순위 보강 등) 가 어느 정도 효과 를 발휘 할 수 있다는 점을 보여줍니다. * 10.6일 기준 1.40% ** 동기간(6.12일~10.6일) 코스피 수익률 약 –14.55%, 코스닥 수익률 약 –10.60%", "essential": false, "importanceReasons": []}, {"source": "FSC", "title": "제2차 국민참여성장펀드  첫 5영업일간 판매 현황(9.30일~10.7일)", "department": "국민지역참여지원과", "date": "2026-10-08", "url": "https://www.fsc.go.kr/no010101/87900", "summary": "제2차 국민참여성장펀드 첫 5영업일간 판매 현황 (9.30일~10.7일) □ 제 2차 국민참여형 국민성장펀드 (이하 ‘국민참여 성장펀드’) 의 10.7일까지 첫 5영 업일 간의 판매액 은 총 목표액 (6,000억원) 의 55% 인 3,301.6억원 이다 . 오늘까지 서민 우선배정 및 온라인 판매량 제한 이 있었으며, 내일부터는 이 제한이 사라진다 . 오늘까지의 판매 세부현황 은 다음과 같다. ㅇ ( 서민 판매비중 ) 서민 * 에게 펀드 가입 의 우선 순위 를 부여하기 위해 첫 5 영업일간 총 목표액 (6,000억원) 의 50% 를 서민 전용 으로 배정 하였다. 이 기간동안 서민 의 가입액 은 약 1,115억원 으로 판매 된 전체금액의 약 34% 를 차지하였다. 이는 1차 때 서민 판매 실적 (약 35%) 과 유사한 수준 이다. * 서민 기준 : 근로소득 5,000만원 이하(근로소득 외에 종합소득이 있는 경우에는 종합 소득 3,800만원 이하) → 서민형 ISA 요건과 동일 ㅇ ( 온라인 판매비중 ) 온라인 판매 집중 으로 영업점 창구 가입이 어 려워 지지 않도록 온라인 판매 비중 을 은행 40%, 증권사 60% 로 제한하 였다 . 5영업일간 판매 결과 은행, 증권 구별없이 온라인 판매 비중이 높게 (은행 74%, 증권 78.6%) 나타났다. ㅇ ( 은행‧증권사 비중 ) 증권사 판매액 이 약 1,892억원 (배정액 대비 72.5% 판매 , 총 판매액의 57.3%) , 은행 판매액이 약 1,410억원 (배정액 대비 41.6% 판매 , 총 판매액의 42.7%) 으로 증권사를 통한 가입 이 더 많았다 . \u003c첫 5영업일간 판매현황> 구분 판매액 온라인 서민 배정액 대비 소진율 판매액 대비 비중 판매액 대비 비중 은행 1,409.7억원 41.6% 1,051.1억원 74.6% 423.9억원 30.1% 증권 1,891.9억원 72.5% 1,481억원 78.3% 690.6억원 36.5% 합계 3,301.6억원 55.0% 2,532.1억원 76.7% 1,114.5억원 33.8% □ 6영업일차 인 10월 8일(목)부터 판매 종료기한 인 10월 15일(목)까지는 서 민 우선배정 및 온라인 판매제한 없이 물량 소진시까지 판매된다 . 서민 등 정책적 배려를 위한 제한 으로 인해 일부 판매처 에서 판매수요를 모두 소화하지 못한 측면 이 있었던 만큼, 10.8일(목)부터는 투자자의 가입 접근성 이 제고 될 것으로 예상된다. □ 5영업일간의 판매 실적을 고려 하여 공모펀드운용사 3社 (미래에셋, 삼성, KB자산운용) 는 각 판매사별 배정물량을 조정 하였고, 그 결과 판매사별 잔여물량 은 [붙임]과 같다. ㅇ 2차 펀드에 가입하신 고객은 연간 한도 (1억원) 내에서 판매기간 중 추가 로 가입 이 가능 하다.", "essential": false, "importanceReasons": []}, {"source": "FSS", "title": "금융분쟁조정위원회, 예금부당해지에 따른 금융회사에 대한 책임 인정", "department": "소비자권익보호국/중소금융감독국", "date": "2026-10-08", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=238317&menuNo=200218&pageIndex=1", "summary": "ㅁ ’26.10.7.(수) 금융분쟁조정위원회(이하 ‘분조위’)는 금융회사 직원의 착오로 고객(’58년생, 女) 명의 예탁금 계좌가 아닌 고객의 아들 명의 계좌를 해지,지급한 경우, 변제의 효력을 부정하고 금융회사에게 예탁금(아들 명의)에 대한 반환채무가 존재함을 인정하였습니다.\nㅇ 한편, 고객이 해지된 예탁금을 수취하여 보관하다가 보이스피싱 사기범에게 그대로 전달한 경우 고객이 해당 금전을 실질적으로 지배하였다고 보기 어려우므로 고객이 금융회사에 대한 부당이득반환 의무를 부담하지는 않는다고 조정결정 하였습니다.\nㅁ 이번 분조위 결정은 금융회사가 가족명의 예탁금의 개설,해지 업무를 부당하게 처리할 경우, 업무상 주의의무 위반(내규 위반 등) 여부 등에 따라 민사적 책임을 부담할 수 있다는 점을 확인하였다는데 의의가 있습니다.\nㅇ 금융감독원은 앞으로도 금융회사가 예탁금 등 계좌개설시 금융실명확인 및 중도해지시 해지의사,본인(대리인) 확인과 관련하여 제반절차를 철저히 준수하도록 지속적으로 지도해 나갈 예정입니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": []}, {"source": "MOFE", "title": "관계부처 합동 10월 일자리전담반(TF) 개최", "department": "인력정책과", "date": "2026.10.08.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079576&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"]}, {"source": "MOFE", "title": "'생활비 경감 정책 아이디어 공모전' 시상", "department": "민생안정지원단", "date": "2026.10.08.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079565&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": []}, {"source": "KRX_OPEN2", "title": "디에스자산운용 등 ETF 4종목 신규상장", "department": "", "date": "2026-10-08", "url": "https:// const $ = id => document.getElementById(id);

function tickLiveClock() {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: '2-digit', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  $('liveClock').textContent = 'as of ' + get('year') + '/' + get('month') + '/' + get('day') + ' - ' + get('hour') + ':' + get('minute') + ':' + get('second');
}
tickLiveClock();

function relTime(iso) {
  if (!iso) return '—';
  const diffMs = Date.now() - Date.parse(iso);
  const min = Math.round(diffMs / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  const hr = Math.round(min / 60);
  if (hr < 24) return hr + 'h ago';
  return Math.round(hr / 24) + 'd ago';
}

const checkedTimes = Object.values(data.checked).filter(Boolean).sort();
$('statChecked').textContent = checkedTimes.length ? fmtClock(checkedTimes.at(-1)) + ' KST' : '—';

// --- sources panel: which sites this is watching, toggled by the Sources stat ---
$('statSourcesBtn').addEventListener('click', () => {
  const panel = $('sourcesPanel');
  panel.hidden = !panel.hidden;
  if (panel.hidden || panel.childElementCount) return;
  Object.entries(data.sources).forEach(([key, label]) => {
    const a = document.createElement('a');
    a.href = data.sourceUrls[key]; a.target = '_blank'; a.rel = 'noopener';
    const text = document.createElement('span');
    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;
    const urlEl = document.createElement('div');
    urlEl.className = 'url';
    urlEl.textContent = data.sourceUrls[key];
    text.appendChild(labelEl); text.appendChild(urlEl);
    a.appendChild(text);
    const icon = document.createElement('span');
    icon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
    a.appendChild(icon);
    panel.appendChild(a);
  });
});

// --- status banner + upcoming essential dates ---
const todayKST0 = data.generated.slice(0, 10);
const dayDiff = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(todayKST0 + 'T00:00:00Z')) / 86400000);
const essentialToday = data.changes.filter(c => c.essential);
const upcomingRows = [];
Object.keys(data.planned).sort().forEach(day => {
  if (day < todayKST0) return;
  data.planned[day].filter(c => c.essential).forEach(c => upcomingRows.push({ day, c }));
});
{
  const banner = $('banner');
  const headline = document.createElement('div');
  headline.className = 'headline';
  const sub = document.createElement('div');
  sub.className = 'sub';
  if (essentialToday.length) {
    banner.classList.add('alert');
    headline.textContent = essentialToday.length + (essentialToday.length === 1 ? ' essential update today' : ' essential updates today');
    sub.textContent = essentialToday[0].title;
  } else {
    headline.textContent = 'Nothing essential today';
    sub.textContent = upcomingRows.length
      ? 'Next: ' + upcomingRows[0].c.title + ' (' + (dayDiff(upcomingRows[0].day) === 0 ? 'today' : 'in ' + dayDiff(upcomingRows[0].day) + ' days') + ')'
      : 'No essential dates coming up either.';
  }
  // Headline + sub form one header; with essential items it is a button
  // that expands the article cards (the list lives inside the banner).
  const head = document.createElement(essentialToday.length ? 'button' : 'div');
  head.className = 'banner-head';
  const text = document.createElement('div');
  text.appendChild(headline); text.appendChild(sub);
  head.appendChild(text);
  if (essentialToday.length) {
    head.type = 'button';
    const chev = document.createElement('span');
    chev.className = 'chevron';
    chev.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    head.appendChild(chev);
    head.addEventListener('click', () => {
      const open = $('list').hidden;
      $('list').hidden = !open;
      banner.classList.toggle('open', open);
    });
  }
  banner.insertBefore(head, $('list'));

  const box = $('upcoming');
  const h = document.createElement('h2');
  h.textContent = 'Upcoming essential dates';
  box.appendChild(h);
  if (!upcomingRows.length) {
    const none = document.createElement('div');
    none.className = 'none';
    none.textContent = 'Nothing scheduled.';
    box.appendChild(none);
  }
  upcomingRows.slice(0, 5).forEach(({ day, c }) => {
    const n = dayDiff(day);
    const row = document.createElement('div');
    row.className = 'row';
    const when = document.createElement('span');
    when.className = 'when' + (n <= 3 ? ' soon' : '');
    when.textContent = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'in ' + n + ' days';
    const title = document.createElement(c.url ? 'a' : 'span');
    title.textContent = c.title;
    title.style.flex = '1'; title.style.minWidth = '0'; title.style.color = 'inherit'; title.style.textDecoration = 'none';
    if (c.url) { title.href = c.url; title.target = '_blank'; title.rel = 'noopener'; }
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = day.slice(5);
    row.appendChild(when); row.appendChild(title); row.appendChild(date);
    box.appendChild(row);
  });
}

// --- feed ---
// The feed shows only updates flagged essential; the calendar still has everything.
const feedItems = data.changes.filter(c => c.essential);
const list = $('list');
// Shared by the feed's expandable cards AND the calendar's day-list, so
// both show the same level of detail (meta, summary, a real "View
// original" link) instead of the day-list being a bare title-only list.
function buildDetailsInner(c, extraMetaParts) {
  const inner = document.createElement('div');
  inner.className = 'card-details-inner';

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = [c.department, 'posted ' + c.date].concat(extraMetaParts || []).filter(Boolean).join(' · ');
  inner.appendChild(meta);

  if (c.essential) {
    const why = document.createElement('div');
    why.className = 'why';
    why.textContent = 'Flagged essential: ' + (c.importanceReasons || []).join('; ');
    inner.appendChild(why);
  }

  if (c.summary) {
    const summary = document.createElement('div');
    summary.className = 'card-summary';
    summary.textContent = c.summary;
    inner.appendChild(summary);
  } else {
    const note = document.createElement('div');
    note.className = 'card-meta';
    note.textContent = 'No inline text (attachment-only posting).';
    inner.appendChild(note);
  }

  if (c.url) {
    const view = document.createElement('a');
    view.className = 'view-btn';
    view.href = c.url; view.target = '_blank'; view.rel = 'noopener';
    view.innerHTML = '<span>View original</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
    inner.appendChild(view);
  }
  return inner;
}

feedItems.forEach(c => {
  const card = document.createElement('div');
  card.className = 'card' + (c.essential ? ' is-essential' : '');
  card.style.setProperty('--source-color', PALETTE[c.source] || '#eb6834');

  // --- compact header: click to reveal details, nothing shown by default ---
  const head = document.createElement('button');
  head.className = 'card-head';
  head.type = 'button';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = c.source;
  head.appendChild(badge);
  const title = document.createElement('span');
  title.className = 'card-title';
  title.textContent = c.title;
  head.appendChild(title);
  const ago = document.createElement('span');
  ago.className = 'ago';
  ago.textContent = relTime(c.firstSeen);
  ago.title = 'Found at ' + fmtClock(c.firstSeen) + ' KST';
  head.appendChild(ago);
  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  head.appendChild(chevron);
  head.addEventListener('click', () => card.classList.toggle('expanded'));
  card.appendChild(head);

  // --- details: built once, hidden until expanded ---
  const details = document.createElement('div');
  details.className = 'card-details';
  details.appendChild(buildDetailsInner(c));
  card.appendChild(details);
  list.appendChild(card);
});

$('footer').textContent = 'Checks run every 10 minutes · generated ' + fmtClock(data.generated) + ' KST';

// --- monthly activity calendar ---
// "today" comes from the server-generated timestamp (KST), not the
// viewer's local clock/timezone, so the calendar's current-month default
// stays correct regardless of who's looking at it. Forward navigation
// isn't capped at the current month, since planned/execution dates
// extracted from posting text can land in future months; it's capped
// further out instead, just to keep navigation from being unbounded.
const todayKST = data.generated.slice(0, 10);
let viewYear = parseInt(todayKST.slice(0, 4), 10);
let viewMonth = parseInt(todayKST.slice(5, 7), 10) - 1; // 0-indexed
let selectedDay = null;
const pad2 = n => String(n).padStart(2, '0');
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MAX_MONTHS_AHEAD = 12;

function renderCalendar() {
  const first = new Date(Date.UTC(viewYear, viewMonth, 1));
  const startWeekday = first.getUTCDay();
  const daysInMonth = new Date(Date.UTC(viewYear, viewMonth + 1, 0)).getUTCDate();
  $('calLabel').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;

  const monthsAhead = (viewYear - parseInt(todayKST.slice(0, 4), 10)) * 12 + (viewMonth - (parseInt(todayKST.slice(5, 7), 10) - 1));
  $('calNext').disabled = monthsAhead >= MAX_MONTHS_AHEAD;

  const grid = $('calGrid');
  grid.replaceChildren();
  ['S','M','T','W','T','F','S'].forEach(w => {
    const wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = w;
    grid.appendChild(wd);
  });
  for (let i = 0; i < startWeekday; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-day blank';
    grid.appendChild(blank);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = viewYear + '-' + pad2(viewMonth + 1) + '-' + pad2(d);
    const posted = data.calendar[dateStr] || [];
    const planned = data.planned[dateStr] || [];
    const hasData = posted.length || planned.length;
    const essentialCount = posted.filter(c => c.essential).length + planned.filter(c => c.essential).length;
    const cell = document.createElement('div');
    cell.className = 'cal-day'
      + (posted.length ? ' has-data' : '')
      + (planned.length ? ' has-planned' : '')
      + (essentialCount ? ' has-essential' : '')
      + (!hasData ? ' empty-day' : '')
      + (dateStr === todayKST ? ' today' : '')
      + (dateStr === selectedDay ? ' selected' : '');
    const num = document.createElement('span');
    num.textContent = d;
    cell.appendChild(num);
    if (hasData) {
      const dots = document.createElement('span');
      dots.className = 'cal-dots';
      if (essentialCount) { const dot = document.createElement('span'); dot.className = 'cal-dot essential'; dots.appendChild(dot); }
      if (posted.length) { const dot = document.createElement('span'); dot.className = 'cal-dot'; dots.appendChild(dot); }
      if (planned.length) { const dot = document.createElement('span'); dot.className = 'cal-dot planned'; dots.appendChild(dot); }
      cell.appendChild(dots);
      const parts = [];
      if (posted.length) parts.push(posted.length + ' posted');
      if (planned.length) parts.push(planned.length + ' planned');
      if (essentialCount) parts.push(essentialCount + ' essential');
      cell.title = parts.join(', ');
      cell.addEventListener('click', () => {
        selectedDay = selectedDay === dateStr ? null : dateStr;
        renderCalendar();
        renderDayList();
      });
    }
    grid.appendChild(cell);
  }
}

function dayListItem(c, extraMetaParts) {
  const item = document.createElement('div');
  item.className = 'daylist-item';
  item.style.setProperty('--source-color', PALETTE[c.source] || '#eb6834');

  const head = document.createElement('div');
  head.className = 'daylist-item-head';
  const b = document.createElement('span');
  b.className = 'badge';
  b.textContent = c.source;
  head.appendChild(b);
  if (c.essential) {
    const flag = document.createElement('span');
    flag.className = 'badge essential';
    flag.textContent = 'ESSENTIAL';
    head.appendChild(flag);
  }
  // Title only until clicked; clicking reveals the same details as a feed card.
  const t = document.createElement('button');
  t.type = 'button';
  t.className = 'daylist-item-title';
  t.textContent = c.title;
  head.appendChild(t);
  item.appendChild(head);

  const details = buildDetailsInner(c, extraMetaParts);
  details.hidden = true;
  item.appendChild(details);
  t.addEventListener('click', () => {
    details.hidden = !details.hidden;
    item.classList.toggle('expanded', !details.hidden);
  });
  return item;
}

function dayListGroup(box, label, items, extraMetaParts) {
  if (!items.length) return;
  const heading = document.createElement('div');
  heading.className = 'group-label';
  heading.textContent = label + ' (' + items.length + ')';
  box.appendChild(heading);
  items.forEach(it => box.appendChild(dayListItem(it, typeof extraMetaParts === 'function' ? extraMetaParts(it) : extraMetaParts)));
}

function renderDayList() {
  const box = $('calDayList');
  if (!selectedDay) { box.hidden = true; box.replaceChildren(); return; }
  box.hidden = false;
  box.replaceChildren();
  const posted = data.calendar[selectedDay] || [];
  const planned = data.planned[selectedDay] || [];

  const heading = document.createElement('div');
  heading.className = 'empty-note';
  heading.textContent = selectedDay;
  box.appendChild(heading);

  dayListGroup(box, 'Posted', posted);
  dayListGroup(box, 'Planned for this date', planned, it => ['mentioned when posted ' + it.postedDate]);
}

$('calPrev').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  selectedDay = null;
  renderCalendar(); renderDayList();
});
$('calNext').addEventListener('click', () => {
  if ($('calNext').disabled) return;
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  selectedDay = null;
  renderCalendar(); renderDayList();
});
renderCalendar();
renderDayList();
</script>
