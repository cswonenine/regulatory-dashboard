 성과 를 국민께 정기적 으로 투명 하게 알리기 위한 정책 소통 채널로 ｢주택공급 정례브리핑｣ 을 신설하고, 10월 16일 (금) 제1차 브리핑 * 을 개최 하였다. * (時/所/參) ’26.10.16 (금) 14:00 / 서울청사 브리핑룸 / 국조실 국무2차장, 국토부 제1차관 등 ㅇ 국무조정실 (실장 임기근) 과 국토교통부 (장관 홍지선) 는 이번 첫 브리핑을 통해 ➊ 주택공급 정례브리핑 운영방안 과 함께, ➋ 수도권 주택공급 실적‧전망 과 정책 추진상황 등을 담은 ｢주택공급 정책 브리프｣ 와 ➌ 전월세시장 안정 을 위한 주요 정책 과제별 추진 상황 을 발표하였다. 1. “내 집 어디에 있나”…주택공급 이행상황을 정례적으로 공개합니다. □ 정부는 국민이 주택공급 진행상황과 향후 일정을 쉽게 확인할 수 있도록 10월 부터 ｢주택공급 정례 브리핑｣ 을 운영한다. ㅇ 정례브리핑은 월 2회 실시하며, 국무조정실과 국토교통부가 교대로 진행 한다. 착공･분양･입주 등 주택공급 단계별 추진상황 과 향후 일정 을 지속적 으로 공개해 주택공급에 대한 예측 가능성 을 높이고, 국민의 주거 계획 수립 에 도움이 되는 정보를 제공할 계획이다. □ 아울러, 국민이 필요한 공급 정보 를 한 번에, 한눈에 확인 할 수 있도록 ｢ 디지털 주택공급 상황판｣을 구축 하여 공급계획 과 실적 뿐만 아니라 정책 소식, 분양 및 임대 계획 등 관련 정보들을 통합 제공할 예정이다. 2. 수도권 9.9만호 착공…연말까지 21.8~23.5만호 이상으로 전망됩니다. □ 제1차 ｢주택공급 정책 브리프｣에서는 계획이 아닌 실제 착공･분양 등 국민이 체감 할 수 있는 공급 성과와 향후 전망 을 중점적으로 공개하였다. ㅇ 정부는 5년간 (’26~’30) 수도권 에서 역대 정부 최대 수준인 150만호 이상 착공 을 추진하고 있으며, 올해 는 공공주택 6.2만호 를 포함해 총 26.8만호 착공 을 목표로 하고 있다. ㅇ 10월 둘째 주 까지 실적을 점검한 결과, 수도권에서 9.9만호 이상이 착공 되었으며, 구체적으로 고양창릉, 인천계양, 하남교산 등 3기 신도시 7.3천호 를 포함한 공공주택 1.62만호 , 신축매입 1.3만호, 흑석11구역･중계본동･신림2 등 민간정비사업 1.7만호 가 착공되었다. ㅇ 정부는 남은 착공 예정 물량의 공정을 차질 없이 관리하여 연말까지 수도권 에서 21.8~23.5만호 이상이 착공 될 것으로 전망하고 있다. □ 착공에 그치지 않고, 국민이 체감 하는 분양･임대 공급 에도 속도 를 낸다. ㅇ 연말까지 1.5만호 이상의 주택 에 대해 입주자를 모집 할 계획이다. 공공분양은 3기 신도시 약 2천호를 포함한 1.0만호를 분양 공고 하고, 공공 임대는 과천지식정보타운 1.4천호 등 5천호 이상 의 입주자를 모집한다. 3. 주택공급 현장의 걸림돌을 풀어 공급 속도를 높이고 있습니다. □ 정부는 지난 8월 13일 ｢주택 신속공급 방안｣ (이하 ‘8.13대책’) 발표 직후부터 국무총리 를 중심으로 범부처 점검체계를 가동하여 8.13대책 후속 조치 와 주요 공급사업의 추진상황 및 지연요인 을 밀착 관리하고 있다. * 총리 주재 ｢ 범부처 주택 신속공급 점검회의｣ 출범 (‘26.8.14) → 현재까지 총 3회 개최 □ 특히, 국무총리 가 공공택지, 민간재개발, 신축매입 등 주택공급 현장 을 여섯 차례 방문 해 사업 추진상황을 직접 점검 하고, 관계부처･유관기관 이 함께 사업별 애로요인 을 해소하기 위해 노력 중이다. ㅇ 금융위원회와 금융감독원은 주거용 PF 사업장 300여 개 에 대해 밀착관리 담당자 를 지정 하여 맞춤형 지원 을 추진하고 있다. ㅇ 아울러, 연내에 국토교통부 와 금융당국 의 주택공급 현장 애로 해소 기능 을 ｢ 통합 주택공급 지원센터｣ 로 일원화하여 인허가 지연 등 공급 현장의 어려움을 신속히 해결 해 나갈 계획이다. □ 한편, 주택공급 물량과 속도 를 늘리기 위한 제도개선 도 신속히 추진 중이다. 8.13대책의 세부 추진과제 145건 중 48건을 완료 했으며 나머지 과제들도 계획된 일정에 따라 차질 없이 추진할 계획이다. 주요 완료 과제  (공급대책) ’27~‘28년 착공사업장 개발부담금 한시감면 (개발이익환수법안, 9.9), 건축물 용도전환 지원 (건축물 복합용도특별법, 9.16) 등 주요 법안 발의, LH 공공토지비축 매입 공모 (9.8) 등 추진  (금융대책) 금융애로 해소센터 운영, 주거사업장 보증비율 100%로 확대, 이주비대출 등 총량관리 예외인정, 주택매매·임대사업자 금융지원 강화, 보증제도( 준주택 보증요건 등) 개선 등 4. 전월세시장 안정을 위해 입주물량 확대와 주거 안전망 강화도 병행합니다. □ 국토교통부는 전월세 시장 안정 을 위해 단기 공급 을 확대 하는 한편, 주거안전망을 강화 해 나갈 계획이다. ㅇ 그간 주택사업자에 대한 HUG 보증규모 확대, 도시형생활주택 건축·주차 기준 완화 , 다세대·다가구 건축면적 제한 완화 등 단기 공급을 촉진하기 위한 다양한 정책을 추진해 왔다. ㅇ 올해 1~8월 서울 주택 의 인허가는 4만호 , 착공은 2.1만호 로 전 년 동기 대비 각각 40%, 41% 증가 했다. 정부는 이러한 회복세가 실제 입주 물량 확대 로 이어지도록 주요 추진과제를 차질없이 이행할 계획이다. □ 우선 단기 공급 확대 를 위해 올해 4분기부터 내년 말 까지 수도권 공적주택 약 10만 호 의 입주 를 추진한다. 특히 올해 12월 인천계양 을 시작으로 3기 신도시 입주 를 속도감 있게 진행할 예정이다. □ 촘촘한 주거 안전망 을 구축하기 위해 우수 입지에서 부담 가능한 가격으로 장기간 안정적으로 거주 가능한 보편형 공공임대주택 을 신설하고 , 20년 장기 민간임대주택 도입 도 본격 추진한다. ㅇ 또한 수요자별 맞춤형 지원 도 확대할 계획이다. 내년부터 청년월세 지원 에 대한 소득기준 을 완화 하고, 기존 전세임대 대비 지원한도 등이 완화된 청년 보편형 전세임대 를 신설 한다. 신혼부부 에 대해서는 공공임대 입주 소득요건 을 완화 하고, 고령자 에 대해서는 고령자복지주택 연 3.5천호 를 공급할 계획이다. 5. 계획보다 실행, 발표보다 성과로 보여드리겠습니다. □ 정부는 앞으로도 주택공급 대책이 실제 착공-분양-입주 로 이어질 수 있도록 사업별 추진상황 을 관리하고, 그 과정과 성과 를 정례브리핑을 통해 국민께 지속적 으로 공유할 계획이다. ㅇ 김용수 국무조정실 국무2차장은 “주택공급은 계획을 발표하는 데 그치지 않고 국민께 약속한 물량을 실제 공급 하는 것이 중요하다”면서, “ 관계부처, 지방정부, 공공 기관 이 원팀이 되어 현장의 걸림돌 을 신속히 해소하고, 주요 사업이 계획된 일정대로 추진될 수 있도록 범정부적 역량 을 집중 하겠다”고 밝혔다. ㅇ 김이탁 국토교통부 제1차관은 “국민께 중요한 것은 ’ 내 집이 어디에, 언제 나오는지 ‘를 구체적으로 알 수 있는 것”이라면서, “앞으로 구체적인 공급 일정과 상황을 지속적으로 공개하고, 국민이 원하는 곳 에 양질의 주택 을 신속히 공급 하는 것을 성과로 보여드리겠다”고 밝혔다. 별첨 1. ｢제1차 주택공급 정책 브리프｣ 별첨 2. ｢전월세시장 안정과제 추진상황｣", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "‘무기한 선물’ 이용자 유의사항 안내  - 최근 글로벌 가상자산플랫폼 등에서 거래되는 ‘무기한 선물’은 국내법의 투자자 보호가 적용되지 않아 각별한 주의 필요", "department": "가상자산과", "date": "2026-10-16", "url": "https://www.fsc.go.kr/no010101/87947", "summary": "‘무기한 선물’ 이용자 유의사항 안내 - 최근 글로벌 가상자산플랫폼 등에서 거래되는 ‘무기한 선물’은 국내법의 투자자 보호 가 적용 되지 않아 각별한 주의 필요 -  超 高레버리지 로 기초자산 가격의 소폭 변동에도 투자금 전액 손실 위험  국내법상 투자자 보호가 적용되지 않아, 사고·분쟁시 법적 구제 불가  역외 플랫폼의 국내 불법영업 적발시 수사기관 고발 등 엄중 조치 예정 I. 개요 최근 해외 가상자산거래소 등 역외 플랫폼에서 주식, 가상자산 등에 기초한 ‘무기한 선물(Perpetual Futures)’ 상품이 출시‧거래되고 있습니다. 이러한 상품에 대한 투자는 레버리지 수준, 투자자 보호 장치 여부 등을 고려할 때 국내 투자자의 상당한 주의 가 요구됩니다. 무기한 선물은 국내 제도권에서 거래되는 파생상품인 ‘선물(Futures)’과 유사한 명칭을 사용하고 있으나, 전통적 파생상품과는 계약조건 등 구조가 상이하며, 지나치게 높은 수준의 高레버리지(10~200배) 구조로 인해 기초자산의 일상적인 작은 가격 변동에도 거액의 손실이 발생 할 수 있으며, 국내법상의 투자자 보호도 받을 수 없 습니다. 일반 투자자는 해외 가상자산거래소에서 거래되는 무기한 선물이 이와 같은 초고위험 상품 이라는 점을 충분히 인식 하고 각별히 유의 하여야 합니다. II. 주요 유의사항 [ ❶ 전통적인 파생상품과 성격이 매우 상이합니다. ] 현재 역외 플랫폼에서 거래되는 ‘무기한 선물(Perpetual Futures)’은 일반적인 선물과 달리, ① 만기가 없고, ② 미래의 특정 시점에 금전 등의 인도를 전제로 하지 않으며, ③ 24시간 연중무휴 거래되는 등 계약조건, 거래 및 결제구조 등이 전통적인 파생상품과 다릅 니다. 많은 국가에서 이러한 상품에 대한 감독당국의 규율체계가 아직 확립되지 않았으며, 서비스를 제한하고 있습니다. 따라서 ‘선물(Futures)’이라는 명칭만으로 국내 증권시장 등에서 거래되는 것과 동일·유사한 금융투자상품이라고 오인하여서는 안 됩 니다. [ ❷ 과도한 레버리지로 인해 매우 높은 투자 위험이 수반됩니다. ] 현재 주로 거래되고 있는 ‘무기한 선물’ 은 기초자산(한국 주가지수 등)의 가격 변동성 의 10배 에서 많게는 최대 200배까지 연동 되어 있어, 기초자산의 가격 이 투자자의 포지션과 반대 방향 으로 소폭 만 움직여도 대규모 투자손실이 빠르게 일어날 수 있습니다. 특히, 레버리지 배율이 클수록 손실 발생의 속도와 크기가 커져, 추가 증거금 을 납부할 겨를도 없이 강제 청산 * 되어 순식간에 투자금 전액 을 잃을 수 있다는 점 을 각별히 유의하여야 합니다. 이와 같은 투기적 특성 으로 인해 국내에서는 이러한 상품이 제도적 으로 허용되고 있지 않다는 점 도 유념하시기 바랍니다. * (예) 한국 주가지수에 150배 연동된 구조의 경우, 주가지수가 장중 약 0.66% 만 역방향 으로 움직여도 투자금 전액이 강제 청산 될 수 있음 [ ❸ 국내 금융시장의 투자자 보호 장치가 적용되기 어렵습니다. ] 국내 금융시장 에서 거래되는 파생상품은 자본시장법 등에 따라 사업자 자격에 대한 각종 진입 규제, 투자자 보호 체계 * 등이 적용되는 반면, * ( 예) 장내 파생상품시장에서 일반 개인투자자가 선물·옵션 등을 거래하려면 일정 수준의 기본예탁금 보유, 사전교육·모의거래 실시 등 투자자 보호를 위한 요건 충족 필요 역 외 가상자산 플랫폼 사업자 는 현재 대부분 국내법상 규율체계가 적용 되지 않고 있어 , 이들을 통한 거래시 국내 제도권 금융거래와 동일‧유사한 수준의 투자자 보호 조치 가 적용되기 어렵습니다. 특히, 역외 플랫폼 사업자의 파산·영업중단 , 일방적인 거래 중단 , 각종 전산‧금융 사고 및 분쟁 발생 시 국내법에 따른 법적 해결 및 구제 절차 의 적용이 어렵고 , 고객의 예치자산 이 적절하게 보호‧보관 되고 있는지에 대해 감독당국이 확인하기 어렵다 는 점 등도 충분히 인지하여야 합니다. III. 향후 계획 금융당국 은 역외 플랫폼 사업자의 한국 주식시장 과 연동된 상품 출시 현황 및 국내 시장 에 미치는 영향 등을 면밀히 모니터링 하는 한편, 역외 플랫폼 사업자의 국내 불법 영업행위 * 가 발견 되는 경우 수사기관 고발 등 단호하게 대응 해 나갈 계획입니다. * 추천 코드 등을 통해 신규 가입을 유도하거나 수수료를 받는 등 한국 거주자를 대상으로 거래 권유 등 영업을 하거나, 관련 역외 상품이 국내 주식시장에 영향을 미치는 경우 등 또한, 현재 국내 시장 관련 무기한선물 거 한 뒤, 1차 사업 으로 7개 지자체 와 협력해 소상공인 등 지역 취약계층 을 위한 무료 상생보험 을 올해 9월부터 제공하고 있다. 이번 사업은 그 후속 과제로, 지원 대상을 돌봄과 보장이 절실한 취약 시니어 로 넓혔다. 이날 협약식에는 이억원 금융위원장 , 정은경 보건복지부 장관 을 비롯해 생명보험협회장, 손해보헙협회장, 한국취약노인지원재단 이사장, 독거노인종합지원센터장, 삼성생명, 교보생명, 현대해상, KB손해보험 대표가 참석하였다. 이억원 금융위원장 은 모두 발언에서 보험 은 단순한 금융상품을 넘어 우리 사회를 지탱하는 중요한 안전망 이지만, 정작 보호가 가장 절실 한 분들 중에는 보험의 혜택을 누리지 못하는 경우가 많다고 하면서, 이번 사업은 금융 만으로 닿기 어려웠던 곳에 복지의 현장망 을 통해 다가가고, 복지 만으로는 감당하기 어려웠던 위험을 보험의 보장 으로 채워 사회안전망 을 더욱 촘촘하고 세 심하게 만드는 의미가 있다고 말했다. 아울러, 보험산업의 경쟁력 은 새로운 상품을 개발 하는 데서도 나오지만, 국민이 어려울 때 얼마나 든든하게 곁을 지켜주는가 에서도 나온다고 언급하면서, 보험이 가장 필요한 순간, 가장 필요한 곳 에서 제 역할 을 할 때 보험에 대한 국민의 신뢰도 가 높아질 수 있다고 하였다. 또한, 상생기금 과 같은 금융권의 포용노력 이 더 큰 효과 를 낼 수 있도록 금융과 복지의 정책 협력체계 로 적극 뒷받침 하겠다고 밝혔다. 정은경 장관 은 인사말씀에서 홀로 사시는 어르신이 늘어나는 상황에서 돌봄과 건강관리는 정부만의 힘으로는 충분하지 않다며 , 보험업권의 상생 노력이 노인맞춤돌봄서비스 등 공적 돌봄과 연계 하여 취약 어르신들의 건강한 노후를 든든하게 뒷받침 하기를 기대한다고 밝혔다. \u003c 취약 시니어 통합지원을 위한 업무협약식(MOU) 개요 > ▪ (일시 / 장소) ‘26.10.19(월) 14:00, 생명보험교육문화센터 ▪ (참석) - (정 부) 금융위원회 위원장, 보건복지부 장관 - (수행기관) 한국취약노인지원재단 이사장, 독거노인종합지원센터장 - (보험업권) 생명보험협회, 손해보험협회, 삼성생명, 교보생명, 현대해상, KB손해보험 2. 사업내용 및 향후계획 시니어 취약계층 통합지원사업 은 노인맞춤돌봄서비스 연계사업 과 무료 치매배상책임보험 으로 구성된다. 보험업권은 복지부의 노인맞춤돌봄서비스 * 와 연계하여, 취약 어르신 총 57만명 을 대상으로 낙상사고 치료비 지원 , 보이스피싱 예방 등 맞춤형 금융교육 , 건강상담·복약안내 등 헬스케어 , 건강관리 프로그램 등 다양한 지원을 제공한다. 사업운영 은 복지부 위탁업무 수행기관인 독거노인종합지원센터 가 맡게 된다. 아울러 사업효과를 높이기 위해 지원 필요성이 높은 어르신에게 더 많은 지원이 돌아가도록 지원수준을 설정할 방침이며, 보험업권-수행기관 간 협의를 통해 4분기 중 세부 사업내용을 확정 할 예정이다. * 노인맞춤돌봄서비스: 65세 이상 기초생활수급자, 차상위계층 또는 기초연금수급자 중 독거·조손가구 등 돌봄이 필요한 노인에게 방문·전화등을 통한 안부확인, 자조모임 구성 , 이동지원, 식사·청소 등 가사지원, 신체·정신건강 향상 지원 등 맞춤형 돌봄서비스 제공 우선, 노인맞춤돌봄서비스 지원대상 어르신에게 타박·염좌·골절 등 낙상사고 가 발생한 경우 치료·회복비 를 신체손상 정도에 따라 차등 지원한다(25억 원). 고령자는 고관절 골절 시 평균 수명까지 단축될 수 있는 만큼, 초기 치료를 적기에 뒷받침 해 신체기능 저하를 막는데 중점을 두었다. 어르신이 병·의원에서 치료를 받은 후 진단서와 영수증을 발급받아 독거노인지원센터에 비용지급 을 신청하거나, 담당 생활지원사가 대신 신청할 수도 있다. 다음으로, 보이스피싱 피해자 중 시니어 비중이 높다는 점을 감안하여 취약 시니어를 대상으로 보이스피싱 예방, 모바일뱅킹 이용법 등 맞춤형 금융교육 을 제공한다(4억 원). 생활지원사가 경찰청 교육자료 등을 활용하여 어르신을 대상으로 대면 교육을 제공할 방침이다. 헬스케어 등 비금융 서비스 도 제공한다(39억 원). 취약 어르신의 일상 건강관리 를 위해 대학병원 경력 5년 이상의 간호사 등 의료진이 전화로 건강상담과 건강검진 결과 분석 등을 제공하고, 복약안내 와 고혈압·당뇨 등 만성질환 맞춤 식단 추천 등 관리가이드 를 지원한다. 또한, 어르신이 적기에 치료를 받을 수 있도록 증상에 맞는 전문병원·의료진을 안내 하고 진료예약을 대행 할 예정이다. 진료 이후에는 전문간호사의 1:1 코칭콜 과 치료후 회복을 위한 영양관리 등 사후관리까지 제공한다. 서비스는 노인맞춤돌봄서비스 지원대상 어르신이나 담당 생활지원사가 사업 수행 업체(4분기중 선정 예정)가 운영하는 센터에 헬스케어 서비스를 신청하여 이용할 수 있게 할 예정이다. 아울러 고립과 우울을 겪는 어르신 대상으로 맞춤 건강관리 프로그램을 운영 한다(15억 원). 노인맞춤돌봄서비스 지원대상 어르신을 대상으로 몸 건강·마음건강 진단검사 를 실시하고, 진단검사 결과 집중지원 이 필요한 어르신을 선별하여 온라인·오프라인 교구 등을 활용한 우울 예방, 신체건강 증진 등의 프로그램을 제공한다. 통합지원 프로그램에 적극 동참한 우수 참여자 (생활지원사, 어르신)에게는 별도 리워드 를 지급하여 서비스 이용과 참여를 독려할 예정이다(2억 원). 이에 더해, 치매환자 중 취약계층 에 대해 무료 치매배상책임보험을 제공한다(20억 원). 무료 치매배상책임보험은 치매 어르신 이 의도치 않게 제3자에게 신체의 상해 또는 재물의 손해 를 입혔을 때, 그 피해 를 보상 한다. 지원대상 선별과 사업운영은 한국취약노인지원재단 이 맡는다. 재단은 치매 환자로 등록 된 어르신 중 소득수준 등을 감안하여 약 8만명을 지원대상자 로 선정할 계획이다. 4분기 중 사업 수행 보험사를 선정하고 상품을 출시할 예정이다. 사업 수행 보험사는 이후 전용 콜센터 를 마련 하여 치매환자의 가족·보호자 등이 보험금 지급 신청 등을 할 수 있도록 할 계획이다.(추후 안내 예정) 노인맞춤돌봄서비스 연계 사업과 치매노인 대상 무료보험 사업은 모두 올해 4분기 중 세부 사업계획 을 수립 하고 사업 수행 업체를 선정 한 뒤, ‘27년부터 ‘28년까지 2년간 사업을 시행한다. 특히, 시행 초기 상담 등이 한꺼번에 몰려 서비스가 지연되지 않도록, 지역별로 사업 수행 보험사를 나누어 세심하게 운영할 계획이다. 각 기관 은 이번 협약을 계기로 사업이 차질없이 시행 되도록 긴말히 협력해 나가기로 하였다. 이번 협약에 따라 보험업권 은 상생기금 96억원을 사업재원으로 지원 하고, 수행기관 은 각자의 역할에 따라 사업을 운영·추진 한다. 금융위원회 는 보험업권의 상생노력이 현장에 뿌리내릴 수 있도록 사업추진을 뒷받침하고, 보건복지부 는 노인맞춤돌봄서비스 등 돌봄 전달체계를 연계하여 취약 어르신께 필요한 지원이 빠짐없이 닿도록 할 방침이다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "표준 기술평가모델 고도화 및 전문평가 운영체계 개편 설명회 개최", "department": "", "date": "2026-10-19", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015839", "summary": "첨부 참조", "essential": false, "importanceReasons": ["event / ceremony (-2)", "statistics / advice (-2)"], "market": true, "tier": "routine"}, {"source": "FSC", "title": " 청년미래적금,  2차 가입 신청자 68.8만명 - 10.12~11.13일 가입심사, 11.16일부터 계좌개설 시작", "department": "청년정책과", "date": "2026-10-19", "url": "https://www.fsc.go.kr/no0  적립금 종류별로 인출순서 및 과세 기준이 다르게 적용되므로 원천징수 세액에 따라 수령 연금이 달라질 수 있습니다.\n④ 연금저축계좌 계좌이체 신청 시 계좌이체가 제한될 수 있으므로, 계좌이체 전 제한 사유를 확인해 보시기 바랍니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "초국가범죄 범정부 대응 1년, “국경 넘어 끝까지 추적”… 기관 간 공조 강화로 초국가범죄 대응의 틀 바꿨다", "department": "금융정보분석원 기획행정실", "date": "2026-10-21", "url": "https://www.fsc.go.kr/no010101/87969", "summary": "초국가범죄 범정부 대응 1년, “국경 넘어 끝까지 추적”… 기관 간 공조 강화로 초국가범죄 대응의 틀 바꿨다 - 우리 대학생 사망사건 주범 검거 및 동남아 범죄거점 원점 타격·역대 최대 73명 단체송환 등 해외 법 집행력 대폭 강화 - 이재명 대통령 지시로 범정부 컨트롤타워 출범… 부처 간 장벽 허문 ‘원팀 대응’ 정착 - 대통령 정상외교까지 가동… 10년 가까이 풀지 못했던 박왕열 국내 송환 성사 - ’26년 동남아 검거 2.5배, 도피사범 송환 2.6배 증가… 캄보디아 스캠 관련 납치·감금 등 피해신고 95.1% 감소 - “어디에 숨어 있든 끝까지 추적해 반드시 법의 심판을 받게 할 것” 10월 23일은 정부가 국경을 넘나들며 우리 국민의 생명과 재산을 위협 하는 초국가범죄에 범정부 차원의 본격 대응을 시작한 지 1년이 되는 날이다. 지난해 캄보디아에서 우리 국민을 대상으로 한 납치·감금과 스캠 범죄 등이 심각한 사회문제로 대두되자, 2025년 10월 23일 이재명 대통령은 관계장관 회의를 통해 수사·외교·사법·금융 등 국가 역량을 하나로 결집하여 총력 대응을 지시하였다. 이후 스캠·마약·사이버범죄 등 초국가범죄에 체계적으로 대응하기 위해 범정부 컨트롤타워인「초국가범죄 특별대응TF」가 2025년 12월 29일 출범 하였다. 현재 외교부·법무부·금융위·방미통위·국정원·공소청·경찰청·국세청·관세청·KISA 등 10개 기관이 참여하고 있다. 지난 1년간 정부는 TF를 중심으로 기관 간 공조를 강화하여 해외 범죄거점을 직접 타격하고 핵심 조직원과 도피사범을 검거·송환하는 것에 주력하였다. 특히 장기간 해결하지 못했던 해외 도피사범 문제에 대해서는 대통령의 정상 외교까지 범정부 대응에 결합함으로써 정부 전체가 하나의 팀으로 움직이는 초국가범죄 대응체계를 구축했다. 그 결과 동남아 지역 범죄자 검거와 해외 도피사범 송환이 크게 증가했으며, 스캠 범죄의 피해 발생 건수와 피해액도 감소하는 등 국민이 체감할 수 있는 실질적인 범죄 억제 성과가 나타나고 있다. ■ 대통령 지시로 시작된 범정부 대응… 초국가범죄 대응 패러다임 전환 시작은 “국민의 생명과 안전을 지키는 데 국가가 모든 역량을 동원해야 한다”는 대통령의 강력한 의지였다. 2025년 캄보디아에서 한국인 대학생 납치·살해 사건이 발생하는 등 우리 국민에 대한 납치·감금과 스캠 범죄 등이 잇따르자, 같은 해 10월 11일 이재명 대통령은 우리 국민 보호에 총력을 기울일 것을 지시하였다. 이후 10월 18일 캄보디아 내 스캠 범죄조직 가담 피의자 64명을 전세기로 강제송환하였고, 11월에는 캄보디아 현지에 한국-캄보디아 경찰 합동 근무 체계인 ‘코리아전담반’을 설치하였으며, 11월 27일에는 한국인 대학생 납치 ·살해 사건의 주범인 중국인 리광호가 전격 검거되었다. 이와 같은 경험을 바탕으로, 스캠범죄를 포함하여 마약·사이버도박 등 초국가범죄에 보다 더 체계적으로 대응하기 위해 12월 29일 범정부 「초국가 범죄 특별대응TF」가 본격 출범하였다. 이는 해외에서 발생한 사건을 개별 부처가 각각 처리하던 방식에서 벗어나 수사·외교·사법·금융 등 국가 역량을 하나로 결집해 대응하는 체계로의 전환 이었다. 이 대통령은 TF 출범 이후에도 직접 현장을 챙겼다. 올해 1월 26일 TF 사무실을 방문해 캄보디아 현지 검거와 역대 최대 규모 국내 송환 과정 등을 보고받고, 부처 간 벽을 허문 유기적 공조체계의 중요성을 강조했다. ■ 역대 최대 73명 단체송환… 해외 범죄거점 ‘원점 타격’ 범정부 대응체계 구축 이후 가장 두드러진 변화는 국내에서 개별 사건을 사후 수사하는 데 그치지 않고 범죄가 발생하는 해외 거점을 현지에서 직접 타격하는 적극적 대응으로 전환했다는 점이다. 정부는 캄보디아 등 동남아 현지 당국과 긴밀히 공조해 우리 국민을 상대로 범죄를 저질러 온 스캠 조직을 집중 단속했다. 그 결과 올해 1월 23일 우리 국민 869명을 대상으로 약 486억 원을 편취한 혐의 등을 받는 피의자 73명을 역대 최대 규모로 단체송환했다. 이는 해외에 범죄거점을 구축하면 대한민국의 법망을 피할 수 있다는 범죄조직의 인식을 깨뜨리고, 국경 밖에서 우리 국민을 상대로 범죄를 저지르더라도 끝까지 추적한다는 정부의 원칙을 행동으로 보여준 사례다. ■ 10년 가까이 풀지 못한 박왕열 송환… 대통령 정상외교가 마지막 문 열었다 범정부 공조의 상징적인 성과 중 하나는 장기간 해결되지 않았던 박왕열 국내 송환이다. 필리핀에 수감 중이던 박왕열은 국내 마약 유통 등에 관여한 혐의를 받아왔으나, 정부가 지속적으로 송환을 추진했음에도 약 10여 년간 국내 송환이 성사되지 못한 장기 현안이었다. 정부는 TF 출범 이후 박왕열 송환을 주요 현안으로 관리하며 외교부·법무부·국정원·경찰청 등 관계기관 간 공조를 대폭 강화했다. 여기에 이재명 대통령이 지난 3월 필리핀을 방문해 페르디난드 마르코스 대통령과 가진 정상회담에서 박왕열의 국내 인도를 직접 요청하면서 정상회담 약 3주 만인 3월 25일 박왕열의 국내 송환이 성사됐다. 이는 수사기관의 끈질긴 추적과 관계 부처의 국제공조에 대통령의 정상 외교가 더해져 역대 정부가 풀지 못했던 난제를 해결한 범정부 협업의 대표 적인 사례이다. 정부는 박왕열을 국내로 송환하는 데 그치지 않고 박왕열 수사과정에서 단서를 확보하여 태국 현지에서 마약공급책 최병민을 추가로 검거·송환하는 등 관련 마약 유통조직의 실체를 철저히 규명하기 위한 노력을 계속하고 있다. ■ UAE 도피 총책 검거·송환… 조직의 ‘머리’까지 겨냥 정부는 단순 가담자뿐 아니라 해외에서 범죄조직을 실질적으로 지휘하는 총책과 핵심 인물을 검거하는 ‘조직 와해형 수사’에도 역량을 집중했다. 그 결과 10조 원 규모 불법 도박사이트 조직의 총책을 UAE 당국과의 국제공조를 통해 현지에서 검거하고 지난 7월 4일 국내로 송환하였고, 또다른 3조원대 불법 도박사이트 총책급 핵심 조직원을 검거하여 10월 14일 송환 하였다. 정부는 앞으로도 범죄조직의 말단 구성원 검거에 머무르지 않고 해외에 숨어 범죄를 기획·지휘하는 조직의 ‘머리’까지 추적·검거해 범죄조직 자체를 와해한다는 방침이다. ■ 캄보디아 피해 카자흐스탄으로 옮겨도 추적… ‘풍선효과’ 차단 범죄조직이 단속을 피해 국가와 거점을 옮기는 이른바 ‘풍선효과’에도 적극적으로 대응했다. 정부는 캄보디아 단속 이후 카자흐스탄에 새로운 거점을 구축한 한국인 스캠 조직을 현지 당국과 공조하여 추적했으며, 지난 7월 23일 조직원 14명을 검거해 국내로 송환했다. 이는 특정 국가에 대한 일회성 단속을 넘어 범죄조직이 어디로 이동하더라도 새로운 거점을 다시 찾아내 원점에서 타격하는 상시 대응체계가 작동하고 있음을 보여준다. ■ 검거 2.5배·송환 2.6배… 실질적인 ‘국민 피해 감소’ 범정부 총력 대응의 성과는 구체적인 수치에서도 확인되고 있다. 2026년 1~9월 동남아 지역 검거 인원은 834명으로 전년 동기 340명 대비 2.5배 증가했으며, 도피사범 송환도 254명에서 655명으로 2.6배 증가했다. 무엇보다 중요한 것은 이러한 법 집행 강화가 국민이 체감하는 실질적인 범죄 피해 감소로 이어지고 있다는 점이다. 캄보디아 스캠 관련 납치·감금 등 피해신고는 386건에서 19건으로 95.1% 급감했다. 또한 보이스피싱 피해 발생 건수는 1만 8,746건에서 9,333건으로 50.2%, 피해액은 9,867억 원에서 4,196억 원으로 57.5% 감소했다. 또한 해외에서 유입되는 마약을 차단하기 위해 5개 우편집중국에 2차 저지선을 구축하는 등 관계부처 간 유기적 공조를 펼친 결과 1~9월 총 1,339kg의 마약을 적발했으며, 이는 국내 반입 목적의 적발 건만을 고려할 경우 전년 동기 대비 104% 증가한 수치로 역대 최대 실적에 해당한다. 이러한 변화는 해외 범죄거점에 대한 원점 단속, 핵심 조직원 검거·송환, 국제공조 강화 등 범정부 집중 대응이 실제 범죄 억제와 국민 피해 감소로 이어지고 있음을 보여주는 결과라고 할 수 있다. ■ “어느 나라에 숨든 끝까지”… 이제는 초국가범죄 기반 원천 무력화로 정부는 초국가범죄 대응 1주년을 계기로 지금까지 구축한 범정부 협업체계를 더욱 공고히 하고 초국가범죄 대응 강도를 한층 높일 방침이다. 특히 ① 해외 범죄거점 원점 타격, ② 총책·핵심 조직원 검거 및 신속 송환, ③ 범죄수익 추적·동결·환수, ④ 피해자 구조·보호, ⑤ 주요국과의 국제공조 강화를 유기적으로 연계해 범죄조직의 인적·물적 기반 자체를 무력화해 나갈 계획이다. 또한, 초국가범죄 억제·예방을 위한 법·제도 정비도 계속 해나갈 것이다. 지난 6월부터 시행한 금융위의 ‘신종피싱 의심계좌 거래정지 제도’ 시행으로 범죄자금의 흐름이 조기 차단되는 긍정적 효과가 나타나고 있고, 8월 법무부의 ‘독립몰수제’ 관련 법률이 국회를 통과하면서 범인이 사망하거나 해외로 도피하더라도 범죄수익을 몰수·추징할 수 있는 기반이 마련되었다. 이재명 대통령은 TF를 직접 방문한 자리에서 초국가범죄가 국민의 삶을 파괴하고 갈수록 지능화하고 있다며 더욱 엄정한 대응을 주문하는 한편, “한국인을 건드리면 패가망신한다”는 사실을 동남아 현지에도 적극 알릴 것을 지시한 바 있다. 정부는 이러한 원칙 아래 범죄자가 어느 나라에 숨어 있든 끝까지 추적하고, 대한민국 국민을 범죄의 표적으로 삼으면 반드시 대가를 치르게 한다는 메시지를 초국가범죄 조직에게 확실히 각인시킨다는 방침이다. 정부 관계자는 “지난 1년은 부처별로 흩어져 있던 역량을 하나로 모아 대한민국의 초국가범죄 대응방식을 근본적으로 바꾼 시간이었다”며, “대통령의 강력한 의지와 관계기관의 유기적인 공조를 바탕으로, 국민의 생명과 재산을 위협하는 초국가범죄가 근절될 때까지 정부의 모든 역량을 결집하겠다”고 밝혔다.", "essential": false, "importanceReasons": ["strong keyword in body text (+1)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "군 장병의 경제관 확립과 금융역량 향상을 위해 국방(부)과 금융(위)이 손을 맞잡다", "department": "금융교육국", "date": "2026-10-21", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=243107&menuNo=200218&pageIndex=1", "summary": "□ 국방부는 금융위원회와 함께 장병 금융역량 제고를 위한 ‘장병금융워크숍’을 2026년 10월 21일부터 10월 22일까지 하나 글로벌 캠퍼스(청라)에서 개최합니다.\nㅇ 이번 워크숍은 2026년 제2차 금융교육협의회(8.31.)에서 의결한 「군장병 금융교육 강화 방안」 후속조치의 일환으로 군내 재정담당자 등이 금융교육 강사로서 활동을 지원하기 위해 추진\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "군 장병의 경제관 확립과 금융역량 향상을 위해 국방부과 금융위이 손을 맞잡다!", "department": "금융소비자정책과", "date": "2026-10-21", "url": "https://www.fsc.go.kr/no010101/87972", "summary": "군 장병의 경제관 확립과 금융역량 향상을 위해 국방 부 과 금융 위 이 손을 맞잡다! - 국방부·금융위원회, 장병의 올바른 경제관 확립과 금융위험에 능동적 대응을 위한 군 재정담당자 등의 금융교육 역량 강화 워크숍 개최 - 금융감독원‧서민금융진흥원‧신용회복위원회 및 7개 금융협회와 협업 아래 특화된 금융교육 프로그램 구성으로 전문적인 금융역량 강화 지원 □ 국방부 는 금융위원회 와 함께 장병 금융역량 제고를 위한 ‘ 장병금융워크숍 ’을 2026년 10월 21일부터 10월 22일까지 하나 글로벌 캠퍼스 (청라) 에서 개최 합니다. ◦ 이번 워크숍은 2026년 제2차 금융교육협의회 (8.31.) 에서 의결한 「군장병 금융교육 강화 방안」후속조치의 일환 으로 군내 재정담당자 등이 금융교육 강사로서 활동을 지원 하기 위해 추진되었으며, ◦ 워크숍에는 국군재정관리단, 국방시설본부 등 약 20여 개 국방부 직할부대 100여 명의 장병이 참석 합니다. □ 워크숍 기간 동안 금융감독원, 서민금융진흥원, 신용회복위원회 및 7개 금융협회*의 금융교육 전문강사 들은 ▴청년장병 생애주기별 자산관리, ▴보험의 이해와 노후준비‧재무설계, ▴금융 투자의 이해, ▴금융사기 예방, ▴금융상담 실무와 채무조정제도 등에 대한 최신 금융 동향과 사례를 알기 쉽게 설명 합니다. * 은행연합회, 금융투자협회, 생명보험협회, 손해보험협회, 여신금융협회, 저축은행중앙회, 신협중앙회 ◦ 또한, 재무상담 부스도 운영 하여 워크숍 참석자들에게 재무설계 등의 컨설팅 기회 도 제공합니다. □ 이번 워크숍을 주최한 국방부 양성태 계획예산관 은 “ 다양한 금융교육기관들과 협업 을 통해 장병들에게 양질의 금융교육을 제공 하여 올바른 경제관념을 확립 하는 등 장병 금융역량을 한층 더 높일 수 있는 계기 가 될 것”이라고 평가하였습니다 □ 한편, 금융위원회 김동환 금융소비자국장 은 “ 장병금융교육 이 청년세대의 건전한 금융의식 제고 에 중요한 역할을 하고 있음을 강조하면서 금융위원회를 중심으로 관계기관들이 장병금융교육 확대를 위해 지속적으로 노력 하겠다”고 밝혔습니다. □ 국방부 는 금번 장병금융교육 워크숍 참석자 들이 자신의 부대 내 장병들에 대한 금융교육 강사로 역할 을 할 것으로 기대하면서 향후 각군 및 해병대 등 에서도 다양한 금융교육기관들이 참여하는 교육이 개최 될 수 있도록 지원할 것입니다. \u003c끝>", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "아시아·태평양 경제협력체(APEC) 재무장관회의 참석 및 주요 인사 면담", "department": "국제경제과", "date": "2026.10.21.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079710&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "신용정보법 과징금 부과의 예측 가능성을 한층 높였습니다.  - ｢신용정보업감독규정｣ 개정안 제18차 정례 금융위원회 의결", "department": "금융데이터정책과", "date": "2026-10-21", "url": "https://www.fsc.go.kr/no010101/87973", "summary": "신용정보법 과징금 부과의 예측 가능성 을 한층 높였습니다. - ｢신용정보업감독규정｣ 개정안 제18차 정례 금융위원회 의결 - 위반 유형 및 중대성에 따라 과징금 산정기준을 구체화 하고 투명 하게 공개 10.23일 개정규정 시행 이후 부과되는 과징금부터 적용 Ⅰ. 추진경과 ’26.10.21.(수) 제18차 금융위원회 정례회의에서 ｢신용정보업감독규정｣ 일부규정개정안이 의결되었다. 동 개정안은 지난 9월 16일(수) 발표한 ｢ 신용 정보법 과징금 산정기준 개선 T/F ｣ ※ 에서 금융위원회, 금융감독원, 5 개 금 융협회와 공동 논의 를 거쳐 마련하였으며, ’26.10.23일(금)부터 시행된다 . ※ [참조 ] “신용정보법 과징금 산정기준 개선을 위한 T/F 회의 개최”(‘26.9.16일자 보도자료) ▷ 참석자 : 금융위 디지털금융정책관(주재), 금감원 은행연합회, 생명보험협회, 손해보험협회 , 여신금융협회, 금융투자협회 ▷ 주요 논의내용 : 신용정보법 과징금 산정기준 현황 및 문제점, 해외사례, 개편 방향 등 Ⅱ. 주요 개정사항 신용정보법 과징금 산정기준 근거를 ｢ 금융기관 검사 및 제재에 관한 규정 ｣ (이하 ‘검사·제재규정’) 별표 2(과징금 부과기준)에서 ｢ 신용정보업감독규정 ｣ 별 표 9(과징금 산정기준)로 변경하고, 신용정보법 특성 및 국내외 입법례 등을 고려하여 다음과 같이 구체화하였다. [ 부과기준율 세분화 ] 신용정보법 과징금은 신용정보법 시행령 별표 2의3(과징금 산정기준)에 따라 법정부과상한액 (원칙: 전체 매출액 의 3%)에 부과기준율 을 곱하여 기본과징금 을 산정한 후 사안별 특수성에 따른 가중·감경 사유 를 고려하여 기본과징금을 조 정 하고, 마지막으로 위반자의 현실적인 부담능력 등을 고려한 감액 또는 면제 여부 검토를 거쳐 최종 부과과징금 을 결정한다. 이 중 부과기준율 을 현행 검사·제재규정 에 따른 “중대성이 약한 위반(50%)”, “중대한 위반(75%)”, “매우 중대한 위반(100%)”의 경직적인 3단계 구조 에서 “중대성이 약한 위반(1~30%)”, “중대한 위반(30~65%)”, “매우 중대한 위반(65~100%)”의 연속적 체계 로 분산하여 위반행위의 중대성 에 비례하면서도 효과적인 위반행위 억제 가 가능토록 개선하였다. 이는 법정한도액이 큰 경우 부과기준율을 탄력적으로 규정하여 과징금 제재의 비례성 을 확보하고 있는 국내외 입법례 ※ 와도 부합한다. ※ [ 국내] 개인정보보호법 : 전체 매출액의 3% 한도 / 금융소비자보호법 : 수입등의 50% 한도 [ 국외] EU 일반개인정보보호법(GDPR) : 전 세계 전체 매출액의 2% 또는 4% 신용정보법의 일반법에 해당하는 개인정보보호법 의 경우 “ 전체 매출액 (非 관련 매출액 제외) ”에 직접 부과기준율 을 곱하여 기준금액 을 산정하고 있 으며 이 때 부과기준율 은 “약한 위반( 0.03~0.9% )”, “보통 위반( 0.9~1.5% )” , “중대한 위반( 1. 5~2.1% )”, “매우 중대한 위반( 2.1~2.7% )”으로 규정하고 있다. 또 한, 금융소비자법 도 신용정보법 부과기준율과 동일한 체계 를 따르고 있다. \u003c 개보법 부과기준율 현황 > 중대성 개보법 법정 부과 상한율 (3%) (A) 신정법 체계로 변환시 (C) 부과기준율 (B) = (A) × (C) 매우 중대 2.1% 이상 2.7% 이하 70% 이상 90% 이하 중대 1.5% 이상 2.1% 미만 50% 이상 70% 미만 보통 0.9% 이상 1.5% 미만 30% 이상 50% 미만 약한 0.03% 이상 0.9% 미만 1% 이상 30% 미만 ※ 법규상 개보법과 신정법 부과기준율이 다른 사유 : 개보법 은 전체 매출액 (非 관련 매 출액 제외)에 부과기준율 을 직접 곱 하는 반면, 신정법 은 법정상한액 (전체매출액×3%) 에 곱 하여 산정 개인정보보호를 엄격히 규율하는 EU 일반개인정보보호법 (GDPR)의 경우 에도 과징금 부과한도 를 “ 전 세계 전체 매출액 의 2% 또는 4% ”로 매우 높게 규 정하고 있으나, 과징금 산정 가이드라인에서는 부과기준율을 “낮은 수준 위반( 0~10%)”, “중간 수준 위반(10~20%)”, “높은 수준 위반(20~100%)”으로 유연 하게 규정하고 있다. \u003c 부과기준율 > 중대성 현행 (검사·제재규정) 개선안 (신용정보법 과징금 산정기준) 부과기준율 중대성 점수 부과기준율 중대성 점수 매우 중대 100% 2.3 이상 3.0 이하 65% 이상 100% 이하 2.3 이상 3.0 이하 중대 75% 1.6 이상 2.3 미만 30% 이상 65% 미만 1.6 이상 2.3 미만 약한 50% 1.0 이상 1.6 미만 1% 이상 30% 미만 1.0 이상 1.6 미만 [ 중대성 평가기준에 신용정보법 특성 반영 ] 각 위반행위에 대한 부과기준율은 중대성 점수 에 따라 정해지므로 위반행 위의 중대성을 객관적이고 공정하게 평가 할 수 있도록 중대성 평가기준 에 명시된 6개 항목 중 2개 항목 을 신용정보법 특성 에 맞게 변경하였다, 현행 검사·제재규정은 모든 업권의 위반행위 에 적용되는 특성상 중대성 평가를 위한 항목이 일반적인 요소 * 로 구성되어 있다. * ①위반행위 동기, ②위반행위 방법, ③부당이득 규모 , ④피해규모 , ⑤시장영향 , ⑥위반기간·횟수 이 중 “ 부당이득 규모 ”의 경우 개인신용정보 유출, 부당이용 및 제공 등에 따 른 신용정 보법 위반행위는 부당이득액을 구체적으로 산출하기 어려운 점을 감 안하여 “ 개인신용정보 유형 및 성격 ”으로 대체 하고 기본과징금 조정 사유에 반영 하였다. 또한 “ 피해규모 ”는 “정보주체 피해규모 및 영향 ”으로 명확히 하여 위반행위의 중대성을 보다 합리적으로 평가 할 수 있도록 하였다. [ 다양한 가중 및 감경 사유 신설 ] 동일한 위반행위를 반복하거나 대규모 신용정보 유출 등 사회적 영향이 큰 중대한 위반행위 에 대해서는 엄중한 과징금 제재 를 조치할 수 있도록 기 본과징금의 100%까지 가중 할 수 있도록 하였다. 이와 균형을 맞추어, 금융회사의 자율적인 개인신용정보 보호를 강화 하고 금융 소 비자 피해 발생 시 신속한 소비자 보호대책 마련 및 이행 등 적극적인 사 후수 습 노력 을 유도할 수 있도록 감경 사유 도 다양화하였다. [ 경과조치 ] 행정기본법 제14조 (법적용 기준)에 따라 개정 이전의 위반행위는 위반당시 검사·제재규정을 적용하되, 신용정보업감독규정 에 따른 과징금 산정이 유리 한 경우 에는 해당 규정을 적용 할 수 있도록 부칙 에 경과조치를 두었다. Ⅲ. 기대효과 금번 신용정보업감독규정 개정을 통해 과징금 부과기준 을 투명하게 공개 함으로써 앞으로 신용정보법 위반행위 발생시 과징금 제재 수준에 대한 예 측 가능성 이 크게 높아질 것 으로 예상하며, 위반행위의 중대성·시장영향 등에 상 응하는 합리적이고 비례적인 과징금 부과 가 가능할 것으로 기대한다. 신용정보법 과징금 부과 사례 ◈ (예시) 甲 금융회사 재무현황 : 전체 매출액 7조원 / 당기순이익 7,000억원 * * ‘25년 은행/생보사/카드사 등 대형 금융업권 매출액 대비 당기순이익 평균 10% 내외 수준 ▪ 【 사례1: 경미한 위반 (중대성 1.2점) 】 개정 前 (부과기준율 50%) 기본과징금 1,050억원 (당기순이익의 15%) → 개정 後 (부과기준율 10%) 기본과징금 210억원 (당기순이익의 3%) ▪ 【 사례2: 중대한 위반 (중대성 2.5점) 】 개정 前 (부과기준율 100%) 기본과징금 2,100억원 ( 당기순이익의 30%) → 개 정 後 조정과징금 (부과율 100%) 2,100억원 (1,575 (부과기준율 75%) +525 (가중 * 25%) ) * 3년내 동일 위반행위 반복, 1천만명 이상 피해 등은 100% 범위까지(법정부과상한내) 가중 가능", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "신용정보법 과징금 부과의 예측 가능성을 한층 높였습니다.", "department": "제재심의국", "date": "2026-10-21", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=243111& 회사 등의 외부감사에 관한 법률」 등에 따라 아래와 같이 과징금 부과를 의결 하였습니다. \u003c 조치대상자에 대한 최종 과징금 부과액 > 회사명 대상자 최종 과징금 부과액 해태제과식품㈜ 회사 937.8백만원 대표이사 등 4인 362.1백만원 ※ 감사인 지정 등 상기 과징금 외의 조치는 ‘26.9.16일 제16차 증권선물위원회에서 旣 의결 (붙임 참조)", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": " “보증금 기반 비대면 신용카드 발급 서비스” 등  혁신금융서비스 4건 신규 지정 의결  - 신규 혁신금융서비스 지정 4건 및 규제개선 요청 수용 1건 의결", "department": "디지털금융총괄과", "date": "2026-10-21", "url": "https://www.fsc.go.kr/no010101/87975", "summary": "“보증금 기반 비대면 신용카드 발급 서비스” 등 혁신금융서비스 4건 신규 지정 의결 - 신규 혁신금융서비스 지정 4건 및 규제개선 요청 수용 1건 의결 금융위원회 (위원장 이억원) 는 10월 21일 정례회의 를 통해 4건의 혁신금융서비스 를 신규 로 지정 하였다. 이로써 현재까지 총 1,168건 의 서비스가 혁신금융서비스로 지정되어 시장에서 혁신아이디어를 시험·검증 해 볼 수 있게 되었다. 이와 더불어, 기존에 지정된 혁신금융서비스 1건 에 대한 규제개선 요 청 을 수용하였다. 혁신금융서비스 의결 결과는 다음과 같다. (의결 결과 세부내용 ☞[참고]) 금융위원회는 신한카드 의 ‘ 보증금 (선불전자지급수단 활용) 기반 비대면 신용카드 발급 서비스 (1건) ’ 와 우리카드 의 ‘ 외국인 고객 보증금 기반 신용카드 발급 서비스 (1건) ’ 를 혁신금융서비스로 신규 지정하였다. 동 서비스는 청년·외국인 등 신용거래 이력 이 부족 한 고객 (Thin Filer) 에게 비대면 절차 를 통해 보증금 기반 신용카드 를 발급 해주는 서비스이다. 기존에는 신용거래이력이 부족한 고객이 신용카드를 발급받으려면 은행 영업점을 방문 하여 질권설정 등 복잡한 절차 를 거쳐 예금을 담보 로 제공해야 했다. 앞으로는 보증금을 활용 하여 신용카드를 발급받을 수 있어, 별도의 은행방문 없이 비대면으로 신용카드 발급 절차 를 진행할 수 있게 된다. 이를 통해 금융거래 편의성 을 높이고, 아직 충분한 신용도가 형성되지 않은 고객의 초기 신용거래이력 축적 을 지원 하여 제도권 금융상품 에 대한 접근성 을 개선 할 것으로 기대된다. 아울러 뱅크샐러드 의 ‘ 마이데이터를 활용한 저금리 대출 대리 조회 서비스 (1건) ’를 혁신금융서비스로 신규 지정하였다. 이에 따라 뱅크샐러드는 이용자로부터 대출상품 조건 조회 관련 업무권한 을 위임 받은 후, 이용자의 신용거래능력 에 긍정적인 영향 을 줄 수 있는 상황 (신용점수 상승, 소득 증가 등) 이 발생하였을 때 이용자를 대리하여 대출 가심사 를 신청 하고 그 결과를 조회하여 이용자에게 통지 할 수 있게 된다. 이용자는 자동 조회된 대출상품의 조건 등을 확인하여 가장 유리한 조건 을 제시한 금융회사에 직접 접속하여 대출 을 실행할 수 있다. 동 서비스를 통해 생업에 바쁜 금융이용자들이 보다 쉽고 편리하게 원하는 조건의 대출 상품 을 찾을 수 있을 것 으로 기대된다. 또 한 모인 의‘ 방한외국인 무기명 선불전자지급수단 서비스 (1건) ’ 가 혁신금융서비스로 지정되었다. 방한외국인 이 여권 등을 통해 본인확인 절차를 거칠 경우, 모인은 최대 100만원 까지 무기명 선불전자지급수단 을 발행할 수 있게 된다. 현행 무기명식 선불전자지급수단의 발행권면 한도가 50만원인 만큼, 발행한도 확대 로 인해 이용자 편의성 이 크게 제고 될 것으로 기대된다. 이외에도 네이버파이낸셜과 하나은행 의 ‘페이머니 통장 서비스 * ’ 관련 규제개선 요청을 수행하여 예금성 상품 판매·대리 중개업자 등록요건 관련 법령 정비 ** 등 규제개선을 추진할 예정이다. * 네이버페이 이용장의 선불충전금을 하나은행 제휴 계좌에 보관하고, 네이버페이를 통해 결제를 할 때마다 제휴 계좌에서 자동으로 선불충전이 이루어지는 연계 서비스 ** 현재 「금융소비자 보호에 관한 감독규정」 개정안 규정변경예고 진행 중(‘26.9.28.~’26.11.9.) ※ 혁신금융서비스에 대한 금융위원회의 의결 결과 세부내용은 참고 확인 \u003c 혁신금융서비스에 대한 금융위원회 의결 결과> 구 분 업체명 서비스명 신규지정 (4건) 신한카드(1건) - 보증금(선불전자지급수단 활용) 기반 비대면 신용카드 발급 서비스 우리카드(1건) - 외국인 고객 보증금 기반 신용카드 발급 서비스 뱅크샐러드(1건) - 마이데이터를 활용한 저금리 대출 대리 조회 서비스 모인(1건) - 방한 외국인 대상 무기명 선불전자지급수 단 서비스 규제개선 요청 수용 (1건) 네이버파이낸셜 및 하나은행(1건) - 페이머니 통장 서비스", "essential": false, "importanceReasons": ["strong keyword in body text (+1)"], "market": false, "tier": "routine"}, {"source": "FSS", "title": "사업보고서 등에 대한 조사,감리결과 조치", "department": "회계감리1국", "date": "2026-10-21", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=243274&menuNo=200218&pageIndex=1", "summary": "금융위원회(위원장 이억원)는 10월 21일 제18차 회의에서 회계처리기준을 위반하여 재무제표를 작성,공시한 해태제과식품㈜ 및 회사관계자에 대하여 「주식회사 등의 외부감사에 관한 법률」 등에 따라 아래와 같이 과징금 부과를 의결하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}], "2026-10-22": [{"source": "FSC", "title": "우주항공 · 양자 산업을 국민성장펀드의 지원대상산업에 추가하고자 합니다.   - 한국산업은행법 시행령 개정령안 입법예고(10.22~12.1일)", "department": "국민성장펀드총괄과", "date": "2026-10-22", "url": "https://www.fsc.go.kr/no010101/87977", "summary": "우주항공 · 양자 산업을 국민성장펀드의 지원대상산업에 추가하고자 합니다. - 한국산업은행법 시행령 개정령안 입법예고(10.22~12.1일) 금융위원회는 지난 7.15일(하반기 업무보고) 국민성장펀드 지원대상을 기존 12개 첨단전략산업 * 에서 “우주항공 등” 산업 으로 확대 하기로 발표하였습니다. * 반도체, 이차전지, 디스플레이, 바이오, 로봇, 인공지능, 백신, 미래형 운송수단, 수소, 콘텐츠, 핵심광물 이후 1차 관계부처 의견수렴을 거쳐 국가 전략적 중요성이 높고 대규모·장기 투자가 필요 한 우주항공 (예: 위성, 달 경제, 발사체, 민간항공기) 과 양자 (예: 양자컴퓨팅, 양자 암호통신, 양자센싱) 산업 을 국민성장펀드 지원대상산업으로 추가 하는 한국산업은행법 시행령 개정령안 * 을 마련하여 입법예고 합니다. * 시행령 제28조의6제2항 개정 : 첨단전략산업기금 업종 범위 확대 ※ 입법예고 내용은 홈페이지( http://www.fsc.go.kr/정책마당/법령정보/입법예고 )에서 확인가능 동 개정령안에 대해 의견이 있는 누구나 ‘26.10.22일~12.1일 기간 중 금융위원회 (국민성장펀드총괄과) 에 의견을 제출 할 수 있으며, 이후 국무회의 의결 등을 거쳐 시행령이 확정·시행 됩니다 .", "essential": false, "importanceReasons": ["law/regulation change (+1)"], "market": true, "tier": "relevant"},  후속조치, ｢ 금융위원장 여신전문금융회사 CEO 간담회 ｣ ( ’ 25.11월) 논의내용 등을 반영 하기 위해 여신 전문금융업감독규정｣ 개정안에 대한 규정변경예고 를 10.23일(금) 실시하였다. 이번 감독규정 개정안의 주요 내용은 다음과 같다. \u003c 주요 내용 > 첫째, 부동산 관련 업종에 대한 집중위험을 선제적으로 관리하기 위해 여신전문금융회사의 부동산 관련 대출한도규제를 강화한다. [ 여신전문금융업감독규정 §11의3] 현재 여신전문금융회사의 부동산PF 대출 (채무보증 포함) 에 대해서는 여신성 자산의 30% 이내로 운영 하도록 한도규제를 운영 중이나 저축은행·상호금융 등 타 업권과 달리 부동산 관련 업종별 한도에 대해서는 별도 규제가 없는 상황 이다. 이에 따라 여신전문금융회사의 부동산 관련 집중위험 완화를 위해 부동산·건설업 대출 각각 에 대한 한도규제를 여신성 자산의 30% 이내로 신설 하고 “부동산 프로젝트파이낸싱 대출과 부동산·건설업 대출”의 합산한도 도 50% 이내로 신설 한다. 둘째, 온라인 카드결제 리스크 관리를 강화하기 위해 카드사가 결제를 대행하는 전자지급결제대행업체(PG)를 평가하도록 의무를 부과한다. [ 여신전문금융업감독규정 §24의6] 온라인에서 PG를 통해 이루어지는 카드 결제대행거래가 증가 * 하면서 이에 대한 체계적 결제리스크 관리체계가 필요한 상황 이다. 이에 따라 카드사가 결제를 대행하는 PG사와 계약을 체결·갱신 하거나 계약기간 중 매 분기 마 다 PG사의 미정산·불법거래 등 다양한 결제리스크 ※ 를 평가 하도록 하고, 평가·점검 결과에 따라 필요한 조치 (예: 계약 미체결, 미연장, 중도해지 등) 도 의무화 한다. * 전자지급결제대행 중 신용카드 이용금액(일평균, 억원) : (‘21) 7,445→ (’23) 9,684→ (‘25) 11,662 \u003c※ 결제리스크 평가항목> ①전금법에 따른 전금업자 여부, ②경영지도기준 준수여부, ③자기자본 등 주요 재무현황, ④정산자금 외부관리 현황, ⑤금융제재 불법거래 연루이력 등 셋째, 증가하는 렌탈 수요에 탄력적으로 대응하고 소비자의 선택권을 확대하기 위해 여신전문금융회사의 렌탈업 취급한도규제를 합리화한다. [ 여신전문금융업감독규정 별표1의3] 현재 여신전문금융회사는 전체 렌탈자산 의 분기중 평균잔액 한도가 전체 “리스자산”의 평균잔액 이내 로 제한되며 물건별 렌탈자산 의 평균잔액 한도도 해당 리스자산의 평균잔액 이내로 별도 제한 되어 증가하는 렌탈 수요에 탄력적 대응이 곤란 한 상황 이다. 이에 따라, 렌탈시장에서의 건전한 경쟁을 활성화하기 위해 여신전문금융회사의 렌탈 전체 취급한도를 “리스+할부금융자산 (리스자산을 초과하지 않는 범위로 한정) ” 이내 로 완화하고 물건별 취 급한도 규제는 폐지 한다. 다만, 간담회 등을 통해 제기된 의견을 고려하여 중·소형 사업자 중심의 단기 렌탈시장 진입은 계속하여 금지 한다. 또한, 렌탈을 취급하는 여신전문 금융회사들은 자금조달여력이 부족한 중소형 렌터카사 를 대상으로 ① 한도대출 확대, ② 대출원금 상환유예, ③ 정비·사고대차 등 단기렌탈 수요 발생시 중소형 렌터카사 연계 등 렌탈시장에서의 상생체계 구축 도 함께 추진할 예정이다. \u003c 향후 계획 > 금번 개정안은 ’ 26.10.23일(금)부터 ’ 26.12.2일(수) 까지 규정변경예고 가 진 행된다. 개정안에 대해 의견이 있는 이해관계인 은 다음 안내와 같이 의견서를 제출 하면 된다. 금융위원회는 규정변경 예고 이후 규제합리화위원회 심사, 금융위원회 의결 등을 거쳐 내년 1분기까지 개정을 완료할 예정 이다. ￭ 예고기간 : 2026.10.23일(금) ~ 2026.12.2일(수), (40일) ￭ 규정변경예고된 내용에 대해 의견이 있으시면 다음 사항을 기재한 의견서를 아래의 제출처로 제출해 주시기 바랍니다. - 예고 사항에 대한 찬성 또는 반대 의견 (반대의 경우 이유 명시) - 성명 (기관ㆍ단체의 경우 기관ㆍ단체명과 대표자명) , 주소·전화번호 - 일반우편 : 서울시 종로구 세종대로 209 정부서울청사 금융위원회 중소금융과 0000000079749&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}], "2026-10-26": [{"source": "FSS", "title": "고수익 아르바이트와 통장매매의 유혹! 나도 모르게 금융사기 범죄자가 될 수 있습니다!", "department": "금융사기대응단", "date": "2026-10-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=243940&menuNo=200218&pageIndex=1", "summary": "ㅁ 최근 보이스피싱 조직이 청년층을 대상으로 사무보조 등 평범한 아르바이트를 가장하여 범죄자금 수거책으로 이용하거나, 금전을 대가로 통장 양도를 유도하고,\nㅇ 국내 거주 외국인이 통장매매와 개인 간 외화거래 등으로 인한 자금세탁 등 금융범죄에 연루되는 사례가 있어 각별한 주의가 필요합니다.\nㅇ 이에, 금융감독원은 취업난 등을 악용한 금융사기로 범죄에 이용되거나 피해를 당하지 않도록 청년 구직자와 국내 거주 외국인 등을 대상으로 맞춤형 홍보를 집중 실시합니다.\n\u003c 피해 예방 홍보 주요 내용 >\n① (취업 플랫폼 활용 홍보) 주요 취업 온라인 플랫폼(잡코리아)을 활용한 취업사기 예방 O/X 퀴즈이벤트 실시\n② (청년 구직자 생활밀착형 홍보) 청년 구직자들이 많이 찾는 대학 캠퍼스 영업점 및 일자리플러스센터 등에 포스터, 리플렛 등을 통한 홍보\n③ (외국인 맞춤형 홍보) 외국인 특화 영업점 홍보 및 외국인을 대상으로 다국어 안내를 통한 통장매매 위험성을 집중 안내(포스터, 알림톡)\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "민·관 합동으로 「지표금리 개편방안(3.30일)」을  차질 없이 추진하고 있습니다.", "department": "금융시장분석과", "date": "2026-10-26", "url": "https://www.fsc.go.kr/no010101/87989", "summary": "민·관 합동으로 「지표금리 개편방안 (3.30일) 」을 차질 없이 추진하고 있습니다. ① ( KOFR 이자율스왑 ) 1차년도 (‘25.7~’26.6) 이자율스왑시장 內 KOFR 기반 거래비중은 12.1% 로 목표 (10%) 초과 → 2차년도 (‘26.7~’27.6) 목표비중 을 25%로 상향 ② ( KOFR 변동금리채권 ) 은행권은 금년도 신설한 KOFR 기반 변동금리채권 (FRN) 발행비중 목표 (‘26.7~’27.6, 10%) 를 초과 하여 발행중 (3분기까지 32.3%) ③ ( KOFR 대출 ) 산업은행·기업은행 에서 10.26일 KOFR 기반 기업대출 상품 을 각각 5천억원씩 총 1조원 규모 로 신규 출시 예정 ④ ( 코리보 ) 「 코리보 신규취급 중단 대응 TF 」를 구성하여 ‘27.4월 예정된 금융권 의 코리보 기반 신규대출 중단 을 차질없이 준비 중 ⑤ ( 코픽스 ) ｢ 금융거래지표의 관리에 관한 법률 ｣ (금융거래지표법) 상 중요지표 에 준하는 수준 으로 코픽스 산출체계 점검 강화 \u003c 주요 지표금리 개념 > ∎ 지표금리 : 금융거래의 결과로 지급하거나 교환해야 할 금전이나 금융상품의 가치를 결정할 때 준거가 되는 금리 ∎ KOFR (Korea Overnight Financing Repo Rate) : 한국의 무위험지표금리로 국채‧통안채 담보 익일물 RP 금리 ∎ CD금리 : 시중은행이 발행한 만기 91일 CD의 발행수익률을 기반으로 산출한 금리 ∎ 코리보 : 은행 간 단기자금거래시 적용되는 호가금리 ∎ 코픽스 : 8개 은행의 자금조달금리를 가중평균하여 산출하는 금리 ‘26.3.30일 금융위원회는 한국은행, 금융감독원, 예탁결제원, 한국거래소, 금융협회, 연구기관 및 금융권과 함께 「 지표금리‧단기금융시장 협의회 」 를 개최하여 ➀ 지표금리의 신뢰도 를 보다 속도감 있게 제고 하고, ➁ 그 과정에서 시장이 받을 수 있는 충격은 최소화 하면서, ➂ 금융소비자 보호 를 강화 하는 「 지표금리 개편방안 * 」 을 확정·발표 한 바 있다. * 3.30일 보도자료, 「금융시장 신뢰성 제고 및 금융소비자 보호를 위해 지표금리 개혁을 일 관되고 속도감 있게 추진하겠습니다」 참고 「지표금리 개편방안」의 주요 과제별 진행상황 점검 지표금리 개혁 작업 을 효과적으로 추진하기 위해 각 주요 과제별 로 민·관 이 함께 참여 하는 실무 TF * 를 구성·운영 중이며, 「 지표금리 개편방안 」 이 발표한 일정대로 차질없이 추진 될 수 있도록 관계기관이 함께 추진실적 을 주기적 으로 점검 하고 있다. * ① 「KOFR 활성화 워킹그룹 (’24년~) 」 : 금융위·한은 (주관) ·금감원·유관기관·은행·증권 등 ② 「KOFR 기반 대출 출시 TF (‘26.3월~) 」 : 은행연 (주관) ·금융위·금감원·산은·기은 등 ③ 「코리보 신규취급 중단 대응 TF (’26.6월~) 」 : 금감원 (주관) ·은행연·코리보 취급 금융사 등 1. 이자율 스왑시장 내 KOFR 기반 거래비중 목표 상향 금융감독원은 이자율 스왑시장에서 KOFR 비중을 보다 빠르게 확대 하기 위해 ‘26.6월 행정지도 * 를 개정 하였다. 이자율 스왑거래 중 KOFR 기반 거래 목표비중 을 1차년도 (‘25.7월~’26.6월) 10%에서 2차년도 (’26.7월~‘27.6월) 에는 25% 로 15%p 상향 하였고, 향후 목표비중 을 매년 15%p씩 상향 하여 KOFR 기반 거래비중 을 ‘30.6월 까지 70% 이상 으로 확대할 계획 이다. * 금융감독원 행정지도, 「 KOFR 준거 이자율스왑 확산을 위한 협조요청 」 1차년도 (’25.7~‘26.6월) 행정지도 이행실적 을 점검한 결과, 금융권 의 적극적 인 참여 등으로 금융권 이자율 스왑거래 중 KOFR 기반 거래비중 은 12.1% 로 1 차년도 목표비율 (10%) 을 초과 달성 하였다. ‘26년 3분기 에는 KOFR 기반 거래비중 (잠정) 이 18.5% 까지 높아진 것 으로 파악 되었으며, 정부는 2차년도 에도 KOFR 기반 이자율 스왑 활성화를 위해 거래 목표 가 원활하게 달성 될 수 있도록 금융권 과 지속 협의·지원 해 나갈 계획이다. 2. 은행권 KOFR 기반 변동금리채권 (FRN, Floating Rate Note) 발행 목표 신설 금융감독원은 국내 변동금리채권 (FRN) 시장 에서도 미국, 영국 등 주요 선 진국 처럼 무위험지표금리인 KOFR 가 준거금리로 활용 될 수 있도록 KOFR 기반 FRN 발행목표 를 신규 도입 (’26.6월 행정지도 * ) 하였다. 은행권 은 ‘26.7월~ ’27.6월 기간 (1차년도 해당) 중 전체 FRN 발행액 의 10% 이상 을 KOFR 기반으로 발 행하고, 매년 10%p씩 확대 하여 ‘31.6월 까지 50% 이상 으로 높일 계획이다. 정책금융기관 (산은, 기은, 수은) 의 경우 은행권 목표비율보다 매년 15%p 높 게 설정 하여 1차년도 에 KOFR 기반 FRN 발행 목표비율 을 25% 로 설정 하였다. * 금융감독원 행정지도, 「은행권 KOFR 기반 변동금리채권(FRN) 발행 확산을 위한 협조요청」 정책금융기관·은행권 이 적극적 으로 협조 한 결과, 은행권 (정책 금융기관 포 함) 은 금년 1~9월 중 KOFR 기반 FRN 은 약 20.5조원 발행 (잠정, 총 FRN 중 32.3%) 하 여 이미 작년 발 행규모 (약 5.8조원) 를 크게 초과 하였다. 한편, 한국은행은 KOFR 활성화 를 지원 하기 위해 공개시장 운영 참여 대상기관 (‘26.8월~‘27.7월) 선정시 KOFR 기반 거래실적 (이자율스왑, FRN, 선물, 대 출 등) 평가 비 중 을 전년 보다 상향 반영 하였고, 향후 에도 한국은행은 대 상기관 선 정 시 KOFR 기반 거래실적 을 평가 에 지속 반영 할 계획이다. 3. KOFR 기반 기업대출 상품 신규 출시 (10.26일, 산은·기은) KOFR 활용 기반 을 대출시장 까지 확대 하고, 소비자 에게 다양 한 상품 선 택권 을 부여 하기 위해 10.26일 산업은행 과 기업은행 이 KOFR 기반 기 업 대출 상품 을 각각 5,000억씩 총 1조원 규모 로 출시 할 예정이다. 특히, 산업은행 과 기업은행 은 포용금융 강화 및 지역금융 활성화 의 일환으로 지방소재 중 소·중 견기업 에 대해서는 우대금리 를 적용 하여 금리 부담 을 완화 할 계획이다. \u003c 산업은행·기업은행 KOFR 기반 대출 상품 (요약) > 구분 산업은행 “NEXT KOREA KOFR 단기한도 특별자금 ” 기업은행 “KOFR 단기 유동성 지원자금대출 ” 공급규모 • 5,000억원 • 5,000억원 대상차주 • 계열대기업, 중견기업, 중소기업 • 긴급 운전자금 필요 중소기업 자금용도 • 운전자금 • 운전자금 대출기간 • 최대 1년(1개월 단위 기표) • 최대 1년(3개월 단위 기표) 기준금리 • 30일 과거평균 KOFR 금리 • 30일 과거평균 KOFR 금리 우대내용 • 중소·중견기업 : 최대 0.65%p 우대 • 지방소재·이전기업 : 0.05%p 추가 우대 • 지방소재기업 : 최대 0.3%p 우대 ※ 자세한 사항 은 10.26일 배포 예정인 산업은행·기업은행 보도자 료 참고 (☞ KOFR 기업대출 상품 문의는 산업은행 02-787-6917, 기업은행 02-729-6472) KOFR 기반 대출상품 의 원활한 출시 를 위해 은행연합회 는 대출 지표금리 에 KOFR 를 포함 하는 「 대출금리 모범규준 」 개정 작업을 ‘26.6월 완료 하였고 , 예탁결제원 은 대출 지표금리 로 신뢰성 있게 활용 할 수 있도록 ‘26.8월 부터 최근 30·90·180일 KOFR 평균금리 를 추가로 공시 하고 있다. 4. 코리보 기반 신규대출 중단을 차질 없이 준비중 코리보 는 이미 국제적으로 산출이 중단된 리보 와 산출체계 가 유사 한 만큼 점진적인 코리보 사용비중 축소 를 위해 코리보 기반 신규대출 은 ’27.4월 부 터 원칙적 으로 중단 할 예정 이 다 (‘27년초 금감원 행정지도 시행예정). 이를 위해, 금융감독원은 ‘26.6월 부터 은행연합회 , 코리보 기반 상품 을 취급중인 금융기관 * 들과 함께 「 코리보 신규 취급 중단 대응 TF 」 를 구성 하여 운영하고 있다. TF에서는 신규 취 급 및 만기연장 중단 , 만기 연장시 대체금리 전환 등 을 위한 가이드라인 을 마련 하고, 애로사항 을 해결 함 으 로써 코리보 기반 신 규 취급 중단 및 대체금리 로의 전환 이 차질없이 이 루어질 수 있도록 할 예정이다. * 은행 6개, 저축은행 1개, 자산운용 1개, 여신금융 4개, 보험 1개 코리보 사용 에 대한 전 금융권 전수조사 결과, ’26.3월말 기준 대 출 을 중심 으로 코리보 가 240.7조원 규모 로 사용 되고 있 었다. 특히, 1년 이하 만기 익스포저 규모 가 전체 80.4% 인 193.4조원 을 차지 하 고 있는 만큼, ‘27.4월 이후 금융권 의 신규대출 이 중단 되는 경우 자연스럽게 코리 보 사용 잔액 이 빠른 속도 로 감소 할 것으로 예상 된다. * ’26.3월 기준 코리보 관련 금융권 익스포저 총 240.7조원 중 99.5%인 239.5조원은 대출이며, 99.7%인 239.9 조원은 은 행권 익스포저인 것으로 파악 5. 코픽스 산출체계 점검을 법상 중요지표에 준하는 수준으로 강화 향후 코리보·CD금리 사용비중이 점진적으로 축소될 경우 대출시장 에서 코픽스 의 활용비중 이 지속 확대 될 가능성이 높은 만큼, 은행연합회 (코픽스 산 출기관) 는 코픽스 에 대한 산출 체계 점검 을 선제적 으로 강화 하였다. 구체적으로, ‘26.6월 코픽스 공시분 부터 산출된 코픽스 금리가 정확히 산출 되었는지에 대해 기존 산출 부서 의 사전 검증 에 더하여 독립된 부 서인 감 사실 의 검토·승인 절차 를 추가 하였다. 또한, ’26.2분기 부터 분기별 자체 점검사항 에 ｢ 금융거래지표법 ｣ 상 중요지표 점검사항 들을 추가 * 함 으 로써 코픽스 산출·공시 관련 자체점검 을 법상 중요지표 에 준하는 수준 으 로 강화 하였다. * 예) 공시시간 준수 여부 등 공시사항의 적정성, 관리위원회 운영의 타당성 등 ‘26.4분기 에는 은행 (코픽스 기초자료 제출기관) 이 산출자료 정확성, 내 부 통 제 적정성 등을 자체 점검 하고, 그 점검결과 에 대해 금융감독원 이 다시 한번 점 검 할 계획 이다. 향후 코픽스의 금융시장 내 비중 등을 보아가며 ｢ 금융거래 지표법 ｣ 상 중요 지표로 코픽스를 지정 (금융위원회 의결사항) 할지 여부도 추가 검토할 예정이다. 향후 계획 향후 파생·채권·대출 등 다양한 시장 에서 KOFR 활성화 를 위한 노력을 지속하는 한편, 코리보의 신규대출 취급 중단 (’27.4월~) 및 법상 중요지표 에 서 CD금리 지정을 해제 (‘30년말) 하는 작업도 차질없이 추진해 나갈 계획이다. * 현재 ｢금융거래지표법｣ 상 KOFR와 CD금리를 중요지표로 지정중 또한, 해외 에서도 외국인투자자 가 KOFR 사용 을 확대 할 수 있도록 11월 글로벌 금융중심지 인 런던·홍콩 에서 한국은행·금융위원회·금융감독원·예탁결제원·한국거래소 등 관계기관 합동으로 「 KOFR 활성화 관련 해외 IR 」 을 실시 할 계획이다. 금융권 도 과거 조작사건 을 계기로 폐지 된 LIBOR 와 산출체계 가 유사 한 CD금리 와 코리보 의 경우에는 금융소비자 보호 등을 위해 스스로 지표 금 리 로 사용 을 자제 하고, 보다 신뢰성 있는 지표금리 를 적극 활용 할 필 요 가 있다. 정책당국은 앞으로도 유관기관 및 금융권 과 함께 금융시장 신뢰성 제고 를 위한 금융지표 개혁작업 을 일관 되고 속도감 있게 추진 해나갈 계획이다.", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "FSS", "title": "간호조무사 대상 보험사기 예방교육 실시", "department": "보험사기대응단", "date": "2026-10-26", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=243965&menuNo=200218&pageIndex=1", "summary": "ㅁ 간호조무사가 의료현장에서 부지불식중 보험사기에 연루되는 것을 예방하기 위해 의료현장에서 발생하기 쉬운 보험사기 사례 및 신고방법 등을 중심으로 교육\nㅁ 교육은 내년 1분기부터 실시할 계획이며 접근성이 용이한 온라인 교육부터 우선 실시하고 추후 오프라인 교육으로 점차 확대할 예정\nㅁ 간호조무사가 보험사기가 의료현장에 발 붙이지 못하도록 돕는 역할을 수행함으로써 간호조무사에 대한 국민 신뢰가 제고되는 효과 기대\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "KOFR OIS 중앙청산 도입 1주년 성과분석", "department": "", "date": "2026-10-26", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015853", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "제1차 국민참여성장펀드 자산운용보고서 공시", "department": "국민지역참여지원과", "date": "2026-10-26", "url": "https://www.fsc.go.kr/no010101/87994", "summary": "제1차 국민참여성장펀드 자산운용보고서 공시 • 1차 국민참여성장펀드의 공모펀드 운용사(미래에셋·삼성·KB 자산운용)는 3개월간의 펀드 운용현황, 수익률, 주요 투자내역 및 향후 운용계획 등을 담은 자산운용보고서 공시 지난 6.12일 설정 된 제1차 「국민참여형 국민성장펀드」 (이하 ‘ 국민참여성장펀드 ’ ) 의 공모펀드 운용사 (미래에셋·삼성·KB 자산운용) 가 10.26일 자산운용보고서를 공시 하였다. 자산운용보고서 는 자본시장법 * 에 따라 공모펀드 운용사가 펀드 설정 후 3개월 (기준일) 마다 작성 하여 공시 (기준일로부터 2개월 이내) 한다. 운용 개시 후 최초로 작성 된 이번 보고서에는 관련 법령에 따라 펀드의 운용현황, 수익률, 주요 투자내역, 향후 운용계획 등이 담겼다. * 「자본시장법」 제88조 및 「자본시장법 시행령」 제92조 → 공모펀드 설정일(6.12일)로부터 3개월(9.11일)을 기준으로, 2개월 이내(~11.11일) 공시 \u003c자산운용보고서 주요 내용> 제1차 국민참여성장펀드는 6.15일 총 10개의 자펀드에서 투자 가 개시된 이후 작성 기준일인 9.11일 까지 전체 자펀드 합산 약 46.3%의 자금이 투자 되었다. 현금성 자산을 제외한 투자금액의 약 80%가 첨단전략산업 분야에 투자 * 되어 펀드 조성취지에 맞게 운용 되고 있으며, 상장주식 (28.4%) , 상장 메자닌 (10.1%) , 비상장주식 (0.7%) , 비상장메자닌 (4.6%) 등 다양한 자산에 분산 투자 된 것으로 확인되었다. * (투자비중) 첨단전략산업 35.9%, 첨단전략산업 외 7.9%, 채권 2.5%, 현금성자산 49.7% 등 9.11일 기준 3개월간의 누적 수익률 은 약 0.50% * 수준 이다. 자펀드별 수익률 은 △19.86%~3.15%로 차이 ** 가 있으나, 정부 재정과 자펀드 운용사의 후순위 투자금 이 약 20% 내외의 손실을 우선 부담 함에 따라 전체 펀드 총계 로는 플러스 수익률 을 기록하였다. * 펀드 클래스별(온라인·오프라인, 일반·서민) 보수 차이로 인해 투자자별 수익률은 상이함 ** 일부 자펀드에서 6~7월 이후 증시 변동성 확대에 따라 상장주식 관련 평가손실 발생 다만, 국민참여성장펀드는 5년 만기 의 폐쇄형 펀드 인 만큼, 현 시점의 수익률 보다는 긴 호흡 으로 장기적 관점 에서 운용성과를 평가 하는 것이 바람직하다. 펀드의 투자대상 이 상장주식 외에도 즉시 가치평가가 어려운 비상장주식 과 메자닌 등으로 다양하게 구성 되어 있고, 투자자산별 로 가치평가가 가능한 시 점 이 상이 한 만큼, 의미 있는 투자성과 를 얻기까지 상당 기간 이 소요 됨을 이해할 필요가 있다. 한편, 공모펀드 운용사 (미래에셋·삼성·KB 자산운용) 는 자산운용보고서를 통해 “전체 포트폴리오 내 편입 자산 이 잘 분산 되어 있고, 개별 피투자 사모펀드 들이 각자 지닌 경쟁력 을 살려 상장주식 외에도 비상장주식과 메자닌 등에도 분산 투자 ”하고 있으며, 향후 “ 자펀드 모니터링 및 위험관리절차 에 따라 편입자산 및 비율 등 운용상의 주요 사항을 철저히 모니터링 하겠다”고 밝혔다. ※ (참고) 자산운용보고서는 공모펀드 운용사 3사(미래에셋·삼성·KB 자산운용) 및 금융투자협회 홈페이지를 통해 확인할 수 있음 ☞ 향후에도 3개월 주기로 작성·공시 예정", "essential": false, "importanceReasons": [], "market": true, "tier": "relevant"}, {"source": "KRX_OPEN2", "title": "한국거래소, 부산 취약계층 독거노인 21가구 집수리 지원", "department": "", "date": "2026-10-26", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015854", "summary": "첨부 참조", "essential": false, "importanceReasons": [], "market "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079772&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSS", "title": "투자한도 100%는 상품의 원리금 보장성 표시가 아닙니다", "department": "연금감독실", "date": "2026-10-27", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=245254&menuNo=200218&pageIndex=1", "summary": "\u003c ETF 운용 및 위험 안내 현황 >\nㅁ '26.상반기 퇴직연금 실적배당형(198.0조원)의 과반 이상을 ETF(99.8조원)가 차지하고 있으며, '23년말 ETF 투자 규모(9조원) 대비 10배 이상 급증\nㅁ ETF 위험등급은 '매우 높은 위험(1등급)'부터 '매우 낮은 위험(6등급)'까지 다양하게 분포 중이나, 일부 퇴직연금사업자는 위험도 안내 없이 '투자한도'로만 표시\nㅁ '주식 비중 50% 미만 등' 조건을 갖춘 '투자위험 낮춘 상품(ETF)'도 예금 등 원리금보장형과 동일하게 '투자한도 100%'로만 안내하여, 퇴직연금 가입자가 이를 원리금보장형 상품으로 오해할 소지\n\u003c 추진내용 >\nㅁ (매매시점)매매화면에 상품의 투자 한도와 위험등급을 동시에 표기하고, 사업자가 제공하는 '상품제안서'에도 상품의 위험등급을 병기('27.1월 시행)\nㅁ (보유시점)가입자가 보유한 상품의 수익과 위험등급을 병기하여 제공하도록 '적립금운용현황보고서' 양식 변경('27.1월 시행)\n\u003c 소비자 유의 사항 >\n1. \"투자한도 100%\"는 상품의 안정성이나 원리금 보장성을 의미하지 않습니다.\n2. 투자할 상품에 대한 정보는 퇴직연금사업자가 제공하는 상품제안서도 함께 참고하세요(원리금보장형은 고금리순, 실적배당형은 사업자가 판단하는 우수상품 순으로 배열).\n3. 적립금운용현황보고서를 통해 보유한 상품의 위험등급을 정기적으로 확인하고 포트폴리오 차원의 위험관리 수단으로 활용하세요.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "군부대로 ‘찾아가는 재무상담소’, 군복무 청년에게 1:1 맞춤형 재무상담 제공", "department": "청년정책과", "date": "2026-10-27", "url": "https://www.fsc.go.kr/no010101/87998", "summary": "군부대로 ‘찾아가는 재무상담소’ , 군복무 청년에게 1:1 맞춤형 재무상담 제공  군부대 로 전문 재무상담사 들이 직접 방문 하여, 상담을 희망하는 군복무 청년 을 대상 으로 1:1 맞춤형 재무상담 제공  군장병을 포함하여 청년이라면 누구나 전국 어디서든 1:1 맞춤형 재무상담 을 무료 로 이용 가능 【관련 국정과제】 ( 82-3) 청년 등 전국민 경제·금융교육 강화, (89-3) 청년 자산형성 지원 강화 금융위원회 (위원장 이억원, 이하 금융위)와 국방부 (장관 강신철), 서민금융 진흥원 (원장 김은경, 이하 서금원)은 군복무 청년 들의 체계적인 재무관리 역량 강화 를 지원 하기 위해 군부대 로 ‘찾아가는 재무상담소’ 를 운영 하여 군복무 청년 등 * 에게 1:1 맞춤형 재무상담 을 제공 할 예정이다. * (대상) 청년(만19~34세)인 장교, 부사관, 장병, 군무원 등 금융위 와 서금원 은 올해 7월부터 ‘청년 모두를 위한 재무상담’ 을 통해 희 망하는 모든 청년 들에게 온라인 재무진단과 1:1 맞춤형 재무상담 을 지원 하고 있다. 9월 말 까지 1.9만여명 * 의 청년에게 대면 또는 온라인 재무상담을 제공 하여, ’25년 전체 기간 동안의 청년 재무상담 지원 인원 (2,502명, 서금원) 대비 크게 증가 하였다. 아울러, 이용자 만족도 ** 도 높게 나타나 청년들의 호응 을 얻고 있 다. * (대면) 1,654명 (찾아가는 재무상담 1,191명, 금융권 재무상담 463명) / (비대면) 17,401명 (온라인) ** (만족도 점수) 5점 만점에 4.7점 (찾아가는 재무상담 4.8점, 금융권 재무상담 4.7점) ※ (참고) 청년 모두를 위한 재무상담 (’26.7.16일~) 개요 및 운영 절차 ▸ (주요내용) 희망 청년 모두를 대상으로 ➊ 재무진단 과 1:1 맞춤형 ➋ 재무상담 제공 ➊ (재무진단) 온라인 을 통해 본인의 재무정보 (소득, 지출, 부채 등) 를 바탕으로 재무상태 (부채부담, 저축·투자 성향 등) 를 평가 하고 개선이 필요한 사항 을 분석 ➋ (재무상담) 전문가 가 ( 전문 재무 상담사 또는 은행 등 금융기관 직원) 재무진단 결과 를 바탕 으로 자산형성, 소득·지출·신용·부채 관리 등 개개인의 상황에 알맞은 1:1 맞춤형 상담 을 제공 ▸ (운영방식) 청년이 원하는 시간·장소에 찾아가거나 (찾아가는 재무상담) 은행 등 금융기관 지점 을 방문 (금융권 재무상담) 하는 대면상담 과 비대면 온라인 재무상담 중 청년이 원하는 방식 으로 제공 ▸ (절차) ➊ 재무진단 (온라인) → ➋ 재무상담 (대면·온라인) → ➌ 사후상담 (유선, 대면 한정) ※ 서민금융진흥원 ‘청년 모두를 위한 재무상담’ 웹페이지에서 가능 , 접속 QR코드 ⇨ 다만, 군복무 청년 들의 경우 시간과 장소적인 한계 로 인해 원하는 일정에 맞춰 대면 재무상담 을 받기 어려운 제한점 이 있었다. 이를 해소하기 위해 2026년 제2차 금융교육협의회(8.31일)에서 마련한 「 군장병 금융교육 강화 방안」 * 후속조치 의 일환으로, 금융위 와 국방부 가 협업 하여 군부대로 직접 ‘찾아가는 재무상담소’ 를 추진 하게 되었다. * 군장병 스스로 금융문제를 해결하는 수요자 중심의 금융교육체계로의 전환을 위해 ‘1:1 상담을 통한 맞춤 솔루션 제시’, ‘교육 참여유인 체계 강화’ 등 6대 과제 마련·추진 ‘찾아가는 재무상담소’ 를 희망 하는 군부대 가 올해 11월 13일(금) 까지 서금원 으로 신청 * 하고, 서금원과 군부대가 구체적인 일정 을 협의한 후 전문 재무상담사들이 군부대로 방문하여 희망하는 군복무 청년 들을 대상으로 1:1 맞춤형 재무상담 을 제공 할 계획이다. 상담 제공 은 11월 말 부터 이루어질 것으로 전망된다. 아울러, 군복무 청년들을 대상으로 자산·소득·신용·부채 관리 등 재무관리 교육 을 희망하는 군부대에는 개인 맞춤형 재무상담 과 함께 단체 재무관리 교육 도 제공 할 예정이다. * 세부적인 신청절차는 국방부에서 군부대에 안내할 예정 한편, ‘청년 모두를 위한 재무상담’ 은 군장병을 포함하여 청년이라면 누구나 * 전국 어디서든 1:1 맞춤형 재무상담 을 받을 수 있는 사업으로, 재무상담을 받은 청년 에게는 ‘ 청년미래적금’ 우대금리 혜택 (0.2%p)도 제공한다. * 만 19세~34세 청년이라면 누구나 ‘청년 모두를 위한 재무상담’ 웹페이지를 통해 이용 가능하며, 청년도약계좌와 청년미래적금을 가입한 경우 나이와 상관없이 이용 가능 김동환 금융위 금융소비자국장 은 “디지털 금융환경의 변화로 군복무 청 년 들이 다양한 금융위험 에 노출될 가능성 이 높아졌다 ”고 평가하며, “군복무 청년들이 스스로 체계적인 재무관리 역량 을 갖출 수 있도록 국방부와 함께 적극적 으로 지원 하겠다”고 밝혔다. 아울러, “금번 사업 에 대한 수요를 바탕 으로 필요한 경우 군부대로 찾아가는 재무상담소 를 지속 적으로 운영 할 수 있도록 검토 할 계획”이라고 밝혔다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "청년의 26, 금융위원장표창124, 금융감독원장표창18 이번 기념식부터 ｢동반성장｣ 과 ｢청년채용 확대｣ 관련 포상 * 이 신설 되었다 . 이는 이억원 금융위원장 이 지난해 제10회 금융의 날 기념식 (’25.10.28.) 에서 ‘금융의 날’ 을 “ 금융이 고객과 동반성장하고 사회적 가치를 창출 하도록 장려 하는 장 으로 발전 시키고, 청년 일자리를 창출한 금융기관의 노력을 높이 평가 하겠다”고 밝힌 구상이 구체화된 결과이다. * 혁신금융·포용금융 부문에 ‘금융인과 고객의 동반성장’ 포상 신설(5팀, 10점) 포용금융 부문에 ‘청년채용 확대’에 노력한 금융기관 포상 신설(2점) ※ 동반성장 : 금융인 의 적정한 금융지원 이 고객 의 성장 과 성과 창출 로 이어지고, 고객 이 해당 지원을 바탕으로 새로운 사회적 가치 를 창출·확산 하는 ‘금융 선순환’ 의 모범 사례 를 선정 하여, 금융인 과 고객 을 함께 포상 신설된 ｢동반수상｣ 포상 * 에서는 ➊ 혁신금융 부문 에서 손지영 신용보증기금 팀장 (대통령표창) 과 박정윤 ㈜인터엑스 대표 (금융위원장표창) , ➋ 포용금융 부문 에서 한빛신용협동조합 (대통령표창) 과 민들레의료복지사회적협동조합 (금융위원장표창) 등 총 5건 의 사례가 선정되어 금융인 과 고객 이 함께 단상에 올랐다. * [혁신] 훈장1, 대통령표창1, 금융위원장표창2, [포용] 대통령표창2, 금융위원장표창4 \u003c 동반성장 부문 수상자 주요 공적 내용 > ▸ (신용보증기금 - ㈜인터엑스) 첨단전략기업 을 위한 기술평가 시스템 개편 및 딥테크 맞춤형 금융지원 을 확대 - 제조업 AI 전환 을 촉진 하여 산업 생산성 을 개선 하고 양질 의 지역 일자리 를 창출 ▸ (한빛신용협동조합 - 민들레의료복지사회적협동조합) 금융 과 건강복지 서비스 를 연결 하는 사회적금융 모델 을 구축 하여 지역사회 상생 을 실천 - 의료기관 방문 이 어려운 지역주민 을 대상으로 현장 중심의 의료서비스를 제공 ｢청년채용 확대｣ 포상은 청년층에 양질의 일자리 를 제공한 금융기관 의 노력 을 격려 하기 위한 것이다. 금융위원회 는 채용 절대규모 , 채용 증가규모 뿐 아니라 지역인재·장애인·보훈 전형 등 포용적 채용 제도 운영 현황 등을 종합적으로 평가하였으며, 평가 결과에 따라 ㈜ 교보생명보험 (대표: 신창재, 조대규), ㈜ 케이뱅크 (대표: 최우형) 2개 단체 가 금융위원장 표창 을 수상 받았다. 철탑산업훈장 (혁신금융)은 신혜숙 한국산업은행 부문장 에게, 국민훈장석류장 (포용금융)은 강봉근 경남신용보증재단 부장 에게 수여되었다. 신혜숙 부문장 은 국민성장펀드 의 원활한 운영 을 통해 국내 첨단전략산업 생태계 발전 에 기여한 공로를 인정받았으며, 강봉근 부장 은 금융취약계층을 대상으로 보증지원 및 정책금융 연계 를 통해 지역 포용금융 확대 에 기여 한 공로를 인정받았다. \u003c 훈장 수상자 주요 공적 내용 > ▸ (신혜숙) 국민성장펀드 (첨단전략산업기금)의 원활한 운영 과 지원체계 수립 등을 통해 국내 첨단전략산업 생태계 발전 에 기여 ▸ (강봉근) 금융접근성 이 취약한 저신용자, 영세 소상공인 대상으로 보증지원 및 정책금융 연계 등을 통해 지역 포용금융 기반 강화에 기여 포장 은 ➊ 혁신금융 부문 에서 김재욱 한국 금융투자협회 부장, 송창영 법무법인 세한 변호사 , ➋ 포용금융 부문 에서 김영신 신용회복위원회 부장과 정희 NH농협은행 과장보 , ➌ 저축·투자 부문 에서 김해란 옥과한우촌 대표 가 수상했다. \u003c 포장 수상자 주요 공적 내용 > ▸ (김재욱) 국민성장펀드 , 기업성장집합투자기구(BDC) 및 환율 안정 목적 의 국내시장 복귀계좌(RIA) 등 혁신적인 정책 및 제도 도입 에 기여 ▸ (송창영) 증권선물위원회 참여 등을 통해 불공정거래 근절 에 기여 하고, 자본시장 전문교육 을 진행하며 금융권 종사자 의 전문성 을 강화 ▸ (김영신) 소액금융 및 새도약기금 의 안정적 운영 을 지원 하는 등 서민금융 공급망 확대 에 기여 ▸ (정희) 새희망홀씨 및 햇살론 등 서민금융 상품 을 지역 금융소외 계층 에게 적극 공급 하여 채무부담 을 완화 시켜주는 등 서민금융 확산 에 기여 ▸ (김해란) 식당 운영을 통해 얻은 수익을 소외된 이웃 에게 꾸준히 기부 하고, 근무 인력을 저소득 계층 으로 우선 선발하여 지역사회 발전 에 기여 대통령표창 은 ➊ 혁신금융 부문 에서 김종현 기술보증기금 팀장 과 이상규 서울보증보험 상무 , ➋ 포용금융 부문 에서 김재락 공군 제3미사일방어여단 소령, 홍성환 부산수영경찰서 경사, ➌ 저축·투자 부문 에서 휘경여자중학교 와 최광련 주식회사 한성 대표 등 총 15인 및 4개 단체 에게 수여되었다. \u003c 대통령표창 수상자 주요 공적 내용 > ▸ (김종현) 중소·벤처기업 의 지식재산(IP) 보증체계, 녹색금융 지원체계 구축 등 혁신금융 제도 를 기획·운영 하여 금융산업 발전 에 기여 ▸ (이상규) 중소기업 및 창업기업 에 대한 신속한 보증공급 확대 와 기업가치 제고 전략 을 추진 하여 금융산업 성장 과 생산적 금융 확대 에 기여 ▸ (김재락) 퇴직연금 도입, 찾아가는 금융서비스, 재무컨설팅 도입 등을 통해 군인 들의 자산 형성 과 경제적 자립 기반 구축 에 기여 ▸ (홍성환) 사이버금융범죄, 신종사기 등의 수사 를 담당 하며 고금리 및 불법 금융거래 로 어려움을 겪는 취약계층 의 피해 방지 와 회복 지원 에 기여 ▸ (휘경여자중학교) 학생들에게 양질의 경제·금융 교육 을 제공 하여, 건전한 금융가치관 확립과 공교육 내 금융교육 위상제고 에 기여 ▸ (최광련) 방위산업 사업체 를 운영 하며 지역 장학재단 에 고액 을 기탁 하고 어려운 이웃에게 후원금 을 전달 하는 등 나눔의 선순환 을 실천 국무총리표창 은 ➊ 혁신금융 부문 에서 김동원 KB증권 본부장, ➋ 포용 금융 부문 에서 임새롬 은행권청년창업재단 팀장 , 노희영 서민금융진흥원 부장 , ➌ 저축·투자 부문 에 연예인 이광수 등 총 25인 및 1개 단체 에게 수여되었다. \u003c 국무총리표창 수상자 주요 공적 내용 > ▸ (김동원) 자본시장 분석 을 통한 투명 한 투자정보를 제공 하여 건전한 투자 를 확산 하고 자본시장 정책 논의 에 참여 하여 자본시장 선진화 에 기여 ▸ (임새롬) 스타트업 이 적시 에 자금 을 공급 받도록 금융기관 및 정책자금 과 연계 하여 벤처투자 성과 창출 에 기여 ▸ (노희영) 서민금융 상품 기획 및 운영 , 수요자 중심 의 디지털 플랫폼 고도화 등을 통해 포용금융 실천 에 기여 ▸ (이광수) 소아 환자 치료비 지원, 구호 물품 지원 , 재능 기부 활동 등 기부 와 자선 활동 을 통해 나눔 문화를 확산하고, 건전한 저축 및 투자도 실천 금융위원장표창 은 ➊ 혁신금융 부문 에서 ㈜이수스페셜티케미컬 과, ➋ 포용금융 부문 에서 롤링주빌리 와 김민호 생명보험협회 책임 , ➌ 저축·투자 부문 에서 연예인 박은빈 등 총 112인 및 12개 단체 에게 수여되었다. \u003c 금융위원장표창 수상자 주요 공적 내용 > ▸ (㈜이수스페셜티케미컬) 국민성장펀드 지원 을 통해 이차전지 소재 생산공장 을 확충하여 산업 생태계 강화, 지역 일자리 확대 에 기여 ▸ (롤링주빌리) 채무자 들의 새출발 지원 및 부채 경감 에 이바지 하여, 금융취약 계층 보호 와 포용금융 확산 에 기여 ▸ (김민호) 자살예방 관련 법·제도 개선 추진 등을 통해 생명존중문화 를 확산 하고 보험업권 의 상생금융 사업을 운영 하여 포용금융 확산 에 기여 ▸ (박은빈) 금융권 과 사회공헌 캠페인 을 진행하며 금융의 사회적 가치 를 알리고, 팬클럽 과 함께 취약계층 을 위한 기부 및 봉사 활동 을 지속적으로 실천 이억원 금융위원장 은 이날 축사에서 “ ➊ 경제성장의 원동력이자 나눔의 기반이 되는 ｢저축·투자｣ , ➋ 대한민국 혁신경제를 뒷받침하는 ｢생산적 금융｣ , ➌ 모두에게 재기와 도전의 기회를 주는 ｢포용적 금융｣ 의 가치를 바탕으로, 금융현장 에서 변화 를 이끌고, 사회공동체 에 선한 영향력 을 행사하는 분들의 노고에 감사 하다”고 언급하였다. 이억원 위원장 은 올해 신설한 ｢동반성장｣ 포상의 의미를 짚으며, “오늘은 금융인 과 고객 이 함께 상 을 받는 매우 의미있는 자리 사, 농림수산업자신용보증기금, 기술보증기금, 은행연합회 (민간전문가) 이규복 박사(금융연구원), 임수강 박사(금융발전심의위원회), 오윤해 박사 (KDI), 유순덕 이사(롤링주빌리), 홍석린 부대표(삼정KPMG) ▪ (안건) ➊ 포용금융 종합평가체계 도입방안 ➋ 채무조정 추진 현황 및 정책 방향 ➌ 금융공공기관 부실채권 관리 개선 방안 ➍ IBK형 포용금융 추진 방안 2 금융위원장 모두발언 이억원 금융위원장 은 모두발언에서 “ 포용적 금융 은 국민의 삶과 가장 직결 되는 과제 로서 깊은 책임감 을 느끼며 정책을 적극 추진해 왔다 ” 고 밝히고, “ 금융권 도 포용금융 에 적극 호응 하고 있지만 정부가 요청하면 금융권이 화답하는 수동적인 과제 로서 추진되어 온 측면이 있으며, 이제 한 걸음 더 나아가 금융 회사 스스로 포용금융에 나설 수 있는 구조 를 만들어나가야 할 때”라고 발언했다. 또한, “지난 1년은 개인 채무자 보호 와 연체채권 관리 에 있어 획기적인 구조적 전환 을 이룬 시기이며, 무엇보다 금융권의 인식이 ‘회수’ 에서 ‘채무자 재기’ 를 중심으로 전환 된 것이 가장 큰 성과”라고 하며 “이러한 인식의 변화를 마중물 삼아 제도의 사각지대를 해소 하고, 남은 정책 과제를 적극적으로 추진 해야 할 때”라고 언급하였다. 3 포용금융 종합평가체계 도입 방안 모두말씀에 이어 첫 번째 안건 으로 ‘포용금융 종합평가체계 도입방안’ 이 발표되었다. 그간 정부 가 ‘포용금융 대전환’ 을 역점 추진 하는데 발맞춰 금융권 도 중‧저 신용자 금융공급 확대 , 채무조정 활성화 등에 적극적 으로 동참 해 왔다. 특히 , 5대 금융지주 는 향후 5년간 포용금융에 70조원 을 공급 하겠다는 계획 을 밝히고 , 올해 상반기 약 11조원 이상 을 공급하는 등 계획을 충실히 이행중 이다. 그러나 여전히 포용금융 을 비용 으로 인식하는 문화 가 금융권 전반에 자리 잡고 있어, 단순한 실적점검 이나 모니터링 만으로는 지속적인 포용금융 추진 을 유도 하는데 한계 가 존재한다. 이에 금융위원회 와 금융감독원 은 ‘포용금융 종합평가체계’ 를 도입 하여 금융회사가 포용금융 을 경영체계에 내재화 하고 지속 확대 하도록 실질적 유인체계 를 구축한다. 평가대상 은 17개 국내은행 으로, 자산규모나 영업형태에 따라 유불리가 사전에 결정되지 않도록 대형은행 (가군) , 중소형은행 (나군) , 인터넷은행 (다군) 으로 분리하여 군별 상대평가 를 실시한다. 금융감독원 이 평가실무 를 담당 하고 민간위원장 을 포함한 평가위원회가 결과 를 심의‧확정 한다. 매년 전년도 실적 을 평가하여 3월 중 결과 를 발표 하며, 내년 부터는 제2금융권 으로 대상을 확대 할 예정이다. 평가지표 는 ➊ 지배구조 , ➋ 자금공급 , ➌ 채무조정 , ➍ 사회적배려 , ➎ 비금융지원 총 5개 부문 으로 나누어 금융회사 의 포용금융 노력 전반 을 평가 한다. ➊ 지배구조 부문 (10%) 은 포용금융의 전략‧체계‧절차 등을 정성평가 하여 포용 금융이 금융회사의 경영체계에 내재화 되도록 유도한다. 특히, 포용금융 추진 초기 인 만큼, 지배구조 구축 노력 을 집중적 으로 점검‧평가 하고, 실질적인 차등 이 발생하도록 하여 빠른 시간 내 에 포용금융 이 금융회사 의 시스템 에 안착 되도록 유도할 계획이다. ➋ 자금공급 부문 (35%) 은 서민, 중‧저신용자 를 대상 으로하는 정책‧자체상품 공급실적 을 평가하여 적극적인 자금 공급을 유도한다. 특히, 단순히 양적 측면만 아니라 금리의 수준 , 성실상환자 혜택 등 질적 측면 과, 소외계층 대출실적 등을 다각적 으로 평가할 계획이다. ➌ 채무조정 부문 (35%) 은 신복위‧법원 채무조정 참여, 금융회사 자체적인 채무조정 및 개인연체채권 소각‧매각 실적 등을 평가 하여 상환이 어려운 차주 에 대한 금융권의 활발한 채무조정 을 유도한다. 특히, 자체 채무조정 의 경우 원리금 감면 정도 , 채무조정 이후 안정적으로 상환이 유지되는 정도 등 질적 측면 도 함께 평가하여 차주에 대한 실질적인 재기 지원 을 촉진 한다. ➍ 사회적배려 부문 (10%) 은 청년 미래적금 등 청년 전용 우대 예‧적금 취급실적 , 금리인하 요구권 수용율‧감면금액 등을 평가하여 청년의 자산형성 과 차주의 금리부담 경감 을 유도한다. ➎ 비금융서비스 부문 (10%) 은 금융‧고용‧복지 연계 지원 , 재무상담‧금융교육 실적 등 을 평가하여, 금융회사가 차주의 건전한 경제생활 을 돕는 종합 플랫폼으로 기능 하도록 유도한다. 이와 별도로 전체 배점의 10% 수준의 가점 을 운영하여, 은행의 자체적인 포용금융 추진 노력 을 정성평가 하여 반영한다. 평가결과 는 군별로 S‧A‧B‧C 등급 을 부여 하고, 이를 대외 공개 하여 기관 간 경쟁을 통한 자율 개선 을 유도한다. 또한, 평가결과 우수 (S)‧ 양호 (A) , 미흡 (C) 은행에 대해서는 서민금융진흥원 출연금 을 최대 20% 가중‧감경 하고, 우수(S)‧양호(A)한 경우 ｢금융소비자보호법｣ 위반에 따른 과징금 을 10% 이내로 감경 하며, 평가결과를 경영실태평가 에도 반영 하여 실질적인 인센티브‧페널티 를 통해 평가의 실효성을 확보 한다. ’26년도 실적 에 대한 평가 는 최초로 실시 되는 만큼, 시범운영 하여 평가 결과 우수기관 을 발표 하고, 차년도 평가 부터 인센티브‧페널티 를 적용 할 계획 이다. 평가결과 는 내년 3월에 보도자료 및 금감원‧은행연 홈페이지 에 게재한다. 평가지표 는 시장 여건 과 정책 수요 변화 에 따라 보완 이 필요한 만큼, 차년도 지표 는 직전 평가시 지표 의 합리성‧정책방향 및 현장‧전문가 의견 등을 고려하여 수정‧보완한 후 내년 6월 까지 차년도 평가지표 를 확정‧발표할 계획이다. 4 채무조정 추진 현황 및 정책 방향 이어서 두 번째 안건인 ‘채무조정 추진현황 및 정책방향’ 은 그간 채무조정 정책의 현황과 성과 를 점검 하고, 향후 방향 을 제시 하였다. 금융위원회와 금융권은 지난 1년간 성실상환자에 대한 신용회복 지원 (‘25.9월말), 새도약기금 출범 (’25.10월) , 새출발기금 지원 확대 등을 통해 경제 활력을 저해하는 취약계층·소상공인 의 연체채무 를 신속·과감 하게 조정 하였다. 또한, 장기 연체 를 양산 하는 구조 를 개선 하기 위해 ｢ 금융권 연체채권 관리 강화방안 ｣ (‘26.2월) 과 ｢ 매입채권추심업 개편방안 ｣ (’26.5월) 을 마련 하였다. 5대 금융지주 등 민간 금융권 도 정부의 노력에 부응하면서 자체 채무조정‧소각 * 실적 도 크게 증가하고 있다. * 5대 금융지주 자체 채무조정 실적 : [채무조정] : [’25.上] 1.65조원 → [’25.下] 2.66조원 → [’26.上] 2.27조원 [소각] : [’25.上] 4,073억원 → [’25.下] 4,708억원 → [’26.上] 15,211억원 앞으로 금융위원회는 ➊ 장기연체채무 , 코로나대응채무 등을 신속히 정리 하는 동시에, ➋ ‘ 재기 중심 ’의 연체채권 관리 원칙 이 현장 에 뿌리내릴 수 있도록 연체채권 관리체계 도 지속 적으로 보완 할 계획이다. ➊ 먼저, 대부업권 의 새도약기금 참여 및 민간 금융권 의 자발적 채무 정리 를 적극 유도 하는 한편, 코로나 시기에 어려움을 겪었던 자영업자·소 상공인 의 연체채무 에 대한 채무감면 등 적극적 채무조정 도 추진 할 계획이다. ➋ 또한, 공공부문이 ‘재기 중심’의 연체채권 관리를 선도할 수 있도록 금융공공기관 의 부실채권 관리체계 를 대폭 개편 한다. 또한, ｢금융권 연체 채권 관리 강화방안｣의 후속조치를 신속히 추진 하고 연체자의 경제적 재기 지원 을 위해 회생·파산 지원 , 금융-고용-복지 복합지원 등도 강화 할 계획 이다. 5 금융 공공기관 부실채권 관리 개선 방안 세 번째 안건인 ‘금융공공기관 부실채권 관리 개선방안’ 에서는 연체자 보호 및 재기 지원 을 위한 네 가지 정책 방향 이 제시되었다. 첫 째, 상환능력 중심 시효관리체계 로 전환 한다. 앞으로는 연체 후 5년이 경과 하여 최초 소멸시효가 도래 하는 시점에 상환능력 평가를 거쳐 상환능력이 없을 시 소멸시효 완성 을 원칙으로 한다. 기초생활수급자 등 사회적 취약 계 층 * 은 연체 금액과 관계없이 별도 심사 없이 시효를 완성한다. 연체 15년이 지나 2차 소멸시효가 도래한 채권 은 재산 은닉 등 특별한 사유가 없으면 소각 한다. * 기초생활수급자, 장애인연금수급자, 국가유공자로서 생계지원금 수급자 이러한 개선방안에 따라 기존에 누적된 부실채권도 정비 한다. 연체 15년 이상 장기 부실채권은 내년 하반기까지 단계적으로 정리 한다. 1차 시효가 도과 한 연체 5년이상 7년이하, 5천만원 이하의 부실채권에 대해서도 기관별 계획에 따라 심사를 거쳐 자체 소각하거나 캠코로 매각·정리 하여 상시 시효 관리 체계로 전환 한다. 단, 회수실익이 있는 재산이 있음에도 상환하지 않거나 재 산을 은닉한 경우 등 은 정비 대상에서 제외 하여 도덕적 해이를 방지 한다 . 둘째, 기관마다 달랐던 부실채권 관리기준을 통일 하고 금융공공기관 상각 채권의 캠코 일원화 관리를 강화 하여 같은 상황의 채무자 가 관리기관에 따라 다르게 처리되는 일이 없도록 개선 한다. 또한, 채무자 권익 보호 를 위한 추심·관리체계 개선 도 추진할 계획이다. 일부 공공기관은 부실채권의 추심을 민간 채권회사에 위탁 하고 있으나, 채무자의 재기를 지원하는 균형있는 추심에 한계 가 있었다. 이에 건전한 관리·감독 체계 를 갖춘 채권추심회사 에 공공기관의 추심업무를 위탁 할 수 있도록 하여 공공부문의 채무자 보호를 강화 한다. 셋 째, 골든타임 내 신속한 채무조정 을 추진한다. 그간 보증부대출은 보증 기관의 대위변제 (연체 후 3~6개월) 후 채무조정이 가능 해 재기의 골든타임 을 놓치는 경향이 있었다. 앞으로는 대위변제 전에도 채무조정 을 신청할 수 있도록 하고, 상각 이후에만 가능하던 원금 감면을 상각 전에도 허용 할 수 있도록 방안을 마련할 계획이다. 아울러, 금융공공기관이 적극적으로 채무조정과 채권정리 에 나설 수 있도록 경영성과지표를 개선 해 나가고, 면책근거 도 마련 하여 현장에 안착될 수 있도록 뒷받침 할 예정이다. 이번 방안은 관계기관 협의 와 기관별 내규개정 등 세부 시행방안을 마련 하여 ’26년 4분기부터 순차적으로 시행 할 계획이다 . 6 IBK형 포용금융 추진 방안 IBK기업은행장 은 제4호 안건 으로 「IBK형 포용금융 추진 방안」을 소개 하며, IBK기업은행은 소상공인·중소기업 및 금융소외계층을 대상으로 2030년까지 30조원 이상을 지원하는 ‘희망On-IBK 프로젝트’를 추진 한다고 밝혔다. 특히, 핵심 신사업으로 추진하는 ‘IBK 개인 신용 재도약 프로그램’ 은 단순한 자금공급을 넘어 금융취약계층 이 제도권 금융에 진입 하고, 신용을 회복 하여 정상 금융거래 고객으로 재도약 할 수 있도록 전 과정을 연계 지원 하는 IBK型 개인 포용금융 모델 로서 각 단계별로 금융사다리를 구축하고, 필요한 상품 및 제도를 연결해 금융취약계층의 실질적인 자립을 지원 한다. 또한, 중·저신용자의 금융비용 부담을 획기적으로 낮추기 위해 최대 2천만원을 10년간 연 4.9% 단일 고정금리로 지원하는 「착한금리 포용 금융 대출」을 총 1조원 규모로 공급 한다. 신용등급 중심의 획일적인 금융 지원 방식을 보완해 중·저신용자에게 필요한 자금을 장기간 안정적으로 공급하고, 비대면 플랫폼 연계를 확대해 접근성과 편의성도 높일 계획이다. 제도권 금융의 문턱을 넘기 어려운 금융소외계층 에 대한 지원 도 대폭 확대한다. IBK미소금융재단 에 최대 1,000억원 추가 출연 하여 청년·지방·미래 준비 고객에 대한 자금공급을 확대하고, 폐업 또는 실직 후 새로운 경제 활동을 준비하는 취약계층을 위한「IBK미래준비대출」도 새롭게 출시한다. 이와 함께 기존 포용금융 지원 도 지속 확대 한다. 금리 상승기 중소기업의 이자부담 완화를 위한 ‘1조원 규모의 ‘희망On 안심고정금리 대출’을 공급 하고, 성실상환 소상공인의 금리는 낮추고 한도는 높인 ‘ IBK 소상공인 더드림 패키지 ’ 를 총 8.5조원 규모로 종전 대비 1조원 추가 확대 했다. 채무상환에 어려움을 겪는 소상공인과 장기연체 차주에 대해서도 부실화 단계에 따른 맞춤형 채무조정과 재기지원을 강화할 예정이다. IBK기업은행은 앞으로도 금융취약계층 에 대한 단계별 지원을 촘촘히 연결 하는 ‘IBK型 금융사다리’를 구축 하여 포용금융의 실질적 성과를 확대 해 나갈 계획이라고 밝혔다. 7 주요 논의 내용 이어진 간담회 에서 금융연구원 이규복 박사 는 금융소비자보호의 관점 에서 금융회사는 연체자 역시 여전히 고객이라는 점 을 인식 하고, 고객이익최선의 원칙에 기반 하여 연체관리 와 추심업무를 수행 하는 것이 중요 하다고 강조 하였다. 또한 이러한 원칙에 따라 이번에 제시된 개선방안들이 충실히 이행 되어야 하고, 추가 개선방안이 지속적으로 검토될 필요가 있음을 강조하였다. 금융발전심위원회 임수강 박사 는 포용금융은 정부·민간의 확산 노력 으로 제도화 단계 에 들어섰고, 신용 접근성 확대 와 과중채무 문제의 처리 등 을 제도로 구현 해야 한다고 하였다. 이러한 측면에서 금융공공기관이 부실채권 관리 개선 을 선도하는 방향 은 바람직 하며, 공공부문의 채무자를 과잉 추심에서 보호 하기 위해서는 민간기구의 수익성 우선 유인을 통제할 필요 가 있다고 지적 하였다. 오윤해 한국개발연구원 박사 는 장기연체채권 정리 와 함께 연체 초기의 채무조정, 신용회복·고용·복지의 연계를 강화 하고 금융공공기관 관리 관 행을 개선 하는 정책 방향 을 긍정적으로 평가 하였다. 다만, 채무정리 대 상 의 상환능력에 따른 선별을 정교화 하고, 금융공공기관의 경우 기간 기준이 단순한 시간 경과 에 따라 기계적으로 적용되지 않도록 운영 할 필요가 있다고 언급 하였다. 이와 함께 성과평가 도 회수·소각 규모 자체 보다 적기의 조정·정리 여부를 중심으로 설계 할 필요가 있다고 제언하였다. 유순덕 롤링주빌리 이사 는 장기연체채권은 현재의 상환능력 과 실제 회수실익을 중심으로 심사 하되, 법적조치가 남아 있는 경우 에도 정리 필요성을 충분히 검토해야 한다 고 하며, 소각 요건을 충족한 채권은 보유기관에서 신속히 종결 하고, 캠코로 이관된 채권 도 정기심사 및 명확한 처리기한 을 통해 채무정리 와 재기 지원으로 이어지도록 해야 한다고 강조 하였다. 홍석린 KPMG 부대표 는 취약차주에 대한 선제적 채무조정, 공공기관 연체 채권 관리방안의 방향성 에 대해 깊이 공감 하고, 지속적으로 추진하여 국민 들이 체감 할 수 있는 성과 가 나오길 기대한다고 하였다. 아울러, 민간 금융회사들이 포용금융에 보다 적극적으로 나설 수 있는 시장 친화적 인센티브 구조도 마련 되는 것이 필요 하다고 언급하였다. 은행연합회 우상현 전무 는 포용금융 종합평가체계 도입을 통해 포용금융 을 금융시스템 전반에 내재화 한다는 취지에 공감 하며, 포용금융이 은행업무 전반에 자연스럽게 정착될 수 있도록 은행별 특성을 고려한 균형잡힌 평가체계 마련 이 필요하다고 하였다. 또한, 은행연합회 가 은행권의 다양한 의견을 수렴 하고 금융당국 과 긴밀히 소통 하면서 포용금융 평가체계 의 정착 에 노력 하겠다고 언급했다. 금융감독원 곽범준 부원장보 는 오늘 발표한 ‘포용금융 종합평가체계 ’가 은행의 포용금융 노력과 실질적 성과를 종합적으로 평가하는 첫 걸음 으로서 포용금융의 안착 을 촉진 하는 정책 이 되기를 기대하고 있다고 언급했다. 또한, 금감원은 평가지표 고도화 와 인센티브 방안 을 차질없이 추진 하여 포용금융 종합평가가 은행의 포용금융 확대에 기여 할 수 있도록 노력하겠다고 밝혔다. 이억원 금융위원장 은 “오늘 회의가 포용적 금융 대전환을 향해 한걸음 더 나아가는 의미있는 자리 ”라고 언급하면서, “포용적 금융으로의 대전환은 금융의 본질이 무엇인지를 찾아가는 과정 이자 금융 패러다임을 재설계 하는 체질 개선의 문제 인 만큼 한번의 회의나 대책으로 달성되기는 어렵다”고 발언 하였다. “앞으로도 정부 뿐만 아니라 금융권‧공공기관 등 모든 주체들의 끊 임없는 관심과 노력, 유기적 협력 을 당부 드린다”고 하며 회의를 마무리했다. ※ 붙임1. 이억원 금융위원장 모두발언 붙임2. (안건➊) 포용금융 종합평가체계 도입방안 붙임3. (안건➋) 채무조정 추진 현황 및 정책 방향 붙임4. (안건➌) 금융공공기관 부실채권 관리 개선 방안 붙임5. (안건➍) IBK기업은행의 포용적 금융 확대 방안", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": " 빗썸 등 주요 가상자산사업자들에 대한 해킹사고에 대해 긴밀하고 신속하게 대응하고 있습니다. -「가상자산업권 등 침해사고 관련 긴급점검 회의 개최」", "department": "금융안전과", "date": "2026-10-28", "url": "https://www.fsc.go.kr/no010101/88010", "summary": "빗썸 등 주요 가상자산사업자들에 대한 해킹사고에 대해 긴밀하고 신속하게 대응하고 있습니다. -「가상자산업권 등 침해사고 관련 긴급점검 회의 개최」- ’26.10.28.(수) 금융위원회는 유영준 디지털금융정책관 주재로 금감원, 금보원, DAXA, 빗썸 등과 함께 주요 가상자산업권의 침해사고 관련하여 긴급 점검회의 를 개최 하였다. 빗썸 측 은 지난 외부의 비정상적인 접근으로 빗썸· 자회사·협력업체 등의 임직원 정보가 유출된 정황 을 확인하였으며, 이용자 정보 유출 여부 등에 대해서는 현재 확인중 에 있다고 보고하였다. 아울러, 가상자산 거래와 관련한 핵심 전산시설이 아닌 임직원의 업무를 지원하는 시스템 이 침해 받은 것으로, 가상자산지갑 주소 등 부정결제·가상자산 이전 등에 활용될 수 있는 정보유출 은 아직까지 확인되지 않은 것 으로 보고하였다. 금융위·금감원·금보원 은 즉시 현장조사 착수 , 관계기관 간 신속한 정보공유 및 긴밀한 협력 을 수행하고 있으며, 사고원인 파악에 만전을 기할 것 이라고 밝혔다. 무엇보다 소비자 피해 가 발생하지 않도록 철 저히 점검 해나갈 예정이며, 피해가 발생한 경우 에는 전액배상 등 소비자 보호 조치 가 이루어질 수 있도록 관리·감독 할 계획이다. 아울러, 금융위는 가상자산업권 등 현재「 전자금융거래법」이 적용되지 않는 업권 에 대해서도 은행 등 주요 금융회사 수준으로 보안조치를 강화 하고 사 고발생시 신속한 대비태세 를 갖출 수 있도록 다각적인 방안을 추진 해나갈 계획이라고 밝히면서, 최근 사고신고가 접수 된 미래에셋생명·자산운용 , 사 고조사 과정에서 고객 정보유출이 추가로 확인 된 대신증권 등 제2금융권 주요 금융회사 등에 대해서도 금감원·금보원 등을 통해 면밀한 사고조사 와 피해자 보호 조치에 만전을 기해 나갈 예정이라고 하였다.", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": true, "tier": "routine"}, {"source": "FSS", "title": "빗썸 등 주요 가상자산사업자들에 대한 해킹사고에 대해 긴밀하고 신속하게 대응하고 있습니다.", "department": "디지털금융총괄국/IT검사국/가상자산감독국", "date": "2026-10-28", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=246843&menuNo=200218&pageIndex=1", "summary": "ㅁ ’26.10.28.(수) 금융위원회는 유영준 디지털금융정책관 주재로 금감원, 금보원, DAXA, 빗썸 등과 함께 주요 가상자산업권의 침해사고 관련하여 긴급 점검회의를 개최하였다.\nㅁ 금융위,금감원,금보원은 즉시 현장조사 착수, 관계기관 간 신속한 정보공유 및 긴밀한 협력을 수행하고 있으며, 사고원인 파악에 만전을 기할 것이라고 밝혔다. 무엇보다 소비자 피해가 발생하지 않도록 철저히 점검해나갈 예정이며, 피해가 발생한 경우에는 전액배상 등 소비자 보호 조치가 이루어질 수 있도록 관리,감독할 계획이다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSS", "title": "미공개중요정보를 이용한 내부자등에 대한 중대범죄수사청 고발, 통보 등 조치(2건)", "department": "조사2국", "date": "2026-10-28", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=247026&menuNo=200218&pageIndex=1", "summary": "ㅁ 증권선물위원회는 제19차 정례회의(’26.10.28일)에서 (1) 경영권 변동을 수반하는 대규모 유상증자 정보를 이용하여 부당이득을 취한 유상증자 참여자 등을 「자본시장과 금융투자업에 관한 법률」상 미공개중요정보 이용행위 금지 위반 혐의로 중대범죄수사청(이하 ‘중수청’)에 고발,통보 조치하였으며, (2) 상장회사 주식 및 경영권 양수 법인의 임원과 정보수령자를 미공개중요정보 이용 행위 금지 위반 혐의로 중수청에 통보하고, 미공개중요정보를 전달받아 이용한 2차 정보수령자를 시장질서 교란행위 혐의로 과징금 부과 조치하였습니다.\n※ 자세한 내용은 첨부파일을 참고하시기 바랍니다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSS", "title": "사업보고서 등에 대한 조사, 감리결과 조치", "department": "회계감리2국", "date": "2026-10-28", "url": "https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=247035&menuNo=200218&pageIndex=1", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": " 사업보고서 등에 대한 조사·감리결과 조치 - 제19차 증권선물위원회(’26.10.28.) 조치 의결", "department": "회계제도팀", "date": "2026-10-28", "url": "https://www.fsc.go.kr/no010101/88013", "summary": "사업보고서 등에 대한 조사·감리결과 조치 - 제19차 증권선물위원회(’26.10.28.) 조치 의결 증권선물위원회 (위원장: 신진창) 는 10월 28일 제19차 회의에서, 회계처리 기준을 위반 하여 재무제표를 작성·공시한 ㈜피델릭스 에 대하여 감사인지정 등의 조치를 의결하였습니다. 한편, ●●●● ㈜ 에 대한 중요한 감사절차를 위반 하여 감사업무를 수행한 현대회계법인 과 동일이사 연속감사업무제한 등 「주식회사 등의 외부감사에 관한 법률」을 위반 한 위드회계법인 에 대하여 감사업무제한 등의 조치를 결정 * 하였습니다. * 증선위는 감사인 및 소속 공인회계사 에 대한 한국공인회계사회(위탁감리위원회)의 조치 의결결과를 원안대로 접수 ※ (붙임) 조사·감리결과 지적사항 및 조치내역", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "FSC", "title": "미공개중요정보를 이용한 내부자등에 대한 중대범죄수사청 고발·통보 등 조치(2건)  - 제19차 증권선물위원회(10.28.) 의결", "department": "자본시장조사총괄과", "date": "2026-10-28", "url": "https://www.fsc.go.kr/no010101/88012", "summary": "미공개중요정보를 이용한 내부자등에 대한 중대범죄수사청 고발·통보 등 조치 (2건) - 제19차 증권선물위원회(10.28.) 의결 - [ 조치개요 ] 증권선물위원회 (위원장: 신진창) 는 제19차 정례회의 ( ’ 26.10.28일) 에서 ⑴ 경영권 변동을 수반하는 대규모 유상증자 정보 를 이용 하여 부당이득을 취한 유상증자 참여자 등을 「자본시장과 금융투자업에 관한 법률」상 미공개 중요정보 이용행위 금지 위반 혐의로 중대범죄수사청(이하 ‘ 중수청 ’ )에 고발·통보 조치 하였으며, ⑵ 상장회사 주식 및 경영권 양수 법인의 임원과 정보수령자를 미공개중요정보 이용 행위 금지 위반 혐의로 중수청 에 통보하고, 미공개중요정보를 전달받아 이용한 2차 정보수령자를 시장질서 교란행위 혐의로 과징금 부과 조치하였습니다. ※ 두 건은 별개의 사건으로, 각각에 대해 개별적인 조치가 이루어진 것임 ◈ 자본시장법에서 금지하는 미공개중요정보 이용행위 는 내부자 가 상장법인의 업무 등과 관련된 미공개중요정보 를 특정증권 등의 매매, 그 밖의 거래에 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §174) 를 말합니다. ◈ 또한, 시장질서 교란행위 는 미공개중요정보 이용행위를 한 자들로부터 해당 미공개중요정보를 전달받은 자 들이 이를 알면서도 해당 상장증권 등의 매매, 그 밖의 거래에 해당 정보를 이용 하거나 타인에게 이용하게 하는 행위 (자본시장법 §178의2①) 를 말합니다. [ (1) 경영권 변동을 수반하는 제3자 배정 유상증자 정보에 대한 미공개 중요 정보 이용 행위 ] 상장사 A 의 경영권 변동을 수반하는 대규모 유상증자 참여자(상장사 E사 및 관계사 임직원 등)와 이들의 지인들 은 유상증자 관련 미공개 중요정보 를 직무상 지득 또는 전달받은 후, 이를 이용하여 약 12.5억원의 부당이득을 취득한 혐의 가 있습니다. 이들은 유명인의 대규모 유상증자 참여 사실, 제3자 유증에 따른 경영권 변동, 재무상태 개선 및 여유 자금을 통한 신사업 추진 가능성 등이 주가를 크게 상승시킬 것이라는 기대하에 해당 미공개중요정보를 이용‧전달한 것으로 파악되었습니다 . 금융위원회는 해당 혐의자들에 대한 압수수색 을 실시한 후 디지털 포렌식 분석과 문답 과정 등을 종합하여 관련 정황을 확인했습니다. \u003c 사건 개요 > [ (2) 상장회사 경영권 양수법인의 임직원 등의 미공개중요정보 이용 및 시장질서 교란행위 ] 주식 양수도 및 유상증자를 통해 상장회사 I 의 경영권을 양수 하기로 한 J법인의 사내이사 K 는 I사에 대한 경영권 양수도 계약 관련 미공개정보 를 지인 L (1차 정보수령자) 에게 전달 하여 I사 주식 매매에 이용 하게 하였고, L은 동 미공개정보를 이용하여 I사 주식을 매매하고, 친인척 M, N, O (2차 정보수령자) 에게 미공개정보를 전달 하여 이용하게 함 으로써 1억원 상당 의 부당이득 (정보전달자 및 1차 정보수령자) 을 취득하는 등 미공개정보 이용행위를 한 혐의가 있습니다. 또한, 2차 정보수령자인 M, N, O는 L로부터 전달받은 미공개정보를 이용하여 I사 주식을 매매함으로써 1억원 상당의 부당이득 을 취득하여 시장질서 교란행위 를 한 혐의가 있습니다. \u003c 사건 개요 > [ 유의사항 ] 회사의 임직원 뿐 아니라 회사와 계약을 체결하고 있거나 체결을 교섭하고 있는 자 (그 자가 법인인 경우에는 임직원 포함) 도 그 직무와 관련하여 알게 된 미공개중요정보를 이용하거나, 타인에게 이용하게 하는 경우 자본시장법 위반으로 1년 이상의 유기징역 또는 벌금 (부당이득의 최대 6배) 등 형사처벌을 받을 수 있습니다. 또한 1차 정보수령자로 부터 미공개정보 를 전달받아 이를 이용 하여 거래 하는 행위 역시 자본시장법상 ‘ 정보이용형 시장질서 교란행위 ( §178조의2①) ’ 에 해당 하는 행위로서, 그 부당이득 의 최대 1.5배 에 상당 하는 금액의 과징금 이 부과될 수 있음을 각별히 유의하시기 바랍니다. 앞으로도 금융위원회와 금융감독원은 미공개정보 를 이용 한 자본시장 불공정거래 행위에 대해 엄정 하게 대응 해 나갈 예정이니, 관련 법규 준수 와 내부통제 강화 를 통해 불공정거래 행위가 발생하지 않도록 만전을 기해 주시길 당부드립니다. ※ 수 사에 미치는 영향 등을 고 려하여 조 치대상자 및 종목명은 공표하지 않습니다. 본 조치 사안과 관련한 문의는, 금융위원회 자본시장조사과 또는 금융감독원 조사국으로 해주시길 바랍니다. \u003c 자본시장 불공정거래 신고 > ☞ 금융위원회 ‣ 인터넷 : 금융위원회 홈페이지 tial": false, "importanceReasons": ["statistics / advice (-2)"], "market": true, "tier": "routine"}, {"source": "MOFE", "title": "'26.9월 및 3분기 산업활동동향 및 평가", "department": "경제분석과", "date": "2026.10.30.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079806&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "MOFE", "title": "한-독일 이중과세방지협정 개정의정서 서명", "department": "국제조세제도과", "date": "2026.10.30.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079805&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "퇴직연금 기능강화를 위한 노사정 합의로 노동자의 든든한 노후소득 보장체계 구축", "department": "자산운용과", "date": "2026-10-30", "url": "https://www.fsc.go.kr/no010101/88027", "summary": "퇴직연금 기능강화를 위한 노사정 합의로 노동자의 든든한 노후소득 보장체계 구축 - ’26.2.6. 노사정 공동선언을 구체화한 ｢퇴직연금 기능강화 방안｣ 발표 - ▴全 사업장 퇴직급여 사외적립 단계적 의무화 ▴장기적립 및 연금수령 촉진 ▴기금형 퇴직연금 활성화 ▴계약형 퇴직연금 제도개선 정부는 10.29.(목) 기후에너지환경노동위원회 당정협의를 거쳐 관계부처 합 동으로 ｢퇴직연금 기능강화 방안｣ 을 발표했다. * 10.28.(수) 경제관계장관회의에도 관계부처 합동 안건으로 상정‧논의 '26.2.6. 퇴직연금에 대한 최초의 노사정 공동선언 은 퇴직연금 기능강화를 위한 핵심과제의 방향성 을 제시 했다. 이번 방안은 노사정 공동선언의 내용을 구체화한 것으로 全 사업장 퇴직급여 사외적립 의무화 및 기금형 퇴직연금 활성화 를 통해 노동자의 든든한 노후소득 보장체계를 구축 하는 것이 핵심이다. 먼저, 퇴직급여 사외적립 의무화 는 임금체불의 구조적 위험을 낮추는 가장 효과적이고 확실한 수단 이다. ’25년 기준 체불액 중 퇴직금 이 차지하는 비중은 41.1% (8,229억원) 로 사외적립 의무화 가 현장에 조속히 안착 되면 체불 예방 효과 를 달성할 수 있을 것으로 보인다. 기금형 퇴직연금제도 는 전문성을 가진 제3자 (수탁법인)가 적립금을 대신 운용 하고, 수익과 손실 은 가입자에게 귀속 되는 제도이다. 기금형 퇴직연금활성화로 자신의 적립금을 직접 운용하기는 어렵지만 안정적인 수익률 을 원하는 노동자들의 선택권이 확대 될 전망이다. 다만, 기존 계약형 퇴직연금의 낮은 수익률 문제를 보완하면서도 수급권을 보호하기 위해서는 정부의 면밀한 관리‧감독 과 엄격한 수탁자책임 이 요구된다. 두 가지 핵심과제를 포함한 ｢퇴직연금 기능강화 방안｣의 주요 내용은 다음과 같다. 1. 보편성 제고 : 全 사업장 퇴직급여 사외적립 단계적 의무화 정부는 퇴직연금 미도입 사업장 1,500개소 대상 실태조사 결과 를 바탕으로 노사정 이 합의 하여 퇴직급여 사외적립 단계적 의무화 방안 을 확정 했다. 연 내 ｢근로자퇴직급여보장법｣ 개정안이 통과될 경우 1년 간의 준비기간을 두고, ’28년 100인 이상 사업장 부터 ’29년 10~99인 사업장, ’30년 10인 미만 사업장 까지 3단계 로 나누어 모든 사업장 의 퇴직급여 사외적립 이 의무화 된다. 이때, 사외적립 의무는 각 단계 시행 시점 이후 발생하는 계속근로기간 부터 적용된다. 실태조사 결과 사업주는 퇴직연금 납입금 에 대한 한시적 정부지원 , 정책자금 융자나 보증금리 한시 우대 등이 필요하다고 응답한 점을 감안하여 ’27년 정부안에 자율적 우선 도입 사업장 에 대한 적립금 매칭지원 (60억원) , 경영 자금 융자비용 보전 사업 (62억원) 을 신규 편성 했다. 영세 사업장 대상 수수료 특례 적용, 사용자의 규약신고 의무도 간소화 한다. 사외적립 의무 확행을 위해 확정급여형(DB) 적립금 미충족 사업장 대상 정기감독 을 지속 확대 (’26.下 500개소) 하고, 확정기여형(DC) 부담금 미납 현황파악 체계 도 구축 한다. 2. 연금수령 촉진 : 장기적립 후 노후자금으로 연결 노동자가 중도인출 대신 활용할 수 있도록 담보 대출상품 출시 를 위한 제도개선 과 함께 다양한 연금상품 을 출시 하고, 기대수익‧수령액 등 연금-일시금 비교정보 사전제공 을 의무화 한다. 퇴직급여 수령단계에서도 일시금 수령의사를 제시하지 않을 경우 자동적으로 연금으로 지급 하도록 해 연금 수령 유인을 높인다 . 아울러, 분리과세 한도 확대 (’24.1.1.~, 1,200 → 1,500만원) 등 그간의 세제지원 효과를 점검 하여 추가 세제지원도 검토 해나갈 예정이다. 온라인 퇴직연금 교육 콘텐츠를 제작‧확산 하고, 퇴직연금사업자 평가 를 정량지표 중심으 로 개편하여 평가 결과를 투명하게 공개 하는 등 인식 제고 노력 도 지속 한다. 3. 전문성 강화를 통한 적정 수익률 확보 : 기금형 퇴직연금 활성화 기금형 퇴직연금 제도는 ’26.2.6. 노사정 공동선언문에 명시된대로 수탁 법인 설립 주체 를 기준으로 ① 금융기관 개방형 (금융회사 단독 또는 컨소시엄, 영리형 주식회사) ② 연합형 (복수 사용자 또는 전국단위 노사단체 연합, 비영리 법인) ③ 공공기관 개방형 (중소기업퇴직연금기금 (이하 ‘중퇴기금’) 등, 공공기관) 세 가지 유형 으로 나뉜다. 기금형 퇴직연금제도는 확정기여형(DC) 과 개인형퇴직연금제도(IRP) 에 적용되며, 한 사업장 내에서 계약형과 기금형 퇴직연금 을 복수 설정 하거나 다수의 기금형 퇴직연금 을 설정 할 수 있다. 또한, 근로자대표의 동의 를 얻어 특정 기금형 퇴직연금 을 기본값(디폴트)으로 설정 하는 것도 가능하다. 기금형 퇴직연금 수탁법인이 되기 위해서는 노사, 전문가, 정부 등으로 구성된 인가위원회 의 심의 를 거쳐 고용노동부장관의 인가 를 받아야 한다. 기금의 난립을 방지하고, 규모의 경제를 유지하기 위해 예비인가-본인가 의 2단계 구조 로 구성된다. 인가요건은 인적‧물적‧재무요건 으로 나뉘며, 재무 안전장치로 일정 규모 이상의 최소자본금 요건 을 설정 할 예정이다. 기금형 퇴직연금 제도는 제3자가 운용한다는 점에서 정보 비대칭, 도덕적 해이 등 대리인 문제 가 발생할 소지가 있고, 적립금은 후불임금 인 퇴직급여인만큼 수탁법인에 강력한 수탁자책임 을 부여 한다. 법률에 가입자 이익 최우선의 원칙 을 규정하고, 의무위반 시 수탁법인의 손해배상책임 및 가입자의 손해배상청구권을 명시 한다. 운용 , 이해상충 관리 , 설명의무 위반 등 핵심 영역에 한해 입증책임을 전환해 수탁법인이 의무위반과 손실 간 인과관계 또는 고의과실이 없음을 입증 하는 경우에 손해배상 책임이 면책 된다. 또한, 가입자의 손실보전과 사고 대응‧복구에 활용할 수 있는 운영위험준비금 을 의무 적립 하도록 한다. 투자가능 상품 을 포지티브 방식 으로 제시하고, 분산투자‧이해상충 방지 를 위한 자산운용규제 도 마련한다. 자산보관 , 기준가 산출 등 업무는 의무위탁 * 하도록 해 가입자 보호를 위한 교차검증 체계 를 구축하고, 투자정책 결정 등 핵심업무 는 위탁하지 못하도록 해 책임소재 를 수탁법인으로 명확히 한다. * 일본 연기금 전문 대형 운용사인 AIJ는 10년 넘게 연평균 10% 수익률을 기록했다고 허위 보고 → 총 운용자산의 약 2,100억엔 중 90% 손실 수탁법인의 성과 를 평가 하고, 그 결과 를 공시 해 건전한 경쟁을 유도하고, 과도한 수수료 책정 은 통제 한다. 제재처분 권한 은 주무부처인 노동부 에 두되, 각 기관의 전문성 을 감독 전 과정에 반영 할 수 있도록 관계부처 협력체계 (감독협의회 등) 도 마련한다. 중퇴기금 가입대상을 ’28.1월 300인까지 확대 하고, 퇴직급여 사외적립 의무화 이후 미도입 사업장에 대해 자동가입제도 를 도입하되, 일정 기간 내 탈퇴 할 수 있는 선택권을 보장 한다. 중퇴기금 대상 확대 및 적립금 증가에 발맞추어 직접 운용역량 및 내부통제를 강화 하고, 중장기적으로 별도의 수 탁법인 설립 을 검토 할 예정이다. 4. 계약형 퇴직연금 제도개선 기금형 퇴직연금제도 도입‧활성화와 병행해 계약형 퇴직연금제도 도 개선 한다. 퇴직연금 시장규모 , 변동성 을 감안하여 현재 70%인 개인형퇴직연금제도 (IRP)의 위험자산 투자 한도 를 단계적으로 완화 하고, 확정급여형 (DC)· 개인형퇴직연금제도 (IRP)‧ 중퇴기금 의 투자가능상품을 확대 한다. * 원리금보장형 대비 수익이 높고 안정적인 종합투자계좌(IMA)‧발행어음 등을 DC‧IRP 투자대상에 추가, 중퇴기금의 중기부 LP성장펀드 출자 허용 디폴트옵션(사전지정운용제도) 상품 평가를 통해 질 낮은 상품을 퇴출하는 등 수익률 중심 으로 재편 하고, 적용시점과 범위를 확대해 대기성 운용기간 을 축소 한다. 확정급여형(DB) 적립금운용계획서(IPS)의 실효성 확보를 위해 운용현황 등에 대한 공시 도 단계적으로 추진 한다. 이를 위해 ｢근로자퇴직급여 보장법｣ 개정안을 11월 중 마련 하고, 연내 국회 본회의 통과를 추진 할 계획이며, 법 시행으로 노동자의 든든한 노후소득 보장에 기여 할 수 있을 것으로 기대된다. 김영훈 고용노동부 장관은 “퇴직연금 기능강화 방안은 노사정이 함께 머리를 맞대어 도출한 사회적 합의의 결과물 로, 노후 소득의 안정성과 수익성 간의 균형을 맞춰 노동자의 노후를 든든하게 지켜내는 제도적 기반을 세운 것” 이라고 강조하면서, “개정 법안이 12월 국회 본회의에서 통과될 수 있도록 입법 추진에 총력 을 기울이고, 의무화 일정에 맞춰 현장 지원체계를 빈틈없이 구축 하겠다”고 말했다.", "essential": false, "importanceReasons": [], "market": false, "tier": "routine"}, {"source": "FSC", "title": "국민성장펀드가 국내 최대 태양광 발전소 건설과 반도체 밸류체인 경쟁력 강화를 지원합니다.", "department": "국민성장펀드총괄과", "date": "2026-10-30", "url": "https://www.fsc.go.kr/no010101/88028", "summary": "국민성장펀드가 국내 최대 태양광 발전소 건설과 반도체 밸류체인 경쟁력 강화 를 지원합니다. • 10월 국민성장펀드 기금운용심의회, 약 1.0조원 규모 4건 사업 승인의결 ① 국내 최대 태양광 발전소 건설 지원 (해남희망에너지(주)) 으로 첨단전략산업 전력 공급 ☞ 국내 발전설비 경쟁력 강화 및 태양광 산업생태계 성장 유도 ② 반도체 전공정 장비 (피에스케이(주)) 및 시스템 반도체 테스트 (하나마이크론(주) ) 공 장 건설 지원 ☞ 수주대응력을 강화 하고, 반도체 밸류체인 경쟁력 강화 ③ 차세대 혈액제제 개발 을 위한 R&D 및 생산설비 증축 지원 ((주)녹십자) ☞ 차세대 혈액제제 시장 진출 확대를 위한 발판 마련 • 누적 총 39건 , 22.3조원 승인 (간접투자펀드 결성액 포함) 완료 ☞ 현재 모집중인 간접투자 규모 고려시 ‘26년 승인목표 (30조원) 달성 기대 • 국민성장펀드 지원 대상에 “우주항공·양자” 추가 추진중 (10.22일, 입법예고) ☞ 전략적 중요성 이 높고 대규모·장기투자가 필요 한 첨단전략산업 지원 【관련 국정과제】 46-1번, 진짜 성장을 위한 생산적 금융(국민성장펀드 100조원+@ 신설) 1 승인 개요 금융위원회 는 `26.10.29일 개최된 국민성장펀드 기금운용심의회에서 ‘태양광 발전’ 인프라 등 총 4건에 대한 자금지원을 승인 하였다고 밝혔다. \u003c 10월 기금운용심의회 승인의결 주요내용 > 분 야 금액 주요 의의 해남 태양광 발전 인프라 6,846억원 (기금 1,000억원) - 국내 최대 태양광 발전소 피에스케이 대출 1,400억원 (기금 1,200억원) - 반도체 전공정 장비 설비 확대 녹십자 대출 1,700억원 (기금 1,700억원) - 차세대 혈액제제 개발 지원 하나마이크론 대출 500억원 (기금 500억원) - 시스템 반도체 테스트 공장 건설 이번에 승인된 태양광 발전 인프라 투융자 는 “국내 최대 (400MW) ” 태양광발전소를 해남에 건설 (인프라금융, 6,846억원) 하여 20년간 운영 하는 사업이다 . 그 외 피에스케이의 반도체 전공정 장비 설비 확대 지원 (대출, 1,400억원) , 녹십자 차세대 혈액제제 개발 지원 (대출 1,700억원) , 하나마이크론 시스템 반도체 테스트 공장 건설 (대출 500억원) 지원도 승인 의결되었다. 이번에 승인된 4건 안건은 지난 9월 신설된 “리스크관리위원회” 의 첫 논의를 거쳤다. 리스크관리위원회는 외부 전문가 중심으로 구성되어 금융·비금융 리스크 전반을 독립적으로 검토 하고, 검토내용은 투자심의위원회와 기금운용 심의회에 제공함으로써 균형 잡힌 의사결정 을 돕는 기능을 한다. 리스크관리 위원회 는 국민성장펀드의 사업선정, 안건검토 과정에서 발생할 수 있는 잠재리스크를 사전적으로 모니터링 하는 역할을 수행할 것으로 기대된다. 한편, 이번 지원 포함하여 국민성장펀드 는 10월말까지 간접투자펀드 결성 액을 포함하여 총 22.3조원의 자금지원을 승인 했다. 4분기 결성이 완료될 것으로 보이는 간접투자방식의 결성액을 감안하면, 국민성장펀드 올해 승인 목표인 30조원 승인 (결성) 을 조기 달성 할 것으로 전망된다. ☞ 별첨 : 국민성장펀드 지원 현황(8p) 2 안건 ➊ : 전략산업 전력대응을 위한 국내 최대 태양광 발전 사업 (1) 의결내용 : 인프라투융자 1,000억원 해남 태양광 발전사업 은 한국남동발전 등의 사업자가 전남광주시 해남군 일원에 400MW급 국내 최대 규모 태양광 발전소를 건설·운영 하는 사업이다 . 생산된 전력은 한국남동발전에 20년간 판매 되며, 한국남동발전은 동 전력을 반도체 산업을 영위중인 첨단기업 등에게 판매 한다. 총 사업규모 6,846억원 중 첨단전략산업기금은 PF대출로 1,000억원 을 지원 하고, 민간금융기관 및 발전사가 5,846억원을 부담한다. (2) 투자결정의 의의: 국산 최대 태양광 (400MW) 발전사업에 따른 첨단전략산업(반도체) RE100 달성 지원 해남 태양광 발전사업 * 은 단일 육상 태양광 단지 기준으로 “ 국내 최대 규모” 태양광 발전 사업 으로 정부의 탄소중립 목표 달성에 기여하고 에너지 전환의 선도적 역할을 수행할 것으로 기대된다. 동 발전사업은 그간 소규모 분산형으로 산발적으로 조성되던 방식에서 벗어나, 단일 기준 초대형 전원개발사업으로 추진되면서 국내 재생에너지 보급확대에 선도적 사례가 될 것으로 기대된다. 한편, 국내 태양광 모듈 및 인버터 등 주요 자재의 100% 국산 발전 설비를 사용 하는 점도 특징이다. 한화솔루션이 제조한 태양광 모듈 및 OCI파워가 제작한 인버터가 사용되어 국내 발전설비 경쟁력 강화 및 생태계 동반성장 에도 기여할 것으로 예상된다. * 국내 태양광 발전시장은 최근 빠르게 성장하고 있으며, 정부도 ‘26.5월 “제1차 재생 에너지 기본계획”을 통해 ’30년까지 재생에너지 100GW 보급 목표를 발표하고, 태양광 보급 확대를 핵심 과제로 선정 아울러, 이번 해남 태양광 발전사업 지원을 통해 확보된 전력은 반도체 산업을 영위중인 첨단기업 등에게 공급(직접PPA 계약) 된다. 반도체 제조 공정 은 막대한 전력을 소비하기 때문에 RE100 전력을 대규모로 조달하기가 어려웠으나, 이번 장기계약을 통해 반도체 기업의 온실가스 배출권 부담 완화 및 RE100 * 달성 추진 에 기여할 것으로 기대된다. * 주요 기업들이 ‘50년까지 필요 전력의 100%를 재생에너지로 전환하려는 캠페인 3 안건 ➋ : 피에스케이(주) 반도체 전공정 장비 생산공장 투자사업 (1) 의결내용 : 대출 1,400억원 피에스케이 (주)는 반도체 식각공정에 주로 쓰이는 스트립 장비 * (Dry Strip) 분야에서 세계 점유율 1위 인 국내 대표 반도체 전공정 장비 생산 기업 으로 국내 반도체 기업 뿐만 아니라 미국 등 주요 글로벌 반도체 기업에 대해 장비를 공급하고 있다. * 반도체 웨이퍼 위에 바르는 포토레지스트(감광액)의 잔여물을 벗겨내는 장비 동사는 최근 AI 반도체 수요 증가에 따른 장비 수주량 증가에 대응하고 기술 개발 역량 강화를 위해 경기도 용인 반도체 클러스터 내 반도체 전공정 장비 생산공장 구축 을 추진한다. 이를 위해 동사는 약 1,819억원의 자금을 투자(시설자금과 연구개발 자금 등)할 계획이며, 이중 419억원은 자체자금으로 1,400억원은 첨단전략산업기금과 민간으로부터 대출 을 통해 조달한다. (2) 투자결정의 의의: 반도체 장비 산업 경쟁력 제고 글로벌 반도체 장비 산업 은 미국, 일본, 네덜란드, 중국 등이 주도하고 있으며 , 반도체 공정이 점차 정밀화됨에 따라 반도체 장비의 중요도는 지속적으로 확대 되 고 있다. 반도체 장비 시장은 ‘22년 791억 달러에서 연평균 7.6% 성장하여 ‘31년에는 1,533억 달러에 달할 것으로 전망된다. 미국 은 반도체지원법과 인플레이션감축법 등을 통해 반도체 공급망에 대한 지원을 강화 하고 있으며, 중국 도 “중국제조 2050 정책” 을 통해 첨단산업의 소부장 자급률을 높이는 정책을 추진중이다. 피에스케이는 Dry Strip 장비 세계 점유율 1위를 유지중이나, 중국계 기업들이 가격경쟁력과 기술력을 바탕으로 추격중으로 중장기적인 경쟁 심화가 예상 된다. 이번 투자를 통해 동사가 글로벌 반도체 장비 시장에서 주도권을 확보 하고, 공급 안정성을 확보 함으로써 국내 반도체 장비 산업의 기반을 강화할 것으로 기대된다. 동사는 국내 반도체 밸류체인의 핵심 앵커역할을 담당하는 기업으로서 국산 핵심 부품의 비중이 50% 가 넘 고(전방연관효과), 삼성전자, SK하이 닉스를 비롯한 국내 반도체 제조기업 (후방연관효과)뿐만 아니라 미국, 유럽 , 중국 등의 기업에도 제품을 수출 하고 있는 기업이다. 이번 대규모 전공정 장비 생산공장 투자를 통해 메모리 반도체 수출 위주 인 국내 반도체 생태계를 반도체 장비까지 확장 하여 국내 반도체 산업의 경쟁력을 제고하고, 협력업체의 매출 확대, 기술 협력 등 산업생태계 전반의 경쟁력 강화에도 기여할 것으로 전망된다. 4 안건 ➌ : (주)녹십자 차세대 혈액제제 임상 R&D 및 생산설비 투자사업 (1) 의결내용 : 대출 1,700억원 ㈜녹십자 는 혈액제제, 백신, 기타제제를 개발 및 생산하고 있는 국내 제 약사이다. 동사는 충북 청주(오창)에 차세대 혈액제제 * 개발 및 글로벌 시장 진출 확대를 목표로 미국 임상 R&D 및 생산설비 구축 을 위해 총 투자비 2,100억원을 투입할 계획이며 1,700억원을 첨단전략산업 기금이 지원 한다. * 피하주사형 면역글로불린(IG)으로, 면역결핍증, 자가면역질환 등에 사용되는 혈액제제 (2) 투자결정의 의의 : 국내 혈액제제 생산기업 글로벌 시장 진출 확대 지원 글로벌 면역글로불린(IG) 시장 은 혈장 확보 역량, 혈액제제 관련 임상 경험 , 고농도 제형 기술 등 고도의 R&D 경험 및 생산 노하우가 필요한 특성으로 진입 장벽이 높아 , CSL(호주), Takeda(일본), Grifols(스페인) 3사가 과점하는 시장이다 . 최근 IG 치료제는 정맥주사 제형(IVIG) 중심에서 자가 투여가 가능하고 부작용이 낮은 피하주사 제형(SCIG)의 글로벌 수요가 점차 증가 하고 있다 . 이번 투자는 글로벌 시장에서 후발주자라 할 수 있는 동사가 차세대 혈액제제 시장 진출 확대를 위한 발판을 마련 하려는 의의가 있다. 동사는 국내 최초로 혈액제제 개발부터 생산 전 공정을 해외 의존 없이 독자 기술로 내재화하는 등 높은 기술 및 생산 자립도를 기반으로 향후 글로벌 혈액제제 시장에서 점유율을 확대 할 것으로 기대된다. 아울러 동사는 혈액제제 생산 시설 구축을 충북 청주시(오창공장)에서 진행할 예정으로 지역 내 일자리 창출에 기여하고, 권역 내 인력 교류·산학협력 등 확대를 통해 지역 경제 활성화에 기여 할 수 있을 것으로 기대된다. 5 안건 ➍ : 하나마이크론(주) 시스템반도체 테스트 공장 구축사업 (1) 의결내용 : 대출 500억원 하나마이크론(주)는 삼성전자, SK하이닉스 등 글로벌 종합 반도체 회사에 대해 반도체 후공정 (OSAT * ) 서비스를 제공하는 기업이다. 동사는 시스템 반도체(삼성전자 엑시노스 2700 등 온디바이스 AI용 모바일 AP ** ) 테스트 공장 구축을 위해 700억원을 투입하며 이중 첨단전략산업기금이 500억원을 지원한다 * O utsourced S emi-conductor A ssembly and T est : 반도체 칩을 패키징하고 성능 및 품질을 테스트하는 후공정 작업을 수행하는 전문 기업 ** A pplication P rocessor : CPU, GPU 등 여러 기능을 하나의 칩에 통합한 시스템 반도체로 스마트폰 등의 전자기기에서 명령, 해석, 연산, 제어 등 두뇌 역할을 담당 (2) 투자결정의 의의 최근 시스템 반도체 전공정 미세화의 한계로 후공정 (첨단 패키징/신뢰성 테스트) 이 칩 성능을 결정하는 파운드리 경쟁력의 핵심인프라로 부각 되고 있다. 대만은 TSMC를 중심으로 글로벌 1위 OSAT 기업(ASE)을 포함한 후공정 생태계를 체계적으로 구축하고 비메모리 반도체 종합강국 (파운드리 1위, OSAT 1위) 으로 도약한 데에 반해, 국내 시스템 반도체 및 후공정 생태계는 아직 취약한 상태 이다. 본건 지원은 우리나라의 첨단 반도체 후공정 역량을 강화 하고, 삼성전자, S K하이닉스 및 시스템 반도체 기업들에 대한 후공정 분야 협력을 통해 국내 반도체 밸류체인의 경쟁력 강화 에 기여할 것으로 기대된다.", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "유가증권시장 매도사이드카(프로그램매매 매도호가 효력정지) 발동", "department": "", "date": "2026-10-30", "url": "https://open.krx.co.kr/contents/OPN/05/05000000/OPN05000000.jsp#fe3647848b826aa1ddee224c4b5526f4=1&view=261015861", "summary": "첨부 참조", "essential": true, "importanceReasons": ["price rules / circuit breakers (+3)", "market-operations source (+1)"], "market": true, "tier": "essential"}, {"source": "MOFE", "title": "'26.9월 국세수입 동향", "department": "조세추계과", "date": "2026.10.30.", "url": "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079808&menuNo=4010100", "summary": "", "essential": false, "importanceReasons": ["statistics / advice (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "한국의 풀뿌리 금융,  미소금융이 다시 한번 도약합니다. - 미소금융 재원 기부 협약식 개최", "department": "서민금융과", "date": "2026-10-30", "url": "https://www.fsc.go.kr/no010101/88029", "summary": "한국의 풀뿌리 금융, 미소금융이 다시 한번 도약합니다. - 미소금융 재원 기부 협약식 개최 -  금융위원회-서민금융진흥원 -7 개 기업 및 금융기관과 총 8,000억 원의 「 미소금융 재원 기부 협약 」 등 체결 - ’ 26년 삼성 (2,000억) , NH농협금융· 신한금융 및 우리·KB국민 ·하나·IBK기업 은행 (각 1,000억, 총 6,000억) 등 8,000억 원 미소금융 재원 마련 - 이어, NH농협금융지주 「미소금융 사업 참여 협약」 체결 , 연내 NH미소금융재단 (가칭) 을 설립하고 농촌 금융취약계층을 중심으로 미소금융 공급  미소금융 재단별 운영계획 과 특화상품 출시계획 보고 및 현장 애로 사항·제도개선 방안 관련 간담회 진행 - 재단별로 대출 성실 상환시 자산형성 지원, 청년 라이더 특화 저금리 대출, 영농자금 대출 등 취약계층을 위한 특색있는 상품 출시 예정 - ‘ 풀뿌리 금융’으로서 미소금융의 정체성 확립을 위한 전달체계 와 현장 역량 강화 강조, 향후 미소금융 협의체 신설을 통한 주기적 현안점검 1 개 요 2026.10.30.(금) 금융위원회는 서민금융진흥원에서 「미소금융 재원 기부 협약식」을 개최하였다. 이번 협약식엔 올해 미소금융 사업 참여와 재원 기부를 밝힌 NH농협금융지주, 삼성생명, 신한 은행 , 우리은행 , KB국민은행, 하나 은행, IBK기업은행 등이 참석하였다. ▪ (일시) ’26.10 .30.(금) 10:00~11:15 ▪ (장소) 서민금융진흥원 본사 3층 (그랜드센트럴 오디토리움) ▪ (참석) (정부·유관기관) 금융위원장, 서민금융진흥원장 (신용회복위원장 겸임) (기업) 삼성생명 (금융) NH농협금융지주, 신한은행, 우리은행, KB국민은행, 하나은행, IBK기업은행 2 주요 내용 (1) 미소금융 재원 기부 협약식 이날 「 미소금융 재원 기부 협약식 」은 삼성(2,000억), NH농협금융 (1,000억), 신한금융 * (1,000억), 우리은행(1,000억), KB국민은행(1,000억) , 하나 은행(1,000억), IBK기업은행(1,000억) 의 총 8,000억 원 미소 금융 재원 기부 를 위해 진행되었다. 해당 기업 및 금융기관은 각 미소금융재단에 향후 최대 5년간 해당 재원을 분할하여 출연할 예정이다. * ’26년 3월 협약 체결 완료 이 중 실제로 신한금융지주 는 지난 6월, 400억 원을 재원으로 이미 출연 하여 재단을 통해 미소금융 을 공급 중이다. 이외에도 ’26년 중 NH농협금융 지주 는 534억 원, 삼성·KB국민은행 은 각 400억 원 , 하나은행·IBK기업은행 은 각 200억 원 을 재단에 납입 예정이며, 우리은행 은 ’27년부터 재원을 기부할 예정이다. 이어, NH농협금융지주 의 미소금융재단 설립 에 따른 ‘ 미소금융 사업 참여 협약 ’ 이 진행되었다. NH농협금융지주는 지난 7월 ｢제6차 포용적 금융 대전환 회의 겸 지역금융 간담회｣ 에서 포용금융 확대와 금융의 사회적 책임·공적역할 이행을 위해 NH미소금융재단 (가칭) 설립을 밝힌 바 있다. 연내 설립될 NH미소금융재단 (가칭) 은 NH농협금융 5개 계열사가 마련한 기부금 1,000억 원 을 재원으로 전국 8개 지점을 순차적으로 개설하고, ’27년 1분기부터 농촌 지역 금융취약계층 을 중심으로 미소금융을 공급할 예정이다. (2) 미소금융 재단별 운영계획 보고 2009년 도입되어 특별한 제도개선 없이 운영되어 온 미소금융은 그간 건전성 위주의 경직적·소극적 운영으로 근본 취지가 희석되고 있다는 우려가 있었다. 이에 금융위원회는 금년 3월 제3차 ｢ 포용적 금융 대전환 ｣ 회의를 통해 미소 금융의 운영상황을 점검하고 개선방안을 발표한 바 있다. 이후 미소금융재단은 발표된 제도개선방안의 달성을 위해, 마련된 민간부문의 재원을 통해 미소금융의 총 공급 규모를 적극적으로 확대 (’26년 4,000억 원, ’27년 5,000억 원, ’28년 6,000억 원)해나갈 계획을 밝혔다. 당시 개선 방안을 통해 그간 표준화된 상품 을 공급해왔던 미소금융 재단들은 올해부터 재단별 노하우 와 강점 을 살린 특화 상품 의 출시가 가능해졌다. 서민금융진흥원 과 각 미소금융 재단 들은 미소금융 이용자가 다양한 자활 지원을 받을 수 있도록 창의적인 특화상품 개발 에 박차를 가할 예정이다. 신한 미소금융재단은 청년대출 성실상환자 대상 ‘ 자산 형성 지원금 ’ 제공 프로 그램을 2분기부터 운영하여 총 444명에게 8천만 원의 지원금을 지급 했다. 또한 KB 미소금융재단은 저신용·저소득 청년 배달 플랫폼 종사자에게 배달용 이륜차 구입자금을 지원하는 ‘ KB 청년 라이더 희망 대출 (가칭) ’을 11월 출시할 예정이며, 이외 신설되는 NH 를 포함한 다수 미소재단에서도 서민금융의 테스트 베드로서 특화상품을 출시를 검토하고 있다. ※ 신한미소금융재단 ‘자산 형성 지원금’ - (개요) 성실한 상환을 통해 금융 신용을 쌓고, 지원금을 통해 청년들의 자립 지원 - (지원대상) ’ 26.4.1 이후 신한미소를 통해 '청년운영자금대출' 또는 ‘청년미래이음자금대출'을 받은 고객 중 현재 원리금분할상환금을 연체 없이 성실하게 상환중인 자 - (지원내용) 회차(분기)별 최대 30만원(고객별 최대 300만원, 총 10회차) * 분기말(3,6,9,12월말)을 기준일로 연체가 없을 경우 다음달 10일에 지급(1,4,7,10월의 10일) ※ KB미소금융재단 ‘KB 청년 라이더 희망 대출 (가칭) ’ * ’26.11월 출시 예정 - (개요) 신용이력 부족 청년의 사회 초기정착 지원을 위한 배달용 이륜차 구입자금 지원 - (지원대상) 청년 배달 플랫폼 종사자 (만 19세이상 39세 이하) - (지원내용) 최대 500만원 이내 (배달용 이륜차 구입가 이내) - (대출금리) 연 2.5~4.5% 수준 * 친환경 이륜차(전기 오토바이·자전거 등) 구입자 1.5%p 금리 우대 * 금감원, 서금원 등 금융교육 이수자 0.5%p 금리 우대 ※ NH미소금융재단 (신규) 특화상품 * ’27년 중 공급 개시 예정 - (개요) 저신용 귀농인·청년농의 영농 창업·정착 자금 지원 - (상품계획) ‘NH 영농창업자금 (가칭) ’ 및 ‘NH 영농운영자금 (가칭) ’ - (지원내용) 농지·시설 임차보증금, 초기 농자재·농기계 구입 및 종자·비료·인건비 등 향후 금융위원회는 ‘ 풀뿌리 금융 ’으로서 미소금융의 취지를 살리기 위해, 미소금융재단 운영 방향 을 논의 할 계획이다. 참석한 재단 관계자들은 대면·관계형 심사 에 미소금융의 강점이 있음을 언급하며, 기존 신용평가만으로 포착 하기 어려운 차주의 자활가능성 을 발굴하기 위한 전달체계 의 확충 노력 과 경영진의 지속적 관심 을 약속했다. 한편, 금년도에는 NH미소금융재단 의 신규 설립으로 미소 사업수행기관 이 39개 로 확대되며, ’26.9월 기준 168개 인 미소금융 지점 은 ’27년 중 180여 개 로 단계적 확대가 진행될 예정이다. (3) 서민금융진흥원의 미소금융 제도개선 방안 관계기관은 현장 애로사항으로 공급 규모 확대 에 따른 상담·심사 및 업무 증가와 직원 업무부담 의 증가 를 언급했다. 기존 자영업자 대상 상품 (최대 7천만원) 보다 한도 가 작은 상품군 (ex. 500만원) 의 영향으로 취급 건수가 대폭 증가하였으며, 이를 극복하기 위한 재단 등 미소금융 사업 수행기관 의 업무 효율성 및 지원 역량 강화 필요성 을 강조 했다. 이에 서민금융진흥원에서는 ’27년 공급 목표인 5,000억원 달성 을 추진하기 위하여, ➊ 전달체계 확충, ➋ 업무 효율화, ➌ 상품 개발 및 공급 활성화 측면에서 개선 방안을 제안했다. 사업수행기관과 지점의 확대를 통한 공급 활성화, 상담·약정 프로세스 개선 및 업무교육 확대 등 현장 업무지원 강화를 위한 방안을 시행할 것을 현장에 있는 미소재단 관계자들에게 설명했다. 또한 각 재단의 상품 개발 시 신속한 전산 연계 와 시스템 개발 등 재단별 특화상품 개발을 위한 지원 에 적극적 으로 임할 것을 약속했다. 3 향후 계획 이억원 금융위원장 은 “미소금융은 신뢰와 관계 라는 사회적 자본을 담보로 한 대한민국의 대안적 금융모델 ”이라며 “2009년 오롯이 기업과 은행의 기부출연금 으로 출범하여, 어려울 때 서로 돕는 우리 민족의 환난상휼 (患難相恤) 정신을 금융 부문에서 가장 잘 구현하고 있는 것이 바로 미소금융 ”이라고 밝혔다. 이어 “미소금융 공급규모를 연간 3천억 원 수준에서 ’28년까지 최대 6천억 원으로 확대하는 데, 이를 단순한 구호에 그치지 않게 한 것은 기업과 금융권의 출연 덕 이다.”라고 감사를 표했다. 아울러, “앞으로도 풀뿌리 금융 으로서 미소금융의 정체성 을 더욱 확고히 다지기 위해서는, 재원 외에도 보다 세심한 전달체계 와 현장의 역할 이 무엇 보다도 중요 하다.”고 당부하며 “특히 경영진 의 꾸준한 관심 과 지원 이 필요하다. 이를 위해 정부·서금원·미소재단 협의체 (금융위 부위원장 주재) 를 구성하여 정기적 으로 미소금융 현안을 점검하고, 재단별 우수사례 ·노하우를 공유하는 등 논의를 이어 나가겠다.”고 밝혔 다. 김은경 서민금융진흥원장 (신용회복위원장 겸임) 은 “서민의 든든한 버팀목이 되고자 귀한 뜻을 모아주신 각 기부 기관에게 감사드린다”며, “미소금융을 통해 청년·영세 자영업자·금융취약계층의 자금애로를 완화할 수 있도록 적극적으로 뒷받침하겠다”고 밝혔다. ※ 붙임1. 이억원 금융위원장 모두발언", "essential": false, "importanceReasons": ["event / ceremony (-2)"], "market": false, "tier": "routine"}, {"source": "FSC", "title": "제9회 ‘회계의 날’ 기념식 및 회계업계 간담회 개최", "department": "회계제도팀", "date": "2026-10-30", "url": "https://www.fsc.go.kr/no010101/88031", "summary": "제9회 ‘회계의 날’ 기념식 및 회계업계 간담회 개최 - 금융위원회 는 법정기념일인 ‘ 회계의 날 ’ 기념식을 열고, 회계투명성 제고에 기여한 유공자 총 145명 에게 포상·표창 - 이억원 금융위원장 은 기념식 에 앞서, ‘ 회계업계 간담회’ 를 개최하여, 공인회계사 선발인원 결정 등 ‘ 주요 회계정책 동향 ’ 공유 및 업계 의견 청취 회계의 날 기념식 금융위원회 는 ’26.10.30.(금) 「 제9회 회계의 날 」 기념식 을 개최 하였다. 회계의 날 은 ｢ 외부감사법 ｣에 따른 법정기념일 로, 회계투명성 의 가치 와 중요성 을 널리 알리고 회계분야 종사자들 의 활동 을 장려 하기 위하여 지정되었다. \u003c 제9회 회계의 날 기념식 개요 > ▪ 일시/장소 : ’26.10.30.(금) 13:30~15:00 / 서울 롯데호텔 크리스탈볼룸(2F) ▪ 참 석 자 : 이억원 금융위원장, 박민우 증권선물위원회 상임위원, 민병덕 ·조정훈·최은석 국회의원, 최운열 한국공인회계사회 회장, 곽병진 한국회계기준원 원장, 윤정숙 금융감독원 전문심의위원 등 동 행사에서는 회계투명성 제고 유공자 등 총 145명 이 포상·표창 을 받았다. 훈장 은 대구지방공인회계사회 이진복 前회장 ( 1명 ) , 포장 은 서울대학교 백복현 교수 ( 1명 ) , 대통령 표창 은 신한은행 이응채 회계부장 등 3명 , 국무총리 표창 은 청년공인회계사회 황병찬 회장 등 5명 이 수상하였다. 그 외에도 국회의장 공로장 (1명) , 감사원장 표창 (5명) , 경제부총리 겸 재정경제부장관 표창 (15명) , 행정안전부 장관 표창 (4명) , 금융위원장 표창 (19명) , 국세청장 표창 (20명) , 금융감독원장 표창 (12명) , 한국공인회계사회 회장 표창 (59인) 이 각각 수여되었다. 이억원 위원장 은 기념사 를 통해 수상자들을 포함한 회계업계 관계자 들의 노고 에 감사 를 표하며, “ 회계투명성 은 기업이 지켜야 할 단순한 규범을 넘어, 우리 경제 의 도약 과 국가 경쟁력 을 견인하는 핵심 인프라 ”임을 강조하였다. 아울러, ▲ 회계기본법 제정 , ▲ 공정한 회계감리·제재 체계 확립 , ▲ 감사투입시간 급감 기업 에 대한 심사·감리 강화 , ▲ 미래 회계 전문인력 의 성장 기반 마련 등의 회계정책 을 일 보분석원 (원장: 이형주, 이하 ‘FIU’) 은 금일 오전 디지털자산거래소 공동협의체 (이하 ‘DAXA’) 가 수사의뢰한 불법 가상자산 취급업자 (특금법상 미신고 가상자산사업자) 3건 (이지스벤처스, 테더맥스, 슈퍼트러스트) 중 2건 * 에 대해 방송미디어통신심의위원회 (이하 ‘방미심위’) 에 인터넷 사이트, 휴대폰 앱의 국내 접속차단 ** (이용해지 포함) 을 요청 했다고 밝혔다. * 이지스벤처스는 미신고 가상자산업을 위한 웹사이트, 모바일 앱이 없어 접속차단 불요 ** 서버나 운영자가 국내에 있는지에 따라 이용해지(국내) 또는 접속차단(해외) 조치를 부과 현행 특금법에 따르면, 신고하지 않고 가상 자산 사업을 영위하는 경우 불법 가상자산 취급업자로서 형사처벌 대상 * 이 된다. 또한, 국외 사업자 일지라도 내국인 을 대상으로 영업하는 경우에는 특금법 이 동일하게 적용 된다. 아울러, 신고된 가상자산사업자는 미신고 사업자 와 거래 를 중단 하여야 한다. * 미신고 불법 영업행위에 대해서는 5년 이하의 징역 또는 5천만원 이하의 벌금 부과 불법 가상자산 취급업자는 관련 법령에 따른 규율․감독을 받지 않아 자금 세탁 에 악용 될 우려가 있고, 보안 및 이용자 보호장치 미비로 인한 해킹․투자사기 * 등으로 인해 금전적 피해 가 발생하더라도 구제가 어렵다. * ‘26.6월 DAXA, 신고 사업자 합동 집중조사 결과, 적발 업체의 평균거래수수료는 1.5~10%로 국내 5대 원화거래소 평균(0.16%) 대비 최대 62배 수준으로 조사 이번 수사의뢰 및 접속차단 * 요청은 불법 가상자산 취급업자의 국내 영업 행위 에 대한 대응 을 강화 하고, 국내 이용자의 불법 영업사이트 접근 을 제한 하기 위한 조치이다. * 다만, 실제 접속차단은 방미심위의 관련 절차에 따라 결정될 예정 앞으로도 방미심위, DAXA 등 유관기관과 긴밀히 공조 하여 불법 가상 자산 취급업자 적발 을 강화 하고, 신규 적발 업체 및 대체 사이트에 대한 신속한 심의요청 , 신고 사업자 명단 및 수사기관 통보 불법업체 명단의 공개 ·안내 강화 등 자금세탁행위 방지 및 이용자 보호 를 위해 필요한 조치를 적극 추진해 나갈 계획이다. 아울러, 가상자산 이용자들은 거래에 앞서 해당 사업자의 신고 여부 를 확인 하고, 불법 가상자산 취급업자 (특금법상 미신고 가상자산사업자) 이용에 따른 피해 가 발생하지 않도록 각별히 유의 할 필요가 있다. \u003c 이용자 유의사항 > 이용자는 자신이 이용하는 가상자산사업자가 특금법에 따라 적법하게 신고된 사업자인지 여부를 반드시 확인해야 합니다. 현재 FIU에 적법하게 신고된 가상 자산사업자는 총 28개 * 로, 이 외에 국내에서 가상자산 거래를 영업 으로 하는 업체는 모두 불법 입니다. * 신고된 사업자 명단은 FIU 홈페이지(www.kofiu.go.kr)를 통해서 확인 가능 ‘고수익 ‧ 원금 보장’, ‘비공개 정보’, ‘글로벌 상장’ 등 허위 ‧ 과장 광고 는 사기가능성 을 의심해야 하며, 레퍼럴 ‧ 추천링크 를 통한 가입 ‧ 알선 행위에 가담하지 않도록 유의해야 합니다. 레퍼럴(추천) 행위 는 단순 광고를 넘어 미신고 영업을 조력 한 행위로 평가될 수 있어, 추천자도 형사처벌 대상 이 될 여지가 있습니다. 미신고 사업자로 확인되면 즉시 본인 소유의 가상자산 ‧ 예치금을 인출 하고, 개인키, 로그인 정보, 신분증 사본 등을 미신고 사업자에게 제공하지 않도록 주의해야 합니다. 만약 불법 가상자산 취급행위가 의심되는 경우에는 경찰(☎112) , FIU (infiu@korea.kr), DAXA (jebo@kdaxa.org) 등에 제보가 가능하며, 형사소송법 제234조에 따라 직접 수사 기관에 고발하는 것도 가능 합니다. [붙임] 불법 가상자산 취급업자 수사의뢰 명단", "essential": false, "importanceReasons": [], "market": true, "tier": "routine"}, {"source": "KRX_OPEN2", "title": "래블업㈜ 코스닥시장 신규상장", "department": ""
